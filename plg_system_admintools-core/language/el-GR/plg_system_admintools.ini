PLG_ADMINTOOLS_HEADING_AUTO_IMPORT="Αυτόματη Εισαγωγή Ρυθμίσεων («Sync Server»)"

PLG_ADMINTOOLS_ERR_BLOCKEDEMAILDOMAINS="Ο τομέας ηλεκτρονικού ταχυδρομείου %s δεν επιτρέπεται"
PLG_ADMINTOOLS_ERR_BLOCKEDUSERNAME="Το όνομα χρήστη '%s' είναι δεσμευμένο και δεν μπορεί να χρησιμοποιηθεί για αυτο-εγγραφή λογαριασμού χρήστη. Παρακαλώ επιλέξτε διαφορετικό όνομα χρήστη."
PLG_ADMINTOOLS_ERR_LEAKEDPWD="Η χρήση μη ασφαλούς κωδικού πρόσβασης δεν επιτρέπεται. Ο κωδικός πρόσβασης <strong>%s</strong> είναι πολύ αδύναμος καθώς περιλαμβάνεται στα λεξικά των επιτιθέμενων."

PLG_ADMINTOOLS_LBL_CACHEEXPIRE="Ενεργοποίηση Αυτόματης Λήξης Κρυφής Μνήμης"
PLG_ADMINTOOLS_LBL_CACHEEXPIRE_DESC="Περιοδική διαγραφή των ληγμένων στοιχείων κρυφής μνήμης. Σε αντίθεση με την εκκαθάριση κρυφής μνήμης, δεν θα αφαιρέσει ολόκληρη την κρυφή μνήμη, αλλά μόνο τα στοιχεία που έχουν λήξει.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_LBL_CACHECLEANER="Ενεργοποίηση Εκκαθαριστή Κρυφής Μνήμης"
PLG_ADMINTOOLS_LBL_CACHECLEANER_DESC="Περιοδική εκκαθάριση (πλήρης αδειασμός) της κρυφής μνήμης, ανεξάρτητα από το εάν τα στοιχεία έχουν λήξει ή όχι.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ="Εκτέλεση κάθε X λεπτά"
PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ_DESC="Η λήξη κρυφής μνήμης θα εκτελείται κάθε X λεπτά"

PLG_ADMINTOOLS_LBL_CACHE_FREQ="Εκτέλεση κάθε X λεπτά"
PLG_ADMINTOOLS_LBL_CACHE_FREQ_DESC="Ο εκκαθαριστής κρυφής μνήμης θα εκτελείται κάθε X λεπτά"

PLG_ADMINTOOLS_LBL_CLEANTEMP="Ενεργοποίηση Εκκαθάρισης Προσωρινού Καταλόγου"
PLG_ADMINTOOLS_LBL_CLEANTEMP_DESC="Περιοδική διαγραφή όλων των περιεχομένων του προσωρινού καταλόγου του ιστότοπου.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ="Εκτέλεση κάθε X λεπτά"
PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ_DESC="Η εκκαθάριση του προσωρινού καταλόγου θα εκτελείται κάθε X λεπτά"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE="Διαγραφή ανενεργών χρηστών"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DESC="Αυτόματη αφαίρεση χρηστών που έχουν εγγραφεί αλλά δεν έχουν συνδεθεί ποτέ στον ιστότοπο μετά από συγκεκριμένο χρονικό διάστημα<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NONE="Ποτέ"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BLOCKED="Μόνο εάν ενεργοποίησαν τον λογαριασμό τους, αλλά δεν έχουν συνδεθεί ποτέ"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NOTACTIVATED="Μόνο εάν δεν έχουν ενεργοποιήσει τον λογαριασμό τους"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BOTH="Ενεργοποιημένοι ή όχι, αρκεί να μην έχουν συνδεθεί"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS="Διαγραφή μετά από τόσες ημέρες"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS_DESC="Πόσες ημέρες μετά την εγγραφή του χρήστη πρέπει να τον αφαιρέσουμε εάν δεν έχει ακόμα συνδεθεί στον ιστότοπο;"

PLG_ADMINTOOLS_LBL_OVERRIDE="Γλώσσα email"
PLG_ADMINTOOLS_LBL_OVERRIDE_DESC="Το email που στέλνει το Admin Tools στους Υπέρ-Χρήστες όταν αποκλείεται ένα αίτημα θα είναι στη γλώσσα του τρέχοντος χρήστη στο frontend. Σε πολύγλωσσους ιστότοπους αυτό μπορεί να δημιουργεί σύγχυση. Μπορείτε να αναγκάσετε τα email να αποστέλλονται σε συγκεκριμένη γλώσσα ανεξάρτητα από την τρέχουσα γλώσσα του ιστότοπου επιλέγοντας μια συγκεκριμένη γλώσσα εδώ."

PLG_ADMINTOOLS_LBL_MAXLOGENTRIES="Μέγιστος αριθμός καταχωρήσεων αρχείου καταγραφής αποκλεισμένων αιτημάτων"
PLG_ADMINTOOLS_LBL_MAXLOGENTRIES_DESC="Καθορίστε τον μέγιστο αριθμό καταχωρήσεων που θα διατηρούνται στο αρχείο καταγραφής αποκλεισμένων αιτημάτων. Οι πλεονάζουσες εγγραφές θα διαγραφούν. Χρησιμοποιήστε 0 για να απενεργοποιήσετε αυτή τη λειτουργία και να διατηρήσετε όλες τις καταχωρήσεις αρχείου καταγραφής αποκλεισμένων αιτημάτων. Σημείωση: εάν έχετε χιλιάδες παλιές καταχωρήσεις, θα χρειαστεί λίγος χρόνος για να τις αφαιρέσει το Admin Tools. Οι παλιές εγγραφές διαγράφονται σε δέσμες 10.000 εγγραφών σε κάθε φόρτωση σελίδας για λόγους απόδοσης.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_LBL_SESCLEANER="Ενεργοποίηση Εκκαθαριστή Συνεδριών"
PLG_ADMINTOOLS_LBL_SESCLEANER_DESC="Περιοδικό άδειασμα του πίνακα μεταδεδομένων συνεδριών.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT="Ενεργοποίηση Βελτιστοποιητή Συνεδριών"
PLG_ADMINTOOLS_LBL_SESOPT_DESC="Περιοδικός έλεγχος και, εάν είναι απαραίτητο, επιδιόρθωση και βελτιστοποίηση του πίνακα μεταδεδομένων συνεδριών.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT_FREQ="Εκτέλεση κάθε X λεπτά"
PLG_ADMINTOOLS_LBL_SESOPT_FREQ_DESC="Ο βελτιστοποιητής συνεδριών θα εκτελείται κάθε X λεπτά"

PLG_ADMINTOOLS_LBL_SES_FREQ="Εκτέλεση κάθε X λεπτά"
PLG_ADMINTOOLS_LBL_SES_FREQ_DESC="Ο εκκαθαριστής συνεδριών θα εκτελείται κάθε X λεπτά"

PLG_ADMINTOOLS_LBL_RESCUEURL="URL Διάσωσης"
PLG_ADMINTOOLS_LBL_RESCUEURL_DESC="Όταν αυτή η λειτουργία είναι ενεργοποιημένη, μπορείτε να επισκεφθείτε το http://www.example.com/administrator/index.php?admintools_rescue=your_email@example.com (όπου http://www.example.com είναι η διεύθυνση του ιστότοπού σας και your_email@example.com είναι η ηλεκτρονική διεύθυνση του Υπέρ-Χρήστη σας) όταν είστε αποκλεισμένοι για να λάβετε ένα email με οδηγίες για την προσωρινή απενεργοποίηση του Admin Tools, επιτρέποντάς σας να ανακτήσετε πρόσβαση στον ιστότοπό σας. Αυτή η λειτουργία ισχύει μόνο για το διαχειριστικό backend του ιστότοπού σας και θα σας στείλει email μόνο εάν η διεύθυνση IP από την οποία αποκτάτε πρόσβαση είναι αποκλεισμένη από το Admin Tools. Δεν θα απενεργοποιήσει τον Κύριο Κωδικό Πρόσβασης ή οποιαδήποτε λειτουργία που υλοποιείται με αρχεία ρυθμίσεων διακομιστή, όπως ο Κωδικός Πρόσβασης Καταλόγου Διαχειριστή, ο Δημιουργός .htaccess ή η Κατάσταση Έκτακτης Ανάγκης Εκτός Σύνδεσης."

PLG_ADMINTOOLS_LBL_RESCUEURL_SENTMSG="Ελέγξτε το email σας για πληροφορίες σχετικά με το URL Διάσωσης"
PLG_ADMINTOOLS_LBL_RESCUEURL_ERR_INVALIDADDRESS="Όχι, λυπάμαι, η ηλεκτρονική διεύθυνση του Υπέρ-Χρήστη σας ΔΕΝ είναι %s. Παρακαλώ δοκιμάστε ξανά, αντικαθιστώντας το %1$s με την ηλεκτρονική διεύθυνση που έχετε ορίσει στον λογαριασμό Υπέρ-Χρήστη του ιστότοπού σας."

PLG_ADMINTOOLS_LBL_RESCUEDURATION="Διάρκεια διάσωσης (λεπτά)"
PLG_ADMINTOOLS_LBL_RESCUEDURATION_DESC="Το χρονικό διάστημα σε λεπτά κατά το οποίο η κατάσταση διάσωσης, που ενεργοποιείται ακολουθώντας τις οδηγίες που σας αποστέλλονται μέσω email επισκεπτόμενοι το URL Διάσωσης, θα είναι ενεργή. Στο τέλος αυτής της χρονικής περιόδου το Admin Tools θα επαναλάβει την κανονική λειτουργία. Προεπιλογή: 15 λεπτά."

PLG_ADMINTOOLS_LBL_AUTOIMPORTURL="URL αυτόματης εισαγωγής"
PLG_ADMINTOOLS_LBL_AUTOIMPORTURL_DESC="Εξαγάγετε τις ρυθμίσεις σας με τη λειτουργία Εξαγωγής του Admin Tools. Ανεβάστε το εξαγόμενο αρχείο JSON σε μια τοποθεσία όπου είναι δημόσια προσβάσιμο στο διαδίκτυο. Εισαγάγετε το URL αυτού του αρχείου JSON σε όλους τους άλλους ιστότοπούς σας για να γίνεται περιοδική λήψη και εισαγωγή του αρχείου JSON. Είναι ισοδύναμο με το να κατεβάζετε το αρχείο από αυτό το URL και να το εισάγετε με τη λειτουργία Εισαγωγής &amp; Εξαγωγής του Admin Tools. Αυτή η λειτουργία σας επιτρέπει ουσιαστικά να «συγχρονίζετε» τη ρύθμιση παραμέτρων πολλών εγκαταστάσεων Admin Tools σε διαφορετικούς ιστότοπους.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ="Συχνότητα αυτόματης εισαγωγής (ώρες)"
PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ_DESC="Πόσο συχνά (σε ώρες) πρέπει να προσπαθεί το Admin Tools να κατεβάζει και να εισάγει το αρχείο JSON από το παραπάνω URL.<br/><strong>Αυτή η επιλογή έχει καταργηθεί και θα αφαιρεθεί στο Admin Tools 8.0. Παρακαλώ χρησιμοποιήστε Προγραμματισμένες Εργασίες στο Joomla! 4.1 και νεότερες εκδόσεις.</strong>"

PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_FIELDSET_LABEL="Έλεγχος ταυτότητας με κωδικό πρόσβασης"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_LABEL="Να επιτρέπεται ο έλεγχος ταυτότητας με κωδικό πρόσβασης όταν έχει ρυθμιστεί το WebAuthn"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_DESC="Αυτό ισχύει μόνο εάν ενεργοποιήσετε τον έλεγχο ταυτότητας χωρίς κωδικό πρόσβασης με WebAuthn στον λογαριασμό σας παρακάτω. Σε αυτή την περίπτωση, θα θέλατε επίσης να μπορείτε να συνδέεστε στον ιστότοπο με το όνομα χρήστη και τον κωδικό πρόσβασής σας; Συνιστάται να ορίσετε αυτό σε Όχι καθώς ο κωδικός πρόσβασής σας είναι λιγότερο ασφαλής από το WebAuthn· θα πρέπει να χρησιμοποιείτε το WebAuthn για να συνδέεστε σε αυτόν τον ιστότοπο. Ίσως θέλετε να το ορίσετε προσωρινά σε Ναι για να μπορείτε να συνδεθείτε στον ιστότοπο από νέα συσκευή με τον κωδικό σας για να ρυθμίσετε τη σύνδεση WebAuthn με τον ενσωματωμένο authenticator της (π.χ. FaceID/TouchID, Windows Hello, σαρωτής δακτυλικού αποτυπώματος Android ή παρόμοιο). Στη συνέχεια μπορείτε να επαναφέρετε αυτή την επιλογή σε Όχι."

PLG_ADMINTOOLS_HEADING_NOTICES="Ειδοποιήσεις"

PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE="Ειδοποίηση σχετικά με το Email κατά το Αποκλεισμό Αιτήματος"
PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE_DESC="Εμφανίζει μια ειδοποίηση όταν το πεδίο Email κατά το Αποκλεισμό Αιτήματος στη σελίδα Ρύθμισης Παραμέτρων WAF δεν είναι κενό, υπενθυμίζοντάς σας να το απενεργοποιήσετε σε έναν ιστότοπο παραγωγής."

PLG_ADMINTOOLS_LBL_EBRNOTICE_HEAD="Θα αποστέλλονται email κάθε φορά που το Admin Tools αποκλείει ένα αίτημα"
PLG_ADMINTOOLS_LBL_EBRNOTICE_MESSAGE="Αυτό προορίζεται μόνο ως προσωρινή λειτουργία αντιμετώπισης προβλημάτων. Η ενεργοποίησή του σε ιστότοπο παραγωγής μπορεί να κατακλύσει τα εισερχόμενά σας με περιττά μηνύματα email."
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NOEMAIL="Απενεργοποίηση email"
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NONOTICE="Απόκρυψη αυτού του μηνύματος"

PLG_ADMINTOOLS_LBL_DLFNOTICE_HEAD="Το Admin Tools διατηρεί αρχείο καταγραφής εντοπισμού σφαλμάτων για τα αποκλεισμένα αιτήματα"
PLG_ADMINTOOLS_LBL_DLFNOTICE_MESSAGE="Το αρχείο καταγραφής εντοπισμού σφαλμάτων προορίζεται μόνο για την αντιμετώπιση προβλημάτων. Καταγράφει λεπτομερώς κάθε αποκλεισμένο αίτημα, συμπεριλαμβανομένων τυχόν δεδομένων φορμών που υποβλήθηκαν, σε μη κρυπτογραφημένο αρχείο στον διακομιστή σας, επομένως μπορεί να περιέχει προσωπικές ή ευαίσθητες πληροφορίες. Απενεργοποιήστε το μόλις ολοκληρώσετε την αντιμετώπιση προβλημάτων."
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE="Απενεργοποίηση"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE_DELETE="Απενεργοποίηση και διαγραφή αρχείων καταγραφής"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_HIDE="Απόκρυψη αυτού του μηνύματος"
