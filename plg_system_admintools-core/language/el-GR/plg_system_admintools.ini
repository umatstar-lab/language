PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE="<strong>Υπενθύμιση</strong>: Σας επιτράπηκε η πρόσβαση στη σελίδα σύνδεσης του διαχειριστικού τμήματος χωρίς να παράσχετε απευθείας τη Μυστική Παράμετρο URL Διαχειριστή, επειδή έχετε συνδεθεί προηγουμένως σε αυτόν τον ιστότοπο με αυτό το πρόγραμμα περιήγησης."
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_NONSUPERUSER="<p>Εάν βλέπετε συχνά αυτό το μήνυμα ενώ χρησιμοποιείτε το διαχειριστικό περιβάλλον του ιστότοπου, κάντε τα εξής:</p><ul><li>Να εργάζεστε πάντα σε μια σελίδα διαχειριστή κάθε φορά</li><li>Αποσυνδεθείτε από το διαχειριστικό τμήμα όταν δεν πρόκειται να το χρησιμοποιήσετε για τα επόμενα λίγα λεπτά</li><li>Αποκτάτε πάντα πρόσβαση στη σελίδα σύνδεσης του διαχειριστικού περιβάλλοντος χρησιμοποιώντας το URL που σας δόθηκε (μοιάζει με <code>%s</code>)</li><ul>"
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_SUPERUSER="<p>Εάν εσείς ή άλλοι χρήστες του ιστότοπού σας βλέπετε συχνά αυτό το μήνυμα κατά τη χρήση του διαχειριστικού τμήματος, ίσως θελήσετε να</p><ul><li>αυξήσετε τη Διάρκεια Συνεδρίας στις Γενικές Ρυθμίσεις του ιστότοπού σας</li><li>υπενθυμίσετε στους χρήστες να εργάζονται πάντα σε μια σελίδα διαχειριστή κάθε φορά</li><li>υπενθυμίσετε στους χρήστες να χρησιμοποιούν τη λειτουργία Αποσύνδεσης του Joomla! όταν δεν πρόκειται να χρησιμοποιήσουν το διαχειριστικό περιβάλλον για τα επόμενα λίγα λεπτά</li><li>υπενθυμίσετε στους χρήστες να αποκτούν πάντα πρόσβαση στον ιστότοπο χρησιμοποιώντας το URL σύνδεσης που περιλαμβάνει τη Μυστική Παράμετρο URL Διαχειριστή όπως εξηγείται στην τεκμηρίωση του Admin Tools (μοιάζει με <code>%s</code>)</li></ul><p>Μπορείτε να ενεργοποιήσετε/απενεργοποιήσετε αυτή τη λειτουργία ή/και να αποκρύψετε αυτό το μήνυμα από τα Συστατικά, Admin Tools, Web Application Firewall, Ρύθμιση Παραμέτρων WAF.</p>"

PLG_ADMINTOOLS_MSG_BLOCKED="Αυτό το αίτημα αποκλείστηκε από το Admin Tools. Παρακαλώ αλλάξτε αυτό το μήνυμα στις επιλογές του συστατικού. {RESCUEINFO}"
PLG_ADMINTOOLS_MSG_BLOCKED_RESCUEINFO="Εάν είστε ο διαχειριστής αυτού του ιστότοπου και έχετε αποκλείσει κατά λάθος τη δική σας διεύθυνση IP, επισκεφθείτε το {RESCUE_TRIGGER_URL}%1$s όπου %1$s είναι η ηλεκτρονική διεύθυνση του λογαριασμού σας (Υπέρ-Χρήστη). Αυτό το URL θα σας στείλει μόνο ένα email εάν η διεύθυνση IP από την οποία αποκτάτε πρόσβαση είναι αποκλεισμένη από το Admin Tools. Εάν δεν είστε αποκλεισμένοι, δεν θα σταλεί email· δεν χρειάζεστε email με οδηγίες για την κατάργηση αποκλεισμού της IP σας εάν η IP σας δεν είναι αποκλεισμένη."
PLG_ADMINTOOLS_MSG_DISABLEPWDRESET="Η αυτοεξυπηρέτηση επαναφοράς κωδικού πρόσβασης για τον λογαριασμό χρήστη σας έχει απενεργοποιηθεί για λόγους ασφαλείας. Παρακαλώ επικοινωνήστε με έναν διαχειριστή ιστότοπου για βοήθεια με την ανάκτηση κωδικού πρόσβασης."

PLG_ADMINTOOLS_HEADING_RESCUE_MODE="Κατάσταση Διάσωσης"
PLG_ADMINTOOLS_HEADING_BLOCKED_REQUESTS="Αναφορά Αποκλεισμένων Αιτημάτων"
