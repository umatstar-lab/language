PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE="<strong>Recordatorio</strong>: Se le ha permitido acceder a la página de inicio de sesión del backend sin proporcionar el Parámetro secreto de URL de administrador directamente porque anteriormente inició sesión en este sitio con este navegador."
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_NONSUPERUSER="<p>Si ve este mensaje con frecuencia mientras usa la interfaz de administrador del sitio, haga lo siguiente:</p><ul><li>Trabaje siempre en una página de administrador a la vez</li><li>Cierre sesión en la sección de administrador cuando no vaya a usarla durante los próximos minutos</li><li>Acceda siempre a la página de inicio de sesión de la interfaz de administrador usando la URL que se le proporcionó (similar a <code>%s</code>)</li><ul>"
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_SUPERUSER="<p>Si usted u otros usuarios de su sitio ven este mensaje con frecuencia al usar el backend del sitio, puede que quiera</p><ul><li>aumentar la duración de la sesión en la Configuración global del sitio</li><li>recordar a los usuarios que siempre trabajen en una página de administrador a la vez</li><li>recordar a los usuarios que usen la función de Cerrar sesión de Joomla! cuando no vayan a usar la interfaz de administrador durante los próximos minutos</li><li>recordar a los usuarios que siempre accedan al sitio usando la URL de inicio de sesión que incluye el Parámetro secreto de URL de administrador, tal como se explica en la documentación de Admin Tools (similar a <code>%s</code>)</li></ul><p>Puede activar o desactivar esta función y/u ocultar este mensaje en Componentes, Admin Tools, Cortafuegos de aplicaciones web, Configurar WAF.</p>"

PLG_ADMINTOOLS_MSG_BLOCKED="Esta solicitud ha sido bloqueada por Admin Tools. Por favor, cambie este mensaje en las opciones del componente. {RESCUEINFO}"
PLG_ADMINTOOLS_MSG_BLOCKED_RESCUEINFO="Si usted es el administrador de este sitio y ha bloqueado accidentalmente su propia dirección IP, visite {RESCUE_TRIGGER_URL}%1$s donde %1$s es la dirección de correo electrónico de su cuenta (Superusuario). Esta URL solo le enviará un correo electrónico si la dirección IP desde la que accede está siendo bloqueada por Admin Tools. Si no está bloqueado, no se enviará ningún correo electrónico; no necesita un correo electrónico con instrucciones para desbloquear su IP si su IP no está bloqueada."
PLG_ADMINTOOLS_MSG_DISABLEPWDRESET="El restablecimiento de contraseña de autoservicio para su cuenta de usuario ha sido deshabilitado por razones de seguridad. Por favor, contacte con un administrador del sitio para que le ayude con la recuperación de contraseña."

PLG_ADMINTOOLS_HEADING_RESCUE_MODE="Modo de rescate"
PLG_ADMINTOOLS_HEADING_BLOCKED_REQUESTS="Informe de solicitudes bloqueadas"
PLG_ADMINTOOLS_HEADING_SCHEDULED_MAINTENANCE="Mantenimiento programado"
PLG_ADMINTOOLS_HEADING_AUTO_IMPORT="Importación automática de configuración («Servidor de sincronización»)"

PLG_ADMINTOOLS_ERR_BLOCKEDEMAILDOMAINS="El dominio de correo electrónico %s no está permitido"
PLG_ADMINTOOLS_ERR_BLOCKEDUSERNAME="El nombre de usuario '%s' está reservado y no puede usarse para el autoregistro de una cuenta de usuario. Por favor, elija un nombre de usuario diferente."
PLG_ADMINTOOLS_ERR_LEAKEDPWD="No se permite el uso de contraseñas inseguras. La contraseña <strong>%s</strong> es muy débil ya que está incluida en los diccionarios de los atacantes."

PLG_ADMINTOOLS_LBL_CACHEEXPIRE="Habilitar expiración automática de caché"
PLG_ADMINTOOLS_LBL_CACHEEXPIRE_DESC="Elimina periódicamente los elementos de caché expirados. A diferencia de la purga de caché, no eliminará toda la caché, sino solo los elementos que hayan expirado.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_LBL_CACHECLEANER="Habilitar Limpiador de caché"
PLG_ADMINTOOLS_LBL_CACHECLEANER_DESC="Purga (vacía completamente) la caché periódicamente, independientemente de si sus elementos han expirado o no.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ="Ejecutar cada X minutos"
PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ_DESC="La expiración de caché se ejecutará cada X minutos"

PLG_ADMINTOOLS_LBL_CACHE_FREQ="Ejecutar cada X minutos"
PLG_ADMINTOOLS_LBL_CACHE_FREQ_DESC="El limpiador de caché se ejecutará cada X minutos"

PLG_ADMINTOOLS_LBL_CLEANTEMP="Habilitar limpieza del directorio temporal"
PLG_ADMINTOOLS_LBL_CLEANTEMP_DESC="Elimina periódicamente todos los contenidos del directorio temporal del sitio.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ="Ejecutar cada X minutos"
PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ_DESC="La limpieza del directorio temporal se ejecutará cada X minutos"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE="Eliminar usuarios inactivos"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DESC="Elimina automáticamente los usuarios que se han registrado pero nunca han iniciado sesión en el sitio después de un período de tiempo específico<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NONE="Nunca"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BLOCKED="Solo si se activaron, pero nunca iniciaron sesión"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NOTACTIVATED="Solo si no han activado su cuenta"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BOTH="Activados o no, siempre que no hayan iniciado sesión"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS="Eliminar después de este número de días"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS_DESC="¿Cuántos días después del registro del usuario debemos eliminarlo si todavía no ha iniciado sesión en el sitio?"

PLG_ADMINTOOLS_LBL_OVERRIDE="Idioma del correo electrónico"
PLG_ADMINTOOLS_LBL_OVERRIDE_DESC="El correo electrónico que Admin Tools envía a los Superusuarios cuando se bloquea una solicitud estará en el idioma frontend del usuario actual. En sitios multilingüe, esto puede crear confusión. Puede forzar el envío de correos electrónicos en un idioma específico independientemente del idioma actual que esté usando el sitio eligiendo un idioma específico aquí."

PLG_ADMINTOOLS_LBL_MAXLOGENTRIES="Número máximo de entradas en el registro de solicitudes bloqueadas"
PLG_ADMINTOOLS_LBL_MAXLOGENTRIES_DESC="Especifique el número máximo de entradas a conservar en el registro de solicitudes bloqueadas. Los registros en exceso serán eliminados. Use 0 para desactivar esta función y conservar todas las entradas del registro de solicitudes bloqueadas. Nota: si tiene miles de entradas antiguas, Admin Tools tardará un tiempo en eliminar todas las entradas antiguas. Los registros antiguos se eliminan en lotes de 10.000 registros en cada carga de página por razones de rendimiento.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_LBL_SESCLEANER="Habilitar Limpiador de sesiones"
PLG_ADMINTOOLS_LBL_SESCLEANER_DESC="Vacía periódicamente la tabla de metadatos de sesión.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT="Habilitar Optimizador de sesiones"
PLG_ADMINTOOLS_LBL_SESOPT_DESC="Comprueba periódicamente y, si es necesario, repara y optimiza la tabla de metadatos de sesión.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT_FREQ="Ejecutar cada X minutos"
PLG_ADMINTOOLS_LBL_SESOPT_FREQ_DESC="El optimizador de sesiones se ejecutará cada X minutos"

PLG_ADMINTOOLS_LBL_SES_FREQ="Ejecutar cada X minutos"
PLG_ADMINTOOLS_LBL_SES_FREQ_DESC="El limpiador de sesiones se ejecutará cada X minutos"

PLG_ADMINTOOLS_LBL_RESCUEURL="URL de rescate"
PLG_ADMINTOOLS_LBL_RESCUEURL_DESC="Cuando esta función está habilitada, puede visitar http://www.example.com/administrator/index.php?admintools_rescue=su_email@example.com (donde http://www.example.com es la dirección de su sitio y su_email@example.com es la dirección de correo electrónico de su Superusuario) cuando esté bloqueado para recibir un correo electrónico con instrucciones para deshabilitar temporalmente Admin Tools, permitiéndole recuperar el acceso a su sitio. Esta función solo se aplica al backend de administrador de su sitio y solo le enviará un correo electrónico si la dirección IP desde la que accede está bloqueada por Admin Tools. No deshabilitará la Contraseña principal ni ninguna función que esté implementada con archivos de configuración del lado del servidor, como la Protección con contraseña del directorio de administrador, el Generador de .htaccess o el Modo sin conexión de emergencia."

PLG_ADMINTOOLS_LBL_RESCUEURL_SENTMSG="Revise su correo electrónico para obtener información sobre la URL de rescate"
PLG_ADMINTOOLS_LBL_RESCUEURL_ERR_INVALIDADDRESS="Lo sentimos, la dirección de correo electrónico de su Superusuario NO es %s. Por favor, inténtelo de nuevo, reemplazando %1$s con la dirección de correo electrónico que ha configurado en la cuenta de Superusuario de su sitio."

PLG_ADMINTOOLS_LBL_RESCUEDURATION="Duración del rescate (minutos)"
PLG_ADMINTOOLS_LBL_RESCUEDURATION_DESC="La cantidad de tiempo en minutos que estará activo el modo de rescate, activado siguiendo las instrucciones enviadas por correo electrónico al visitar la URL de rescate. Al final de ese período de tiempo, Admin Tools reanudará el funcionamiento normal. Por defecto: 15 minutos."

PLG_ADMINTOOLS_LBL_AUTOIMPORTURL="URL de importación automática"
PLG_ADMINTOOLS_LBL_AUTOIMPORTURL_DESC="Exporte su configuración con la función de exportación de Admin Tools. Suba el archivo JSON exportado a una ubicación donde sea accesible públicamente en la web. Introduzca la URL de ese archivo JSON en todos sus otros sitios para descargar e importar periódicamente ese archivo JSON. Es equivalente a descargar el archivo desde esa URL e importarlo con la función Importar &amp; Exportar de Admin Tools. Esta función le permite esencialmente «sincronizar» la configuración de varias instalaciones de Admin Tools en diferentes sitios.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ="Frecuencia de importación automática (horas)"
PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ_DESC="Con qué frecuencia (en horas) debe Admin Tools intentar descargar e importar el archivo JSON desde la URL indicada anteriormente.<br/><strong>Esta opción está obsoleta y se eliminará en Admin Tools 8.0. Por favor, use Tareas programadas en Joomla! 4.1 y versiones posteriores.</strong>"

PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_FIELDSET_LABEL="Autenticación con contraseña"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_LABEL="Permitir autenticación con contraseña cuando WebAuthn está configurado"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_DESC="Esto solo se aplica si habilita la autenticación sin contraseña con WebAuthn en su cuenta a continuación. En ese caso, ¿le gustaría también poder iniciar sesión en el sitio con su nombre de usuario y contraseña? Se recomienda establecer esto en No ya que su contraseña es menos segura que WebAuthn; necesitará usar WebAuthn para iniciar sesión en este sitio. Puede que quiera establecer temporalmente esto en Sí para poder iniciar sesión en el sitio desde un nuevo dispositivo con su contraseña y configurar el inicio de sesión con WebAuthn usando su autenticador integrado (por ejemplo, FaceID/TouchID, Windows Hello, escáner de huellas dactilares de Android o similar). Luego puede volver a establecer esta opción en No."

PLG_ADMINTOOLS_HEADING_NOTICES="Avisos"

PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE="Aviso sobre el correo electrónico en solicitud bloqueada"
PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE_DESC="Muestra un aviso cuando el campo Correo electrónico en solicitud bloqueada en la página Configurar WAF no está vacío, recordándole que lo deshabilite en un sitio en producción."

PLG_ADMINTOOLS_LBL_EBRNOTICE_HEAD="Se enviarán correos electrónicos cada vez que Admin Tools bloquee una solicitud"
PLG_ADMINTOOLS_LBL_EBRNOTICE_MESSAGE="Esto está pensado solo como una función temporal de resolución de problemas. Dejarlo habilitado en un sitio en producción puede hacer que su bandeja de entrada se inunde con mensajes de correo electrónico innecesarios."
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NOEMAIL="Deshabilitar correos electrónicos"
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NONOTICE="Ocultar este mensaje"

PLG_ADMINTOOLS_LBL_DLFNOTICE_HEAD="Admin Tools está manteniendo un archivo de registro de depuración de las solicitudes bloqueadas"
PLG_ADMINTOOLS_LBL_DLFNOTICE_MESSAGE="El archivo de registro de depuración está pensado solo para la resolución de problemas. Registra con detalle cada solicitud bloqueada, incluidos los datos de formulario enviados, en un archivo sin cifrar en su servidor, por lo que puede contener información personal o confidencial. Desactívelo en cuanto haya terminado de resolver el problema."
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE="Desactivar"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE_DELETE="Desactivar y eliminar archivos de registro"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_HIDE="Ocultar este mensaje"
