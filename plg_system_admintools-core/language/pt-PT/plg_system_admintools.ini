PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE="<strong>Lembrete</strong>: Foi-lhe permitido o acesso à página de início de sessão do backend sem fornecer o Parâmetro Secreto de URL do Administrador diretamente, porque iniciou sessão anteriormente neste site com este browser."
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_NONSUPERUSER="<p>Se vir esta mensagem frequentemente ao utilizar a interface de administrador do site, faça o seguinte:</p><ul><li>Trabalhe sempre numa página de administrador de cada vez</li><li>Termine a sessão na secção do administrador quando não a utilizar durante os próximos minutos</li><li>Aceda sempre à página de início de sessão da interface de administrador utilizando o URL que lhe foi fornecido (tem o aspeto de <code>%s</code>)</li><ul>"
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_SUPERUSER="<p>Se você ou outros utilizadores do seu site virem esta mensagem frequentemente ao utilizar o backend do site, poderá querer</p><ul><li>aumentar a Duração da Sessão na Configuração Global do seu site</li><li>lembrar os utilizadores de trabalhar sempre numa página de administrador de cada vez</li><li>lembrar os utilizadores de utilizar a função Terminar Sessão do Joomla! quando não forem utilizar a interface de administrador durante os próximos minutos</li><li>lembrar os utilizadores de acederem sempre ao site através do URL de início de sessão que inclui o Parâmetro Secreto de URL do Administrador, conforme explicado na documentação do Admin Tools (tem o aspeto de <code>%s</code>)</li></ul><p>Pode ativar/desativar esta funcionalidade e/ou ocultar esta mensagem em Componentes, Admin Tools, Web Application Firewall, Configurar WAF.</p>"

PLG_ADMINTOOLS_MSG_BLOCKED="Este pedido foi bloqueado pelo Admin Tools. Por favor, altere esta mensagem nas opções do componente. {RESCUEINFO}"
PLG_ADMINTOOLS_MSG_BLOCKED_RESCUEINFO="Se é o administrador deste site e bloqueou acidentalmente o seu próprio endereço IP, visite {RESCUE_TRIGGER_URL}%1$s onde %1$s é o endereço de e-mail da sua conta (Super Utilizador). Este URL só lhe enviará um e-mail se o endereço IP a partir do qual está a aceder estiver a ser bloqueado pelo Admin Tools. Se não estiver bloqueado, não será enviado qualquer e-mail; não precisa de um e-mail com instruções para desbloquear o seu IP se o seu IP não estiver bloqueado."
PLG_ADMINTOOLS_MSG_DISABLEPWDRESET="Os reposições de palavra-passe self-service para a sua conta de utilizador foram desativadas por razões de segurança. Por favor, contacte um administrador do site para obter ajuda na recuperação da palavra-passe."

PLG_ADMINTOOLS_HEADING_RESCUE_MODE="Modo de Recuperação"
PLG_ADMINTOOLS_HEADING_BLOCKED_REQUESTS="Relatório de Pedidos Bloqueados"
PLG_ADMINTOOLS_HEADING_SCHEDULED_MAINTENANCE="Manutenção agendada"
PLG_ADMINTOOLS_HEADING_AUTO_IMPORT="Importação Automática de Configurações (\"Servidor de Sincronização\")"

PLG_ADMINTOOLS_ERR_BLOCKEDEMAILDOMAINS="O domínio de e-mail %s não é permitido"
PLG_ADMINTOOLS_ERR_BLOCKEDUSERNAME="O nome de utilizador '%s' está reservado e não pode ser utilizado para o registo próprio de uma conta de utilizador. Por favor, escolha um nome de utilizador diferente."
PLG_ADMINTOOLS_ERR_LEAKEDPWD="A utilização de palavra-passe insegura não é permitida. A palavra-passe <strong>%s</strong> é muito fraca, pois está incluída nos dicionários dos atacantes."

PLG_ADMINTOOLS_LBL_CACHEEXPIRE="Ativar a Expiração Automática de Cache"
PLG_ADMINTOOLS_LBL_CACHEEXPIRE_DESC="Eliminar periodicamente os itens de cache expirados. Ao contrário da purga de cache, não remove toda a cache, mas apenas os itens que expiraram.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_LBL_CACHECLEANER="Ativar a Limpeza de Cache"
PLG_ADMINTOOLS_LBL_CACHECLEANER_DESC="Purgar (esvaziar completamente) periodicamente a cache, independentemente de os seus itens terem expirado ou não.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ="Executar a cada X minutos"
PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ_DESC="A expiração de cache será executada a cada X minutos"

PLG_ADMINTOOLS_LBL_CACHE_FREQ="Executar a cada X minutos"
PLG_ADMINTOOLS_LBL_CACHE_FREQ_DESC="A limpeza de cache será executada a cada X minutos"

PLG_ADMINTOOLS_LBL_CLEANTEMP="Ativar a Limpeza do Diretório Temporário"
PLG_ADMINTOOLS_LBL_CLEANTEMP_DESC="Eliminar periodicamente todo o conteúdo do diretório temporário do site.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ="Executar a cada X minutos"
PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ_DESC="A limpeza do diretório temporário será executada a cada X minutos"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE="Eliminar utilizadores inativos"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DESC="Remover automaticamente os utilizadores que se registaram mas nunca iniciaram sessão no site após um período de tempo específico<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NONE="Nunca"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BLOCKED="Apenas se ativaram a conta, mas nunca iniciaram sessão"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NOTACTIVATED="Apenas se não ativaram a sua conta"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BOTH="Ativados ou não, desde que não tenham iniciado sessão"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS="Eliminar após este número de dias"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS_DESC="Quantos dias após o registo do utilizador deveremos removê-lo se ainda não tiver iniciado sessão no site?"

PLG_ADMINTOOLS_LBL_OVERRIDE="Idioma do e-mail"
PLG_ADMINTOOLS_LBL_OVERRIDE_DESC="O e-mail que o Admin Tools envia aos Super Utilizadores quando um pedido é bloqueado estará no idioma de front-end do utilizador atual. Em sites multilingues, isto pode causar confusão. Pode forçar o envio dos e-mails num idioma específico, independentemente do idioma atual utilizado pelo site, escolhendo um idioma específico aqui."

PLG_ADMINTOOLS_LBL_MAXLOGENTRIES="Número máximo de entradas no registo de pedidos bloqueados"
PLG_ADMINTOOLS_LBL_MAXLOGENTRIES_DESC="Especifique o número máximo de entradas a manter no registo de pedidos bloqueados. Os registos em excesso serão eliminados. Utilize 0 para desativar esta funcionalidade e manter todas as entradas do registo de pedidos bloqueados. Nota: se tiver milhares de entradas antigas, o Admin Tools demorará algum tempo a removê-las. Os registos antigos são eliminados em lotes de 10 000 registos em cada carregamento de página por razões de desempenho.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_LBL_SESCLEANER="Ativar a Limpeza de Sessões"
PLG_ADMINTOOLS_LBL_SESCLEANER_DESC="Esvaziar periodicamente a tabela de metadados de sessões.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT="Ativar o Otimizador de Sessões"
PLG_ADMINTOOLS_LBL_SESOPT_DESC="Verificar periodicamente e, se necessário, reparar e otimizar a tabela de metadados de sessões.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT_FREQ="Executar a cada X minutos"
PLG_ADMINTOOLS_LBL_SESOPT_FREQ_DESC="O otimizador de sessões será executado a cada X minutos"

PLG_ADMINTOOLS_LBL_SES_FREQ="Executar a cada X minutos"
PLG_ADMINTOOLS_LBL_SES_FREQ_DESC="A limpeza de sessões será executada a cada X minutos"

PLG_ADMINTOOLS_LBL_RESCUEURL="URL de Recuperação"
PLG_ADMINTOOLS_LBL_RESCUEURL_DESC="Quando esta funcionalidade está ativada, pode visitar http://www.example.com/administrator/index.php?admintools_rescue=o_seu_email@example.com (onde http://www.example.com é o endereço do seu site e o_seu_email@example.com é o endereço de e-mail do seu Super Utilizador) quando estiver bloqueado para receber um e-mail com instruções para desativar temporariamente o Admin Tools, permitindo-lhe recuperar o acesso ao seu site. Esta funcionalidade aplica-se apenas ao backend do administrador do seu site e só lhe enviará um e-mail se o endereço IP a partir do qual está a aceder estiver bloqueado pelo Admin Tools. Não desativará a Palavra-passe Principal nem qualquer funcionalidade implementada com ficheiros de configuração do lado do servidor, como a Proteção por Palavra-passe do Diretório do Administrador, o Gerador de .htaccess ou o Modo de Emergência Offline."

PLG_ADMINTOOLS_LBL_RESCUEURL_SENTMSG="Verifique o seu e-mail para obter informações sobre a URL de Recuperação"
PLG_ADMINTOOLS_LBL_RESCUEURL_ERR_INVALIDADDRESS="Não, o endereço de e-mail do seu Super Utilizador NÃO é %s. Por favor, tente novamente, substituindo %1$s pelo endereço de e-mail que configurou na conta de Super Utilizador do seu site."

PLG_ADMINTOOLS_LBL_RESCUEDURATION="Duração do modo de recuperação (minutos)"
PLG_ADMINTOOLS_LBL_RESCUEDURATION_DESC="O período de tempo em minutos durante o qual o modo de recuperação, ativado ao seguir as instruções enviadas por e-mail ao visitar a URL de Recuperação, estará ativo. No fim desse período, o Admin Tools retomará o funcionamento normal. Predefinição: 15 minutos."

PLG_ADMINTOOLS_LBL_AUTOIMPORTURL="URL de importação automática"
PLG_ADMINTOOLS_LBL_AUTOIMPORTURL_DESC="Exporte as suas configurações com a funcionalidade de Exportação do Admin Tools. Carregue o ficheiro JSON exportado para um local acessível publicamente na web. Introduza o URL desse ficheiro JSON em todos os seus outros sites para descarregar e importar periodicamente esse ficheiro JSON. É equivalente a descarregar o ficheiro desse URL e importá-lo com a funcionalidade de Importação &amp; Exportação do Admin Tools. Esta funcionalidade permite-lhe essencialmente \"sincronizar\" a configuração de várias instalações do Admin Tools em sites diferentes.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ="Frequência de importação automática (horas)"
PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ_DESC="Com que frequência (em horas) deve o Admin Tools tentar descarregar e importar o ficheiro JSON do URL acima.<br/><strong>Esta opção está obsoleta e será removida no Admin Tools 8.0. Por favor, utilize as Tarefas agendadas no Joomla! 4.1 e posterior.</strong>"

PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_FIELDSET_LABEL="Autenticação por palavra-passe"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_LABEL="Permitir autenticação por palavra-passe quando o WebAuthn está configurado"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_DESC="Isto aplica-se apenas se ativar a autenticação sem palavra-passe com WebAuthn na sua conta abaixo. Neste caso, pretende também poder iniciar sessão no site com o seu nome de utilizador e palavra-passe? Recomenda-se que defina esta opção como Não, uma vez que a sua palavra-passe é menos segura do que o WebAuthn; precisará de utilizar o WebAuthn para iniciar sessão neste site. Poderá querer definir temporariamente esta opção como Sim para poder iniciar sessão no site a partir de um novo dispositivo com a sua palavra-passe, a fim de configurar o início de sessão WebAuthn com o autenticador incorporado (por exemplo, FaceID/TouchID, Windows Hello, leitor de impressões digitais Android ou similar). Pode então voltar a definir esta opção como Não."

PLG_ADMINTOOLS_HEADING_NOTICES="Avisos"

PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE="Aviso sobre o E-mail em Pedido Bloqueado"
PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE_DESC="Mostra um aviso quando o campo E-mail em Pedido Bloqueado na página Configurar WAF não está vazio, lembrando-o de o desativar num site em produção."

PLG_ADMINTOOLS_LBL_EBRNOTICE_HEAD="Serão enviados e-mails sempre que o Admin Tools bloquear um pedido"
PLG_ADMINTOOLS_LBL_EBRNOTICE_MESSAGE="Esta funcionalidade destina-se apenas a uma resolução de problemas temporária. Deixá-la ativada num site em produção pode fazer com que a sua caixa de entrada fique inundada com mensagens de e-mail desnecessárias."
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NOEMAIL="Desativar e-mails"
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NONOTICE="Ocultar esta mensagem"

PLG_ADMINTOOLS_LBL_DLFNOTICE_HEAD="O Admin Tools está a manter um ficheiro de registo de depuração dos pedidos bloqueados"
PLG_ADMINTOOLS_LBL_DLFNOTICE_MESSAGE="O ficheiro de registo de depuração destina-se apenas à resolução de problemas. Regista em detalhe cada pedido bloqueado, incluindo quaisquer dados de formulário submetidos, num ficheiro não encriptado no seu servidor, pelo que pode conter informações pessoais ou sensíveis. Desative-o assim que tiver terminado a resolução do problema."
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE="Desativar"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE_DELETE="Desativar e eliminar ficheiros de registo"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_HIDE="Ocultar esta mensagem"
