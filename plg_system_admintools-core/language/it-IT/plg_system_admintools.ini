PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE="<strong>Promemoria</strong>: L'accesso alla pagina di accesso del backend ti è stato consentito senza fornire direttamente il Parametro URL segreto dell'amministratore perché in precedenza avevi effettuato l'accesso a questo sito con questo browser."
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_NONSUPERUSER="<p>Se visualizzi questo messaggio frequentemente mentre utilizzi l'interfaccia amministratore del sito, esegui le seguenti operazioni:</p><ul><li>Lavora sempre su una pagina amministratore alla volta</li><li>Disconnettiti dalla sezione amministratore quando non la utilizzerai per i prossimi minuti</li><li>Accedi sempre alla pagina di accesso dell'interfaccia amministratore utilizzando l'URL che ti è stato fornito (simile a <code>%s</code>)</li><ul>"
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_SUPERUSER="<p>Se tu o altri utenti del tuo sito visualizzate frequentemente questo messaggio quando utilizzate il backend del sito, potreste voler</p><ul><li>aumentare la durata della sessione nella configurazione globale del tuo sito</li><li>ricordare agli utenti di lavorare sempre su una pagina amministratore alla volta</li><li>ricordare agli utenti di utilizzare la funzione di disconnessione di Joomla! quando non utilizzeranno l'interfaccia amministratore per i prossimi minuti</li><li>ricordare agli utenti di accedere sempre al sito utilizzando l'URL di accesso che include il Parametro URL segreto dell'amministratore come spiegato nella documentazione di Admin Tools (simile a <code>%s</code>)</li></ul><p>Puoi attivare o disattivare questa funzione e/o nascondere questo messaggio in Componenti, Admin Tools, Web Application Firewall, Configura WAF.</p>"

PLG_ADMINTOOLS_MSG_BLOCKED="Questa richiesta è bloccata da Admin Tools. Modifica questo messaggio nelle opzioni del componente. {RESCUEINFO}"
PLG_ADMINTOOLS_MSG_BLOCKED_RESCUEINFO="Se sei l'amministratore di questo sito e hai bloccato accidentalmente il tuo indirizzo IP, visita {RESCUE_TRIGGER_URL}%1$s dove %1$s è l'indirizzo e-mail del tuo account (Super utente). Questo URL ti invierà un'e-mail solo se l'indirizzo IP da cui stai accedendo è bloccato da Admin Tools. Se non sei bloccato non verrà inviata alcuna e-mail; non hai bisogno di un'e-mail con istruzioni per sbloccare il tuo IP se il tuo IP non è bloccato."
PLG_ADMINTOOLS_MSG_DISABLEPWDRESET="Il ripristino autonomo della password per il tuo account utente è stato disabilitato per motivi di sicurezza. Contatta un amministratore del sito per assistenza nel recupero della password."

PLG_ADMINTOOLS_HEADING_RESCUE_MODE="Modalità di recupero"
PLG_ADMINTOOLS_HEADING_BLOCKED_REQUESTS="Segnalazione richieste bloccate"
PLG_ADMINTOOLS_HEADING_SCHEDULED_MAINTENANCE="Manutenzione pianificata"
PLG_ADMINTOOLS_HEADING_AUTO_IMPORT="Importazione automatica impostazioni (\"Server di sincronizzazione\")"

PLG_ADMINTOOLS_ERR_BLOCKEDEMAILDOMAINS="Il dominio e-mail %s non è consentito"
PLG_ADMINTOOLS_ERR_BLOCKEDUSERNAME="Il nome utente '%s' è riservato e non può essere utilizzato per la registrazione autonoma di un account utente. Scegli un nome utente diverso."
PLG_ADMINTOOLS_ERR_LEAKEDPWD="L'uso di una password non sicura non è consentito. La password <strong>%s</strong> è molto debole in quanto è inclusa nei dizionari degli aggressori."

PLG_ADMINTOOLS_LBL_CACHEEXPIRE="Abilita scadenza automatica della cache"
PLG_ADMINTOOLS_LBL_CACHEEXPIRE_DESC="Elimina periodicamente gli elementi della cache scaduti. A differenza dell'eliminazione totale della cache, non rimuove l'intera cache, ma solo gli elementi scaduti.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_LBL_CACHECLEANER="Abilita Pulizia cache"
PLG_ADMINTOOLS_LBL_CACHECLEANER_DESC="Elimina periodicamente (svuota completamente) la cache, indipendentemente dal fatto che i suoi elementi siano scaduti o meno.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ="Esegui ogni X minuti"
PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ_DESC="La scadenza della cache verrà eseguita ogni X minuti"

PLG_ADMINTOOLS_LBL_CACHE_FREQ="Esegui ogni X minuti"
PLG_ADMINTOOLS_LBL_CACHE_FREQ_DESC="La pulizia della cache verrà eseguita ogni X minuti"

PLG_ADMINTOOLS_LBL_CLEANTEMP="Abilita Pulizia directory temporanea"
PLG_ADMINTOOLS_LBL_CLEANTEMP_DESC="Elimina periodicamente tutti i contenuti della directory temporanea del sito.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ="Esegui ogni X minuti"
PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ_DESC="La pulizia della directory temporanea verrà eseguita ogni X minuti"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE="Elimina utenti inattivi"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DESC="Rimuovi automaticamente gli utenti che si sono registrati ma non hanno mai effettuato l'accesso al sito dopo un determinato periodo di tempo<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NONE="Mai"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BLOCKED="Solo se hanno attivato l'account, ma non hanno mai effettuato l'accesso"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NOTACTIVATED="Solo se non hanno attivato il loro account"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BOTH="Attivato o meno, purché non abbiano effettuato l'accesso"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS="Elimina dopo questo numero di giorni"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS_DESC="Quanti giorni dopo la registrazione dell'utente dobbiamo rimuoverlo se non ha ancora effettuato l'accesso al sito?"

PLG_ADMINTOOLS_LBL_OVERRIDE="Lingua e-mail"
PLG_ADMINTOOLS_LBL_OVERRIDE_DESC="L'e-mail che Admin Tools invia ai Super utenti quando una richiesta viene bloccata sarà nella lingua front-end dell'utente corrente. Nei siti multilingue questo può creare confusione. Puoi forzare l'invio delle e-mail in una lingua specifica indipendentemente dalla lingua corrente del sito scegliendo una lingua specifica qui."

PLG_ADMINTOOLS_LBL_MAXLOGENTRIES="Numero massimo di voci nel registro delle richieste bloccate"
PLG_ADMINTOOLS_LBL_MAXLOGENTRIES_DESC="Specifica il numero massimo di voci da mantenere nel registro delle richieste bloccate. I record in eccesso verranno eliminati. Usa 0 per disattivare questa funzione e mantenere tutte le voci del registro delle richieste bloccate. Nota: se hai migliaia di voci vecchie, Admin Tools impiegherà un po' di tempo per rimuoverle tutte. I record vecchi vengono eliminati in blocchi da 10.000 record ad ogni caricamento di pagina per motivi di prestazioni.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_LBL_SESCLEANER="Abilita Pulizia sessioni"
PLG_ADMINTOOLS_LBL_SESCLEANER_DESC="Svuota periodicamente la tabella dei metadati di sessione.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT="Abilita Ottimizzatore sessioni"
PLG_ADMINTOOLS_LBL_SESOPT_DESC="Controlla periodicamente e, se necessario, ripara e ottimizza la tabella dei metadati di sessione.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT_FREQ="Esegui ogni X minuti"
PLG_ADMINTOOLS_LBL_SESOPT_FREQ_DESC="L'ottimizzatore di sessioni verrà eseguito ogni X minuti"

PLG_ADMINTOOLS_LBL_SES_FREQ="Esegui ogni X minuti"
PLG_ADMINTOOLS_LBL_SES_FREQ_DESC="La pulizia delle sessioni verrà eseguita ogni X minuti"

PLG_ADMINTOOLS_LBL_RESCUEURL="URL di recupero"
PLG_ADMINTOOLS_LBL_RESCUEURL_DESC="Quando questa funzione è abilitata puoi visitare http://www.example.com/administrator/index.php?admintools_rescue=your_email@example.com (dove http://www.example.com è l'indirizzo del tuo sito e your_email@example.com è l'indirizzo e-mail del tuo Super utente) quando sei bloccato per ricevere un'e-mail con le istruzioni per disabilitare temporaneamente Admin Tools, consentendoti di riottenere l'accesso al tuo sito. Questa funzione si applica solo al backend amministratore del tuo sito e ti invierà un'e-mail solo se l'indirizzo IP da cui stai accedendo è bloccato da Admin Tools. Non disabiliterà la Password principale né alcuna funzione implementata con file di configurazione lato server come la Protezione con password della directory amministratore, il Generatore di .htaccess o la Modalità offline di emergenza."

PLG_ADMINTOOLS_LBL_RESCUEURL_SENTMSG="Controlla la tua e-mail per le informazioni sull'URL di recupero"
PLG_ADMINTOOLS_LBL_RESCUEURL_ERR_INVALIDADDRESS="No, spiacente, l'indirizzo e-mail del tuo Super utente NON è %s. Riprova, sostituendo %1$s con l'indirizzo e-mail impostato nel tuo account Super utente del sito."

PLG_ADMINTOOLS_LBL_RESCUEDURATION="Durata del recupero (minuti)"
PLG_ADMINTOOLS_LBL_RESCUEDURATION_DESC="La quantità di tempo in minuti durante la quale la modalità di recupero, attivata seguendo le istruzioni inviate per e-mail visitando l'URL di recupero, sarà attiva. Al termine di quel periodo Admin Tools riprenderà il normale funzionamento. Predefinito: 15 minuti."

PLG_ADMINTOOLS_LBL_AUTOIMPORTURL="URL di importazione automatica"
PLG_ADMINTOOLS_LBL_AUTOIMPORTURL_DESC="Esporta le tue impostazioni con la funzione di esportazione di Admin Tools. Carica il file JSON esportato in una posizione accessibile pubblicamente sul web. Inserisci l'URL di quel file JSON in tutti gli altri tuoi siti per scaricare e importare periodicamente quel file JSON. Equivale a scaricare il file da quell'URL e importarlo con la funzione Importa &amp; Esporta di Admin Tools. Questa funzione ti consente essenzialmente di \"sincronizzare\" la configurazione di diverse installazioni di Admin Tools su siti diversi.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ="Frequenza di importazione automatica (ore)"
PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ_DESC="Con quale frequenza (in ore) Admin Tools deve provare a scaricare e importare il file JSON dall'URL sopra indicato.<br/><strong>Questa opzione è obsoleta e verrà rimossa in Admin Tools 8.0. Utilizza le Attività pianificate su Joomla 4.1 e versioni successive.</strong>"

PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_FIELDSET_LABEL="Autenticazione con password"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_LABEL="Consenti autenticazione con password quando WebAuthn è configurato"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_DESC="Questo si applica solo se abiliti l'autenticazione senza password con WebAuthn sul tuo account qui sotto. In questo caso, vorresti anche poter accedere al sito con il tuo nome utente e password? Si consiglia di impostare questa opzione su No poiché la tua password è meno sicura di WebAuthn; dovrai utilizzare WebAuthn per accedere a questo sito. Potresti voler impostare temporaneamente questa opzione su Sì per poter accedere al sito da un nuovo dispositivo con la tua password per configurare l'accesso WebAuthn con il suo autenticatore integrato (ad es. FaceID/TouchID, Windows Hello, scanner di impronte digitali Android o simili). Puoi quindi reimpostare questa opzione su No."

PLG_ADMINTOOLS_HEADING_NOTICES="Avvisi"

PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE="Avviso sull'e-mail per richieste bloccate"
PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE_DESC="Mostra un avviso quando il campo E-mail per richiesta bloccata nella pagina Configura WAF non è vuoto, ricordandoti di disabilitarlo su un sito in produzione."

PLG_ADMINTOOLS_LBL_EBRNOTICE_HEAD="Verranno inviate e-mail ogni volta che Admin Tools blocca una richiesta"
PLG_ADMINTOOLS_LBL_EBRNOTICE_MESSAGE="Questa è concepita solo come funzione temporanea per la risoluzione dei problemi. Lasciarla abilitata su un sito in produzione può causare l'inondazione della tua casella di posta con messaggi e-mail non necessari."
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NOEMAIL="Disabilita e-mail"
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NONOTICE="Nascondi questo messaggio"

PLG_ADMINTOOLS_LBL_DLFNOTICE_HEAD="Admin Tools sta mantenendo un file di log di debug delle richieste bloccate"
PLG_ADMINTOOLS_LBL_DLFNOTICE_MESSAGE="Il file di log di debug è pensato solo per la risoluzione dei problemi. Registra in dettaglio ogni richiesta bloccata, inclusi eventuali dati dei moduli inviati, in un file non crittografato sul tuo server, quindi può contenere informazioni personali o sensibili. Disattivalo non appena hai finito di risolvere il problema."
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE="Disattiva"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE_DELETE="Disattiva ed elimina i file di log"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_HIDE="Nascondi questo messaggio"
