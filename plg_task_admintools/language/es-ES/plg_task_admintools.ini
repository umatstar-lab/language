[PHPFileChangeScanner]
PLG_TASK_ADMINTOOLS_TASK_SCAN_TITLE="Admin Tools – Escáner de cambios en archivos PHP"
PLG_TASK_ADMINTOOLS_TASK_SCAN_DESC="Analice su sitio en busca de archivos PHP modificados y sospechosos con el Escáner de cambios en archivos PHP de Admin Tools."

PLG_TASK_ADMINTOOLS_LBL_NOTE01="Las anulaciones del tiempo máximo de ejecución están sujetas a las siguientes limitaciones: i. No pueden ser superiores al tiempo máximo de ejecución de PHP de su servidor. ii. No pueden ser superiores al tiempo de espera de tarea especificado en las opciones de Tareas programadas. iii. No pueden ser superiores a 3600 segundos para CLI y 100 segundos para la web. Los valores fuera de estos límites se establecerán al valor mínimo entre todos estos límites."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_LABEL="Tiempo máximo de ejecución (CLI)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_DESC="Anule el tiempo máximo de ejecución para cada paso del análisis cuando la tarea programada se ejecute a través de un trabajo CRON de CLI (el comando CLI <code>scheduler:run</code>). Establézcalo en 0 para utilizar en su lugar el tiempo máximo de ejecución ya configurado en el Escáner de cambios en archivos PHP."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_LABEL="Tiempo máximo de ejecución (web)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_DESC="Anule el tiempo máximo de ejecución para cada paso del análisis cuando la tarea programada se ejecute a través de la web (ya sea una URL conocida como «Web Cron» o el método de «Programación diferida»). Establézcalo en 0 para utilizar en su lugar el tiempo máximo de ejecución ya configurado en el Escáner de cambios en archivos PHP."

[RemoveOldLogEntries]
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_TITLE="Admin Tools – Limpieza del registro de solicitudes bloqueadas"
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_DESC="Elimina las entradas antiguas del registro de solicitudes bloqueadas."

PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_LABEL="Número máximo de entradas del registro a conservar"
PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_DESC="Al ejecutar esta tarea se conservarán las últimas entradas del registro en la cantidad indicada y se eliminarán el resto."

[SessionOptimizer]
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_TITLE="Admin Tools – Reparación y optimización de la tabla de sesiones"
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_DESC="Repara y optimiza la tabla de base de datos de sesiones <code>#__session</code> (metadatos de sesión) de Joomla!, previniendo problemas de acceso al sitio en sitios con tráfico moderado o muy elevado."

[SessionCleaner]
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_TITLE="Admin Tools – Limpieza de metadatos de sesión"
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_DESC="Elimina los metadatos de sesión obsoletos, suprimiendo los registros obsoletos de la tabla de base de datos <code>#__session</code>."

[CacheCleaner]
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TITLE="Admin Tools – Limpieza de caché"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_DESC="Vacía la caché de Joomla!. Elija si desea vaciar toda la caché o solo los elementos caducados."

PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE="Tipo de limpieza"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_DESC="Elija cómo limpiar la caché de Joomla!. «Solo caducados» elimina únicamente los elementos caducados. «Eliminar todo» elimina todos los elementos en caché. <strong>Nota importante</strong>: Esta tarea simplemente indica al componente de caché de Joomla! que realice el trabajo. Si los elementos de caché se eliminan o no depende de su almacenamiento de caché y del funcionamiento de Joomla! en sí. Si no puede eliminar los elementos caducados o todos los elementos en caché desde la página de gestión de caché de Joomla! (es decir, el componente de caché de Joomla!), esta tarea tampoco podrá hacer nada en absoluto."
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_CLEAN="Eliminar todo"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_EXPIRE="Solo caducados"

[TempDirCleaner]
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_TITLE="Admin Tools – Limpieza del directorio temporal"
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_DESC="Elimina el contenido del directorio temporal que tenga más de 1 minuto de antigüedad."
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_TITLE="Admin Tools – Eliminar archivos obsoletos del núcleo"
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_DESC="Borra los archivos y carpetas de Joomla! que una actualización de Joomla debería haber eliminado, pero no eliminó. Los archivos del núcleo que quedan atrás pueden inutilizar por completo su sitio, así que merece la pena comprobarlo con regularidad."

[DeleteInactiveUsers]
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TITLE="Admin Tools – Eliminar usuarios inactivos"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DESC="Elimina las cuentas de usuario que están inactivas (puede elegir los criterios)."

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE="Eliminar usuarios inactivos"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE_DESC="Elimina automáticamente los usuarios que se han registrado pero que nunca han iniciado sesión en el sitio después de un número específico de tiempo."
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BLOCKED="Solo si se activaron pero nunca iniciaron sesión"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_NOTACTIVATED="Solo si no han activado su cuenta"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BOTH="Activados o no, siempre que no hayan iniciado sesión"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS="Eliminar transcurridos estos días"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS_DESC="¿Cuántos días después del registro del usuario debemos eliminarlo si aún no ha iniciado sesión en el sitio?"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS="Limitar a grupos de usuarios"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS_DESC="Elimina solo los usuarios inactivos que pertenezcan al menos a uno de los grupos seleccionados. Déjelo vacío para eliminar usuarios inactivos independientemente de su pertenencia a grupos. Advertencia: no seleccione grupos de administradores o Superusuarios a menos que tenga la certeza de que no se eliminarán cuentas de administrador legítimas."

[AutoImport]
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_TITLE="Admin Tools – Importación automática de configuración"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_DESC="Importa automáticamente los ajustes de configuración de Admin Tools desde una URL"

PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL="URL de importación automática"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL_DESC="Exporte su configuración con la función de exportación de Admin Tools. Suba el archivo JSON exportado a una ubicación de acceso público en la web. Introduzca la URL de ese archivo JSON en todos sus otros sitios para descargar e importar periódicamente dicho archivo JSON. Es equivalente a descargar el archivo desde esa URL e importarlo con la función de importación y exportación de Admin Tools. Esta función le permite esencialmente «sincronizar» la configuración de varias instalaciones de Admin Tools en distintos sitios."

[ResetJoomlaUpdate]
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_TITLE="Admin Tools – Restablecer actualización de Joomla!"
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_DESC="Restablece la actualización de Joomla! a los valores predeterminados de fábrica"

[CrawlerIPs]
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_TITLE="Admin Tools – Actualizar listas de IP de rastreadores"
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_DESC="Descarga las listas de IP publicadas de todos los rastreadores cuyo ajuste en Configurar WAF no sea «Ignorar», de modo que los visitantes nunca tengan que esperar una descarga. No hace nada a menos que «Usar listas de IP de rastreadores» esté activado en Configurar WAF."
