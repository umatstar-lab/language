[PHPFileChangeScanner]
PLG_TASK_ADMINTOOLS_TASK_SCAN_TITLE="Admin Tools – Scanner delle modifiche ai file PHP"
PLG_TASK_ADMINTOOLS_TASK_SCAN_DESC="Esegui la scansione del tuo sito alla ricerca di file PHP modificati e sospetti con lo Scanner delle modifiche ai file PHP di Admin Tools."

PLG_TASK_ADMINTOOLS_LBL_NOTE01="Le sostituzioni per il tempo massimo di esecuzione sono soggette alle seguenti limitazioni: i. Non possono essere superiori al tempo massimo di esecuzione PHP del tuo server. ii. Non possono essere superiori al Timeout attività specificato nelle opzioni delle Attività pianificate. iii. Non possono essere superiori a 3600 secondi per CLI e 100 secondi per il web. I valori al di fuori di questi limiti verranno impostati al valore minimo tra tutti questi limiti."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_LABEL="Tempo massimo di esecuzione (CLI)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_DESC="Sostituisci il tempo massimo di esecuzione per ogni fase di scansione quando l'Attività pianificata viene eseguita tramite un cron job CLI (il comando CLI <code>scheduler:run</code>). Imposta a 0 per utilizzare invece il tempo massimo di esecuzione già configurato nello Scanner delle modifiche ai file PHP."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_LABEL="Tempo massimo di esecuzione (web)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_DESC="Sostituisci il tempo massimo di esecuzione per ogni fase di scansione quando l'Attività pianificata viene eseguita tramite il web (sia tramite un URL a.k.a. \"Web Cron\" che tramite il metodo \"Lazy Scheduling\"). Imposta a 0 per utilizzare invece il tempo massimo di esecuzione già configurato nello Scanner delle modifiche ai file PHP."

[RemoveOldLogEntries]
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_TITLE="Admin Tools – Pulizia del Registro delle richieste bloccate"
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_DESC="Rimuovi le voci vecchie dal Registro delle richieste bloccate."

PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_LABEL="Numero massimo di voci del registro da conservare"
PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_DESC="L'esecuzione di questa attività manterrà questo numero delle ultime voci del registro ed eliminerà le restanti."

[SessionOptimizer]
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_TITLE="Admin Tools – Ripara e ottimizza la tabella delle sessioni"
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_DESC="Ripara e ottimizza la tabella del database <code>#__session</code> (metadati di sessione) di Joomla!, prevenendo problemi di accesso al sito su siti da moderatamente a molto trafficati."

[SessionCleaner]
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_TITLE="Admin Tools – Pulizia dei metadati di sessione"
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_DESC="Rimuove i metadati di sessione obsoleti, eliminando i record non più necessari dalla tabella del database <code>#__session</code>."

[CacheCleaner]
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TITLE="Admin Tools – Pulizia cache"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_DESC="Svuota la cache di Joomla!. Scegli se svuotare l'intera cache o solo gli elementi scaduti."

PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE="Tipo di pulizia"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_DESC="Scegli come pulire la cache di Joomla!. \"Solo scaduti\" rimuove solo gli elementi scaduti. \"Elimina tutto\" rimuove tutti gli elementi memorizzati nella cache. <strong>Nota importante</strong>: questa attività dice semplicemente al componente Cache di Joomla! di eseguire il lavoro. La rimozione degli elementi dalla cache dipende dal tuo archivio di cache e dal funzionamento di Joomla! stesso. Se non riesci a rimuovere gli elementi scaduti o tutti gli elementi dalla pagina di gestione della cache di Joomla! (ovvero il componente Cache di Joomla!), questa attività non sarà in grado di fare nulla."
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_CLEAN="Elimina tutto"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_EXPIRE="Solo scaduti"

[TempDirCleaner]
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_TITLE="Admin Tools – Pulizia della directory temporanea"
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_DESC="Elimina il contenuto della directory temporanea che ha più di 1 minuto."
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_TITLE="Admin Tools – Rimuovi i file obsoleti del core"
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_DESC="Elimina i file e le cartelle Joomla! che un aggiornamento di Joomla avrebbe dovuto rimuovere, ma non ha rimosso. I file del core rimasti indietro possono rendere il tuo sito completamente inutilizzabile, quindi vale la pena controllarli periodicamente."

[DeleteInactiveUsers]
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TITLE="Admin Tools – Elimina utenti inattivi"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DESC="Elimina gli account utente inattivi (è possibile scegliere i criteri)."

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE="Elimina utenti inattivi"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE_DESC="Rimuove automaticamente gli utenti che si sono registrati ma non hanno mai effettuato l'accesso al sito dopo un determinato periodo di tempo."
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BLOCKED="Solo se hanno attivato l'account, ma non hanno mai effettuato l'accesso"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_NOTACTIVATED="Solo se non hanno attivato il loro account"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BOTH="Attivato o meno, purché non abbiano effettuato l'accesso"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS="Elimina dopo questo numero di giorni"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS_DESC="Quanti giorni dopo la registrazione dell'utente dovremmo rimuoverlo se non ha ancora effettuato l'accesso al sito?"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS="Limita ai gruppi utente"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS_DESC="Elimina solo gli utenti inattivi che appartengono ad almeno uno dei gruppi selezionati. Lascia vuoto per eliminare gli utenti inattivi indipendentemente dalla loro appartenenza a gruppi. Attenzione: non selezionare gruppi di amministratori o Super utenti a meno che non si sia certi che nessun account amministratore legittimo verrebbe eliminato."

[AutoImport]
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_TITLE="Admin Tools – Importazione automatica della configurazione"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_DESC="Importa automaticamente le impostazioni di configurazione di Admin Tools da un URL"

PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL="URL di importazione automatica"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL_DESC="Esporta le tue impostazioni con la funzione di esportazione di Admin Tools. Carica il file JSON esportato in una posizione accessibile pubblicamente sul web. Inserisci l'URL di quel file JSON in tutti gli altri tuoi siti per scaricare e importare periodicamente quel file JSON. È equivalente a scaricare il file da quell'URL e importarlo con la funzione Importa &amp; Esporta di Admin Tools. Questa funzione ti consente essenzialmente di \"sincronizzare\" la configurazione di diverse installazioni di Admin Tools su siti diversi."

[ResetJoomlaUpdate]
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_TITLE="Admin Tools – Reimposta Joomla! Update"
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_DESC="Reimposta Joomla! Update alle impostazioni predefinite di fabbrica"

[CrawlerIPs]
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_TITLE="Admin Tools – Aggiorna gli elenchi di IP dei crawler"
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_DESC="Scarica gli elenchi di IP pubblicati di ogni crawler la cui impostazione in Configura WAF non è «Ignora», in modo che i visitatori non debbano mai attendere un download. Non fa nulla se «Usa gli elenchi di IP dei crawler» non è abilitato in Configura WAF."
