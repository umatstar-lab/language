[PHPFileChangeScanner]
PLG_TASK_ADMINTOOLS_TASK_SCAN_TITLE="Admin Tools – PHP-Dateiänderungsscanner"
PLG_TASK_ADMINTOOLS_TASK_SCAN_DESC="Durchsuchen Sie Ihre Website mit dem PHP-Dateiänderungsscanner von Admin Tools nach geänderten und verdächtigen PHP-Dateien."

PLG_TASK_ADMINTOOLS_LBL_NOTE01="Überschreibungen der maximalen Ausführungszeit unterliegen folgenden Einschränkungen: i. Sie können nicht länger sein als die maximale PHP-Ausführungszeit Ihres Servers. ii. Sie können nicht länger sein als das in den Optionen für geplante Aufgaben angegebene Aufgaben-Timeout. iii. Sie können nicht länger als 3600 Sekunden für CLI und 100 Sekunden für das Web sein. Werte außerhalb dieser Grenzen werden auf den Mindestwert unter allen diesen Grenzen gesetzt."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_LABEL="Maximale Ausführungszeit (CLI)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_DESC="Überschreiben Sie die maximale Ausführungszeit für jeden Scan-Schritt, wenn die geplante Aufgabe über einen CLI-CRON-Job (den CLI-Befehl <code>scheduler:run</code>) ausgeführt wird. Setzen Sie den Wert auf 0, um stattdessen die bereits im PHP-Dateiänderungsscanner konfigurierte maximale Ausführungszeit zu verwenden."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_LABEL="Maximale Ausführungszeit (Web)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_DESC="Überschreiben Sie die maximale Ausführungszeit für jeden Scan-Schritt, wenn die geplante Aufgabe über das Web ausgeführt wird (entweder über eine URL, auch bekannt als „Web-Cron\", oder die Methode „Lazy Scheduling\"). Setzen Sie den Wert auf 0, um stattdessen die bereits im PHP-Dateiänderungsscanner konfigurierte maximale Ausführungszeit zu verwenden."

[RemoveOldLogEntries]
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_TITLE="Admin Tools – Bereinigung des Protokolls blockierter Anfragen"
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_DESC="Entfernen Sie alte Einträge aus dem Protokoll blockierter Anfragen."

PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_LABEL="Maximale Anzahl zu behaltender Protokolleinträge"
PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_DESC="Durch Ausführen dieser Aufgabe werden die angegebene Anzahl der neuesten Protokolleinträge behalten und der Rest gelöscht."

[SessionOptimizer]
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_TITLE="Admin Tools – Sitzungstabelle reparieren und optimieren"
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_DESC="Repariert und optimiert die Joomla-Datenbanktabelle <code>#__session</code> (Sitzungsmetadaten) und verhindert Probleme beim Website-Zugriff auf mäßig bis stark ausgelasteten Websites."

[SessionCleaner]
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_TITLE="Admin Tools – Sitzungsmetadaten bereinigen"
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_DESC="Entfernt veraltete Sitzungsmetadaten und löscht veraltete Einträge aus der Datenbanktabelle <code>#__session</code>."

[CacheCleaner]
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TITLE="Admin Tools – Cache-Bereinigung"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_DESC="Leert den Joomla-Cache. Wählen Sie, ob der gesamte Cache oder nur die abgelaufenen Elemente geleert werden sollen."

PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE="Bereinigungstyp"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_DESC="Wählen Sie aus, wie der Joomla!-Cache bereinigt werden soll. „Nur Abgelaufene\" entfernt ausschließlich abgelaufene Elemente. „Alle löschen\" entfernt alle gecachten Elemente. <strong>Wichtiger Hinweis</strong>: Diese Aufgabe weist lediglich die Cache-Komponente von Joomla an, die Arbeit durchzuführen. Ob Cache-Elemente entfernt werden, hängt von Ihrem Cache-Speicher und der Funktionsweise von Joomla selbst ab. Wenn Sie auf der Cache-Verwaltungsseite von Joomla (also der Cache-Komponente von Joomla) keine abgelaufenen oder alle gecachten Elemente entfernen können, wird diese Aufgabe ebenfalls nichts bewirken können."
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_CLEAN="Alle löschen"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_EXPIRE="Nur Abgelaufene"

[TempDirCleaner]
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_TITLE="Admin Tools – Temporäres Verzeichnis bereinigen"
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_DESC="Löscht den Inhalt des temporären Verzeichnisses, der älter als 1 Minute ist."
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_TITLE="Admin Tools – Veraltete Kerndateien entfernen"
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_DESC="Löscht die Joomla!-Dateien und -Ordner, die ein Joomla-Update hätte entfernen sollen, aber nicht entfernt hat. Zurückgebliebene Kerndateien können Ihre Website komplett lahmlegen, daher lohnt es sich, regelmäßig danach zu suchen."

[DeleteInactiveUsers]
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TITLE="Admin Tools – Inaktive Benutzer löschen"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DESC="Löscht Benutzerkonten, die inaktiv sind (Sie können die Kriterien festlegen)."

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE="Inaktive Benutzer löschen"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE_DESC="Entfernt automatisch Benutzer, die sich registriert, aber sich nach einer bestimmten Zeit nie auf der Website angemeldet haben."
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BLOCKED="Nur wenn sie aktiviert, aber nie angemeldet haben"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_NOTACTIVATED="Nur wenn sie ihr Konto nicht aktiviert haben"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BOTH="Aktiviert oder nicht, solange sie sich nie angemeldet haben"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS="Nach dieser Anzahl von Tagen löschen"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS_DESC="Wie viele Tage nach der Registrierung des Benutzers sollen wir ihn entfernen, wenn er sich noch nicht auf der Website angemeldet hat?"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS="Auf Benutzergruppen beschränken"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS_DESC="Nur inaktive Benutzer löschen, die mindestens einer der ausgewählten Gruppen angehören. Leer lassen, um inaktive Benutzer unabhängig von ihrer Gruppenzugehörigkeit zu löschen. Warnung: Wählen Sie keine Administrator- oder Super-Benutzer-Gruppen aus, es sei denn, Sie sind sicher, dass keine legitimen Administratorkonten gelöscht werden würden."

[AutoImport]
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_TITLE="Admin Tools – Konfiguration automatisch importieren"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_DESC="Importiert automatisch Admin Tools-Konfigurationseinstellungen von einer URL"

PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL="URL für automatischen Import"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL_DESC="Exportieren Sie Ihre Einstellungen mit der Export-Funktion von Admin Tools. Laden Sie die exportierte JSON-Datei an einen öffentlich zugänglichen Ort im Web hoch. Geben Sie die URL zu dieser JSON-Datei in allen Ihren anderen Websites ein, um die JSON-Datei regelmäßig herunterzuladen und zu importieren. Dies entspricht dem manuellen Herunterladen der Datei von dieser URL und dem Importieren mit der Import- &amp; Export-Funktion von Admin Tools. Mit dieser Funktion können Sie die Konfiguration mehrerer Admin Tools-Installationen auf verschiedenen Websites im Wesentlichen „synchronisieren\"."

[ResetJoomlaUpdate]
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_TITLE="Admin Tools – Joomla!-Update zurücksetzen"
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_DESC="Setzt das Joomla!-Update auf die Werkseinstellungen zurück"

[CrawlerIPs]
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_TITLE="Admin Tools – Crawler-IP-Listen aktualisieren"
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_DESC="Lädt die veröffentlichten IP-Listen aller Crawler herunter, deren Einstellung unter „WAF konfigurieren“ nicht „Ignorieren“ ist, damit Besucher nie auf einen Download warten müssen. Ohne aktivierte Option „Crawler-IP-Listen verwenden“ unter „WAF konfigurieren“ geschieht nichts."
