[PHPFileChangeScanner]
PLG_TASK_ADMINTOOLS_TASK_SCAN_TITLE="Admin Tools – Analyseur de modifications des fichiers PHP"
PLG_TASK_ADMINTOOLS_TASK_SCAN_DESC="Analysez votre site à la recherche de fichiers PHP modifiés et suspects avec l'Analyseur de modifications des fichiers PHP d'Admin Tools."

PLG_TASK_ADMINTOOLS_LBL_NOTE01="Les substitutions de la durée d'exécution maximale sont soumises aux limitations suivantes : i. Elles ne peuvent pas être supérieures à la durée d'exécution maximale PHP de votre serveur. ii. Elles ne peuvent pas être supérieures au délai d'expiration des tâches spécifié dans les options des tâches planifiées. iii. Elles ne peuvent pas être supérieures à 3 600 secondes pour le CLI et 100 secondes pour le web. Les valeurs en dehors de ces limites seront définies sur la valeur minimale parmi toutes ces limites."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_LABEL="Durée d'exécution maximale (CLI)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_DESC="Remplacez la durée d'exécution maximale pour chaque étape d'analyse lorsque la tâche planifiée est exécutée via une tâche CRON en CLI (la commande CLI <code>scheduler:run</code>). Définissez la valeur à 0 pour utiliser à la place la durée d'exécution maximale déjà configurée dans l'Analyseur de modifications des fichiers PHP."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_LABEL="Durée d'exécution maximale (web)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_DESC="Remplacez la durée d'exécution maximale pour chaque étape d'analyse lorsque la tâche planifiée est exécutée via le web (soit une URL, aussi appelée « Web Cron », soit la méthode « Planification différée »). Définissez la valeur à 0 pour utiliser à la place la durée d'exécution maximale déjà configurée dans l'Analyseur de modifications des fichiers PHP."

[RemoveOldLogEntries]
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_TITLE="Admin Tools – Nettoyage du journal des requêtes bloquées"
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_DESC="Supprime les anciennes entrées du journal des requêtes bloquées."

PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_LABEL="Nombre maximum d'entrées du journal à conserver"
PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_DESC="L'exécution de cette tâche conservera ce nombre des dernières entrées du journal et supprimera le reste."

[SessionOptimizer]
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_TITLE="Admin Tools – Réparation et optimisation de la table des sessions"
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_DESC="Répare et optimise la table de base de données <code>#__session</code> (métadonnées de session) de Joomla, prévenant les problèmes d'accès au site sur les sites modérément à très fréquentés."

[SessionCleaner]
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_TITLE="Admin Tools – Nettoyage des métadonnées de session"
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_DESC="Supprime les métadonnées de session obsolètes en retirant les enregistrements périmés de la table de base de données <code>#__session</code>."

[CacheCleaner]
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TITLE="Admin Tools – Nettoyage du cache"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_DESC="Vide le cache de Joomla. Choisissez de vider l'intégralité du cache ou uniquement les éléments expirés."

PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE="Type de nettoyage"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_DESC="Choisissez comment nettoyer le cache de Joomla!. « Expirés uniquement » supprime uniquement les éléments expirés. « Tout supprimer » supprime tous les éléments en cache. <strong>Remarque importante</strong> : Cette tâche demande simplement au composant Cache de Joomla d'effectuer le travail. La suppression des éléments en cache dépend de votre stockage de cache et du fonctionnement de Joomla lui-même. Si vous ne pouvez pas supprimer les éléments expirés ou tous les éléments en cache depuis la page de gestion du cache de Joomla (c'est-à-dire le composant Cache de Joomla), cette tâche ne pourra rien faire non plus."
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_CLEAN="Tout supprimer"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_EXPIRE="Expirés uniquement"

[TempDirCleaner]
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_TITLE="Admin Tools – Nettoyage du répertoire temporaire"
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_DESC="Supprime le contenu du répertoire temporaire datant de plus d'1 minute."
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_TITLE="Admin Tools – Supprimer les fichiers du cœur obsolètes"
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_DESC="Supprime les fichiers et dossiers Joomla! qu'une mise à jour de Joomla aurait dû supprimer, mais n'a pas supprimés. Les fichiers du cœur laissés en place peuvent rendre votre site totalement inutilisable ; il vaut donc la peine de les rechercher régulièrement."

[DeleteInactiveUsers]
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TITLE="Admin Tools – Suppression des utilisateurs inactifs"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DESC="Supprime les comptes utilisateurs inactifs (vous pouvez choisir les critères)."

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE="Supprimer les utilisateurs inactifs"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE_DESC="Supprime automatiquement les utilisateurs qui se sont inscrits mais ne se sont jamais connectés au site après un nombre de jours spécifique."
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BLOCKED="Uniquement s'ils ont activé leur compte, mais ne se sont jamais connectés"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_NOTACTIVATED="Uniquement s'ils n'ont pas activé leur compte"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BOTH="Activé ou non, tant qu'ils ne se sont pas connectés"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS="Supprimer après ce nombre de jours"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS_DESC="Combien de jours après l'inscription de l'utilisateur devons-nous le supprimer s'il ne s'est toujours pas connecté au site ?"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS="Limiter aux groupes d'utilisateurs"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS_DESC="Supprime uniquement les utilisateurs inactifs appartenant à au moins l'un des groupes sélectionnés. Laissez vide pour supprimer les utilisateurs inactifs quel que soit leur appartenance à un groupe. Avertissement : ne sélectionnez pas les groupes administrateur ou Super utilisateurs, à moins d'être certain qu'aucun compte administrateur légitime ne serait supprimé."

[AutoImport]
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_TITLE="Admin Tools – Import automatique de la configuration"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_DESC="Importe automatiquement les paramètres de configuration d'Admin Tools depuis une URL"

PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL="URL d'import automatique"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL_DESC="Exportez vos paramètres avec la fonctionnalité d'export d'Admin Tools. Téléversez le fichier JSON exporté vers un emplacement accessible publiquement sur le web. Saisissez l'URL de ce fichier JSON sur tous vos autres sites pour télécharger et importer périodiquement ce fichier JSON. C'est l'équivalent de télécharger le fichier depuis cette URL et de l'importer avec la fonctionnalité Import &amp; Export d'Admin Tools. Cette fonctionnalité vous permet en pratique de « synchroniser » la configuration de plusieurs installations d'Admin Tools sur différents sites."

[ResetJoomlaUpdate]
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_TITLE="Admin Tools – Réinitialisation de la mise à jour Joomla!"
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_DESC="Réinitialise la mise à jour Joomla! aux paramètres par défaut"

[CrawlerIPs]
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_TITLE="Admin Tools – Actualiser les listes d'adresses IP de robots d'exploration"
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_DESC="Télécharge les listes d'adresses IP publiées de chaque robot dont le paramètre dans Configurer le WAF n'est pas « Ignorer », afin que les visiteurs n'aient jamais à attendre un téléchargement. Ne fait rien tant que « Utiliser les listes d'adresses IP de robots d'exploration » n'est pas activé dans Configurer le WAF."
