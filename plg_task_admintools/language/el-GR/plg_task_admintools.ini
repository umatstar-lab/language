[PHPFileChangeScanner]
PLG_TASK_ADMINTOOLS_TASK_SCAN_TITLE="Admin Tools – Ανιχνευτής Αλλαγών Αρχείων PHP"
PLG_TASK_ADMINTOOLS_TASK_SCAN_DESC="Σαρώστε τον ιστότοπό σας για αλλαγμένα και ύποπτα αρχεία PHP με τον Ανιχνευτή Αλλαγών Αρχείων PHP του Admin Tools."

PLG_TASK_ADMINTOOLS_LBL_NOTE01="Οι παρακάμψεις για τον μέγιστο χρόνο εκτέλεσης υπόκεινται στους ακόλουθους περιορισμούς: i. Δεν μπορούν να είναι μεγαλύτεροι από τον μέγιστο χρόνο εκτέλεσης PHP του διακομιστή σας. ii. Δεν μπορούν να είναι μεγαλύτεροι από το Χρονικό Όριο Εργασίας που ορίζεται στις επιλογές Προγραμματισμένων Εργασιών. iii. Δεν μπορούν να υπερβαίνουν τα 3600 δευτερόλεπτα για CLI και τα 100 δευτερόλεπτα για το web. Τιμές εκτός αυτών των ορίων θα οριστούν στην ελάχιστη τιμή μεταξύ όλων αυτών των ορίων."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_LABEL="Μέγιστος χρόνος εκτέλεσης (CLI)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_DESC="Παράκαμψη του μέγιστου χρόνου εκτέλεσης για κάθε βήμα σάρωσης όταν η Προγραμματισμένη Εργασία εκτελείται μέσω εργασίας CLI CRON (η εντολή CLI <code>scheduler:run</code>). Ορίστε σε 0 για χρήση του μέγιστου χρόνου εκτέλεσης που έχει ήδη ρυθμιστεί στον Ανιχνευτή Αλλαγών Αρχείων PHP."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_LABEL="Μέγιστος χρόνος εκτέλεσης (web)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_DESC="Παράκαμψη του μέγιστου χρόνου εκτέλεσης για κάθε βήμα σάρωσης όταν η Προγραμματισμένη Εργασία εκτελείται μέσω web (είτε με URL γνωστό ως \"Web Cron\" είτε με τη μέθοδο \"Lazy Scheduling\"). Ορίστε σε 0 για χρήση του μέγιστου χρόνου εκτέλεσης που έχει ήδη ρυθμιστεί στον Ανιχνευτή Αλλαγών Αρχείων PHP."

[RemoveOldLogEntries]
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_TITLE="Admin Tools – Εκκαθάριση Αρχείου Καταγραφής Αποκλεισμένων Αιτημάτων"
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_DESC="Αφαίρεση παλαιών καταχωρήσεων από το Αρχείο Καταγραφής Αποκλεισμένων Αιτημάτων."

PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_LABEL="Μέγιστος αριθμός καταχωρήσεων αρχείου καταγραφής προς διατήρηση"
PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_DESC="Η εκτέλεση αυτής της εργασίας θα διατηρήσει τόσες από τις πιο πρόσφατες καταχωρήσεις αρχείου καταγραφής και θα διαγράψει τις υπόλοιπες."

[SessionOptimizer]
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_TITLE="Admin Tools – Επιδιόρθωση & βελτιστοποίηση πίνακα συνεδριών"
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_DESC="Επιδιορθώνει και βελτιστοποιεί τον πίνακα βάσης δεδομένων <code>#__session</code> (μεταδεδομένα συνεδρίας) της Joomla!, αποτρέποντας προβλήματα πρόσβασης σε ιστότοπους με μέτρια έως πολύ μεγάλη επισκεψιμότητα."

[SessionCleaner]
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_TITLE="Admin Tools – Εκκαθάριση μεταδεδομένων συνεδρίας"
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_DESC="Αφαιρεί παρωχημένα μεταδεδομένα συνεδρίας, διαγράφοντας παρωχημένες εγγραφές από τον πίνακα βάσης δεδομένων <code>#__session</code>."

[CacheCleaner]
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TITLE="Admin Tools – Εκκαθάριση κρυφής μνήμης"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_DESC="Εκκαθάριση της κρυφής μνήμης της Joomla!. Επιλέξτε αν θα εκκαθαριστεί ολόκληρη η κρυφή μνήμη ή μόνο τα ληγμένα στοιχεία."

PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE="Τύπος εκκαθάρισης"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_DESC="Επιλέξτε τον τρόπο εκκαθάρισης της κρυφής μνήμης της Joomla!. Η επιλογή \"Μόνο ληγμένα\" αφαιρεί μόνο τα ληγμένα στοιχεία. Η επιλογή \"Διαγραφή όλων\" αφαιρεί όλα τα αποθηκευμένα στοιχεία. <strong>Σημαντική σημείωση</strong>: Αυτή η εργασία απλώς δίνει εντολή στο συστατικό Κρυφής Μνήμης της Joomla! να εκτελέσει τη διαδικασία. Το αν τα στοιχεία κρυφής μνήμης αφαιρούνται εξαρτάται από τον αποθηκευτικό χώρο κρυφής μνήμης και τον τρόπο λειτουργίας της ίδιας της Joomla!. Εάν δεν μπορείτε να αφαιρέσετε ληγμένα ή όλα τα αποθηκευμένα στοιχεία από τη σελίδα Διαχείρισης Κρυφής Μνήμης της Joomla! (αυτό είναι το συστατικό Κρυφής Μνήμης της Joomla!) αυτή η εργασία επίσης δεν θα μπορεί να κάνει τίποτα."
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_CLEAN="Διαγραφή όλων"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_EXPIRE="Μόνο ληγμένα"

[TempDirCleaner]
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_TITLE="Admin Tools – Εκκαθάριση προσωρινού καταλόγου"
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_DESC="Διαγράφει τα περιεχόμενα του προσωρινού καταλόγου που είναι παλαιότερα από 1 λεπτό."
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_TITLE="Admin Tools – Αφαίρεση Παρωχημένων Αρχείων Πυρήνα"
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_DESC="Διαγράφει τα αρχεία και τους φακέλους του Joomla! που μια ενημέρωση του Joomla όφειλε να αφαιρέσει, αλλά δεν αφαίρεσε. Τα εναπομείναντα αρχεία πυρήνα μπορούν να προκαλέσουν ολική βλάβη στον ιστότοπό σας, οπότε αξίζει να τα ελέγχετε προγραμματισμένα."

[DeleteInactiveUsers]
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TITLE="Admin Tools – Διαγραφή ανενεργών χρηστών"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DESC="Διαγράφει λογαριασμούς χρηστών που είναι ανενεργοί (μπορείτε να επιλέξετε τα κριτήρια)."

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE="Διαγραφή ανενεργών χρηστών"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE_DESC="Αυτόματη αφαίρεση χρηστών που έχουν εγγραφεί αλλά δεν έχουν συνδεθεί ποτέ στον ιστότοπο μετά από συγκεκριμένο χρονικό διάστημα."
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BLOCKED="Μόνο εάν έχουν ενεργοποιήσει αλλά δεν έχουν συνδεθεί ποτέ"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_NOTACTIVATED="Μόνο εάν δεν έχουν ενεργοποιήσει τον λογαριασμό τους"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BOTH="Ενεργοποιημένοι ή μη, εφόσον δεν έχουν συνδεθεί"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS="Διαγραφή μετά από τόσες ημέρες"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS_DESC="Πόσες ημέρες μετά την εγγραφή του χρήστη πρέπει να τον αφαιρέσουμε εάν εξακολουθεί να μην έχει συνδεθεί στον ιστότοπο;"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS="Περιορισμός σε Ομάδες Χρηστών"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS_DESC="Διαγραφή μόνο ανενεργών χρηστών που ανήκουν σε τουλάχιστον μία από τις επιλεγμένες ομάδες. Αφήστε κενό για διαγραφή ανενεργών χρηστών ανεξαρτήτως της ομαδικής τους συμμετοχής. Προειδοποίηση: μην επιλέγετε ομάδες διαχειριστών ή Υπέρ-Χρηστών εκτός αν είστε βέβαιοι ότι κανένας νόμιμος λογαριασμός διαχειριστή δεν θα διαγραφεί."

[AutoImport]
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_TITLE="Admin Tools – Αυτόματη εισαγωγή ρυθμίσεων"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_DESC="Αυτόματη εισαγωγή ρυθμίσεων παραμέτρων Admin Tools από URL"

PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL="URL αυτόματης εισαγωγής"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL_DESC="Εξάγετε τις ρυθμίσεις σας με τη λειτουργία Εξαγωγής του Admin Tools. Ανεβάστε το εξαγόμενο αρχείο JSON σε τοποθεσία δημόσια προσβάσιμη στο web. Εισάγετε το URL αυτού του αρχείου JSON σε όλους τους άλλους ιστότοπούς σας για περιοδική λήψη και εισαγωγή του αρχείου JSON. Είναι ισοδύναμο με τη λήψη του αρχείου από αυτό το URL και την εισαγωγή του με τη λειτουργία Εισαγωγής &amp; Εξαγωγής του Admin Tools. Αυτή η λειτουργία σας επιτρέπει ουσιαστικά να \"συγχρονίσετε\" τη ρύθμιση παραμέτρων αρκετών εγκαταστάσεων Admin Tools σε διαφορετικούς ιστότοπους."

[ResetJoomlaUpdate]
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_TITLE="Admin Tools – Επαναφορά ενημέρωσης Joomla!"
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_DESC="Επαναφορά της ενημέρωσης Joomla! στις εργοστασιακές προεπιλογές"

[CrawlerIPs]
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_TITLE="Admin Tools – Ανανέωση λιστών IP των crawlers"
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_DESC="Λαμβάνει τις δημοσιευμένες λίστες IP κάθε crawler του οποίου η ρύθμιση στο Ρύθμιση Παραμέτρων WAF δεν είναι «Παράβλεψη», ώστε οι επισκέπτες να μην περιμένουν ποτέ για μια λήψη. Δεν κάνει τίποτα αν δεν είναι ενεργοποιημένο το «Χρήση λιστών IP των crawlers» στο Ρύθμιση Παραμέτρων WAF."
