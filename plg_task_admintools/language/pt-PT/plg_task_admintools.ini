[PHPFileChangeScanner]
PLG_TASK_ADMINTOOLS_TASK_SCAN_TITLE="Admin Tools – PHP File Change Scanner"
PLG_TASK_ADMINTOOLS_TASK_SCAN_DESC="Analise o seu site em busca de ficheiros PHP alterados e suspeitos com o PHP File Change Scanner do Admin Tools."

PLG_TASK_ADMINTOOLS_LBL_NOTE01="As substituições do tempo máximo de execução estão sujeitas às seguintes limitações: i. Não podem ser superiores ao tempo máximo de execução do PHP do seu servidor. ii. Não podem ser superiores ao Limite de Tempo da Tarefa especificado nas opções das Tarefas agendadas. iii. Não podem ser superiores a 3600 segundos para CLI e 100 segundos para a web. Os valores fora destes limites serão definidos para o valor mínimo entre todos estes limites."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_LABEL="Tempo máximo de execução (CLI)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_CLI_DESC="Substitua o tempo máximo de execução para cada passo da análise quando a Tarefa agendada está a ser executada através de um trabalho CRON de CLI (o comando CLI <code>scheduler:run</code>). Defina como 0 para utilizar o tempo máximo de execução já configurado no PHP File Change Scanner."

PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_LABEL="Tempo máximo de execução (web)"
PLG_TASK_ADMINTOOLS_LBL_TIME_LIMIT_WEB_DESC="Substitua o tempo máximo de execução para cada passo da análise quando a Tarefa agendada está a ser executada através da web (seja um URL a.k.a. \"Web Cron\" ou o método \"Lazy Scheduling\"). Defina como 0 para utilizar o tempo máximo de execução já configurado no PHP File Change Scanner."

[RemoveOldLogEntries]
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_TITLE="Admin Tools – Limpeza do Registo de Pedidos Bloqueados"
PLG_TASK_ADMINTOOLS_TASK_REMOVEOLDLOGENTRIES_DESC="Remova entradas antigas do Registo de Pedidos Bloqueados."

PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_LABEL="Número máximo de entradas de registo a manter"
PLG_TASK_ADMINTOOLS_LBL_MAXENTRIES_DESC="A execução desta tarefa manterá este número de entradas de registo mais recentes e eliminará as restantes."

[SessionOptimizer]
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_TITLE="Admin Tools – Reparação e otimização da tabela de sessões"
PLG_TASK_ADMINTOOLS_TASK_SESSIONOPTIMIZER_DESC="Repara e otimiza a tabela de base de dados <code>#__session</code> (metadados de sessão) do Joomla!, prevenindo problemas de acesso ao site em sites com tráfego moderado a muito elevado."

[SessionCleaner]
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_TITLE="Admin Tools – Limpar metadados de sessões"
PLG_TASK_ADMINTOOLS_TASK_SESSIONCLEANER_DESC="Remove metadados de sessão obsoletos, eliminando registos desatualizados da tabela de base de dados <code>#__session</code>."

[CacheCleaner]
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TITLE="Admin Tools – Limpeza de Cache"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_DESC="Esvaziar a cache do Joomla!. Escolha se pretende esvaziar toda a cache ou apenas os itens expirados."

PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE="Tipo de limpeza"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_DESC="Escolha como limpar a cache do Joomla!. \"Apenas Expirados\" remove apenas os itens expirados. \"Eliminar Tudo\" remove todos os itens em cache. <strong>Nota importante</strong>: Esta tarefa simplesmente indica ao componente de Cache do Joomla! para realizar o trabalho. Se os itens da cache são removidos depende do seu armazenamento de cache e do funcionamento do próprio Joomla!. Se não conseguir remover itens expirados ou todos os itens em cache a partir da página de gestão de Cache do Joomla! (esse é o componente de Cache do Joomla!), esta tarefa também não conseguirá fazer nada."
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_CLEAN="Eliminar Tudo"
PLG_TASK_ADMINTOOLS_TASK_CACHECLEANER_TYPE_EXPIRE="Apenas Expirados"

[TempDirCleaner]
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_TITLE="Admin Tools – Limpar o diretório temporário"
PLG_TASK_ADMINTOOLS_TASK_TEMPDIRCLEANER_DESC="Elimina o conteúdo do diretório temporário com mais de 1 minuto."
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_TITLE="Admin Tools – Remover Ficheiros Obsoletos do Núcleo"
PLG_TASK_ADMINTOOLS_TASK_OBSOLETECOREFILES_DESC="Apaga os ficheiros e pastas do Joomla! que uma atualização do Joomla deveria ter removido, mas não removeu. Os ficheiros do núcleo deixados para trás podem inutilizar completamente o seu site, pelo que vale a pena verificá-los com regularidade."

[DeleteInactiveUsers]
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TITLE="Admin Tools – Eliminar utilizadores inativos"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DESC="Elimina contas de utilizador que estão inativas (pode escolher os critérios)."

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE="Eliminar utilizadores inativos"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_TYPE_DESC="Remover automaticamente utilizadores que se registaram mas que nunca iniciaram sessão no site após um determinado período de tempo."
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BLOCKED="Apenas se ativaram a conta, mas nunca iniciaram sessão"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_NOTACTIVATED="Apenas se não ativaram a sua conta"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_BOTH="Ativados ou não, desde que não tenham iniciado sessão"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS="Eliminar após este número de dias"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_DAYS_DESC="Quantos dias após o registo do utilizador devemos removê-lo se ainda não tiver iniciado sessão no site?"

PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS="Limitar a Grupos de Utilizadores"
PLG_TASK_ADMINTOOLS_TASK_DELETEINACTIVEUSERS_GROUPS_DESC="Eliminar apenas os utilizadores inativos que pertençam a pelo menos um dos grupos selecionados. Deixe em branco para eliminar utilizadores inativos independentemente da sua pertença a grupos. Aviso: não selecione grupos de administrador ou Super Utilizadores a não ser que tenha a certeza de que nenhuma conta de administrador legítima seria eliminada."

[AutoImport]
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_TITLE="Admin Tools – Importação automática de configuração"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_DESC="Importa automaticamente as definições de configuração do Admin Tools a partir de um URL"

PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL="URL de importação automática"
PLG_TASK_ADMINTOOLS_TASK_AUTOIMPORT_URL_DESC="Exporte as suas definições com a funcionalidade de Exportação do Admin Tools. Carregue o ficheiro JSON exportado para um local publicamente acessível na web. Introduza o URL para esse ficheiro JSON em todos os seus outros sites para transferir e importar periodicamente esse ficheiro JSON. É equivalente a transferir o ficheiro a partir desse URL e importá-lo com a funcionalidade de Importação &amp; Exportação do Admin Tools. Esta funcionalidade permite-lhe essencialmente \"sincronizar\" a configuração de várias instalações do Admin Tools em diferentes sites."

[ResetJoomlaUpdate]
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_TITLE="Admin Tools – Repor Atualização do Joomla!"
PLG_TASK_ADMINTOOLS_TASK_JUPDATE_DESC="Repõe a Atualização do Joomla! para as predefinições de fábrica"

[CrawlerIPs]
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_TITLE="Admin Tools – Atualizar listas de IPs de rastreadores"
PLG_TASK_ADMINTOOLS_TASK_CRAWLERIPS_DESC="Transfere as listas de IPs publicadas de todos os rastreadores cuja definição em Configurar WAF não seja «Ignorar», para que os visitantes nunca tenham de esperar por uma transferência. Não faz nada a menos que «Utilizar listas de IPs de rastreadores» esteja ativado em Configurar WAF."
