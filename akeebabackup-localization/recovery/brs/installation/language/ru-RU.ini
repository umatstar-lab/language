DATABASE_HEADER_ERROR="Ошибка произошла при восстановлении базы данных. Сообщение об ошибке можно найти ниже. Нажмите на &times; кнопка в правом верхнем углу этого диалога, чтобы закрыть его и вернуться на страницу восстановления базы данных."
DATABASE_ERR_INVALIDKEY="Недопустимый ключ базы данных"

DATABASE_ERR_COMPLEXPASSWORD="!!! ВНИМАНИЕ !!!\n\nПароль базы данных содержит специальные символы. Многие веб-серверы отклоняют или изменяют такие пароли. Из-за этого восстановление может завершиться ошибкой подключения к базе данных.\n\nНастоятельно рекомендуем заменить пароль базы данных случайной строкой длиной не менее 32 символов. Используйте только заглавные буквы A-Z, строчные буквы a-z и цифры 0-9.\n\nИгнорировать предупреждение и продолжить восстановление базы данных на свой риск?"
DATABASE_ERR_UPPERCASEPREFIX="!!! Предупреждение!!!\n\nПрефикс имени таблицы базы данных содержит один или несколько символов верхнего регистра. Это может вызвать серьезные проблемы на восстановленном сайте и/или сделать невозможным восстановление вашего сайта на другом сервере. Это происходит из-за того, как MySQL обрабатывает буквы верхнего регистра и не может эффективно работать вокруг, в соответствии с документацией MySQL.\n\nМы очень настоятельно рекомендуем вам использовать префикс имени таблицы базы данных.\n\nВы хотите игнорировать предупреждение и продолжить восстановление базы данных на свой страх и риск?"
