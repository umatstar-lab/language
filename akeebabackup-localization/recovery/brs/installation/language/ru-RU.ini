DATABASE_LBL_PORT="Порт базы данных"
DATABASE_LBL_PORT_HELP="<strong>необязательный</strong>База данных TCP/IP порт, если он отличается от стандартного (3306). Это не применяется, если вы используете имя хоста <code>localhost</code> Если вы не знаете, что это значит, оставьте это пустым."
DATABASE_LBL_SOCKET="UNIX socket / Windows Named Pipe (недоступная ссылка)"
DATABASE_LBL_SOCKET_HELP="<strong>необязательный</strong>Если вы подключаетесь к серверу базы данных с помощью сокета UNIX (например). <code>unix:/tmp/mysql.sock</code>) или Windows Named Pipe (например. <code>\\.\MySQL</code>Пожалуйста, введите его сюда, если вы не знаете, что это значит, оставьте это пустым."
DATABASE_LBL_DBENCRYPTION="Используйте SSL/TLS"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Необязательно.</strong> Вы хотите подключиться к MySQL с помощью SSL/TLS? Это может быть использовано для шифрования соединения базы данных и необязательно для входа в нее без использования пароля. Вам нужно будет указать путь ключа клиента MySQL и файла сертификата. Это очень редкий вариант. Если вы не знаете, что это такое, пожалуйста, проигнорируйте этот и следующие несколько вариантов."
DATABASE_LBL_DBSSLCIPHER="SSL-цифры"
DATABASE_LBL_DBSSLCIPHER_HELP="Используется только тогда, когда включено использование SSL/TLS. Разделенный толстым слоем список шифров для использования для соединения SSL/TLS например. <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>Если не уверены, оставьте это пустым."
DATABASE_LBL_DBSSLCERT="SSL-сертификат"
DATABASE_LBL_DBSSLCERT_HELP="Используется только при включенном использовании SSL/TLS. Абсолютный путь файловой системы к файлу сертификата клиента в формате PEM."
DATABASE_LBL_DBSSLKEY="SSL Ключевой файл"
DATABASE_LBL_DBSSLKEY_HELP="Используется только при включенном использовании SSL/TLS. Абсолютный путь файловой системы к файлу ключа клиента в формате PEM."
DATABASE_LBL_DBSSLCA="SSL CA файл"
DATABASE_LBL_DBSSLCA_HELP="Используется только при включенном использовании SSL/TLS. Абсолютный путь файловой системы к файлу Certification Authority (CA) для подключения к серверу, в формате PEM. Это учитывается только при включении сертификата Validate Server."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Проверьте Сертификат Сервера"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Используется только при включенном использовании SSL/TLS. Проверяет ответ сервера на файл Certification Authority (CA). Вы должны предоставить файл CA для правильной работы этой опции. Если восстановление базы данных последовательно не удается, попробуйте отключить эту опцию."

DATABASE_HEADER_ADVANCED="Продвинутые варианты"
DATABASE_LBL_EXISTING="С существующими таблицами"
DATABASE_LBL_EXISTING_HELP="Выберите, что делать с существующими таблицами. ”Drop” удалит существующие таблицы с теми же именами, что и восстановленные таблицы. ”Backup” переименует существующие таблицы с теми же названиями, что и восстановленные таблицы, изменив их префикс на bak_. ”Drop Same Prefix” выпадет все таблицы с тем же префиксом, даже если они не включены в восстановленную резервную копию. ”Drop All” выпадет все таблицы, даже с другим префиксом. Последние два варианта Опасны и должны использоваться с особой осторожностью."
DATABASE_LBL_EXISTING_DROP="Бросить"
DATABASE_LBL_EXISTING_BACKUP="Резервное копирование"
DATABASE_LBL_EXISTING_DROPPREFIX="Скачать префикс"
DATABASE_LBL_EXISTING_DROPALL="Бросить все"
DATABASE_LBL_PREFIX="Имя таблицы базы данных префикс"
DATABASE_LBL_PREFIX_HELP="Префикс всех восстановленных таблиц баз данных, в которых был префикс во время резервного копирования. Префикс, используемый для основной базы данных сайта, также будет записан на ваш Joomla! configuration.php Обратите внимание, что некоторые расширения могут привести к неправильному поведению или даже полностью сломать ваш сайт, если вы измените префикс имени таблицы базы данных при восстановлении / переносе вашего сайта."
DATABASE_LBL_FOREIGNKEY="Подавить проверки иностранных ключей"
DATABASE_LBL_FOREIGNKEY_HELP="Отключает проверку внешних ключей MySQL во время восстановления. Это обязательно при восстановлении базы данных, которая использует отношения на уровне таблицы (зарубежные ключи). Если вы не уверены, оставьте эту проверку; она не причинит никакого вреда."
DATABASE_LBL_NOAUTOVALUE="Автономная стоимость не равна нулю"
DATABASE_LBL_NOAUTOVALUE_HELP="Позволяет восстанавливать таблицы с автоповышающимися полями, значение которых равно нулю. Magento и Drupal требуют этого для правильного восстановления. ПРИМЕЧАНИЕ: Согласно документации MySQL: ”Хранение 0 не является рекомендуемой практикой."
DATABASE_LBL_REPLACE="Используйте вместо INSERT"
DATABASE_LBL_REPLACE_HELP="Сценарий восстановления обычно использует команды INSERT для восстановления данных базы данных. Это плохо работает с данными определенных расширений, вызывая проблемы с восстановлением. Если вы получаете ошибки восстановления базы данных, пожалуйста, проверьте это поле и снова нажмите кнопку Next."
DATABASE_LBL_FORCEUTF8DB="Коллекция UTF-8 в базе данных"
DATABASE_LBL_FORCEUTF8DB_HELP="При проверке скрипт восстановления попытается преобразовать коллацию по умолчанию вашей таблицы в Unicode (UTF-8), как предложено в описании. JoomlaЭто работает не на всех серверах, проверьте, есть ли у вас вопросительные знаки или неработающий текст вместо международных символов."
DATABASE_LBL_FORCEUTF8TABLES="Коллекция UTF-8 на столах"
DATABASE_LBL_FORCEUTF8TABLES_HELP="При проверке скрипт восстановления попытается преобразовать все текстовые поля восстановленных таблиц в Unicode (UTF-8). Это обходной путь, когда вы не можете использовать вышеприведенную опцию. Обратите внимание, что если ваша коллаляция базы данных - это что-то другое, чем UTF-8, вы <em>будет</em> В будущем возникают проблемы, после обновления расширения добавляется новое текстовое поле."
DATABASE_LBL_UTF8MB4DETECT="Разрешить автоматическое обнаружение UTF8MB4"
DATABASE_LBL_UTF8MB4DETECT_HELP="Если включен и ваш сервер базы данных поддерживает UTF8MB4 (UTF-8 Multibyte), он будет использоваться вместо обычного старого UTF-8. ПРЕДУПРЕЖДЕНИЕ: Используйте только, если ваш сайт использовал UTF8MB4 при резервном копировании."
DATABASE_LBL_CHARSET_CONVERSION="Нормализовать набор символов"
DATABASE_LBL_CHARSET_CONVERSION_YES="Включенный"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Авто-обнаружение (рекомендуется)"
DATABASE_LBL_CHARSET_CONVERSION_NO="инвалид"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Нормализация коллаций управления при восстановлении на разных платформах баз данных или семействах версий (например, MariaDB в MySQL). <strong>Автодетект</strong>Преобразование charset применяется автоматически, когда скрипт восстановления определяет, что резервная копия была создана на другой платформе базы данных или семействе версий, чем целевой сервер. <strong>Включенный</strong>Всегда нормализуйте коллажи независимо от платформы. <strong>инвалид</strong>Никогда не нормализуйте коллации; используйте это только тогда, когда вы уверены, что восстанавливаете тот же самый сервер базы данных (MySQL против MariaDB) и семейство версий."

DATABASE_HEADER_FINETUNING="Отличная настройка"
DATABASE_MSG_FINETUNING="Измените эти настройки только в том случае, если вам будет предложено сделать это с помощью нашей поддержки или если восстановление базы данных застрянет.Установка значений 5 и 2000 в полях ниже приведет к гораздо более медленному восстановлению, но менее вероятному отказу от дешевого, ненадежного хостинга."
DATABASE_LBL_MAXEXECTIME="Максимальное время исполнения"
DATABASE_LBL_MAXEXECTIME_HELP="Сценарий восстановления разбивает процесс восстановления базы данных на небольшие фрагменты, чтобы избежать тайм-аута сервера. Это значение определяет, сколько времени займет каждый из этих фрагментов. Возможно, вам придется изменить это значение, если восстановление базы данных не завершено. По умолчанию 10 секунд."
DATABASE_LBL_THROTTLEMSEC="Время дрожи"
DATABASE_LBL_THROTTLEMSEC_HELP="Сценарий восстановления может необязательно дроссель вниз скорость процесса восстановления базы данных для сильно неправильного поведения серверов. Вы можете ввести время дроссельной заслонки между обрабатывающими кусками в миллисекундах (1/1000 секунды). Например, чтобы добавить 5 секунд времени дроссельной заслонки между шагами введите 5000 в этом поле. Значение по умолчанию 250 должно работать на большинстве серверов."

DATABASE_LBL_ON_CREATE_ERROR="Остановитесь на Создать ошибку"
DATABASE_LBL_ON_CREATE_ERROR_HELP="Следует ли немедленно прекратить восстановление, если есть ошибка создания таблицы, просмотра, функции, запуска или хранимой процедуры? Если непроверенные такие ошибки будут проигнорированы и восстановление будет продолжаться с возможным повреждением данных и / или проблемами на восстановленном сайте."
DATABASE_LBL_ON_OTHER_ERROR="Остановитесь на другой ошибке"
DATABASE_LBL_ON_OTHER_ERROR_HELP="Следует ли немедленно прекратить восстановление, если есть ошибка, выполняющая любую другую команду базы данных, такую как восстановление или удаление данных? Если непроверенные такие ошибки будут проигнорированы и восстановление будет продолжаться с возможным повреждением данных и / или проблемами на восстановленном сайте."

