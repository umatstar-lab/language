DATABASE_LBL_DBNAME="Имя базы данных"
DATABASE_LBL_DBNAME_HELP="Большинство хостов, использующих cPanel, Plesk и другие основные панели хостинга, будут давать имена баз данных, такие как: <code>abcdef_username</code>где <code>abcdef</code> Если вы не уверены, пожалуйста, спросите вашего хоста."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Необычные опции"
