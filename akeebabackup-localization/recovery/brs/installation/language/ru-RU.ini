DATABASE_LBL_HOSTNAME="Имя сервера базы данных"
DATABASE_LBL_HOSTNAME_HELP="имя хозяина или IP адрес сервера базы данных (обычно: localhost). <strong>ВАЖНО!</strong> <code>localhost</code> и <code>127.0.0.1</code> Смысл двух разных вещей см. Ниже. Примеры соединений:<ul><li><code>localhost</code></li> Подключайтесь к локальному хосту через гнездо UNIX по умолчанию (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Подключение к локальному хосту через TCP/IP Использование порта по умолчанию (3306).<li><code>127.0.0.1:1234</code></li> Подключение к локальному хосту через TCP/IP Порт 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Подключиться к IPv6 хост по адресу 2607:f0d0:1002:51::4 over TCP/IP Используя порт 1234. Примечание: все IPv6 адреса должны быть заключены в квадратные скобки!</li><li><code>mysql.example.com:1234</code></li> Подключитесь к mysql.example.com через TCP/IP Порт 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Подключение с помощью гнезда UNIX в /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Подключайтесь с помощью Windows Named Pipe «MySQL» (очевидно, работает только на серверах Windows).</ul>"
