SETUP_LABEL_TMPPATH="Тимчасовий каталог"
SETUP_LABEL_TMPPATH_HELP="У каталозі, де Joomla! зберігати тимчасові дані. Ми рекомендуємо розмістити це поза кореневим сайтом. За замовчуванням: каталог <code>tmp</code> під корінь вашого сайту."
