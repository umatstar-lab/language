DATABASE_ERR_COMPLEXPASSWORD="!!! УВАГА !!!\n\nПароль бази даних містить спеціальні символи. Багато вебсерверів відхиляють або змінюють такі паролі. Через це відновлення може завершитися помилкою підключення до бази даних.\n\nНаполегливо рекомендуємо замінити пароль бази даних випадковим рядком завдовжки не менш ніж 32 символи. Використовуйте лише великі літери A-Z, малі літери a-z та цифри 0-9.\n\nПроігнорувати попередження й продовжити відновлення бази даних на власний ризик?"
DATABASE_ERR_UPPERCASEPREFIX="ЗАМОВИТИ!!!\n\nВаше ім'я бази даних префікс містить один або кілька символів верхнього вікна. Це може викликати серйозні проблеми на відновленому сайті та/або зробити його неможливо відновити сайт на іншому сервері. Це відбувається через спосіб обробки MySQL верхніх літер і не може бути ефективно працювати навколо, за документацію MySQL.\n\nМи рекомендуємо вам використовувати префіксацію таблиці бази даних у всіх джерелах.\n\nВи хочете ігнорувати попередження та продовжити відновлення бази даних на власний ризик?"
DATABASE_ERR_EMPTY_INFO="!!! WARNING !!!\n\nВи не заповнили всі необхідні поля (зва бази даних, назва бази даних, ім'я бази даних, бази даних, пароль бази даних і назву таблиці префікс). Це, швидше за все, призведе до помилки, які намагаються підключитися до бази та / або відновлений сайт.\n\nВи ABSOLUTELY SURE це те, що ви дійсно означали, щоб зробити?"

