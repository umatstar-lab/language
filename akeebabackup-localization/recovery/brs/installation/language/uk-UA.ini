DATABASE_WARN_LARGE_COLUMNS="Найбільший базовий ряд бази даних вашої бази даних %1$0.2f Мб. Тим не менш, ваш сервер бази даних, ймовірно, буде налаштований тільки для прийняття до %3$0.2f Мб (ми не можемо перевірити, що без підключення до сервера бази даних). Якщо ви приступите до відновлення бази даних, ви, ймовірно, отримаєте код помилки бази даних 1153; або повідомлення про помилку 'ER_NET_PACKET_TOO_LARGE'; або повідомлення про помилку 'Got a packet більше, ніж 'max_allowed_packet' bytes'. Якщо це сталося, будь ласка, запитайте свого хосту, щоб встановити значення значення <strong>Пакети Жетони</strong> конфігурація змінного сервера бази даних принаймні %2$d М.М."


