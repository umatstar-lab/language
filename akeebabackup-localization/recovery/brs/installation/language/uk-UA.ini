OFFSITEDIRS_HEADER_MASTER="Реставрація <code>%s</code>"
OFFSITEDIRS_LBL_EXPLANATION="<p>Коли ви задбали ваш сайт, були деякі файли поза кореневим сайтом (і дані головної папки, що закривається). Файли, які використовуються для того, щоб бути в папці <code>%s</code>.</p><p>Ці файли в даний час вилучення <code>%s</code> Що таке <em>непристойна</em> де вони повинні бути для вашого сайту, щоб працювати. Це просто тимчасове розташування, що вимагається тим, що вилучення архіву не може створювати файли <em>до</em> папка, яку ви витягуєте її до. Тому вам потрібно перемістити ці файли для вашого сайту, щоб працювати.</p><p>Ви можете надати абсолютну папку до місця розташування абсолютної файлової системи, яку потрібно скопіювати нижче. Для вашої інформації, ваш сайт в даний час витягується до місця розташування абсолютної файлової системи <code>%s</code>.</p>"
