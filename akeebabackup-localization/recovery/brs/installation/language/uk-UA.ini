SETUP_LBL_LIVESITE="Веб-сайт URL"
SETUP_LBL_LIVESITE_HELP="Деякі сервери мають неприємні відчуття, що з'являються URL Ваш сайт, який може призвести до URL-адрес та елементів меню, які не працюють. На цих серверах ви повинні ввести свій сайт URL без причіпної сіточки, наприклад, <code>http://www.example.com</code>. У більшості випадків це не потрібно, і ви можете залишити це поле порожнім."
SETUP_LBL_LIVESITE_WINDOWS_WARNING="ВАЖЛИВО! Ваш веб-сервер працює на Windows. Заповнення в живому сайті URL при запуску сайту на Windows, неможливе увійти в область адміністратора сайту через помилки в Joomla!. Будь ласка, залиште цей порожній файл."
SETUP_LBL_USESITEDIRS="Перевизнання стрибків і журналів"
SETUP_LBL_USESITEDIRS_HELP="Реставраційний скрипт буде за замовчуванням використовувати mp і журнальні доріжки вже налаштовані на задньої глобальної конфігурації сайту. Якщо ви відновлюєте на інший сервер або скринінг вашого сайту, це може призвести до проблем. У цьому випадку, або якщо ви не впевнені, натисніть кнопку - сценарій відновлення заповнюється тимчасовим і Лог-довідник шляхами з чутливими значеннями для сайту, які ви відновлюєте. Ви можете змінити ці шляхи в директоріях Fine-tuning розділу нижче."
SETUP_LBL_USESITEDIRS_51="Надіславний стрибок, журнал і кеш-патчі"
SETUP_LBL_USESITEDIRS_HELP_51="Реставраційний скрипт буде за замовчуванням використовувати tmp, журнал і кеш-паті вже налаштовані на задньої глобальної конфігурації сайту. Якщо ви відновлюєте на інший сервер або склінінг вашого сайту, це може призвести до проблем. У цьому випадку, або якщо ви не впевнені, натисніть кнопку - сценарій відновлення заповнюється тимчасовим і Лог-довідник шляхами з чутливими значеннями для сайту, які ви відновите, і перевернути каталог кешу на порожній рядок (який говорить Joomla! для використання <code>administrator/cache</code> папки). Ви можете змінити ці шляхи в директорій Fine-tuning розділ нижче."

SETUP_LBL_COOKIEDOMAIN="домени cookie"
SETUP_LBL_COOKIEDOMAIN_HELP="Домен cookie — доменне ім’я сайту без протоколу й зазвичай без префікса www. Наприклад, якщо ви відновлюєте сайт за адресою http://www.example.com, укажіть example.com. Префікс http:// указувати не потрібно."
SETUP_LBL_COOKIEPATH="Патріархія"
SETUP_LBL_COOKIEPATH_HELP="Шлях Cookie - це піддиректор вашого сайту, відносно кореня домену. Якщо ви відновлюєте корінь домену, наприклад, http://www.example.com, потім він є / (односторонній зсув). Якщо ви відновлюєте на підкані, це зіткнеться з ім'ям каталогу. Наприклад, якщо ви відновлюєте http://www.example.com/joomla тоді шлях Cookie є /joomla (WITH провідною сіткою, але БЕЗ причепної сіткою)."

