SETUP_HEADER_FINETUNING_HELP="Joomla! потребує двох списаних каталогів для своїх тимчасових файлів і журналів. Ви можете визначити їх тут. Порада: якщо вони нездійснені, але ви вже ввімкнено FTP шар вище, сценарій відновлення спробує зробити їх писати і закріпити їх автоматично."
