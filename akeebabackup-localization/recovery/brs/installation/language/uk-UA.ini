DATABASE_HEADER_CONNECTION="Інформація про підключення"
DATABASE_LBL_TYPE="Тип бази даних"
DATABASE_LBL_TYPE_HELP="Це зазвичай MySQL (<em>з</em> причіп ”i”)"
DATABASE_LBL_HOSTNAME="Назва сервера бази даних"
DATABASE_LBL_HOSTNAME_HELP="Ім'я хосту або IP адреса сервера бази даних (зазвичай: локальнийhost). <strong>ВАЖЛИВО!</strong> <code>localhost</code> і <code>127.0.0.1</code> Нижче наведено два різні речі. Приклади підключення:<ul><li><code>localhost</code></li> Підключення до локального привиду над розеткою UNIX (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Підключення до локальногоhost над TCP/IP за замовчуванням порт (3306).<li><code>127.0.0.1:1234</code></li> Підключення до локальногоhost над TCP/IP за допомогою порту 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Зв'язатися з IPv6 хост за адресою 2607:f0d0:1002:51:4 над TCP/IP за допомогою порту 1234. Примітка: всі IPv6 адрес MUST закривається на квадратні дужки!</li><li><code>mysql.example.com:1234</code></li> Підключення до mysql.example.com над TCP/IP за допомогою порту 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Підключіть за допомогою розетки UNIX в /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Підключіть за допомогою Windows Named Pipe ”MySQL” (тільки працює на серверах Windows).</ul>"
DATABASE_LBL_USERNAME="Ім'я користувача"
DATABASE_LBL_USERNAME_HELP="Ім'я користувача, яке ви використовуєте для підключення до бази даних. Більшість користувачів, які використовують cPanel, Plesk та інші основні панелі хостингу, дадуть ім'я користувача, такі як abcdef_username, де abcdef - це ім'я панелі керування хостингом. Якщо ви не впевнені, будь ласка, попросіть свого господаря."
DATABASE_LBL_PASSWORD="Письмовий"
DATABASE_LBL_PASSWORD_HELP="Ви використовуєте пароль для підключення до бази даних."
DATABASE_LBL_DBNAME="Назва бази даних"
DATABASE_LBL_DBNAME_HELP="Назва бази даних. Більшість хостингів, які використовують cPanel, Plesk та інших основних хостингових панелей, дадуть імена баз даних, таких як <code>abcdef_username</code>, де <code>abcdef</code> є Вашим ім'ям панелі керування хостингом. Якщо ви не впевнені, будь ласка, попросіть вашого хосту."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Некомерційні параметри"
DATABASE_LBL_UNCOMMON_OPTIONS_INFO="Використовуються такі параметри, як менш поширені та екзотичні налаштування MySQL."
DATABASE_LBL_PORT="Портфоліо бази даних"
DATABASE_LBL_PORT_HELP="<strong>Додатковий</strong>. База даних TCP /IP порт, якщо відрізняється від за замовчуванням (3306). Це не застосовується, якщо ви використовуєте ім'я хосту <code>localhost</code> або гніздо. Якщо ви не знаєте, що це означає, будь ласка, залиште це порожнім."
DATABASE_LBL_SOCKET="Розетка UNIX / Windows, названі труби"
DATABASE_LBL_SOCKET_HELP="<strong>Додатковий</strong>. Якщо ви підключені до сервера бази даних за допомогою розетки UNIX (наприклад, <code>unix:/tmp/mysql.sock</code>) або Windows, названої трубою (наприклад, <code>\\.\MySQL</code>) будь ласка, введіть його тут. Якщо ви не знаєте, що це означає залишити це порожнім."
DATABASE_LBL_DBENCRYPTION="Використання SSL / ТЛС"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Optional.</strong> Ви хочете підключитися до MySQL за допомогою SSL / ТЛС? Це може бути використаний для шифрування підключення бази даних і додатково для входу в неї без використання пароля. Вам потрібно буде поставляти шлях ключа клієнта MySQL і сертифікатного файлу. Це дуже незрівняний варіант. Якщо ви не знаєте, що це, будь ласка, ігноруйте це і наступні кілька варіантів."
DATABASE_LBL_DBSSLCIPHER="Статус на сервери"
DATABASE_LBL_DBSSLCIPHER_HELP="Тільки використовується при використанні SSL / ТЛС. Список відокремлених комірок шифрування для використання для підключення SSL / ТЛС, наприклад, <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>. Якщо непевно, залиште цю заготовку."
DATABASE_LBL_DBSSLCERT="Файл SSL Certificate"
DATABASE_LBL_DBSSLCERT_HELP="Тільки використовується при ввімкненні SSL/TLS. Шлях абсолютної файлової системи до файла сертифіката клієнта у форматі PEM."
DATABASE_LBL_DBSSLKEY="Файл ключа SSL"
DATABASE_LBL_DBSSLKEY_HELP="Тільки використовується при використанні SSL/TLS. Шлях абсолютної файлової системи до ключа клієнта у форматі PEM."
DATABASE_LBL_DBSSLCA="Статус на сервери"
DATABASE_LBL_DBSSLCA_HELP="Тільки використовується при включенні SSL/TLS. Увімкнено абсолютний шлях файлової системи до файлу сертифікації (CA) для підключення до сервера, у форматі PEM. Це тільки враховується при включенні до сертифіката Validate Server."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Перевірити сервер"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Тільки використовується при ввімкненні SSL/TLS. Перевіряє відповідь сервера на файл сертифікації (CA). Ви повинні надати файл CA для цього варіанту, щоб працювати правильно. Якщо відновлення бази даних послідовно не може спробувати відключення цього параметра."

DATABASE_HEADER_ADVANCED="Додаткові параметри"
DATABASE_LBL_EXISTING="З існуючими таблицями"
DATABASE_LBL_EXISTING_HELP="Виберіть те, що робити з існуючими таблицями. «Drop» видалить існуючі таблиці з такими ж назвами, як відреставровані таблиці. «Backup» перейменуватиме існуючі таблиці з тими самими назвами, як відреставруються таблиці, змінюючи їх префікс на bak_. «Drop Same Prefix» понизить всі столи з однаковим префіксом, навіть якщо вони не включені в резервну копію. «Drop All» буде скидати всі таблиці, навіть з різним префіксом. Останні два варіанти DANGEROUS і повинні використовуватися з EXTREME CAUTION."
DATABASE_LBL_EXISTING_DROP="Зберегти"
DATABASE_LBL_EXISTING_BACKUP="Резервне копіювання"
DATABASE_LBL_EXISTING_DROPPREFIX="Падіння Same Prefix"
DATABASE_LBL_EXISTING_DROPALL="Зареєструвати всі"
DATABASE_LBL_PREFIX="Ім'я бази даних префікс"
DATABASE_LBL_PREFIX_HELP="Передфікс всіх відновлених таблиць бази даних, які мали префікс у часі резервного копіювання. Префікс, який використовується для основної бази даних сайту, також буде написано до вашого Joomla! configuration.php файл. Зверніть увагу, що деякі розширення можуть бути поганими або навіть повністю збити ваш сайт, якщо ви зміните префікс імені бази даних при відновленні / передачі вашого сайту."
DATABASE_LBL_FOREIGNKEY="Suppress іноземних ключових перевірок"
DATABASE_LBL_FOREIGNKEY_HELP="Вимкнено перевірку іноземного ключа MySQL при відновленні. Це обов'язково, коли ви відновлюєте базу даних, яка використовує зв'язки рівня таблиці (дляв'язкових ключів). Якщо непевніться, залиште цю перевірку, вона не буде ніякої шкоди."
DATABASE_LBL_NOAUTOVALUE="Немає авто значення на нуль"
DATABASE_LBL_NOAUTOVALUE_HELP="Дозволяє відновити столи з автопідготовкою полів, значення яких є нульовою. Магенто і Drupal вимагають того, що для належного відновлення. НЕЕ: За документацію MySQL: ”Сторінка 0 не рекомендована практика."
DATABASE_LBL_REPLACE="Використовуйте REPLACE замість INSERT"
DATABASE_LBL_REPLACE_HELP="Реставраційний скрипт зазвичай використовується для відновлення даних бази даних INSERT. Це не працює добре з даними певних розширень, викликаючи проблеми відновлення. Якщо ви отримуєте помилки відновлення бази, будь ласка, перевірте цю коробку і натисніть кнопку Далі знову."
DATABASE_LBL_FORCEUTF8DB="Примус UTF-8 колація на базі даних"
DATABASE_LBL_FORCEUTF8DB_HELP="При перевірці скрипт відновлення буде намагатися конвертувати типове позначення таблиці в Unicode (UTF-8), як пропонується Joomla!. Це не працює на всіх серверах. Перевірте його, якщо ви отримуєте позначки або зламаний текст замість міжнародних символів."
DATABASE_LBL_FORCEUTF8TABLES="Примус UTF-8 колація на таблицях"
DATABASE_LBL_FORCEUTF8TABLES_HELP="При перевірці сценарії відновлення буде намагатися конвертувати всі текстові поля відновлених таблиць у Unicode (UTF-8). Це завдання, коли ви не можете використовувати параметр вище. Зверніть увагу, що якщо ваше з'єднання бази є будь-яким іншим, ніж UTF-8 ви <em>буде</em> У майбутньому, після оновлення розширення додає нове текстове поле."
DATABASE_LBL_UTF8MB4DETECT="Allow UTF8MB4 автодетекція"
DATABASE_LBL_UTF8MB4DETECT_HELP="Якщо увімкнено і ваш сервер бази даних підтримує UTF8MB4 (UTF-8 Multibyte) він буде використовуватися замість звичайного старого UTF-8. ВАРНУВАННЯ: Тільки використовуйте, якщо ваш сайт був використаний UTF8MB4, коли ви його задбали. Зніміть цей варіант, якщо ви зламали текст після відновлення вашого сайту!"
DATABASE_LBL_CHARSET_CONVERSION="Нормальний набір символів"
DATABASE_LBL_CHARSET_CONVERSION_YES="Увімкнути"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Автодетек (рекомендований)"
DATABASE_LBL_CHARSET_CONVERSION_NO="Вимкнено"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Нормалізація колацій при відновленні різних платформ бази даних або сімей з версіями (наприклад, MariaDB до MySQL). <strong>Автодетект</strong>: Перетворення charset застосовується автоматично, коли скрипт відновлення визначає, що резервне копіювання було створено на різних платформах бази даних або сімействі версій, ніж цільовий сервер. <strong>Увімкнути</strong>: завжди нормалізувати зв’язки незалежно від платформи. <strong>Вимкнено</strong>Якщо ви не є певними, які ви відновлюєте для точного сервера бази даних (MySQL проти MariaDB) та сімейства версій."

DATABASE_HEADER_FINETUNING="Тонкий тюнінг"
DATABASE_MSG_FINETUNING="Тільки змініть ці налаштування, якщо ви хочете зробити це за допомогою нашої підтримки, або якщо відновлення бази даних, здається, одержувати стук. Встановлення значень 5 і 2000 у полях нижче призведе до значно повільного відновлення, але менш ймовірно, не продешево, ненадійного хостингу."
DATABASE_LBL_MAXEXECTIME="Максимальний термін виконання"
DATABASE_LBL_MAXEXECTIME_HELP="Реставрація скрипту розбиває процес відновлення бази в невеликих обробляєхань, щоб уникнути часу сервера. Ця вартість визначає, як довго кожен з цих шматків буде прийматися. Ви можете змінити цю значення, якщо відновлення бази даних не завершено. За замовчуванням 10 секунд."
DATABASE_LBL_THROTTLEMSEC="Час дросель"
DATABASE_LBL_THROTTLEMSEC_HELP="Реставраційний скрипт може бути додатково дросельною швидкістю процесу відновлення бази даних для важкодоступних серверів. Ви можете ввести час дросельності між обробкою шматків в мілісекундах (1/1000 секунди). Наприклад, для того, щоб додати 5 другий час дросельності між кроками вводити 5000 у цій коробці. Значення за замовчуванням 250 повинна працювати на більшості серверів."

DATABASE_LBL_ON_CREATE_ERROR="Стоп на похибці CREATE"
DATABASE_LBL_ON_CREATE_ERROR_HELP="Якщо після того, як відновлення буде негайно припинено, якщо є помилка створення таблиці, подання, функції, запуску або збереженої процедури? Якщо з’являться такі помилки будуть ігноруватися, а відновлення буде проходити з можливими даними корупції та / або проблем на відновленому сайті."
DATABASE_LBL_ON_OTHER_ERROR="Зупинка на інші помилки"
DATABASE_LBL_ON_OTHER_ERROR_HELP="Якщо після того, як відновлення буде негайно припинено, якщо є помилка, яка виконує будь-яку іншу команду бази даних, наприклад, відновлення або видалення даних? Якщо з'являться такі помилки будуть ігноруватися, а відновлення буде проходити з можливими даними корупції та / або проблем на відновленому сайті."

DATABASE_HEADER_DBRESTORE="Відновлення бази даних"
