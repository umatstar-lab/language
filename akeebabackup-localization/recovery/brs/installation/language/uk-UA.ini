SETUP_LBL_HTACCESSCHANGE_LBL=".htaccess Ручка"
SETUP_LBL_HTACCESSCHANGE_DESC="Виберіть те, що робити з <code>.htaccess</code> файл вашого сайту.<br/><strong>Немає змін</strong>. Файл зберігається як-is.<br/><strong>Використання за замовчуванням</strong>. Замінює вміст .htaccess файл на корені вашого сайту з вмістом запасу htaccess.txt які кораблі з Joomla. Старий файл перейменований на htaccess.bak<br/><strong>Вибрані PHP ручні лінії</strong> Видаліть будь-які лінії AddHandler/SetHandler від ваших .htaccess файл. Ці сервери-специфічні директиви, які зазвичай використовуються для застосування конкретної версії PHP на Ваш сайт. Використовуйте при відновленні на інший сервер.<br/><strong>Зареєструватися PHP ручні лінії</strong> Використовуйте лінії AddHandler/SetHandler у вашому струмі .htaccess файл. Використовуйте це, якщо ви повинні встановити різні PHP версія для вашого сайту перед запуском Kickstart або майстра передачі сайту.<br/>"
SETUP_LBL_HTACCESSCHANGE_NONE="Немає змін"
SETUP_LBL_HTACCESSCHANGE_DEFAULT="Використання за замовчуванням"
SETUP_LBL_HTACCESSCHANGE_REMOVEHANDLER="Видалити PHP Лінії обробників"
SETUP_LBL_HTACCESSCHANGE_REPLACEHANDLER="Замініть PHP Лінії обробників"
