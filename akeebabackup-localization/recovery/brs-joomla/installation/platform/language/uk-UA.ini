PUBLICFOLDER_LBL_INFO_HEAD="Joomla!&trade; була встановлена з індивідуальною папкою публічної пошти"
PUBLICFOLDER_LBL_INFO_BODY="Joomla!&trade; було встановлено, щоб використовувати публічну папку (де ваш сайт був подано з: <code>%s</code>) відрізняється від її кореневої папки (де Joomla файли були встановлені: <code>%s</code>)."
PUBLICFOLDER_LBL_USE_SPLIT="Використовуйте користувацьку публічну папку"
PUBLICFOLDER_LBL_BUT_WINDOWS="Ви, однак, відновлення цього сайту на Windows host. Joomla не підтримує функцію публічної папки на Windows. Тому ця функція буде вимкнена, коли ви натискаєте кнопку Далі."
PUBLICFOLDER_LBL_BUT_DIRECTLY="Ви, однак, відновити цей сайт, вилучивши архів резервного копіювання безпосередньо всередині веб-кореневого кореня. Таким чином, ця функція буде відключена, коли ви натискаєте кнопку Далі."
PUBLICFOLDER_LBL_BUT_CUSTOM="Ви, здається, є однакова установка на сервері, який ви відновлюєте цей сайт. Введіть публічний складник у вигляді нижче і натисніть кнопку Далі, щоб переконатися, що всі необхідні файли і папки переміщуються до їх правильного розташування."
PUBLICFOLDER_LBL_OPTIONS_HEADER="Варіанти публічного складання"
PUBLICFOLDER_LBL_NEWPUBLIC="Публічна папка"
PUBLICFOLDER_LBL_NEWPUBLIC_HELP="Введіть абсолютний шлях до папки, де розміщено ваш сайт. Наприклад, <code>%s</code>."
PUBLICFOLDER_ERR_PUBLIC_IS_ROOT="Ви не можете використовувати папку, яку ви відновлюєте Joomla файли в публічну папку. Якщо ви намагаєтеся скасувати налаштування публічної папки, витягніть резервний архів у папку, звідки він буде служити, <em>потім</em> запустити відновлення."

PUBLICFOLDER_ERR_WRONG_USE_PUBLIC="Ваше використання публічних папок не сумісний з вашим поточним середовищем."
