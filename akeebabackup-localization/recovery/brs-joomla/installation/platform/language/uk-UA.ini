PUBLICFOLDER_ERR_PUBLIC_UNWRITEABLE="Ви вибрали публічний складник, який не записується."

SETUP_LBL_NOSA_HEAD="Суперкористувача не знайдено"
SETUP_LBL_NOSA_DESC="Це аномалій, дуже проблемної ситуації. Не маючи Super User на відновленому сайті, не можна приймати будь-які адміністративні дії на ньому. У так багато слів, ваш відновлений сайт буде повністю непристойним."
SETUP_LBL_NOSA_ACTION_REQUIRED="Потрібні дії"
SETUP_LBL_NOSA_ACTION_SUMMARY="Переконайтеся, що <code>#__users</code>, і <code>#__user_usergroup_map</code> таблиці були повернені вгору, <strong>і відновлені</strong> в повній мірі."
SETUP_LBL_NOSA_ACTION_INFO="Повернутися до початку відновлення за допомогою попередніх кнопок. Коли ви перебуваєте на стадії відновлення бази даних бази даних <code>site</code> , будь ласка, переконайтеся, що не використовуйте функцію, щоб вибрати, які таблиці для відновлення. Якщо ви <em>мають</em> для використання цієї функції, наприклад, для роботи навколо проблеми відновлення бази даних, будь ласка, переконайтеся, що виберіть <code>#__users</code> і <code>#__user_usergroup_map</code> таблиці."

