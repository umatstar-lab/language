PLG_WEBSERVICES_AKEEBABACKUP="Веб-службы — Akeeba Backup"
PLG_WEBSERVICES_AKEEBABACKUP_XML_DESCRIPTION="Позволяет поддерживать Akeeba JSON API v3 на вашем сайте, который позволяет удаленно принимать и управлять резервными копиями с помощью совместимого программного обеспечения и приложений.<br/><strong>Важно!</strong> Это требует беспрепятственного доступа к вашему сайту. Joomla API-приложение (Application) <code>/api</code> Если вы отключили доступ к папке. Joomla API-приложения, включающего этот плагин, будет недостаточно. Пожалуйста, прочитайте документацию"
