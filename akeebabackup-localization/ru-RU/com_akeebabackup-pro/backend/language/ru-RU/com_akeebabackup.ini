COM_AKEEBABACKUP_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Это токен Refresh, который соединяет Akeeba Backup Это для Dropbox. <strong>сайтоспецифичный</strong> Если у вас есть несколько сайтов, вы должны использовать кнопки шага 1 на каждом сайте, который вы хотите авторизовать. <strong>Не надо.</strong> скопируйте токен доступа или обновления на нескольких сайтах. Это приведет к тому, что аутентификация Dropbox выйдет из синхронизации, и вам нужно будет повторно подключить все свои сайты с Dropbox."
