COM_AKEEBABACKUP_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Когда эта коробка не проверена (по умолчанию), и шаг резервного копирования заканчивается за меньшее время, чем настроенное минимальное время выполнения. Akeeba Backup Это может привести к тому, что некоторые очень ограничительные серверы убьют вашу резервную копию. Проверка этого окна будет реализовывать период ожидания в браузере, работая вокруг этого ограничения. ВАЖНО: Эта опция применяется только к резервным копиям. Фронт-энд, JSON Резервные копии API (удаленные) и Command-Line (CLI) всегда реализуют ожидание на стороне сервера."
