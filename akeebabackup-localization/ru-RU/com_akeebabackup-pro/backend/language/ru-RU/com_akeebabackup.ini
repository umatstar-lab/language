COM_AKEEBABACKUP_CONFIG_ADVANCED_SBALF_DESC="Akeeba Backup Если вы включите эту опцию, вы прервете этап обработки после архивирования большого файла. Akeeba Backup Однако это может привести к тайм-ауту или ошибкам внутреннего сервера."
