COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Загружает архив резервного копирования в Google Storage с помощью современных JSON API. Это рекомендуемая интеграция с Google Storage.<br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Загрузить в Google Storage ()JSON API)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Загружает архив резервных копий в Google Storage с помощью устаревшей эмуляции S3 API. Это обесценивается и будет удалено в будущем. Пожалуйста, используйте JSON Вместо этого API.<br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
