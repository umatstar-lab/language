COM_AKEEBABACKUP_CONFIG_ARCHIVENAME_DESCRIPTION="Шаблон имени архива резервной копии, если применимо. Доступны следующие макросы:<ul><li><strong>[HOST]</strong> Имя хоста. ВНИМАНИЕ! Этот макрос не работает в режиме CRON.</li><li><strong>[DATE]</strong> Текущая дата</li><li><strong>[TIME_TZ]</strong> Текущее время и часовой пояс</li></ul>Другие макросы описаны в документации."
