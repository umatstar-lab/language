COM_AKEEBABACKUP_CONFIG_FORCEDBACKUPTZ_DESC="Дата и время резервного копирования - как записано в имени файла, описании по умолчанию и электронных письмах - будут выражены в этом часовом поясе. Эти параметры влияют на все источники резервного копирования, то есть все резервные копии, независимо от того, как они принимаются (через Akeeba Backup Сама по себе, удаленная JSON API и т.д."
COM_AKEEBABACKUP_CONFIG_FORCEDBACKUPTZ_LABEL="Резервный часовой пояс"
COM_AKEEBABACKUP_CONFIG_FRONTENDEMAIL_DESC="Отправьте уведомление по электронной почте после резервного копирования с помощью Front-end Backup (Legacy API) или JSON Функция API."
