COM_AKEEBABACKUP_CONFIG_ADVANCED_SBBD_DESC="Akeeba Backup Это улучшает многословность процесса, но увеличивает время резервного копирования на 10-20 секунд. Когда вы включаете эту опцию, Akeeba Backup Однако, вы можете испытать непристойное поведение в шагах, описанных на резервной странице."
