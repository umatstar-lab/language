COM_AKEEBABACKUP_SCHEDULE_LBL_CHECK_UPLOADS="Проверьте Backup Uploads"
COM_AKEEBABACKUP_SCHEDULE_LBL_CHECK_UPLOADS_HEADERINFO="<p>Когда резервная копия не загружает резервную копию в настроенное удаленное хранилище, это обычно не считается сбоем резервной копии (если вы явно не выбрали для его обработки). Это потому, что архив резервной копии все еще существует на вашем сервере. Однако вам нужно вернуться на свой сайт и перезагрузить загрузку со страницы управления резервными копиями - возможно, также исправить любые проблемы с подключением к удаленному хранилищу.</p></p>Типичная проблема заключается в том, что вы можете не знать, что загрузка не удалась. Вот где вступает в игру проверка резервных загрузок. Запланируйте ее запуск после того, как ваши запланированные резервные копии обычно закончатся, и она отправит вам электронное письмо, если какая-либо из ваших резервных копий была сделана с момента последнего запуска проверки не удалось загрузить на его настроенное удаленное хранилище.</p><p>Вы можете запланировать эту проверку с помощью различных методов, как и сама резервная копия. Ниже вы найдете больше информации о каждом методе планирования, доступном для проверки загрузки резервных копий. Если вы не уверены, какой из них использовать, мы рекомендуем вам использовать тот же метод планирования, что и ваши резервные копии.</p>"


