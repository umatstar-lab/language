COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Заполняется автоматически при завершении этапа аутентификации 1 выше. Если вы связываете другой сайт с той же учетной записью Google Drive, НЕ копируйте токен доступа и НЕ запускайте аутентификацию. Вместо этого просто скопируйте Токен обновления с предыдущего сайта на этот."
