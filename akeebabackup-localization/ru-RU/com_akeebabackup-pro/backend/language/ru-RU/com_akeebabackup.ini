COM_AKEEBABACKUP_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Когда вы включаете эту опцию Akeeba Backup Вам нужно будет использовать меньший размер части для настройки раздельных архивов в конфигурации Archiver Engine, чтобы предотвратить выгрузку из тайминга, что приведет к сбою процесса резервного копирования."
