COM_AKEEBABACKUP_CPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Важно:</strong> Если Joomla Уже установлено, что существуют обновления для Akeeba Backup Перед тем, как ввести свой идентификатор загрузки <em>может не иметь возможности скачать их</em> Даже после того, как вы ввели свой идентификатор загрузки из-за нескольких давних Joomla баги. В этом случае, пожалуйста, скачайте ZIP-файл последней версии с нашего сайта. JoomlaСистемное меню, найдите панель Установка, нажмите на Расширения, нажмите на вкладку Загрузить пакет Файл и установите ZIP-файл, который вы загрузили <strong>дважды</strong> в ряд, <strong>без</strong> удаление Akeeba Backup Двойная установка требуется для устранения другой давней ошибки в Joomla Это иногда мешает ему копировать все обновленные файлы при установке обновления расширения."
