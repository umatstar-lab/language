COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Этот метод использует публичный URL и секретный ключ для запуска резервной копии вашего сайта. HTTP Обратите внимание, что большинство хостов URL- основанные на «CRON» рабочие места, а также большинство сторонних URL- на основе услуг CRON, не поддерживают HTTP Если примеры с wget и curl ниже не работают для вас, пожалуйста, используйте фронтальную резервную копию. URL С очень дешевым сервисом webcron.org."
