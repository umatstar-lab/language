COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_IDRIVESYNC_DESCRIPTION="Загружает архив резервного копирования в iDriveSync EVS (iDriveSync.com).<br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
