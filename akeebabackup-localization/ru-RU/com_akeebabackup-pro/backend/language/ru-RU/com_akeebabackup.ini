COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_DELETEORBEHACKED="Пока ты не сделаешь это, мы <strong>Очень быстро возвращается</strong> не делать резервную копию вашего сайта и, если у вас уже есть, удалить все архивы резервного копирования и файлы журналов резервного копирования. <strong>Нежелание следовать этим инструкциям будет очень похоже на то, что в вашем месте будут стеснены (испорчены) и ваши бекапы будут почти невозможны.</strong>"
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_FILEREADABLE="Akeeba Backup Выявлено, что ваш каталог резервного вывода <code>%s</code> Он находится под веб-корнем вашего сайта. Его содержимое, включая резервные архивы, доступно через Интернет. Однако невозможно перечислить файлы в каталоге с помощью веб-браузера. <strong>Это может быть проблемой безопасности</strong>Злоумышленник может угадать имя архива резервного копирования и загрузить его напрямую, минуя безопасность вашего сайта."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_FIX_RANDOM="Ваше имя файла «Backup output» будет изменено, чтобы включить <code>[RANDOM]</code> Это делает угадывание имен файлов резервного копирования практически невозможным, добавляя 16 различных случайных букв и / или цифр в имя файла архива резервного копирования каждый раз, когда вы делаете резервную копию."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="A <code>.htaccess</code> и а <code>web.config</code> На большинстве серверов этого достаточно, чтобы предотвратить прямые веб-загрузки любого файла внутри него и отключить список его файлов. У нас также есть решение для серверов, где эти специальные файлы не имеют эффекта. Еще три файла называются <code>index.php</code>, <code>index.html</code> и <code>index.htm</code> Эти индексные файлы не позволяют веб-серверу перечислять имена архивов резервных копий и файлов журналов резервных копий."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_ISSYSTEM="Кроме того, ваш каталог вывода такой же, как или подкаталог папки, которая используется Joomla и его расширения для собственных общедоступных файлов."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="Вы должны перейти на страницу конфигурации Akeeba Backup Выберите другой выходной каталог."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_LISTABLE="Akeeba Backup Выявлено, что ваш каталог резервного вывода <code>%s</code> Он находится под веб-корнем вашего сайта. Его содержимое, включая ваши архивы резервного копирования, доступно через Интернет. Кроме того, можно перечислить файлы в каталоге, т.е. он дает список ваших архивов резервного копирования при доступе к нему с помощью веб-браузера. <strong>Это серьезная проблема безопасности</strong>Злоумышленник может получить доступ к этой папке из веб-браузера и загрузить ваши резервные архивы напрямую, минуя безопасность вашего сайта."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_TRASHHOST="К сожалению, ваш сервер не поддерживает какой-либо разумный способ защиты каталога. Что бы мы ни делали, он всегда будет перечислять имена файлов, которые он содержит, и позволит вам загрузить их из браузера. Ваш единственный вариант - создать каталог вывода резервного копирования выше корня вашего сайта."
