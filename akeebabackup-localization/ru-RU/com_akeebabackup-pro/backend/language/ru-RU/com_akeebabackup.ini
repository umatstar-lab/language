COM_AKEEBABACKUP_CONFIG_ADVANCED_SBPA_DESC="Akeeba Backup Это не совсем точный расчет, который может привести к замедлению резервного копирования. Когда вы включите эту опцию, Akeeba Backup Однако это может привести к тайм-ауту или ошибкам внутреннего сервера."
