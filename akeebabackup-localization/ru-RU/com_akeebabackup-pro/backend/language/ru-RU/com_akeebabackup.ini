COM_AKEEBABACKUP_CONFIG_FEEMAILBODY_DESC="Оставьте поле пустым, чтобы использовать текст по умолчанию. Можно использовать все переменные Akeeba Backup для имён архивов, например [HOST] и [DATE]. Также доступны [PROFILENUMBER] для номера текущего профиля, [PROFILENAME] для его названия, [PARTCOUNT] для общего числа созданных частей архива, [FILELIST] для списка частей и [REMOTESTATUS] для статуса отправки в удалённое хранилище."
