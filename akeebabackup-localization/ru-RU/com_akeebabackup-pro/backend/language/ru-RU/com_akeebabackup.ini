COM_AKEEBABACKUP_CONFIG_BACKEND_LOCALTIME_DESC="Показывать время начала резервного копирования на странице управления копиями в часовом поясе текущего пользователя? Если выбрать «Нет», время будет показано в GMT. Эта настройка не влияет на переменные [DATE] и [TIME] в имени файла или описании по умолчанию. Для них используется параметр «Часовой пояс резервного копирования»."
