COM_AKEEBABACKUP_CONFIG_EXTENDEDINSERTS_DESCRIPTION="При проверке сброс базы данных будет производиться из расширенных выписок INSERT, то есть одного заявления для восстановления нескольких строк данных. Крайне рекомендуется поддерживать эту опцию включенной, поскольку она ускорит процесс восстановления и работает вокруг ограничений квоты запросов на ограничительных хостах."
