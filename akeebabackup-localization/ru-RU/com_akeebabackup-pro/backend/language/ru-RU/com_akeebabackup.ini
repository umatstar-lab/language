COM_AKEEBABACKUP_CPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="В качестве альтернативы, нажмите кнопку ниже, чтобы сбросить секретное слово к предложенному значению. <code>%s</code> В любом случае вам нужно будет обновить свои удаленные службы резервного копирования и / или задания CRON с помощью нового Секретного слова."
