COM_AKEEBABACKUP_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="Должен ли я предоставить пользователям, восстанавливающим сайт, возможность удалить все до выдачи архива? Эта опция применяется только к профессиональной версии нашего программного обеспечения. Предупреждение! Это чрезвычайно опасно. ЧИТАЙТЕ ДОКУМЕНТУЦИЮ ОТНОШЕННО ДО ВНИМАНИЯ. Если вы используете этот объект во время восстановления, вы имеете право требовать поддержки и принимать все решения и ответственность."
