COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BODY="«Задача» – Akeeba BackupПлагин должен быть включен для JoomlaЗапланированные задачи, чтобы знать, как запускать резервные копии с Akeeba BackupПожалуйста, перейдите в System, Manage, Plugins и включите плагин. Альтернативно нажмите следующую кнопку для редактирования плагина напрямую."
