COM_AKEEBABACKUP_CONFIG_ARCHIVERENGINE_TITLE="Архивный движок"
COM_AKEEBABACKUP_CONFIG_AUTORESUME_DESCRIPTION="Когда этот вариант не проверяется Akeeba Backup - остановит резервную копию, когда сервер ответит на ошибку. Akeeba Backup Это относится только к резервным копиям. Это также не позволит вам успешно возобновить все резервные копии, которые приводят к ошибке: могут быть возобновлены только попытки резервного копирования, временно заблокированные ограничениями использования серверного процессора или проблемами с отключением сети."
COM_AKEEBABACKUP_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Сколько раз должно быть Akeeba Backup Повторное восстановление резервной копии, прежде чем, наконец, сдаться. от 3 до 5 повторных записей лучше всего работают на большинстве серверов."
COM_AKEEBABACKUP_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Максимальные повторы шага резервного копирования после ошибки AJAX"
COM_AKEEBABACKUP_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Желательно установить это на 30 секунд или более (120 секунд рекомендуется в большинстве случаев), чтобы дать вашему серверу необходимое время для разблокировки процесса резервного копирования до того, как он начнет работать. Akeeba Backup Пытается завершить его."
