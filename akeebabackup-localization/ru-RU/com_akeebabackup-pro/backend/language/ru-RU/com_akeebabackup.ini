COM_AKEEBABACKUP_SCHEDULE_LBL_ALTCLICRON="Альтернативные командно-линейные CRON"
COM_AKEEBABACKUP_SCHEDULE_LBL_ALTCLICRON_INFO="Этот метод рекомендуется только в том случае, если обычная работа командной строки CRON не завершена. JoomlaКонсольное приложение, оно будет проходить через JoomlaВеб-приложение - использование Akeeba BackupФронтальный метод резервного копирования — что делает его медленнее, чем родной метод CLI."
COM_AKEEBABACKUP_SCHEDULE_LBL_CHECKHEADERINFO="<p>Когда запланированное резервное копирование не удается, это обычно означает, что PHP перестали работать до того, как резервная копия будет завершена. Akeeba Backup не может уведомить вас о сбое резервного копирования так же, как он уведомляет вас об успешном завершении резервного копирования или с предупреждениями.</p><p>Чтобы решить эту проблему, вы можете запланировать последние проверки резервного копирования для запуска после ожидаемого конца вашего резервного запуска. Не уверен, когда это будет? В идеале это должна быть длина последнего успешного резервного копирования, записанного на странице управления резервным копированием плюс полчаса.</p><p>Вы можете запланировать эту проверку с помощью различных методов, как и сама резервная копия. Ниже вы найдете больше информации о каждом методе планирования, доступном для проверки резервного копирования. Если вы не уверены, какой из них использовать, мы рекомендуем вам использовать тот же метод планирования, что и ваши резервные копии.</p>"
COM_AKEEBABACKUP_SCHEDULE_LBL_CHECK_BACKUPS="Проверить состояние"
COM_AKEEBABACKUP_SCHEDULE_LBL_CLICRON="Command-Line CRON (рекомендуется)"
COM_AKEEBABACKUP_SCHEDULE_LBL_CLICRON_INFO="Это рекомендуемый метод для всех серверов, поддерживающих работу командной строки CRON. JoomlaКонсоль (CLI) — вместо JoomlaВеб-приложение ! - достижение максимальной скорости резервного копирования."
COM_AKEEBABACKUP_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Важный"
COM_AKEEBABACKUP_SCHEDULE_LBL_CLIGENERICINFO="Не забудьте заменить <em>%s</em> Реальный путь к хозяину PHP <strong>Интерфейс командной строки (Command Line Interface)</strong> Помните, что вы должны использовать PHP CLI Executable (исполняемый); PHP CGI (Common Gateway Interface) — исполняемая воля <em>не</em> работать с JoomlaЕсли вы не уверены, что это значит, пожалуйста, проконсультируйтесь с вашим хостом. Они единственные люди, которые могут предоставить эту информацию."
COM_AKEEBABACKUP_SCHEDULE_LBL_ACCURATEINFO="Akeeba Backup обнаружив, что <em>наиболее вероятный</em> Путь к PHP CLI - это <code>%s</code> и использовали его в командной строке, показанной выше. Если это не сработает, пожалуйста, замените <code>%1$s</code> Реальный путь к хозяину PHP <strong>Интерфейс командной строки (Command Line Interface)</strong> Это часть информации, которую ваш хост сможет предоставить."
