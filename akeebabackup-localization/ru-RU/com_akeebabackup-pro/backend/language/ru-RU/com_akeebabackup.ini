COM_AKEEBABACKUP_CONFIG_ADVANCED_SBBLF_DESC="Akeeba Backup Вы преодолеете этап обработки перед архивированием большого файла. Когда вы включите эту опцию, Akeeba Backup Однако это может привести к тайм-ауту или ошибкам внутреннего сервера."
