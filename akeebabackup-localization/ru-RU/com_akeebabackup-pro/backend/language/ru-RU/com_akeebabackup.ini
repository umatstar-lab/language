COM_AKEEBABACKUP_BACKUP_ANGIE_PASSWORD_WARNING_1="The Akeeba Backup Сценарий восстановления будет доступен только в том случае, если вы предоставите пароль, который вы настроили на предыдущей странице, прежде чем нажать кнопку «Резервное копирование сейчас». Если вы не помните настройку пароля, ваш браузер автоматически заполнил пароль на странице «Конфигурация» <strong>Не спрашивая тебя</strong>Это делается многими менеджерами паролей и браузерами."
COM_AKEEBABACKUP_BACKUP_ANGIE_PASSWORD_WARNING_2="Современные браузеры и менеджеры паролей не позволяют нам переопределить это поведение. Мы поставили защиту JavaScript против такого рода неконсенсуального автозаполнения поля пароля на странице Конфигурации. Однако, если сохранить страницу Конфигурации примерно через полсекунды после ее загрузки, эта защита не будет иметь шансов запуститься."
