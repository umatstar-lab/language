COM_AKEEBABACKUP_LBL_CPANEL_UPGRADED_FROM_AKEEBABACKUP8_BODY="Вы уже перенесли настройки из более старой версии Akeeba BackupЕсли вы хотите запустить миграцию снова, нажмите «Настройки миграции». Если вы удовлетворены миграцией, нажмите «Покажите мне, что удалить», чтобы открыть JoomlaСтраница «Расширения: управление» для старых Akeeba Backup расширение; затем вы можете выбрать его и нажать на Uninstall, чтобы удалить его."
COM_AKEEBABACKUP_LBL_CPANEL_UPGRADED_FROM_AKEEBABACKUP8_NOTE="Если деинсталляция старой версии Akeeba Backup Пожалуйста, сделайте следующее. Во-первых, установите последнюю версию Akeeba Backup 8. Затем установите последнюю версию Akeeba Backup для Joomla 4.Возвращайтесь на эту страницу и нажмите «Покажите мне, что удалить». Вы сможете удалить ее просто отлично. Обратите внимание, что сообщения о невозможности удаления FOF или FEF могут быть проигнорированы; Akeeba Backup 8 будет удалена независимо от этих сообщений."
