COM_AKEEBABACKUP_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Введите ключ приложения Backblaze. Вы можете найти эту информацию в <a href='https://secure.backblaze.com/b2_buckets.htm'>Страница учетной записи Backblaze</a> После нажатия на кнопку «Показать идентификатор учетной записи и ключ приложения». <strong>WARNING</strong>Это показано вам только один раз Backblaze. Чтобы снова отобразить его, вам придется регенерировать ключ приложения, вызывая ВСЕ ранее связанные экземпляры Akeeba Backup Чтобы не запутаться, пока не войдешь туда <em>новый</em> Ключ приложения."
