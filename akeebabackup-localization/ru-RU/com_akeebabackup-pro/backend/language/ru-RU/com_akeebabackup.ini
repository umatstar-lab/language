COM_AKEEBABACKUP_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Всегда"
COM_AKEEBABACKUP_CONFIG_FRONTEND_EMAIL_WHEN_DESC="Когда я должен отправить электронное письмо о завершении резервного копирования? Всегда означает каждый раз, когда резервное копирование завершено. Неудачная загрузка означает, что электронное письмо отправляется только в том случае, если резервное копирование завершено, но загрузка в удаленное хранилище не была успешно завершена. Если резервное копирование не удается, эта функция не может отправлять электронное письмо; проверьте страницу автоматического резервного копирования расписания для получения информации о неудавшемся резервном копировании."
COM_AKEEBABACKUP_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Скачать Failed"
COM_AKEEBABACKUP_CONFIG_FRONTEND_EMAIL_WHEN_LABEL="Когда отправлять e-mail"
COM_AKEEBABACKUP_CONFIG_FRONTEND_HEADER_DESC="<strong>Эти варианты применимы только к Akeeba Backup Professional</strong>Управляйте удаленными и запланированными функциями Akeeba BackupДля получения дополнительной информации о резервных копиях расписания, пожалуйста, проверьте страницу «Информация о расписании» в Akeeba Backup Professional или нашей документации."
