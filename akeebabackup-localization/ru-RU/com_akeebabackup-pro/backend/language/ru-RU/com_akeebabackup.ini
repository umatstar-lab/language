COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_INFO="Вы можете создавать задачи резервного копирования с помощью JoomlaПожалуйста, сначала прочитайте документацию, чтобы понять компромиссы и потенциальные проблемы в зависимости от того, как вы решите запустить JoomlaЗапланированные задания."
