COM_AKEEBABACKUP_UPGRADE_LBL_WHAT_IT_DOES="Akeeba Backup для Joomla! будет импортировать настройки конфигурации, профили резервного копирования, историю резервного копирования и <em>некоторые</em> архивных копий (те, которые находятся в <code>administrator/components/com_akeeba/backup</code>) из более старой версии Akeeba Backup (7.x или 8.x) уже установлен на вашем сайте, переписывая все существующие даты. Вы должны использовать эту функцию только при первой установке Akeeba Backup для JoomlaЧтобы избежать потери данных."
