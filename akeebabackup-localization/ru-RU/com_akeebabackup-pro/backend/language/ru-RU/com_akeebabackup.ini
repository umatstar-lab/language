COM_AKEEBABACKUP_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Часовой пояс"
COM_AKEEBABACKUP_CONFIG_BACKEND_TIMEZONETEXT_DESC="Суффикс Timezone для отображения рядом с временем начала резервного копирования на странице «Управление резервными копиями».<br/>Нет: суффикс не отображается (не рекомендуется).<br/>Часовой пояс: сокращенный часовой пояс, например, CEST для летнего времени Центральной Европы.<br/>GMT Offset: смещение из часового пояса GMT, например, GMT+01:00 (= на два часа раньше GMT, т.е. стандартное время Центральной Европы). Обратите внимание, что в дневное время экономия смещения GMT составляет +1 час до обычного часового пояса. Эта разница смещения будет показана в этом формате."
