COM_AKEEBABACKUP_CPANEL_MSG_CLOUDFLARE_WARN1="Мы обнаружили, что CloudFlare Rocket Loader включен на вашем сайте. Эта функция будет мешать JavaScript на вашем сайте, смешивая скрипты заказов загружаются, что вызывает ошибки JavaScript. Пожалуйста, отключите функцию Rocket Loader, чтобы позволить Joomla”s” и Akeeba BackupДля получения дополнительной информации и инструкций, пожалуйста, обратитесь к JavaScript. <a href='%s' target='_blank'>Документация CloudFlare</a>."
COM_AKEEBABACKUP_CPANEL_MSG_CLOUDFLARE_WARN="Ракетный погрузчик CloudFlare не позволит вам использовать Joomla!&trade; и Akeeba Backup правильно"
