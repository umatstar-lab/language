COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Загружает резервный архив в хранилище объектов OVH. <br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Загрузить в OVH Object Storage"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_PCLOUD_DESCRIPTION="Загружает архив резервных копий в pCloud. Этот ПОСТОЯЩИЙ ЭНГИН УДАЛЕН. Аутентификация не работает из-за вопросов на API-сервере pCloud."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_PCLOUD_TITLE="Загрузить в pCloud (не использовать - будет удалено)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Он позволяет использовать как новую (AWS4) аутентификацию, необходимую для нового местоположения S3, так и старую (AWS2) аутентификацию, необходимую для сторонних поставщиков хранения, предлагающих S3-совместимый API.<br/><strong>Если вы отключаете многочастные загрузки, не забудьте установить размер разделённого архива 2-30 Мб или вы рискуете сбоем резервного копирования из-за тайм-аута.</strong><br/>Если вы хотите использовать Amazon STS вместо ключа доступа и секретного ключа, пожалуйста, прочитайте документацию."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_S3_TITLE="Скачать Amazon S3"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Загружает архив резервного копирования на удаленный сервер SFTP (SSH). Это передача файлов через SSH с использованием протокола под названием SFTP. <em>совершенно иной</em> то FTP и FTPS.<br/>Этот механизм постобработки использует cURL для передачи данных, библиотеку, которая совместима с широким спектром SFTP-серверов.<br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Загрузка на удаленный сервер SFTP (SSH) с помощью cURL"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Загружает архив резервного копирования на удаленный сервер SFTP (SSH). Это передача файлов через SSH с использованием протокола под названием SFTP. <em>совершенно иной</em> то FTP и FTPS.<br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Загрузить на удаленный сервер SFTP (SSH)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="SugarSync прекратила свою работу в 2024 году. Хотя их API-документация и ключевые страницы доступа по-прежнему находятся в сети, конечные точки обслуживания больше не отвечают и просто выключают время. Не используйте этот метод загрузки. Он будет удален из приложения. Akeeba Backup до конца 2026 года."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Скачать SugarSync (Dead - Will Be Remove)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SWIFT_DESCRIPTION="Загружает архив резервного копирования на любой сервер хранения объектов OpenStack Swift, например, созданный с помощью дистрибутива Ubuntu OpenStack или других частных облаков. НЕ используйте этот метод с помощью RackSpace CloudFiles! CloudFiles использует пользовательский метод аутентификации, который несовместим с службой идентификации Keystone OpenStack (что буквально используется в любой другой реализации OpenStack).<br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Загрузить в OpenStack Swift объект хранения"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Загружает архив резервного копирования в любую службу хранения, поддерживающую протокол WebDAV.<br/><strong>Не забудьте установить раздельный архив размером 2-30 Мб или вы рискуете получить отказ резервного копирования из-за тайм-аута.</strong>"
