COM_AKEEBABACKUP_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Немедленно останавливает процесс резервного копирования, помечая его как неудачный, если возникает ошибка загрузки. <strong>Этот вариант может быть вводящим в заблуждение и опасным.</strong> У вас может быть полное, действительное резервное копирование, которое просто не удалось загрузить полностью или частично. Включение этой опции удалит оставшиеся архивные файлы резервного копирования с вашего сервера и оставит после себя любые архивные файлы (частично), загруженные в удаленное хранилище. Другими словами, у вас остается очень мало случаев использования, когда это имеет больше смысла, чем поведение по умолчанию, которое позволяет вам возобновить загрузку архивного файла резервного копирования через страницу управления резервным копированием. В результате мы настоятельно рекомендуем, чтобы эта опция была включена только опытными пользователями, которые полностью понимают последствия этого."
