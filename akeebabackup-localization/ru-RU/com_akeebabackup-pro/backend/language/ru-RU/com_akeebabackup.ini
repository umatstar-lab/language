COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="Секретный ключ из инструмента управления ключами Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Секретный ключ"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Если же он будет безопасным, тоHTTPS) соединение будет использоваться при загрузке ваших файлов. Хотя оно повышает безопасность передаваемых данных, оно также увеличивает вероятность отказа резервного копирования из-за тайм-аута."
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEUSESSL_TITLE="Используйте SSL"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Хранение Coldline"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Измените класс хранения загруженных архивов резервного копирования. «Никакой» означает, что файлы будут храниться с классом хранения по умолчанию, указанным в вашем ведре. Пожалуйста, обратите внимание, что варианты, отличные от стандарта, могут быть дешевле для хранения, но они могут понести дополнительные сборы, если вы загрузите их или удалите. Пожалуйста, проконсультируйтесь с Google для информации о ценах."
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Ближайшее хранение"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Нет (пусть ведро решает)"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_STANDARD="Стандартное хранение"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Класс хранения"
COM_AKEEBABACKUP_CONFIG_HEADER_BASIC="Базовая конфигурация"
COM_AKEEBABACKUP_CONFIG_HEADER_CONFWIZ="Позволь Akeeba Backup Настроить себя?"
COM_AKEEBABACKUP_CONFIG_HEADER_OPTIONALFILTERS="Дополнительные фильтры"
COM_AKEEBABACKUP_CONFIG_HEADER_QUOTA="Управление квотами"
COM_AKEEBABACKUP_CONFIG_HEADER_TUNING="Отличная настройка"
COM_AKEEBABACKUP_CONFIG_INSTALLER_DESCRIPTION="При выполнении полного резервного копирования сайта, Akeeba Backup Встраивает скрипт восстановления, определенный здесь, в архив. Это позволяет восстановить ваш сайт с нуля, без необходимости установки вашей CMS или Akeeba BackupДаже если ваш сайт или сервер полностью разрушен."
COM_AKEEBABACKUP_CONFIG_INSTALLER_TITLE="Встроенный сценарий восстановления"
COM_AKEEBABACKUP_CONFIG_JPS_KEY_DESCRIPTION="Этот ключ будет использоваться для шифрования содержимого вашего архива. Ключ чувствительный к делу, т.е. ABC, abc и Abc - это три разных пароля. Храните копию пароля в безопасном месте! Если вы его потеряете, нет способа восстановить его."
COM_AKEEBABACKUP_CONFIG_JPS_KEY_TITLE="Ключ шифрования"
COM_AKEEBABACKUP_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="При включении (по умолчанию) ваш пароль будет расширен до криптографического ключа, используемого во всем архиве. Это быстро, но в очень маловероятном случае, если злоумышленнику с достаточными ресурсами удастся перепроектировать криптографический ключ из одного зашифрованного блока в файле - без грубого принуждения самого вашего пароля - они могут расшифровать весь резервный архив. Когда отключен другой криптографический ключ будет получен из вашего пароля на каждом зашифрованном блоке, который намного медленнее, но защищает вас от этого типа атаки, требуя от злоумышленника грубой силы пароля, который намного медленнее."
COM_AKEEBABACKUP_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Расширение ключа Archivewide"
COM_AKEEBABACKUP_CONFIG_JSONAPI_ENABLED_DESC="The Akeeba Backup JSON API позволяет брать и управлять резервными копиями, а также управлять Akeeba Backup Вы должны включить эту опцию, если вы планируете принимать, загружать или управлять резервными копиями с помощью JSON API Secret Word, например, Akeeba Remote CLI, Akeeba Услуги UNiTE и резервного планирования.<br><br>Эта опция контролирует только аутентификацию с помощью JSON Секретное слово API. JSON API с помощью a Joomla Токен API контролируется путем включения или отключения «Веб-сервисов». Akeeba Backup”Плагин.<br><br><strong>Записка о безопасности:</strong> тот JSON API Secret Word предоставляет полный и неограниченный доступ к программному обеспечению Akeeba Backup - эквивалентно Супер Пользователю, управляющему компонентом вручную. Он может читать, создавать, загружать и удалять резервные копии и изменять каждый Akeeba Backup Относитесь к нему с той же осторожностью, что и к паролю Super User: держите его в секрете, используйте длинное и случайное значение и включайте его только тогда, когда вам это действительно нужно. Joomla Токен API, напротив, ограничен тем, что его пользователю разрешено делать в Akeeba Backup."
COM_AKEEBABACKUP_CONFIG_JSONAPI_ENABLED_LABEL="Включать JSON API (дистанционное резервное копирование)"
COM_AKEEBABACKUP_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Когда каталог содержит такое количество файлов или каталогов, он считается \"большой\"Следовательно, Akeeba Backup На следующем шаге мы попытаемся повторно отсканировать резервное копирование, чтобы избежать тайм-аута. Слишком малая величина заставит резервное копирование значительно замедлиться. Увеличьте - если вы не получите ошибки тайм-аута - чтобы ускорить резервное копирование."
COM_AKEEBABACKUP_CONFIG_LARGEDIRTHRESHOLD_TITLE="Большой порог директории"
COM_AKEEBABACKUP_CONFIG_LARGEFILE_DESCRIPTION="Файлы, превышающие этот порог, будут упакованы на своем собственном шаге, чтобы предотвратить возможность тайм-аута. Значения от 2 до 10 Мб лучше всего работают на большинстве серверов."
COM_AKEEBABACKUP_CONFIG_LARGEFILE_TITLE="Большой файловый порог"
COM_AKEEBABACKUP_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Сколько каталогов сканировать на каждом шаге. Рекомендуемая настройка: 50. Большие значения делают резервную копию немного быстрее, но с большей вероятностью отсчитывают время."
COM_AKEEBABACKUP_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Сканирование каталога размером партии"
COM_AKEEBABACKUP_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Сколько файлов сканировать и сжимать на каждом шаге. Рекомендуемая настройка: 100. Большие значения делают резервное копирование немного быстрее, но с большей вероятностью отсчитывает время или заканчивается память."
COM_AKEEBABACKUP_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Размер пакета для сканирования файлов"
COM_AKEEBABACKUP_CONFIG_LBL_CONFWIZ_AFTER="После Akeeba Backup Закончив конфигурацию, вы можете взять резервную копию или тонко настроить ее конфигурацию вручную."
COM_AKEEBABACKUP_CONFIG_LBL_CONFWIZ_INTRO="Похоже, что вы не настроили Akeeba Backup Нажмите на кнопку Configuration Wizard ниже, чтобы позволить ему настроить себя."
COM_AKEEBABACKUP_CONFIG_LEGACYAPI_ENABLED_DESC="Legacy Front-end Backup API позволяет выполнять запланированные резервные копии с помощью URL Вы должны включить эту опцию, если вы планируете делать резервные копии с сервером хоста CRON с использованием wget или curl; или когда вы планируете использовать стороннюю службу CRON, такую как WebCRON.org. Akeeba Backup JSON Вместо этого API — это гораздо более безопасные варианты."
COM_AKEEBABACKUP_CONFIG_LEGACYAPI_ENABLED_LABEL="Включите интерфейс резервного копирования Legacy Front-end (удаленные задания CRON)"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_DEBUG="Вся информация и отладка"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_DESCRIPTION="Эта опция определяет, насколько многословным будет журнал резервного копирования."
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_ERROR="Ошибки только"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_INFO="Вся информация"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_NONE="Ни одного"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_TITLE="Лог-уровень"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_WARNING="Ошибки и предупреждения"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Автоматически удаляйте старые резервные копии, основываясь на том, когда они были приняты. ПРЕДУПРЕЖДЕНИЕ: Устранение этого приведет к тому, что все другие приседания Куоты (счет и размер) будут незамеченными."
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Максимальная резервная возрастная квота"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="Резервные копии, сделанные в этот день месяца, не будут удалены. Оставьте настройку по умолчанию 1, чтобы всегда сохранять резервные копии, сделанные в 1-й день месяца."
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="Не удаляйте резервные копии, сделанные в этот день месяца."
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="Резервные копии старше этого количества дней будут автоматически удалены. Оставьте настройку по умолчанию, 31, чтобы сохранить все резервные копии с последнего месяца"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Максимальный возраст резервного копирования, в дни"
COM_AKEEBABACKUP_CONFIG_MAXEXECTIME_DESCRIPTION="Каждый Akeeba Backup Шаг будет продолжаться <em>самое большее</em> Используйте значение ниже вашего. PHP Максимальное время исполнения. Обычно достаточно установить его на 10 секунд, за исключением очень ограничительных хостов.<strong>Совет</strong>Выберите пользовательский и введите желаемое значение, если его нет в списке."
COM_AKEEBABACKUP_CONFIG_MAXEXECTIME_TITLE="Максимальное время исполнения"
COM_AKEEBABACKUP_CONFIG_MAXPACKET_DESCRIPTION="Максимальный размер, в байтах, каждого расширенного заявления INSERT. Рекомендуется держать его достаточно низким, чтобы MySQL не выбрасывал ошибку при восстановлении сброса базы данных."
COM_AKEEBABACKUP_CONFIG_MAXPACKET_TITLE="Размер пакетов Max для расширенных INSERT"
COM_AKEEBABACKUP_CONFIG_MINEXECTIME_DESCRIPTION="Каждый Akeeba Backup Шаг будет продолжаться <em>по крайней мере</em> Если вы получаете 403 ошибки Forbidden или AJAX, пожалуйста, увеличьте эту настройку. Установка до 0 отключает эту функцию.<br/><br/><strong>Совет</strong>Выберите пользовательский и введите желаемое значение, если его нет в списке."
COM_AKEEBABACKUP_CONFIG_MINEXECTIME_TITLE="Минимальное время исполнения"
COM_AKEEBABACKUP_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Когда это возможно, Akeeba Backup Постараемся выбросить эти продвинутые объекты базы данных MySQL 5. Если ваша резервная копия зависнет на этапе резервной копии, вам, возможно, придется отключить это."
COM_AKEEBABACKUP_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="Демп-процедуры, ФУНКЦИИ и ПРИЗЫВАТЕЛИ"
COM_AKEEBABACKUP_CONFIG_MYSQLNOBTREE_TIP="Устраняет использование BTREE и USING HASH из определений индекса таблицы в файлах демпинга. Это необходимо для восстановления на серверах, у которых отключены оба механизма индексации (например, на новейших версиях XAMPP)."
COM_AKEEBABACKUP_CONFIG_MYSQLNOBTREE_TITLE="Скип индексный двигатель"
COM_AKEEBABACKUP_CONFIG_NODEPENDENCIES_DESCRIPTION="Когда это возможно, Akeeba Backup Используйте это только тогда, когда у вас есть сотни таблиц баз данных, и вы не используете MySQL VIEWs, FUNCTIONs, PROCEDUREs, TRIGGERs или таблицы с использованием (крайне редко используемых) TEMPORARY, MEMORY, MERGE или FEDERATED двигателей."
COM_AKEEBABACKUP_CONFIG_NODEPENDENCIES_TITLE="Отслеживание зависимостей"
COM_AKEEBABACKUP_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Общее количество устаревших записей (резервных копий, файлы которых были удалены) для хранения на странице управления резервными копиями."
COM_AKEEBABACKUP_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Устаревшие записи для хранения"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TITLE="Удалить устаревшие файлы журналов"
COM_AKEEBABACKUP_CONFIG_LOGFILES_DESCRIPTION="Автоматически удаляйте файлы журналов успешных записей резервного копирования. Файл журнала последней записи резервного копирования участвует в вычислениях, но никогда не удаляется. Если ваш профиль резервного копирования имеет механизм постобработки, отличный от None или Send by Email, только записи с удаленным статусом резервного копирования участвуют в этой установке квоты файлов журналов. Если ваш профиль резервного копирования имеет движок постобработки None или Send by Email, только записи с OK или удаленным статусом резервного копирования участвуют в этой установке квоты файлов журналов. Эта функция работает после устаревшей квоты записей; устаревшая квота записей также может удалять старые файлы журналов."
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_TITLE="Устаревшие файлы журналов квоты типа"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_DESCRIPTION="Выберите метод, используемый для определения того, какие старые файлы журнала удалить."
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_SIZE="Максимальный размер"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_COUNT="Граф"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_DAYS="Максимальный возраст"
COM_AKEEBABACKUP_CONFIG_LOGFILES_COUNT_TITLE="Лог-файлы считать"
COM_AKEEBABACKUP_CONFIG_LOGFILES_COUNT_DESCRIPTION="Сколько лог-файлов хранить. Файл журнала последней резервной копии может участвовать в подсчете, но никогда не будет удален. Только лог-файлы успешных резервных копий будут рассматриваться для удаления."
COM_AKEEBABACKUP_CONFIG_LOGFILES_SIZE_TITLE="Размер файлов журнала (мегабайт)"
COM_AKEEBABACKUP_CONFIG_LOGFILES_SIZE_DESCRIPTION="Максимальный общий размер файлов журнала для хранения. Файл журнала последней резервной копии может участвовать в расчете, но никогда не будет удален. Для удаления будут рассматриваться только файлы журнала успешных записей резервной копии."
COM_AKEEBABACKUP_CONFIG_LOGFILES_DAYS_TITLE="Возраст лог-файлов (дни)"
COM_AKEEBABACKUP_CONFIG_LOGFILES_DAYS_DESCRIPTION="Максимальный возраст в дни хранения файлов журнала. Файл журнала последней резервной копии никогда не будет удален. Для удаления будут рассматриваться только файлы журнала успешных записей резервной копии."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Заполняется автоматически, когда вы завершаете проверку подлинности Шаг 1 выше. Не делитесь одним и тем же токеном на многих сайтах. Вместо этого, аутентифицируйте каждый сайт отдельно."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Доступ к маркеру"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_REFRESHDRIVES_TITLE="Перезагрузить список дисков"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DRIVE_TITLE="Драйв"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Выберите, к какому диску (OneDrive Personal, OneDrive for Business или SharePoint) ваша учетная запись будет использоваться для хранения резервных копий. Вам необходимо завершить аутентификацию до заполнения этого списка. Имеет смысл только тогда, когда у вас есть доступ к более чем одному диску OneDrive (например, ваша учетная запись Microsoft является частью подписки организации). Если вы не уверены, используйте опцию «Default Drive», которая использует ваш персональный диск по умолчанию — обычно эквивалентную первой опции «Drive (OneDrive Personal)», которую вы видите ниже."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="OneDrive Personal (персональный)"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="Каталог в диске Microsoft OneDrive для хранения резервных архивов. Пожалуйста, используйте передние слэши, а не обратные слэши и всегда ставьте переднюю слэш. Правильно: /some/thing. Wrong: some\\Один передний слэш означает, что архивы будут храниться в корне диска."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Директория"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Заполняется автоматически, когда вы завершаете проверку подлинности Шаг 1 выше. Не делитесь одним и тем же токеном на многих сайтах. Вместо этого, аутентифицируйте каждый сайт отдельно."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Обновить Token"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="в Joomla! 3.9 и более поздние действия пользователя регистрируются внутри базы данных, создавая таблицу с миллионами строк и замедляя резервную копию. Проверьте эту опцию, чтобы исключить такие данные."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="JoomlaЛог действий пользователя"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="При включении будут резервироваться только файлы, измененные после определенной даты и времени."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Дата условного фильтра"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="Akeeba Backup Формат - YYYY-MM-DD hh:mm:ss. Все даты и время выражены в часовом поясе вашего сервера."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Файлы резервного копирования, измененные после"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Автоматическое исключение файлов журналов ошибок, например. <code>error_log</code>Независимо от того, где они находятся на сайте резервного копирования. Эти файлы изменяют свой размер в то время как резервная копия находится в процессе разработки, что может привести к повреждению резервных копий."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Исключить ошибки logs"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_FINDER_ENABLED_DESCRIPTION="Исключите некритический контент Smart Search из резервной копии. Вам настоятельно рекомендуется сделать это по причинам производительности. После восстановления вашего сайта, пожалуйста, перейдите в Компоненты, Smart Search и нажмите кнопку Index, чтобы восстановить эти данные."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_FINDER_ENABLED_TITLE="Термины Skip Finder и таблицы таксономии"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Когда это возможно, Akeeba Backup автоматически исключит наиболее распространенные папки для хранения статистики доступа к вашему сайту. Эти папки читаются только пользователем вашего веб-сайта, что вызывает проблемы с восстановлением, если они резервные копии."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ENABLED_TITLE="Только резервные столы, установленные Joomla! и его расширения"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ENABLED_DESCRIPTION="Включение этого фильтра пропустит резервное копирование любой таблицы в базе данных, которая не была установлена. Joomlaсама, или одно из ее расширений.Информацию об установленных таблицах предоставляет SQL Файлы, включенные в JoomlaЭтот фильтр полезен, когда у вас много мусора / скопировано за столами (подумайте о том, чтобы найти его). <code>#__users_oldcopy_20250910</code> и вы не хотите или не знаете, как отсеять их один за другим. Всегда тестируйте восстановление резервной копии на сервере разработки / постановки при использовании этого фильтра, чтобы убедиться, что ваша конфигурация не привела к случайному оставлению таблиц, которые вы хотели использовать."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ONLYJOOMLA_TITLE="Ограничение фильтрации таблиц с Joomlaпрефикс"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ONLYJOOMLA_DESCRIPTION="Включение этой опции ограничит ”Только резервные столы, установленные Joomlaфильтр ”! и его расширения” для таблиц, название которых начинается с JoomlaПрефикс имени таблицы баз данных. Это полезно, если у вас есть сторонние скрипты, работающие снаружи Joomla которые устанавливают свои таблицы без префикса стола или с другим префиксом стола, и вы хотите включить их в свою резервную копию."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_EXTRA_TITLE="Позволяют явно эти таблицы"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_EXTRA_DESCRIPTION="Введите запятую отдельного списка таблиц базы данных, чтобы включить в резервную копию, даже если они в противном случае были бы исключены ”Только таблицы резервного копирования, установленные Joomla! и фильтр его расширений. Это полезно для включения таблиц расширений, которые устанавливают свои таблицы с использованием метода, отличного от JoomlaСовет: Если вы видите таблицу, которую хотите включить в резервную копию с красным значком на странице Исключите таблицы баз данных, добавьте ее в этот список."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Исключите папки Stats для хостов"
COM_AKEEBABACKUP_CONFIG_OUTDIR_DESCRIPTION="Каталог на сервере, где Akeeba Backup хранит архивы резервных копий и файл журнала. Доступны следующие макросы:<ul><li><strong>[DEFAULT_OUTPUT]</strong> Каталог для сохранения по умолчанию</li><li><strong>[SITEROOT]</strong> Корневой каталог сайта</li><li><strong>[ROOTPARENT]</strong> Каталог на уровень выше корня сайта</li></ul>"
COM_AKEEBABACKUP_CONFIG_OUTDIR_TITLE="Каталог результатов"
COM_AKEEBABACKUP_CONFIG_OVH_CONTAINERURL_DESCRIPTION="ИМЯ НЕ СТОРАГИЧЕСКИЙ КОНТАЙНЕР! Зайдите в облачный менеджер OVH, серверы, расширьте свой сервер, нажмите на Хранилище. Вы увидите Контейнер URL Там, над списком ваших файлов. Скопируйте здесь."
COM_AKEEBABACKUP_CONFIG_OVH_CONTAINERURL_TITLE="контейнер URL"
COM_AKEEBABACKUP_CONFIG_OVH_DIRECTORY_DESCRIPTION="Справочник в контейнере хранения объектов OVH для хранения резервных архивов. Чтобы сохранить все на корне контейнера, оставьте пустой."
COM_AKEEBABACKUP_CONFIG_OVH_DIRECTORY_TITLE="Директория"
COM_AKEEBABACKUP_CONFIG_OVH_PASSWORD_DESCRIPTION="Создайте пользователя из своего облачного менеджера OVH, серверов, расширьте свой сервер, нажмите OpenStack, нажмите Add User. Скопируйте пароль созданного пользователя здесь."
COM_AKEEBABACKUP_CONFIG_OVH_PASSWORD_TITLE="Пароль OpenStack"
COM_AKEEBABACKUP_CONFIG_OVH_PROJECTID_DESCRIPTION="Идентификатор проекта облачного сервера OVH. В облачном менеджере OVH расширьте свой сервер и нажмите на ссылку Хранение. В области главной страницы вы видите имя сервера, а прямо под ним находится буквенно-цифровая строка 32 символа, такая как a0b1c2d3e4f56789abcdef0123456789. Это идентификатор проекта, который вам нужно ввести здесь."
COM_AKEEBABACKUP_CONFIG_OVH_PROJECTID_TITLE="Идентификатор проекта"
COM_AKEEBABACKUP_CONFIG_OVH_USERNAME_DESCRIPTION="Это НЕ ВАШЕ ПОЛЬЗОВАТЕЛЬСТВО ОВХ ЛОГИН! Создайте пользователя из своего облачного менеджера OVH, Серверы, расширьте свой сервер, нажмите OpenStack, нажмите Add User. Копируйте идентификатор созданного пользователя здесь."
COM_AKEEBABACKUP_CONFIG_OVH_USERNAME_TITLE="Имя пользователя OpenStack"
COM_AKEEBABACKUP_CONFIG_PARTSIZE_DESCRIPTION="Akeeba Backup Можно создавать раздельные (многочастные) архивы для того, чтобы обойти ограничения по размеру при различных обстоятельствах. Эта опция определяет максимальный размер каждой архивной части. Если свести его к 0, многочастная функция отключена.</br><strong>Важно:</strong>Если вы используете движок обработки данных, который передает архивы в удаленное место (например, облачное хранилище), используйте настройку от 1 до 5 Мб для достижения оптимальных результатов."
COM_AKEEBABACKUP_CONFIG_PARTSIZE_TITLE="Размер части для разделенных архивов"
COM_AKEEBABACKUP_CONFIG_PCLOUD_ACCESSTOKEN_DESCRIPTION="<strong>Предупреждение! Аутентификация не работает из-за проблем с API сервером pCloud. Этот пост-процессирующий инженер будет удален в будущем Версия AKEEBA BACKUP</strong>.Заполняется автоматически, когда вы завершаете этап аутентификации 1 выше. Если вы связываете другой сайт с той же учетной записью pCloud, вы должны скопировать маркер доступа с уже настроенного сайта и не пытаться снова запустить этап аутентификации 1."
COM_AKEEBABACKUP_CONFIG_PCLOUD_ACCESSTOKEN_TITLE="Доступ к маркеру"
COM_AKEEBABACKUP_CONFIG_PCLOUD_DIRECTORY_DESCRIPTION="Название каталога на pCloud, где будет храниться резервный архив. <strong>Каталог должен уже существовать, иначе загрузка выйдет из строя.</strong>"
COM_AKEEBABACKUP_CONFIG_PCLOUD_DIRECTORY_TITLE="Директория"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_0600="0600 - Тесная безопасность может вызвать проблемы на серверах низкого уровня"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_0644="0644 - Средняя безопасность для использования на серверах одного сайта"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_0666="0666 - Слабая безопасность, максимальная совместимость с коммерческими хостами"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_DESCRIPTION="Настройка разрешений файлов для архивных файлов резервного копирования. Применяется только для Linux, macOS, BSD и других хостов в стиле UNIX (не Windows). Если не уверены, оставьте как 0666. Изменение, которое может сделать невозможным загрузку и / или удаление архивных файлов резервного копирования поверх FTP и SFTP. Если ваш сервер использует PHPFPM или иным образом работает PHP Под тем же пользователем, что и системный аккаунт вашего сайта, используйте 0600 для лучшей безопасности."
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_TITLE="Архив разрешений"
COM_AKEEBABACKUP_CONFIG_PLATFORM="Переопределение сайтов"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDATABASE_DESCRIPTION="Имя базы данных для резервного копирования. Используется только тогда, когда галочка базы данных сайта переопределяется."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDATABASE_TITLE="Имя базы данных"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDRIVER_DESCRIPTION="Выберите драйвер базы данных для использования при подключении к базе данных сайта. Используется только тогда, когда галочка базы данных сайта переопределяется."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDRIVER_TITLE="Водитель базы данных"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBHOST_DESCRIPTION="Имя хоста или IP Адрес сервера базы данных. Обычно localhost или 127.0.0.1. Используется только при тикании флажка переопределения базы данных сайта."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBHOST_TITLE="Имя сервера базы данных"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPASSWORD_DESCRIPTION="Пароль для подключения к базе данных сайта используется только тогда, когда база данных сайта переопределяет галочку."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPASSWORD_TITLE="Пароль"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPORT_DESCRIPTION="(необязательно) Порт, который слушает сервер базы данных. Если вы не уверены, оставьте эту опцию пустой для использования порта по умолчанию (3306 для серверов MySQL). Используется только тогда, когда тикает флажок переопределения базы данных сайта."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPORT_TITLE="Порт сервера баз данных"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPREFIX_DESCRIPTION="Префикс базы данных для резервного копирования, включая подчеркивание, например. <code>ex4m_</code>Используется только тогда, когда база данных сайта переопределяет галочку."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPREFIX_TITLE="Префикс"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBENCRYPTION_TITLE="Подключение к SSL-сертификату"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBENCRYPTION_DESCRIPTION="Должны ли мы подключаться к базе данных с использованием SSL-сертификата? Это может использоваться вместо аутентификации имени пользователя и пароля (зашифрованное соединение с аутентификацией сертификата) или <em>сверху</em> Имя пользователя и аутентификация пароля (зашифрованное соединение с аутентификацией пароля). Если вы не знаете, что это означает, установите эту опцию «Нет» и проигнорируйте следующие несколько вариантов."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCIPHER_TITLE="Методы шифрования SSL/TLS"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCIPHER_DESCRIPTION="Введите список методов шифрования для подключения к SSL-сертификатам, разделенных двоеточием. Если оставлен пустой список по умолчанию (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) будет использоваться (рекомендуется)."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCA_TITLE="Сертификационный орган (CA) файл"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCA_DESCRIPTION="Абсолютный путь файла к PEM-файлу сертификата сертификационного органа (CA) вашего сервера базы данных, например. <code>/home/myuser/ca.pem</code>"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLKEY_TITLE="Файл приватного ключа пользователя базы данных"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLKEY_DESCRIPTION="Абсолютный путь к PEM-файлу с закрытым ключом пользователя базы данных, например. <code>/home/myuser/myuser-key.pem</code>"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCERT_TITLE="Публичный ключ пользователя базы данных (сертификат)"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCERT_DESCRIPTION="Абсолютный путь к файлу открытого ключа (сертификата) PEM-файла пользователя базы данных, например. <code>/home/myuser/myuser.pem</code>"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLVERIFYSERVERCERT_TITLE="Проверить сертификат сервера"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLVERIFYSERVERCERT_DESCRIPTION="Настройка на Да для проверки сертификата, который сервер отправляет нам. Это проверяется в соответствии с указанным вами файлом Certification Authority (CA). Если вы получаете ошибки подключения, установите это на Нет; некоторые настройки (особенно те, которые генерируются <code>mysql_ssl_rsa_setup</code>) может запретить соединение, если включена проверка сертификации. Если вы включите проверку и поле файла CA останется пустым, сертификат сервера будет проверен на файлы Управления по сертификации, о которых знает ваш сервер, см. <code>openssl.cafile</code> и <code>openssl.capath</code> PHP Варианты."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBUSERNAME_DESCRIPTION="Имя пользователя для подключения к базе данных сайта. Используется только тогда, когда база данных сайта переопределяет галочку."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBUSERNAME_TITLE="Имя пользователя"
COM_AKEEBABACKUP_CONFIG_PLATFORM_NEWROOT_DESCRIPTION="Если вы включили опцию «Корневая перегрузка сайта» выше, Akeeba Backup будет создавать резервные копии всех файлов и каталогов под корнем этого сайта"
COM_AKEEBABACKUP_CONFIG_PLATFORM_NEWROOT_TITLE="Корень сайта Force"
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEDB_DESCRIPTION="Когда не проверено (по умолчанию) Akeeba Backup автоматически резервное копирование базы данных сайта, к которому он установлен (ваш) JoomlaПри проверке он будет создавать резервные копии другой базы данных, используя данные о подключении, которые вы предоставляете ниже."
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEDB_TITLE="Переопределение базы данных сайта"
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEROOT_DESCRIPTION="Когда не проверено (по умолчанию) Akeeba Backup Он будет использовать резервное копирование всех файлов и каталогов под корнем сайта, на котором он установлен. При включении он будет создавать резервные копии файлов и каталогов под каталогом, выбранным в Force Site Root ниже."
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEROOT_TITLE="Корень сайта опровержение"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Если позволительно, Akeeba Backup Постараемся соединиться с вашим FTP Сервер, использующий SSL-зашифрованное соединение. <strong>Это не то же самое, что SFTP или SCP. \"Безопасный FTP\"!</strong> Обратите внимание, что если ваш сервер не поддерживает этот метод, вы получите ошибки подключения."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_FTPS_TITLE="Использовать FTP over SSL (FTPS)"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="FTP Имя хоста сервера, без протокола. <code>ftp://example.com</code> это <strong>инвалид</strong> и <code>example.com</code> Этот двигатель поддерживает только FTP и FTPS-серверы. <u>не является</u> Поддержка SFTP, SCP и других вариантов SSH."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_HOST_TITLE="Имя ведущего"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="Абсолютный <strong>FTP</strong> Если не уверены, подключитесь к серверу с FileZilla, просмотрите предполагаемый каталог и скопируйте путь, появляющийся на правой панели над списком каталогов. Обычно это что-то короткое, например <code>/public_html</code>."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_INITDIR_TITLE="Первоначальный каталог"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="Путь относительно начального каталога. Если указанного каталога нет, он будет создан. Оставьте поле пустым, чтобы загружать архивы прямо в начальный каталог. Доступны следующие макросы:<ul><li><strong>[HOST]</strong> Имя хоста. ВНИМАНИЕ! Этот макрос не работает в режиме CRON.</li><li><strong>[DATE]</strong> Текущая дата</li><li><strong>[TIME]</strong> Текущее время</li></ul>Другие макросы описаны в документации."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Подкаталог"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Использовать FTP Пассивный режим при передаче данных. Это включено по умолчанию, поскольку это единственный метод, который работает через брандмауэры, обычно устанавливаемые на веб-серверах. Не деактивируйте, если вы не уверены, что ваш веб-сервер не находится за брандмауэром и что ваш FTP Серверу абсолютно необходима передача файлов в активном режиме."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Используйте пассивный режим"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="FTP Пароль сервера, как правило, деликатный. Если вы не уверены, пожалуйста, свяжитесь с вашим сетевым администратором."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Пароль"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="FTP Наиболее распространенная настройка - 21. Если вы не уверены, пожалуйста, свяжитесь с вашим сетевым администратором."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PORT_TITLE="Порт"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Используйте эту кнопку, чтобы проверить FTP Подключение и просмотр ошибок подключения при сбое."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_TEST_TITLE="Тест FTP соединение"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_USER_DESCRIPTION="FTP Имя пользователя сервера, как правило, деликатное. Если вы не уверены, пожалуйста, свяжитесь с вашим сетевым администратором."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_USER_TITLE="Имя пользователя"
COM_AKEEBABACKUP_CONFIG_POSTPROCPARTS_DESCRIPTION="Когда это возможно, Akeeba Backup После обработки двигатель будет работать против каждой части, как только она будет завершена. Akeeba Backup Запуск постобработки для всех частей в конце процесса резервного копирования."
COM_AKEEBABACKUP_CONFIG_POSTPROCPARTS_TITLE="Обработка каждой части сразу"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Имя хоста SFTP-сервера, без протокола. <code>sftp://example.com</code> или <code>ssh://example.com</code> это <strong>инвалид</strong> не должны использоваться, но <code>example.com</code> Этот движок поддерживает только серверы SFTP (SSH). <u>не является</u> поддержка FTPFTPS или любой другой FTP Для этого требуется PHP Расширение SSH2 должно быть установлено и включено."
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_HOST_TITLE="Имя ведущего"
