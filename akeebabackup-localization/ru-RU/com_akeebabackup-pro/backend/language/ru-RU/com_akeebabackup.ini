COM_AKEEBABACKUP_ALICE_ERR_NOLOGS="Никаких лог-файлов <strong>неудачный</strong> Были найдены резервные копии."
COM_AKEEBABACKUP_ALICE_HEAD_ONLYFAILED="Алиса работает только на <em>неудачный</em> резервное копирование"
COM_AKEEBABACKUP_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="ALICE - это инструмент для анализа файлов журналов <em>неудачный</em> Резервное копирование и - в большинстве случаев - дает вам наиболее вероятную причину отказа резервного копирования. Это не предназначено для анализа лог-файлов успешных резервных копий. Это возвращает бессмысленные, вводящие в заблуждение или прямо неправильные результаты. По этой причине мы будем показывать вам только лог-файлы успешных резервных копий. <em>неудачный</em> Подкрепление."
COM_AKEEBABACKUP_ALICE_LBL_ONLYFAILED_WHATISFAILED="Пожалуйста, помните, что резервные копии, которые не закончили загрузку архива резервных копий в удаленное хранилище, не вышли из строя. Корневая причина этих проблем не может быть обнаружена ALICE в любом случае. Если у вас есть такая проблема, вам нужно подать билет поддержки в разделе поддержки нашего сайта. Если кто-то другой установлен Akeeba Backup Professional Для вас на вашем сайте, пожалуйста, свяжитесь с этим человеком; в этом случае вы не сможете подать билет поддержки на нашем сайте."
COM_AKEEBABACKUP_ALICE_LBL_ONLYFAILED_IFNOFAILED="Если ваша резервная копия не удалась, но вы не видите ее на этой странице, пожалуйста, подождите. <em>3 (три) минуты</em>Вернитесь в The Akeeba Backup Страница панели управления, а затем возвращайтесь сюда. Есть причина. В некоторых случаях сбой резервного копирования вызван ошибкой сервера. В этих случаях резервное копирование помечается как неисправное, а не неудачное, так как PHP Мы останавливаемся, поэтому наши PHP Код, который пометил бы резервную копию как неисправную, не имеет возможности запуска. При посещении страницы панели управления любая резервная копия, отмеченная как неподвижная в течение более 3 минут, будет помечена как неисправная. <em>затем</em> Вернитесь на страницу панели управления."

