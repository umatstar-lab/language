COM_AKEEBABACKUP_CONFIG_ADVANCED_SBPP_DESC="Akeeba Backup Это может увеличить общее время резервного копирования примерно на 10 секунд, если включить эту опцию. Akeeba Backup Однако это может привести к тайм-ауту или ошибкам внутреннего сервера."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBPP_LABEL="Инвалидный шаг в финализации"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Если ваш сервер не работает PHP в безопасном режиме и поддерживает set_time_limit(), Akeeba Backup Пытается установить бесконечное PHP Максимальное время исполнения для работы над потенциальными проблемами тайм-аута"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Установить бесконечное PHP предельный срок"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Сказки Akeeba Backup Пытаться и увеличивать PHPограничение памяти до смехотворно высокого значения (16 Гб). Это позволяет сжимать большие файлы и загружать большие архивы резервного копирования с использованием тяжелых вариантов удаленного хранения памяти, таких как WebDAV. Примечание: это только устанавливает предел для максимального потребления памяти. Akeeba BackupРезервный двигатель потребляет <em>гораздо меньше</em> Сжатие и загрузка больших файлов также требует изменения других опций на странице конфигурации резервного профиля."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Установите большой лимит памяти"
COM_AKEEBABACKUP_CONFIG_ANGIE_KEY_DESCRIPTION="Вы можете опционально защитить пароль Akeeba Backup Реставрационный скрипт, предотвращающий несанкционированный доступ к установщику. При запуске установщика вам будет предложено ввести этот пароль. Обратите внимание, что пароль является чувствительным к случаю, т.е. ABC, abc и Abc - это три разных пароля."
COM_AKEEBABACKUP_CONFIG_ANGIE_KEY_TITLE="Реставрационный скрипт Password"
COM_AKEEBABACKUP_CONFIG_ARBITRARYFEEMAIL_DESC="Отправьте электронное письмо на этот адрес (оставьте пустой адрес электронной почты всем пользователям)"
