;; Custom menu items (backend menu editor)
;; ================================================================================
COM_AKEEBABACKUP_VIEW_CPANEL_TITLE="Панель управления"
COM_AKEEBABACKUP_VIEW_CPANEL_DESC="Главная страница Akeeba Backup Это позволяет настраивать, брать, управлять и восстанавливать резервные копии."

COM_AKEEBABACKUP_VIEW_BACKUP_TITLE="Резервное копирование"
COM_AKEEBABACKUP_VIEW_BACKUP_DESC="Создать резервную копию"
COM_AKEEBABACKUP_VIEW_BACKUP_PROFILE_LABEL="Профиль резервного копирования Force"
COM_AKEEBABACKUP_VIEW_BACKUP_PROFILE_DESC="Выберите профиль резервного копирования, чтобы переключиться на него, прежде чем делать резервное копирование. Выберите «(Никакой)» для использования текущего профиля резервного копирования, каким бы он ни был."
COM_AKEEBABACKUP_VIEW_BACKUP_HIDETOOLBAR_LABEL="Скрыть панель инструментов"
COM_AKEEBABACKUP_VIEW_BACKUP_HIDETOOLBAR_DESC="Должна ли панель инструментов с кнопками панели поддержки и управления быть скрыта?"
COM_AKEEBABACKUP_VIEW_BACKUP_RETURNURL_LABEL="URL возврата"
COM_AKEEBABACKUP_VIEW_BACKUP_RETURNURL_DESC="Введите внутренний URL вернуться после завершения резервного копирования. Например: ввести <code>index.php</code> Чтобы вернуться к Joomlaпанель управления или <code>index.php%3Foption%26com_akeeba</code> Чтобы вернуться к Akeeba BackupПанель управления. <br/> <strong>WARNING</strong> Благодаря тому, что путь JoomlaМенеджер меню работает URL Вы должны войти URLВы можете сделать это, сохранив пункт меню. <em>Дважды подряд</em>Это известная ошибка / отсутствующая функция в Joomla!само собой."

COM_AKEEBABACKUP_VIEW_CONFIGURATION_TITLE="Настройки"
COM_AKEEBABACKUP_VIEW_CONFIGURATION_DESC="Настройте текущий активный профиль резервного копирования."

COM_AKEEBABACKUP_VIEW_MANAGE_TITLE="Управление резервными копиями"
COM_AKEEBABACKUP_VIEW_MANAGE_DESC="Управляйте попытками резервного копирования, в том числе выбирая восстановление любого старого резервного копирования."

COM_AKEEBABACKUP_VIEW_RESTORE_TITLE="Восстановить последнюю резервную копию"
COM_AKEEBABACKUP_VIEW_RESTORE_DESC="Восстановите последнюю резервную копию, взятую с помощью определенного профиля резервной копии."
COM_AKEEBABACKUP_VIEW_RESTORE_PROFILE_LABEL="Профиль резервного копирования"
COM_AKEEBABACKUP_VIEW_RESTORE_PROFILE_DESC="Восстановите последнюю резервную копию, взятую с этим профилем резервной копии. <strong>ВАЖНО!</strong> Он будет искать только последнюю резервную копию, взятую с этого профиля. Архив резервной копии должен существовать на вашем сервере. Если вы удалили его или если он хранится удаленно, вы получите ошибку. Восстановление удаленно сохраненных резервных копий требует, чтобы вы сначала перешли к управлению резервными копиями и вернули их на свой сервер."

COM_AKEEBABACKUP_VIEW_TRANSFER_TITLE="Мастер переноса сайта"
COM_AKEEBABACKUP_VIEW_TRANSFER_DESC="Позволяет восстановить последнюю резервную копию на другое местоположение / сервер. <strong>ВАЖНО!</strong> Он будет искать только последние резервные копии. Архив резервных копий должен существовать на вашем сервере. Если вы удалили его, или если он хранится удаленно, вам скажут взять новую резервную копию. Передача удаленно сохраненных резервных копий требует, чтобы вы сначала перешли к управлению резервными копиями и вернули их на свой сервер."
