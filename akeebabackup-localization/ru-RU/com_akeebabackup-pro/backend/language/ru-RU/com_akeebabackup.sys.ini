;; Installation package description
;; ================================================================================
COM_AKEEBABACKUP_XML_DESCRIPTION="Популярный компонент резервного копирования для Joomla!&trade;"

;; Permissions
;; ================================================================================
COM_AKEEBABACKUP_ACCESS_BACKUP_LBL="Резервное копирование"
COM_AKEEBABACKUP_ACCESS_BACKUP_DESC="Позволяет принимать резервные копии с Akeeba Backup."
COM_AKEEBABACKUP_ACCESS_CONFIGURE_LBL="Настроить"
COM_AKEEBABACKUP_ACCESS_CONFIGURE_DESC="Разрешает настраивать профили Akeeba Backup и пользоваться встроенным восстановлением, если оно доступно. Примечание о безопасности: это разрешение практически равнозначно правам суперпользователя. Встроенное восстановление перезаписывает файлы и базу данных сайта содержимым архива, а на странице настроек можно изменить место отправки резервных копий. Предоставляйте это разрешение только тем, кому готовы дать права суперпользователя."
COM_AKEEBABACKUP_ACCESS_DOWNLOAD_LBL="Скачать"
COM_AKEEBABACKUP_ACCESS_DOWNLOAD_DESC="Разрешает скачивать, загружать и управлять архивами Akeeba Backup, а также использовать мастер переноса сайта, если он доступен. Примечание о безопасности: архив содержит полную копию сайта, включая данные доступа к базе и секретный ключ сайта в файле конфигурации, все записи пользователей и весь контент. Тот, кто скачает архив, сможет прочитать весь сайт офлайн. Предоставляйте это разрешение только тем, кому доверяете содержимое базы данных."

