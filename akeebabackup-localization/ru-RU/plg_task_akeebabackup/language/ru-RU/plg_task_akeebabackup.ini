PLG_TASK_AKEEBABACKUP_TASK_BACKUP_TITLE="Akeeba Backup Возьмите резервную копию"
PLG_TASK_AKEEBABACKUP_TASK_BACKUP_DESC="Сделайте резервную копию вашего сайта с Akeeba Backup."

PLG_TASK_AKEEBABACKUP_TASK_CLIBACKUP_TITLE="Akeeba Backup — Резервное копирование только через CLI"
PLG_TASK_AKEEBABACKUP_TASK_CLIBACKUP_DESC="Сделайте резервную копию вашего сайта с Akeeba BackupЭтот тип задач работает <strong>только</strong> Когда запланированные задачи запускаются работой CLI CRON."

PLG_TASK_AKEEBABACKUP_TASK_FAILEDCHECK_TITLE="Akeeba Backup Проверка неудавшихся резервных копий"
PLG_TASK_AKEEBABACKUP_TASK_FAILEDCHECK_DESC="Проверьте неудачные попытки резервного копирования и уведомите администраторов сайта."

PLG_TASK_AKEEBABACKUP_TASK_FAILEDUPLOADCHECK_TITLE="Akeeba Backup Проверка неудавшихся загрузок"
PLG_TASK_AKEEBABACKUP_TASK_FAILEDUPLOADCHECK_DESC="Проверьте наличие резервных копий, которые не удалось загрузить в удаленное хранилище, и уведомите администраторов сайта."

PLG_TASK_AKEEBABACKUP_NOTE01_DESC="<strong><span aria-hidden=\"true\" class=\"fa fa-exclamation-triangle\"></span> ВАЖНО!</strong> Пожалуйста, ознакомьтесь с нашей документацией, чтобы понять ограничения и компромиссы использования резервной копии вашего сайта. JoomlaЗапланированные задания."

PLG_TASK_AKEEBABACKUP_NOTE02_DESC="Этот тип задачи резервного копирования выполняется <strong>только</strong> Если вы используете JoomlaCLI-приложение для запуска запланированных задач. Оно более эффективно и надежнее, чем ”Akeeba Backup Возьмите тип задачи «Резервное копирование», но НЕ будет выполняться с использованием ленивого планирования задач или при использовании Joomla's URL Если вы хотите использовать один из последних двух методов, пожалуйста, используйте ”Akeeba Backup Вместо этого возьмите тип задачи «Резервное копирование»."

PLG_TASK_AKEEBABACKUP_PROFILE_LABEL="Профиль резервного копирования"
PLG_TASK_AKEEBABACKUP_PROFILE_DESC="Выберите, какой профиль резервного копирования использовать для запланированных резервных копий."
