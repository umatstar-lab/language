PLG_QUICKICON_AKEEBABACKUP="Быстрая икона - Akeeba Backup Уведомление"
PLG_QUICKICON_AKEEBABACKUP_XML_DESCRIPTION="Отображает один Akeeba Backup Иконка в бэкэнде администратора, уведомляющая вас, когда резервная копия просрочена (настраиваемая)."

PLG_QUICKICON_AKEEBABACKUP_GROUP_DESC="Группа этого плагина (это значение сравнивается с значением группы, используемым в данном описании). <strong>Быстрые иконы</strong> Модули для инъекций иконок"
PLG_QUICKICON_AKEEBABACKUP_GROUP_LABEL="Группа"

PLG_QUICKICON_AKEEBABACKUP_LBL_WARNINGS="Включите предупреждающую иконку"
PLG_QUICKICON_AKEEBABACKUP_DESC_WARNINGS="Когда это возможно, то Akeeba Backup Иконка логотипа отображает небольшой предупреждающий знак, если резервная копия не удалась или устарела (см. Ниже)."
PLG_QUICKICON_AKEEBABACKUP_LBL_WARNFAILED="Предупреждение о неудачных резервных копиях"
PLG_QUICKICON_AKEEBABACKUP_DESC_WARNFAILED="Когда включены как эта, так и предыдущие опции, отображается значок предупреждения, если последняя резервная копия не удалась."
PLG_QUICKICON_AKEEBABACKUP_LBL_PERIOD="Несвоевременное резервное копирование, в часах"
PLG_QUICKICON_AKEEBABACKUP_DESC_PERIOD="Предположим, что резервная копия устарела, если прошло много часов с момента последней успешной резервной копии. Если резервная копия устарела, отображается значок предупреждения, если включен первый вариант."

PLG_QUICKICON_AKEEBABACKUP_PROFILE_LABEL="Профиль резервного копирования"
PLG_QUICKICON_AKEEBABACKUP_PROFILE_DESC="Выберите профиль резервного копирования, который будет использоваться для полной резервной копии сайта при нажатии значка резервного копирования."
