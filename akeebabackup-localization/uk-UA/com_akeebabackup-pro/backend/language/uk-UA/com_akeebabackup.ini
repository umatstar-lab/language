COM_AKEEBABACKUP_CONFIG_PUSH_PREFERENCE_OPT_WEBPUSH="Web Push (Бризер API)"
COM_AKEEBABACKUP_CONFIG_QUICKICON_DESC="Коли перевірили, Akeeba Backup відображати іконку резервного копіювання одним клацанням миші на верхній частині сторінки панелі управління. Натисніть на неї, активувати цей профіль і приймати резервну копію без будь-яких додаткових дій, необхідних для вас."
COM_AKEEBABACKUP_CONFIG_QUICKICON_LABEL="One-click резервний значок"
COM_AKEEBABACKUP_CONFIG_REMOTEQUOTALATEST_TITLE="Поточна резервна копія бере участь у електронних квотах віддаленого файлу"
COM_AKEEBABACKUP_CONFIG_REMOTEQUOTALATEST_DESCRIPTION="При включенні резервної копії, яка перебуває в прогресі, бере участь у електронних квотах віддаленого файла. Це може бути проблемою; якщо резервне копіювання частково завантажується до віддаленого сховища і налаштування квоти такі, що тільки останнє резервне копіювання збережено, ви можете закінчитися без дійсного резервного копіювання, що зберігається дистанційно. Відключення це дозволить зробити менш ймовірним, що ви закінчите без дійсного резервного копіювання в дистанційному носінні за рахунок зберігання одного більш резервного архіву віддалено."
COM_AKEEBABACKUP_CONFIG_LOCAL_HEAD="Місцеві файли Цитати"
COM_AKEEBABACKUP_CONFIG_REMOTE_HEAD="Віддалені файли Цитати"
COM_AKEEBABACKUP_CONFIG_RUNTIMEBIAS_DESCRIPTION="Це визначає, як консервативний Akeeba Backup буде при намаганні уникнути часу. Нижній цей значення, більш консервативний він отримує. Якщо ви отримуєте помилки часу, будь ласка, спробуйте зменшити як максимальний час виконання і це налаштування.<strong>Чай</strong>: Виберіть користувальницький і тип у бажане значення, якщо це не на списку."
COM_AKEEBABACKUP_CONFIG_RUNTIMEBIAS_TITLE="Час виконання"
