COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Клас зберігання"
COM_AKEEBABACKUP_CONFIG_HEADER_BASIC="Базова конфігурація"
COM_AKEEBABACKUP_CONFIG_HEADER_CONFWIZ="Нехай Akeeba Backup налаштувати себе?"
COM_AKEEBABACKUP_CONFIG_HEADER_OPTIONALFILTERS="Додаткові фільтри"
COM_AKEEBABACKUP_CONFIG_HEADER_QUOTA="Управління Цитатами"
COM_AKEEBABACKUP_CONFIG_HEADER_TUNING="Тонкий тюнінг"
COM_AKEEBABACKUP_CONFIG_INSTALLER_DESCRIPTION="При виконанні повного резервного копіювання сайту Akeeba Backup поповнює сценарій відновлення, визначений тут до архіву. Це дозволяє відновити ваш сайт з нуля, не маючи на установці CMS або Akeeba Backup, навіть коли ваш сайт або сервер повністю знищений"
COM_AKEEBABACKUP_CONFIG_INSTALLER_TITLE="Вбудовується сценарій відновлення"
COM_AKEEBABACKUP_CONFIG_JPS_KEY_DESCRIPTION="Цей ключ буде використовуватися для шифрування вмісту вашого архіву. Ключ є конфіденційним, тобто ABC, abc і Abc є трьома різними паролями. Тримайте копію пароля в безпечному місці! Якщо ви втратите його немає способу відновити його."
COM_AKEEBABACKUP_CONFIG_JPS_KEY_TITLE="ключ шифрування"
COM_AKEEBABACKUP_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="Коли ввімкнено (default), ваш пароль буде розширюватися до криптографічного ключа, який використовується протягом усього архіву. Це швидко, але в дуже малоймовірному випадку, що атакуючий з ампленими ресурсами керує для зворотного інженера криптографічного ключа від одного зашифрованого блоку у файлі -без брюта, що закріплює ваш пароль, вони можуть потім розшифровувати весь архів резервних копій. При вимкненні іншого криптографічного ключа буде отримано з вашого пароля на кожному зашифрованій блокі, який є повільніше, але захищає вас від цього типу атаки, що вимагає атаки, щоб зробити пароль, який набагато повільніше."
COM_AKEEBABACKUP_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Архів-широке розширення ключа"
COM_AKEEBABACKUP_CONFIG_JSONAPI_ENABLED_DESC="Про нас Akeeba Backup JSON API дозволяє приймати і керувати резервними копіями, а також керувати Akeeba Backup параметри віддалено. Вам потрібно включити цей варіант, якщо ви плануєте взяти, завантажити або керувати резервними копіями з JSON API Secret Word, наприклад, з Akeeba Remote CLI, Akeeba Сервіси та резервні копії.<br><br>Цей параметр дозволяє керувати тільки автентичністю з JSON API Secret Word. Доступ до JSON API з API Joomla API токени управляється, що дозволяє або відключення ”Web Services -” Akeeba Backup” плагін.<br><br><strong>Замітка безпеки:</strong> Про нас JSON API Secret Word надає повний, необмежений доступ до Akeeba Backup — еквівалентний Super User, що працює компонент вручну. Він може прочитати, створювати, завантажувати та видаляти резервні копії та змінювати кожну особу. Akeeba Backup опція. Порадуйте його з такою ж обережністю, як і пароль Super User: зберігайте секрет, використовуйте довге і випадкове значення, і тільки ввімкніть його, коли вам дійсно потрібно. A Joomla API токени, навпаки, обмежується тим, що його користувач дозволено робити в Akeeba Backup."
COM_AKEEBABACKUP_CONFIG_JSONAPI_ENABLED_LABEL="Увімкнути JSON API (відновити резервну копію)"
COM_AKEEBABACKUP_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Коли каталог містить над цим числом файлів або каталогів, він вважається \"велика\". Тому Akeeba Backup спробувати повторно просканувати його в наступному кроці, щоб уникнути резервних копій часу. Значення занадто невелика призведе до резервної копії значно уповільнення. Підвище - якщо ви отримуєте помилки від часу - для прискорення резервного копіювання."
COM_AKEEBABACKUP_CONFIG_LARGEDIRTHRESHOLD_TITLE="Великий поріг каталогу"
COM_AKEEBABACKUP_CONFIG_LARGEFILE_DESCRIPTION="Файли більші, ніж цей поріг будуть упаковані в власний крок, щоб запобігти можливості часу. Цінності між 2 і 10Mb працюють краще на більшості серверів."
COM_AKEEBABACKUP_CONFIG_LARGEFILE_TITLE="Великий поріг файлів"
COM_AKEEBABACKUP_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Скільки каталогів для сканування на кожному кроці. Рекомендоване налаштування: 50. Більші значення роблять резервну копію гранично швидше, але швидше за все, щоб час від часу."
COM_AKEEBABACKUP_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Каталог сканування пакетного розміру"
COM_AKEEBABACKUP_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Скільки файлів для сканування та стиснення на кожному кроці. Рекомендоване налаштування: 100. Більші значення роблять резервну копію гранично швидше, але швидше за все, щоб час від часу або закінчуватися з пам'яті."
COM_AKEEBABACKUP_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Розмір пакету сканування файлів"
COM_AKEEBABACKUP_CONFIG_LBL_CONFWIZ_AFTER="Після Akeeba Backup закінчив налаштування, ви можете взяти резервну копію або тонку настройку його конфігурації вручну."
COM_AKEEBABACKUP_CONFIG_LBL_CONFWIZ_INTRO="Вона виглядає, як ви не налаштовані Akeeba Backup ще. Натисніть на кнопку Configuration Wizard нижче, щоб дати його налаштувати самостійно."
COM_AKEEBABACKUP_CONFIG_LEGACYAPI_ENABLED_DESC="API Legacy Front-end Backup дозволяє здійснювати регулярні резервні копії за допомогою URL інструменти доступу, такі як wget, curl. Вам потрібно включити цей варіант, якщо ви плануєте приймати резервні копії з сервером CRON вашого хостяста за допомогою wget або curl; або коли ви плануєте використовувати сторонні послуги CRON, такі як WebCRON.org. Якщо це можливо, ми рекомендуємо використовувати скрипт Native CLI CRON або Akeeba Backup  JSON API замість того, щоб вони набагато більш безпечні варіанти."
COM_AKEEBABACKUP_CONFIG_LEGACYAPI_ENABLED_LABEL="Увімкнути API Front-end Legacy Front-end (відновити завдання CRON)"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_DEBUG="Вся інформація та дебюг"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_DESCRIPTION="Цей параметр визначає, як дієслово резервний запис буде."
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_ERROR="Помилка тільки"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_INFO="Інформація"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_NONE="Ніна"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_TITLE="Рівень входу"
COM_AKEEBABACKUP_CONFIG_LOGLEVEL_WARNING="Помилки та попередження"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Автоматично видаліть старі резервні копії на основі дня, які вони були взяті на себе. ВАЖЛИВО: ЦІНА БІЛЬШЕ ЦЕ ЗАБЕЗПЕЧЕННЯ ВСІ ІНШІ КУОТА ЛАДИ (КОУНТ І ЗІЗІ) ДЛЯ ПЕРЕДАННЯ."
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Увімкнути максимальну кількість копійованих вікових квот"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="Резервне копіювання, що приймаються в цей день місяця, не буде видалено. Залиште налаштування за замовчуванням, 1, щоб завжди зберегти резервні копії, прийняті на 1-й день місяця"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="Не видаліть резервні копії, які приймають в цей день місяця"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="Резервне копіювання старше цього числа днів буде автоматично видалено. Залиште налаштування за замовчуванням, 31, щоб зберегти всі резервні копії з останнього місяця"
COM_AKEEBABACKUP_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Максимальний вік резервного копіювання, в дні"
COM_AKEEBABACKUP_CONFIG_MAXEXECTIME_DESCRIPTION="Кожен Akeeba Backup крок триватиме <em>в більшості</em> як довго, як це визначено тут. Використовуйте значення нижче, ніж ваш PHP максимальний час виконання. Зазвичай, налаштування цього до 10 секунд є адекватним, крім дуже обмежених господарів.<strong>Чай</strong>: Виберіть користувальницький і тип у бажаному значення, якщо це не на списку."
COM_AKEEBABACKUP_CONFIG_MAXEXECTIME_TITLE="Максимальний термін виконання"
COM_AKEEBABACKUP_CONFIG_MAXPACKET_DESCRIPTION="Максимальний розмір, в байтах, з кожного розширеного протоколу INSERT. Рекомендується зберегти його досить низьким, щоб MySQL не кидає помилки при відновленні вашого бази даних."
COM_AKEEBABACKUP_CONFIG_MAXPACKET_TITLE="Максимальний розмір пакету для розширених INSERT"
COM_AKEEBABACKUP_CONFIG_MINEXECTIME_DESCRIPTION="Збірник Akeeba Backup крок тривати <em>не менше</em> Якщо ви отримуєте 403 Заборонені або AJAX помилки, будь ласка, збільште цей параметр. Налаштуйте його до 0 вимкнено цю функцію.<br/><br/><strong>Порада</strong>: Виберіть Користувальницьку та тип у бажаному значенні, якщо це не на списку."
COM_AKEEBABACKUP_CONFIG_MINEXECTIME_TITLE="Мінімальний час виконання"
COM_AKEEBABACKUP_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Якщо увімкнено, Akeeba Backup намагатиметься відхилити ці розширені бази даних MySQL 5. Якщо резервне копіювання висить під час резервної копії, ви можете вимкнути це."
COM_AKEEBABACKUP_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="Збірні процедури, ФУНКЦІЇ та ТРИГЕРи"
COM_AKEEBABACKUP_CONFIG_MYSQLNOBTREE_TIP="Видаліть ОБСЛУГОВУВАННЯ BTREE і USING HASH з визначення індексу таблиці в демфаційних файлах. Це потрібно для відновлення серверів, які мають або індексуючі двигуни, вимкнені (наприклад, на найновіших версіях XAMPP). ЗАРАЗ! ЦЬОГО МНОГО ЗАБЕЗПЕЧЕННЯ ПРОБЛЕМИ НА SOME SERVERS."
COM_AKEEBABACKUP_CONFIG_MYSQLNOBTREE_TITLE="Двигун індексу ТП"
COM_AKEEBABACKUP_CONFIG_NODEPENDENCIES_DESCRIPTION="При включенні Akeeba Backup не відстежувати залежності між таблицями та переглядами. Використовуйте це лише тоді, коли у вас є сотні таблиць бази даних, і ви не використовуєте MySQL ПЕРЕГЛЯДИ, ФУНКЦІЇ, ПРОЦЕДУРИ, ТРЕГЕРи або таблиці за допомогою (екстремально рідко використовуваних) ТЕМПОРАРІЯ, МЕМОРІЯ, МЕРГЕ або ФЕДЕРАТОВАНИХ двигунів."
COM_AKEEBABACKUP_CONFIG_NODEPENDENCIES_TITLE="Відстеження залежностей"
COM_AKEEBABACKUP_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Загальна кількість застарілих записів (застосувань, файли яких були видалені) для збереження в сторінці ”Налаштування резервних копій”. Встановити до 0 без обмеження."
COM_AKEEBABACKUP_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Озолете записи, щоб зберегти"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TITLE="Видалити застарілі файли журналу"
COM_AKEEBABACKUP_CONFIG_LOGFILES_DESCRIPTION="Автоматично видаляти файли журналу успішних резервних записів. Файл журналу останнього запису резервної копії бере участь в підрахунках, але ніколи не видаляються. Якщо ваш профіль резервного копіювання має двигун після обробки, крім None або Надіслати електронною поштою тільки записи з статусом віддаленого резервного копіювання беруть участь у цій конфігурації квитанції файлів журналів. Якщо ваш профіль резервного копіювання має двигун після обробки None або надсилання електронною поштою лише записи з OK або дистанційним статусом резервного копіювання бере участь у цій установці лоток файлів журналу. Ця функція працює після обзолетених записів; квот для застарілих записів може також видалити старі файли журналу."
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_TITLE="Озолете файли квоти типу"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_DESCRIPTION="Виберіть метод, який використовується для визначення старих файлів журналу."
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_SIZE="Максимальний розмір"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_COUNT="Ризик"
COM_AKEEBABACKUP_CONFIG_LOGFILES_TYPE_DAYS="Максимальний вік"
COM_AKEEBABACKUP_CONFIG_LOGFILES_COUNT_TITLE="Кількість файлів"
COM_AKEEBABACKUP_CONFIG_LOGFILES_COUNT_DESCRIPTION="Скільки файлів журналу зберігати. Файл журналу останнього резервного копіювання може брати участь у підрахунку, але ніколи не буде видалено. Для видалення будуть розглянуті тільки файли журналу успішних резервних записів."
COM_AKEEBABACKUP_CONFIG_LOGFILES_SIZE_TITLE="Розмір файлів (Megabytes)"
COM_AKEEBABACKUP_CONFIG_LOGFILES_SIZE_DESCRIPTION="Максимальний загальний розмір файлів журналу, щоб зберегти. Файл журналу останньої копії може брати участь в розрахунку, але ніколи не буде видалено. Для видалення будуть розглянуті тільки файли журналу успішних резервних записів."
COM_AKEEBABACKUP_CONFIG_LOGFILES_DAYS_TITLE="Вік файлів логів (дата)"
COM_AKEEBABACKUP_CONFIG_LOGFILES_DAYS_DESCRIPTION="Максимальний вік у дні файлів журналу, щоб зберегти. Файл журналу останнього резервного копіювання не буде видалено. Для видалення будуть розглянуті тільки файли журналу успішних резервних записів."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Заповнюйте автоматично, коли ви завершите автентифікаційний крок 1 над. Не поділяйте те ж саме токени на багатьох сайтах. Замість, автентифікуйте кожен сайт окремо."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Доступ до Token"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_REFRESHDRIVES_TITLE="Перевантаження списку дисків"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DRIVE_TITLE="Приват"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Виберіть, який Drive (OneDrive Personal, OneDrive for Business або SharePoint) ваш обліковий запис має доступ до буде використовуватися для зберігання резервних копій. Вам потрібно закінчити автентифікацію перед цим переліком буде ізольовано. Тільки має сенс, коли у вас є доступ до більш ніж одного з приводів OneDrive (наприклад, ваш обліковий запис Microsoft є частиною підписки організації). Якщо невірно використовувати параметр ”Default Drive”, який використовує свій особистий диск за замовчуванням, як правило, еквівалентний першим параметром ”Drive (OneDrive Personal)” ви бачите нижче."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="Привід (OneDrive Особистий)"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="У каталогі Microsoft OneDrive для зберігання резервних архівів. Будь ласка, використовуйте пересувні зітхання, не застібки і завжди кладуть передню зіткненьку. Правильно: / some/thing. Wrong: деякі\\річ. Один з передових злій означає, що архіви будуть зберігатися в корені приводу."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Заповнюйте автоматично, коли ви завершите автентифікаційний крок 1 над. Не поділяйте те ж саме токени на багатьох сайтах. Замість, автентифікуйте кожен сайт окремо."
COM_AKEEBABACKUP_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Refresh Token (Токен)"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="У Joomla! 3.9 і пізніше дії користувачів вводяться всередині бази даних, створюючи таблицю з мільйонами рядків і уповільнення вашого резервного копіювання. Перевірте цей варіант, щоб виключити такі дані."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="Joomla! Журнал дій користувачів"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="При ввімкненні лише файли, модифіковані після конкретної дати та часу будуть повернені."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Фільтр умовного струму"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="Akeeba Backup буде резервні копії файлів, модифікованих після цієї дати та часу. Формат YYYY-MM-DDD hh:mm:ss. Всі дати та час виражаються в часовому поясі сервера."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Резервне копіювання файлів, модифікованих після"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Автоматично виключіть файли журналів помилок, наприклад <code>error_log</code>, незалежно від того, де вони знаходяться на сайті, що знаходяться в резервній копії. Ці файли змінюють їх розмір, коли резервне копіювання знаходиться в прогресі, який може призвести до пошкоджених резервних копій."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Виключити журнали помилок"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_FINDER_ENABLED_DESCRIPTION="Виключіть некритий контент Smart Search з резервної копії. Ви сильно рекомендується робити це з причин виконання. Після відновлення вашого сайту, будь ласка, перейдіть до компонентів, смарт пошук і натисніть на кнопку Індекс, щоб відновити дані."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_FINDER_ENABLED_TITLE="Умови та податкова практика"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Якщо увімкнено, Akeeba Backup автоматично виключить найбільш поширені папки для зберігання статистики доступу для вашого сайту. Ці папки прочитані на сайті користувача, викликаючи проблеми відновлення, якщо вони закріплюються."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ENABLED_TITLE="Тільки задні столи, встановлені Joomla! і його розширення"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ENABLED_DESCRIPTION="Включаючи цей фільтр буде пропустити резервну копію будь-якого столу в базі даних, який не був встановлений Joomla! себе, або один з його розширень. Інформація про встановлені таблиці забезпечується SQL файли, що включені до Joomla! і його розширення. Цей фільтр корисний, коли у вас є багато ярусних / скопійованих над таблицями (див. близько <code>#__users_oldcopy_20250910</code> і ви не хочете або знати, як ми були виведені один за одним. Завжди перевірте відновлення резервної копії на розробку / сервері staging при використанні цього фільтра, щоб переконатися, що ваша конфігурація не призвела до будь-яких таблиць, які ви хотіли б використовувати, випадково залишити."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ONLYJOOMLA_TITLE="Фільтрування ліміту на столи з Joomla's prefix"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_ONLYJOOMLA_DESCRIPTION="Збільшуючи цей варіант буде обмежувати ”Навколо резервних столах, встановлених Joomla! і його розширення” фільтр для таблиць, ім'я якого починається з Joomla! бази даних таблиці імена префікса. Це корисно, якщо у вас є сторонні скрипти, що працюють поза Joomla , які встановлюють свої столи без таблиці префікса, або з різним столом префікса, і ви хочете включати їх в резервну копію."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_EXTRA_TITLE="Важко дозволити ці таблиці"
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_INSTALLEDTABLES_EXTRA_DESCRIPTION="Введіть список комірок, які відокремлені комою, щоб включити в резервну копію, навіть якщо вони будуть інакше бути виключені ”Що задні таблиці, встановлених Joomla! і його розширення фільтра. Це корисно включати таблиці розширень, які встановлюють свої таблиці за допомогою методу, крім Joomla's вбудований бази даних управління schema. Чай: Якщо ви бачите таблицю, який потрібно включити в резервну копію, що має червоний значок у сторінці таблиць Exclude Database, додайте його до цього списку."
COM_AKEEBABACKUP_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Виключіть папки хост-специфічної статистики"
COM_AKEEBABACKUP_CONFIG_OUTDIR_DESCRIPTION="Каталог на сервері, де Akeeba Backup зберігає архіви резервних копій і файл журналу. Доступні такі макроси:<ul><li><strong>[DEFAULT_OUTPUT]</strong> Типовий каталог збереження</li><li><strong>[SITEROOT]</strong> Кореневий каталог сайту</li><li><strong>[ROOTPARENT]</strong> Каталог на рівень вище від кореня сайту</li></ul>"
COM_AKEEBABACKUP_CONFIG_OUTDIR_TITLE="Каталог товарів"
COM_AKEEBABACKUP_CONFIG_OVH_CONTAINERURL_DESCRIPTION="ЦЕ НЕ СТОРАЖУЄТЬСЯ КОНТЕНЕРОМ НАМЕ! Перейти до вашого хмарного менеджера OVH, серверів, розширення сервера, натисніть на зберігання. Ви побачите Контейнер URL написано там над списком ваших файлів. Скопіюйте його тут."
COM_AKEEBABACKUP_CONFIG_OVH_CONTAINERURL_TITLE="Контейнер URL"
COM_AKEEBABACKUP_CONFIG_OVH_DIRECTORY_DESCRIPTION="Довідник в контейнері зберігання об'єкта OVH зберігає резервні архіви. Щоб зберігати все на корені контейнера, будь ласка, залиште порожніми."
COM_AKEEBABACKUP_CONFIG_OVH_DIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_OVH_PASSWORD_DESCRIPTION="ЦЕ НЕ ВАШЕ OVH LOGIN PASSWORD! Створіть користувача з вашого хмарного менеджера OVH, серверів, розширте сервер, натисніть на OpenStack, натисніть кнопку Додати Користувача. Скопіюйте пароль створеного користувача тут."
COM_AKEEBABACKUP_CONFIG_OVH_PASSWORD_TITLE="Відкритий пароля"
COM_AKEEBABACKUP_CONFIG_OVH_PROJECTID_DESCRIPTION="Ваш OVH хмарний сервер проект ID. У хмарному менеджері OVH розширення вашого сервера і натисніть на посилання на зберігання. У головній зоні сторінки ви побачите назву сервера і клацніть правою нижче, є 32 символ альфа-нумерний рядок, таких як a0b1c2d3e4f56789abcdef0123456789. Це ідентифікатор проекту, який вам потрібно ввести тут."
COM_AKEEBABACKUP_CONFIG_OVH_PROJECTID_TITLE="Ідентифікатор проекту"
COM_AKEEBABACKUP_CONFIG_OVH_USERNAME_DESCRIPTION="ЦЕ НЕ ВАШЕ OVH LOGIN USERNAME! Створіть користувача з хмарного менеджера OVH, серверів, розширте сервер, натисніть на OpenStack, натисніть кнопку Додати Користувача. Скопіюйте ідентифікатор створеного користувача тут."
COM_AKEEBABACKUP_CONFIG_OVH_USERNAME_TITLE="OpenStack Ім'я користувача"
COM_AKEEBABACKUP_CONFIG_PARTSIZE_DESCRIPTION="Akeeba Backup може створювати спліт (multi-part) архіви для роботи за обмеженнями розміру за різними обставинами. Цей параметр визначає максимальний розмір кожної частини архіву. Якщо ви знижуєте його до 0, багаточасткова функція вимкнена.</br><strong>Важливо:</strong>Якщо ви використовуєте двигун обробки даних, який передає архіви до віддаленого місця (наприклад, хмарне зберігання) використовуйте налаштування близько 1 до 5 Мб для оптимальних результатів."
COM_AKEEBABACKUP_CONFIG_PARTSIZE_TITLE="Розмір частини для розгалужувальних архівів"
COM_AKEEBABACKUP_CONFIG_PCLOUD_ACCESSTOKEN_DESCRIPTION="<strong>ВАРНУВАННЯ! АУТЕНТІКАЦІЯ НЕ РОБОТАЄ ЗАБЕЗПЕЧЕННЯ ЗАХВОРЮВАННЯ ІСДУ НА СЕРВЕРІ API PCloud. ЦЕ ПОСТ-ПРОЦЕСУВАННЯ ІНЖЕНЕРІВ БУДЕ РЕМОЗУЛЬТАТИ В ОСОБИСТОМУ ВИРОБНИЦТВІ ЗАПИТАННЯ БАККУ.</strong>. Заповнені автоматично, коли ви завершите автентифікацію крок 1 вище. Якщо ви зв'язуєте інший сайт на той же обліковий запис PCloud, вам слід копіювати доступ до токена з вашого вже встановленого сайту і не спробувати запустити автентифікаційний крок 1 знову."
COM_AKEEBABACKUP_CONFIG_PCLOUD_ACCESSTOKEN_TITLE="Доступ до Token"
COM_AKEEBABACKUP_CONFIG_PCLOUD_DIRECTORY_DESCRIPTION="Назва каталогу на pCloud, де буде зберігатися резервний архів. <strong>Каталог MUST вже існує, інакше завантаження не буде.</strong>"
COM_AKEEBABACKUP_CONFIG_PCLOUD_DIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_0600="0600 - Жорсткий захист. може викликати проблеми на низьких серверах"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_0644="0644 - Середня безпека, для використання на одному сервері сайту"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_0666="0666 – Лакс безпеки, максимальна сумісність з комерційними хостами"
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_DESCRIPTION="Настроювання дозволу на файли резервного копіювання. Тільки стосується Linux, macOS, BSD та інших користувачів у стилі UNIX (NOT Windows). Якщо не застосувати залишити як 0666. Зміна, що може зробити його неможливо завантажити та / або видалити файли резервного копіювання над FTP і SFTP. Якщо сервер використовується PHP-FPM або іншим чином працює PHP під тим самим користувачем, як і ваш обліковий запис системи сайту використовує 0600 для найкращої безпеки."
COM_AKEEBABACKUP_CONFIG_PERMISSIONS_TITLE="Архів дозволів"
COM_AKEEBABACKUP_CONFIG_PLATFORM="Сайт перенаречених"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDATABASE_DESCRIPTION="Назва бази даних для резервного копіювання. Тільки використовується при переадресації бази даних сайту."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDATABASE_TITLE="Назва бази даних"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDRIVER_DESCRIPTION="Виберіть драйвер бази даних для використання при підключенні до бази даних сайту. Тільки використовується при переадресації бази даних сайту."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBDRIVER_TITLE="Драйвер бази даних"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBHOST_DESCRIPTION="Ім'я та прізвище IP адреса сервера бази даних. Зазвичай локальний привид або 127.0.0.1. Тільки використовується при переадресації бази даних сайту виводиться."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBHOST_TITLE="Сервер бази даних хостімена"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPASSWORD_DESCRIPTION="Пароль для підключення до бази даних сайту. Тільки використовується при переадресації бази даних сайту."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPASSWORD_TITLE="Письмовий"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPORT_DESCRIPTION="(необов'язково) Порт сервера бази даних слухає. Якщо ви не впевнені, залиште цей параметр порожній, щоб використовувати порт за замовчуванням (3306 для MySQL серверів). Тільки використовується при переході на сайт бази даних перевизначається."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPORT_TITLE="Порт сервера бази даних"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPREFIX_DESCRIPTION="Передфікс бази даних для резервного копіювання, включаючи андерсон, наприклад, <code>ex4m_</code>. Тільки використовується при переадресації бази даних сайту буде завантажено."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBPREFIX_TITLE="Префікс"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBENCRYPTION_TITLE="Підключення SSL сертифікату"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBENCRYPTION_DESCRIPTION="Якщо ми підключені до бази даних за допомогою SSL сертифіката? Це може бути використаний замість автентифікації імені користувача та пароля (шифроване підключення з атестацією сертифіката) або <em>на вершині</em> ім'я користувача та авентифікації пароля (шифроване підключення з паролем). Якщо ви не знаєте, що це означає встановити цей параметр для Ні та ігнорувати наступні кілька варіантів."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCIPHER_TITLE="Методи шифрування SSL/TLS"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCIPHER_DESCRIPTION="Введіть список методів шифрування для підключення до SSL сертифікатів, відокремлених колонами. Якщо лівий порожній список за замовчуванням (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) буде використаний (рекомендований)."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCA_TITLE="Адміністрування сертифікації (CA) файл"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCA_DESCRIPTION="Абсолютний шлях файлу до органу сертифікації (CA) сертифікат PEM файл вашого сервера бази даних, наприклад <code>/home/myuser/ca.pem</code>"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLKEY_TITLE="Файл приватного ключа бази даних"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLKEY_DESCRIPTION="Абсолютний шлях файлу до приватного ключа PEM файл користувача бази даних, наприклад <code>/home/myuser/myuser-key.pem</code>"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCERT_TITLE="Файл публічного ключа бази даних користувача (сертифікат)"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLCERT_DESCRIPTION="Абсолютний шлях до публічного ключа (сертифікат) PEM файл вашого користувача бази даних, наприклад <code>/home/myuser/myuser.pem</code>"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLVERIFYSERVERCERT_TITLE="Перевірити сертифікат сервера"
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBSSLVERIFYSERVERCERT_DESCRIPTION="Встановити для того, щоб перевірити сертифікат, сервер надсилається до нас. Це перевірено на файл сертифікації (CA), який ви вказали. Якщо ви отримуєте помилки з'єднання, встановлених цим No; деякі налаштування (особливо тих, що генеруються <code>mysql_ssl_rsa_setup</code>) може відключати підключення, якщо перевірка сертифікації включена. Якщо увімкнути перевірку та поле файлів CA залишається порожнім, сертифікат сервера буде перевірятися на файли сертифікації, які ви знаєте про, див. <code>openssl.cafile</code> і <code>openssl.capath</code>  PHP параметри."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBUSERNAME_DESCRIPTION="Ім'я користувача для підключення до бази даних сайту. Тільки використовується при завантаженні бази даних сайту."
COM_AKEEBABACKUP_CONFIG_PLATFORM_DBUSERNAME_TITLE="Ім'я користувача"
COM_AKEEBABACKUP_CONFIG_PLATFORM_NEWROOT_DESCRIPTION="Коли ви ввімкнено параметр Кореневого перевизначення сайту вище, Akeeba Backup повернеться всі файли та каталоги під корінь цього сайту"
COM_AKEEBABACKUP_CONFIG_PLATFORM_NEWROOT_TITLE="Примус Сайт Корінь"
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEDB_DESCRIPTION="Коли він очищається (default) Akeeba Backup автоматично заповнює базу даних сайт, який встановлюється в підключенні до (наприклад, Joomla! бази даних). При перевірці вона буде повертатися до іншої бази даних, використовуючи деталі підключення, які ви надаєте нижче."
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEDB_TITLE="База даних сайту"
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEROOT_DESCRIPTION="Коли він очищається (default) Akeeba Backup буде використовувати резервну копію всіх файлів і каталогів під корінь сайту, встановленого в. При включенні він буде резервним копіюванням файлів і каталогів під каталогом, вибраним в розділі ”Примус сайту” нижче."
COM_AKEEBABACKUP_CONFIG_PLATFORM_OVERRIDEROOT_TITLE="Корінь сайту"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Якщо увімкнено, Akeeba Backup намагатиметься підключитися до вашого FTP сервер за допомогою SSL-шифрованого підключення. <strong>Це не так само, як SFTP, SCP або \"Захищений FTP\"!</strong> Зверніть увагу, що якщо ваш сервер не підтримує цей метод, ви отримаєте помилки з'єднання."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_FTPS_TITLE="Використовуйте FTP над SSL (FTPS)"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="FTP Ім'я сервера, без протоколу. Це означає, що <code>ftp://example.com</code> ЦЕНА ЗА ЧАС: <strong>непристойна</strong> і <code>example.com</code> є дійсним. Цей двигун тільки підтримує FTP і FTPS серверів. Він <u>нема</u> підтримка SFTP, SCP та інших варіантів SSH."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_HOST_TITLE="Ім'я хостингу"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="Абсолютний <strong>FTP</strong> шлях до каталогу, де файли будуть завантажені. Якщо непевно, підключення до сервера з FileZilla, перегляньте на призначене каталог і скопіюйте шлях, що з'являється на правій панелі над каталогом. Це зазвичай щось коротке, як <code>/public_html</code>."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_INITDIR_TITLE="Початковий каталог"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="Шлях відносно початкового каталогу. Якщо вказаного каталогу немає, його буде створено. Залиште поле порожнім, щоб вивантажувати архіви безпосередньо до початкового каталогу. Доступні такі макроси:<ul><li><strong>[HOST]</strong> Ім’я хоста. УВАГА! Цей макрос не працює в режимі CRON.</li><li><strong>[DATE]</strong> Поточна дата</li><li><strong>[TIME]</strong> Поточний час</li></ul>Інші макроси описано в документації."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Напрямок"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Використовуйте FTP пасивний режим при передачі даних. Це ввімкнено за замовчуванням, оскільки це єдиний метод, який працює через брандмауери, як правило, встановлених на веб-серверах. Ви не деактивувати, якщо ви є певними, що ваш веб-сервер не стоїть за брандмауером, і що ваш FTP сервер абсолютно вимагає передачі файлів Active Mode."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Використання пасивного режиму"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="FTP пароль сервера. Зазвичай це чутливий випадок. Якщо не запевнити, будь ласка, зв'яжіться з адміністратором мережі."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Письмовий"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="FTP порт сервера. Найпоширеніший параметр 21. Якщо незабезпечити, будь ласка, зв'яжіться з адміністратором мережі."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_PORT_TITLE="Портфоліо"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Використовуйте цю кнопку, щоб перевірити FTP підключення і переглянути помилки з'єднання на відмові."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_TEST_TITLE="Тест FTP підключення"
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_USER_DESCRIPTION="FTP ім'я користувача сервера. Це зазвичай чутливий випадок. Якщо непевно, будь ласка, зв'яжіться з адміністратором мережі."
COM_AKEEBABACKUP_CONFIG_POSTPROCFTP_USER_TITLE="Ім'я користувача"
COM_AKEEBABACKUP_CONFIG_POSTPROCPARTS_DESCRIPTION="При включенні Akeeba Backup буде працювати після обробки двигуна від кожної частини, як тільки вона завершена. Коли вимкнено, Akeeba Backup буде запустити поштову обробку для всіх частин в кінці процесу резервної копії."
COM_AKEEBABACKUP_CONFIG_POSTPROCPARTS_TITLE="Обробляємо кожну частину відразу"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Ім'я сервера SFTP, без протоколу. Це означає, що <code>sftp://example.com</code> або <code>ssh://example.com</code> є <strong>недійсний</strong> і не повинні бути використані, але <code>example.com</code> є дійсним і MUST використовувати. Цей двигун підтримує тільки сервери SFTP (SSH). Він <u>не</u> підтримка FTP, FTPS або будь-який інший FTP варіант. Він вимагає розширення PHP SSH2, щоб бути встановленими і ввімкненими."
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_HOST_TITLE="Ім'я хостингу"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_INITDIR_DESCRIPTION="Абсолютний <strong>SFTP</strong> шлях (зазвичай так само, як і шлях файлової системи) до каталогу, де файли будуть завантажені. Якщо невірно підключитися до сервера з FileZilla, перегляньте на призначене каталог і скопіюйте шлях, що з'являється на правій панелі над каталогом. Зазвичай це щось довге, як <code>/home/myuser/public_html</code>."
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_INITDIR_TITLE="Початковий каталог"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PASSWORD_DESCRIPTION="пароля SFTP серверу. Він зазвичай є конфіденційним. Якщо ви не впевнені, будь ласка, зв'яжіться з адміністратором мережі."
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PASSWORD_TITLE="Письмовий"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PORT_DESCRIPTION="Порт сервера SFTP. Найпоширеніший параметр 22. Якщо не запевнити, будь ласка, зв'яжіться з адміністратором мережі."
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PORT_TITLE="Портфоліо"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PRIVKEY_DESCRIPTION="ЗНАЙТЕ ДОКУМЕНТАЦІЯ ДОКУМЕНТІВ, ЩО ВИКОРИСТАННЯ. Шлях абсолютної файлової системи до приватного ключа RSA / DSA використовується для підключення до віддаленого сервера. Якщо це зашифровано, введіть пасфрак у поле пароля вище. Якщо ви не знаєте, що це таке, або якщо ви думаєте, що вам потрібно запитати про це, залишити його порожнім і не попросіть нам про це."
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PRIVKEY_TITLE="Приватний файл ключа (advanced)"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PUBKEY_DESCRIPTION="ЗБЕРІГАННЯ ДОКУМЕНТАЦІЇ ДОКУМЕНТІВ. Шлях абсолютної файлової системи до публічного ключа RSA / DSA, який використовується для підключення до віддаленого сервера. Якщо у вас немає уявлення про те, що це, або якщо ви думаєте, що ви повинні попросити підтримку про це, залиште його порожнім і не запитайте нас про це."
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_PUBKEY_TITLE="Публічний ключ Файл (advanced)"
COM_AKEEBABACKUP_CONFIG_POSTPROCSFTP_TEST_DESCRIPTION="Використовуйте цю кнопку, щоб перевірити підключення SFTP і переглянути помилки з'єднання на відмові."
