COM_AKEEBABACKUP_S3_REGION_DESCRIPTION="Виберіть регіон S3, де ваш відро знаходиться в. Будь ласка, проконсультуйтеся http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region  <strong>УВАГА! Через API Amazon ви MUST виберіть розташування вашого відра при використанні методу підпису v4. Метод підпису v4 є MANDATORY для всіх відро, створених в будь-якій області, яка пройшла онлайн після січня 2014 року, таких як Франкфурт і Сао Паоло.</strong> Це обмеження Amazon, не Akeeba Backup обмеження. Дякуємо вам за розуміння."
