COM_AKEEBABACKUP_CONFIG_UPLOADKICKSTART_DESCRIPTION="Коли перевірили копію Akeeba Kickstart Професійні буде завантажено до віддаленого сховища, зазначеного в двигуні після обробки вище (крім двигунів None та електронної пошти). Це має сенс при використанні FTP або SFTP для передачі вашого сайту на інший сервер: як ваш архів резервних копій і Kickstart, який використовується для його вилучення, буде завантажений на ваш віддалений сервер. Після завершення резервної копії ви можете просто запустити Kickstart на віддаленому сайті і приступити до його відновлення. Так просто!"
