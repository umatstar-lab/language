COM_AKEEBABACKUP_CONFIG_S3RRS_DESCRIPTION="Виберіть клас зберігання для ваших даних. Стандарт - це регулярне зберігання для критичних даних бізнесу. Будь ласка, зверніться до документації Amazon S3 для опису кожного класу зберігання."
COM_AKEEBABACKUP_CONFIG_S3RRS_TITLE="Клас зберігання"
