COM_AKEEBABACKUP_CONFIG_FTPTEST_BADPREFIX="Ви не повинні додавати ftp:// prefix до вашого FTP Розп'яття. Будь ласка, зніміть ftp:// prefix і retry."
COM_AKEEBABACKUP_CONFIG_FTPTEST_NOUPLOAD="Akeeba Backup вдалося підключити до сервера, але це не може завантажувати файл тестування. Завантажити резервну копію можна не вдалося."
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Заповнено автоматично, коли ви завершите автентифікаційний крок 1 над. Якщо ви зв'язуєте інший сайт на той самий обліковий запис Google Диска не копіюйте привідний токени і НЕ запустіть автентифікацію. Замість цього просто скопіюйте токени Refresh з попереднього сайту до цього."
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_TITLE="Доступ до Token"
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_DIRECTORY_DESCRIPTION="У каталозі Google Диску можна зберігати резервні архіви. Будь ласка, використовуйте пересувні знімки. Правильно: деякі / старіння. Виконайте: деякі\\річ. Єдина передня вішалка означає, що архіви будуть зберігатися в корені диска. ЗНАЙТЕ ДОКУМЕНТАЦІЯ: Шляхи в Google Drive є неоднозначним!"
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_DIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_REFRESHTOKEN_TITLE="Refresh Token (Токен)"
