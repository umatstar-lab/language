COM_AKEEBABACKUP_CLI_BACKUP_MIGRATE_HELP="<info>%command.name%</info> перемістить налаштування та резервні копії архівів з Akeeba Backup 8, якщо це встановлено. ВАЖЛИВО: ЦЕ ПОВЕРХНЕНО ВСІХ СУЧАСНИХ РОБОТИ З ВИКОРИСТАННЯМ ДЛЯ КОНФІРМАЦІЇ. Ця команда призначена для використання тільки відповідальними дорослими.\nВикористання: <info>php? _ Укра?на %command.full_name%</info>"
