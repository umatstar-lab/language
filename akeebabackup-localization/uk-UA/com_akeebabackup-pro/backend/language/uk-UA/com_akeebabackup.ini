COM_AKEEBABACKUP_CONFIG="Налаштування"
COM_AKEEBABACKUP_CONFIGURATION="Akeeba Backup  <small>Параметри конфігурації компонентів</small>"
COM_AKEEBABACKUP_CONFIG_ADVANCED="Розширена конфігурація"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBALF_DESC="Akeeba Backup поламає крок обробки після архівування великого файлу. Коли ви ввімкнете цей параметр, Akeeba Backup буде працювати швидше. Однак це може призвести до часу або внутрішньої помилки сервера."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBALF_LABEL="Вимкнений крок розриву після великих файлів"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBBD_DESC="Akeeba Backup поламає крок обробки, коли він починає працювати на новому домені. Це покращує віростійкість процесу, але вона розширює час резервного копіювання на 10-20 секунд. Коли ви ввімкнете цей варіант, Akeeba Backup працювати швидше. Однак ви можете випробувати стрибкову поведінку в кроках, які повідомляють на сторінці резервної копії."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBBD_LABEL="Вимкнений крок перерву між доменами"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBBLF_DESC="Akeeba Backup поламає крок обробки до архівування великого файлу. При цьому ви ввімкнете цей параметр, Akeeba Backup буде працювати швидше. Однак це може призвести до часу або внутрішньої помилки сервера."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBBLF_LABEL="Вимкнений крок перерву перед великими файлами"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBPA_DESC="Akeeba Backup поламає крок обробки, якщо він думає, що він буде виконуватися з часу до архіву файлу. Цей розрахунок не повністю точний і може призвести до повільних резервних копій. Коли ви ввімкнете цей варіант, Akeeba Backup працювати швидше. Однак це може призвести до своєчасності або внутрішніх помилок сервера."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBPA_LABEL="Вимкнений проактивний покроковий розбиття"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBPP_DESC="Akeeba Backup розірвати крок обробки між підкроками завершення резервної копії та після обробки. Це може додати близько 10 секунд до загального часу резервного копіювання. При увімкненні цього параметра Akeeba Backup працювати швидше. Однак це може призвести до своєчасності або внутрішніх помилок сервера."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SBPP_LABEL="Вимкнена покрокова перерва у фіналізаці"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Якщо ваш сервер не працює PHP в безпечному режимі і підтримує set_time_limit(), Akeeba Backup намагатиметься встановити нескінченну PHP максимальний час виконання для роботи по потенційним питанням часу"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Встановити нескінченний PHP обмеження часу"
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Розмістіть Akeeba Backup , щоб спробувати і збільшити PHP' обмеження пам'яті до смішно високої значення (16Gb). Це дозволяє компресувати більші файли і завантажувати більші архіви резервного копіювання з використанням параметрів віддаленого зберігання пам'яті, таких як WebDAV. Примітка: це тільки встановлює ліміт для максимального споживання пам'яті. У більшості випадків Akeeba Backup' резервний двигун споживає <em>набагато менше</em> пам'ять, ніж це, як правило, в області низької 20Mb. Стискаючи і завантаження великих файлів також вимагає зміни інших варіантів в сторінці конфігурації профілю резервного копіювання."
COM_AKEEBABACKUP_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Встановити великий ліміт пам'яті"
COM_AKEEBABACKUP_CONFIG_ANGIE_KEY_DESCRIPTION="Ви можете додатково захистити пароль Akeeba Backup Відновлення скрипту, запобігаючи несанкціонованому доступу до інсталятора. Коли ви запустіть інсталятор, який ви попросите ввести цей пароль. Зверніть увагу, що пароль є конфіденційним, тобто ABC, abc і Abc є три різні паролі."
COM_AKEEBABACKUP_CONFIG_ANGIE_KEY_TITLE="Відновлення пароля"
COM_AKEEBABACKUP_CONFIG_ARBITRARYFEEMAIL_DESC="Надсилання електронної пошти на цю адресу (збережіть порожній лист для електронної пошти всіх користувачів Super)"
COM_AKEEBABACKUP_CONFIG_ARBITRARYFEEMAIL_LABEL="Адреса електронної пошти"
COM_AKEEBABACKUP_CONFIG_ARCHIVENAME_DESCRIPTION="Шаблон назви архіву резервної копії, якщо застосовно. Доступні такі макроси:<ul><li><strong>[HOST]</strong> Ім’я хоста. УВАГА! Цей макрос не працює в режимі CRON.</li><li><strong>[DATE]</strong> Поточна дата</li><li><strong>[TIME_TZ]</strong> Поточний час і часовий пояс</li></ul>Інші макроси описано в документації."
COM_AKEEBABACKUP_CONFIG_ARCHIVENAME_TITLE="Ім'я архіву резервного копіювання"
COM_AKEEBABACKUP_CONFIG_ARCHIVERENGINE_DESCRIPTION="Визначає Akeeba Backup's архівний формат. Деякі двигуни, такі як DirectFTP, насправді не виробляють архіви, але подбайте про передачу файлів на інші сервери."
COM_AKEEBABACKUP_CONFIG_ARCHIVERENGINE_TITLE="Архіватор двигуна"
COM_AKEEBABACKUP_CONFIG_AUTORESUME_DESCRIPTION="Коли цей параметр оглянутий Akeeba Backup буде захоплювати резервну копію, коли сервер відповідає з помилкою. Коли ця опція ввімкнена, Akeeba Backup намагатиметься відновити резервну копію, повторивши останній крок. Це стосується тільки резервних копій. Він також не дозволить вам успішно відновити всі резервні копії, що призведе до помилки: лише спроби копіювання тимчасово заблоковані обмеженнями використання сервера або проблемами мережевого аутсорсингу можуть бути відновлені."
COM_AKEEBABACKUP_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Скільки часу потрібно Akeeba Backup птиця, що нагадує резервну копію до остаточного завершення. 3 до 5 ретріс найкраще працює на більшості серверів."
COM_AKEEBABACKUP_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Максимальні рети резервного кроку після помилки AJAX"
COM_AKEEBABACKUP_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Скільки секунд, щоб чекати перед передачею резервної копії. Бажано встановити це на 30 секунд або більше (120 секунд рекомендується в більшості випадків) для надання вашого сервера необхідного часу для розблокування процесу резервного копіювання до Akeeba Backup ретріс, щоб завершити його."
COM_AKEEBABACKUP_CONFIG_AUTORESUME_TIMEOUT_TITLE="Очікуваний період перед перегрівом кроку резервної копії"
COM_AKEEBABACKUP_CONFIG_AUTORESUME_TITLE="Відновлення резервної копії після помилки AJAX"
COM_AKEEBABACKUP_CONFIG_AZURE_ACCOUNTNAME_DESCRIPTION="Ім'я вашого облікового запису. Якщо кінцева точка є foobar.blob.core.windows.net, то ваше ім'я облікового запису <strong>foobar</strong> і ви повинні ввести <em>foobar</em> в цій коробці."
COM_AKEEBABACKUP_CONFIG_AZURE_ACCOUNTNAME_TITLE="Назва облікового запису"
COM_AKEEBABACKUP_CONFIG_AZURE_CONTAINER_DESCRIPTION="Контейнер для зберігання Windows Azure BLOB для збереження резервних архівів. контейнер повинен бути вже існуючий."
COM_AKEEBABACKUP_CONFIG_AZURE_CONTAINER_TITLE="Контейнери"
COM_AKEEBABACKUP_CONFIG_AZURE_DIRECTORY_DESCRIPTION="У каталозі в контейнері для зберігання Windows Azure BLOB зберігати резервні архіви. Щоб зберегти все на корені контейнера, будь ласка, залиште порожніми."
COM_AKEEBABACKUP_CONFIG_AZURE_DIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_AZURE_KEY_DESCRIPTION="Ви можете знайти ключ основного доступу на сторінці облікового запису на windows.azure.com. Скопіювати та вставити його тут. Він завжди має два рівні знаки в кінці."
COM_AKEEBABACKUP_CONFIG_AZURE_KEY_TITLE="ключ початкового доступу"
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_ACCOUNTID_DESCRIPTION="Введіть номер мобільного, який Ви вказали при укладаннi договору з банком - для ідентифікації. <a href='https://secure.backblaze.com/b2_buckets.htm'>Ваш обліковий запис Backblaze</a> Після натискання клавіші ”Показати ідентифікатор облікового запису та додаток” натисніть кнопку ”Показати”. Якщо ви використовуєте свій ключ, будь ласка, введіть ідентифікатор облікового запису замість цього."
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_ACCOUNTID_TITLE="Ім'я користувача"
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Введіть свій ключ програми Backblaze. Ви можете знайти цю інформацію в <a href='https://secure.backblaze.com/b2_buckets.htm'>Ваш обліковий запис Backblaze</a> після натискання на ”Показати ідентифікатор облікового запису та ключ додатків”. <strong>WARNING</strong>! Це тільки показано для вас ONCE за допомогою Backblaze. Щоб відобразити його знову, вам доведеться відновити ключ додатків, викликаючи всі раніше пов'язані екземпляри Akeeba Backup , щоб отримати unlinked до тих пір, поки ви вводите там <em>новий</em> ключ застосування."
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_APPLICATIONKEY_TITLE="Ключ до застосування"
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_BUCKET_DESCRIPTION="Ваше ім'я задньої частини відро"
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_BUCKET_TITLE="Кошик"
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_DIRECTORY_DESCRIPTION="У каталозі, де будуть зберігатися архіви резервних копій. Залиште заготовку для зберігання файлів всередині кореня відра."
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Коли ви ввімкнете цей параметр Akeeba Backup буде виконувати одинарні частини, що надходить до Backblaze. Вам потрібно буде використовувати менший розмір частини для Спліт-архів налаштування в конфігурації архіватора двигуна, щоб запобігти завантаженню від часу, викликаючи процес резервного копіювання, щоб не вдалося."
COM_AKEEBABACKUP_CONFIG_BACKBLAZE_DISABLEMULTIPART_TITLE="Відключення багаточастинного завантаження"
COM_AKEEBABACKUP_CONFIG_BACKEND_HEADER_DESC="Варіанти інструктування Akeeba Backup як обробляти скрипт назад"
COM_AKEEBABACKUP_CONFIG_BACKEND_HEADER_LABEL="Зареєструватися"
COM_AKEEBABACKUP_CONFIG_BACKEND_LOCALTIME_DESC="Показувати час початку резервного копіювання на сторінці керування копіями в часовому поясі поточного користувача? Якщо вибрати «Ні», час буде показано в GMT. Цей параметр не впливає на змінні [DATE] і [TIME] у назві файлу або типовому описі. Для них використовується параметр «Часовий пояс резервного копіювання»."
COM_AKEEBABACKUP_CONFIG_BACKEND_LOCALTIME_LABEL="Місцевий час в управлінні резервними копіями"
COM_AKEEBABACKUP_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="Чи можу я дати користувачам відновити сайт, варіант видалити все перед екстракцією архіву? Цей варіант стосується тільки професійної версії нашого програмного забезпечення. ВАЖЛИВО! ЦЕ ВИКОНАВЧЕНО ДАНГРУЗ. ЗНАЙТЕ ДОКУМЕНТАЦІЯ ДУЖЕ ЗБЕРІГАННЯ ІТ. ЯКЩО ВИ ВИКОРИСТАННЯ ЦІЙ ОСОБЛИВОСТІ ЗАБЕЗПЕЧЕННЯ, ЩО ВИ ЗДОРОВ’Я ВИНАХОДУЄТЬСЯ БУДІВНИЦТВО ТА ЯКІСТЬ ВСІХ ВІДПОВІДНОСТІ ТА ЛІАБІЛЬНОСТІ."
COM_AKEEBABACKUP_CONFIG_BACKEND_SHOWDELETEONRESTORE_LABEL="Показати варіант «Видалити все перед вилученням»"
COM_AKEEBABACKUP_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Часовий пояс"
COM_AKEEBABACKUP_CONFIG_BACKEND_TIMEZONETEXT_DESC="Часовий пояс для відображення поруч з часом запуску резервного копіювання в сторінці Керування резервними записами.<br/>Ні: немає Suffix відображається (не рекомендується).<br/>Часовий пояс: скорочена часова зона, наприклад, CEST для Центральної Європи Summer Time.<br/>Глосарій Offset: офсет від GMT timezone, наприклад, GMT+01:00 (=дві години попереду GMT i.e. Central Europe Standard Time). Зверніть увагу, що під час денних ліхтарів заощаджує на екрані на + 1 годину до регулярного часу поясу. Ця різниця зсуву буде показана в цьому форматі."
COM_AKEEBABACKUP_CONFIG_BACKEND_TIMEZONETEXT_GMTOFFSET="Зсув від GMT"
COM_AKEEBABACKUP_CONFIG_BACKEND_TIMEZONETEXT_LABEL="Тайсон suffix"
COM_AKEEBABACKUP_CONFIG_BACKEND_TIMEZONETEXT_NONE="Ніна"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_ALLDB="Всі налаштовані бази даних (архівний файл)"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_DBONLY="Головна база даних сайту тільки (SQL файл)"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_DESCRIPTION="Який вид резервної копії сайту ви хочете Akeeba Backup для виконання"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_FILEONLY="Файли сайту"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_FULL="Повна резервна копія сайту"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_INCFILE="Файли тільки, незрівнянні"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_INCFULL="Повний сайт, вхідні файли"
COM_AKEEBABACKUP_CONFIG_BACKUPTYPE_TITLE="Тип резервного копіювання"
COM_AKEEBABACKUP_CONFIG_BACTHSIZE_DESCRIPTION="Низько це значення призведе до того, щоб уникнути HTTP 500 помилок під час резервного копіювання величезних таблиць"
COM_AKEEBABACKUP_CONFIG_BACTHSIZE_TITLE="Кількість рядків за партію"
COM_AKEEBABACKUP_CONFIG_BIGFILETHRESHOLD_DESCRIPTION="Файли, що над цим розміром будуть зберігатися некомпресованими, або їх обробка буде пропускати декілька кроків (в залежності від двигуна архіватора) для того, щоб уникнути часу. Ми пропонуємо збільшити цю вартість тільки на швидко і надійному сервері."
