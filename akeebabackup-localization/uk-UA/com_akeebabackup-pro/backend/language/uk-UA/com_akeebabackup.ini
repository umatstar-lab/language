COM_AKEEBABACKUP_CONFIG_S3CUSTOMENDPOINT_DESCRIPTION="Для використання з третіми особами послуги зберігання даних, що реалізують S3-сумісний API. Введіть кінцеву точку (API URL) API для зберігання сторонніх осіб S3-сумісний. IMPORTANT: Якщо ви використовуєте Amazon S3, ви <strong>MUST LEAVE ЦІЙ BLANK</strong>."
COM_AKEEBABACKUP_CONFIG_S3CUSTOMENDPOINT_TITLE="Спеціальна кінцева точка"
