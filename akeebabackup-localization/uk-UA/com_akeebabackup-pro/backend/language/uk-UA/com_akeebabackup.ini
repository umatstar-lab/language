COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_TEST_FAIL="Чи не підключено до віддаленого сервера SFTP. Повідомлення про помилку:"
COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_TEST_OK="Успішно підключено до віддаленого сервера SFTP. Примітка: початкове налаштування каталогу не було перевірено."
COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_TEST_TITLE="Тест SFTP підключення"
COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_USER_DESCRIPTION="Ім'я користувача SFTP. Зверніть увагу, що сервер SFTP повинен дозволити віртуацію імені користувача/password."
COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_USER_TITLE="Ім'я користувача"
