COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_FILEREADABLE="Akeeba Backup виявлений, що ваш вихідний каталог резервної копії <code>%s</code> знаходиться під вашим веб-кореневим сайтом. Його вміст, включаючи архіви резервних копій, доступні над веб-сайтом. Однак, не можна перерахувати файли в каталозі з веб-браузером. <strong>Це може бути питання безпеки</strong>. Акушер може вгадати назву резервного архіву і завантажити його безпосередньо, обходячи вашу безпеку сайту."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_FIX_RANDOM="Ваше ім'я файлу ”Backup” буде змінено, щоб включити <code>[RANDOM]</code> змінний в ньому. Це робить висновок про файли резервного копіювання практично неможливо, додаючи 16 різних, випадкових літер та / або чисел у файлі резервного архіву кожного разу, коли ви приймаєте резервну копію."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="Файл <code>.htaccess</code> і <code>web.config</code> буде записано до цієї папки. На більшості серверів це достатньо для запобігання прямого завантаження будь-якого файлу всередині його і відключення списку його файлів. Ми також маємо рішення для серверів, де ці спеціальні файли не мають ефекту. Ще один три файли називають <code>index.php</code>, <code>index.html</code> і <code>index.htm</code> також будуть написані в цю папку. Ці індексні файли запобігають веб-серверу з переліку імен резервних архівів і резервних систем."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_ISSYSTEM="Крім того, ваш вихідний каталог є таким же, як або підкатегорією папки, яка використовується Joomla і його розширення для власних, загальнодоступних файлів."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="Вам потрібно перейти на сторінку конфігурації Akeeba Backup і вибрати інший вихідний каталог."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_LISTABLE="Akeeba Backup виявлений, що ваш вихідний каталог резервної копії <code>%s</code> знаходиться під вашим веб- корінь сайту. Його вміст, включаючи ваші архіви резервної копії, доступні над веб-сайтом. Крім того, можна перерахувати файли в каталозі i.e. він дає список ваших резервних архівів, коли ви доступ до нього з веб-браузером. <strong>Це великий номер безпеки</strong>. Акушер може отримати доступ до цієї папки з веб-браузера і завантажити ваші архіви резервного копіювання безпосередньо, обходячи вашу безпеку сайту."
COM_AKEEBABACKUP_CPANEL_LBL_OUTDIR_TRASHHOST="На жаль, ваш сервер не підтримує будь-який розумний метод для забезпечення каталогу. Незалежно від того, що ми робимо це завжди списуємо імена файлів, які він містить і дозволяють завантажувати їх з веб-переглядача. Ваш один і єдиний варіант полягає в тому, щоб створити резервний вихідний каталог над кореневим сайтом."
