COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_HOST_TITLE="Ім'я хостингу"
COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_INITDIR_DESCRIPTION="Будь ласка, введіть каталог, де файли будуть завантажені до. Якщо ви не впевнені, користуйтеся клієнтом робочого столу SFTP, підключайте до свого сервера, навігуйте до потрібного каталогу і скопіюйте шлях, який відображається тут. Шлях повинен бути в абсолютному форматі, наприклад /користувачів/myusername/public_html"
COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_INITDIR_TITLE="Початковий каталог"
