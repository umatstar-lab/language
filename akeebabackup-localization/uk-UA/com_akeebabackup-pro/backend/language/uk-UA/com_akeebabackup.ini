COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_TEAMDRIVE_DESCRIPTION="Який Google Drive ви хочете зберігати файли. Вам потрібно закінчити автентифікацію перед цим переліком. Тільки має сенс, коли у вас є доступ до Google Team Drive (наприклад, G Suite Business або Enterprise Plan користувачів). Якщо не застосувати використання параметра ”Google Drive (personal)”."
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_TEAMDRIVE_OPT_PERSONAL="Google Диск (особистий)"
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_TEAMDRIVE_TITLE="Приват"
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_TITLE="Завантажте до папок «Shared With Me»"
COM_AKEEBABACKUP_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_DESCRIPTION="Якщо увімкнено, Akeeba Backup буде шукати папки в Збірнику з мене, перш ніж шукати ту ж назву папки у вашому Приводі. Це набагато повільніше і може призвести до завантаження в неправильну папку, якщо багато спільного з тим же іменем існують у вашому обліковому записі Google Диска."
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEACCESSKEY_DESCRIPTION="Ключ доступу із засобу керування ключами Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEACCESSKEY_TITLE="ключ доступу"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEBUCKET_DESCRIPTION="Ваше ім'я відра зберігання Google. Переконайтеся, що це було показано на веб-додатку браузера Google Cloud Storage (https://sandbox.google.com/storage)"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEBUCKET_TITLE="Кошик"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEDIRECTORY_DESCRIPTION="У каталозі, де будуть зберігатися архіви резервних копій. Залиште заготовку для зберігання файлів всередині кореня відра."
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEDIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEJSON_CREDS_DESC="Вставте тут вміст JSON Криміналовий файл Google Cloud Console виробляється при налаштуванні облікового запису служби для резервного програмного забезпечення. Пам'ятайте, що включіть фігурні дужки на початку та кінці тексту."
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEJSON_CREDS_TITLE="Зміст googlestorage.json (читати документацію)"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGELOWERCASE_DESCRIPTION="Якщо увімкнено, Akeeba Backup намагатиметься змінити назву відра на всі нижні літери, тобто MyBucket буде перетворюватися в mybucket. Якщо ви створили відро з літерами верхнього вікна, наприклад, MyNewBucket, ознайомтеся з цим параметром і переконайтеся, що ім'я відра зашифровано точно так, як він з'являється у вашому веб-додатку Google Cloud Storage (https://sandbox.google.com/storage)."
