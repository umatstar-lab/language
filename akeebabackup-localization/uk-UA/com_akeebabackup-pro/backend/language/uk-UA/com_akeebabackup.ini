COM_AKEEBABACKUP_CONFIG_S3_ACL_DESCRIPTION="Виберіть дозволи завантаженого файлу. У більшості випадків «Приват», або «Отримувач може прочитати» найбільш доречні варіанти. Якщо ви використовуєте третій особі, S3-сумісне обслуговування, ви можете скористатися «Приватним» замість налаштування за замовчуванням."
