COM_AKEEBABACKUP_CONFIG_FRONTEND_HEADER_DESC="<strong>Ці параметри поширюються тільки на Akeeba Backup Professional</strong>. Контроль параметрів віддалених і запланованих функцій для Akeeba Backup. Для отримання додаткової інформації про встановлення резервних копій, будь ласка, перевірте сторінку інформації Scheduling в Akeeba Backup Professional або нашу документацію."
