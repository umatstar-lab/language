COM_AKEEBABACKUP_CONFIG_CLOUDME_USERNAME_TITLE="Ім'я користувача"
COM_AKEEBABACKUP_CONFIG_COUNTQUOTA_ENABLE_DESCRIPTION="Якщо увімкнено, Akeeba Backup буде вилучено старі файли резервної копії, якщо вони більше, ніж ліміт, визначений нижче."
COM_AKEEBABACKUP_CONFIG_COUNTQUOTA_ENABLE_TITLE="Увімкнути кількість квот"
COM_AKEEBABACKUP_CONFIG_COUNTQUOTA_VALUE_DESCRIPTION="Akeeba Backup буде видаляти старі резервні файли, якщо вони більше, ніж ліміт, визначений в цій налаштування. Багаточасткові резервні копії вважаються як <em>один</em> файл!<br/><br/>Чай<strong>Чай</strong>: Виберіть користувальницький і тип у бажаному значення, якщо це не на списку."
COM_AKEEBABACKUP_CONFIG_COUNTQUOTA_VALUE_TITLE="Кількість квоти"
COM_AKEEBABACKUP_CONFIG_DATEFORMAT_DESC="Зміна дати початку / часу резервних копій відображається на сторінці ”Налаштування резервних копій”. Залиште порожній, щоб використовувати форматування за замовчуванням. Ви можете використовувати параметри форматування PHP's дата функції, див.: http://www.php.net/manual/en/function.date.php"
COM_AKEEBABACKUP_CONFIG_DATEFORMAT_LABEL="Дата формат"
COM_AKEEBABACKUP_CONFIG_DELETEAFTER_DESCRIPTION="Якщо увімкнено архів резервного копіювання буде видалено з цього сервера, як тільки успішно завершуються після обробки."
COM_AKEEBABACKUP_CONFIG_DELETEAFTER_TITLE="Видалити архів після обробки"
COM_AKEEBABACKUP_CONFIG_DEREFERENCESYMLINKS_DESCRIPTION="При включенні символічні посилання будуть слідувати так само, як і звичайні файли і каталоги. При цьому не перевірте, символічні посилання не будуть дотримуватися. Якщо ви використовуєте символічні посилання, які призводять до нескінченної петлі посилання, зніміть цей варіант."
COM_AKEEBABACKUP_CONFIG_DEREFERENCESYMLINKS_TITLE="Відносні посилання"
COM_AKEEBABACKUP_CONFIG_DESKTOP_NOTIFICATIONS_DESC="Якщо ви хочете, щоб дозволити сповіщення про робочий стіл, які будуть відображатися? Повідомлень робочого столу з'являються, коли починаються резервні копії, закінчуються, кидає попередження або альтанки. Вони відображаються тільки на сумісних браузерах (типово: Chrome, Safari, Firefox, Opera) якщо ви даєте Akeeba Backup дозвіл на відображення настільних повідомлень при підказці на сторінці панелі управління. Цей варіант дозволяє тільки контролювати, чи повинен бути відображений цей запит. Після того як ви приймаєте або відхиляєте повідомлення про робочий стіл дозволи на це налаштування <strong>ніякого ефекту</strong>. Єдиний спосіб увімкнути або вимкнути сповіщення на робочий стіл буде через налаштування браузера."
COM_AKEEBABACKUP_CONFIG_DESKTOP_NOTIFICATIONS_LABEL="Запитати про дозвіл на робоче місце"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_FTPS_DESCRIPTION="Якщо увімкнено, Akeeba Backup намагатиметься підключитися до вашого FTP сервер за допомогою SSL-шифрованого підключення. <strong>Це не так само, як SFTP, SCP або \"Захищений FTP\"!</strong> Зверніть увагу, що якщо ваш сервер не підтримує цей метод, ви отримаєте помилки з'єднання."
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_FTPS_TITLE="Використовуйте FTP над SSL (FTPS)"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_HOST_DESCRIPTION="FTP Назва сервера, без протоколу. Це означає, що <code>ftp://example.com</code> є <strong>недійсним</strong> і <code>example.com</code> діє. Akeeba Backup тільки підтримує FTP і FTPS серверів. Він <u>не</u> підтримують SFTP, SCP та інші варіанти SSH."
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_HOST_TITLE="Ім'я хостингу"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_INITDIR_DESCRIPTION="Абсолютний <strong>FTP</strong> шлях до каталогу, де файли будуть завантажені. Якщо непевно, підключення до сервера з FileZilla, перегляньте на призначене каталог і скопіюйте шлях, що з'являється на правій панелі над каталогом. Це зазвичай щось коротке, як <code>/public_html</code>."
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_INITDIR_TITLE="Початковий каталог"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_PASSIVE_DESCRIPTION="Використовуйте FTP пасивний режим при передачі даних. Це ввімкнено за замовчуванням, оскільки це єдиний метод, який працює через брандмауери, як правило, встановлених на веб-серверах. Ви не вимкнено, якщо ви впевнені, що ваш веб-сервер не за кадром і що ваш FTP сервер абсолютно вимагає передачі файлів Active Mode."
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_PASSIVE_TITLE="Використання пасивного режиму"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_PASSWORD_DESCRIPTION="FTP пароль сервера. Зазвичай це чутливий випадок. Якщо не запевнити, будь ласка, зв'яжіться з адміністратором мережі."
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_PASSWORD_TITLE="Письмовий"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_PORT_DESCRIPTION="FTP порт сервера. Найпоширеніший параметр 21. Якщо незабезпечити, будь ласка, зв'яжіться з адміністратором мережі."
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_PORT_TITLE="Портфоліо"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_TEST_DESCRIPTION="Використовуйте цю кнопку, щоб перевірити FTP підключення і переглянути помилки з'єднання на відмові."
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_TEST_FAIL="Чи не підключено до віддаленого сервера FTP ."
