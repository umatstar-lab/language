COM_AKEEBABACKUP_CONFIG_CLOUDFILESDIRECTORY_DESCRIPTION="Каталог в контейнері CloudFiles для зберігання резервних архівів. Щоб зберігати все на корені контейнера, будь ласка, залиште порожнім."
