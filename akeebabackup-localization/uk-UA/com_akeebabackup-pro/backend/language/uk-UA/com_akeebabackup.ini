COM_AKEEBABACKUP_CONFIG_SAVE_OK="Введено в експлуатацію конфігурацію"
COM_AKEEBABACKUP_CONFIG_SCANENGINE_DESCRIPTION="Визначте, як Akeeba Backup призведе до копіювання файлів і папок вашого сайту, щоб визначити, які з них потрібно повернути."
COM_AKEEBABACKUP_CONFIG_SCANENGINE_TITLE="Filesystem сканер двигуна"
COM_AKEEBABACKUP_CONFIG_SECRETWORD_DESC="Цей пароль буде використовуватися з Front-end Backup (Legacy API) і JSON Особливості API для захисту їх від несанкціонованого доступу. Akeeba Backup не дозволить ці функції, якщо ви використовуєте довгий, складний пароль тут. Консультація документації для отримання додаткової інформації.<br><br><strong>Примітка безпеки:</strong> будь-який, хто знає це Secret Word має повне, Super User контроль над Akeeba Backup через віддалені API (за винятком, завантаження та видалення резервних копій, і зміни кожного варіанту). Порада це як супер пароль користувача: зберегти його секрет і змінити його відразу, якщо ви підозрюєте, що він був піддається."
COM_AKEEBABACKUP_CONFIG_SECRETWORD_LABEL="Таємне слово"
COM_AKEEBABACKUP_CONFIG_SECURITY_USEENCRYPTION_DESCRIPTION="При включенні налаштування конфігурації зашифровані за допомогою галузевого стандарту AES-128."
COM_AKEEBABACKUP_CONFIG_SECURITY_USEENCRYPTION_LABEL="Використання шифрування"
COM_AKEEBABACKUP_CONFIG_SECURITY_NO_FLUSH_LABEL="Ні флуш()"
COM_AKEEBABACKUP_CONFIG_SECURITY_NO_FLUSH_DESCRIPTION="Вимкнено використання flush() при операціях AJAX. Тільки ввімкніть на дуже зруйнованих серверах, де резервне копіювання не буде навіть розпочато."
COM_AKEEBABACKUP_CONFIG_SECURITY_BACKEND_BACKUP_CSRF_LABEL="Резервне копіювання резервного копіювання перевіряє анти-CSRF токен"
COM_AKEEBABACKUP_CONFIG_SECURITY_BACKEND_BACKUP_CSRF_DESCRIPTION="Залиште цей набір для Так. Резерви, взяті з Akeeba Backup's Backend потім перевірте Joomla's anti-CSRF (безпека) токен, тому інший сайт не може зробити початок браузера або продовжити резервну копію без вас. Тільки встановити це для Ні, якщо резервні копії завжди не з'являються помилки безпеки, оскільки обробка вашого сервера порушується і ваш господар не може виправити його. Навіть тоді тільки зареєстровані користувачі з дозволу ”Backup” можуть приймати резервні копії."
COM_AKEEBABACKUP_CONFIG_ACCURATE_PHP_CLI_LABEL="Точність PHP-CLI шлях"
COM_AKEEBABACKUP_CONFIG_ACCURATE_PHP_CLI_DESCRIPTION="Увімкнути, щоб мати Akeeba Backup спробувати виявити точний PHP-CLI шлях на вашому сервері. Вимкнено, якщо ваш сервер не дозволяє зробити це, заблокувавши ваш IP вирішіть з вашого сайту протягом декількох хвилин до годин, коли це відбувається (наприклад, IONOS)."
COM_AKEEBABACKUP_CONFIG_SFTPTEST_BADPREFIX="Ви не повинні додавати sftp:// префікс до вашого SFTP Hostname. Будь ласка, вийміть sftp:// prefix і retry."
COM_AKEEBABACKUP_CONFIG_SFTPTEST_NOUPLOAD="Akeeba Backup вдалося підключити до сервера, але це не може завантажувати файл тестування. Завантажити резервну копію можна не вдалося."
COM_AKEEBABACKUP_CONFIG_SIZEQUOTA_ENABLE_DESCRIPTION="Коли активовано, Akeeba Backup витирають старі резервні файли, якщо загальний розмір резервних архівів перевищує значення, визначене нижче. Ця установка наноситься <strong>на профіль</strong>."
COM_AKEEBABACKUP_CONFIG_SIZEQUOTA_ENABLE_TITLE="Увімкнути розмір квоти"
COM_AKEEBABACKUP_CONFIG_SIZEQUOTA_VALUE_DESCRIPTION="Якщо сумарний розмір резервних архівів, які беруться з поточного профілю, перевищує цей ліміт, найстаріші резервні копії будуть видалені з сервера.<br/><br/><strong>Порада</strong>: Виберіть користувальницький і тип у бажаному значенні, якщо це не на списку."
COM_AKEEBABACKUP_CONFIG_SIZEQUOTA_VALUE_TITLE="Розмір квоти"
COM_AKEEBABACKUP_CONFIG_SPLITDBDUMP_DESCRIPTION="Ваш доменний знак буде розбити на невеликих файлах, щоб поліпшити стиснення і уникнути проблем з розміром файлів на певних дешевих хостах. В ідеалі ви повинні використовувати половину розміру вашого великого файлу. Встановити до 0 для розщеплення та створення одного величезного поштового файлу за базу даних."
COM_AKEEBABACKUP_CONFIG_SPLITDBDUMP_TITLE="Розмір для розщеплення SQL скидання файлів"
COM_AKEEBABACKUP_CONFIG_SUGARSYNC_ACCESS_DESCRIPTION="У 2024 році компанія SugarSync відреставрувала свою службу. На сторінках розробника все ще можна створювати ключі доступу, але сервіс завершує час і завантаження не працює."
COM_AKEEBABACKUP_CONFIG_SUGARSYNC_ACCESS_TITLE="Доступ до ключа ID"
