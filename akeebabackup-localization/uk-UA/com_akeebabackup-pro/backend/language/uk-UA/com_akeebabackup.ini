COM_AKEEBABACKUP_LBL_CPANEL_UPGRADE_FROM_AKEEBABACKUP8_HEAD="Зніміть налаштування від старшого Akeeba Backup версія"
COM_AKEEBABACKUP_LBL_CPANEL_UPGRADE_FROM_AKEEBABACKUP8_BODY="Ми виявили, що у вас є старша версія Akeeba Backup встановлена на вашому сайті. Натисніть кнопку нижче, щоб спробувати автоматичне імпорт налаштувань, історії резервних копій та резервних архівів, що зберігаються в каталозі резервного копіювання за замовчуванням. Будь ласка, уважно прочитайте документацію для розуміння ризиків та обмежень цієї операції."
COM_AKEEBABACKUP_LBL_CPANEL_UPGRADE_FROM_AKEEBABACKUP8_BTN="Налаштування Migrate"

COM_AKEEBABACKUP_LBL_CPANEL_UPGRADED_FROM_AKEEBABACKUP8_HEAD="Ви вже мігрували налаштування від старшого Akeeba Backup версія"
COM_AKEEBABACKUP_LBL_CPANEL_UPGRADED_FROM_AKEEBABACKUP8_BODY="Ви вже мігрували налаштування з старшої версії Akeeba Backup. Якщо ви хочете запустити міграцію знову натисніть на ”Налаштування міграції”. Якщо ви задоволені міграцією натисніть на кнопку ”Показати мені, що видалити”, щоб відкрити Joomla's 'Extensions: Керування' сторінка до старого Akeeba Backup розширення; ви можете потім вибрати його і натисніть кнопку Видалити, щоб видалити його."
COM_AKEEBABACKUP_LBL_CPANEL_UPGRADED_FROM_AKEEBABACKUP8_NOTE="Якщо видалення старої версії Akeeba Backup не можна зробити наступне. Спочатку встановіть останню версію Akeeba Backup 8. Потім встановіть останню версію Akeeba Backup для Joomla 4. Поверніть назад до цієї сторінки і натисніть кнопку ”Показати мені, що видалити”. Ви зможете видалити його просто штраф. Зверніть увагу, що повідомлення про FOF або FEF не можуть бути ігноруватися; Akeeba Backup 8 буде видалено незалежно від цих повідомлень."
COM_AKEEBABACKUP_LBL_CPANEL_UPGRADED_FROM_AKEEBABACKUP8_BTN="Покажіть мені, що видалити"

COM_AKEEBABACKUP_UPGRADE="Налаштування міграції"
COM_AKEEBABACKUP_UPGRADE_LBL_WARNING_STANDARD="Ця операція перезаписати всі ваші існуючі налаштування та історію резервної копії."
COM_AKEEBABACKUP_UPGRADE_LBL_WARNING_INCOMPATIBLE_HEAD="Вимоги до міграції не задовольняються"
COM_AKEEBABACKUP_UPGRADE_LBL_WARNING_INCOMPATIBLE_BODY="Ми не виявили сумісної версії Akeeba Backup. Якщо ви намагаєтеся запустити міграцію, то ви можете випробувати помилки та / або втрату даних. Не пропустіть, якщо ви явно не зробили це нашими розробниками. Виконайте це попередження за межі свого ризику і прокиньте!"
COM_AKEEBABACKUP_UPGRADE_LBL_WARNING_ALREADY_RAN_HEAD="Ви вже змітили налаштування"
COM_AKEEBABACKUP_UPGRADE_LBL_WARNING_ALREADY_RAN_BODY="Якщо ви вже закінчите міграцію до. Якщо ви спробуєте запустити міграцію знову, ви можете випробувати помилки та / або втрату даних. Ви не продовжуйте, якщо ви явно не збудете зробити це нашими розробниками. Ігноруйте це попередження за свій власний ризик і загнитесь!"
COM_AKEEBABACKUP_UPGRADE_LBL_WHAT_IT_DOES="Akeeba Backup для Joomla! імпортувати налаштування конфігурації, резервні копії профілів, історії резервної копії та <em>деякі</em> архівів резервного копіювання (зараз у <code>administrator/components/com_akeeba/backup</code>) від старшої версії Akeeba Backup (7.x або 8.x) вже встановлена на вашому сайті, перезаписуючи всю існуючу дату. Ви повинні використовувати цю функцію в перший раз, коли ви встановили Akeeba Backup для Joomla! Щоб уникнути втрати даних."
COM_AKEEBABACKUP_UPGRADE_LBL_REMEMBER_TO_UNINSTALL="Пам'ятайте, щоб видалити стару версію Akeeba Backup після завершення міграції. Використовуйте пункт меню Joomla's sidebar називається ”Система”. Знайдіть панель управління і натисніть на розширення. Знайдіть і виберіть <em>Akeeba Backup пакет</em> розширення типу ”Package”. Потім натисніть на кнопку ”Видалити”, в панелі інструментів."
COM_AKEEBABACKUP_UPGRADE_BTN_PROCEED="Проводиться з міграції"
COM_AKEEBABACKUP_UPGRADE_LBL_SUCCESS="Удосконалено міграцію налаштувань."
COM_AKEEBABACKUP_UPGRADE_LBL_FAIL="Переміщення параметрів не вдалося завершити. Ви можете вручну імпортувати ваші профілі резервних копій та / або перенести та імпортувати резервні архіви."
COM_AKEEBABACKUP_UPGRADE_MIGRATED_ONEDRIVE_ENGINES="У разі необхідності, якщо Ви хочете отримати додаткові дані про файли cookie, які ви можете використовувати одинDrive (LEGACY) або OneDrive (App-Specific Folder) для завантаження та були переключені до OneDrive (Business): %s. Ці профілі більше не мають дійсної автентифікації; будь ласка, відредагуйте кожен і переоцініть з обліковим записом OneDrive."

