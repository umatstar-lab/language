COM_AKEEBABACKUP_ALICE_ERR_NOLOGS="Не знайдено файли журналу для <strong>не вдалося</strong> резервні копії."
COM_AKEEBABACKUP_ALICE_HEAD_ONLYFAILED="ICE тільки працює на <em>не вдалося</em> резервні копії"
COM_AKEEBABACKUP_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="ALICE є інструментом для аналізу файлів журналу <em>не вдалося</em> резервні копії і - в більшості випадків — дати вам найбільш ймовірну причину для резервної недостатності. Він не призначений для аналізу файлів журналу успішних резервних копій. Дозування, що повернеться несенсиким, введеним в оману або виправним неправильним результатом. З цієї причини ми тільки покажемо вам лог файли <em>не вдалося</em> резервні копії."
COM_AKEEBABACKUP_ALICE_LBL_ONLYFAILED_WHATISFAILED="Будь ласка, пам'ятайте, що резервні копії, які не закінчували завантаження архіву резервного копіювання для дистанційного зберігання, не вдалося. Причина кореневої причини для цих проблем не може бути виявлена ALICE в будь-якому випадку. Якщо у вас є така проблема, яку ви повинні подати квиток підтримки на нашому сайті. Якщо хтось інший встановлений Akeeba Backup Professional для вас на вашому сайті, будь ласка, зв'яжіться з цією особою замість того, ви не зможете подати квиток підтримки на нашому сайті в цьому випадку."
COM_AKEEBABACKUP_ALICE_LBL_ONLYFAILED_IFNOFAILED="Якщо Ваш резервний копії не вдалося, але ви не бачите його на цій сторінці, будь ласка, чекайте <em>три (3) хвилини</em>, повернутися до Akeeba Backup Сторінка панелі керування, а потім поверніть тут. Існує причина для цього. У деяких випадках відмова від резервної копії викликається похибкою сервера. У цих випадках резервне копіювання позначається як і раніше прогрес замість невдалих випадків PHP Зупинки, які працюють, тому PHP Якщо ви відвідуєте сторінку панелі управління, будь-яке резервне копіювання, позначене як і раніше 3 хвилини буде позначено не вдалося. Отже, потрібно чекати і чекати <em>потім</em> повернутися на сторінку панелі управління."

