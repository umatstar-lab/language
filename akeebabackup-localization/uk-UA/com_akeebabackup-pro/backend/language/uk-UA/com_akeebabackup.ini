COM_AKEEBABACKUP_SCHEDULE_LBL_UPGRADENOW="Оновити зараз"
COM_AKEEBABACKUP_SCHEDULE_LBL_UPGRADETOPRO="Ця функція доступна тільки в Akeeba Backup Professional"
COM_AKEEBABACKUP_SCHEDULE_LBL_CONSOLEPLUGINDISALBED_HEAD="<em>Консоль - Akeeba Backup</em> плагін вимкнений."
COM_AKEEBABACKUP_SCHEDULE_LBL_CONSOLEPLUGINDISALBED_BODY="Будь ласка, перейдіть до системи, керування, плагіни та ввімкніть ”Консоль - Akeeba Backup”. Необхідно для цієї функції для роботи."

COM_AKEEBABACKUP_SCHEDULE_LBL_CHECK_UPLOADS="Перевірити Резервне копіювання Завантаження"
COM_AKEEBABACKUP_SCHEDULE_LBL_CHECK_UPLOADS_HEADERINFO="<p>Якщо резервне копіювання не вдалося завантажити резервну копію для налаштування віддаленого зберігання, це зазвичай не вважається відмовою від резервної копії (не ви явно обрали для обробки його як збій). Це тому, що резервний архів все ще існує на вашому сервері. Вам потрібно, однак, щоб повернутися до вашого сайту і оплатити завантаження з сторінки резервних копій - можливо також виправити будь-які проблеми з підключенням з дистанційним зберіганням.</p></p>типова проблема з тим, що ви не можете знати, що завантаження не вдалося. Це там, де перевірка завантаження резервних копій потрапляє в гру. Заплануйте його, щоб запустити після запланованих резервних копій, як правило, закінчиться, і вона надішле вам електронну пошту, якщо будь-який з ваших резервних копій, взятих з останнього часу, перевірте ran не вдалося завантажити на його налаштоване дистанційне зберігання.</p><p>Ви можете запланувати цю перевірку з багатьма різними способами, як і сам резервний копії. Нижче ви знайдете більше інформації про кожен метод планування, доступний для перевірки завантаження резервних копій. Якщо ви не впевнені, що ми рекомендуємо вам використовувати той же метод розділення, як ваші резервні копії.</p>"


COM_AKEEBABACKUP_TITLE_ALICES="Вибропогружувач - ALICE"

COM_AKEEBABACKUP_TRANSFER="Мапа сайту"
COM_AKEEBABACKUP_TRANSFER_BTN_FTP_PROCEED="Проводиться реставрація"
COM_AKEEBABACKUP_TRANSFER_BTN_OPEN_KICKSTART="Запуск Kickstart"
COM_AKEEBABACKUP_TRANSFER_BTN_RESET="Зареєструватися"
COM_AKEEBABACKUP_TRANSFER_DESC="Передача архіву, що працює \"%s\" після обробки двигуна проти архіву."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTACCESSTESTFILE="Akeeba Backup не може переконатися, що інформація з'єднання, яку ви входите, відповідає сайту URL ви входите. Якщо ви намагаєтеся відновити всередині піддиректора існуючого сайту, це означає, що основний сайт блокує доступ до підкатегорії; будь ласка, зв'яжіться з адміністратором сайту. У будь-якому іншому випадку ви вводили неправильну інформацію про підключення, швидше за все, неправильний каталог. Будь ласка, зв'яжіться з вашим господарем і попросіть їх для коректної інформації з'єднання, <em>, включаючи каталог</em>, який відповідає вашому URL ви входите в цьому майстра. Потім, введіть правильній інформацію і продовжити відновлення."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTREADLOCALFILE="Akeeba Backup не може прочитати з локального резервного файлу <code>%s</code>. Цей майстер не вдалося. Будь ласка, введіть нову резервну копію та ретриту. Зверніть увагу, що файли залишилися позаду на вашому новому сервері; ви можете видалити їх вручну."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTRUNKICKSTART="Akeeba Backup не може запустити Akeeba Kickstart на вашому новому сайті. Якщо ви намагаєтеся відновити всередині піддиректора існуючого сайту, це означає, що основний сайт блокує доступ до підкатегорії; будь ласка, зв'яжіться з адміністратором сайту. У будь-якому іншому випадку вам потрібно звернутися до свого хосту і перевірити, що ваш типовий PHP версія відповідає мінімальним вимогам Kickstart."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTUPLOADARCHIVE="Akeeba Backup не може завантажувати резервний файл <code>%s</code>. Це можливо, що ваш новий сервер сайту має вийти з дискового простору або захист сервера блокує передачу даних. Будь ласка, спробуйте перенести свій сайт, вибравши пункт вручну перенести. Зверніть увагу, що файли залишилися позаду на вашому новому сервері; ви можете видалити їх вручну."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTUPLOADKICKSTART="Akeeba Backup не може завантажувати Akeeba Kickstart до вашого нового кореня сайту. Будь ласка, перевірте, що ви вводили правильну інформацію з'єднання і це можливо для FTP/ користувачаSFTP для запису файлів в каталог, який ви вибрали. Якщо у вас вже є kickstart.php і kickstart.transfer.php на віддаленому сайті, будь ласка, видалити їх перед перегрівом передачі вашого сайту."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTUPLOADTEMP="Akeeba Backup не може завантажувати фрагмент вашого архіву резервного копіювання з локального файлу <code>%s</code> до віддаленого файлу <code>%s</code>. Будь ласка, перевірте, що ваш віддалений сервер дозволяє завантажувати файли і достатньо дискового простору на ньому для вашого архіву резервного копіювання (s)."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTUPLOADTESTFILE="Akeeba Backup не може завантажувати тестовий файл, який називається <code>%s</code> до вашого нового кореня сайту. Будь ласка, перевірте, що ви вводили правильну інформацію з'єднання і це можливо для FTP/ користувачаSFTP для запису файлів в каталог, який ви вибрали."
COM_AKEEBABACKUP_TRANSFER_ERR_CANNOTWRITEREMOTEFILES="На жаль, Akeeba Backup визначають, що він не може писати безпосередньо на файли на вашому віддаленому сервері. Цей майстер не може приступати. Ви повинні використовувати \"Ручно\" метод передачі."
COM_AKEEBABACKUP_TRANSFER_ERR_CANTCREATETEMPCHUNK="Не можна створювати тимчасовий файл на цьому сервері. Будь ласка, перевірте, що ваш тимчасовий каталог правильно заповнюється і записується користувачем веб-сервера в даний час працює."
COM_AKEEBABACKUP_TRANSFER_ERR_COMPLETEBACKUP="Немає такої резервної копії. Натисніть кнопку Backup Тепер, щоб взяти нову резервну копію зараз."
COM_AKEEBABACKUP_TRANSFER_ERR_COMPLETEBACKUP_SPECIFIC="Backup #%d не може бути переданий. Він або не повний, повне резервне копіювання сайту або його архів файлів більше не присутні на цьому сервері."
