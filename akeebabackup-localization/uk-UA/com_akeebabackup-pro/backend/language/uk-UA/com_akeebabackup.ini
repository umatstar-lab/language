COM_AKEEBABACKUP_CONFIG_PROCENGINE_TITLE="Двигун після обробки"
COM_AKEEBABACKUP_CONFIG_PUSH_APIKEY_DESC="Перейдіть до https://www.pushbullet.com/account і скопіюйте Ткен доступу з цієї сторінки в текстову поле тут. Він використовується для надсилання поштових повідомлень на ваш обліковий запис. Ви можете вставляти кілька токени, відокремлених комами. Примітка: Тінь доступу видно всім людям, які мають доступ до цієї сторінки конфігурації."
COM_AKEEBABACKUP_CONFIG_PUSH_APIKEY_LABEL="Pushbullet Доступ Token"
COM_AKEEBABACKUP_CONFIG_PUSH_HEADER_DESC="Тут ви можете налаштувати push-повідомлення для резервних повідомлень, які будуть відправлені безпосередньо на телефон, планшет, ноутбук або настільний комп'ютер. Вам потрібно завантажити безкоштовний додаток, третій додаток <a href='http://pushbullet.com/'>Pushbullet</a> перший."
COM_AKEEBABACKUP_CONFIG_PUSH_HEADER_LABEL="Пошта Повідомлення"
COM_AKEEBABACKUP_CONFIG_PUSH_PREFERENCE_DESC="Повинен Akeeba Backup Щоб отримати повідомлення та, якщо так, як? Якщо ви вибрали Web Push, зберегти ці параметри і повернутися до сторінки панелі управління. Ви побачите нову область Push сповіщення нижче резервної копії Quick Icons, де ви можете керувати повідомленнями про поштовх для вашого браузера."
COM_AKEEBABACKUP_CONFIG_PUSH_PREFERENCE_LABEL="Повідомлень про подачу"
COM_AKEEBABACKUP_CONFIG_PUSH_PREFERENCE_OPT_NONE="Вимкнено"
