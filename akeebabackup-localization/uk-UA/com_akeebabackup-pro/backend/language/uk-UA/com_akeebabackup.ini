COM_AKEEBABACKUP_CONFIG_S3_DUALSTACK_DESCRIPTION="Якщо ми використовуємо подвійні кінцеві точки для Amazon S3? Це дозволяє доступу до S3 за IPv6 для серверів, які підтримують IPv6. Сервери без IPv6 підтримка все ще зможуть отримати доступ до S3 за IPv4. Він не має ефекту, якщо ви використовуєте користувацьку кінцеву точку."
