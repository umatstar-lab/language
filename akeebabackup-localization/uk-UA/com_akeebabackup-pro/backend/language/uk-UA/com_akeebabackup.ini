COM_AKEEBABACKUP_CONFIG_CLOUDME_DIRECTORY_DESCRIPTION="У каталогі в обліковому записі CloudMe, де будуть зберігатися архіви резервних копій. Залиште порожній для зберігання файлів всередині кореня папок CloudMe."
