COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_SECRET="Передній ключ резервної копії функції є порожнім. Ви не можете використовувати цей метод розділення, якщо ви створюєте секретний ключ. Будь ласка, перейдіть до Akeeba Backup” Панель управління”, натисніть на кнопку Параметри в панелі інструментів і введіть секретний ключ вашої кришки."
COM_AKEEBABACKUP_SCHEDULE_LBL_WEAKSECRET_BODY="Akeeba Backup Відмовляється використовувати Secret Key, який занадто короткий або занадто простий. Кожен запит, який використовує його, включаючи проривні команди і URL нижче, не буде з'являтися 403 помилки. Зновити секретний ключ, або ввести більш сильніший в сторінці Параметри."
COM_AKEEBABACKUP_SCHEDULE_LBL_WEAKSECRET_HEAD="The Secret Key занадто слабкий"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON="Конфігурація резервної копії з WebCron.org:"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS="Напильники"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Якщо ви вже встановили методи оповіщення в інтерфейсі Webcron.org, ми рекомендуємо вибрати спосіб сповіщення тут і не перевіряючи ”Навколо помилки”, щоб ви завжди отримали повідомлення при резервній копії CRON."
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_EXECUTIONTIME="Час виконання"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_EXECUTIONTIME_INFO="Це сітка нижче інших варіантів. Виберіть коли і як часто ви хочете, щоб ваша робота CRON для запуску."
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_INFO="Увійти в webcron.org. У зоні CRON натисніть на кнопку Новий Cron. Нижче ви знайдете те, що вам потрібно ввести в інтерфейсі Webcron.org."
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_LOGIN="Логін"
