COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_DISABLED="Функція резервного копіювання переднього входу Akeeba Backup не ввімкнено. Ви не можете використовувати цей метод розділення, якщо ви його увімкнено. Будь ласка, перейдіть до Akeeba Backup'Налаштування панелі, натисніть на кнопку Параметри в панелі інструментів і увімкніть функцію резервної копії передньої дії. Не забудьте також вказати секретне слово вашої кришки."
