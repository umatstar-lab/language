COM_AKEEBABACKUP_CPANEL_MSG_WHERETOENTERDLID="Перейдіть до Joomla's System меню з лівого боку. Знайдіть панель оновлень і натисніть на посилання оновлень Сайтів. Знайдіть пункт ”Akeeba Backup Professional” і натисніть на неї. Крім того, <a href=\"%s\">натисніть тут</a> , щоб перейти безпосередньо до цієї сторінки. Введіть свій ідентифікатор завантаження - або ваш головний ідентифікатор або додаток Завантажити ID - в поле ”Завантажити ключ” і натисніть кнопку ”Зберегти”."
