COM_AKEEBABACKUP_BUADMIN_LOG_DOWNLOAD_CONFIRM="Завантаження архівів резервного копіювання через браузер\nвідмова, файлова корупція та видача файлів через причини\nоб'єктивно за межами нашого контролю (конфігурація сервера, сайт\nналаштування, налаштування сторонніх плагінів та браузера.\n\nМи рекомендуємо вам лише будь-який\nзавантаження резервних архівів через FTP в Бінарному перевезенні\nрежим (не використовуйте Auto або ASCII; він пошкоджений резервним копіюванням\nАрхіви) за допомогою програмного забезпечення для клієнтів, таких як FileZilla,\n CyberDuck, WinSCP або аналогічний; або за допомогою використання\nфайловий менеджер функції панелі керування хостингом вашого хосту.\n\nЯкщо ви продовжуєте з цим завантаженням, ви явно погоджуєтесь\nВи відмовляєте своє право на підтримку будь-якої резервної копії\nзавантаження архіву, вилучення або реставрації\nзрозуміти, що будь-які такі запити не будуть відповіли.\n\nВи впевнені, що ви хочете продовжити?"
