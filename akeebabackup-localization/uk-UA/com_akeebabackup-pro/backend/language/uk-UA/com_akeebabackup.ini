COM_AKEEBABACKUP_CONFIG_BOX_OPENOAUTH_DESC="Натисніть на цю кнопку, щоб відкрити нове вікно, де ви можете увійти в свій обліковий запис з постачальником зберігання. Потім, будь ласка, закрийте вікно спливаючого вікна і натисніть кнопку Крок 2 нижче."
COM_AKEEBABACKUP_CONFIG_BOX_OPENOAUTH_TITLE="Ауттентифікація - початок тут"
COM_AKEEBABACKUP_CONFIG_BOX_REFRESHTOKEN_DESCRIPTION="Заповнюйте автоматично, коли ви завершите автентифікаційний крок 1 над. Не поділяйте те ж саме токени на багатьох сайтах. Замість, автентифікуйте кожен сайт окремо."
COM_AKEEBABACKUP_CONFIG_BOX_REFRESHTOKEN_TITLE="Refresh Token (Токен)"
COM_AKEEBABACKUP_CONFIG_CHUNKSIZE_DESCRIPTION="Akeeba Backup обробляє великий файл в невеликих шматках, щоб уникнути часових витоків. Цей параметр визначає максимальний розмір шматка для цього виду обробки."
COM_AKEEBABACKUP_CONFIG_CHUNKSIZE_TITLE="Розмір шматка для обробки великих файлів"
COM_AKEEBABACKUP_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Коли ця коробка очищається (default) і крок резервної копії закінчується менше часу, ніж настрочений мінімальний час виконання Akeeba Backup буде сервер чекати до того часу, поки що він досягається. Це може викликати деякі дуже обмежені сервери, щоб вбити вашу резервну копію. Перевірка цієї коробки буде здійснювати період очікування на браузері, працюючи навколо цього обмеження. IMPORTANT: Цей варіант застосовується тільки для резервних копій. Front-end, JSON API (remote) і резервні копії команд-Line (CLI) завжди реалізують очікування на стороні сервера."
