COM_AKEEBABACKUP_CONFIG_S3USESSL_DESCRIPTION="Якщо увімкнено, безпечне (HTTPS) підключення буде використовуватися при завантаженні файлів. Хоча це підвищує безпеку переданих даних, він також збільшує можливість відмови від резервної копії через час очікування."
