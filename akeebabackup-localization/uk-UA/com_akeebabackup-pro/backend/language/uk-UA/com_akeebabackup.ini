COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_NAME_INFO="Будь ласка, будь-ласка, наприклад, <em>Резервне копіювання мого сайту</em>"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_PASSWORD="Письмовий"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_THENCLICKSUBMIT="Нарешті, натисніть на кнопку Надіслати, щоб закінчити налаштування роботи CRON."
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_TIMEOUT="Розклад"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180sec; якщо резервна копія не завершена, збільшить її. Більшість сайтів будуть працювати з налаштуванням 180 або 600 тут. Якщо у вас є дуже великий сайт, який займає більше 5 хвилин, щоб повернутися до себе вгору, ви можете розглянути використання Akeeba Backup Professional і рідна робота CLI CRON замість того, як це набагато більш економічно вигідніше."
