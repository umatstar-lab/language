COM_AKEEBABACKUP_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Зручності"
COM_AKEEBABACKUP_CONFIG_FRONTEND_EMAIL_WHEN_DESC="Коли я повинен надіслати електронний лист на завершення резервного копіювання? Завжди означає, що кожен раз резервне копіювання завершено. Завантажте Переміщені засоби, щоб електронна пошта була відправлена тільки якщо резервна копія завершена, але завантаження до віддаленого сховища не вдалося успішно завершити. Якщо резервне копіювання не може надсилатися цією функцією; перевірте сторінку Автоматичних резервних копій для отримання інформації про невиконані резервні копії."
COM_AKEEBABACKUP_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Завантажити Failed"
