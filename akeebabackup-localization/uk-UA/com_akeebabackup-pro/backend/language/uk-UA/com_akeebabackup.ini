COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_PORT_DESCRIPTION="Звичайний порт для підключення SFTP 22. Якщо сервер використовує інший порт, будь ласка, введіть його тут."
COM_AKEEBABACKUP_CONFIG_DIRECTSFTP_PORT_TITLE="Портфоліо"
