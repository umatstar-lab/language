COM_AKEEBABACKUP_CONFIG_FORCEDBACKUPTZ_DESC="дата резервного копіювання і час -як записано в назві файла, опис за замовчуванням та електронні листи- будуть виражені в цьому часовому поясі. Цей параметр впливає на всі резервні копії, тобто всі резервні копії, незалежно від того, як вони приймають (до Akeeba Backup себе, віддалений JSON API і т.д.)."
