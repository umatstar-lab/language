COM_AKEEBABACKUP_SCHEDULE="Розклад автоматичних резервних копій"

COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER="Joomla Заплановані завдання"
COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_INFO="Ви можете створити завдання резервного копіювання за допомогою Joomla's Pland Завдання функції. Будь ласка, прочитайте документацію спочатку для розуміння компромісів і потенційних проблем в залежності від способу, який вибираєте викликати Joomla's заплановані завдання."
COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_BUTTON="Управління завданнями"
COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_ONLYJ41_HEAD="Заплановані завдання доступні тільки на Joomla 4.1 і пізніше"
COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_ONLYJ41_BODY="Joomla введений в експлуатацію Функція завдань в Joomla! version 4.1.0. Будь ласка, оновлення вашого сайту до останнього Joomla версія для отримання доступу до запланованих завдань."
COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_HEAD="Відключено плагін ”Task - Akeeba Backup”."
COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BODY="Додаток «Task – Akeeba Backup” повинен бути включений для Joomla's заплановані завдання, щоб дізнатися, як запустити резервні копії з Akeeba Backup. Будь ласка, перейдіть до системи, керування, плагіни і увімкніть плагін. Крім того, натисніть кнопку на наступні кнопки для редагування плагіна безпосередньо."
COM_AKEEBABACKUP_SCHEDULE_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BUTTON="Редагування плагіна"

COM_AKEEBABACKUP_SCHEDULE_LBL_ALTCLICRON="Альтернативні завдання-Line CRON вакансії"
COM_AKEEBABACKUP_SCHEDULE_LBL_ALTCLICRON_INFO="Цей метод рекомендується тільки якщо регулярна робота командного рядка CRON не завершена. Незважаючи на те, що він працює через Joomla's приставка, вона буде проходити через Joomla's web-додаток - використовуючи Akeeba Backup's передній метод резервної копії - що робить його повільніше, ніж рідний метод CLI."
COM_AKEEBABACKUP_SCHEDULE_LBL_CHECKHEADERINFO="<p>Коли планове резервне копіювання не вдалося, як правило, це означає, що PHP припинити роботу перед резервним копіюванням завершено. Тому Akeeba Backup не можна повідомляти вас про відмову від резервної копії таким же чином, що ви не розумієте, що для обробки резервних копій успішно або з попередженнями.</p><p>Щоб вирішити цю проблему, ви можете запланувати останні резервні копії перевірок, щоб запустити після очікуваного кінця вашого запуску резервної копії. Не обов'язково, коли б це було? В ідеалі, вона повинна бути довжиною останньої успішної резервної копії, записаної на сторінці Керування резервними записами плюс півгодини.</p><p>Ви можете запланувати цю перевірку з багатьма різними способами, так само як і сам резервний копії. Нижче ви знайдете більше інформації про кожен метод планування, доступний для перевірки резервних копій. Якщо ви не впевнені, що один для використання ми рекомендуємо вам використовувати той же метод розділення, як ваші резервні копії.</p>"
COM_AKEEBABACKUP_SCHEDULE_LBL_CHECK_BACKUPS="Перевірити статус резервного копіювання"
COM_AKEEBABACKUP_SCHEDULE_LBL_CLICRON="Команд-Ліні Кронові роботи (рекомендовані)"
COM_AKEEBABACKUP_SCHEDULE_LBL_CLICRON_INFO="Це рекомендований метод для всіх серверів, які підтримують командно-лінійні завдання CRON. Цей метод використовує Joomla's консоль (CLI) - замість Joomla!' веб-додаток - досягнення максимальної швидкості резервного копіювання."
COM_AKEEBABACKUP_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Зручності"
COM_AKEEBABACKUP_SCHEDULE_LBL_CLIGENERICINFO="Пам'ятайте, що замініть <em>%s</em> з реальним шляхом до вашого хосту PHP  <strong>CLI (Command Line Інтерфейс)</strong> executable. Пам'ятайте, що ви повинні використовувати PHP CLI executable; PHP CGI (Common Gateway Інтерфейс) executable буде <em>не</em> працювати з Joomla”S CLI додаток. Якщо непевно, що це означає, будь ласка, зверніться до свого хосту. Вони є єдиними людьми, які можуть надати цю інформацію."
COM_AKEEBABACKUP_SCHEDULE_LBL_ACCURATEINFO="Akeeba Backup виявлений, що <em>найбільш ймовірні</em> шлях до PHP CLI є <code>%s</code> і використовується його в командному рядку, відображеному вище. Якщо це не працює, будь ласка, замініть <code>%1$s</code> з реальним доріжком до вашого хосту PHP  <strong>CLI (Command Line Інтерфейс)</strong> виконуваний. Це шматок інформації, яку ваш хост зможе забезпечити."
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTENDBACKUP="Функція Front-end Backup"
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Цей метод використовує публічний URL і секретний ключ, щоб запустити резервну копію вашого сайту. Резервування прогресує за допомогою HTTP перенаправлення. Зверніть увагу, що більшість господарів' URL- на основі ”CRON” робочих місць, а також більшості сторонніх URL- на основі CRON послуги, не підтримують HTTP перенаправлення. Якщо приклади з wget і curl нижче не працюють для вас, будь ласка, використовуйте передню резервну копію URL з дуже дешевим вебcron.org стороння служба."
COM_AKEEBABACKUP_SCHEDULE_LBL_FRONTENDBACKUP_MANYMETHODS="Передня функція резервної копії може бути використана з великою різноманітністю методів. Натисніть вкладки нижче, щоб побачити всі опис кожного методу. Пам'ятайте, що всі вони детально пояснюються в нашій документації."
