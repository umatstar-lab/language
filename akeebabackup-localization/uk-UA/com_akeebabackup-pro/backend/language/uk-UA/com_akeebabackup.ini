COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="Секретний ключ із засобу керування ключами Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Таємний ключ"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Якщо увімкнено, безпечне (HTTPS) підключення буде використовуватися при завантаженні файлів. Хоча це підвищує безпеку переданих даних, він також збільшує можливість відмови від резервної копії через час очікування."
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGEUSESSL_TITLE="Використання SSL"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Холодне зберігання"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Змінити клас зберігання завантажених резервних архівів. «Не» означає, що файли будуть зберігатися за допомогою класа зберігання за замовчуванням, зазначеного у відро. Зверніть увагу, що параметри, крім Стандарту можуть бути дешевше, щоб зберігати, але вони можуть неточувати додаткові збори, якщо ви завантажуєте їх або видаліть їх. Будь ласка, зверніться до служби Google для ціноутворення."
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Приватизація"
COM_AKEEBABACKUP_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Ні (включіть ковро вирішується)"
