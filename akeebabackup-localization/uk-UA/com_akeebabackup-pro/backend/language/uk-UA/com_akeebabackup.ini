COM_AKEEBABACKUP_RESTORE_LABEL_SUCCESS_INFO2="Ви повинні зараз запустити Akeeba Backup Реставраційний скрипт, який був включений до вашого резервного архіву в часі резервної копії. <em>Не закрити це вікно!</em>. Після відновлення закінчено, закрийте вікно Akeeba Backup Відновлення Script і натисніть кнопку Нова кнопка реставрації остаточного оновлення нижче, щоб видалити <code>installation</code> каталог і почати використовувати ваш відновлений сайт."
COM_AKEEBABACKUP_RESTORE_LABEL_SUCCESS_INFO2B="Якщо, однак, ви відновлюєте на віддалений сайт <em>не</em> натисніть кнопку або кнопка. Замість, відвідайте сценарій відновлення URL в <code>http://<var>www.yoursite.com</var>/installation/index.php</code>. Після відновлення передається, натисніть на \"Видалити папку установки\" посилання на сторінку реставрації скрипта або, якщо це не вдалося, видалити <code>installation</code> каталог з цього сайту за допомогою вашого улюбленого FTP додаток."
COM_AKEEBABACKUP_RESTORE_LABEL_TIME_HEAD="Параметри обробки даних (додаткові)"
COM_AKEEBABACKUP_RESTORE_LABEL_ZAPBEFORE="Видалити все до видобутку"
COM_AKEEBABACKUP_RESTORE_LABEL_ZAPBEFORE_HELP="Видаліть всі існуючі файли та папки під кореневим каталогом вашого сайту, перш ніж вилучення архіву резервного копіювання. Це не враховують, які файли та папки існують у архіві резервного копіювання або які файли та папки виключаються під час резервної копії. Файли та папки, видалені цією функцією, CAN НЕ будуть відновлені. <strong>ЗДОРОВ'Я! ЦЬОГО МОЖЛИВЕ ФІЛІНИ ТА ФОЛЬДЕРИ, ЩО НЕ ПЕРЕГЛЯДУЄТЬСЯ ДО ВАШОГО САЙТу. ЦЕ ОСОБЛИВО ЗАБЕЗПЕЧЕННЯ ДЛЯ ДУЖЕ ВИСТАВКИ, ЩО ЗАСТОСУВАННЯ РИЗИКІВ. ВИКОРИСТАННЯ З ВИКОНАННЯМОВОЇ КАУЦІЇ. ОЦІНКА ЦЕ ОСОБЛИВОСТІ, ВИ ЯКЩО ВСІХ РЕЗУЛЬТАТНОСТІ ТА БЕЗПЕКИ. ПІДТРИМАЙТЕ, ЩО ВИ МОЖЕТЕ БУДЬ БУДЕ ПІДТРИМНИЦТВО З МЕРЕБА ЛТД.</strong>"
COM_AKEEBABACKUP_RESTORE_LABEL_STEALTHMODE="Увімкнути режим Stealth при відновленні"
COM_AKEEBABACKUP_RESTORE_LABEL_STEALTHMODE_HELP="Відвідувачі вашого сайту, що надходять від різних IP адреса, ніж ваш тимчасово перенаправлений до <code>installation/offline.html</code>, файл, що говорить їх сайт в даний час під час технічного обслуговування. Тільки роботи на серверах, які підтримують <code>.htaccess</code> файли. Будь ласка, прочитайте документацію для отримання додаткової інформації."

