COM_AKEEBABACKUP_CONFIG_DIRECTFTP_TEST_TITLE="Тест FTP підключення"
COM_AKEEBABACKUP_CONFIG_DIRECTFTP_USER_DESCRIPTION="FTP ім'я користувача сервера. Це зазвичай чутливий випадок. Якщо непевно, будь ласка, зв'яжіться з адміністратором мережі."
