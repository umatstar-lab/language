COM_AKEEBABACKUP_SCHEDULE_LBL_GENERICREADDOC="Читати документацію"
COM_AKEEBABACKUP_SCHEDULE_LBL_GENERICUSECLI="Використовуйте наступний командний ряд в інтерфейсі Крону вашого хоста:"
COM_AKEEBABACKUP_SCHEDULE_LBL_HEADERINFO="Akeeba Backup пропонує кілька методів планування. Ви знайдете більше інформації про кожен метод складання нижче. Будь ласка, прочитайте документацію кожного методу планування. Вона буде відповідати багато ваших питань і допоможе вам запланувати резервні копії більш легко."
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPIBACKUP="Віддалений резервний копії (JSON API) Характеристика"
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPIBACKUP_INFO="Ви можете використовувати цей метод, щоб зробити резервні копії вашого сайту дистанційно використовуючи наше програмне забезпечення, яке підтримує таку функцію (наприклад, Akeeba Remote CLI і Akeeba UNiTE)."
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_DISABLED="Будь ласка, перейдіть до Akeeba Backup, натисніть на Параметри, потім вкладку Frontend. Встановіть ”Включіть JSON API (відновити резервну копію)” для того, щоб увімкнути цю функцію."
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_ARCCLI="Akeeba Remote CLI"
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_ARCCLI_INTRO="Ви можете використовувати програму Akeeba Remote CLI командного рядка, щоб взяти резервні копії ваших сайтів віддалено. Ви можете замовити ці команди на вашому комп'ютері або іншому сервері, щоб автоматизувати ваші резервні копії."
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_ARCCLI_DOCKER="Щоб зробити резервну копію за допомогою Akeeba Remote CLI через <strong>Docker</strong> запустити наступний командний ряд:"
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_ARCCLI_PHAR="Щоб зробити резервну копію за допомогою Akeeba Remote CLI за допомогою <strong>PHAR архів</strong> ви можете завантажити з нашого сайту запустіть наступну команду:"
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_OTHER="Інші інструменти"
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_INTRO="Якщо ви використовуєте Akeeba UNiTE, або інше програмне забезпечення, використовуючи Remote JSON API, вам доведеться надати наступні відомості."
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_ENDPOINT="Кінцева точка URL"
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_SECRET="Таємний ключ"
COM_AKEEBABACKUP_SCHEDULE_LBL_JSONAPI_DISCLAIMER="Akeeba Лтд не закінчується, приймати відповідальність, або забезпечити підтримку сторонніх програмного забезпечення або послуг, що стосуються Akeeba Backup над API JSON . Ми надаємо підтримку для прийняття резервних копій з Akeeba  JSON API тільки якщо The Secret Key генерується автоматично нашим програмним забезпеченням і запит стосується використання нашого власного Akeeba  JSON API клієнт програмного забезпечення (наприклад, Akeeba Remote CLI)."
COM_AKEEBABACKUP_SCHEDULE_LBL_LEGACYAPI_DISABLED="Будь ласка, перейдіть до Akeeba Backup, натисніть на Параметри, потім вкладку Frontend. Встановіть ”Включний API Front-end Backup (відновити робочі місця CRON)” для того, щоб дозволити цю функцію."
