COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSDIRECTORY_DESCRIPTION="У каталозі, де будуть зберігатися архіви резервних копій. Залиште заготовку для зберігання файлів всередині кореня відра."
COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSDIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSLOWERCASE_DESCRIPTION="Якщо увімкнено, Akeeba Backup намагатиметься змінити назву відра на всі нижні літери, тобто MyBucket буде перетворюватися в mybucket. Якщо ви створили відро з літерами верхнього регістру, наприклад, MyNewBucket, зніміть цей параметр і переконайтеся, що ім'я відра зашифровано точно так, як він з'являється в панелі керування DreamHost."
COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSLOWERCASE_TITLE="Низьке відро ім'я"
COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSSECRETKEY_DESCRIPTION="Ваш DreamObjects Секретний ключ, доступний для вас під панелі керування DreamHost"
COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSSECRETKEY_TITLE="Таємний ключ"
COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSUSESSL_DESCRIPTION="Якщо увімкнено, безпечне (HTTPS) підключення буде використовуватися при завантаженні файлів. Хоча це підвищує безпеку переданих даних, він також збільшує можливість відмови від резервної копії через час очікування."
COM_AKEEBABACKUP_CONFIG_DREAMOBJECTSUSESSL_TITLE="Використання SSL"
COM_AKEEBABACKUP_CONFIG_DROPBOXDIRECTORY_DESCRIPTION="У каталогі в обліковому записі Dropbox, де будуть зберігатися архіви резервних копій. Залиште порожній для зберігання файлів всередині кореня."
COM_AKEEBABACKUP_CONFIG_DROPBOXDIRECTORY_TITLE="Довідник"
COM_AKEEBABACKUP_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Це Бібліотечний токен, який з'єднує Akeeba Backup до Dropbox. Це <strong>сайт-специфічний</strong> і використовується для повторного авторизації з'єднання Dropbox, коли короткостроковий доступ Token закінчується. Якщо у вас є кілька сайтів, ви повинні використовувати крок 1 кнопки на кожному і кожен сайт, який ви хочете авторизації. Будь ласка <strong>НЕ 【</strong> копіювання доступу або оновлення Token через кілька сайтів. Це призведе до автентичності Dropbox, щоб стати з синхронізації, і вам потрібно буде від'єднати всі ваші сайти з Dropbox."
COM_AKEEBABACKUP_CONFIG_DROPBOXREFRESHTOKEN_TITLE="Refresh Token (Токен)"
COM_AKEEBABACKUP_CONFIG_DROPBOXTOKEN_DESCRIPTION="Це автоматично видається з Dropbox, коли ви натиснете кнопку Крок 2 вище. Якщо у вас є кілька сайтів, ви повинні використовувати крок 1 і крок 2 кнопки тільки на ПЕРШому сайті ви хочете авторизуватися. Потім будь ласка, скопіюйте Token, Token Secret Key і ідентифікатор користувача з першого сайту на всі інші сайти, які ви хочете підключитися до Dropbox."
COM_AKEEBABACKUP_CONFIG_DROPBOXTOKEN_TITLE="Доступ до Token"
COM_AKEEBABACKUP_CONFIG_DROPBOX_TEAM_DESC="Перевірити, якщо ви є членом команди, використовуючи Dropbox для бізнесу і хочете використовувати папку вашої команди, щоб зберігати резервні копії. Пам'ятайте, щоб префіксувати каталог нижче ім'ям вашої папки команди. Наприклад, якщо веб-інтерфейс Dropbox показує ”Acme Corp Team Folder” в сторінці Файлів і ви хочете покласти ваші резервні копії в папці ”Backups” всередині нього слід використовувати назву каталога <code>Acme Corp Team Folder/Backups</code>, не тільки <code>Backups</code>."
COM_AKEEBABACKUP_CONFIG_DROPBOX_TEAM_TITLE="Dropbox для бізнесу"
COM_AKEEBABACKUP_CONFIG_DUMPENGINE_DESCRIPTION="Визначає, як Akeeba Backup обробляти вашу базу даних (s) для отримання файлів резервного копіювання бази даних."
COM_AKEEBABACKUP_CONFIG_DUMPENGINE_TITLE="Резервуар для резервної копії бази даних"
COM_AKEEBABACKUP_CONFIG_DUMP_DIVIDER_COMMON="Загальні налаштування"
COM_AKEEBABACKUP_CONFIG_DUMP_DIVIDER_MYSQL="Налаштування MySQL"
COM_AKEEBABACKUP_CONFIG_DUMP_DIVIDER_POSTGRES="Налаштування PostgreSQL"
COM_AKEEBABACKUP_CONFIG_DUMP_DIVIDER_REVERSE="Зворотна інженерія бази даних Параметри відмітки"
COM_AKEEBABACKUP_CONFIG_PGDUMP_PATH_DESCRIPTION="Абсолютний шлях файлової системи до інструмента командного рядка pg_dump на вашому сервері. Якщо зліва порожній, Akeeba Backup спробувати його автоматично виводити."
COM_AKEEBABACKUP_CONFIG_PGDUMP_PATH_TITLE="Шлях до pg_dump"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_DESCRIPTION="Передача файлів сайту на віддалений FTP сервер, без архівування їх першого. Цей двигун архіву використовує бібліотеку CURL, яка забезпечує кращу сумісність з широким діапазоном FTP серверів."
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_DESCRIPTION="Деякі погано налаштовані або неправильно FTP сервери повертаються неправильно IP адреса при FTP Увімкніть цей параметр, щоб зменшити режим FTP Бібліотека ігнорувати неправильне IP Повернутися до FTP сервер, замість використання FTP Статус на сервери IP."
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_TITLE="Пасивний режим роботи"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_TITLE="ПрямаFTP над КУРЛ"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_DESCRIPTION="Передача файлів сайту до віддаленого FTP сервер, без архівування їх першого"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_TITLE="Головна сторінка"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_DESCRIPTION="Передача файлів сайту на віддалений сервер SFTP, без засвідчення їх першого. Цей двигун архіву використовує бібліотеку CURL, яка забезпечує кращу сумісність з широким діапазоном FTP серверів."
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_TITLE="ПрямаФСТП над КУРЛ"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_DESCRIPTION="Передача файлів сайту на віддалений сервер SFTP, без засвідчення їх першого. WARNING: Ваш сервер потрібно мати PHP's SSL2 розширення встановленого."
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_TITLE="Головна"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_JPA_DESCRIPTION="Формат відкритого коду оптимізований для швидкого створення архіву та видобутку за допомогою PHP код"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_JPA_TITLE="Формат JPA (рекомендований)"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_JPS_DESCRIPTION="Створює архіви, зашифровані галузево-стандартним методом шифрування AES-128, у форматі дуже схожий на JPA. Вимагає або з розшифрування або відкривається PHP розширення, щоб бути встановленими і активованими на вашому сайті."
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_JPS_TITLE="Архіви зашифровані (JPS)"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_DESCRIPTION="Архів ZIP буде створений за допомогою PHP's ZipArchive клас. IMPORTANT: Цей двигун не підтримує архівне розщеплення або синхронізацію обробки і може, отже, призведе до резервних питань. Якщо ви отримуєте помилки часу, помилки AJAX або внутрішні повідомлення про помилку сервера, вам доведеться переключатися на різні двигуни архіву і увімкнути розділення архіву."
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_TITLE="ZIP за допомогою ZipArchive класу"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_ZIP_DESCRIPTION="Стандартні файли ZIP, a.k.a. \"Стиснені папки\", нативно підтримується усіма провідними операційними системами"
COM_AKEEBABACKUP_CONFIG_ENGINE_ARCHIVER_ZIP_TITLE="ZIP формат"
COM_AKEEBABACKUP_CONFIG_ENGINE_DUMP_NATIVE_DESCRIPTION="Використовуйте PHP код для отримання точного відвалу бази даних"
COM_AKEEBABACKUP_CONFIG_ENGINE_DUMP_NATIVE_TITLE="Нативний двигун резервного копіювання MySQL"
COM_AKEEBABACKUP_CONFIG_POSTPROC_ABORT_ON_FAIL_TITLE="Резервне копіювання в’язниці на відмові від завантаження"
COM_AKEEBABACKUP_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Відразу зупиняється процес резервного копіювання, розмітивши його як не вдалося, якщо відбувається помилка завантаження. <strong>Цей варіант може бути введене в оману і небезпечно.</strong> Ви можете мати повне, дійсне резервне копіювання, яке просто не завантажується в цілому або частково. Збільшуючи цей параметр дозволить видалити залишилися резервні архівні файли з вашого сервера і залишити за будь-якими архівними файлами (частково) завантаженими на віддалене зберігання. Іншими словами, ви залишаєтеся без робочого резервного копіювання. Є тільки дуже мало випадків, коли це робить більше сенсу, ніж поведінка за замовчуванням, що дозволяє відновити резервний архів файлів, завантажені через сторінку Керування Запобіжностей. В результаті ми рекомендуємо робити лише це тільки"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_AZURE_DESCRIPTION="Завантажує резервний архів для Microsoft Windows Azure BLOB Storage."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_AZURE_TITLE="Завантажити для Microsoft Windows Azure BLOB Storage"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_BACKBLAZE_DESCRIPTION="Завантажує резервний архів до Backblaze."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_BACKBLAZE_TITLE="Завантажити для Backblaze B2"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_BOX_DESCRIPTION="Завантажте архів резервного копіювання в Box.com. Будь ласка, прочитайте документацію."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_BOX_TITLE="Завантажити в Box.com"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_CLOUDFILES_DESCRIPTION="Завантажує резервний архів до RackSpace CloudFiles.<br/><strong>Пам'ятайте, щоб встановити розгалуження розміру архіву 2-30Mb або ви ризикуєте невдачі резервної копії через часові маршрути!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_CLOUDFILES_TITLE="Завантажити RackSpace CloudFiles"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_CLOUDME_DESCRIPTION="Завантажує резервний архів до CloudMe.<br/><strong>Пам'ятайте, щоб встановити розмір архіву розгалу 2-30Mb або ви збій резервної копії ризику через час очікування!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_CLOUDME_TITLE="Завантажити в CloudMe"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_DESCRIPTION="Завантажує резервний архів до DreamObjects.<br/><strong>Пам'ятайте, щоб встановити розгалуження розміру архіву 2-30Mb або ви ризикуєте невдачі резервного копіювання через часові маршрути!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_TITLE="Завантажити в DreamObjects"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_DROPBOX2_DESCRIPTION="Завантажує резервний архів для Dropbox за допомогою API Dropbox V2. Цей API швидше і дозволяє легко підключити обліковий запис Dropbox на кілька сайтів."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_DROPBOX2_TITLE="Завантажте до Dropbox (v2 API)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_EMAIL_DESCRIPTION="Відправляє вам резервний архів як вкладення електронної пошти.<br/><strong>Пам'ятайте, щоб встановити розмір архіву розгалу 1-2Mb або ви збій резервної копії ризику через час і вихід пам'яті!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_EMAIL_TITLE="Надіслати електронною поштою"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_FTPCURL_DESCRIPTION="Завантажує резервний архів до віддаленого FTP або FTPS (FTP над сервером Imlicit SSL.<br/>Цей післяпроцесорний двигун використовує бібліотеку CURL, яка забезпечує кращу сумісність з широким діапазоном FTP сервери.<br/><strong>Пам'ятайте, що встановити розгалуження архіву розміром 2-30Mb або ви ризикуєте невдачу резервної копії через часі!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_FTPCURL_TITLE="Завантажте для віддаленого FTP сервер за допомогою cURL"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_FTP_DESCRIPTION="Завантажує резервний архів до віддаленого FTP або FTPS (FTP над Implicit SSL) сервер.<br/><strong>Пам'ятайте, щоб встановити роздільний розмір архіву 2-30Mb або ви збій резервної копії ризику через таймери!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_FTP_TITLE="Завантажити для Remote FTP сервер"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_DESCRIPTION="Завантажте архів резервного копіювання в Google Диск. Будь ласка, прочитайте документацію."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_TITLE="Завантажити Google Диск"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Завантажує резервний архів в Google Storage за допомогою сучасного JSON API. Це рекомендована інтеграція з Google Storage.<br/><strong>Пам'ятайте, щоб встановити розгалуження розміру архіву 2-30Mb або ви ризик резервної недостатності через час!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Завантаження в Google Storage (JSON API)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Завантажує резервний архів в Google Storage за допомогою емуляції API Legacy S3. Це розшифровується і буде видалено в майбутньому. Будь ласка, використовуйте параметр JSON API замість.<br/><strong>Пам'ятайте, щоб встановити розмір сплітного архіву 2-30Mb або ви ризикуєте невдачу резервної копії через таймери!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_TITLE="Вивантажити в Google Storage (застарілий API S3)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_IDRIVESYNC_DESCRIPTION="Завантажте резервний архів для iDriveSync EVS (iDriveSync.com).<br/><strong>Пам'ятайте, що встановити розгалуження архіву розміром 2-30Mb або ви ризикуєте невдачу резервної копії через часі!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_IDRIVESYNC_TITLE="Завантажити в iDriveSync"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_NONE_DESCRIPTION="Залишає файли резервного копіювання на сервері"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_NONE_TITLE="Немає після обробки"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_DESCRIPTION="Завантажує резервний архів в Microsoft OneDrive або Microsoft OneDrive для бізнесу."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_TITLE="Завантажити Microsoft OneDrive або OneDrive для бізнесу"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Завантажує резервний архів до OVH Об'єм зберігання. <br/><strong>Пам'ятайте, щоб встановити розгалуження розміру архіву 2-30Mb або ви ризикуєте невдачі резервної копії через час!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Завантажити для зберігання об'єктів OVH"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_PCLOUD_DESCRIPTION="Завантажує резервний архів до PCloud. ЦЕ ПОСТ-ПРОЦЕСУВАННЯ ENGINE, ЩО ВІДБУДУТЬСЯ. AUTHENTICATION НЕ РОБОТАЄ ЗАБЕЗПЕЧЕННЯ ЗАХВОРЮВАННЯ ЗДОРОВ'Я НА СЕРВЕРІ API PCloud."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_PCLOUD_TITLE="Завантажте до pCloud (НЕ ВИКОРИСТАННЯ - БУДЕ РЕМОЗУЛЬТАТИ)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Завантажує резервний архів на Amazon S3. Він дозволяє використовувати як нову (AWS4) автентифікацію, необхідну для нового розташування S3 і старої (AWS2) автентифікації, необхідне для сторонніх постачальників зберігання, які пропонують S3-сумісний API.<br/><strong>Якщо ви вимкнете багаточасте завантаження, пам'ятайте, щоб встановити розмір архіву 2-30Mb або ви ризик резервної недостатності через час!</strong><br/>Якщо ви хочете використовувати Amazon STS замість програми доступу і секретного ключа, будь ласка, прочитайте документацію."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_S3_TITLE="Завантаження в Amazon S3"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Завантажує резервний архів на віддалений сервер SFTP (SSH). Це передача файлів над SSH за допомогою протоколу називається SFTP, який є <em>повністю різний</em> до FTP і FTPS.<br/>Цей післяобробний двигун використовує cURL для передачі даних, бібліотека, яка сумісна з широким діапазоном серверів SFTP.<br/><strong>Пам'ятайте, щоб встановити розгалу розмір архіву 2-30Mb або ви ризик резервної копії через час!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Завантажте для віддаленого сервера SFTP (SSH) за допомогою cURL"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Завантажує резервний архів на віддалений сервер SFTP (SSH). Це передача файлів над SSH за допомогою протоколу, який називається SFTP, який є <em>повністю різний</em> до FTP і FTPS.<br/><strong>Пам'ятайте, щоб встановити розгалужуючий розмір архіву 2-30Mb або ви ризик резервної недостатності через таймери!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Завантаження на сервер дистанційного SFTP (SSH)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="DEAD INTEGRATION. SugarSync відреставрує свою службу в 2024 році. Незважаючи на те, що їх API документація та ключові сторінки доступу все ще онлайн, кінцеві пункти обслуговування більше не відповідають і просто часу. Не використовуйте цей метод завантаження. Він буде видалено з Akeeba Backup до кінця 2026."
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Завантажте до SugarSync (DEAD - БУДЕ РЕМОВЕДЕННО)"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SWIFT_DESCRIPTION="Завантажує резервний архів на будь-який сервер пам'яті об'єкта OpenStack Swift, наприклад, один створений з розподілом Ubuntu OpenStack або іншими приватними хмарами. Не використовуйте цей метод з RackSpace CloudFiles! CloudFiles використовує спеціальний метод автентифікації, який не сумісний з службою ідентифікації OpenStack (що буквально кожен інший використовує OpenStack).<br/><strong>Пам'ятайте, що встановити розгалуження архіву розміром 2-30Mb або ви ризикуєте невдачу резервної копії через часі!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Завантажити для зберігання об'єктів OpenStack Swift"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Завантажує резервний архів до будь-якої служби зберігання, яка підтримує протокол WebDAV.<br/><strong>Пам'ятайте, що встановити розгалуження архіву розміром 2-30Mb або ви ризикуєте невдачу резервної копії через часі!</strong>"
COM_AKEEBABACKUP_CONFIG_ENGINE_POSTPROC_WEBDAV_TITLE="Завантажити WebDAV"
COM_AKEEBABACKUP_CONFIG_ENGINE_SCAN_LARGE_DESCRIPTION="Файловий сканер оптимізований для резервного копіювання сайтів з каталогами, що містять сотні файлів (наприклад, блогів та новинних порталів)"
COM_AKEEBABACKUP_CONFIG_ENGINE_SCAN_LARGE_TITLE="Великий сканер сайту"
COM_AKEEBABACKUP_CONFIG_ENGINE_SCAN_SMART_DESCRIPTION="Інтелектуально балансує швидкість сканування і часовий захист"
COM_AKEEBABACKUP_CONFIG_ENGINE_SCAN_SMART_TITLE="Розумний сканер"
COM_AKEEBABACKUP_CONFIG_ERR_DECRYPTION="Не можна розшифровувати налаштування. Ваш сервер не підтримує шифрування параметрів або файл ключа шифрування було модифіковано або видалено."
COM_AKEEBABACKUP_CONFIG_EXTENDEDINSERTS_DESCRIPTION="Якщо перевірили, то в базі даних буде виконано розширені заяви INSERT, тобто єдиний звіт для відновлення декількох рядків даних. Ви можете перевірити, що ви зберігаєте цей параметр, оскільки він прискорить процес відновлення та працює навколо лімітів квитанції на обмежених хостах."
COM_AKEEBABACKUP_CONFIG_EXTENDEDINSERTS_TITLE="Генерація розширених ВПД"

COM_AKEEBABACKUP_CONFIG_UPLOADFAILURE_SEPARATOR="<strong>Перевірити для не вдалося завантажити</strong>"
COM_AKEEBABACKUP_CONFIG_UPLOADFAILURE_EMAILADDRESS_LABEL="Заборонено завантажити електронну адресу"
COM_AKEEBABACKUP_CONFIG_UPLOADFAILURE_EMAILADDRESS_DESC="Відправте лист про відмову від завантаження до цієї адреси. Залиште порожній лист на електронну пошту всіх користувачів."
COM_AKEEBABACKUP_CONFIG_UPLOADFAILURE_EMAILSUBJECT_LABEL="Заборонено завантажити суб'єкт електронної пошти"
COM_AKEEBABACKUP_CONFIG_UPLOADFAILURE_EMAILSUBJECT_DESC="Предмет для електронних листів, що ви не змогли завантажити. Залиште порожній для використання за замовчуванням. Ви можете використовувати всі Akeeba Backup's змінні, які ви можете використовувати для файлів архіву, наприклад, [HOST] та [DATE]"
