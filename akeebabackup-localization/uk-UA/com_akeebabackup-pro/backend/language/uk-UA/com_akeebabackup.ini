COM_AKEEBABACKUP_RESTORE_LABEL_REMOTETIP="<strong>Порада</strong>: Щоб відновити віддалений сервер вибрати \"Використання FTP шарф\" опція та поставка віддаленого сервера FTP інформація про підключення в FTP Параметри шару нижче.<br/>Використовуйте гібридний варіант і дайте поточний сайт FTP інформація про підключення, якщо відновлення не з'явиться з небажаними файлами."
