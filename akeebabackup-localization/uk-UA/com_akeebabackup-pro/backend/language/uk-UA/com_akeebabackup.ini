COM_AKEEBABACKUP_CPANEL_MSG_CLOUDFLARE_WARN1="Ми виявили, що CloudFlare Rocket Loader включений на вашому сайті. Ця функція заважає JavaScript на вашому сайті, змішування сценаріїв замовлення завантажується, тому що виклики JavaScript. Будь ласка, відключити функцію Rocket Loader, щоб дати Joomla's і Akeeba Backup's JavaScript працює правильно. Для отримання додаткової інформації та інструкцій, будь ласка, зверніться до <a href='%s' target='_blank'>CloudFlare's документація</a>."
COM_AKEEBABACKUP_CPANEL_MSG_CLOUDFLARE_WARN="CloudFlare's Rocket Loader запобігає вам з використанням Joomla!&trade; і Akeeba Backup правильно"
COM_AKEEBABACKUP_CPANEL_MSG_FESECRETWORD_RESET="The Secret Word було змінено до <code>%s</code>"
COM_AKEEBABACKUP_CPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Головна</strong> Яка Joomla вже визначено оновлення для Akeeba Backup перед тим, як вводити свій ідентифікатор Завантажити <em>не може бути в змозі завантажити їх</em> навіть після того, як ви ввели свій ідентифікатор завантаження через ряд довгострокових Joomla Теги. У цьому випадку, будь ласка, завантажте ZIP файл останньої версії з нашого сайту. Потім перейдіть до Joomla's System меню, знайти панель установок, натисніть на розширення, натисніть на вкладку «Завантажити файл» та встановіть файл ZIP, який ви завантажили <strong>2,6 км</strong> в рядку, <strong>без</strong> Висновок Akeeba Backup перед або в між собою. Двостороння інсталяція потрібна для вирішення іншої тривалої помилки Joomla що іноді запобігає його копіювання всіх оновлених файлів при встановленні оновлення розширення."
