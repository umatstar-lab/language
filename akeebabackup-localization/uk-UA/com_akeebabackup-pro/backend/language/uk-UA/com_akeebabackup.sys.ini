;; Installation package description
;; ================================================================================
COM_AKEEBABACKUP_XML_DESCRIPTION="Популярний компонент резервного копіювання для Joomla!&trade;"

;; Permissions
;; ================================================================================
COM_AKEEBABACKUP_ACCESS_BACKUP_LBL="Резервне копіювання"
COM_AKEEBABACKUP_ACCESS_BACKUP_DESC="Дозволяє отримувати резервні копії з Akeeba Backup."
COM_AKEEBABACKUP_ACCESS_CONFIGURE_LBL="Налаштувати"
COM_AKEEBABACKUP_ACCESS_CONFIGURE_DESC="Дозволяє налаштовувати профілі Akeeba Backup і користуватися вбудованим відновленням, якщо воно доступне. Примітка щодо безпеки: цей дозвіл практично рівнозначний правам суперкористувача. Вбудоване відновлення перезаписує файли та базу даних сайту вмістом архіву, а на сторінці налаштувань можна змінити місце надсилання резервних копій. Надавайте цей дозвіл лише тим, кому готові надати права суперкористувача."
COM_AKEEBABACKUP_ACCESS_DOWNLOAD_LBL="Завантажити"
COM_AKEEBABACKUP_ACCESS_DOWNLOAD_DESC="Дозволяє завантажувати, вивантажувати й керувати архівами Akeeba Backup, а також користуватися майстром перенесення сайту, якщо він доступний. Примітка щодо безпеки: архів містить повну копію сайту, зокрема дані доступу до бази та секретний ключ сайту у файлі конфігурації, усі записи користувачів і весь вміст. Той, хто завантажить архів, зможе прочитати весь сайт офлайн. Надавайте цей дозвіл лише тим, кому довіряєте вміст бази даних."

