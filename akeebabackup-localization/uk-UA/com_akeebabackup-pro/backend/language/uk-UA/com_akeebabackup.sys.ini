COM_AKEEBABACKUP_VIEW_CPANEL_TITLE="Панель керування"
COM_AKEEBABACKUP_VIEW_CPANEL_DESC="Основна сторінка Akeeba Backup яка дозволяє налаштовувати, приймати, керувати та відновити резервні копії."

COM_AKEEBABACKUP_VIEW_BACKUP_TITLE="Резервне копіювання"
COM_AKEEBABACKUP_VIEW_BACKUP_DESC="Створити резервну копію"
COM_AKEEBABACKUP_VIEW_BACKUP_PROFILE_LABEL="Профіль резервного копіювання"
COM_AKEEBABACKUP_VIEW_BACKUP_PROFILE_DESC="Виберіть профіль резервного копіювання, щоб перейти до отримання резервної копії. Виберіть '(не)' для використання поточного профілю резервної копії, що це робиться."
COM_AKEEBABACKUP_VIEW_BACKUP_HIDETOOLBAR_LABEL="Приховати панель інструментів"
COM_AKEEBABACKUP_VIEW_BACKUP_HIDETOOLBAR_DESC="Чи повинен бути прихований панель інструментів з допомогою кнопки управління та керування панелі?"
COM_AKEEBABACKUP_VIEW_BACKUP_RETURNURL_LABEL="URL повернення"
COM_AKEEBABACKUP_VIEW_BACKUP_RETURNURL_DESC="Вступ в внутрішню URL для повернення після завершення резервного копіювання. Наприклад: введіть <code>index.php</code> до повернення JoomlaПанель управління або <code>index.php%3Foption%26com_akeeba</code> до повернення Akeeba BackupПанель управління. <br/> <strong>WARNING</strong> У зв'язку з тим, як спосіб зробити Joomla! Менеджер меню працює URL Ви входите в MUST URL-encoded. Ви можете зробити це шляхом збереження пункту меню <em>двічі в ряду</em>. Це відомий помилка / відсутні функції в Joomla! себе."

COM_AKEEBABACKUP_VIEW_CONFIGURATION_TITLE="Налаштування"
COM_AKEEBABACKUP_VIEW_CONFIGURATION_DESC="Налаштуйте поточний активний профіль резервного копіювання."

COM_AKEEBABACKUP_VIEW_MANAGE_TITLE="Керування резервними копіями"
COM_AKEEBABACKUP_VIEW_MANAGE_DESC="Керування спробами резервного копіювання, включаючи вибір для відновлення будь-якого старшого резервного копіювання."

COM_AKEEBABACKUP_VIEW_RESTORE_TITLE="Відновити останню резервну копію"
COM_AKEEBABACKUP_VIEW_RESTORE_DESC="Відновити останню резервну копію, взяту з певним профілем резервного копіювання. Будь ласка, прочитайте документацію."
COM_AKEEBABACKUP_VIEW_RESTORE_PROFILE_LABEL="Профіль резервного копіювання"
COM_AKEEBABACKUP_VIEW_RESTORE_PROFILE_DESC="Відновити останню резервну копію, взяту за допомогою цього профілю резервної копії. <strong>IMPORTANT!</strong> Він буде виглядати тільки для останнього резервного копіювання, взятого з цим профільом. Резервний архів MUST існує на вашому сервері. Якщо видалили його, або якщо він збережений віддалено, ви отримаєте помилку. Відновлення віддалено збережених резервних копій вимагає, щоб перейти до Керування резервними копіями спочатку і викинути їх назад до вашого сервера."

COM_AKEEBABACKUP_VIEW_TRANSFER_TITLE="Майстер перенесення сайту"
COM_AKEEBABACKUP_VIEW_TRANSFER_DESC="Нехай ви відновлюєте останню резервну копію на різне місце / сервер. <strong>IMPORTANT!</strong> Він буде виглядати тільки для останнього результату резервного копіювання. Резервний архів MUST існує на вашому сервері. Якщо видали його, або якщо він зберігся віддалено, вам буде запропоновано взяти нову резервну копію. Передача дистанційно збережених резервних копій вимагає, щоб перейти до Керування резервними копіями спочатку і викинути їх назад до вашого сервера."
