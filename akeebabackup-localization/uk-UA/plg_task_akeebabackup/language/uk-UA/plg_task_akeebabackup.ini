PLG_TASK_AKEEBABACKUP_TASK_BACKUP_TITLE="Akeeba Backup - Візьміть резервну копію"
PLG_TASK_AKEEBABACKUP_TASK_BACKUP_DESC="Візьміть резервну копію вашого сайту з Akeeba Backup."

PLG_TASK_AKEEBABACKUP_TASK_CLIBACKUP_TITLE="Akeeba Backup — Резервне копіювання лише через CLI"
PLG_TASK_AKEEBABACKUP_TASK_CLIBACKUP_DESC="Візьміть резервну копію вашого сайту з Akeeba Backup. Цей тип завдання працює <strong>тільки</strong> при запланованих задачах запускається CLI CRON."

PLG_TASK_AKEEBABACKUP_TASK_FAILEDCHECK_TITLE="Akeeba Backup - Перевірити не вдалося резервних копій"
PLG_TASK_AKEEBABACKUP_TASK_FAILEDCHECK_DESC="Перевірка невдалих спроб резервного копіювання та сповіщення адміністраторів сайту."

PLG_TASK_AKEEBABACKUP_TASK_FAILEDUPLOADCHECK_TITLE="Akeeba Backup - Перевірити не вдалося завантаження"
PLG_TASK_AKEEBABACKUP_TASK_FAILEDUPLOADCHECK_DESC="Перевірити резервні копії, які не вдалося завантажити для віддаленого зберігання і повідомити адміністраторів сайту."

PLG_TASK_AKEEBABACKUP_NOTE01_DESC="<strong><span aria-hidden=\"true\" class=\"fa fa-exclamation-triangle\"></span> IMPORTANT!</strong> Будь ласка, прочитайте нашу документацію для розуміння обмежень і компромісів прийняття резервного копіювання вашого сайту за допомогою Joomla's заплановані завдання."

PLG_TASK_AKEEBABACKUP_NOTE02_DESC="Цей тип резервного копіювання буде виконувати <strong>тільки</strong> , якщо ви використовуєте Joomla's CLI додаток для запуску запланованих завдань. Він є більш ефективним і більш надійним, ніж ” 【Akeeba Backup - Візьміть резервну копію” тип завдання, але не буде виконувати використання лази завдання, що спланування або при використанні Joomla's URL для запуску запланованих завдань. Якщо ви хочете використовувати або з останніх двох методів, будь ласка, використовуйте ” 【Akeeba Backup - Візьміть задню частину” типу."

PLG_TASK_AKEEBABACKUP_PROFILE_LABEL="Профіль резервного копіювання"
PLG_TASK_AKEEBABACKUP_PROFILE_DESC="Виберіть, який резервний профіль для використання для регулярних резервних копій."
