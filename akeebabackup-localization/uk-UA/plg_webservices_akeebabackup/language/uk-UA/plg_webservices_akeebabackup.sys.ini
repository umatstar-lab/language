PLG_WEBSERVICES_AKEEBABACKUP_XML_DESCRIPTION="Увімкнути підтримку Akeeba JSON API v3 на вашому сайті, що дозволяє віддалено приймати та керувати резервними копіями за допомогою сумісного програмного забезпечення та додатків.<br/><strong>Головна</strong> Це вимагає незрівнянного доступу до вашого сайту Joomla Додаток API (застосунок API) <code>/api</code> папка). Якщо ви не маєте доступу до папки Joomla Додаток API, що дозволяє цей плагін, не буде достатньо. Будь ласка, прочитайте документацію"
