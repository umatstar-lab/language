PLG_QUICKICON_AKEEBABACKUP_XML_DESCRIPTION="Відобразити іконку Akeeba Backup у вашому адміністратору Back-end, повідомляючи вас, коли резервне копіювання передається (налаштовується)."

PLG_QUICKICON_AKEEBABACKUP_GROUP_DESC="Група цього плагіна (це значення у порівнянні з значенням групи, що використовується в <strong>Короткі іконки</strong> модулі для ін'єкційних ікон)"
PLG_QUICKICON_AKEEBABACKUP_GROUP_LABEL="Група компаній"

PLG_QUICKICON_AKEEBABACKUP_LBL_WARNINGS="Увімкнути іконку попередження"
PLG_QUICKICON_AKEEBABACKUP_DESC_WARNINGS="Коли увімкнено, значок Akeeba Backup логотип відображає невеликий знак попередження, якщо резервне копіювання не вдалося або застаріло (див. нижче)."
PLG_QUICKICON_AKEEBABACKUP_LBL_WARNFAILED="Війна на невдалих резервних копіях"
PLG_QUICKICON_AKEEBABACKUP_DESC_WARNFAILED="Якщо ввімкнено і попередні параметри, значок попередження відображається, якщо останній резервний копії не буде."
PLG_QUICKICON_AKEEBABACKUP_LBL_PERIOD="Час завантаження бекаплікації, в години"
PLG_QUICKICON_AKEEBABACKUP_DESC_PERIOD="Припустимо, що резервне копіювання є застібкою, якщо це багато годин було пропущено з останньої успішної резервної копії. Якщо резервна копія кріпиться, значок попередження відображається, якщо ввімкнено перший варіант."

PLG_QUICKICON_AKEEBABACKUP_PROFILE_LABEL="Профіль резервного копіювання"
PLG_QUICKICON_AKEEBABACKUP_PROFILE_DESC="Виберіть профіль резервного копіювання, який буде використовуватися для отримання повної резервної копії сайту при натисканні іконки резервної копії."
