PLG_PAGECACHE_AKEEBABACKUP="Кеш - Akeeba Backup JSON API"
PLG_PAGECACHE_AKEEBABACKUP_XML_DESCRIPTION="Вимкнено Joomla's cache (як реалізований System - Page Cache плагін) для Akeeba Backup  JSON API. Ви <strong>MUST</strong> зберегти цей плагін, включений для використання Akeeba Backup  JSON API - використовуваний для прийняття резервних копій віддалено з Akeeba  Panopticon, Akeeba Remote CLI, і сторонні послуги - коли система - Page Cache включена на вашому сайті."
