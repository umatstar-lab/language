PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE="<strong>Rappel</strong> : L'accès à la page de connexion du backend vous a été accordé sans que vous ayez fourni le Paramètre URL secret de l'administrateur directement, car vous étiez précédemment connecté à ce site avec ce navigateur."
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_NONSUPERUSER="<p>Si vous voyez ce message fréquemment lors de l'utilisation de l'interface administrateur du site, veuillez procéder comme suit :</p><ul><li>Travaillez toujours sur une seule page administrateur à la fois</li><li>Déconnectez-vous de la section administrateur lorsque vous ne l'utiliserez pas pendant les prochaines minutes</li><li>Accédez toujours à la page de connexion de l'interface administrateur en utilisant l'URL qui vous a été fournie (ressemble à <code>%s</code>)</li><ul>"
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_SUPERUSER="<p>Si vous-même ou d'autres utilisateurs de votre site voyez ce message fréquemment lors de l'utilisation du backend du site, vous pourriez vouloir</p><ul><li>augmenter la durée de session dans la Configuration globale de votre site</li><li>rappeler aux utilisateurs de toujours travailler sur une seule page administrateur à la fois</li><li>rappeler aux utilisateurs d'utiliser la fonction de déconnexion de Joomla! lorsqu'ils ne vont pas utiliser l'interface administrateur pendant les prochaines minutes</li><li>rappeler aux utilisateurs d'accéder toujours au site en utilisant l'URL de connexion qui inclut le Paramètre URL secret de l'administrateur, comme expliqué dans la documentation d'Admin Tools (ressemble à <code>%s</code>)</li></ul><p>Vous pouvez activer ou désactiver cette fonctionnalité et/ou masquer ce message dans Composants, Admin Tools, Pare-feu applicatif web, Configurer le WAF.</p>"

PLG_ADMINTOOLS_MSG_BLOCKED="Cette requête est bloquée par Admin Tools. Veuillez modifier ce message dans les options du composant. {RESCUEINFO}"
PLG_ADMINTOOLS_MSG_BLOCKED_RESCUEINFO="Si vous êtes l'administrateur de ce site et avez accidentellement bloqué votre propre adresse IP, veuillez visiter {RESCUE_TRIGGER_URL}%1$s où %1$s est l'adresse e-mail de votre compte (Super utilisateur). Cette URL ne vous enverra un e-mail que si l'adresse IP depuis laquelle vous y accédez est bloquée par Admin Tools. Si vous n'êtes pas bloqué, aucun e-mail ne sera envoyé ; vous n'avez pas besoin d'un e-mail avec des instructions pour débloquer votre adresse IP si celle-ci n'est pas bloquée."
PLG_ADMINTOOLS_MSG_DISABLEPWDRESET="La réinitialisation du mot de passe en libre-service pour votre compte utilisateur a été désactivée pour des raisons de sécurité. Veuillez contacter un administrateur du site pour obtenir de l'aide lors de la récupération de votre mot de passe."

PLG_ADMINTOOLS_HEADING_RESCUE_MODE="Mode de secours"
PLG_ADMINTOOLS_HEADING_BLOCKED_REQUESTS="Rapport des requêtes bloquées"
PLG_ADMINTOOLS_HEADING_SCHEDULED_MAINTENANCE="Maintenance planifiée"
PLG_ADMINTOOLS_HEADING_AUTO_IMPORT="Importation automatique des paramètres (« Sync Server »)"

PLG_ADMINTOOLS_ERR_BLOCKEDEMAILDOMAINS="Le domaine de messagerie %s n'est pas autorisé"
PLG_ADMINTOOLS_ERR_BLOCKEDUSERNAME="Le nom d'utilisateur « %s » est réservé et ne peut pas être utilisé pour l'auto-inscription d'un compte utilisateur. Veuillez choisir un nom d'utilisateur différent."
PLG_ADMINTOOLS_ERR_LEAKEDPWD="L'utilisation d'un mot de passe non sécurisé n'est pas autorisée. Le mot de passe <strong>%s</strong> est très faible car il figure dans les dictionnaires des attaquants."

PLG_ADMINTOOLS_LBL_CACHEEXPIRE="Activer l'expiration automatique du cache"
PLG_ADMINTOOLS_LBL_CACHEEXPIRE_DESC="Supprime périodiquement les éléments de cache expirés. Contrairement à la purge du cache, cela ne supprime pas l'intégralité du cache, mais uniquement les éléments qui ont expiré.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_LBL_CACHECLEANER="Activer le Nettoyeur de cache"
PLG_ADMINTOOLS_LBL_CACHECLEANER_DESC="Purge (vide complètement) périodiquement le cache, qu'il soit expiré ou non.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ="Exécuter toutes les X minutes"
PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ_DESC="L'expiration du cache s'exécutera toutes les X minutes"

PLG_ADMINTOOLS_LBL_CACHE_FREQ="Exécuter toutes les X minutes"
PLG_ADMINTOOLS_LBL_CACHE_FREQ_DESC="Le nettoyeur de cache s'exécutera toutes les X minutes"

PLG_ADMINTOOLS_LBL_CLEANTEMP="Activer le Nettoyage du répertoire temporaire"
PLG_ADMINTOOLS_LBL_CLEANTEMP_DESC="Supprime périodiquement tout le contenu du répertoire temporaire du site.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ="Exécuter toutes les X minutes"
PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ_DESC="Le nettoyage du répertoire temporaire s'exécutera toutes les X minutes"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE="Supprimer les utilisateurs inactifs"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DESC="Supprime automatiquement les utilisateurs qui se sont inscrits mais ne se sont jamais connectés au site après un certain délai<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NONE="Jamais"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BLOCKED="Uniquement s'ils ont activé leur compte, mais ne se sont jamais connectés"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NOTACTIVATED="Uniquement s'ils n'ont pas activé leur compte"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BOTH="Activés ou non, tant qu'ils ne se sont pas connectés"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS="Supprimer après ce nombre de jours"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS_DESC="Combien de jours après l'inscription de l'utilisateur devons-nous le supprimer s'il ne s'est toujours pas connecté au site ?"

PLG_ADMINTOOLS_LBL_OVERRIDE="Langue des e-mails"
PLG_ADMINTOOLS_LBL_OVERRIDE_DESC="Les e-mails qu'Admin Tools envoie aux Super utilisateurs lorsqu'une requête est bloquée seront dans la langue de l'interface publique de l'utilisateur actuel. Sur les sites multilingues, cela peut créer de la confusion. Vous pouvez forcer l'envoi des e-mails dans une langue spécifique, indépendamment de la langue actuellement utilisée par le site, en choisissant une langue particulière ici."

PLG_ADMINTOOLS_LBL_MAXLOGENTRIES="Nombre maximum d'entrées dans le journal des requêtes bloquées"
PLG_ADMINTOOLS_LBL_MAXLOGENTRIES_DESC="Spécifiez le nombre maximum d'entrées à conserver dans le journal des requêtes bloquées. Les enregistrements excédentaires seront supprimés. Utilisez 0 pour désactiver cette fonctionnalité et conserver toutes les entrées du journal des requêtes bloquées. Remarque : si vous avez des milliers d'anciennes entrées, il faudra un certain temps pour qu'Admin Tools les supprime toutes. Les anciens enregistrements sont supprimés par lots de 10 000 à chaque chargement de page pour des raisons de performances.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_LBL_SESCLEANER="Activer le Nettoyeur de sessions"
PLG_ADMINTOOLS_LBL_SESCLEANER_DESC="Vide périodiquement la table des métadonnées de session.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT="Activer l'Optimiseur de sessions"
PLG_ADMINTOOLS_LBL_SESOPT_DESC="Vérifie périodiquement et, si nécessaire, répare et optimise la table des métadonnées de session.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT_FREQ="Exécuter toutes les X minutes"
PLG_ADMINTOOLS_LBL_SESOPT_FREQ_DESC="L'optimiseur de sessions s'exécutera toutes les X minutes"

PLG_ADMINTOOLS_LBL_SES_FREQ="Exécuter toutes les X minutes"
PLG_ADMINTOOLS_LBL_SES_FREQ_DESC="Le nettoyeur de sessions s'exécutera toutes les X minutes"

PLG_ADMINTOOLS_LBL_RESCUEURL="URL de secours"
PLG_ADMINTOOLS_LBL_RESCUEURL_DESC="Lorsque cette fonctionnalité est activée, vous pouvez visiter http://www.example.com/administrator/index.php?admintools_rescue=votre_email@example.com (où http://www.example.com est l'adresse de votre site et votre_email@example.com est l'adresse e-mail de votre Super utilisateur) lorsque vous êtes bloqué, afin de recevoir un e-mail avec des instructions pour désactiver temporairement Admin Tools et vous permettre de retrouver l'accès à votre site. Cette fonctionnalité s'applique uniquement au backend administrateur de votre site et ne vous enverra un e-mail que si l'adresse IP depuis laquelle vous y accédez est bloquée par Admin Tools. Elle ne désactivera pas le Mot de passe principal ni aucune fonctionnalité implémentée avec des fichiers de configuration côté serveur, tels que la Protection par mot de passe du répertoire administrateur, le Générateur de fichier .htaccess ou le Mode hors ligne d'urgence."

PLG_ADMINTOOLS_LBL_RESCUEURL_SENTMSG="Consultez vos e-mails pour les informations relatives à l'URL de secours"
PLG_ADMINTOOLS_LBL_RESCUEURL_ERR_INVALIDADDRESS="Non, désolé, l'adresse e-mail de votre Super utilisateur n'est PAS %s. Veuillez réessayer en remplaçant %1$s par l'adresse e-mail configurée dans votre compte Super utilisateur du site."

PLG_ADMINTOOLS_LBL_RESCUEDURATION="Durée du mode de secours (minutes)"
PLG_ADMINTOOLS_LBL_RESCUEDURATION_DESC="La durée en minutes pendant laquelle le mode de secours, activé en suivant les instructions qui vous ont été envoyées par e-mail lors de la visite de l'URL de secours, restera actif. À l'issue de cette période, Admin Tools reprendra son fonctionnement normal. Par défaut : 15 minutes."

PLG_ADMINTOOLS_LBL_AUTOIMPORTURL="URL d'importation automatique"
PLG_ADMINTOOLS_LBL_AUTOIMPORTURL_DESC="Exportez vos paramètres avec la fonctionnalité d'exportation d'Admin Tools. Téléversez le fichier JSON exporté à un emplacement accessible publiquement sur le web. Saisissez l'URL de ce fichier JSON dans tous vos autres sites pour télécharger et importer périodiquement ce fichier JSON. C'est l'équivalent de télécharger vous-même le fichier depuis cette URL et de l'importer avec la fonctionnalité Importer &amp; Exporter d'Admin Tools. Cette fonctionnalité vous permet essentiellement de « synchroniser » la configuration de plusieurs installations d'Admin Tools sur différents sites.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ="Fréquence d'importation automatique (heures)"
PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ_DESC="À quelle fréquence (en heures) Admin Tools doit-il tenter de télécharger et d'importer le fichier JSON depuis l'URL ci-dessus.<br/><strong>Cette option est obsolète et sera supprimée dans Admin Tools 8.0. Veuillez utiliser les Tâches planifiées sur Joomla 4.1 et versions ultérieures.</strong>"

PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_FIELDSET_LABEL="Authentification par mot de passe"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_LABEL="Autoriser l'authentification par mot de passe lorsque WebAuthn est configuré"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_DESC="Cela s'applique uniquement si vous activez l'authentification sans mot de passe avec WebAuthn sur votre compte ci-dessous. Dans ce cas, souhaitez-vous également pouvoir vous connecter au site avec votre nom d'utilisateur et votre mot de passe ? Il est recommandé de définir cette option sur Non, car votre mot de passe est moins sécurisé que WebAuthn ; vous devrez utiliser WebAuthn pour vous connecter à ce site. Vous pourriez vouloir définir temporairement cette option sur Oui afin de pouvoir vous connecter au site depuis un nouvel appareil avec votre mot de passe pour configurer la connexion WebAuthn avec son authentificateur intégré (par exemple FaceID/TouchID, Windows Hello, lecteur d'empreintes digitales Android ou similaire). Vous pouvez ensuite remettre cette option sur Non."

PLG_ADMINTOOLS_HEADING_NOTICES="Avis"

PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE="Avis concernant l'e-mail lors d'une requête bloquée"
PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE_DESC="Affiche un avis lorsque le champ E-mail lors d'une requête bloquée dans la page Configurer le WAF n'est pas vide, vous rappelant de le désactiver sur un site en production."

PLG_ADMINTOOLS_LBL_EBRNOTICE_HEAD="Des e-mails seront envoyés chaque fois qu'Admin Tools bloque une requête"
PLG_ADMINTOOLS_LBL_EBRNOTICE_MESSAGE="Ceci est uniquement destiné à être une fonctionnalité de dépannage temporaire. Le laisser activé sur un site en production peut inonder votre boîte de réception de messages e-mail inutiles."
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NOEMAIL="Désactiver les e-mails"
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NONOTICE="Masquer ce message"

PLG_ADMINTOOLS_LBL_DLFNOTICE_HEAD="Admin Tools conserve un fichier journal de débogage des requêtes bloquées"
PLG_ADMINTOOLS_LBL_DLFNOTICE_MESSAGE="Le fichier journal de débogage est uniquement destiné au dépannage. Il enregistre en détail chaque requête bloquée, y compris les éventuelles données de formulaire soumises, dans un fichier non chiffré sur votre serveur ; il peut donc contenir des informations personnelles ou sensibles. Veuillez le désactiver dès que vous avez terminé le dépannage."
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE="Désactiver"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE_DELETE="Désactiver et supprimer les fichiers journaux"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_HIDE="Masquer ce message"
