PLG_ADMINTOOLS_ERR_BLOCKEDEMAILDOMAINS="Die E-Mail-Domain %s ist nicht erlaubt"
PLG_ADMINTOOLS_ERR_BLOCKEDUSERNAME="Der Benutzername '%s' ist reserviert und kann nicht für die Selbstregistrierung eines Benutzerkontos verwendet werden. Bitte wählen Sie einen anderen Benutzernamen."
PLG_ADMINTOOLS_ERR_LEAKEDPWD="Die Verwendung eines unsicheren Passworts ist nicht erlaubt. Das Passwort <strong>%s</strong> ist sehr schwach, da es in Angreifer-Wörterbüchern enthalten ist."

PLG_ADMINTOOLS_LBL_CACHEEXPIRE="Cache-Auto-Ablauf aktivieren"
PLG_ADMINTOOLS_LBL_CACHEEXPIRE_DESC="Abgelaufene Cache-Einträge werden regelmäßig gelöscht. Im Gegensatz zur Cache-Leerung wird nicht der gesamte Cache entfernt, sondern nur die abgelaufenen Einträge.<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_LBL_CACHECLEANER="Cache-Bereinigung aktivieren"
PLG_ADMINTOOLS_LBL_CACHECLEANER_DESC="Den Cache regelmäßig leeren (vollständig bereinigen), unabhängig davon, ob die Einträge abgelaufen sind oder nicht.<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ="Alle X Minuten ausführen"
PLG_ADMINTOOLS_LBL_CACHEEXP_FREQ_DESC="Der Cache-Ablauf wird alle X Minuten ausgeführt"

PLG_ADMINTOOLS_LBL_CACHE_FREQ="Alle X Minuten ausführen"
PLG_ADMINTOOLS_LBL_CACHE_FREQ_DESC="Die Cache-Bereinigung wird alle X Minuten ausgeführt"

PLG_ADMINTOOLS_LBL_CLEANTEMP="Bereinigung des temporären Verzeichnisses aktivieren"
PLG_ADMINTOOLS_LBL_CLEANTEMP_DESC="Den gesamten Inhalt des temporären Verzeichnisses der Website regelmäßig löschen.<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ="Alle X Minuten ausführen"
PLG_ADMINTOOLS_LBL_CLEANTEMP_FREQ_DESC="Die Bereinigung des temporären Verzeichnisses wird alle X Minuten ausgeführt"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE="Inaktive Benutzer löschen"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DESC="Benutzer, die sich registriert, aber sich nie auf der Website angemeldet haben, nach einer bestimmten Zeitspanne automatisch entfernen.<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NONE="Nie"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BLOCKED="Nur wenn sie ihr Konto aktiviert, sich aber nie angemeldet haben"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_NOTACTIVATED="Nur wenn sie ihr Konto nicht aktiviert haben"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_BOTH="Aktiviert oder nicht, solange sie sich nie angemeldet haben"

PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS="Nach dieser Anzahl von Tagen löschen"
PLG_ADMINTOOLS_LBL_DELETEINACTIVE_DAYS_DESC="Wie viele Tage nach der Registrierung eines Benutzers soll er entfernt werden, wenn er sich immer noch nicht auf der Website angemeldet hat?"

PLG_ADMINTOOLS_LBL_OVERRIDE="E-Mail-Sprache"
PLG_ADMINTOOLS_LBL_OVERRIDE_DESC="Die E-Mail, die Admin Tools an die Super-Benutzer sendet, wenn eine Anfrage blockiert wird, wird in der aktuellen Frontend-Sprache des Benutzers verfasst. Bei mehrsprachigen Websites kann dies zu Verwirrung führen. Sie können erzwingen, dass E-Mails unabhängig von der aktuell verwendeten Sprache der Website in einer bestimmten Sprache gesendet werden, indem Sie hier eine bestimmte Sprache auswählen."

PLG_ADMINTOOLS_LBL_MAXLOGENTRIES="Maximale Anzahl von Einträgen im Protokoll blockierter Anfragen"
PLG_ADMINTOOLS_LBL_MAXLOGENTRIES_DESC="Geben Sie die maximale Anzahl der im Protokoll blockierter Anfragen zu speichernden Einträge an. Überschüssige Einträge werden gelöscht. Verwenden Sie 0, um diese Funktion zu deaktivieren und alle Einträge im Protokoll blockierter Anfragen zu behalten. Hinweis: Wenn Sie Tausende alter Einträge haben, kann es eine Weile dauern, bis Admin Tools alle alten Einträge entfernt hat. Alte Einträge werden aus Leistungsgründen in Stapeln von 10.000 Einträgen bei jedem Seitenaufruf gelöscht.<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_LBL_SESCLEANER="Sitzungsbereinigung aktivieren"
PLG_ADMINTOOLS_LBL_SESCLEANER_DESC="Die Sitzungsmetadaten-Tabelle regelmäßig leeren.<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT="Sitzungsoptimierer aktivieren"
PLG_ADMINTOOLS_LBL_SESOPT_DESC="Die Sitzungsmetadaten-Tabelle regelmäßig prüfen und bei Bedarf reparieren und optimieren.<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_LBL_SESOPT_FREQ="Alle X Minuten ausführen"
PLG_ADMINTOOLS_LBL_SESOPT_FREQ_DESC="Der Sitzungsoptimierer wird alle X Minuten ausgeführt"

PLG_ADMINTOOLS_LBL_SES_FREQ="Alle X Minuten ausführen"
PLG_ADMINTOOLS_LBL_SES_FREQ_DESC="Die Sitzungsbereinigung wird alle X Minuten ausgeführt"

PLG_ADMINTOOLS_LBL_RESCUEURL="Rettungs-URL"
PLG_ADMINTOOLS_LBL_RESCUEURL_DESC="Wenn diese Funktion aktiviert ist, können Sie http://www.example.com/administrator/index.php?admintools_rescue=ihre_email@example.com aufrufen (wobei http://www.example.com die Adresse Ihrer Website und ihre_email@example.com Ihre Super-Benutzer-E-Mail-Adresse ist), wenn Sie gesperrt sind, um eine E-Mail mit Anweisungen zur vorübergehenden Deaktivierung von Admin Tools zu erhalten, sodass Sie wieder Zugang zu Ihrer Website erhalten. Diese Funktion gilt nur für das Administrator-Backend Ihrer Website und sendet Ihnen nur dann eine E-Mail, wenn die IP-Adresse, von der Sie darauf zugreifen, von Admin Tools gesperrt ist. Das Hauptpasswort oder Funktionen, die mit serverseitigen Konfigurationsdateien implementiert sind, wie der Passwortschutz für das Administrator-Verzeichnis, der .htaccess-Generator oder der Notfall-Offline-Modus, werden dadurch nicht deaktiviert."

PLG_ADMINTOOLS_LBL_RESCUEURL_SENTMSG="Überprüfen Sie Ihre E-Mail auf Informationen zur Rettungs-URL"
PLG_ADMINTOOLS_LBL_RESCUEURL_ERR_INVALIDADDRESS="Nein, leider ist Ihre Super-Benutzer-E-Mail-Adresse NICHT %s. Bitte versuchen Sie es erneut und ersetzen Sie %1$s durch die E-Mail-Adresse, die Sie in Ihrem Super-Benutzer-Konto auf der Website eingerichtet haben."

PLG_ADMINTOOLS_LBL_RESCUEDURATION="Dauer des Rettungsmodus (Minuten)"
PLG_ADMINTOOLS_LBL_RESCUEDURATION_DESC="Die Zeitdauer in Minuten, für die der Rettungsmodus aktiviert wird, nachdem Sie den Anweisungen in der per Rettungs-URL zugesandten E-Mail gefolgt sind. Nach Ablauf dieser Zeitspanne nimmt Admin Tools den normalen Betrieb wieder auf. Standard: 15 Minuten."

PLG_ADMINTOOLS_LBL_AUTOIMPORTURL="URL für automatischen Import"
PLG_ADMINTOOLS_LBL_AUTOIMPORTURL_DESC="Exportieren Sie Ihre Einstellungen mit der Export-Funktion von Admin Tools. Laden Sie die exportierte JSON-Datei an einen öffentlich im Internet zugänglichen Ort hoch. Geben Sie die URL zu dieser JSON-Datei auf allen Ihren anderen Websites ein, um diese JSON-Datei regelmäßig herunterzuladen und zu importieren. Dies entspricht dem manuellen Herunterladen der Datei von dieser URL und dem Importieren mit der Import- &amp; Export-Funktion von Admin Tools. Mit dieser Funktion können Sie die Konfiguration mehrerer Admin Tools-Installationen auf verschiedenen Websites im Wesentlichen „synchronisieren\".<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ="Häufigkeit des automatischen Imports (Stunden)"
PLG_ADMINTOOLS_LBL_AUTOIMPORTFREQ_DESC="Wie oft (in Stunden) soll Admin Tools versuchen, die JSON-Datei von der oben angegebenen URL herunterzuladen und zu importieren?<br/><strong>Diese Option ist veraltet und wird in Admin Tools 8.0 entfernt. Bitte verwenden Sie Geplante Aufgaben in Joomla 4.1 und neuer.</strong>"

PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_FIELDSET_LABEL="Passwort-Authentifizierung"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_LABEL="Passwort-Authentifizierung zulassen, wenn WebAuthn eingerichtet ist"
PLG_ADMINTOOLS_PWLOGINONWEBAUTHN_DESC="Dies gilt nur, wenn Sie die passwortlose Authentifizierung mit WebAuthn für Ihr Konto unten aktivieren. Möchten Sie sich in diesem Fall auch mit Ihrem Benutzernamen und Passwort auf der Website anmelden können? Es wird empfohlen, dies auf „Nein\" zu setzen, da Ihr Passwort weniger sicher ist als WebAuthn; Sie müssen WebAuthn verwenden, um sich auf dieser Website anzumelden. Sie können dies vorübergehend auf „Ja\" setzen, damit Sie sich von einem neuen Gerät mit Ihrem Passwort auf der Website anmelden können, um die WebAuthn-Anmeldung mit dem integrierten Authentifikator einzurichten (z. B. FaceID/TouchID, Windows Hello, Android-Fingerabdruckscanner oder ähnliches). Anschließend können Sie diese Option wieder auf „Nein\" setzen."

PLG_ADMINTOOLS_HEADING_NOTICES="Hinweise"

PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE="Hinweis zur E-Mail bei blockierter Anfrage"
PLG_ADMINTOOLS_LBL_BLOCKEDREQUESTEMAILNOTICE_DESC="Zeigt einen Hinweis an, wenn das Feld „E-Mail bei blockierter Anfrage\" auf der Seite „WAF konfigurieren\" nicht leer ist, und erinnert Sie daran, es auf einer Produktionswebsite zu deaktivieren."

PLG_ADMINTOOLS_LBL_EBRNOTICE_HEAD="E-Mails werden gesendet, wenn Admin Tools eine Anfrage blockiert"
PLG_ADMINTOOLS_LBL_EBRNOTICE_MESSAGE="Dies ist nur als vorübergehende Fehlerbehebungsfunktion gedacht. Wenn es auf einer Produktionswebsite aktiviert bleibt, kann Ihr Posteingang mit unnötigen E-Mail-Nachrichten überflutet werden."
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NOEMAIL="E-Mails deaktivieren"
PLG_ADMINTOOLS_LBL_EBRNOTICE_BTN_NONOTICE="Diese Meldung ausblenden"

PLG_ADMINTOOLS_LBL_DLFNOTICE_HEAD="Admin Tools führt eine Debug-Protokolldatei über blockierte Anfragen"
PLG_ADMINTOOLS_LBL_DLFNOTICE_MESSAGE="Die Debug-Protokolldatei ist nur für die Fehlerbehebung gedacht. Sie protokolliert jede blockierte Anfrage ausführlich, einschließlich aller übermittelten Formulardaten, in einer unverschlüsselten Datei auf Ihrem Server und kann daher persönliche oder sensible Informationen enthalten. Bitte schalten Sie sie aus, sobald Sie die Fehlerbehebung abgeschlossen haben."
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE="Ausschalten"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_DISABLE_DELETE="Ausschalten und Protokolldateien löschen"
PLG_ADMINTOOLS_LBL_DLFNOTICE_BTN_HIDE="Diese Meldung ausblenden"
