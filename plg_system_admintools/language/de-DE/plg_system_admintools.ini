PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE="<strong>Erinnerung</strong>: Ihnen wurde der Zugang zur Backend-Anmeldeseite ohne direktes Angeben des geheimen URL-Parameters für den Administrator-Bereich gewährt, weil Sie zuvor mit diesem Browser auf dieser Website angemeldet waren."
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_NONSUPERUSER="<p>Wenn Sie diese Meldung häufig bei der Nutzung der Administrator-Oberfläche der Website sehen, führen Sie bitte folgende Schritte aus:</p><ul><li>Arbeiten Sie immer nur auf einer Administrator-Seite gleichzeitig</li><li>Melden Sie sich vom Administrator-Bereich ab, wenn Sie ihn in den nächsten Minuten nicht verwenden werden</li><li>Rufen Sie die Anmeldeseite der Administrator-Oberfläche immer über die Ihnen mitgeteilte URL auf (sieht etwa so aus: <code>%s</code>)</li><ul>"
PLG_ADMINTOOLS_MSG_ADMINPW_COOKIE_SUPERUSER="<p>Wenn Sie oder andere Benutzer Ihrer Website diese Meldung häufig bei der Nutzung des Backends sehen, sollten Sie</p><ul><li>die Sitzungsdauer in der globalen Konfiguration Ihrer Website erhöhen</li><li>Benutzer daran erinnern, immer nur auf einer Administrator-Seite gleichzeitig zu arbeiten</li><li>Benutzer daran erinnern, die Abmeldefunktion von Joomla! zu verwenden, wenn sie die Administrator-Oberfläche in den nächsten Minuten nicht verwenden werden</li><li>Benutzer daran erinnern, die Website immer über die Anmelde-URL aufzurufen, die den geheimen URL-Parameter für den Administrator-Bereich enthält, wie in der Admin Tools-Dokumentation beschrieben (sieht etwa so aus: <code>%s</code>)</li></ul><p>Sie können diese Funktion ein-/ausschalten und/oder diese Meldung unter Komponenten, Admin Tools, Web Application Firewall, WAF konfigurieren ausblenden.</p>"

PLG_ADMINTOOLS_MSG_BLOCKED="Diese Anfrage wurde von Admin Tools blockiert. Bitte ändern Sie diese Meldung in den Optionen der Komponente. {RESCUEINFO}"
PLG_ADMINTOOLS_MSG_BLOCKED_RESCUEINFO="Wenn Sie der Administrator dieser Website sind und versehentlich Ihre eigene IP-Adresse gesperrt haben, besuchen Sie bitte {RESCUE_TRIGGER_URL}%1$s, wobei %1$s die E-Mail-Adresse Ihres (Super-Benutzer-)Kontos ist. Diese URL sendet Ihnen nur dann eine E-Mail, wenn die IP-Adresse, von der Sie darauf zugreifen, von Admin Tools gesperrt ist. Wenn Sie nicht gesperrt sind, wird keine E-Mail gesendet; Sie benötigen keine E-Mail mit Anweisungen zur Aufhebung der IP-Sperre, wenn Ihre IP nicht gesperrt ist."
PLG_ADMINTOOLS_MSG_DISABLEPWDRESET="Das eigenständige Zurücksetzen des Passworts für Ihr Benutzerkonto wurde aus Sicherheitsgründen deaktiviert. Bitte wenden Sie sich an einen Website-Administrator, um Hilfe bei der Passwortwiederherstellung zu erhalten."

