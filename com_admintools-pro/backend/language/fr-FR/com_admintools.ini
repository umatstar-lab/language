COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS="Domaines autorisés"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS_TIP="Saisissez tous les noms de domaine pleinement qualifiés auxquels votre site est censé répondre, par exemple <em>example.com, www.example.com, example.net</em>. Une entrée par champ de texte ; ajoutez d'autres champs en cliquant/appuyant sur le bouton vert +. Il n'est pas nécessaire d'ajouter <code>localhost</code> ou tout autre nom de domaine qui correspond à <code>127.0.0.1</code> ou <code>::1</code> (adresses localhost). Si quelqu'un tente d'usurper l'en-tête HTTP Host avec un nom de domaine ne figurant pas dans cette liste, il recevra une réponse HTTP 421 Misdirected Request. Cette fonctionnalité prévient l'usurpation de l'en-tête Host sur certains hôtes mal configurés."

