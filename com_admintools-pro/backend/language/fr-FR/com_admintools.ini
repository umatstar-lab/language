COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_HEADER="Les fonctionnalités frontales de l'Analyseur de modifications des fichiers PHP sont désactivées"
COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_INTRO="Votre <em>mot secret</em> n'est pas sécurisé et peut être facilement deviné. Afin de protéger votre site, Admin Tools a désactivé l'accès à la planification frontale jusqu'à ce que vous saisissiez un mot secret sécurisé. Le problème détecté est :"
COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Vous pouvez également cliquer sur le bouton ci-dessous pour réinitialiser le mot secret à la valeur suggérée <code>%s</code>. Dans les deux cas, vous devrez mettre à jour vos tâches CRON avec le nouveau mot secret."
COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Veuillez cliquer sur Options, puis sur Frontend et saisir un mot secret plus complexe."
COM_ADMINTOOLS_CONTROLPANEL_BTN_FESECRETWORD_RESET="Appliquer le mot secret suggéré"

COM_ADMINTOOLS_CONTROLPANEL_LBL_DISCLAIMER="AVERTISSEMENT"
COM_ADMINTOOLS_CONTROLPANEL_LBL_DISTEXT="Les composants liés à la sécurité, comme Admin Tools, ne sont pas conçus pour offrir une protection à 100 % de votre site contre toutes les attaques imaginables. Ils peuvent vous aider à améliorer la sécurité de votre site. Vous devez tout de même faire preuve de bon sens et adopter de bonnes pratiques de sécurité pour maintenir un site sain et sécurisé. Au strict minimum, vous devriez mettre à jour Joomla! et ses extensions régulièrement, effectuer des sauvegardes régulières et testées hors site, et surveiller tout comportement anormal de votre site."

COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_HEAD="Chemin vide comme répertoire de base de votre site."
COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_BODY="PHP signale un chemin vide comme répertoire de base de votre site. Cela est dû à un bogue dans les anciennes versions de PHP. Veuillez demander à votre hébergeur de mettre à jour la version de PHP installée sur son serveur. Si vous essayez d'utiliser le bouton Corriger les permissions, il est fort probable que vous perdiez l'accès à votre site."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD="Mot de passe principal"
COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_HEAD="Protection par mot de passe"
COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_INTRO="L'administrateur de ce site a verrouillé certaines ou toutes les fonctionnalités d'Admin Tools avec un mot de passe. Veuillez fournir le mot de passe afin d'être autorisé à y accéder."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MUSTENTERDLID="Vous devez saisir votre identifiant de téléchargement"
COM_ADMINTOOLS_CONTROLPANEL_LBL_NEEDSDLID="Vous devez saisir votre <b>identifiant de téléchargement</b> avant de pouvoir mettre à jour Admin Tools Professional. <a href='%s' target='_blank'>Si vous ne connaissez pas votre identifiant de téléchargement, veuillez cliquer ici</a>."
COM_ADMINTOOLS_CONTROLPANEL_MSG_WHERETOENTERDLID="Accédez au menu Système de Joomla! dans le menu de gauche. Trouvez le panneau Mise à jour et cliquez sur le lien Sites de mise à jour. Trouvez l'entrée « Admin Tools Professional » et cliquez dessus. Vous pouvez également <a href=\"%s\">cliquer ici</a> pour accéder directement à cette page. Saisissez votre identifiant de téléchargement — soit votre identifiant principal, soit un identifiant de téléchargement complémentaire — dans le champ « Clé de téléchargement » et cliquez sur le bouton Enregistrer."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED="Le fichier journal de débogage a été désactivé. Les fichiers journaux de débogage existants ont été conservés."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED_DELETED="Le fichier journal de débogage a été désactivé et les fichiers journaux de débogage existants ont été supprimés."
COM_ADMINTOOLS_CONTROLPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Important :</strong> Si Joomla! a déjà déterminé qu'il existe des mises à jour pour Admin Tools avant que vous n'ayez saisi votre identifiant de téléchargement, il <em>peut ne pas être en mesure de les télécharger</em> même après avoir saisi votre identifiant de téléchargement, en raison de plusieurs bogues persistants dans Joomla!. Dans ce cas, veuillez télécharger le fichier ZIP de la dernière version depuis notre site. Ensuite, accédez au menu Système de Joomla!, trouvez le panneau Installer, cliquez sur Extensions, puis sur l'onglet Envoyer un fichier d'installation et installez le fichier ZIP téléchargé <strong>deux fois</strong> de suite, <strong>sans</strong> désinstaller Admin Tools avant ou entre les deux installations. La double installation est nécessaire pour résoudre un autre bogue persistant dans Joomla! qui empêche parfois la copie de tous les fichiers mis à jour lors de l'installation d'une mise à jour d'extension."

COM_ADMINTOOLS_CONTROLPANEL_LBL_FESECRETWORD_RESET="Le mot secret a été changé en <code>%s</code>"

COM_ADMINTOOLS_CONTROLPANEL_LBL_RELOADUPDATE="Recharger les informations de mise à jour"
COM_ADMINTOOLS_CONTROLPANEL_LBL_UPDATE_INFORMATION_RELOADED="Les informations de mise à jour ont été rechargées depuis le serveur"

COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_HEAD="Mode de secours"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_MESSAGE="Admin Tools fonctionne en Mode de secours. Il s'agit d'un mode de dépannage qui vous permet de vous débloquer si vous vous êtes accidentellement exclu de votre site. Les protections d'Admin Tools sont temporairement désactivées uniquement pour l'accès administrateur de votre compte et uniquement depuis votre navigateur et votre adresse IP. Tant que vous voyez ce message, Admin Tools continue de protéger votre site."
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_BTN_HOWTOUNBLOCK="Comment me débloquer ?"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_BTN_ENDRESCUE="Terminer le mode de secours"

