COM_ADMINTOOLS_EMAILTEMPLATES_LBL_UPDATE="Installe les nouveaux modèles d'e-mail pour Admin Tools et met à jour les modèles existants s'ils ont été modifiés. Les modèles d'e-mail modifiés par l'utilisateur pour Admin Tools sont conservés intacts."
COM_ADMINTOOLS_EMAILTEMPLATES_BTN_RESET="Réinitialiser"
COM_ADMINTOOLS_EMAILTEMPLATES_LBL_RESET="Réinitialise les modèles d'e-mail. Cette opération supprime tous les modèles d'e-mail d'Admin Tools, <strong>y compris les modèles d'e-mail modifiés par l'utilisateur</strong>. Ensuite, elle réinstalle tous les modèles d'e-mail d'Admin Tools depuis zéro. N'utilisez ce bouton que si vous pensez avoir endommagé votre base de données. Sinon, utilisez le gestionnaire de modèles d'e-mail de Joomla! pour réinitialiser l'objet et le corps de chaque e-mail à la valeur par défaut à l'aide des boutons fournis dans l'interface de Joomla!."

