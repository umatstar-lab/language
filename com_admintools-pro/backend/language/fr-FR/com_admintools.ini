COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_TITLE="Admin Tools : E-mail de dépannage"
COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_DESC="Envoyé chaque fois que vous effectuez une modification dans la configuration d'Admin Tools susceptible de vous bloquer l'accès à votre site."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_SUBJECT="Informations de dépannage Admin Tools"
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY="Bonjour {USER},\n\nVous venez d'{ACTION} en utilisant le composant Admin Tools sur votre site « {SITENAME} ». Il s'agit généralement d'une opération sans risque. Dans certains cas, une incompréhension, une omission ou la modification de vos paramètres par un navigateur ou un serveur peut entraîner un dysfonctionnement de votre site ou le rendre inaccessible. Cela concerne à la fois Joomla! lui-même et ses diverses extensions tierces. Dans ce cas peu probable, veuillez consulter les URL suivantes pour obtenir des instructions de dépannage :\n\n{TROUBLESHOOTING_URLS}\n\nSi vous ne trouvez pas de solution par vous-même et que vous disposez d'un abonnement actif à Admin Tools, veuillez ouvrir un ticket d'assistance sur notre site, https://www.akeeba.com, en indiquant ce que vous avez fait avant que le problème survienne, la nature du problème et les étapes de dépannage que vous avez déjà tentées.\n\nQui a envoyé cet e-mail ?\n======================================================================\n\nCet e-mail est envoyé automatiquement par Admin Tools fonctionnant sur votre site à l'adresse e-mail enregistrée dans votre profil d'utilisateur Joomla! chaque fois que vous effectuez une action administrative susceptible de vous bloquer accidentellement l'accès à votre site. Il n'est envoyé à aucun autre utilisateur de votre site.\n\nSi vous ne souhaitez plus recevoir ces e-mails, connectez-vous à l'interface d'administration de votre site et accédez à Composants, Admin Tools, Web Application Firewall, Configurer le WAF, puis cliquez sur l'onglet Personnalisation. Repérez l'option « Envoyer un e-mail de dépannage lors des fonctions administratives » et définissez-la sur Non."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY_HTML="<p>Bonjour {USER},</p><p>Vous venez d'{ACTION} en utilisant le composant Admin Tools sur votre site « {SITENAME} ». Il s'agit généralement d'une opération sans risque. Dans certains cas, une incompréhension, une omission ou la modification de vos paramètres par un navigateur ou un serveur peut entraîner un dysfonctionnement de votre site ou le rendre inaccessible. Cela concerne à la fois Joomla! lui-même et ses diverses extensions tierces. Dans ce cas peu probable, veuillez consulter les URL suivantes pour obtenir des instructions de dépannage :</p>{TROUBLESHOOTING_URLS_HTML}<p>Si vous ne trouvez pas de solution par vous-même et que vous disposez d'un abonnement actif à Admin Tools, veuillez ouvrir un ticket d'assistance sur notre site, https://www.akeeba.com, en indiquant ce que vous avez fait avant que le problème survienne, la nature du problème et les étapes de dépannage que vous avez déjà tentées.</p><h3>Qui a envoyé cet e-mail ?</h3><p>Cet e-mail est envoyé automatiquement par Admin Tools fonctionnant sur votre site à l'adresse e-mail enregistrée dans votre profil d'utilisateur Joomla! chaque fois que vous effectuez une action administrative susceptible de vous bloquer accidentellement l'accès à votre site. Il n'est envoyé à aucun autre utilisateur de votre site.</p><p>Si vous ne souhaitez plus recevoir ces e-mails, connectez-vous à l'interface d'administration de votre site et accédez à Composants, Admin Tools, Web Application Firewall, Configurer le WAF, puis cliquez sur l'onglet Personnalisation. Repérez l'option « Envoyer un e-mail de dépannage lors des fonctions administratives » et définissez-la sur Non.</p>"

COM_ADMINTOOLS_MAIL_CONFIGMONITOR_TITLE="Admin Tools : Surveillance de la configuration"
COM_ADMINTOOLS_MAIL_CONFIGMONITOR_DESC="Envoyé par Admin Tools chaque fois que vous modifiez votre Configuration globale ou les options de configuration d'un composant lorsque les options « Surveiller la configuration globale » et/ou « Surveiller la configuration des composants » sont activées dans le Web Application Firewall."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_SUBJECT="Options de configuration pour {AREA} modifiées sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY="Bonjour,\n\nNous souhaitons vous informer que les options de configuration pour {AREA} sur votre site, {SITENAME}, ont été modifiées par l'utilisateur {USER}. Les paramètres qui ont été modifiés sont listés ci-dessous :\n\n{INFO}\n\nVoici des informations supplémentaires sur l'origine de cette modification :\n\nAdresse IP : {IP} (Recherche IP : {LOOKUP})\nAgent utilisateur : {UA}\n\nSi cette modification n'a pas été effectuée par vous ou par un administrateur en qui vous avez confiance, veuillez vérifier votre site immédiatement, car cela pourrait être le signe d'une activité de piratage.\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer que les options de configuration pour {AREA} sur votre site, {SITENAME}, ont été modifiées par l'utilisateur {USER}. Les paramètres qui ont été modifiés sont listés ci-dessous :</p>{INFO_HTML}<p>Voici des informations supplémentaires sur l'origine de cette modification :</p><ul><li>Adresse IP : {IP} (<a href=\"{LOOKUP}\">Recherche IP</a>)</li><li>Agent utilisateur : {UA}</li></ul><p>Si cette modification n'a pas été effectuée par vous ou par un administrateur en qui vous avez confiance, veuillez vérifier votre site immédiatement, car cela pourrait être le signe d'une activité de piratage.</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_CHANGED="Options modifiées"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_ADDED="Options ajoutées"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REMOVED="Options supprimées"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REDACTED="(modifiée ; valeur masquée pour des raisons de sécurité)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPAQUE="(modifiée)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_EMPTY="(vide)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPTION="Option"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OLD="Valeur précédente"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_NEW="Nouvelle valeur"
; Diff layout strings. Override these to restyle the changed-options table in the notification email.
; Plain text: %1$s = option label, %2$s = previous value, %3$s = new value (as applicable).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_SECTION="%s:"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_CHANGED="  %1$s: %2$s → %3$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_ADDED="  %1$s: %2$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_REMOVED="  %1$s: %2$s"
; Opaque line: the value is not shown (sensitive, compound, or a custom field type). %1$s = label, %2$s = marker.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_OPAQUE="  %1$s: %2$s"
; HTML: %s in the section is the section title; in a row %1$s = label, %2$s = previous value, %3$s = new value;
; in the table %1$s = Option header, %2$s = Previous value header, %3$s = New value header, %4$s = the rows.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_SECTION="<tr><th colspan=\"3\" style=\"text-align:left;background:#f0f0f0;\">%s</th></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW="<tr><td>%1$s</td><td>%2$s</td><td>%3$s</td></tr>"
; Opaque HTML row: %1$s = label, %2$s = marker (spans the previous/new value columns).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW_OPAQUE="<tr><td>%1$s</td><td colspan=\"2\">%2$s</td></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_TABLE="<table border=\"1\" cellpadding=\"4\" cellspacing=\"0\"><thead><tr><th>%1$s</th><th>%2$s</th><th>%3$s</th></tr></thead><tbody>%4$s</tbody></table>"

COM_ADMINTOOLS_MAIL_USERREACTIVATE_TITLE="Admin Tools : Réactivation du compte utilisateur"
COM_ADMINTOOLS_MAIL_USERREACTIVATE_DESC="Envoyé par Admin Tools chaque fois qu'un compte utilisateur est temporairement désactivé en raison d'un trop grand nombre d'échecs de connexion."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_SUBJECT="Compte utilisateur temporairement bloqué sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY="Bonjour,\n\nNous avons détecté plusieurs tentatives de connexion infructueuses avec le compte utilisateur {USER} sur notre site {SITENAME}. En conséquence, notre système a automatiquement appliqué un blocage temporaire sur le compte utilisateur le {DATE}.\n\nSi vous pensez avoir reçu ce message par erreur, c'est-à-dire si c'est vous qui avez accidentellement tenté de vous connecter avec un mauvais mot de passe, veuillez cliquer sur le lien suivant pour lever le blocage temporaire de votre compte utilisateur :\n{ACTIVATE}\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous disposez d'un compte utilisateur sur {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY_HTML="<p>Bonjour,</p><p>Nous avons détecté plusieurs tentatives de connexion infructueuses avec le compte utilisateur {USER} sur notre site {SITENAME}. En conséquence, notre système a automatiquement appliqué un blocage temporaire sur le compte utilisateur le {DATE}.</p><p>Si vous pensez avoir reçu ce message par erreur, c'est-à-dire si c'est vous qui avez accidentellement tenté de vous connecter avec un mauvais mot de passe, veuillez cliquer sur le lien suivant pour lever le blocage temporaire de votre compte utilisateur :</p><p><a href=\"{ACTIVATE}\">{ACTIVATE}</a></p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Remarque : Vous recevez ce message e-mail automatique parce que vous disposez d'un compte utilisateur sur {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_TITLE="Admin Tools : Échec de connexion administrateur"
COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_DESC="Envoyé par Admin Tools lorsqu'une tentative de connexion au backend échoue, pour autant que la fonctionnalité correspondante soit activée."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_SUBJECT="Échec de connexion administrateur pour l'utilisateur {USER} sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY="Bonjour,\n\nNous souhaitons vous informer que l'utilisateur {USER} ne s'est pas connecté avec succès à l'interface d'administration de votre site, {SITENAME}. Informations complémentaires :\n\nNom d'utilisateur : {USER}\nAdresse IP : {IP} ({LOOKUP})\nChaîne User Agent du navigateur : {UA}\n\nSi cela est attendu, vous n'avez rien à faire. Si vous suspectez une tentative de piratage, veuillez vous connecter immédiatement à l'interface d'administration de votre site et activer le mode hors ligne d'urgence d'Admin Tools.\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer que l'utilisateur <strong>{USER}</strong> ne s'est <strong>pas</strong> connecté avec succès à l'interface d'administration de votre site, {SITENAME}. Informations complémentaires :</p><p>Nom d'utilisateur : {USER}<br />Adresse IP : {IP} (<a href=\"{LOOKUP}\">Recherche IP</a>)<br />Chaîne User Agent du navigateur : {UA}</p><p>Si cela est attendu, vous n'avez rien à faire. Si vous suspectez une tentative de piratage, veuillez vous connecter immédiatement à l'interface d'administration de votre site et activer le mode hors ligne d'urgence d'Admin Tools.</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_TITLE="Admin Tools : Connexion administrateur réussie"
COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_DESC="Envoyé par Admin Tools lorsqu'une tentative de connexion au backend réussit, pour autant que la fonctionnalité correspondante soit activée."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_SUBJECT="L'utilisateur {USER} s'est connecté à l'interface d'administration de {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY="Bonjour,\n\nNous souhaitons vous informer que l'utilisateur {USER} vient de se connecter à l'interface d'administration de votre site, {SITENAME}. Informations complémentaires :\n\nNom d'utilisateur : {USER}\nAdresse IP : {IP} ({LOOKUP})\nChaîne User Agent du navigateur : {UA}\n\nSi cela est attendu, vous n'avez rien à faire. Si vous suspectez une tentative de piratage, veuillez vous connecter immédiatement à l'interface d'administration de votre site et activer le mode hors ligne d'urgence d'Admin Tools.\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer que l'utilisateur <strong>{USER}</strong> vient de se connecter à l'interface d'administration de votre site, {SITENAME}. Informations complémentaires :</p><p>Nom d'utilisateur : {USER}<br />Adresse IP : {IP} (<a href=\"{LOOKUP}\">Recherche IP</a>)<br />Chaîne User Agent du navigateur : {UA}</p><p>Si cela est attendu, vous n'avez rien à faire. Si vous suspectez une tentative de piratage, veuillez vous connecter immédiatement à l'interface d'administration de votre site et activer le mode hors ligne d'urgence d'Admin Tools.</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_IPAUTOBAN_TITLE="Admin Tools : Blocage automatique d'adresse IP"
COM_ADMINTOOLS_MAIL_IPAUTOBAN_DESC="Envoyé par Admin Tools lorsqu'une adresse IP est automatiquement bloquée, pour autant qu'une ou plusieurs adresses e-mail aient été sélectionnées pour cette fonctionnalité. Cela inclut également les instructions du mode de secours ; nous vous recommandons de "
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_SUBJECT="Notification de blocage automatique d'adresse IP pour {IP} sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY="Bonjour,\n\nNous souhaitons vous informer que l'adresse IP {IP} sera temporairement bloquée pour accéder à votre site, {SITENAME}. Vous trouverez des informations complémentaires ci-dessous.\n\nAdresse IP : {IP} (Recherche IP : {LOOKUP})\nRaison de la dernière requête bloquée : {REASON}\nBloquée jusqu'au : {UNTIL}\n\n{RESCUEINFO}\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nVous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer que l'adresse IP {IP} sera temporairement bloquée pour accéder à votre site, {SITENAME}. Vous trouverez des informations complémentaires ci-dessous.</p><p>Adresse IP : {IP} (<a href=\"{LOOKUP}\">Recherche IP</a>)<br />Raison de la dernière requête bloquée : {REASON}<br />Bloquée jusqu'au : {UNTIL}</p><p>{RESCUEINFO}</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_TITLE="Admin Tools : Fichier critique modifié"
COM_ADMINTOOLS_MAIL_CRITICALFILES_DESC="Envoyé par Admin Tools lorsqu'un « fichier critique » a été modifié."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_SUBJECT="Fichier critique modifié sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY="Bonjour,\n\nNous souhaitons vous informer qu'un ou plusieurs fichiers critiques ont été modifiés sur votre site, {SITENAME}. La liste des fichiers modifiés sur votre site est la suivante :\n\n{INFO}\n\nDois-je m'inquiéter ?\n======================================================================\n\nLes « fichiers critiques », dans le contexte de ce message e-mail, sont les fichiers les plus fréquemment ciblés par les pirates lors d'un piratage réussi d'un site. Ces fichiers peuvent également être modifiés, et le sont le plus souvent, pour des raisons légitimes. Par exemple, ils seront modifiés lorsque vous enregistrez la Configuration globale de votre site ou lorsque vous mettez à jour Joomla! ou l'un de ses modèles.\n\nVous ne devez PAS vous inquiéter si vous avez reçu cet e-mail après que vous-même, ou un autre administrateur en qui vous avez confiance, avez effectué l'une des modifications suivantes sur votre site :\n\n* Restauration des fichiers et/ou du contenu de la base de données du site à partir d'une sauvegarde\n* Modification de la Configuration globale\n* Mise à jour de Joomla!\n* Mise à jour d'un modèle de site\n\nSi ce message ne vous a PAS été envoyé suite à une telle modification souhaitée et attendue, veuillez vérifier votre site immédiatement, car cela pourrait être le signe d'une activité de piratage ; ou d'une extension ou d'un autre logiciel tiers effectuant quelque chose à votre insu et susceptible d'avoir un impact négatif sur votre site.\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer qu'un ou plusieurs fichiers critiques ont été modifiés sur votre site, {SITENAME}. La liste des fichiers modifiés sur votre site est la suivante :</p>{INFO_HTML}<h3>Dois-je m'inquiéter ?</h3><p>Les « fichiers critiques », dans le contexte de ce message e-mail, sont les fichiers les plus fréquemment ciblés par les pirates lors d'un piratage réussi d'un site. Ces fichiers peuvent également être <em>et le sont le plus souvent</em> modifiés pour des raisons légitimes. Par exemple, ils seront modifiés lorsque vous enregistrez la Configuration globale de votre site ou lorsque vous mettez à jour Joomla! ou l'un de ses modèles.</p><p>Vous ne devez PAS vous inquiéter si vous avez reçu cet e-mail après que vous-même, ou un autre administrateur en qui vous avez confiance, avez effectué l'une des modifications suivantes sur votre site :</p><ul><li>Restauration des fichiers et/ou du contenu de la base de données du site à partir d'une sauvegarde</li><li>Modification de la Configuration globale</li><li>Mise à jour de Joomla!</li><li>Mise à jour d'un modèle de site</li></ul><p>Si ce message ne vous a PAS été envoyé suite à une telle modification souhaitée et attendue, veuillez vérifier votre site immédiatement, car cela pourrait être le signe d'une activité de piratage ; ou d'une extension ou d'un autre logiciel tiers effectuant quelque chose à votre insu et susceptible d'avoir un impact négatif sur votre site.</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_TITLE="Admin Tools : Fichier surveillé modifié"
COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_DESC="Envoyé par Admin Tools lorsqu'un ou plusieurs fichiers que vous avez choisi de surveiller pour détecter des modifications ont été modifiés."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_SUBJECT="Fichiers surveillés modifiés sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY="Bonjour,\n\nNous souhaitons vous informer qu'un ou plusieurs fichiers que vous avez demandé à Admin Tools de surveiller pour détecter des modifications ont été modifiés sur votre site, {SITENAME}. La liste des fichiers modifiés sur votre site est la suivante :\n\n{INFO}\n\nSi ce message ne vous a pas été envoyé suite à une telle modification souhaitée et attendue, veuillez vérifier votre site immédiatement, car cela pourrait être le signe d'une activité de piratage.\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer qu'un ou plusieurs fichiers que vous avez demandé à Admin Tools de surveiller pour détecter des modifications ont été modifiés sur votre site, {SITENAME}. La liste des fichiers modifiés sur votre site est la suivante :</p>{INFO_HTML}<p>Si ce message ne vous a pas été envoyé suite à une telle modification souhaitée et attendue, veuillez vérifier votre site immédiatement, car cela pourrait être le signe d'une activité de piratage.</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_TITLE="Admin Tools : Super utilisateurs ajoutés"
COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_DESC="Envoyé par Admin Tools lorsqu'un super utilisateur a été créé et que la fonctionnalité Surveiller les comptes super utilisateurs est activée."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_SUBJECT="Des super utilisateurs ont été ajoutés à {SITENAME}"
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY="Bonjour,\n\nNous souhaitons vous informer que nous avons détecté l'ajout suspect d'un ou plusieurs comptes super utilisateurs sur votre site, {SITENAME}. Ces nouveaux comptes super utilisateurs ne semblent pas avoir été créés par les moyens habituels, c'est-à-dire via la page « Utilisateurs » de Joomla!. Ils ont donc été bloqués. Les nouveaux comptes super utilisateurs détectés et bloqués sont les suivants :\n\n{INFO}\n\nDois-je m'inquiéter ?\n======================================================================\n\nLes comptes super utilisateurs disposent d'un accès complet à votre site. Ils peuvent modifier tous les contenus, sans aucune restriction. Ils peuvent également installer des logiciels pouvant accéder à ou modifier tous les aspects de votre site, y compris les fichiers arbitraires, le contenu de la base de données et les paramètres de configuration. N'accordez l'accès super utilisateur qu'aux personnes en qui vous avez confiance.\n\nSi vous recevez cet e-mail, cela signifie que ces comptes super utilisateurs ont été créés en dehors de la page « Utilisateurs » de Joomla!. Cela signifie généralement qu'un pirate a trouvé un moyen de contourner la sécurité de votre site ou de votre serveur et a tenté de créer secrètement des comptes super utilisateurs pour lui-même. Pour cette raison, ces comptes ont été bloqués, c'est-à-dire qu'ils ne peuvent pas être utilisés pour se connecter à votre site.\n\nIl est cependant possible que vous receviez cet e-mail par erreur : si vous ou un autre super utilisateur avez intentionnellement créé ces comptes super utilisateurs en utilisant un outil tiers. Dans ce cas, ne vous inquiétez pas. Connectez-vous simplement à l'interface d'administration de votre site avec votre propre compte super utilisateur, accédez à la page Utilisateurs, modifiez les utilisateurs listés ci-dessus dans cet e-mail et débloquez-les.\n\nSi vous ou un autre super utilisateur n'avez PAS eu l'intention de créer ces super utilisateurs, nous vous recommandons d'auditer votre site et votre serveur pour détecter tout autre signe d'activité anormale.\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer que nous avons détecté l'ajout suspect d'un ou plusieurs comptes super utilisateurs sur votre site, {SITENAME}. Ces nouveaux comptes super utilisateurs ne semblent pas avoir été créés par les moyens habituels, c'est-à-dire via la page « Utilisateurs » de Joomla!. Ils ont donc été bloqués. Les nouveaux comptes super utilisateurs détectés <strong>et bloqués</strong> sont les suivants :</p>{INFO_HTML}<h3>Dois-je m'inquiéter ?</h3><p>Les comptes super utilisateurs disposent d'un accès complet à votre site. Ils peuvent modifier tous les contenus, sans aucune restriction. Ils peuvent également installer des logiciels pouvant accéder à ou modifier tous les aspects de votre site, y compris les fichiers arbitraires, le contenu de la base de données et les paramètres de configuration. N'accordez l'accès super utilisateur qu'aux personnes en qui vous avez confiance.</p><p>Si vous recevez cet e-mail, cela signifie que ces comptes super utilisateurs ont été créés en dehors de la page « Utilisateurs » de Joomla!. Cela signifie généralement qu'un pirate a trouvé un moyen de contourner la sécurité de votre site ou de votre serveur et a tenté de créer secrètement des comptes super utilisateurs pour lui-même. Pour cette raison, ces comptes ont été bloqués, c'est-à-dire qu'ils ne peuvent pas être utilisés pour se connecter à votre site.</p><p>Il est cependant possible que vous receviez cet e-mail par erreur : si vous ou un autre super utilisateur avez intentionnellement créé ces comptes super utilisateurs en utilisant un outil tiers. Dans ce cas, ne vous inquiétez pas. Connectez-vous simplement à l'interface d'administration de votre site avec votre propre compte super utilisateur, accédez à la page Utilisateurs, modifiez les utilisateurs listés ci-dessus dans cet e-mail et débloquez-les.</p><p>Si vous ou un autre super utilisateur n'avez PAS eu l'intention de créer ces super utilisateurs, nous vous recommandons d'auditer votre site et votre serveur pour détecter tout autre signe d'activité anormale.</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_RESCUEURL_TITLE="Admin Tools : URL de secours"
COM_ADMINTOOLS_MAIL_RESCUEURL_DESC="Envoyé par Admin Tools lorsqu'un utilisateur backend demande une URL de secours pour retrouver l'accès au site."
COM_ADMINTOOLS_EMAIL_RESCUEURL_SUBJECT="URL de secours demandée sur {SITENAME} pour {USER}"
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY="Bonjour,\n\nNous souhaitons vous informer que l'utilisateur {USER} a demandé une URL de secours pour votre site, {SITENAME}. Si vous avez effectué cette demande vous-même, veuillez cliquer sur le lien suivant, ou copier et coller l'URL dans votre navigateur. Cela vous permettra de vous connecter à l'interface d'administration de votre site où vous pourrez vous débloquer et/ou modifier la configuration d'Admin Tools. L'URL de secours est :\n\n{RESCUEURL}\n\nLes informations à la fin de cet e-mail vous indiquent ce qu'il faut faire une fois connecté à l'interface d'administration de votre site.\n\nJe n'ai aucune idée de la raison pour laquelle je reçois cet e-mail\n======================================================================\n\nConsultez la section « Qu'est-ce que l'URL de secours ? » plus bas. Vous n'avez PAS besoin d'effectuer une action et vous n'avez PAS à vous inquiéter.\n\nQui a demandé l'URL de secours ?\n======================================================================\n\nNom d'utilisateur : {USER}\nAdresse IP : {IP} (Recherche IP : {LOOKUP})\nAgent utilisateur : {UA}\n\nQu'est-ce que l'URL de secours ?\n======================================================================\n\nParfois, une configuration trop stricte d'Admin Tools peut vous bloquer accidentellement, vous, un super utilisateur, hors du site. Normalement, cela nécessiterait de renommer le fichier du plugin système d'Admin Tools pour vous débloquer. C'est un peu compliqué et sujet aux erreurs.\n\nLa fonctionnalité URL de secours contourne ce problème. En accédant à une URL spéciale lorsque vous êtes bloqué hors du site, cet e-mail vous est envoyé. L'URL dans cet e-mail n'est valide que pour le même navigateur et la même adresse IP que ceux ayant effectué la demande, et uniquement pendant une durée limitée. Y accéder vous amènera à une page de connexion administrateur temporairement débloquée. Cela vous permet d'accéder à l'interface d'administration de votre site pour vous débloquer et/ou modifier les paramètres d'Admin Tools.\n\nPar défaut, cette fonctionnalité est activée sur toutes les installations d'Admin Tools. De plus, un message concernant l'accès à l'URL de secours est affiché par défaut lorsqu'une personne est bloquée, SAUF si vous avez configuré un « Message personnalisé » dans la page Configurer le WAF d'Admin Tools. Si vous n'avez aucune idée de la raison pour laquelle vous avez reçu ce message, c'est probablement parce que quelqu'un a vu le message par défaut de blocage IP et a deviné correctement votre adresse e-mail de super utilisateur. Ne vous inquiétez pas cependant, ce qu'il a fait est totalement inutile puisqu'il aurait également besoin d'accéder à votre compte e-mail et à votre mot de passe de super utilisateur pour accéder à votre site, c'est-à-dire qu'il aurait déjà dû vous pirater. Comme cela est déjà documenté, nous vous recommandons vivement de modifier le « Message personnalisé » pour rendre moins évident le fait que votre site est protégé par Admin Tools. Si vous ne souhaitez pas utiliser la fonctionnalité URL de secours — et acceptez de renommer manuellement les fichiers conformément à la documentation lorsque vous êtes bloqué — accédez à Extensions, Plugins et modifiez les options du plugin système Admin Tools. Vous verrez une option pour l'URL de secours. Définissez-la sur Non pour désactiver cette fonctionnalité.\n\nQue faire après la connexion ?\n======================================================================\n\nSi votre adresse IP est bloquée par Admin Tools, accédez à Composants, Admin Tools et cliquez sur le grand bouton Débloquer mon adresse IP en haut de la page.\n\nSi votre adresse IP continue d'être bloquée sans que vous fassiez quoi que ce soit de suspect à votre connaissance, que l'adresse IP bloquée est toujours la même mais différente de celle signalée par http://www.ip-adress.eu/ et https://www.whatismyip.com/, votre site est peut-être derrière un CDN ou un proxy inverse. Dans ce cas, en plus des instructions ci-dessus, veuillez accéder à Système, Configuration globale. Définissez l'option « Derrière un équilibreur de charge » sur Oui et enregistrez.\n\nSi, en revanche, votre vraie adresse IP telle que signalée par les deux outils listés ci-dessus continue d'être bannie, vous devez identifier la cause du bannissement. Accédez à Composants, Admin Tools, Web Application Firewall, Journal des exceptions de sécurité et vérifiez la Raison et l'URL cible pour les entrées contenant votre adresse IP dans le champ Adresse IP. Si vous n'êtes pas sûr de ce que cela signifie, veuillez ouvrir un ticket d'assistance en pensant à copier les informations du Journal des exceptions de sécurité. Veuillez noter que vous devez disposer d'un abonnement actif pour bénéficier de l'assistance.\n\nSi vous avez oublié votre paramètre URL secret de l'administrateur, accédez à Composants, Admin Tools, Web Application Firewall, Configurer le WAF, cliquez sur l'onglet Fonctionnalités de protection de base et repérez l'option « Paramètre URL secret de l'administrateur ». Modifiez ou supprimez tout le texte dans ce champ pour réinitialiser ou supprimer, respectivement, cette fonctionnalité.\n\nQue faire si je ne parviens toujours pas à me connecter à mon site ?\n======================================================================\n\nIl existe deux cas où la fonctionnalité URL de secours, ou le renommage du fichier du plugin système d'Admin Tools, ne vous aidera pas. Ce sont les deux cas où Admin Tools a créé un fichier de configuration serveur, ce qui signifie que vous êtes bloqué par votre serveur, et non par Admin Tools.\n\nLe premier est la fonctionnalité de protection par mot de passe du répertoire administrateur. Veuillez supprimer les fichiers nommés .htaccess et .htpasswd du répertoire administrateur de votre site.\n\nL'autre cas est lorsque vous avez utilisé la fonctionnalité Générateur de fichier .htaccess d'Admin Tools. Dans ce cas, il y a un fichier .htaccess à la racine de votre site. Vous pouvez remplacer son contenu par le contenu du fichier .htaccess par défaut de Joomla!.\n\nDans les deux cas, notez que les fichiers ont des noms commençant par un point. Cela les rend cachés. Vous devrez activer l'affichage des fichiers cachés pour modifier/supprimer ces fichiers. Si vous ne savez pas comment procéder, demandez à votre hébergeur et indiquez-lui que vous devez modifier/supprimer des fichiers cachés. En général, il vous indiquera une option dans le gestionnaire de fichiers du panneau de contrôle de votre hébergement.\n\nDans tout autre cas, votre problème n'est pas lié à Admin Tools. Avez-vous un autre plugin de sécurité sur votre site ? Si oui, vérifiez ses paramètres. Sinon, contactez votre hébergeur. Le plus souvent, les hébergeurs disposent de leurs propres systèmes de sécurité serveur qui peuvent vous bloquer l'accès à votre site."
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer que l'utilisateur {USER} a demandé une URL de secours pour votre site, {SITENAME}. Si vous avez effectué cette demande vous-même, veuillez cliquer sur le lien suivant, ou copier et coller l'URL dans votre navigateur. Cela vous permettra de vous connecter à l'interface d'administration de votre site où vous pourrez vous débloquer et/ou modifier la configuration d'Admin Tools. L'URL de secours est :</p><p><a href=\"{RESCUEURL}\" rel=\"alternate\">{RESCUEURL}</a></p><p>Les informations à la fin de cet e-mail vous indiquent ce qu'il faut faire une fois connecté à l'interface d'administration de votre site.</p><h3>Je n'ai aucune idée de la raison pour laquelle je reçois cet e-mail</h3><p>Consultez la section « Qu'est-ce que l'URL de secours ? » plus bas. Vous <strong>n'avez PAS</strong> besoin d'effectuer une action et vous <strong>n'avez PAS</strong> à vous inquiéter.</p><h3>Qui a demandé l'URL de secours ?</h3><p>Nom d'utilisateur : {USER}<br />Adresse IP : {IP} (<a href=\"{LOOKUP}\">Recherche IP</a>)<br />Agent utilisateur : {UA}</p><h3>Qu'est-ce que l'URL de secours ?</h3><p>Parfois, une configuration trop stricte d'Admin Tools peut vous bloquer accidentellement, vous, un super utilisateur, hors du site. Normalement, cela nécessiterait de renommer le fichier du plugin système d'Admin Tools pour vous débloquer. C'est un peu compliqué et sujet aux erreurs.</p><p>La fonctionnalité URL de secours contourne ce problème. En accédant à une URL spéciale lorsque vous êtes bloqué hors du site, cet e-mail vous est envoyé. L'URL dans cet e-mail n'est valide que pour le même navigateur et la même adresse IP que ceux ayant effectué la demande, et uniquement pendant une durée limitée. Y accéder vous amènera à une page de connexion administrateur <em>temporairement</em> débloquée. Cela vous permet d'accéder à l'interface d'administration de votre site pour vous débloquer et/ou modifier les paramètres d'Admin Tools.</p><p>Par défaut, cette fonctionnalité est activée sur toutes les installations d'Admin Tools. De plus, un message concernant l'accès à l'URL de secours est affiché par défaut lorsqu'une personne est bloquée, SAUF si vous avez configuré un « Message personnalisé » dans la page Configurer le WAF d'Admin Tools. Si vous n'avez aucune idée de la raison pour laquelle vous avez reçu ce message, c'est probablement parce que quelqu'un a vu le message par défaut de blocage IP et a deviné correctement votre adresse e-mail de super utilisateur. Ne vous inquiétez pas cependant, ce qu'il a fait est totalement inutile puisqu'il aurait également besoin d'accéder à votre compte e-mail et à votre mot de passe de super utilisateur pour accéder à votre site, c'est-à-dire qu'il aurait déjà dû vous pirater. Comme cela est déjà documenté, nous vous recommandons vivement de modifier le « Message personnalisé » pour rendre moins évident le fait que votre site est protégé par Admin Tools. Si vous ne souhaitez pas utiliser la fonctionnalité URL de secours — et acceptez de renommer manuellement les fichiers conformément à la documentation lorsque vous êtes bloqué — accédez à Extensions, Plugins et modifiez les options du plugin système Admin Tools. Vous verrez une option pour l'URL de secours. Définissez-la sur Non pour désactiver cette fonctionnalité.</p><h3>Que faire après la connexion ?</h3><p>Si votre adresse IP est bloquée par Admin Tools, accédez à Composants, Admin Tools et cliquez sur le grand bouton Débloquer mon adresse IP en haut de la page.</p><p>Si votre adresse IP continue d'être bloquée sans que vous fassiez quoi que ce soit de suspect à votre connaissance, que l'adresse IP bloquée est toujours la même mais différente de celle signalée par <a href=\"http://www.ip-adress.eu/\">http://www.ip-adress.eu/ </a><em>et</em> <a href=\"https://www.whatismyip.com/\">https://www.whatismyip.com/</a>, votre site est peut-être derrière un CDN ou un proxy inverse. Dans ce cas, en plus des instructions ci-dessus, veuillez accéder à Système, Configuration globale. Définissez l'option « Derrière un équilibreur de charge » sur Oui et enregistrez.</p><p>Si, en revanche, votre vraie adresse IP telle que signalée par les deux outils listés ci-dessus continue d'être bannie, vous devez identifier la cause du bannissement. Accédez à Composants, Admin Tools, Web Application Firewall, Journal des exceptions de sécurité et vérifiez la Raison et l'URL cible pour les entrées contenant votre adresse IP dans le champ Adresse IP. Si vous n'êtes pas sûr de ce que cela signifie, veuillez <a href=\"https://www.akeeba.com/support/admin-tools.html\" rel=\"alternate\">ouvrir un ticket d'assistance</a> en pensant à copier les informations du Journal des exceptions de sécurité. Veuillez noter que vous devez disposer d'un abonnement actif pour bénéficier de l'assistance.</p><p>Si vous avez oublié votre paramètre URL secret de l'administrateur, accédez à Composants, Admin Tools, Web Application Firewall, Configurer le WAF, cliquez sur l'onglet Fonctionnalités de protection de base et repérez l'option « Paramètre URL secret de l'administrateur ». Modifiez ou supprimez tout le texte dans ce champ pour réinitialiser ou supprimer, respectivement, cette fonctionnalité.</p><h3>Que faire si je ne parviens toujours pas à me connecter à mon site ?</h3><p>Il existe deux cas où la fonctionnalité URL de secours, ou le renommage du fichier du plugin système d'Admin Tools, ne vous aidera pas. Ce sont les deux cas où Admin Tools a créé un fichier de configuration <em>serveur</em>, ce qui signifie que vous êtes bloqué par <em>votre serveur</em>, et non par Admin Tools.</p><p>Le premier est la fonctionnalité de <strong>protection par mot de passe du répertoire administrateur</strong>. Veuillez supprimer les fichiers nommés <code>.htaccess</code> et <code>.htpasswd</code> du répertoire <code>administrator</code> de votre site.</p><p>L'autre cas est lorsque vous avez utilisé la fonctionnalité <strong>Générateur de fichier .htaccess</strong> d'Admin Tools. Dans ce cas, il y a un fichier <code>.htaccess</code> à la racine de votre site. Vous pouvez remplacer son contenu par le <a href=\"https://raw.githubusercontent.com/joomla/joomla-cms/staging/htaccess.txt\" rel=\"alternate\">contenu du fichier .htaccess par défaut de Joomla!</a>.</p><p>Dans les deux cas, notez que les fichiers ont des noms commençant par un point. Cela les rend <em>cachés</em>. Vous devrez activer l'affichage des fichiers cachés pour modifier/supprimer ces fichiers. Si vous ne savez pas comment procéder, demandez à votre hébergeur et indiquez-lui que vous devez modifier/supprimer des fichiers <em>cachés</em>. En général, il vous indiquera une option dans le gestionnaire de fichiers du panneau de contrôle de votre hébergement.</p><p>Dans tout autre cas, votre problème n'est pas lié à Admin Tools. Avez-vous un autre plugin de sécurité sur votre site ? Si oui, vérifiez ses paramètres. Sinon, contactez votre hébergeur. Le plus souvent, les hébergeurs disposent de leurs propres systèmes de sécurité serveur qui peuvent vous bloquer l'accès à votre site.</p>"

COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_TITLE="Admin Tools : Requête bloquée"
COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_DESC="Envoyé par Admin Tools lorsqu'une requête est bloquée par son Web Application Firewall."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_SUBJECT="Requête bloquée sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY="Bonjour,\n\nNous souhaitons vous informer qu'une exception de sécurité a été détectée sur votre site, {SITENAME}, avec les détails suivants :\n\nAdresse IP : {IP} (Recherche IP : {LOOKUP})\nRaison : {REASON}\n\nSi ce type d'exception de sécurité se répète, veuillez vous connecter à l'interface d'administration de votre site et ajouter cette adresse IP à la fonctionnalité Web Application Firewall d'Admin Tools afin de bloquer complètement l'utilisateur malveillant.\n\nCordialement,\n\nL'équipe de {SITENAME}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes administrateur de {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer qu'une exception de sécurité a été détectée sur votre site, {SITENAME}, avec les détails suivants :</p><p>Adresse IP : {IP} (<a href=\"{LOOKUP}\">Recherche IP</a>)<br />Raison : {REASON}</p><p>Si ce type d'exception de sécurité se répète, veuillez vous connecter à l'interface d'administration de votre site et ajouter cette adresse IP à la fonctionnalité Web Application Firewall d'Admin Tools afin de bloquer complètement l'utilisateur malveillant.</p><p>Cordialement,</p><p>L'équipe de {SITENAME}</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes administrateur de <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_TITLE="Admin Tools : Nombreuses requêtes bloquées"
COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_DESC="Envoyé par Admin Tools lorsque votre site a bloqué un grand nombre de requêtes sur une période donnée."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_SUBJECT="Nombre accru de requêtes bloquées sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY="Bonjour,\n\nNous souhaitons vous informer que le site {SITENAME} bloque actuellement un nombre accru de requêtes.\n\nUn total de {NUM} requêtes a été bloqué depuis le {DATE}. Vous pouvez vérifier la raison des requêtes bloquées et envisager si des mesures supplémentaires s'avèrent nécessaires si vous suspectez le début d'une attaque soutenue contre votre site."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY_HTML="<p>Bonjour,</p><p>Nous souhaitons vous informer que le site {SITENAME} bloque actuellement un nombre accru de requêtes.</p><p>Un total de {NUM} requêtes a été bloqué depuis le {DATE}. Vous pouvez vérifier la raison des requêtes bloquées et envisager si des mesures supplémentaires s'avèrent nécessaires si vous suspectez le début d'une attaque soutenue contre votre site.</p>"

COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_TITLE="Admin Tools : listes d'adresses IP de robots d'exploration désactivées"
COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_DESC="Envoyé par Admin Tools aux super utilisateurs lorsqu'il désactive automatiquement l'option « Utiliser les listes d'adresses IP de robots d'exploration » parce que le cache du site semble ne pas fonctionner ou que les listes ne peuvent pas être téléchargées."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_SUBJECT="Les listes d'adresses IP de robots d'exploration ont été désactivées sur {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY="Bonjour,\n\nAdmin Tools a automatiquement désactivé l'option « Utiliser les listes d'adresses IP de robots d'exploration » sur {SITENAME} le {DATE}, car {CAUSE}.\n\nCela évite de ralentir votre site. Tant que vous ne réactivez pas l'option, vos paramètres Bloquer et Ne pas bloquer pour les robots des moteurs de recherche et de l'IA ne sont pas appliqués.\n\nComment résoudre le problème :\n\n* Si la cause est que le cache du site ne stocke aucune donnée : allez dans Système, Configuration globale, Système, et vérifiez vos paramètres de cache. Assurez-vous que le dossier de cache est accessible en écriture, ou que votre serveur Redis ou Memcached fonctionne et est joignable.\n* Si la cause est que le téléchargement des listes échoue systématiquement : vérifiez que votre serveur est autorisé à établir des connexions sortantes vers d'autres sites web (pare-feu, paramètres de proxy, restrictions de l'hébergeur).\n\nUne fois le problème résolu, allez dans Composants, Admin Tools, Web Application Firewall, Configurer le WAF, cliquez sur l'onglet Robots d'exploration et réactivez « Utiliser les listes d'adresses IP de robots d'exploration ». Vous pouvez le faire directement à l'adresse {URL}\n\nRemarque : Vous recevez ce message e-mail automatique parce que vous êtes super utilisateur sur {SITENAME}. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY_HTML="<p>Bonjour,</p><p>Admin Tools a automatiquement désactivé l'option « Utiliser les listes d'adresses IP de robots d'exploration » sur {SITENAME} le {DATE}, car {CAUSE}.</p><p>Cela évite de ralentir votre site. Tant que vous ne réactivez pas l'option, vos paramètres Bloquer et Ne pas bloquer pour les robots des moteurs de recherche et de l'IA ne sont pas appliqués.</p><p>Comment résoudre le problème :</p><ul><li>Si la cause est que le cache du site ne stocke aucune donnée : allez dans Système, Configuration globale, Système, et vérifiez vos paramètres de cache. Assurez-vous que le dossier de cache est accessible en écriture, ou que votre serveur Redis ou Memcached fonctionne et est joignable.</li><li>Si la cause est que le téléchargement des listes échoue systématiquement : vérifiez que votre serveur est autorisé à établir des connexions sortantes vers d'autres sites web (pare-feu, paramètres de proxy, restrictions de l'hébergeur).</li></ul><p>Une fois le problème résolu, allez dans Composants, Admin Tools, Web Application Firewall, Configurer le WAF, cliquez sur l'onglet Robots d'exploration et réactivez « Utiliser les listes d'adresses IP de robots d'exploration ». Vous pouvez le faire directement <a href=\"{URL}\">dans Configurer le WAF</a>.</p><p><small>Vous recevez ce message e-mail automatique parce que vous êtes super utilisateur sur <em>{SITENAME}</em>. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</small></p>"

