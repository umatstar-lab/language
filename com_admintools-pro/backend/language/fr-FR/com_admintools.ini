COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION="Composant"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_ALL="(Tous)"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_DESC="Le nom du composant Joomla! auquel cette règle s’applique. Laisser vide (« – Composant – ») correspond à tous les composants."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_SELECT="– Composant –"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW="Nom de la vue"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_DESC="La vue (zone du composant) ou le nom du contrôleur du composant qui doit être présent dans l’URL pour que cette règle corresponde. Désactivez les URL SEF et vous verrez soit <code>view=NomVue</code>, soit <code>task=NomVue.NomTâche</code>, où <var>NomVue</var> est le nom de la vue à saisir ici. Laisser vide correspond à toutes les vues. Si vous souhaitez faire correspondre un chemin d’URL SEF, laissez le Composant défini sur « (Tous) » et saisissez le chemin SEF <strong>AVEC</strong> une barre oblique initiale mais <strong>SANS</strong> <code>index.php</code>. Par exemple, utilisez <code>/foo/bar</code>. Sur les sites multilingues, vous ne devez PAS inclure le préfixe de langue, par exemple <s><code>/en/example</code></s> est incorrect, tandis que <code>/example</code> est correct. Veuillez noter qu’il peut s’agir d’un chemin <em>partiel</em>, c’est-à-dire que <code>/foo/bar</code> correspond à la fois à <code>/foo/bar/test</code> et à <code>/foo/bar.html</code>."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_ANY="(Tous)"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY="Paramètre de requête"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_DESC="Le paramètre de requête pour lequel désactiver le filtrage de sécurité, par exemple <code>id</code>. Laisser vide correspond à tous les paramètres de requête. Notez que les exceptions WAF sont appliquées après que Joomla! a converti une URL SEF en son format non-SEF, que les URL SEF soient activées ou non sur votre site."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_TYPE_ANY="(Tous)"

COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_COPIED="%d règles d’exception WAF ont été copiées."
