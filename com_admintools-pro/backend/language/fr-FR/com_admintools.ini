COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN="Admin Tools a détecté que votre fichier de configuration serveur (c'est-à-dire .htaccess, nginx.conf ou web.config) a été modifié. Nous vous recommandons vivement de placer toute modification manuelle dans les champs <strong>Règles personnalisées</strong>, afin de ne pas les perdre si vous régénérez le fichier via Admin Tools."
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_REGENERATE="Régénérer"
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_IGNORE="Ignorer"
COM_ADMINTOOLS_CONTROLPANEL_ERR_SERVERCONFIGWARN_REGENERATE="Impossible de régénérer le fichier de configuration serveur."
