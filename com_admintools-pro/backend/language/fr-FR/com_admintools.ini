COM_ADMINTOOLS_WAFDENYLISTS_LBL_OPTION_DESC="Le nom du composant Joomla! auquel cette règle s'applique. Laisser vide (« – Composant – ») correspond à tous les composants."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_OPTION_SELECT="– Composant –"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW="Nom de la vue"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_DESC="La vue (zone du composant) ou le nom du contrôleur du composant qui doit être présent dans l'URL pour que cette règle s'applique. Désactivez les URL SEF et vous verrez soit <code>view=NomVue</code> soit <code>task=NomVue.NomTâche</code>, où <var>NomVue</var> est le nom de la vue à saisir ici. Laisser vide correspond à toutes les vues."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_ANY="(Toutes)"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK="Tâche"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_ANY="(Toutes)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_DESC="La tâche (une commande pour une zone spécifique du composant) à laquelle cette règle s'applique. Désactivez les URL SEF et vous verrez soit <code>task=NomTâche</code> soit <code>task=NomVue.NomTâche</code>, où <var>NomTâche</var> est la tâche à saisir ici. Laisser vide correspond à toutes les vues."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY="Paramètre de requête"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_DESC="Le paramètre de la chaîne de requête dont le contenu sera utilisé pour faire correspondre cette règle, par exemple <code>id</code>. Laisser vide pour appliquer la règle quel que soit le contenu du paramètre de requête. Notez que la correspondance du contenu de la requête n'est appliquée qu'<strong>après</strong> que Joomla! a converti une URL SEF en son format non-SEF. Cela signifie que certains paramètres de requête peuvent ne pas être visibles pour vous — même s'ils sont visibles pour Joomla! et Admin Tools et peuvent donc entraîner le blocage de la requête par le pare-feu applicatif web — sauf si vous désactivez les URL SEF."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE="Type de filtre du paramètre de requête"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_ANY="(Tous)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_DESC="Choisissez comment le paramètre de requête sera mis en correspondance. « RegEx » signifie que le champ Paramètre de requête contient une <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">expression régulière PHP</a> pour correspondre au contenu du paramètre de requête. Vous pouvez inverser une expression régulière en la faisant précéder d'un point d'exclamation (<code>!</code>). « Exact » signifie que le nom du paramètre de requête doit correspondre exactement au champ Paramètre de requête tel que saisi, y compris les majuscules et minuscules. « Partiel » signifie que le nom du paramètre de requête doit inclure le paramètre de requête saisi, par exemple le paramètre de requête « bar » correspondra à l'un des noms de paramètres suivants : « re<em>bar</em> », « <em>bar</em>tender » et « <em>bar</em> »."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_EXACT="Exact"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_PARTIAL="Partiel"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_REGEX="RegEx"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT="Contenu de la requête"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_ANY="(Tout contenu)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_DESC="Laisser vide pour appliquer la règle quel que soit le contenu de la requête. Sinon, fournissez une <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">expression régulière PHP</a> ; si elle correspond au contenu du paramètre de requête, la règle s'applique. Vous pouvez inverser une expression régulière en la faisant précéder d'un point d'exclamation (<code>!</code>)."

COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_COPIED="%d règles de la liste noire du WAF ont été copiées."
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_COPIED_1="La règle de la liste noire du WAF a été copiée."
