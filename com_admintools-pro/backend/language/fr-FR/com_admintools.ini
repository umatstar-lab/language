COM_ADMINTOOLS_SERVERCONFIGREMINDER_MSG="Votre fichier de configuration serveur (.htaccess, nginx.conf ou web.config) a été généré par Admin Tools, mais il ne correspond plus à ce que cette version d'Admin Tools générerait. Veuillez <a href='%s'>ouvrir le Panneau de contrôle d'Admin Tools et le régénérer</a> afin que les dernières protections prennent effet."
COM_ADMINTOOLS_CORESUMS_WARN_HEAD="Vérification des fichiers du cœur indisponible"
COM_ADMINTOOLS_CORESUMS_WARN_BODY="La dernière exécution de l'analyseur de modifications des fichiers PHP n'a pas pu télécharger les données de sommes de contrôle CoreSums ; les fichiers n'ont donc pas été vérifiés par rapport aux sommes de contrôle officielles du cœur de Joomla. L'analyse s'est tout de même terminée, mais aucun fichier n'a été marqué comme appartenant ou non au cœur. Il s'agit généralement d'un problème réseau temporaire. Si cela persiste, vérifiez les options \"URL du service CoreSums\" et \"Délai d'expiration du téléchargement CoreSums\" dans la configuration du composant."
