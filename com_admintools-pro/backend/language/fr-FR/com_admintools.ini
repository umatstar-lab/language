COM_ADMINTOOLS_WAFDENYLISTS_LBL_ERR_ALLEMPTY="Vous devez fournir au moins un élément parmi Composant, Vue, Tâche ou Paramètre de requête pour que la règle de la liste noire du WAF soit valide."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION="Application"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION_DESC="L'application Joomla! à laquelle cette règle doit s'appliquer. « Frontend » désigne la partie publique de votre site, « Backend » désigne l'interface d'administration (<code>/administrator/</code>), « API » désigne l'application API de Joomla! (<code>/api/</code>). « (Toutes) » applique la règle à toutes les applications."
