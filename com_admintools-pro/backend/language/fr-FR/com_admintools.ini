COM_ADMINTOOLS_EMAILTEMPLATES_LBL_WHERE_HEAD="Où se trouvent les modèles d'e-mail ?"
COM_ADMINTOOLS_EMAILTEMPLATES_LBL_WHERE_TEXT="Les modèles d'e-mail pour les extensions principales et tierces, comme Admin Tools, sont gérés de manière centralisée par Joomla! lui-même dans la page Système, Modèles d'e-mail. Les extensions tierces doivent cependant implémenter leur propre code pour installer et mettre à jour les modèles d'e-mail. C'est ce que fait cette page. Si vous souhaitez personnaliser les modèles d'e-mail, veuillez cliquer sur le bouton ci-dessous pour accéder à la page Modèles d'e-mail de Joomla!."
