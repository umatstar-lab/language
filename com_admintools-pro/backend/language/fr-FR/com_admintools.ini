COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN="Envoyer un e-mail à cette adresse après un bannissement automatique d'adresse IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN_TIP="Admin Tools peut optionnellement vous envoyer un e-mail lorsqu'une adresse IP est automatiquement bannie, à l'adresse e-mail saisie dans ce champ. Laissez ce champ vide (valeur par défaut) pour désactiver cette fonctionnalité."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR="Balise générateur"
