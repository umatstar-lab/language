COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL_TIP="Un e-mail sera envoyé à cette adresse si Admin Tools détecte qu'un grand nombre de requêtes a été bloqué dans une certaine période de temps. Vous pouvez configurer cela ci-dessous ; la valeur par défaut est 1 000 requêtes bloquées en une heure."
