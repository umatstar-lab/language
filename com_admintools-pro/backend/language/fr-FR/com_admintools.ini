COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE="<p>Les heures de la plage horaire d'absence doivent être indiquées dans le fuseau horaire %s. Vous pouvez modifier ce fuseau horaire dans la page de configuration globale de Joomla!. Si l'heure actuelle semble toujours incorrecte, veuillez demander à votre hébergeur de vérifier l'heure du serveur ainsi que les paramètres de fuseau horaire de PHP et du système d'exploitation.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIP="La plage horaire d'absence désactive l'accès à la zone administrateur de votre site pendant la période que vous spécifiez dans les champs de début et de fin. Cela est utile lorsque vous êtes le seul administrateur du site et que vous souhaitez vous assurer que personne ne peut accéder à la section administrateur de votre site pendant que vous dormez ou êtes absent. L'heure doit être indiquée dans le fuseau horaire du serveur que vous avez configuré dans la configuration globale de votre site. Le fuseau horaire et l'heure actuelle dans ce fuseau horaire sont affichés dans le message sous le champ Début de la plage horaire d'absence pour votre commodité."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TO="Plage horaire d'absence, fin (hh:mm)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGSAVED="La configuration du pare-feu applicatif web (WAF) a été enregistrée."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGNOTSAVED="Des erreurs se sont produites lors de l'enregistrement de la configuration du pare-feu applicatif web (WAF)."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER="Changer le répertoire de connexion administrateur en"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_TIP="Par exemple, si vous saisissez le mot <code>test</code> ici, vous ne pourrez accéder à la zone administrateur de votre site qu'avec une URL similaire à <code>http://www.example.com/test</code>. Si vous tentez d'y accéder via <code>http://www.example.com/administrator</code>, vous serez redirigé vers la page d'accueil du site. Après avoir visité l'URL secrète avec votre navigateur, vous pourrez également accéder à <code>http://www.example.com/administrator</code> sans être bloqué jusqu'à l'expiration de votre session. Si vous ne souhaitez pas utiliser cette fonctionnalité, laissez ce champ vide. Veuillez noter que cette fonctionnalité nécessite que les options <strong>URLs SEF</strong> et <strong>Utiliser la réécriture d'URL</strong> dans la page de configuration globale de Joomla! soient toutes deux définies sur Oui."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_HEAD="Cette fonctionnalité est expérimentale et non prise en charge"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_TEXT="Sur certains sites, le <strong>dossier de connexion administrateur personnalisé</strong> peut se comporter de manière erratique, ne pas fonctionner du tout ou rendre la connexion impossible. Nous en sommes conscients et il n'existe pas de solution de contournement pour cela. C'est pourquoi cette fonctionnalité est fournie <strong>SANS ASSISTANCE</strong>. Veuillez lire la documentation pour plus d'informations."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_DESC="Ce message sera affiché aux utilisateurs lorsque leur requête est jugée suspecte d'une violation de sécurité. Soyez bref et courtois. Laissez vide pour utiliser le message par défaut."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_HEADER="Personnalisation"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_LABEL="Message personnalisé"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM="Nombre d'échecs de connexion"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM_TIP="Les utilisateurs seront désactivés lorsque ce nombre d'échecs de connexion se produit pour eux dans la période de temps configurée par les deux options suivantes."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ="Période d'échecs de connexion"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ_TIP="Les utilisateurs seront désactivés lorsqu'au moins autant d'échecs de connexion que le nombre saisi ci-dessus se produisent dans cette durée maximale. L'unité de mesure du temps (secondes, minutes, heures, jours) est spécifiée dans l'option suivante."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ="Unité de mesure du temps"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ_TIP="Définit l'unité de mesure du temps pour le champ Période d'échecs de connexion."
