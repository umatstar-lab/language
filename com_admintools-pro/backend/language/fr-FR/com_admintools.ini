COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION_ADMIN="Backend"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION_API="API"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_VERB="Verbe HTTP"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VERB_DESC="Le verbe HTTP auquel cette règle s'applique (GET, POST, etc.). Le frontend et le backend de votre site utilisent généralement GET pour afficher des pages ou récupérer du contenu via des requêtes JavaScript, et POST pour soumettre des formulaires ou envoyer du contenu vers le site. L'application API utilise typiquement des requêtes GET, POST, DELETE et PATCH."
