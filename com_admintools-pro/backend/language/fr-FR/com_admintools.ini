COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_INTRO = "Cette page vous permet de sélectionner des composants, des vues ou des paramètres de requête spécifiques <i>à NE PAS protéger</i> par le pare-feu applicatif web (WAF). Les exceptions sont appliquées en deux groupes :"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_A = "Lorsque <i>tous les paramètres de requête</i> sont spécifiés pour un composant ou une vue, les fonctionnalités WAF suivantes sont entièrement désactivées : Bad Behaviour, SQLiShield, XSSShield, MUAShield, RFIShield, DFIShield et le filtrage des mots interdits"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_B = "Lorsque des <i>paramètres de requête spécifiques</i> sont indiqués pour un composant ou une vue, les fonctionnalités WAF suivantes sont désactivées <i>uniquement pour ces paramètres de requête</i> : SQLiShield, XSSShield, RFIShield, DFIShield, le filtrage des mots interdits et le blocage des paramètres d’URL suspects"

COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_TITLE="Aucune règle d’exception WAF n’a encore été créée."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_CONTENT="Les règles d’exception WAF vous permettent d’empêcher le blocage des requêtes vers votre site pour des composants, des vues et des paramètres de requête spécifiques. Elles peuvent être utilisées lorsque vous savez qu’un composant est sécurisé mais que son fonctionnement entraîne toujours des faux positifs."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_BUTTON_ADD="Ajouter une règle d’exception WAF"

COM_ADMINTOOLS_WAFEXCEPTION_TABLE_CAPTION="Tableau des règles d’exception du pare-feu applicatif web (WAF)."

