COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_TITLE="Aucun mot interdit n'a encore été défini."
COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_CONTENT="Les mots interdits vous permettent de bloquer toute requête publique en frontend qui contient un ou plusieurs de ces mots dans n'importe quel paramètre de requête. Ils peuvent être utilisés pour bloquer le spam manifeste et les termes offensants soumis à votre site."
