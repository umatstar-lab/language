COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_HELP="<info>%command.name%</info> supprimera les fichiers et dossiers Joomla! qu'une mise à jour de Joomla aurait dû supprimer, mais n'a pas supprimés.\nLes fichiers du cœur laissés en place peuvent rendre votre site totalement inutilisable, le plus souvent par une erreur fatale liée à un alias de classe.\nUtilisez <info>--dry-run</info> pour lister ce qui serait supprimé sans rien modifier.\nUtilisation : <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_OPT_DRYRUN="Lister les fichiers et dossiers obsolètes trouvés, et si PHP peut y écrire, sans rien supprimer."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTHINGTODO="Il n'y a aucun fichier ni dossier obsolète du cœur de Joomla! sur ce site."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_DELETED="supprimé"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_FAILED="ÉCHEC"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_WRITEABLE="accessible en écriture"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTWRITEABLE="NON accessible en écriture"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_ERR_SOMEFAILED="%d fichiers et dossiers obsolètes n'ont pas pu être supprimés. Veuillez les supprimer à la main par FTP, SFTP ou avec le gestionnaire de fichiers fourni par votre hébergeur."

[options]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Component Options
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;; File Scanner
COM_ADMINTOOLS_JCONFIG_SCAN_LABEL="Analyseur de fichiers"
COM_ADMINTOOLS_JCONFIG_SCAN_DESC="Configurer le fonctionnement de l'analyseur de fichiers PHP"

COM_ADMINTOOLS_JCONFIG_LOGLEVEL_LABEL="Niveau de journalisation"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DESC="Le niveau de détail du journal de l'analyseur de fichiers PHP, conservé dans le répertoire de journaux configuré de votre site. Valeurs recommandées : « Avertissements » pour les sites en production, « Débogage » lorsque vous souhaitez nous demander de l'assistance."
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_NONE="Aucun"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_ERROR="Erreurs"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_WARNING="Avertissements"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_INFO="Informations"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DEBUG="Débogage"
COM_ADMINTOOLS_JCONFIG_MINEXEC_LABEL="Durée minimale de la requête"
COM_ADMINTOOLS_JCONFIG_MINEXEC_DESC="Durée minimale que prendra chaque requête vers le Scanneur de modifications de fichiers PHP. Augmentez cette valeur si votre serveur génère une erreur parce que les requêtes arrivent trop fréquemment ou si vous atteignez les limites CPU / ressources.<br/><br/>Valeurs recommandées : 2,0 à 7,0."
COM_ADMINTOOLS_JCONFIG_MAXEXEC_LABEL="Durée maximale de travail"
COM_ADMINTOOLS_JCONFIG_MAXEXEC_DESC="Durée maximale consacrée à l'analyse de votre site lors de chaque requête adressée à l'Analyseur de modifications des fichiers PHP. Diminuez cette valeur si vous atteignez les limites CPU ou ressources de votre serveur. Définissez-la inférieure à la Durée minimale des requêtes pour créer une période de « refroidissement de l'utilisation CPU », réduisant ainsi votre consommation de ressources pendant l'analyse des fichiers au détriment d'une analyse plus lente.<br/><br/>Valeurs recommandées : 3.0 à 7.0"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_LABEL="Biais de durée de travail"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_DESC="Une valeur de 50 à 100 qui détermine l'agressivité avec laquelle Admin Tools prédit s'il est sur le point d'atteindre la limite de Durée maximale de travail. 50 est le plus agressif et entraînera une analyse occupant environ la moitié de la Durée maximale de travail lors de chaque requête adressée à l'Analyseur de modifications des fichiers PHP. 100 est le moins agressif et entraînera une analyse occupant au moins, et généralement plus, la Durée maximale de travail lors de chaque requête.<br/><br/>Valeur recommandée : 75.<br/><br/><strong>Conseil !</strong> Si votre serveur est particulièrement sensible, nous recommandons de définir la Durée minimale des requêtes à 7.0, la Durée maximale de travail à 5.0 et le Biais de durée de travail à 50. Cela signifie que l'analyseur travaille pendant 2.5 à 5.0 secondes à la fois, puis votre serveur ne fait rien pendant 2.0 à 4.5 secondes. L'analyse de votre site prendra environ trois fois plus longtemps, mais elle a de meilleures chances de se terminer."
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_LABEL="Nombre max. de dossiers par lot"
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_DESC="Le nombre maximum de dossiers à lister dans un répertoire donné en une seule fois. Cela empêche PHP d'expirer lors du listage du contenu de dossiers <em>vraiment</em> volumineux, contenant des centaines de dossiers directement à l'intérieur.<br/><br/>Valeur recommandée : 50<br/><br/>N'oubliez pas que lister le contenu des dossiers est <strong>exponentiellement proportionnel</strong> au nombre de fichiers et de dossiers qu'ils contiennent. C'est une limitation liée au fonctionnement des systèmes d'exploitation et de leurs pilotes de système de fichiers. Nous, Joomla! ou PHP ne pouvons rien y faire. Il vous est fortement conseillé d'exclure les dossiers vraiment volumineux et de prendre des mesures pour éviter d'avoir des dossiers contenant des milliers de fichiers et de dossiers directement. Si vous n'êtes pas sûr, imbriquez vos dossiers en profondeur."
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_LABEL="Nombre max. de fichiers par lot"
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_DESC="Le nombre maximum de fichiers à lister dans un répertoire donné en une seule fois. Cela empêche PHP d'expirer lors du listage du contenu de dossiers <em>vraiment</em> volumineux, contenant des milliers de fichiers directement à l'intérieur.<br/><br/>Valeur recommandée : 100<br/><br/>N'oubliez pas que lister le contenu des dossiers est <strong>exponentiellement proportionnel</strong> au nombre de fichiers et de dossiers qu'ils contiennent. C'est une limitation liée au fonctionnement des systèmes d'exploitation et de leurs pilotes de système de fichiers. Nous, Joomla! ou PHP ne pouvons rien y faire. Il vous est fortement conseillé d'exclure les dossiers vraiment volumineux et de prendre des mesures pour éviter d'avoir des dossiers contenant des milliers de fichiers et de dossiers directement. Si vous n'êtes pas sûr, imbriquez vos dossiers en profondeur."
COM_ADMINTOOLS_JCONFIG_FEBENABLE_LABEL="Activer la planification en frontal"
COM_ADMINTOOLS_JCONFIG_FEBENABLE_DESC="Lorsque cette option est activée, elle vous permet d'utiliser l'Analyseur de modifications des fichiers PHP sans vous connecter à l'administration."
COM_ADMINTOOLS_JCONFIG_SECRETWORD_LABEL="Mot secret"
COM_ADMINTOOLS_JCONFIG_SECRETWORD_DESC="Protège la fonctionnalité de planification en frontal contre les attaques DoS en vous demandant de transmettre ce mot secret dans l'URL de planification en frontal. Veuillez utiliser des mots de passe longs et complexes. Consultez la documentation pour plus d'informations."
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_LABEL="Fuseau horaire pour les e-mails"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DESC="Toutes les dates et heures dans les e-mails envoyés par Admin Tools pour vous avertir de problèmes de sécurité potentiels seront exprimées dans le fuseau horaire sélectionné. Par défaut : GMT"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DEFAULT="Fuseau horaire du serveur"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_LABEL="Langue de repli préférée pour les notifications par e-mail"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_DESC="La langue utilisée pour les e-mails de notification envoyés à une adresse qui n'appartient pas à un compte utilisateur Joomla, ainsi que pour les comptes utilisateur dont la préférence de langue est « Utiliser par défaut ».<br/><br/>Lorsqu'une notification est envoyée à une adresse qui appartient <em>bien</em> à un compte utilisateur Joomla, c'est la préférence de langue de ce compte qui est utilisée, sauf si vous activez également l'option ci-dessous.<br/><br/>Si aucune langue ne peut être déterminée, l'anglais (en-GB) est utilisé. Admin Tools n'envoie jamais une notification dans la langue dans laquelle votre site est affiché à ce moment-là.<br/><br/>Par défaut : Aucune, c'est-à-dire l'anglais (en-GB)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_NONE="Aucune (utiliser l'anglais)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_LABEL="Forcer cette langue pour tous les e-mails de notification"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_DESC="Lorsque cette option est activée, chaque e-mail de notification est envoyé dans la langue sélectionnée ci-dessus, même lorsqu'il est adressé à un compte utilisateur Joomla ayant une préférence de langue différente.<br/><br/>Activez-la si vous traitez automatiquement les e-mails de notification et qu'ils doivent toujours arriver dans une seule langue, prévisible.<br/><br/>Par défaut : Non"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_LABEL="Dossiers exclus"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_DESC="Dossiers à ignorer lors de l'analyse de votre site.<br/><br/>Les dossiers sont indiqués relativement à la racine de votre site. Saisissez un dossier par ligne.<br/><br/>Par défaut : aucun<br/><br/><em>Remarque</em> : Certains dossiers sont automatiquement exclus sans les ajouter ici : le répertoire de journaux et le répertoire temporaire de votre site, les répertoires de cache du frontal et de l'administration, ainsi que les dossiers nommés tmp, log ou logs dans le frontal ou l'administration de votre site. Enfin, les liens symboliques vers des dossiers situés en dehors de la racine de votre site ne sont pas suivis (leur contenu ne sera pas analysé)."
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_LABEL="Fichiers exclus"
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_DESC="Fichiers à ignorer lors de l'analyse de votre site.<br/><br/>Les fichiers sont indiqués relativement à la racine de votre site. Saisissez un chemin de fichier par ligne.<br/><br/>Par défaut : aucun<br/><br/>À utiliser uniquement pour exclure des fichiers qui ne sont pas réellement exécutables, par ex. des journaux avec une extension .php en dehors du dossier de journaux de Joomla. N'utilisez PAS cette option pour marquer des fichiers comme sûrs ; utilisez plutôt la fonctionnalité Marquer comme sûr dans la page de rapport d'analyse."
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_LABEL="Extensions à analyser"
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_DESC="Une liste d'extensions de fichiers à analyser, séparées par des virgules, sans le point initial.<br/><br/>Valeur par défaut : php, phps, phtml, php3, inc<br/><br/>Veuillez noter que l'Analyseur de modifications des fichiers PHP est uniquement conçu pour analyser de manière fiable et évaluer un score de menace des fichiers PHP. Nous vous déconseillons fortement d'ajouter des extensions de fichiers de code source de langages de programmation différents, tels que JavaScript et Perl, ou des fichiers binaires. Si vous ne tenez pas compte de cet avertissement, vous risquez d'obtenir de nombreux faux positifs ou, pire, des faux négatifs dans des fichiers qui ne contiennent pas de code source PHP."
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_LABEL="Analyser les fichiers avec des extensions doubles"
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_DESC="Analyse les fichiers où les extensions à analyser apparaissent avant d'autres extensions. Par exemple, si vous avez ajouté <code>php</code> aux « Extensions à analyser » et activé cette option ici, l'Analyseur de modifications des fichiers PHP analysera à la fois <code>example.php</code> et <code>example.php.png</code>."
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_LABEL="Correspondance d'extension insensible à la casse"
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_DESC="Rend la correspondance des extensions de fichiers insensible à la casse. Par exemple, si vous avez ajouté <code>php</code> aux « Extensions à analyser » et activé cette option ici, l'Analyseur de modifications des fichiers PHP analysera à la fois <code>example.php</code> et <code>example.PHP</code>"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_LABEL="Seuil de fichier volumineux"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_DESC="L'Analyseur de modifications des fichiers PHP suspendra délibérément le travail et le reprendra lors de la prochaine requête avant d'analyser des fichiers dont la taille dépasse ce nombre d'octets. Cela évite une expiration PHP accidentelle lors de l'analyse d'un fichier volumineux en fin de la Durée maximale de travail allouée.<br/><br/>Valeur recommandée : 524288"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_LABEL="Calculer les différences lors de l'analyse"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_DESC="Lorsque cette option est activée, Admin Tools calculera un diff (forme compacte des différences de fichiers) pour chaque fichier modifié détecté par la fonctionnalité d'Analyseur de fichiers PHP. AVERTISSEMENT : Cela consomme BEAUCOUP d'espace de base de données, environ 20 à 40 Mo pour un site typique !"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_LABEL="Ne pas signaler les fichiers avec un score de menace nul"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_DESC="Lorsque cette option est activée, tout fichier nouveau ou modifié avec un score de menace nul ne sera pas signalé.<br/><br/>Valeur recommandée : Non<br/><br/><strong>AVERTISSEMENT</strong> : Nous ne recommandons PAS d'activer cette option. Il est concevable que des fichiers modifiés de manière malveillante puissent avoir un score de menace nul parce que leur charge malveillante est écrite d'une manière qu'un analyseur automatisé ne peut pas distinguer d'un code légitime, même un peu désordonné. L'activation de cette option ne vous alertera pas de ces fichiers, mettant potentiellement votre site en danger. Cette option est disponible pour déboguer les problèmes de calcul du score de menace, et NON comme quelque chose que vous devriez activer sur des sites de production."
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_LABEL="Seuil de fichier surdimensionné"
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_DESC="Les fichiers dont la taille dépasse ce nombre d'octets ne verront pas leur score de menace évalué.<br/><br/>Valeur recommandée : 5242880<br/><br/>Une valeur trop faible ferait que les fichiers exécutables ne seraient pas analysés pour détecter du code malveillant, ce qui pourrait constituer un risque de sécurité. Définir cette valeur trop élevée entraînera probablement une expiration PHP lors de l'analyse d'un fichier très volumineux, généralement un fichier qui n'est même pas exécutable malgré l'extension .php (par ex. un fichier journal)."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_LABEL="Fichiers hors cœur dans les dossiers du cœur"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_DESC="Contrôle la façon dont l'analyseur traite les fichiers qui ne sont PAS des fichiers officiels du cœur de Joomla mais qui se trouvent dans un répertoire du cœur de Joomla (un répertoire appartenant à une extension, une bibliothèque ou un template du cœur, ou l'un de administrator/help, administrator/includes, includes). <strong>Ignorer</strong> : ne pas détecter ces fichiers. <strong>Signaler</strong> : afficher un badge \"hors cœur\" dans les résultats de l'analyse. <strong>Signaler et rapporter comme menace</strong> : afficher le badge et ajouter 1000 au score de menace afin que le fichier apparaisse en tête des résultats. Les fichiers situés dans les répertoires d'extensions tierces sont considérés comme hors périmètre et ne sont jamais signalés."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_IGNORE="Ignorer"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_FLAG="Signaler"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_THREAT="Signaler et rapporter comme menace"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_LABEL="URL du service CoreSums"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_DESC="URL de base du service de sommes de contrôle CoreSums utilisé par l'analyseur de modifications des fichiers PHP pour identifier et vérifier les fichiers du cœur de Joomla. La valeur par défaut est <code>https://getpanopticon.com/checksums</code>. Admin Tools se contente de TÉLÉCHARGER depuis ce service un fichier public de sommes de contrôle correspondant à votre version de Joomla ; il n'envoie jamais la moindre information sur votre site ou ses utilisateurs. Si vous préférez héberger vous-même les sommes de contrôle, vous pouvez faire tourner votre propre service — voir <code>https://github.com/akeeba/coresums</code> — et faire pointer cette option vers lui."
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_LABEL="Délai d'expiration du téléchargement CoreSums (secondes)"
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_DESC="Nombre maximal de secondes à attendre lors du téléchargement du fichier de sommes de contrôle CoreSums avant d'abandonner. Valeur par défaut : 5. Si le téléchargement échoue, l'analyse s'exécute quand même, mais aucun fichier n'est marqué comme appartenant ou non au cœur et un avertissement que vous pouvez masquer est affiché jusqu'à votre prochaine analyse réussie."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_DESC="Les résultats de l'analyse seront automatiquement envoyés à cette adresse e-mail. Si vous la laissez vide, aucun e-mail ne sera envoyé."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_LABEL="Envoyer les résultats à cette adresse e-mail"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_LABEL="Envoyer un e-mail uniquement pour les éléments nécessitant une action"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_DESC="Lorsque cette option est activée (par défaut), l'Analyseur de modifications des fichiers PHP vous enverra un e-mail avec le résumé des résultats de l'analyse <em>uniquement</em> lorsque des éléments nécessitant une action (fichiers ajoutés, modifiés ou présentant une menace possible) sont détectés."

;; Email sending
COM_ADMINTOOLS_JCONFIG_EMAIL_LABEL="Envoi d'e-mails"
COM_ADMINTOOLS_JCONFIG_EMAIL_DESC="Options qui contrôlent la manière dont Admin Tools envoie des e-mails pour les requêtes bloquées. Ces options s'appliquent uniquement à l'édition Professionnelle."
COM_ADMINTOOLS_JCONFIG_THROTTLE_LABEL="Limitation des e-mails pour les requêtes bloquées"
COM_ADMINTOOLS_JCONFIG_THROTTLE_DESC="Lorsque cette option est activée, Admin Tools n'enverra qu'un certain nombre d'e-mails sur une période de temps spécifique. Cela protège votre messagerie contre les inondations lorsque votre site est sous attaque. Vous devez avoir la journalisation des requêtes bloquées activée pour <em>toutes les raisons de blocage</em> pour lesquelles vous envoyez des e-mails. De plus, le nombre maximum d'entrées de journal que vous conservez — selon la configuration du plugin système — doit être <em>égal ou supérieur</em> au nombre maximum d'e-mails configuré ci-dessous. Dans tout autre cas, vos e-mails d'exception de sécurité NE seront PAS limités."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_LABEL="Nombre maximum de requêtes bloquées pour lesquelles envoyer des e-mails"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_DESC="Le nombre maximum de requêtes bloquées pour lesquelles des e-mails peuvent être envoyés dans la période de temps définie ci-dessous. Gardez à l'esprit que lors d'une attaque soutenue, plus d'e-mails que ce nombre peuvent être envoyés selon la lenteur de réponse de vos serveurs web, de base de données et de messagerie lorsque votre site est sous une charge très élevée. De plus, gardez à l'esprit que cela n'affecte que les requêtes bloquées enregistrées dans la base de données et dont la raison de blocage n'est PAS dans les raisons configurées pour lesquelles ne jamais envoyer d'e-mails."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_LABEL="Période de limitation des e-mails"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_DESC="La limitation des e-mails fonctionne en vérifiant combien de requêtes bloquées ont été enregistrées pendant ce nombre de secondes, minutes, heures ou jours. Vous sélectionnez l'unité de mesure du temps ci-dessous."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_LABEL="Unité de mesure du temps"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DESC="La période ci-dessus est exprimée dans l'unité de mesure du temps sélectionnée ici. Veuillez noter qu'aux fins de ces calculs, une minute correspond à 60 secondes, 1 heure à 3 600 secondes, 1 jour à 86 400 secondes. Cela peut différer des minutes, heures et jours réels lors des années avec des secondes intercalaires et lors des transitions entre l'heure d'été et l'heure standard (ou vice versa). La gestion du temps est un sujet assez complexe."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_SECONDS="Secondes"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_MINUTES="Minutes"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_HOURS="Heures"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DAYS="Jours"

COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_DESC="Durée, en minutes, pendant laquelle une liste d'adresses IP de robots d'exploration téléchargée est utilisée avant d'être téléchargée à nouveau. C'est aussi le délai qu'Admin Tools attend avant de réessayer après un échec de téléchargement. Le minimum est de 15 minutes."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_LABEL="Durée de vie du cache des listes de robots (minutes)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DESC="Options des listes d'adresses IP de robots d'exploration, que vous activez dans Configurer le WAF, onglet Robots d'exploration."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_DESC="Si une liste d'adresses IP de robots d'exploration ne peut pas être actualisée, Admin Tools continue d'utiliser la dernière liste téléchargée pendant ce nombre de jours, à compter du moment où la liste aurait normalement expiré. Passé ce délai, la liste n'est plus utilisée. Mettez 0 pour cesser d'utiliser une liste dès qu'elle expire."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_LABEL="Abandonner les listes de robots périmées après (jours)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_LABEL="Robots d'exploration"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_DESC="Durée maximale, en millisecondes, pendant laquelle Admin Tools attend le téléchargement d'une liste d'adresses IP : les listes de robots d'exploration, ainsi que les listes de CloudFlare, Sucuri et BunnyCDN utilisées par les générateurs de configuration du serveur. Les listes publiées sous forme de pages web et non de fichiers de données (celles d'Amazon et de Sucuri) disposent du triple de cette limite (60 secondes au maximum). Cette limite n'est respectée avec exactitude que si votre serveur utilise l'extension cURL de PHP. Avec les autres méthodes de connexion, et pour la résolution DNS sur certaines versions de cURL, elle n'est qu'approximative : elle est arrondie à la seconde supérieure, et un serveur très lent peut dépasser cette durée."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_LABEL="Délai de téléchargement des listes de robots et de CDN (millisecondes)"

;; Backend options
COM_ADMINTOOLS_JCONFIG_BACKEND_LABEL="Administration"
COM_ADMINTOOLS_JCONFIG_BACKEND_DESC="Options qui définissent le fonctionnement de l'administration du composant"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_LABEL="Afficher les graphiques et les statistiques"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_DESC="Afficher les graphiques et les statistiques sur les requêtes bloquées (édition Professionnelle uniquement)"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_LABEL="Réordonner automatiquement le plugin"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_DESC="Le plugin Système - Admin Tools doit être ordonné comme le premier plugin publié pour fonctionner correctement. Lorsque vous visitez Admin Tools dans l'administration, le plugin est automatiquement réordonné pour être le premier. Dans de rares cas, d'autres plugins doivent être publiés en premier, par exemple des gestionnaires de messagerie alternatifs tels que CMandrill. Dans ce cas, définissez cette option sur Non. DANGER MAJEUR ! IL VOUS APPARTIENDRA ENTIÈREMENT DE RÉORDONNER LE PLUGIN. SI UN PLUGIN VULNÉRABLE EST PUBLIÉ AVANT LE PLUGIN SYSTÈME - ADMIN TOOLS, VOTRE SITE PEUT ÊTRE PIRATÉ. ADMIN TOOLS SERA INCAPABLE DE VOUS PROTÉGER DANS CE CAS CAR IL NE S'EXÉCUTERA PAS AVANT LE CODE VULNÉRABLE ET NE POURRA DONC PAS DÉTECTER L'ATTAQUE. NE DÉFINISSEZ PAS CETTE OPTION SUR « NON » SAUF SI VOUS ÊTES UN EXPERT ET COMPRENEZ LES IMPLICATIONS."
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_LABEL="Avertir en cas de modifications manuelles des fichiers de configuration du serveur"
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_DESC="Admin Tools vérifiera si vous avez modifié manuellement un fichier de configuration du serveur (c'est-à-dire .htaccess, nginx.conf ou web.config) au lieu d'utiliser le Générateur de fichier .htaccess, NginX ou WebConfig"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_LABEL="Me rappeler lorsque le fichier journal de débogage est activé"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_DESC="Affiche un rappel sur chaque page de l'espace d'administration de votre site tant que l'option « Conserver un fichier journal de débogage » de Configurer le WAF est activée. Le fichier journal de débogage est uniquement destiné au dépannage. Il enregistre en détail chaque requête bloquée, y compris les données de formulaire soumises, dans un fichier non chiffré."
COM_ADMINTOOLS_JCONFIG_USAGESTATS_LABEL="Activer le rapport anonyme des versions de PHP, MySQL et Joomla!"
COM_ADMINTOOLS_JCONFIG_USAGESTATS_DESC="Aidez-nous à améliorer nos logiciels en signalant anonymement et automatiquement vos versions de PHP, MySQL et Joomla!. Ces informations nous aideront à décider quelles versions de Joomla!, PHP et MySQL prendre en charge dans les futures versions. Remarque : nous ne collectons PAS le nom de votre site, votre adresse IP ou toute autre information d'identification directement ou indirectement unique."
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_LABEL="Chemin PHP-CLI précis"
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_DESCRIPTION="Activez cette option pour qu'Admin Tools tente de détecter le chemin PHP-CLI précis sur votre serveur. Désactivez-la si votre serveur ne vous permet pas de le faire, ce qui bloquerait votre adresse IP hors de votre site pendant plusieurs minutes à heures lorsque cela se produit (par exemple IONOS)."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_LABEL="Contourner les modèles de messagerie défectueux dans Joomla! 5.2 et versions ultérieures."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 a introduit la fonctionnalité de mise en page des modèles de messagerie et l'active par défaut. Cependant, cette fonctionnalité <em>casse</em> les liens dans les e-mails si leur URL provient d'une variable, comme <code>{URL}</code>, en ajoutant l'URL du site devant l'URL, la rendant ainsi invalide. Cela affecte même les composants natifs de Joomla. Bien que nous ne puissions pas corriger Joomla lui-même, nous pouvons fournir une solution de contournement pour les e-mails envoyés par notre logiciel. Si, pour une raison quelconque, vous ne souhaitez pas cette solution de contournement, vous pouvez la désactiver en définissant cette option sur Non."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_LABEL="Serveur web"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_DESCRIPTION="Quel serveur web utilisez-vous pour votre site ? L'utilisation de « Détection automatique » est recommandée pour la plupart des sites. Sélectionnez votre type de serveur web si et seulement si votre hébergeur a délibérément rendu la variable d'environnement <code>SERVER_SOFTWARE</code> inaccessible à PHP, ou l'a intentionnellement définie sur une valeur vide ou trompeuse."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_AUTO="Détection automatique"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_APACHE="Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_LITESPEED="LiteSpeed"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_NGINX="NginX"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_IIS="IIS"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_LABEL="Version du serveur web Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_DESCRIPTION="Si vous utilisez le serveur web Apache, sélectionnez la version d'Apache utilisée. L'utilisation de « Détection automatique » est recommandée pour la plupart des sites. Sélectionnez la version si et seulement si votre hébergeur a délibérément rendu la variable d'environnement <code>SERVER_SOFTWARE</code> inaccessible à PHP, ou l'a intentionnellement définie sur une valeur vide ou trompeuse."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_AUTO="Détection automatique"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_1_3="1.3"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_0="2.0"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_2="2.2"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_4="2.4"
;; Permissions
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_DESC="Autoriser l'accès aux fonctionnalités utilitaires"
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_TITLE="Utilitaire"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_TITLE="Sécurité"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_DESC="Autoriser l'accès aux fonctionnalités de sécurité. Cela inclut l'assistant Super utilisateurs temporaires ; traitez-le donc comme équivalent à l'octroi de l'accès Super utilisateur."
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_TITLE="Maintenance"
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_DESC="Autoriser l'accès aux fonctionnalités de maintenance de la base de données et des permissions"

