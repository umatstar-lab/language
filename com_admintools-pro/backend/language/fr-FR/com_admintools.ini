COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON_INFO="Il s’agit de la méthode recommandée pour tous les serveurs prenant en charge les tâches CRON en ligne de commande. Cette méthode contourne l’interface web de Joomla!, permettant ainsi d’atteindre une vitesse d’analyse maximale du site."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICIMPROTANTINFO="Important"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICINFO="N’oubliez pas de remplacer <em>%s</em> par le chemin réel vers l’exécutable PHP <strong>CLI (interface en ligne de commande)</strong> de votre hébergeur. Gardez à l’esprit que vous devez utiliser l’exécutable PHP CLI ; l’exécutable PHP CGI (Common Gateway Interface) ne <em>fonctionnera pas</em> avec nos scripts CRON. En cas de doute sur la signification de cela, veuillez consulter votre hébergeur. Il est le seul à pouvoir fournir cette information."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP="Fonctionnalité de planification frontend"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_INFO="Cette méthode utilise une URL publique et une clé secrète pour déclencher une analyse de votre site. L’analyse progresse par le biais de redirections HTTP. Veuillez noter que la plupart des tâches « CRON » basées sur des URL proposées par les hébergeurs, ainsi que la plupart des services CRON tiers basés sur des URL, ne prennent pas en charge les redirections HTTP. Si les exemples avec wget et curl ci-dessous ne fonctionnent pas pour vous, veuillez utiliser l’URL de planification frontend avec le service tiers très économique webcron.org."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_MANYMETHODS="La fonctionnalité de planification frontend peut être utilisée avec une grande variété de méthodes. Cliquez sur les onglets ci-dessous pour voir la description de chaque méthode. N’oubliez pas que toutes sont expliquées en détail dans notre documentation."
