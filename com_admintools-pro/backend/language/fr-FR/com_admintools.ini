COM_ADMINTOOLS_BADWORDS_LBL_WORD="Mot"
COM_ADMINTOOLS_BADWORDS_LBL_WORD_DESC="Le mot interdit que vous souhaitez bloquer. Il est insensible à la casse, c'est-à-dire que <code>test</code>, <code>TEST</code> et <code>TesT</code> sont considérés comme le même mot."
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE="Échapper l'expression régulière"
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE_DESC="Le champ Mot est une expression régulière, interpolée dans <code>#\b&lt;CE QUE VOUS AVEZ SAISI&gt;\b#iu</code>. Tout ce qu'il contient en dehors des lettres, des chiffres, des tirets et des tirets bas a une signification particulière — <code>.</code> correspond à n'importe quel caractère, <code>*</code> répète le caractère précédent, <code>#</code> termine l'expression, et ainsi de suite. Lorsque cette option est réglée sur Oui, Admin Tools échappe ces caractères pour vous au moment de l'enregistrement, afin que le mot corresponde littéralement à lui-même. Laissez-la réglée sur Oui, sauf si vous savez écrire des expressions régulières et que vous souhaitez délibérément en utiliser une. Veuillez consulter la documentation avant de la désactiver.<br><br><strong>Lorsque vous modifiez un enregistrement existant, n'activez PAS cette option si le mot avait déjà été échappé au moment de son ajout.</strong> Échapper une expression déjà échappée la casse, et elle ne correspondra alors plus à rien du tout. C'est pourquoi l'option vaut Oui par défaut pour les nouveaux enregistrements et Non lorsque vous en modifiez un existant."

