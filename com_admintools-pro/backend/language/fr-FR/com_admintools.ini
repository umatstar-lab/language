COM_ADMINTOOLS_CONFIGUREWAF_LBL_HTACCESSTIP="Pour une protection supplémentaire de votre site, utilisez également la fonctionnalité Générateur de fichier .htaccess de ce composant."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTP="http://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTPS="https://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_DESC="Lien vers un service de recherche d'adresse IP. {ip} sera remplacé par l'adresse IP. Par défaut : whatismyipaddress.com/ip/{ip}"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_LABEL="Service de recherche d'adresse IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS="Ne jamais bloquer ces adresses IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS_TIP="Saisissez les adresses IP qui ne doivent jamais être bloquées automatiquement, quels que soient vos paramètres de bannissement automatique. Vous pouvez utiliser des adresses IPv4 et IPv6 individuelles (par ex. <em>127.0.0.1</em> et <em>::1</em>), des plages IPv4 (par ex. <em>127.0.0.1-127.0.0.10</em>), la notation de plage IPv4 implicite (<em>127.0.0.</em> pour tout le bloc 127.0.0.1 à 127.0.0.255) et la notation de bloc CIDR IPv4/IPv6 (par ex. <em>127.0.0.0/8</em> pour IPv4 ou <em>2001:db8::/32</em> pour IPv6)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_ACTIVEFILTERING="Filtrage des requêtes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASIC="Sécurité de base"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASICSETTINGS="Fonctionnalités de base"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_EXCEPTIONS="Exceptions"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_CRAWLERS="Robots d'exploration"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_DESC="Admin Tools télécharge les listes d'adresses IP que les moteurs de recherche et les entreprises d'IA publient pour leurs robots d'exploration, et s'en sert pour les robots que vous choisissez ci-dessous. Avec Bloquer, toutes les requêtes du robot sont bloquées. Avec Ne pas bloquer, le robot est traité comme avec « Ne jamais bloquer ces adresses IP » : une requête malveillante de sa part est quand même bloquée, mais elle n'est pas journalisée, aucun e-mail n'est envoyé à son sujet et l'adresse IP n'est jamais bannie automatiquement. Seuls les robots réglés sur Bloquer ou Ne pas bloquer sont téléchargés. Si les listes ne peuvent pas être téléchargées ou si le cache du site ne fonctionne pas, Admin Tools désactive lui-même cette option et en informe les super utilisateurs par e-mail."
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_LABEL="Utiliser les listes d'adresses IP de robots d'exploration"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_ALLOW="Ne pas bloquer"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_BLOCK="Bloquer"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_IGNORE="Ignorer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_FINGERPRINTING="Camouflage"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_JHARDENING="Options de durcissement"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_LOGGINGANDREPORTING="Journalisation et rapports"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD="Bouclier 404"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE="Activer le bouclier 404"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE_TIP="Cliquez pour activer ou désactiver la fonctionnalité Bouclier 404"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_TIP="Cette fonctionnalité traite les erreurs 404 Introuvable comme un motif de blocage d'une requête lorsqu'elles se produisent sur des URL connues pour être utilisées par des pirates pour analyser votre site à la recherche de vulnérabilités. Par exemple, lorsqu'un pirate tente d'accéder à la page de connexion WordPress alors que vous avez un site Joomla!."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW="Paramètre URL secret de l'administrateur"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP="Par exemple, si vous saisissez 'test', vous ne pourrez accéder à votre zone administrateur qu'en tapant l'URL <code>http://www.example.com/administrator/index.php?test</code>. <strong>ATTENTION ! IL DOIT COMMENCER PAR UNE LETTRE, PAS UN CHIFFRE</strong>. Pour une meilleure compatibilité entre les serveurs, n'utilisez que des caractères ASCII minuscules et des chiffres (a-z, 0-9)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP_LONG="Le paramètre URL secret de l'administrateur ne peut contenir que des lettres latines minuscules et majuscules sans accents ni diacritiques (a-z et A-Z), des chiffres 0-9, des tirets et des underscores. Le premier caractère ne peut pas être un tiret ou un underscore. Il doit comporter entre 4 et 64 caractères."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_INVALID="Le paramètre URL secret de l'administrateur est invalide. N'oubliez pas qu'il ne peut contenir que des lettres latines minuscules et majuscules sans accents ni diacritiques (a-z et A-Z), des chiffres 0-9, des tirets et des underscores. Le premier caractère ne peut pas être un tiret ou un underscore. Il doit comporter entre 4 et 64 caractères."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION="Action en cas de paramètre URL secret de l'administrateur invalide"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_TIP="Action à effectuer lorsque le paramètre URL secret de l'administrateur est absent ou invalide. Rediriger : redirige le navigateur vers la racine du site (par défaut). Bloquer : bloque la requête avec le message de requête bloquée d'Admin Tools et un statut HTTP 403. Notez que cela n'aide pas autant qu'on pourrait le croire à réduire la charge serveur lors d'attaques par force brute prolongées, car les robots de force brute par mot de passe ne suivent généralement pas les redirections de toute façon ; utilisez la fonctionnalité de mot de passe administrateur pour mieux gérer la charge serveur élevée dans ce cas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_REDIRECT="Rediriger"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_BLOCK="Bloquer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE="Cookie de navigateur de substitution pour le paramètre URL secret de l'administrateur"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_TIP="Faut-il définir un cookie de navigateur lors d'une connexion administrateur réussie, permettant au navigateur d'accéder à la page de connexion administrateur à tout moment dans les 30 prochains jours sans fournir le paramètre URL secret de l'administrateur ? Le cookie est invalidé si vous utilisez la fonctionnalité Déconnexion de Joomla! ou modifiez le mot de passe de l'utilisateur. Veuillez lire la documentation pour plus d'informations. En cas de doute, réglez sur « Activé, notifier lors de l'utilisation »."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_OFF="Désactivé"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON="Activé"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_WARN="Activé, notifier lors de l'utilisation"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_MAXWARN="Activé, rappeler d'utiliser l'URL complète"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE="Autoriser les modèles du site"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE_TIP="L'activation de cette option remplace partiellement l'option précédente (le blocage de template=foo dans l'URL). Si le paramètre de requête URL template= spécifie le nom d'un modèle existant dans votre répertoire de modèles, il sera autorisé sans entraîner le blocage de la requête. Cela n'est nécessaire que sur les sites qui utilisent plusieurs modèles simultanément."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM="Filtrage anti-spam basé sur la liste de mots interdits"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM_TIP="Lorsque cette option est activée, toutes les requêtes contenant au moins un mot de la liste de mots interdits seront bloquées."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY="Clé HTTP:BL de <a href='http://www.projecthoneypot.org/httpbl_configure.php' target='_blank'>Project Honeypot</a>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY_TIP="Saisissez votre clé HTTP:BL. Vous pouvez vous inscrire à Project Honeypot et obtenir votre clé sur <a href='http://www.projecthoneypot.org/httpbl_configure.php'>http://www.projecthoneypot.org/httpbl_configure.php</a>."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS="Domaines d'adresse e-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS_TIP="Saisissez un domaine par ligne, sans protocole, par ex. <code>example.com</code> mais PAS <s><code>https://www.example.com</code></s>. Admin Tools autorisera ou bloquera l'inscription selon le champ ci-dessus. Laissez vide pour désactiver toute restriction lors de l'inscription des utilisateurs."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES="Bloquer les noms d'utilisateur courants"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_TIP="Lorsque cette option est activée, Admin Tools bloquera la création de nouveaux comptes utilisateur dont le nom d'utilisateur figure dans la liste de blocage par défaut (par ex. admin, ceo, manager, etc.)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW="Noms d'utilisateur explicitement autorisés"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW_TIP="Liste des noms d'utilisateur explicitement autorisés, un par ligne."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID="Noms d'utilisateur explicitement interdits"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID_TIP="Liste des noms d'utilisateur explicitement interdits, un par ligne."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN="Blocage immédiat de l'adresse IP lors d'une tentative de connexion échouée avec un nom d'utilisateur interdit"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN_TIP="Si quelqu'un tente de se connecter à votre site en utilisant l'un des noms d'utilisateur courants intégrés dans Admin Tools ou l'un des noms d'utilisateur explicitement interdits décrits ci-dessous, mais qu'il n'existe aucun utilisateur avec un tel nom d'utilisateur sur votre site, la requête est bloquée. De plus, si le blocage des adresses IP des récidivistes est activé dans l'onglet Bannissement automatique, l'adresse IP de l'attaquant est immédiatement bloquée, même si elle n'a pas atteint le nombre d'attaques spécifié dans l'option Bloquer l'IP après ce nombre de requêtes bloquées. Le raisonnement est que tenter de se connecter au site avec un nom d'utilisateur interdit ou courant est très probablement une attaque par bourrage d'identifiants qui doit être contrée aussi rapidement que possible."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION="Action pour la surveillance de la configuration"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_BLOCK="Bloquer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_EMAIL="E-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_TIP="Que souhaitez-vous faire lorsque la surveillance de la configuration globale ou du composant est activée et qu'un changement est détecté dans la configuration ? « E-mail » enverra simplement un e-mail d'avertissement aux adresses e-mail que vous avez configurées ci-dessous. Les modifications de configuration seront appliquées. « Bloquer » traitera ces modifications comme un motif de blocage de la requête. Les modifications de configuration NE seront PAS appliquées et aucun e-mail ne sera envoyé."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS="Surveiller la configuration des composants"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS_TIP="Lorsque cette option est activée et que quelqu'un tente de modifier la configuration d'un composant Joomla! natif ou tiers (ce que vous voyez lorsque vous cliquez sur Options dans la barre d'outils d'un composant) depuis l'interface d'administration de votre site, vous serez soit notifié, soit la tentative sera bloquée (selon vos paramètres ci-dessous)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL="Surveiller la configuration globale"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL_TIP="Lorsque cette option est activée et que quelqu'un tente de modifier la configuration globale de Joomla!, que ce soit depuis l'interface d'administration ou l'interface publique, vous serez soit notifié, soit la tentative sera bloquée (selon vos paramètres ci-dessous)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL="Envoyer un e-mail à cette adresse lors d'une modification de configuration surveillée"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL_TIP="Les adresses e-mail, séparées par des virgules, auxquelles vous souhaitez recevoir une notification en cas de modification de la configuration globale et/ou des composants surveillés. Si ce champ est laissé vide, l'adresse e-mail définie dans l'option « Envoyer un e-mail à cette adresse après un bannissement automatique d'adresse IP » sera utilisée. Si les deux champs sont vides, un e-mail sera envoyé à tous les comptes Super utilisateur activés ayant l'option Recevoir les e-mails système activée dans leur profil."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN="Avertir en cas de Self XSS"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN_TIP="Affiche un message dans la console du navigateur pour avertir l'utilisateur d'éviter d'y exécuter des commandes. Cela peut conduire à se pirater soi-même (attaques dites Self XSS) et permettre le vol des données du compte."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES="Surveiller les fichiers critiques"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL="Surveiller les modifications de ces fichiers"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL_TIP="Surveiller les fichiers suivants (un par entrée) pour détecter toute modification. En cas de changement détecté, vous serez notifié par e-mail. Les chemins de fichiers sont relatifs à la racine de votre site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_TIP="Les fichiers critiques couramment modifiés par les pirates (index.php, administrator/index.php et les fichiers index.php, error.php et component.php de tous les modèles installés sur le site) seront surveillés à chaque chargement de page. En cas de modification détectée, vous serez notifié par e-mail. Cela vous permet généralement de recevoir un avertissement anticipé en cas de tentative de piratage réussie."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL="Envoyer un e-mail à cette adresse lors d'une modification des fichiers surveillés"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL_TIP="Les adresses e-mail, séparées par des virgules, auxquelles vous souhaitez recevoir une notification lorsqu'une modification des fichiers critiques et/ou personnalisés surveillés est détectée. Si ce champ est laissé vide, l'adresse e-mail définie dans l'option « Envoyer un e-mail à cette adresse après un bannissement automatique d'adresse IP » sera utilisée. Si les deux champs sont vides, un e-mail sera envoyé à tous les comptes Super utilisateur activés ayant l'option Recevoir les e-mails système activée dans leur profil."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR="Personnaliser la balise meta generator"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR_TIP="Toutes les installations Joomla! définissent la balise meta generator, un fragment HTML dans l'en-tête de toutes les pages, pour indiquer que votre site fonctionne sous Joomla!. Cette information est mise en cache par les moteurs de recherche et est exploitée par les attaquants pour déduire que votre site utilise Joomla! lorsqu'ils recherchent des cibles potentielles. L'activation de cette option vous permet de définir une valeur personnalisée pour la balise generator dans l'option suivante. Faites preuve d'imagination !"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USEROPTS="Durcissement de la gestion des utilisateurs"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR="Surveillance"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS="Désactiver les utilisateurs en cas d'échec de connexion"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS_TIP="Admin Tools peut éventuellement désactiver des comptes utilisateurs existants lorsque plusieurs tentatives de connexion échouent avec leur nom d'utilisateur, protégeant ainsi les comptes contre les attaques par force brute. Vous pouvez ici spécifier le nombre d'échecs de connexion et la période durant laquelle ils doivent survenir avant que l'utilisateur soit désactivé, par exemple 3 échecs de connexion en 1 minute. Définir le nombre d'échecs à 0 désactive cette fonctionnalité."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD="Bouclier d'inclusion directe de fichiers (DFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD_TIP="Lorsque cette option est activée, Admin Tools vérifie les paramètres GET et POST de chaque requête adressée au frontend de votre site. La requête est bloquée si un paramètre contient un octet nul, ou si sa valeur ressemble à un chemin de fichier, parce qu'elle commence par une barre oblique, par ../ ou par une lettre de lecteur telle que C:, et désigne un fichier ou un dossier qui existe sur votre serveur, quel que soit son type. Une valeur composée uniquement de barres obliques, par ex. return=/, n'est pas bloquée."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET="Désactiver la réinitialisation du mot de passe pour des groupes d'utilisateurs spécifiques"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_TIP="Bloque les utilisateurs appartenant à l'un des groupes d'utilisateurs sélectionnés de demander une réinitialisation de mot de passe via la fonctionnalité « Mot de passe oublié ? » sur l'interface publique du site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS="Groupes d'utilisateurs bloqués pour la réinitialisation du mot de passe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS_TIP="Les utilisateurs appartenant à ces groupes ne seront pas autorisés à demander une réinitialisation de mot de passe. Il n'est pas nécessaire d'ajouter les groupes disposant des permissions Super utilisateur ; ceux-ci sont automatiquement bloqués par Joomla! lui-même."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_HEAD="Verrouillage des utilisateurs oubliés"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS="Empêcher les utilisateurs d'administration oubliés de se connecter"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION="Méthode de prévention de connexion"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_BLOCK="Bloquer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_RESET="Forcer la réinitialisation du mot de passe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_TIP="Choisissez comment Admin Tools appliquera la prévention de connexion pour les utilisateurs oubliés. « Bloquer » bloquera l'utilisateur de façon permanente ; un Super utilisateur devra le débloquer manuellement. « Forcer la réinitialisation du mot de passe » (recommandé) obligera l'utilisateur à réinitialiser son mot de passe à sa prochaine connexion et ne lui permettra pas d'effectuer d'autre action sur le site tant que la réinitialisation n'est pas effectuée."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ="Vérifier toutes les [minutes]"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ_TIP="Exécuter cette vérification au maximum toutes ces minutes."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS="Groupes d'utilisateurs d'administration"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS_TIP="À quels groupes d'utilisateurs ayant accès à l'administration cette fonctionnalité s'applique-t-elle ? Ne sélectionnez aucun groupe pour l'appliquer à tous les groupes d'utilisateurs disposant d'un accès de connexion à l'administration de votre site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS="Nombre maximum de jours depuis la dernière connexion"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS_TIP="Les utilisateurs appartenant aux groupes spécifiés ci-dessus et qui ne se sont pas connectés depuis au moins ce nombre de jours seront empêchés de se connecter."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED="Utilisateurs protégés"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED_TIP="Ces utilisateurs ne seront jamais bloqués. Il est recommandé de n'y placer qu'un nombre <strong>très</strong> limité de comptes utilisateurs. En règle générale, il devrait s'agir uniquement des comptes du propriétaire du site et du développeur, et de personne d'autre (surtout <strong>PAS</strong> d'autres membres du personnel qui pourraient partir en laissant leur compte derrière eux, ce qui est précisément l'objet de cette protection)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_TIP="Empêche les utilisateurs ayant accès à l'administration et ne s'étant pas connectés depuis très longtemps de se connecter au site. Il s'agit très probablement d'utilisateurs obsolètes que vous avez oublié de supprimer et dont le mot de passe a pu être compromis entre-temps."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN="Envoyer un e-mail à cette adresse en cas d'échec de connexion administrateur"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN_TIP="Saisissez une adresse e-mail pour être notifié en cas d'échec de connexion de quelqu'un dans l'interface d'administration de votre site. Laissez vide pour ne pas recevoir de notification. Assurez-vous d'abord que votre site peut envoyer des e-mails !"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN="Envoyer un e-mail à cette adresse lors d'une connexion réussie à l'administration"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN_TIP="Saisissez une adresse e-mail pour être notifié lors d'une connexion réussie de quelqu'un dans l'interface d'administration de votre site. Laissez vide pour ne pas recevoir de notification. Assurez-vous d'abord que votre site peut envoyer des e-mails !"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES="Envoyer un e-mail à cette adresse lors d'une requête bloquée"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES_TIP="Saisissez une adresse e-mail pour être notifié de toute requête bloquée sur votre site. Laissez vide pour ne pas recevoir de notification. Assurez-vous d'abord que votre site peut envoyer des e-mails !"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS="Envoyer les exceptions PHP à cette adresse"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS_TIP="Chaque fois qu'une exception PHP non gérée est levée (c'est-à-dire une erreur lors d'une requête de base de données), Admin Tools envoie un e-mail contenant tous les détails (heure, fichier et ligne à l'origine de l'exception) pour faciliter le débogage ultérieur."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE="Activer la limitation des e-mails de requêtes bloquées"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE_TIP="Lorsqu'elle est activée, la fréquence des e-mails envoyés par Admin Tools peut être limitée. Consultez les modèles d'e-mail pour les paramètres de fréquence maximale d'envoi."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION="Filtrer les inscriptions par adresse e-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_ALLOW="Autoriser"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_BLOCK="Bloquer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_TIP="Choisissez si Admin Tools doit uniquement autoriser ou bloquer les domaines d'adresses e-mail de la liste ci-dessous"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS="Bloquer également les adresses IP suspectes, pas seulement les spammeurs confirmés"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS_TIP="Parfois, Project Honeypot n'est pas certain qu'une adresse IP appartient à un spammeur ou s'il s'agit d'un simple utilisateur ayant cliqué sur un mauvais lien. Dans ce cas, l'adresse IP est marquée comme « suspecte ». Le comportement par défaut est de ne pas bloquer ces adresses IP. Cependant, si vous recevez beaucoup de spam, il est conseillé d'activer cette fonctionnalité et de bloquer même les adresses IP « suspectes ». Certains utilisateurs légitimes pourraient être bloqués par inadvertance ; utilisez donc cette option avec précaution !"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE="Activer le filtrage HTTP:BL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE_TIP="Active l'intégration avec <a href='http://www.projecthoneypot.org'>Project Honeypot</a>. <strong>IMPORTANT</strong> : Vous devez vous inscrire à Project Honeypot, obtenir une clé et la saisir dans l'option suivante pour que cette fonctionnalité fonctionne."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE="Âge maximum accepté des résultats HTTP:BL (jours)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE_TIP="Project Honeypot indique à quelle date cette adresse IP a été détectée pour la dernière fois en train d'envoyer des messages spam. Plus cette date est ancienne (plus l'âge est élevé), moins il est probable que cette adresse IP soit encore utilisée par un spammeur. Vous pouvez choisir ici quel sera l'âge maximum signalé pour qu'une adresse soit bloquée. La valeur par défaut de 30 signifie que les adresses IP ayant soumis un message spam au cours des 30 derniers jours seront bloquées."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD="Niveau de menace minimum pour le blocage"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD_TIP="Project Honeypot utilise un « niveau de menace » logarithmique pour évaluer la probabilité qu'une adresse IP spécifique soit un spammeur. Cette option définit le niveau de menace minimum qu'une adresse IP doit atteindre avant d'être bloquée. Une valeur de 25 signifie que cette adresse IP a soumis 100 messages spam sur les honeypots de Project Honeypot et constitue généralement une indication fiable qu'elle appartient à un spammeur. Notez que le niveau est logarithmique. Une valeur de 50 correspond à 1 000 messages spam et une valeur de 75 à un million de messages spam. Ne définissez pas de valeur supérieure à 50, car vous ne bloquerez très probablement aucun spammeur. La valeur par défaut est 25 (100 messages spam détectés depuis cette adresse IP)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL="Refuser l'accès au site aux adresses IP de la liste des adresses IP non autorisées"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL_TIP="Lorsqu'elle est activée, si l'adresse IP du visiteur figure dans la liste des adresses IP non autorisées (voir la fonctionnalité Liste des adresses IP non autorisées), il recevra immédiatement une erreur 403 Interdit lors de toute tentative d'accès à votre site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL="Autoriser l'accès à l'administration uniquement aux adresses IP de la liste blanche exclusive"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL_TIP="Lorsqu'elle est activée, seules les adresses IP figurant dans la liste blanche exclusive (voir la fonctionnalité Liste blanche d'adresses IP des administrateurs) seront autorisées à accéder à l'interface d'administration du site. Toutes les autres tentatives d'accès aux pages d'administration seront redirigées vers la page d'accueil du site. Soyez prudent lors de l'utilisation de cette fonctionnalité ! Si vous n'avez pas ajouté votre propre adresse IP à la liste blanche exclusive, vous serez bloqué hors de votre interface d'administration !"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD="ItemidShield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_TIP="Lorsqu'il est activé, Admin Tools bloquera toute valeur non valide pour le paramètre URL ItemId ou tentera de le nettoyer en une valeur entière valide"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_OFF="Désactivé"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_BLOCK="Bloquer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_CLEAN="Nettoyer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS="Bloquer les paramètres natifs suspects"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS_TIP="Bloque les requêtes contenant des valeurs suspectes dans les paramètres de chaîne de requête natifs de Joomla!, tels que <code>option</code>, <code>view</code>, <code>task</code>, etc."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD="Avertir en cas d'utilisation de mots de passe connus"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS="Groupes d'utilisateurs à vérifier pour les mots de passe connus"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS_TIP="Admin Tools vérifiera les mots de passe connus uniquement pour les utilisateurs appartenant à ces groupes (par défaut les Super utilisateurs)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_TIP="Lorsque cette option est activée, Admin Tools se connectera à la base de données Have I Been Pwned et vérifiera si le hachage du mot de passe actuel est connu. Si une correspondance est trouvée, l'utilisateur sera empêché d'utiliser un mot de passe non sécurisé."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES="Journaliser les requêtes bloquées"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES_TIP="Il est conseillé de conserver cette option activée. Lorsqu'elle est activée, toutes les violations de sécurité potentielles — bloquées par Admin Tools — seront enregistrées dans la base de données et accessibles via l'outil Journal des requêtes bloquées."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE="Conserver un fichier journal de débogage"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE_TIP="Admin Tools peut éventuellement conserver un fichier journal dans votre dossier de journaux Joomla! configuré. Lorsque cette option est activée, une entrée est ajoutée au fichier journal chaque fois qu'une requête est bloquée. Cette entrée contient des informations supplémentaires utiles pour le dépannage, notamment un vidage complet des données de la requête. Cela signifie que vous pourriez stocker des informations personnelles ou sensibles dans un fichier non chiffré. Il vous est conseillé de n'activer cette option que lors du dépannage d'un problème difficile à identifier et de la désactiver dès que vous avez collecté suffisamment d'informations pour résoudre le problème."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES="Journaliser les noms d'utilisateur"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES_TIP="Lorsqu'elle est activée, Admin Tools inclura le nom d'utilisateur lors du suivi des échecs de connexion (voir ci-dessus). AVERTISSEMENT ! Nous vous déconseillons fortement de désactiver cette option afin d'éviter tout problème avec le RGPD"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD="Blocage des agents utilisateurs malveillants (MUAShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD_TIP="De nombreux pirates tentent d'accéder à votre site en utilisant un navigateur configuré pour envoyer du code PHP malveillant dans sa chaîne d'agent utilisateur (un petit texte utilisé pour décrire le navigateur à votre serveur). L'idée est que des logiciels de traitement de journaux défaillants l'analyseront et permettront au pirate de prendre le contrôle de votre site. Lorsqu'elle est activée, cette fonctionnalité permet à Admin Tools de détecter de telles attaques et de bloquer la requête."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN="Interdire la connexion des Super administrateurs sur l'interface publique"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN_TIP="Lorsqu'elle est activée, il ne sera pas possible pour les Super administrateurs de se connecter à l'interface publique de votre site. Il s'agit d'une mesure de sécurité contre les attaques par force brute sur les mots de passe. Même les utilisateurs disposant de privilèges Super utilisateur ne pourront pas se connecter à l'interface publique de votre site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS="Désactiver la modification des propriétés des utilisateurs"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_TIP="Lorsqu'elle est activée, toute tentative de modifier les paramètres d'un Gestionnaire, Administrateur ou Super administrateur existant, ou d'en créer un nouveau, échouera."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS="Désactiver la modification des propriétés des utilisateurs pour ces groupes d'utilisateurs"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS_TIP="À quels groupes d'utilisateurs ayant accès à l'administration cette fonctionnalité s'applique-t-elle ? Si vous ne sélectionnez aucun groupe, Admin Tools désactivera la modification des propriétés des utilisateurs pour tous les utilisateurs disposant d'un accès de connexion à l'administration de votre site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS="Désactiver la création / modification d'utilisateurs depuis le frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_TIP="En principe, il ne devrait pas être possible de créer un nouvel utilisateur disposant de privilèges de connexion au backend depuis le frontend public. Lorsque cette option est activée, toute tentative de création de ce type de compte est traitée comme une tentative de piratage et est bloquée. Cette option vise certaines des attaques zero-day les plus notoires de Joomla! survenues entre 2015 et 2016."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS="Désactiver la création / modification d'utilisateurs dans ces groupes depuis le frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS_TIP="À quels groupes d'utilisateurs ayant accès au backend cette fonctionnalité s'applique-t-elle ? Si vous ne sélectionnez aucun groupe, Admin Tools désactivera la création ou la modification d'utilisateurs depuis le backend pour tous les utilisateurs qui ont ou qui obtiendraient un accès en connexion au backend du site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD="Blocage des gestionnaires de flux PHP (PHPShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD_TIP="Certains pirates tentent d'utiliser les gestionnaires de flux PHP (qui ressemblent à des URL commençant par php://, phar://, etc.) pour manipuler subrepticement des fichiers de votre site, en contournant les contrôles de téléversement de fichiers intégrés à Joomla!. Lorsque cette option est activée, Admin Tools bloque toute requête contenant du texte correspondant à l'un des gestionnaires de flux PHP couramment utilisés par les pirates."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL="Ne pas envoyer de notification par e-mail pour ces raisons"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL_TIP="Les requêtes bloquées pour ces raisons ne donneront pas lieu à l'envoi d'un e-mail à l'adresse spécifiée dans <em>Envoyer un e-mail à cette adresse lors d'une requête bloquée</em>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG="Ne pas journaliser ces raisons"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG_TIP="Les requêtes bloquées pour ces raisons ne seront pas journalisées. Par conséquent, les adresses IP déclenchant répétitivement une requête bloquée pour cette raison ne seront pas automatiquement bannies de votre site. De plus, en l'absence de journal, il sera impossible de déterminer pourquoi une personne est bloquée lors de l'accès à votre site lorsqu'elle déclenche l'une de ces raisons."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA="Désactiver l'authentification à deux facteurs de Joomla! lors de la réinitialisation du mot de passe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA_TIP="Lorsqu'elle est activée, Admin Tools désactive la configuration de l'authentification à deux facteurs de Joomla! pour un utilisateur lorsqu'il réinitialise son mot de passe. Cela s'applique uniquement à la fonctionnalité d'authentification à deux facteurs intégrée de Joomla! 3.2 et ultérieur, et non à la fonctionnalité d'authentification à deux facteurs d'Admin Tools."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD="Blocage des inclusions de fichiers distants (RFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD_TIP="Certains pirates tentent de forcer une extension vulnérable à charger du code PHP directement depuis leur serveur. Pour ce faire, ils transmettent une URL http(s):// ou ftp:// dans leur requête, pointant vers leur site malveillant. Lorsque cette option est activée, Admin Tools recherche de tels cas, tente de récupérer l'URL distante et analyse son contenu. Si du code PHP y est détecté, la requête est bloquée."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP="Enregistrer l'adresse IP d'inscription des utilisateurs dans les notes d'utilisateur"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_TIP="Lorsqu'elle est activée, l'adresse IP depuis laquelle les nouveaux utilisateurs se sont inscrits est stockée dans les notes d'utilisateur. Les utilisateurs créés via le backend n'auront pas leur adresse IP enregistrée en tant que note d'utilisateur, car cela n'a pas de sens (c'est un administrateur qui enregistre le compte utilisateur en leur nom). Les composants tiers créant de nouveaux comptes utilisateurs peuvent également ne pas déclencher l'événement du plugin."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY="Catégorie des notes d'utilisateur"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY_TIP="Sélectionnez la catégorie des notes d'utilisateur dans laquelle Admin Tools doit enregistrer l'adresse IP de l'utilisateur, par défaut « Non classé »"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT="Se défendre contre la désactivation du plugin"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT_TIP="Lorsqu'elle est activée, Admin Tools empêche les utilisateurs du backend de tenter de désactiver (dépublier) le plugin. Cela signifie que vous ne pourrez pas non plus dépublier le plugin tant que vous n'aurez pas désactivé cette option ! Veuillez également noter que cette option n'a aucun effet contre quelqu'un qui modifie directement votre base de données, ou renomme ou supprime les fichiers du plugin système Admin Tools (le répertoire <code>plugins/system/admintools</code> de votre site). Elle ne protège pas non plus contre la désinstallation d'Admin Tools, car seuls les super utilisateurs peuvent le faire par défaut. Si un attaquant obtient des privilèges de super utilisateur, la désactivation d'Admin Tools sera le cadet de vos soucis."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD="Protection contre l'empoisonnement des données de session PHP (SessionShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD_TIP="Prévient les données d'entrée malveillantes pouvant être utilisées pour tromper le gestionnaire de session interne de PHP en lui faisant exécuter du code arbitraire lors de la restauration de la session utilisateur. ATTENTION : cela <em>peut</em> bloquer certaines requêtes légitimes."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD="Protection SQLiShield contre les attaques par injection SQL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD_TIP="Lorsqu'elle est activée, Admin Tools tente de détecter les attaques par injection SQL courantes contre votre site et de les bloquer."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST="Surveiller les comptes super utilisateurs"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_TIP="Admin Tools suit les comptes utilisateurs disposant d'un accès super utilisateur. Si un nouveau super utilisateur est ajouté en dehors de la page Utilisateurs de Joomla!, vous en serez informé par e-mail. De plus, les nouveaux comptes super utilisateurs détectés seront automatiquement bloqués. Les utilisateurs créés ou ajoutés par d'autres super utilisateurs dans le backend du site via la page Utilisateurs de Joomla! ne seront PAS bloqués par cette fonctionnalité. Veuillez utiliser la fonctionnalité &ldquo;Désactiver la modification des propriétés des utilisateurs backend&rdquo; pour empêcher cela."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL="Envoyer un e-mail à cette adresse lors d'un changement de super utilisateur"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL_TIP="Les adresses e-mail, séparées par des virgules, auxquelles vous souhaitez être informé de toute tentative (et blocage !) de modification de la liste des super utilisateurs de votre site. Si ce champ est laissé vide, l'adresse e-mail définie dans l'option « Envoyer un e-mail à cette adresse après un bannissement automatique d'adresse IP » sera utilisée. Si les deux champs sont vides, un e-mail sera envoyé à tous les comptes super utilisateurs activés dont l'option Recevoir les e-mails système est activée dans leur profil utilisateur."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE="Bloquer le changement de modèle du site template=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE_TIP="Une autre fonctionnalité cachée de Joomla! est la possibilité de changer de modèle installé en transmettant un paramètre URL spécial. Par exemple, pour appliquer le modèle Beez5, il suffit de passer le paramètre <code>?template=beez5</code>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL="Bloquer le changement de modèle système tmpl=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST="Liste des mots-clés tmpl= autorisés"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST_TIP="Un mot-clé tmpl par entrée. Les entrées component et system sont toujours ajoutées, que vous les ajoutiez explicitement ou non ici."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL_TIP="L'une des fonctionnalités les moins connues de Joomla! est ses modèles système. Chaque fois qu'une erreur survient ou que vous mettez votre site hors ligne, Joomla! charge le modèle système correspondant. En passant le nom du modèle dans l'URL en ajoutant, par exemple, ?tmpl=offline, vous pouvez tester ces modèles sans avoir à produire réellement une erreur ni à mettre votre site hors ligne. L'activation de cette option désactivera cette fonctionnalité cachée de Joomla!. Notez que tmpl=system et tmpl=component doivent être autorisés (voir l'option suivante), car ils sont requis par certaines extensions pour fonctionner."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS="Traiter les échecs de connexion comme une raison de bloquer la requête"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS_TIP="Lorsqu'elle est activée, les tentatives de connexion échouées de tout type d'utilisateur (même les simples utilisateurs enregistrés) comptent comme une raison valable de bloquer la requête et sont enregistrées dans le journal des requêtes bloquées d'Admin Tools. Cela a une implication très utile : puisqu'elles comptent comme des raisons de bloquer une requête, elles comptent également dans la limite que vous avez définie pour le blocage automatique d'adresses IP. Ainsi, après un certain nombre de tentatives de connexion échouées, l'adresse IP de l'utilisateur sera automatiquement bloquée pour la durée que vous avez configurée."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL="Envoyer un e-mail de dépannage lors des fonctions administratives"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL_TIP="Envoie un e-mail à l'utilisateur backend actuellement connecté chaque fois qu'il effectue une fonction administrative d'Admin Tools pouvant entraîner son blocage hors du site ou un dysfonctionnement du site. L'e-mail contient des liens vers les articles de dépannage qui l'aident à corriger le problème et à remettre le site en état de fonctionnement. Il est vivement conseillé de maintenir cette fonctionnalité activée. Suivre les informations de dépannage est bien plus rapide qu'attendre une réponse de notre support."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD="Analyseur des fichiers téléversés (UploadShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_TIP="Inspecte chaque fichier téléversé sur votre site et bloque la requête lorsque le fichier semble pouvoir être utilisé pour exécuter du code sur votre serveur. Cela vous protège contre les extensions tierces vulnérables qui permettent à des attaquants de téléverser des fichiers arbitraires. Les téléversements effectués par des Super utilisateurs connectés ne sont jamais inspectés."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS="UploadShield : empêcher la surcharge par .htaccess"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS_TIP="Bloque la requête lorsqu'un fichier nommé .htaccess est téléversé et que son contenu comporte une directive Apache SetHandler ou AddHandler. Les attaquants se servent de ces directives pour amener Apache à exécuter comme du code PHP des fichiers par ailleurs inertes, tels que des images."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT="UploadShield : empêcher le téléversement de fichiers à extensions multiples"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT_TIP="Bloque la requête lorsqu'une partie quelconque du nom du fichier téléversé ressemble à une extension de fichier PHP, par ex. evil.php.jpg ou evil.jpg.php5. Certaines mauvaises configurations de serveur exécutent de tels fichiers comme du code PHP, quel que soit leur type apparent."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT="UploadShield : empêcher le téléversement de fichiers PHP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT_TIP="Bloque la requête lorsque l'extension du fichier téléversé est une extension de fichier PHP, telle que .php, .phps, .phtml, .inc, .php7 et ainsi de suite."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT="UploadShield : empêcher le contenu PHP dans les téléversements"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT_TIP="Bloque la requête lorsqu'un fichier téléversé contient ce qui ressemble à du code PHP, quel que soit son nom. Cela permet de détecter les attaques qui dissimulent du code PHP à l'intérieur d'un fichier image ou document par ailleurs valide."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW="Afficher les erreurs en utilisant un modèle HTML personnalisable"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW_TIP="Par défaut, le message de requête bloquée est affiché en utilisant la page d'erreur standard de Joomla!. Lorsque cette option est activée, Admin Tools utilise un modèle HTML personnalisable. Le fichier de modèle HTML par défaut se trouve dans le fichier components/com_admintools/View/Blocks/tmpl/default.php. NE MODIFIEZ PAS CE FICHIER DIRECTEMENT ! Consultez la documentation pour connaître la méthode appropriée afin de créer un remplacement de modèle."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS="Domaines jamais bloqués"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS_TIP="Si l'adresse IP d'un visiteur dont la requête est bloquée correspond à un nom de domaine se terminant par ce que vous saisissez ici, la requête est quand même bloquée, mais elle n'est pas journalisée, aucun e-mail n'est envoyé à son sujet et l'adresse IP n'est jamais bannie automatiquement. Le nom de domaine doit également correspondre en retour à l'adresse IP du visiteur ; un enregistrement DNS inverse falsifié ne compte donc pas. Veuillez noter qu'une longue liste aura un impact important sur les performances. La liste est vide par défaut. Pour les moteurs de recherche et les robots d'IA, utilisez plutôt l'onglet Robots d'exploration."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN="Ajouter les récidivistes à la liste des adresses IP non autorisées"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM="Désautoriser définitivement une adresse IP après ce nombre de blocages automatiques"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_2="blocages automatiques d'adresses IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_TIP="Lorsque l'option précédente est activée, après combien de bannissements automatiques une adresse IP sera-t-elle définitivement bannie (ajoutée à la liste des adresses IP non autorisées)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN_TIP="Si une adresse IP déclenche autant de bannissements automatiques, elle sera définitivement bannie (ajoutée à la liste des adresses IP non autorisées) si elle est sur le point d'être à nouveau bannie automatiquement. Assurez-vous d'avoir activé la fonctionnalité de liste des adresses IP non autorisées en définissant <em>Refuser l'accès au site aux adresses IP figurant dans la liste des adresses IP non autorisées</em> sur Oui, sinon l'ajout permanent à la liste des adresses IP non autorisées n'aura aucun effet."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PROJECTHONEYPOT="Project Honeypot"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_BODY="<p>L'utilisateur s'est inscrit sur le site en utilisant l'adresse IP <strong>%s</strong></p><p>La chaîne de l'agent utilisateur du navigateur de l'utilisateur était :<br/>%s</p><p>Ces informations ont été automatiquement enregistrées dans cette note d'utilisateur par Admin Tools Professional.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_SUBJECT="Adresse IP d'inscription"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE="Afficher ce message aux adresses IP bloquées"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE_TIP="Vous permet d'afficher un message spécifique aux adresses IP bloquées. Vous pouvez souhaiter expliquer à l'utilisateur que son adresse IP a été bloquée en raison d'une activité suspecte détectée comme provenant de celle-ci. Vous pouvez utiliser le texte spécial [IP] en majuscules, sans espaces entre les crochets et IP, pour afficher l'adresse IP de l'utilisateur dans le message. Cela peut être utile si quelqu'un est bloqué accidentellement et vous demande de l'aider."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSR="Bannissement automatique"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM="Durée du blocage"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM_TIP="Durée du blocage. Par exemple, en définissant 1 jour, vous bloquerez tout accès depuis cette adresse IP pendant une journée entière. Saisissez le nombre dans ce champ et sélectionnez l'unité de mesure du temps dans le champ suivant."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY="Unité de mesure du temps pour la durée du blocage"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY_TIP="L'unité de mesure du temps pour le paramètre « Durée du blocage » ci-dessus. Choisissez parmi secondes, minutes, jours ou heures."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE="Blocage automatique des adresses IP des récidivistes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE_TIP="Lorsqu'elle est définie sur oui, l'adresse IP des récidivistes sera automatiquement bannie selon les autres paramètres"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES="Bloquer l'adresse IP après ce nombre de requêtes bloquées"
