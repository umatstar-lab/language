COM_ADMINTOOLS_SITEHEALTHCHECK_FIX_DELETE_DONE="Supprimé : %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_MSG_IGNORED_RESET="Plus aucun contrôle ni élément n'est ignoré."
COM_ADMINTOOLS_SITEHEALTHCHECK_MSG_ITEM_IGNORED="%s est ignoré et ne sera plus signalé."
COM_ADMINTOOLS_SITEHEALTHCHECK_MSG_ITEMS_UNIGNORED="Les éléments de ce contrôle ne sont plus ignorés."
COM_ADMINTOOLS_SITEHEALTHCHECK_ERR_LOAD_FAILED="Impossible d'exécuter le bilan de santé du site : %s"
COM_ADMINTOOLS_SITEHEALTHCHECK_ERR_CHECK_FAILED="Ce contrôle n'a pas pu être effectué : %s"
COM_ADMINTOOLS_SITEHEALTHCHECK_ERR_NO_SUCH_CHECK="Ce contrôle du bilan de santé du site n'existe pas."
COM_ADMINTOOLS_SITEHEALTHCHECK_ERR_FIX_NOT_SUPPORTED="Ce contrôle du bilan de santé du site ne peut pas corriger ce problème."
COM_ADMINTOOLS_SITEHEALTHCHECK_ERR_FIX_NOT_APPLICABLE="Cette correction ne s'applique plus. Le problème a peut-être déjà été corrigé."
COM_ADMINTOOLS_SITEHEALTHCHECK_ERR_INVALID_PATH="Le fichier ou le dossier ne se trouve pas dans le dossier attendu, ou son nom n'est pas valide."
COM_ADMINTOOLS_SITEHEALTHCHECK_ERR_CANNOT_DELETE="Impossible de supprimer %s. Supprimez-le via FTP, SFTP ou le gestionnaire de fichiers de votre panneau de contrôle d'hébergement."
COM_ADMINTOOLS_SITEHEALTHCHECK_LBL_NO_DELETE="Admin Tools ne peut pas supprimer cet élément en toute sécurité à votre place. Supprimez-le via FTP, SFTP ou le gestionnaire de fichiers de votre panneau de contrôle d'hébergement."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_GLOBALCONFIG_TITLE="Configuration globale"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_GLOBALCONFIG_DESC="Ces paramètres sont enregistrés dans le fichier <code>configuration.php</code> de Joomla. Vous pouvez modifier la plupart d'entre eux dans Système, Configuration globale."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_TITLE="« Débogage système » doit être désactivé"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_DESC="N'activez « Débogage système » que pour diagnostiquer un problème sur votre site, idéalement sur une copie privée du site, ou pendant une durée très limitée. Les informations qu'il affiche peuvent révéler des données sensibles, ou utiles à des attaquants."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_MSG_FAIL="« Débogage système » est activé. Allez dans Système, Configuration globale, onglet Système, et réglez « Débogage système » sur Non."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_MSG_CONSTANT="« Débogage système » est désactivé dans la Configuration globale, mais autre chose active le mode débogage de Joomla sur votre site. Il s'agit généralement d'un fichier <code>defines.php</code> placé à la racine de votre site ou dans son dossier <code>administrator</code>, qui définit la constante <code>JDEBUG</code>. Désactivez-y le mode débogage."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_FIX="Désactiver « Débogage système »"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_FIX_DONE="« Débogage système » a été désactivé."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_TITLE="« Débogage de langue » doit être désactivé"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_DESC="« Débogage de langue » est uniquement destiné aux développeurs et aux traducteurs qui veulent savoir si le texte d'une page provient d'une chaîne de langue, et si cette chaîne est traduite dans la langue actuelle. Il doit être désactivé sur tous les autres sites."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_MSG_FAIL="« Débogage de langue » est activé. Allez dans Système, Configuration globale, onglet Système, et réglez « Débogage de langue » sur Non."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX="Désactiver « Débogage de langue »"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX_DONE="« Débogage de langue » a été désactivé."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_TITLE="$live_site doit être vide dans configuration.php"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_DESC="L'option <code>$live_site</code> est un ancien palliatif destiné aux serveurs web placés derrière un proxy inverse, un répartiteur de charge ou un CDN qui n'envoie pas d'en-tête HTTP <code>X-Forwarded-Host</code>, ou dont le serveur web est mal configuré et ignore cet en-tête. Certains l'utilisent aussi pour définir l'URL du site pour la CLI de Joomla. C'est également déconseillé : la CLI de Joomla dispose d'un moyen plus sûr d'obtenir le même résultat, son option <code>--live-site=%s</code>."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MATCH="Votre site est accessible sous le même nom d'hôte que celui indiqué dans <code>$live_site</code> ; vous n'en avez donc pas besoin. Modifiez le fichier <code>configuration.php</code> de votre site et videz la variable <code>$live_site</code> : <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MISMATCH="Votre serveur indique un nom d'hôte différent de celui de <code>$live_site</code>. Demandez à votre hébergeur de configurer le serveur web pour qu'il prenne en compte l'en-tête HTTP <code>X-Forwarded-Host</code> envoyé par le proxy inverse, le répartiteur de charge ou le CDN placé devant votre site. Modifiez ensuite le fichier <code>configuration.php</code> de votre site et videz la variable <code>$live_site</code> : <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_NOHOST="Votre serveur ne transmet pas l'en-tête HTTP Host. Demandez à votre hébergeur de configurer le serveur pour qu'il le définisse. Si un proxy inverse, un répartiteur de charge ou un CDN est placé devant votre site, il peut être nécessaire de configurer le serveur web pour qu'il prenne en compte l'en-tête HTTP <code>X-Forwarded-Host</code>. Modifiez ensuite le fichier <code>configuration.php</code> de votre site et videz la variable <code>$live_site</code> : <code>public $live_site = '';</code>"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_TITLE="« Rapport d'erreurs » doit être réglé sur Aucun sur un site en production"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_DESC="« Rapport d'erreurs » doit être réglé sur Aucun sur les sites en production. Sinon, les erreurs, avertissements et notices PHP risquent de révéler par inadvertance des informations sensibles, ou utiles à des attaquants. N'utilisez Maximum que pour diagnostiquer un problème, idéalement sur une copie privée du site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_MSG_FAIL="« Rapport d'erreurs » n'est pas réglé sur Aucun. Allez dans Système, Configuration globale, onglet Serveur, et réglez « Rapport d'erreurs » sur Aucun."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX="Régler « Rapport d'erreurs » sur Aucun"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX_DONE="« Rapport d'erreurs » a été réglé sur Aucun."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_TITLE="Les sessions partagées doivent être désactivées"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_DESC="Les sessions partagées sont dangereuses par nature. Lorsqu'un utilisateur se connecte au frontend, il est automatiquement connecté au backend également. Cela permet aux attaquants de mener des attaques par bourrage d'identifiants (credential stuffing) et par force brute contre le frontend et, en cas de succès, de se retrouver connectés au backend. Cela peut avoir des effets indésirables imprévus et neutralise en partie d'autres mesures de sécurité qui protègent le backend de votre site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_MSG_FAIL="Les sessions partagées sont activées. Allez dans Système, Configuration globale, onglet Système, et réglez « Sessions partagées » sur Non."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX="Désactiver les sessions partagées"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_CONFIRM="La désactivation des sessions partagées modifie le nom du cookie de session. Tout le monde, vous compris, sera déconnecté du site et devra se reconnecter. Continuer ?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_DONE="Les sessions partagées ont été désactivées. Vous devrez peut-être vous reconnecter."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_TITLE="configuration.php ne doit pas définir de nom de session lorsque les sessions partagées sont désactivées"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_DESC="Joomla! nomme le cookie de session d'après le nom de session. Lorsque <code>configuration.php</code> définit un nom de session, le frontend et le backend de votre site utilisent le même cookie de session, c'est-à-dire qu'ils partagent leurs sessions, alors même que les sessions partagées sont désactivées. Cela présente les mêmes risques que les sessions partagées. Joomla! n'enregistre un nom de session que lorsque les sessions partagées sont activées. Admin Tools 7.9.4 et les versions antérieures en écrivaient un par erreur dans <code>configuration.php</code> chaque fois que « Vérifier les répertoires temporaire et de journaux » corrigeait le dossier temporaire ou le dossier des journaux de votre site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_MSG_FAIL="Le fichier <code>configuration.php</code> de votre site définit un nom de session (<code>$session_name</code>), alors que les sessions partagées sont désactivées. Le frontend et le backend de votre site partagent leurs sessions. Supprimez-le, ainsi que d'autres valeurs qui ne s'appliquent que pendant le chargement d'une page et y ont été écrites par erreur."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX="Supprimer le nom de session"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_CONFIRM="La suppression du nom de session modifie le nom du cookie de session du frontend. Toutes les personnes connectées au frontend de votre site, vous y compris peut-être, seront déconnectées et devront se reconnecter. Continuer ?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_DONE="Le nom de session a été supprimé de configuration.php. Le frontend et le backend de votre site ne partagent plus leurs sessions. Vous devrez peut-être vous reconnecter."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_TITLE="Fonctionnalités de Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_DESC="Ces contrôles examinent les paramètres des fonctionnalités du cœur de Joomla! et d'Admin Tools, et proposent des valeurs adaptées aux sites en production."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_TITLE="Le plugin de débogage doit être désactivé, ou réservé aux Super utilisateurs"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_DESC="N'utilisez le plugin « Système - Débogage » que pour diagnostiquer un problème sur votre site, idéalement sur une copie privée du site, ou pendant une durée limitée. Les informations qu'il affiche peuvent contenir des données sensibles, ou des informations qu'un attaquant peut utiliser contre votre site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_MSG_FAIL="Le plugin « Système - Débogage » est activé, et des utilisateurs qui ne sont pas Super utilisateurs peuvent voir les informations qu'il affiche. Désactivez le plugin sur les sites en production, ou limitez ses « Groupes autorisés » aux seuls Super utilisateurs. Ces groupes d'utilisateurs peuvent actuellement voir ces informations :"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX="Désactiver le plugin de débogage"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX_DONE="Le plugin « Système - Débogage » a été désactivé."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_TITLE="L'utilisateur « admin » ne doit pas exister, ou doit être désactivé"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_DESC="Les noms d'utilisateur prévisibles, comme <code>admin</code>, sont une cible privilégiée des attaques par bourrage d'identifiants et par force brute. La compromission d'un tel compte utilisateur peut nuire gravement à votre site. Même avec des permissions minimales (par exemple uniquement dans le groupe Registered), un tel compte reste dangereux si Joomla! lui-même ou une extension tierce présente une vulnérabilité d'élévation de privilèges."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_MSG_FAIL="Il existe un compte utilisateur activé dont le nom d'utilisateur est <code>admin</code>. Bloquez-le, renommez-le ou supprimez-le. Le placer dans un groupe d'utilisateurs moins privilégié ne suffit pas."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX="Bloquer l'utilisateur"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_CONFIRM="Le compte utilisateur nommé admin va être bloqué et ne pourra plus se connecter à votre site. Continuer ?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_DONE="Le compte utilisateur nommé admin a été bloqué."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SELF="Vous êtes connecté avec le compte utilisateur nommé admin. Vous ne pouvez pas bloquer votre propre compte. Renommez-le plutôt, ou connectez-vous avec un autre compte."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SAVE="Impossible de bloquer le compte utilisateur nommé admin."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_TITLE="N'activez l'inscription des utilisateurs qu'en cas de besoin"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_DESC="Par défaut, Joomla! permet aux nouveaux utilisateurs de s'inscrire. C'est possible même si vous n'avez publié aucun module de connexion, ni aucun élément de menu de connexion ou d'inscription, tant que l'option « Autoriser l'inscription » est activée. Si vous n'avez pas besoin que les visiteurs créent un compte, ce qui est le cas de la plupart des sites gérés par leur propriétaire, désactivez cette fonctionnalité."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_MSG_FAIL="L'inscription des utilisateurs est activée. Si vous n'avez pas besoin que les visiteurs créent des comptes utilisateurs sur votre site, allez dans Utilisateurs, Paramètres, onglet Utilisateurs, et réglez « Autoriser l'inscription » sur Non."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX="Désactiver l'inscription des utilisateurs"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX_DONE="L'inscription des utilisateurs a été désactivée."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_TITLE="Limitez l'accès au backend à un petit nombre d'opérateurs de confiance"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_DESC="L'accès au backend est rarement nécessaire, et chaque utilisateur qui en dispose augmente la surface d'attaque que vous devez protéger. Déterminez quels utilisateurs ont réellement besoin d'accéder au backend, et s'ils pourraient faire leur travail depuis le frontend. Les utilisateurs qui n'ont besoin d'accéder au backend qu'occasionnellement doivent être retirés des groupes ayant accès au backend (Super Users, Administrator, Manager), et n'y être réintégrés que lorsqu'ils en ont besoin."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_PASS="Comptes utilisateurs activés ayant accès au backend : %d."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_FAIL="%1$d comptes utilisateurs activés ont accès au backend, soit plus de %2$d."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_TITLE="Utilisez l'authentification multifacteurs sur tous les comptes ayant accès au backend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_DESC="Les utilisateurs ayant accès au backend sont une cible de choix pour les attaques par bourrage d'identifiants et par force brute. Un seul compte compromis, même un simple Manager, peut causer d'importants dégâts à votre site. Activez toujours l'authentification multifacteurs sur ces comptes utilisateurs. Rendez-la obligatoire en allant dans Utilisateurs, Paramètres, onglet Authentification multifacteurs, et en sélectionnant tous les groupes d'utilisateurs du backend de votre site dans « Imposer l'authentification multifacteurs »."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_MSG_FAIL="Ces comptes utilisateurs activés ayant accès au backend (%d) n'utilisent pas l'authentification multifacteurs :"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_TITLE="Protégez le répertoire administrator par mot de passe"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_DESC="La protection par mot de passe du répertoire administrator rend les attaques par bourrage d'identifiants et par force brute moins efficaces. Même si les identifiants d'un utilisateur ont fuité, l'attaquant doit encore franchir un obstacle supplémentaire avant de pouvoir se connecter au backend de votre site. Comme elle est appliquée par le serveur web lui-même, elle est très efficace et limite l'impact d'un attaquant qui tente de forcer la connexion au backend."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_MSG_FAIL="Le répertoire administrator n'est pas protégé par mot de passe. Utilisez la fonctionnalité « Protéger l'administrateur par mot de passe » d'Admin Tools pour le protéger."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_TITLE="Appliquez un paramètre URL secret"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_DESC="Un paramètre URL secret rend les attaques par bourrage d'identifiants et par force brute moins efficaces. Même si les identifiants d'un utilisateur ont fuité, l'attaquant doit encore franchir un obstacle supplémentaire avant de pouvoir se connecter au backend de votre site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_MSG_FAIL="Vous n'avez pas défini de paramètre URL secret pour l'administrateur. Définissez-en un dans Web Application Firewall, Configurer le WAF, onglet Fonctionnalités de base, « Paramètre URL secret de l'administrateur »."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_TITLE="Supprimez les comptes « jamais connectés »"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_DESC="Les comptes utilisateurs créés mais qui ne se sont jamais connectés sont soit des comptes de spam dont vous n'avez pas besoin, soit des comptes oubliés dont les mots de passe sont potentiellement compromis. Supprimez-les avec une tâche planifiée Joomla! de type « Admin Tools – Suppression des utilisateurs inactifs »."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_FAIL="Comptes utilisateurs inscrits il y a plus de %2$d jours et qui ne se sont jamais connectés : %1$d. Créez une tâche planifiée de type « Admin Tools – Suppression des utilisateurs inactifs » pour les supprimer."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_TASK="Une tâche planifiée « Admin Tools – Suppression des utilisateurs inactifs » activée s'occupe de ces comptes."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_TITLE="Les Super utilisateurs ne doivent pas pouvoir se connecter au frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_DESC="Par défaut, les Super utilisateurs peuvent aussi se connecter au frontend de votre site. Cela permet aux attaquants de mener des attaques par bourrage d'identifiants et par force brute contre le frontend, moins protégé, pour découvrir le mot de passe d'un Super utilisateur. La fonctionnalité « Interdire la connexion des Super administrateurs sur l'interface publique » d'Admin Tools empêche les Super utilisateurs de se connecter au frontend, ce qui déjoue les plans des attaquants."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_MSG_FAIL="Les Super utilisateurs peuvent se connecter au frontend. Activez « Interdire la connexion des Super administrateurs sur l'interface publique » dans Web Application Firewall, Configurer le WAF, onglet Options de durcissement."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX="Interdire la connexion des Super utilisateurs au frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX_DONE="Les Super utilisateurs ne peuvent plus se connecter au frontend."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_TITLE="Les utilisateurs du backend ne doivent pas pouvoir se connecter au frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_DESC="Par défaut, les utilisateurs du backend peuvent aussi se connecter au frontend de votre site. Cela permet aux attaquants de mener des attaques par bourrage d'identifiants et par force brute contre le frontend, moins protégé, pour découvrir le mot de passe d'un utilisateur du backend. Modifiez les droits des groupes d'utilisateurs ayant accès au backend et réglez leur droit « Connexion au Site » sur Refusé, ce qui déjoue les plans des attaquants."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_MSG_FAIL="Comptes utilisateurs activés pouvant se connecter à la fois au backend et au frontend : %d. Allez dans Système, Configuration globale, onglet Droits, et réglez « Connexion au Site » sur Refusé pour ces groupes d'utilisateurs :"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_TITLE="Fichiers et dossiers"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_DESC="Ces contrôles recherchent les fichiers et dossiers qui ne devraient pas rester sur un site en production."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_TITLE="Akeeba Kickstart ne doit pas rester à la racine web"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_DESC="Kickstart peut extraire n'importe quel fichier JPA, JPS ou ZIP n'importe où sur votre site. Combiné à une vulnérabilité de téléversement de fichiers arbitraires dans Joomla! lui-même ou dans une extension tierce, cela permet à un attaquant d'écrire des fichiers arbitraires sur votre site, d'exécuter son propre code et de pirater votre site. Renommer le fichier, ou définir un mot de passe, n'est une bonne mesure que <em>temporairement</em>, pendant l'extraction d'une archive de sauvegarde. Une fois l'opération terminée, Kickstart <strong>doit</strong> être supprimé de votre site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_MSG_FAIL="Ces fichiers à la racine de votre site sont des copies d'Akeeba Kickstart. Supprimez-les."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_FIX_DONE="Supprimé : %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_TITLE="Le dossier installation doit être supprimé"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_DESC="Un dossier <code>installation</code> laissé après l'installation de Joomla! ou la restauration d'une sauvegarde peut être utilisé pour écraser votre site. Il doit être supprimé une fois l'opération terminée."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_MSG_FAIL="Il y a un dossier <code>installation</code> à la racine de votre site. Supprimez-le."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX="Supprimer le dossier installation"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_CONFIRM="Le dossier installation situé à la racine de votre site va être supprimé, ainsi que tout son contenu. Cette action est irréversible. Continuer ?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_DONE="Le dossier installation a été supprimé."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_TITLE="Les dossiers résiduels d'installation d'extensions doivent être supprimés"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_DESC="Joomla! utilise des dossiers temporaires <code>install_*</code> pendant la copie des fichiers d'une extension vers leur emplacement final, et les supprime normalement aussitôt. Si une installation ne se termine pas correctement, ils restent en place et peuvent présenter un risque de sécurité. Supprimez-les. Vous pouvez aussi créer une tâche planifiée de type « Admin Tools – Nettoyage du répertoire temporaire » pour le faire automatiquement."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_MSG_FAIL="Ces dossiers d'installation résiduels se trouvent dans le dossier temporaire de votre site, <code>%s</code> :"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_FIX_DONE="Supprimé : %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_TITLE="Supprimez les fichiers inutiles du cœur de Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_DESC="Joomla! fournit, à la racine de votre site, quelques fichiers d'exemple et d'information dont votre site n'a pas besoin pour fonctionner. Ils indiquent seulement à tout le monde quel logiciel fait tourner votre site. Joomla! les remet en place à chaque mise à jour ; vérifiez donc de nouveau après chaque mise à jour."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_MSG_FAIL="Ces fichiers inutiles se trouvent à la racine de votre site :"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_HTACCESS="Fichier .htaccess d'exemple. Il n'a aucun effet tant qu'il n'est pas renommé en .htaccess sur un serveur web Apache ou LiteSpeed. Utilisez plutôt le Générateur de fichier .htaccess d'Admin Tools."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_LICENSE="Texte de la licence de Joomla!. Sa présence n'est pas nécessaire pour utiliser Joomla!."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_ROBOTS="Fichier robots.txt d'exemple. Il n'a aucun effet tant qu'il n'est pas renommé en robots.txt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_WEBCONFIG="Fichier web.config d'exemple. Il n'a aucun effet tant qu'il n'est pas renommé en web.config sur un serveur web Microsoft IIS."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FIX_DONE="Supprimé : %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_TITLE="Le fichier journal de débogage d'Admin Tools doit être désactivé, et ses fichiers journaux supprimés"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_DESC="L'option « Conserver un fichier journal de débogage » d'Admin Tools est uniquement destinée au dépannage. Activez-la pendant une durée très limitée, idéalement sur une copie privée de votre site. Le fichier journal enregistre les données des requêtes, qui peuvent contenir des informations sensibles. Une fois le dépannage terminé, désactivez l'option et supprimez les fichiers journaux."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_ENABLED="L'option « Conserver un fichier journal de débogage » d'Admin Tools est activée. Désactivez-la dans Web Application Firewall, Configurer le WAF, onglet Journalisation et rapports."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_FILES="Des fichiers journaux de débogage d'Admin Tools se trouvent toujours dans le dossier des journaux de votre site. Supprimez-les."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE="Désactiver"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DELETE="Désactiver et supprimer les fichiers journaux"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE="Supprimer les fichiers journaux"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DONE="Le fichier journal de débogage a été désactivé."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE_DONE="Le fichier journal de débogage est désactivé et ses fichiers journaux ont été supprimés."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_TITLE="Analyseur de modifications des fichiers PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_DESC="Ces contrôles utilisent les informations que l'Analyseur de modifications des fichiers PHP collecte pendant l'analyse de votre site, ou examinent ses paramètres."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_TITLE="Utilisez l'Analyseur de modifications des fichiers PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_DESC="Lancez l'Analyseur de modifications des fichiers PHP au moins une fois par semaine, ainsi qu'avant et après l'installation d'une mise à jour de Joomla!, de la mise à jour d'une extension tierce ou d'une nouvelle extension tierce. Il vous alerte très tôt sur les fichiers potentiellement compromis, et permet aussi à Admin Tools de collecter des informations sur d'autres fichiers problématiques de votre site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_NEVER="L'Analyseur de modifications des fichiers PHP n'a encore jamais terminé d'analyse de votre site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_OLD="La dernière analyse terminée par l'Analyseur de modifications des fichiers PHP date du %1$s, il y a plus de %2$d jours."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_PASS="La dernière analyse terminée par l'Analyseur de modifications des fichiers PHP date du %s."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_TITLE="Aucun fichier hors cœur ne doit se trouver dans les dossiers du cœur"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_DESC="Les dossiers du cœur de Joomla! ne doivent contenir que les fichiers fournis par Joomla! lui-même. Tout autre fichier qui s'y trouve a été soit laissé par une ancienne version de Joomla!, soit déposé par une extension défaillante, soit implanté par un attaquant. Examinez ces fichiers et supprimez ceux qui n'ont rien à y faire. Les fichiers que vous avez examinés et marqués comme sûrs dans le rapport d'analyse ne sont pas listés."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_FAIL="L'Analyseur de modifications des fichiers PHP a trouvé %d fichier(s) hors cœur dans les dossiers du cœur de Joomla! :"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_IGNORED="Ce contrôle est impossible, car l'Analyseur de modifications des fichiers PHP est configuré pour ignorer les fichiers hors cœur dans les dossiers du cœur. Allez dans les Options d'Admin Tools, onglet Analyseur de fichiers, et réglez « Fichiers hors cœur dans les dossiers du cœur » sur Signaler, ou Signaler et rapporter comme menace. Lancez ensuite une analyse."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_TITLE="Aucun fichier PHP ne doit se trouver dans les dossiers de médias, d'images, de fichiers et de langues"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_DESC="Le dossier <code>images</code> (et tout autre dossier du Gestionnaire de médias), <code>media</code>, <code>files</code>, <code>language</code>, <code>administrator/language</code> et <code>.well-known</code> sont destinés aux fichiers statiques : images, documents, CSS, JavaScript et fichiers de langue. Les fichiers PHP qui s'y trouvent sont très souvent des portes dérobées téléversées par des attaquants via une extension vulnérable. Examinez chacun d'eux ; supprimez ceux qui n'appartiennent pas à une extension que vous utilisez."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_MSG_FAIL="%d fichier(s) PHP trouvé(s) là où ils ne devraient pas se trouver :"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_TITLE="Les fichiers de configuration serveur ne doivent pas permettre d'exécuter des fichiers en tant que PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_DESC="Un fichier <code>.htaccess</code> peut faire exécuter par le serveur web n'importe quel fichier en tant que PHP ou script CGI, quel que soit son nom (par exemple <code>AddType application/x-httpd-php .jpg</code>), ou modifier les paramètres de PHP. Un fichier <code>.user.ini</code> peut faire exécuter par PHP un autre fichier, même une image, avant ou après chaque script PHP (<code>auto_prepend_file</code>). Les attaquants s'en servent pour transformer un fichier téléversé d'apparence anodine en porte dérobée. Les fichiers qui ne font qu'empêcher l'exécution de scripts, par exemple avec <code>SetHandler none</code> ou <code>php_flag engine off</code>, ne sont pas signalés. Ceux qui se trouvent directement dans le dossier racine de votre site et dans le dossier <code>administrator</code> non plus : les hébergeurs s'en servent pour choisir la version de PHP. Examinez chacun des fichiers listés ; supprimez ceux que vous n'avez pas créés vous-même et qui n'appartiennent pas à une extension que vous utilisez."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_MSG_FAIL="%d fichier(s) de configuration serveur permettant d'exécuter des fichiers en tant que PHP, ou modifiant les paramètres de PHP :"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_TITLE="Ne renommez pas les fichiers et dossiers pour en conserver d'anciennes versions"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_DESC="Les copies comme <code>index-bak.php</code>, <code>index.php.old</code>, <code>configuration (1).php</code> ou <code>cassiopeia-copy</code> sont une façon courante de conserver une ancienne version d'un fichier ou d'un dossier. Elles ne sont jamais mises à jour, peuvent rester accessibles depuis le web, peuvent révéler des informations sensibles (un fichier de configuration renommé est un cadeau pour un attaquant) et peuvent contenir du code ancien et vulnérable. Utilisez plutôt des sauvegardes ou un système de gestion de versions ; supprimez ces copies."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_MSG_FAIL="%d fichier(s) et dossier(s) ressemblent à des copies renommées :"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_TITLE="Repérez et examinez les fichiers volumineux"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_DESC="Les fichiers volumineux situés en dehors des dossiers du Gestionnaire de médias et du dossier <code>files</code> sont souvent des archives de sauvegarde, des exports de base de données ou des fichiers journaux oubliés. Ils peuvent révéler des informations sensibles s'ils sont téléchargeables, et gaspillent de l'espace disque. Examinez-les et supprimez ceux dont vous n'avez pas besoin. Vous pouvez modifier la taille limite, ou désactiver ce contrôle, dans les Options d'Admin Tools, onglet Analyseur de fichiers."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_MSG_FAIL="%d fichier(s) volumineux trouvé(s) :"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_TITLE="Fichiers et dossiers cachés"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_DESC="Les fichiers et dossiers dont le nom commence par un point sont masqués dans la plupart des listes de fichiers. Certains sont légitimes, comme <code>.htaccess</code>, <code>.htpasswd</code>, <code>.user.ini</code> et <code>.well-known</code>, qui ne sont pas signalés. D'autres, comme <code>.git</code>, <code>.env</code> ou les paramètres d'éditeurs, révèlent des informations sur votre site et ne doivent pas se trouver sur un site en production. Les attaquants aiment aussi cacher leurs fichiers de cette manière."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_MSG_FAIL="%d fichier(s) et dossier(s) caché(s) trouvé(s) :"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_TITLE="Autres outils"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_DESC="Ces fonctionnalités d'Admin Tools peuvent vous aider à garder votre site en bon état. Rien n'est vérifié ici ; jetez-y un œil et décidez si elles vous sont utiles."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_TITLE="Super utilisateurs temporaires"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_DESC="Utilisez les Super utilisateurs temporaires chaque fois que vous devez donner à quelqu'un un accès Super utilisateur pour une durée limitée, par exemple à un développeur d'extension qui diagnostique un problème sur votre site. Le compte expire automatiquement."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_TITLE="Configuration des permissions et Corriger les permissions"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_DESC="Vérifiez le propriétaire et les permissions des fichiers et dossiers de votre site, et appliquez des permissions raisonnables, adaptées à votre usage et à la configuration de votre serveur."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_TITLE="Vérifier les répertoires temporaire et de journaux"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_DESC="Lancez de temps en temps « Vérifier les répertoires temporaire et de journaux », depuis la section Outils du Tableau de bord, pour vous assurer que les dossiers temporaire et de journaux de votre site existent et sont accessibles en écriture."

COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_LABEL="Bilan de santé du site : examiner les dossiers et fichiers exclus"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_DESC="Pendant l'analyse, l'Analyseur de modifications des fichiers PHP collecte aussi des informations pour le bilan de santé du site : fichiers PHP dans les dossiers de médias, copies renommées, fichiers volumineux et fichiers cachés. Lorsque cette option est activée, ces informations sont aussi collectées dans les dossiers et fichiers que vous avez exclus de l'analyse ; ceux-ci ne sont toujours pas analysés pour détecter les modifications. Les exclusions intégrées d'Admin Tools (dossiers temporaire, de journaux et de cache) sont toujours ignorées."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_LABEL="Bilan de santé du site : signaler les fichiers volumineux"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_DESC="Permet au bilan de santé du site de lister les fichiers volumineux trouvés sur votre site par l'Analyseur de modifications des fichiers PHP, afin que vous puissiez les examiner. Les fichiers des dossiers du Gestionnaire de médias (par exemple <code>images</code>) et du dossier <code>files</code> ne sont jamais signalés, car des fichiers volumineux y sont attendus."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_LABEL="Bilan de santé du site : taille des fichiers volumineux (MiB)"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_DESC="Les fichiers d'au moins cette taille, en MiB, sont signalés comme volumineux par le bilan de santé du site. Ce réglage prend effet à la prochaine exécution de l'Analyseur de modifications des fichiers PHP."
