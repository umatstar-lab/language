COM_ADMINTOOLS_ADMINPASSWORD_ERR_PASSWORDNOMATCH="Les mots de passe ne correspondent pas"

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HOWITWORKS="Comment cela fonctionne-t-il ?"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_INFO="Lorsque vous appliquez la protection par mot de passe, votre navigateur vous demandera un nom d'utilisateur et un mot de passe chaque fois qu'une ressource protégée dans le dossier <code>administrator</code> sera demandée. Vous devrez saisir le nom d'utilisateur et le mot de passe que vous avez renseignés sur cette page. Ce nom d'utilisateur et ce mot de passe sont <em>communs</em> à toutes les personnes gérant votre site et <em>doivent être différents</em> de vos identifiants Joomla!. Cela fonctionne au niveau du serveur, en utilisant un fichier <code>.htaccess</code> dans le dossier <code>administrator</code> de votre site. Votre serveur doit prendre en charge la protection des répertoires par mot de passe avec les fichiers .htaccess pour que cette fonctionnalité soit effective. Si vous n'êtes pas sûr que c'est le cas, veuillez contacter votre hébergeur."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_WARN="Veuillez noter que cette protection s'applique même si vous désactivez ou désinstallez Admin Tools. Si votre espace administrateur devient inaccessible, ou si vous devez supprimer la protection par mot de passe sans avoir accès à cette page, vous devrez <strong>supprimer</strong> les fichiers <code>.htaccess</code> et <code>.htpasswd</code> du répertoire <code>administrator</code> de votre site via FTP, SFTP ou le gestionnaire de fichiers de votre panneau de contrôle d'hébergement."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORDPROTECTION="Configurer la protection par mot de passe de l'administrateur"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES="Réinitialiser les pages d'erreur personnalisées"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES_HELP="Réinitialise les pages d'erreur personnalisées Apache pour les codes HTTP 401 et 403 aux paramètres par défaut. Cela évite une erreur 404 Article introuvable lors de l'accès à la page de connexion de l'administrateur après avoir activé la fonctionnalité de protection par mot de passe de l'administrateur. Il est fortement conseillé de conserver cette option activée, sauf si elle provoque une erreur HTTP 500 Erreur interne du serveur."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE="Ressources de l'administrateur à protéger"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_JOOMLA="Joomla!"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_PHP="Tous les fichiers PHP"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_EVERYTHING="Tout"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_HELP="Choisissez ce qui sera protégé par un mot de passe. « Joomla! » protège uniquement le fichier index.php de Joomla! (le point d'entrée de l'application administrateur). Tout le reste est librement accessible, y compris les fichiers .php des applications tierces. « Tous les fichiers PHP » protège tous les fichiers PHP dans le dossier <code>administrator</code> et ses sous-répertoires. « Tout » fonctionne comme les anciennes versions d'Admin Tools, en interdisant l'accès à tout fichier dans le dossier <code>administrator</code> et ses sous-répertoires, quelle que soit son extension."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE="Algorithme de hachage des mots de passe"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_HELP="Les mots de passe sont stockés hachés dans le fichier <code>administrator/.htpasswd</code>. Cette option permet de sélectionner l'algorithme de hachage. bCrypt est le plus sécurisé, mais n'est pas toujours pris en charge. APR-1 (par défaut) est suffisamment sécurisé et pris en charge par la plupart des hébergeurs. SHA-1 est toujours pris en charge, mais n'est plus considéré comme sécurisé. crypt() ne permet que des mots de passe d'au plus 8 caractères, n'est pas pris en charge sous Windows et est considéré comme non sécurisé. Texte en clair n'applique aucun hachage et ne doit JAMAIS être utilisé à d'autres fins que le dépannage, avec un mot de passe jetable qui doit immédiatement être considéré comme compromis."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_APR1="APR-1"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_BCRYPT="bCrypt"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_SHA1="SHA-1"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_CRYPT="crypt()"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_PLAIN="Texte en clair"

