COM_ADMINTOOLS_REDIRECTION_LBL_DEST="Visiter cette page"
COM_ADMINTOOLS_REDIRECTION_LBL_DEST_DESC="Il s'agit d'une URL relative sur votre site. Lorsqu'un visiteur l'accède, il sera redirigé vers l'URL \"Vous emmène là\" ci-dessous. Elle ne doit pas comporter le préfixe de protocole http:// ou https://, votre nom de domaine ni de barre oblique initiale. Exemples : <code>search/on/google</code> ou <code>456-blog/123-my-article</code>. Veuillez noter que vous ne pouvez pas spécifier le fragment (le signe <code>#</code> dans l'URL et tout ce qui le suit), car il s'agit d'une fonctionnalité côté client ; votre serveur ne voit PAS le fragment, nous ne pouvons donc pas effectuer de redirection côté serveur en fonction du contenu du fragment."
COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE="Vous emmène ici"
COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE_DESC="Il s'agit de l'URL relative ou absolue vers laquelle le visiteur sera redirigé. Cette URL doit être valide même si vous désactivez la fonctionnalité de redirection. Elle peut pointer vers votre propre site ou vers un site différent. Exemples : <code>https://www.example.com</code> ou <code>blog/123-my-article</code>."
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS="Conserver les paramètres d'URL"
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS_DESC="Choisissez ce qu'il faut faire avec les paramètres de chaîne de requête dans l'URL visitée. \"Aucun\" les ignore et conserve les paramètres de chaîne de requête de l'URL \"Vous emmène ici\", le cas échéant. \"Remplacer tout\" les fusionne avec les paramètres de chaîne de requête de l'URL \"Vous emmène ici\", en remplaçant ces derniers même s'ils sont déjà définis. \"Ajouter nouveaux\" ajoutera tout paramètre de chaîne de requête défini dans l'URL visitée <em>à condition que</em> ceux-ci ne soient PAS déjà définis dans l'URL \"Vous emmène ici\"."

