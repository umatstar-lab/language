COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE_HEAD="Ο διακομιστής σας αναφέρει ότι η τρέχουσα ώρα είναι <strong>%s</strong> (ζώνη ώρας <em>%s</em>)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE="<p>Οι ώρες του Προγράμματος Απουσίας πρέπει να δίνονται στη ζώνη ώρας %s. Μπορείτε να αλλάξετε αυτή τη ζώνη ώρας στη σελίδα Γενικής Ρύθμισης Παραμέτρων του Joomla!. Αν η τρέχουσα ώρα εξακολουθεί να μην φαίνεται σωστή, παρακαλώ ρωτήστε τον πάροχο φιλοξενίας σας να ελέγξει την ώρα του διακομιστή και τις ρυθμίσεις ζώνης ώρας PHP και λειτουργικού συστήματος.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIP="Το Πρόγραμμα Απουσίας απενεργοποιεί την πρόσβαση στην περιοχή διαχείρισης του ιστότοπού σας κατά τη χρονική περίοδο που ορίζετε στα πεδία από και έως. Αυτό είναι χρήσιμο όταν είστε ο μόνος διαχειριστής του ιστότοπου και θέλετε να βεβαιωθείτε ότι ενώ κοιμάστε ή απουσιάζετε κανείς δεν μπορεί να αποκτήσει πρόσβαση στην ενότητα διαχείρισης του ιστότοπου. Η ώρα πρέπει να δίνεται στη ζώνη ώρας Διακομιστή που έχετε ορίσει στη Γενική Ρύθμιση Παραμέτρων του ιστότοπου. Η ζώνη ώρας και η τρέχουσα ώρα σε αυτή τη ζώνη εκτυπώνονται στο μήνυμα κάτω από το πεδίο Πρόγραμμα Απουσίας Από για την εξυπηρέτησή σας"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TO="Πρόγραμμα Απουσίας έως (ωω:λλ)"
