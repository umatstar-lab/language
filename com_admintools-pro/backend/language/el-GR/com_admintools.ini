COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_DESC="Αποστέλλεται από το Admin Tools όταν ένα ή περισσότερα αρχεία που επιλέξατε να παρακολουθείτε για αλλαγές έχουν τροποποιηθεί."
