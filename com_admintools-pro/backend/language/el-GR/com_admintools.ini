COM_ADMINTOOLS_TITLE_SCHEDULINGINFORMATION="Προγραμματισμός Ανιχνευτή Αλλαγών Αρχείων PHP"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON="Εναλλακτικές Εργασίες CRON Γραμμής Εντολών"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON_INFO="Αυτή η μέθοδος συνιστάται μόνο εάν η κανονική εργασία CRON Γραμμής Εντολών δεν ολοκληρώνεται. Αυτή η μέθοδος χρησιμοποιεί εσωτερικά τη μέθοδο προγραμματισμού διεπαφής και είναι λίγο πιο αργή από την ενσωματωμένη μέθοδο CLI."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON="Εργασίες CRON Γραμμής Εντολών (συνιστάται)"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON_INFO="Αυτή είναι η συνιστώμενη μέθοδος για όλους τους διακομιστές που υποστηρίζουν εργασίες CRON Γραμμής Εντολών. Αυτή η μέθοδος παρακάμπτει τη διεπαφή ιστού της Joomla!, επιτυγχάνοντας μέγιστη ταχύτητα σάρωσης ιστότοπου."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICIMPROTANTINFO="Σημαντικό"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICINFO="Θυμηθείτε να αντικαταστήσετε το <em>%s</em> με την πραγματική διαδρομή προς το εκτελέσιμο αρχείο PHP <strong>CLI (Διεπαφή Γραμμής Εντολών)</strong> του παρόχου φιλοξενίας σας. Θυμηθείτε ότι πρέπει να χρησιμοποιείτε το εκτελέσιμο αρχείο PHP CLI· το εκτελέσιμο αρχείο PHP CGI (Common Gateway Interface) <em>δεν</em> θα λειτουργεί με τα σενάρια CRON μας. Εάν δεν είστε σίγουροι για αυτό, συμβουλευτείτε τον πάροχο φιλοξενίας σας. Αυτοί είναι οι μόνοι που μπορούν να παρέχουν αυτές τις πληροφορίες."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP="Λειτουργία Προγραμματισμού Διεπαφής"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_INFO="Αυτή η μέθοδος χρησιμοποιεί μια δημόσια διεύθυνση URL και ένα μυστικό κλειδί για να ενεργοποιήσει μια σάρωση του ιστότοπού σας. Η σάρωση προχωράει μέσω ανακατευθύνσεων HTTP. Σημειώστε ότι οι περισσότερες εργασίες CRON βάσει URL των παρόχων φιλοξενίας, καθώς και οι περισσότερες υπηρεσίες CRON βάσει URL τρίτων, δεν υποστηρίζουν ανακατευθύνσεις HTTP. Εάν τα παραδείγματα με wget και curl παρακάτω δεν λειτουργούν για εσάς, χρησιμοποιήστε τη διεύθυνση URL προγραμματισμού διεπαφής με την πολύ οικονομική υπηρεσία τρίτου webcron.org."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_MANYMETHODS="Η λειτουργία προγραμματισμού διεπαφής μπορεί να χρησιμοποιηθεί με μεγάλη ποικιλία μεθόδων. Κάντε κλικ στις καρτέλες παρακάτω για να δείτε την περιγραφή κάθε μεθόδου. Θυμηθείτε ότι όλες εξηγούνται λεπτομερώς στην τεκμηρίωσή μας."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_CURL="cURL"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_SCRIPT="Σενάριο PHP"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_URL="URL"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_WEBCRON="WebCron.org"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_WGET="WGet"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CURL="Προγραμματισμός CRON με χρήση cURL:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CUSTOMSCRIPT="Προσαρμοσμένο σενάριο PHP για εκτέλεση του προγραμματισμού διεπαφής:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_DISABLED="Η λειτουργία προγραμματισμού διεπαφής του Admin Tools δεν είναι ενεργοποιημένη. Δεν μπορείτε να χρησιμοποιήσετε αυτή τη μέθοδο προγραμματισμού αν δεν την ενεργοποιήσετε. Μεταβείτε στον Πίνακα Ελέγχου του Admin Tools, κάντε κλικ στις Επιλογές και ενεργοποιήστε τη λειτουργία προγραμματισμού διεπαφής. Μην ξεχάσετε επίσης να ορίσετε μια μυστική λέξη της επιλογής σας."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_RAWURL="Διεύθυνση URL για χρήση με δικά σας σενάρια και υπηρεσίες τρίτων:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_SECRET="Το μυστικό κλειδί της λειτουργίας προγραμματισμού διεπαφής είναι κενό. Δεν μπορείτε να χρησιμοποιήσετε αυτή τη μέθοδο προγραμματισμού αν δεν δημιουργήσετε ένα μυστικό κλειδί. Μεταβείτε στον Πίνακα Ελέγχου του Admin Tools, κάντε κλικ στις Επιλογές και εισάγετε ένα μυστικό κλειδί της επιλογής σας."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON="Ρύθμιση εργασίας σάρωσης με WebCron.org:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_ALERTS="Ειδοποιήσεις"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Εάν έχετε ήδη ρυθμίσει μεθόδους ειδοποίησης στη διεπαφή του webcron.org, σας συνιστούμε να επιλέξετε μια μέθοδο ειδοποίησης εδώ και να μην επιλέξετε 'Μόνο σε σφάλμα' ώστε να λαμβάνετε πάντα ειδοποίηση όταν εκτελείται η εργασία CRON δημιουργίας αντιγράφου ασφαλείας."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_EXECUTIONTIME="Χρόνος εκτέλεσης"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_EXECUTIONTIME_INFO="Αυτό είναι το πλέγμα κάτω από τις άλλες επιλογές. Επιλέξτε πότε και πόσο συχνά θέλετε να εκτελείται η εργασία CRON σας."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_INFO="Συνδεθείτε στο webcron.org. Στην περιοχή CRON, κάντε κλικ στο κουμπί Νέο Cron. Παρακάτω θα βρείτε τι πρέπει να εισάγετε στη διεπαφή του webcron.org."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_LOGIN="Σύνδεση"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_LOGINPASSWORD_INFO="Αφήστε αυτό κενό"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_NAME="Όνομα εργασίας cron"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_NAME_INFO="Ό,τι θέλετε, π.χ. <em>Σάρωση του ιστότοπού μου</em>"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_PASSWORD="Κωδικός Πρόσβασης"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_THENCLICKSUBMIT="Τέλος, κάντε κλικ στο κουμπί Υποβολή για να ολοκληρώσετε τη ρύθμιση της εργασίας CRON σας."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_TIMEOUT="Timeout"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180sec; εάν η σάρωση δεν ολοκληρωθεί, αυξήστε την τιμή. Οι περισσότεροι ιστότοποι θα λειτουργήσουν με ρύθμιση 180 ή 600 εδώ. Εάν έχετε πολύ μεγάλο ιστότοπο που χρειάζεται περισσότερο από 5 λεπτά για σάρωση, ίσως να εξετάσετε τη χρήση της εγγενούς εργασίας CRON μέσω CLI, καθώς είναι πολύ πιο αποδοτική."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_URL="URL που θέλετε να εκτελέσετε"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WGET="Προγραμματισμός CRON με wget (οι περισσότεροι πάροχοι):"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER="Προγραμματισμένες Εργασίες Joomla"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_INFO="Μπορείτε να προγραμματίσετε μια σάρωση του ιστότοπού σας χρησιμοποιώντας τη δυνατότητα Προγραμματισμένων Εργασιών της Joomla!. Παρακαλούμε διαβάστε πρώτα την τεκμηρίωση για να κατανοήσετε τους συμβιβασμούς και τα πιθανά προβλήματα ανάλογα με τον τρόπο που επιλέγετε να ενεργοποιείτε τις Προγραμματισμένες Εργασίες της Joomla!."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_BUTTON="Διαχείριση Προγραμματισμένων Εργασιών"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_ONLYJ41_HEAD="Οι Προγραμματισμένες Εργασίες είναι διαθέσιμες μόνο σε Joomla! 4.1 και νεότερες εκδόσεις"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_ONLYJ41_BODY="Η Joomla! εισήγαγε τη δυνατότητα Προγραμματισμένων Εργασιών στην έκδοση 4.1.0. Παρακαλούμε ενημερώστε τον ιστότοπό σας στην τελευταία έκδοση Joomla! για να αποκτήσετε πρόσβαση στις Προγραμματισμένες Εργασίες."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_HEAD="Το πρόσθετο «Εργασία – Admin Tools» είναι απενεργοποιημένο."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BODY="Το πρόσθετο «Εργασία – Akeeba Backup» πρέπει να είναι ενεργοποιημένο για να γνωρίζουν οι Προγραμματισμένες Εργασίες της Joomla! πώς να εκτελούν αντίγραφα ασφαλείας με το Akeeba Backup. Παρακαλούμε μεταβείτε στο Σύστημα, Διαχείριση, Πρόσθετα και ενεργοποιήστε το πρόσθετο. Εναλλακτικά, κάντε κλικ στο παρακάτω κουμπί για να επεξεργαστείτε το πρόσθετο απευθείας."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BUTTON="Επεξεργασία πρόσθετου"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_GENERICREADDOC="Διαβάστε την τεκμηρίωση"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_GENERICUSECLI="Χρησιμοποιήστε την παρακάτω εντολή στη διεπαφή CRON του παρόχου σας:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_HEADERINFO="Το Admin Tools προσφέρει αρκετές μεθόδους για τον προγραμματισμό εκτέλεσης του Ανιχνευτή Αλλαγών Αρχείων PHP. Παρακάτω θα βρείτε περισσότερες πληροφορίες για κάθε μέθοδο προγραμματισμού. Παρακαλούμε διαβάστε την τεκμηρίωση κάθε μεθόδου προγραμματισμού. Θα απαντήσει σε πολλές ερωτήσεις σας και θα σας βοηθήσει να προγραμματίσετε τις σαρώσεις του ιστότοπού σας πιο εύκολα."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_RUN_FILESCANNER="Προγραμματισμός Ανιχνευτή Αλλαγών Αρχείων PHP"

