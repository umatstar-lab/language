COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_REGENERATED="Το αρχείο ρυθμίσεων του διακομιστή αναδημιουργήθηκε."
COM_ADMINTOOLS_SERVERCONFIGREMINDER_MSG="Το αρχείο ρυθμίσεων του διακομιστή σας (.htaccess, nginx.conf ή web.config) δημιουργήθηκε από το Admin Tools, αλλά δεν συμφωνεί πλέον με αυτό που θα δημιουργούσε η παρούσα έκδοση του Admin Tools. Παρακαλώ <a href='%s'>ανοίξτε τον Πίνακα Ελέγχου του Admin Tools και αναδημιουργήστε το</a>, ώστε να τεθούν σε ισχύ οι πιο πρόσφατες προστασίες."
COM_ADMINTOOLS_CORESUMS_WARN_HEAD="Η επαλήθευση αρχείων πυρήνα δεν είναι διαθέσιμη"
COM_ADMINTOOLS_CORESUMS_WARN_BODY="Η πιο πρόσφατη εκτέλεση του Ανιχνευτή Αλλαγών Αρχείων PHP δεν μπόρεσε να λάβει τα δεδομένα αθροισμάτων ελέγχου CoreSums, επομένως τα αρχεία δεν επαληθεύτηκαν έναντι των επίσημων αθροισμάτων ελέγχου του πυρήνα του Joomla. Η σάρωση ολοκληρώθηκε κανονικά, αλλά κανένα αρχείο δεν επισημάνθηκε ως πυρήνα ή εκτός πυρήνα. Συνήθως πρόκειται για προσωρινό πρόβλημα δικτύου. Αν επιμένει, ελέγξτε τις επιλογές \"URL υπηρεσίας CoreSums\" και \"Χρονικό όριο λήψης CoreSums\" στις ρυθμίσεις του συστατικού."
