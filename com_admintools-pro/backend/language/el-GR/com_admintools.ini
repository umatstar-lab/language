;; File Scanner
COM_ADMINTOOLS_JCONFIG_SCAN_LABEL="Ανιχνευτής Αρχείων"
COM_ADMINTOOLS_JCONFIG_SCAN_DESC="Ρύθμιση της λειτουργίας του Ανιχνευτή Αλλαγών Αρχείων PHP"

COM_ADMINTOOLS_JCONFIG_LOGLEVEL_LABEL="Επίπεδο Καταγραφής"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DESC="Η λεπτομέρεια του αρχείου καταγραφής του Ανιχνευτή Αλλαγών Αρχείων PHP, που φυλάσσεται στον ρυθμισμένο κατάλογο αρχείων καταγραφής του ιστότοπού σας. Προτεινόμενες τιμές: \"Προειδοποιήσεις\" για ιστότοπους παραγωγής, \"Εντοπισμός σφαλμάτων\" όταν θέλετε να ζητήσετε υποστήριξη από εμάς."
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_NONE="Καμία"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_ERROR="Σφάλματα"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_WARNING="Προειδοποιήσεις"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_INFO="Πληροφορίες"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DEBUG="Εντοπισμός σφαλμάτων"
COM_ADMINTOOLS_JCONFIG_MINEXEC_LABEL="Ελάχιστος Χρόνος Αιτήματος"
COM_ADMINTOOLS_JCONFIG_MINEXEC_DESC="Ελάχιστος χρόνος που θα διαρκεί κάθε αίτημα στον Ανιχνευτή Αλλαγών Αρχείων PHP. Αυξήστε αν ο διακομιστής σας εμφανίσει σφάλμα επειδή τα αιτήματα υποβάλλονται πολύ συχνά ή φθάνετε στα όρια CPU/πόρων.<br/><br/>Προτεινόμενες τιμές: 2.0 έως 7.0."
COM_ADMINTOOLS_JCONFIG_MAXEXEC_LABEL="Μέγιστος Χρόνος Εργασίας"
COM_ADMINTOOLS_JCONFIG_MAXEXEC_DESC="Μέγιστος χρόνος που καταναλώνεται για τη σάρωση του ιστότοπού σας σε κάθε αίτημα προς τον Ανιχνευτή Αλλαγών Αρχείων PHP. Μειώστε τον εάν φτάνετε τα όρια CPU / πόρων του διακομιστή σας. Ορίστε τιμή μικρότερη από τον Ελάχιστο Χρόνο Αιτήματος για να δημιουργήσετε μια περίοδο &quot;ψύξης χρήσης CPU&quot;, μειώνοντας έτσι την κατανάλωση πόρων κατά τη σάρωση αρχείων με αντάλλαγμα τη βραδύτερη σάρωση.<br/><br/>Συνιστώμενες τιμές: 3.0 έως 7.0"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_LABEL="Μεροληψία Χρόνου Εργασίας"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_DESC="Μια τιμή από 50 έως 100 που επηρεάζει πόσο επιθετικά το Admin Tools θα προβλέπει εάν πρόκειται να φτάσει το όριο Μέγιστου Χρόνου Εργασίας. Το 50 είναι το πιο επιθετικό και θα έχει ως αποτέλεσμα η σάρωση να διαρκεί περίπου τον μισό Μέγιστο Χρόνο Εργασίας σε κάθε αίτημα προς τον Ανιχνευτή Αλλαγών Αρχείων PHP. Το 100 είναι το λιγότερο επιθετικό και θα έχει ως αποτέλεσμα η σάρωση να διαρκεί τουλάχιστον και συνήθως περισσότερο από τον Μέγιστο Χρόνο Εργασίας σε κάθε αίτημα.<br/><br/>Συνιστώμενη τιμή: 75.<br/><br/><strong>Συμβουλή!</strong> Εάν έχετε ιδιαίτερα ευαίσθητο διακομιστή, συνιστούμε να ορίσετε Ελάχιστο Χρόνο Αιτήματος 7.0, Μέγιστο Χρόνο Εργασίας 5.0 και Μεροληψία Χρόνου Εργασίας 50. Αυτό σημαίνει ότι ο ανιχνευτής λειτουργεί για 2,5 έως 5,0 δευτερόλεπτα κάθε φορά και στη συνέχεια ο διακομιστής σας δεν κάνει τίποτα για 2,0 έως 4,5 δευτερόλεπτα. Η σάρωση του ιστότοπού σας θα διαρκεί περίπου τρεις φορές περισσότερο, αλλά έχει καλύτερες πιθανότητες να ολοκληρωθεί."
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_LABEL="Μέγ. αριθμός Φακέλων ανά δέσμη"
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_DESC="Ο μέγιστος αριθμός φακέλων που θα καταχωρούνται σε έναν δεδομένο κατάλογο κάθε φορά. Αυτό αποτρέπει το PHP από το να λήξει χρονικά κατά την καταχώρηση των περιεχομένων <em>πολύ</em> μεγάλων φακέλων, με εκατοντάδες φακέλους που περιέχονται άμεσα μέσα τους.<br/><br/>Συνιστώμενη τιμή: 50<br/><br/>Να θυμάστε ότι η καταχώρηση των περιεχομένων των φακέλων είναι <strong>εκθετικά ανάλογη</strong> με τον αριθμό των αρχείων και φακέλων που περιέχονται σε αυτούς. Αυτό είναι περιορισμός του τρόπου λειτουργίας των Λειτουργικών Συστημάτων και των προγραμμάτων οδήγησης συστήματος αρχείων τους. Δεν μπορούν να κάνουν κάτι ούτε εμείς, ούτε η Joomla!, ούτε η PHP. Συνιστούμε έντονα να εξαιρέσετε πολύ μεγάλους φακέλους και να λάβετε μέτρα για να αποτρέψετε την ύπαρξη φακέλων με χιλιάδες απευθείας περιεχόμενα αρχεία και φακέλους. Εάν δεν είστε σίγουροι, δημιουργήστε βαθιά εμφωλευμένους φακέλους."
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_LABEL="Μέγ. αριθμός Αρχείων ανά δέσμη"
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_DESC="Ο μέγιστος αριθμός αρχείων που θα καταχωρούνται σε έναν δεδομένο κατάλογο κάθε φορά. Αυτό αποτρέπει το PHP από το να λήξει χρονικά κατά την καταχώρηση των περιεχομένων <em>πολύ</em> μεγάλων φακέλων, με χιλιάδες αρχεία που περιέχονται άμεσα μέσα τους.<br/><br/>Συνιστώμενη τιμή: 100<br/><br/>Να θυμάστε ότι η καταχώρηση των περιεχομένων των φακέλων είναι <strong>εκθετικά ανάλογη</strong> με τον αριθμό των αρχείων και φακέλων που περιέχονται σε αυτούς. Αυτό είναι περιορισμός του τρόπου λειτουργίας των Λειτουργικών Συστημάτων και των προγραμμάτων οδήγησης συστήματος αρχείων τους. Δεν μπορούν να κάνουν κάτι ούτε εμείς, ούτε η Joomla!, ούτε η PHP. Συνιστούμε έντονα να εξαιρέσετε πολύ μεγάλους φακέλους και να λάβετε μέτρα για να αποτρέψετε την ύπαρξη φακέλων με χιλιάδες απευθείας περιεχόμενα αρχεία και φακέλους. Εάν δεν είστε σίγουροι, δημιουργήστε βαθιά εμφωλευμένους φακέλους."
COM_ADMINTOOLS_JCONFIG_FEBENABLE_LABEL="Ενεργοποίηση προγραμματισμού διεπαφής"
COM_ADMINTOOLS_JCONFIG_FEBENABLE_DESC="Όταν είναι ενεργοποιημένο, σας επιτρέπει να εκτελείτε τον Ανιχνευτή Αλλαγών Αρχείων PHP χωρίς να συνδέεστε στο παρασκήνιο."
COM_ADMINTOOLS_JCONFIG_SECRETWORD_LABEL="Μυστική λέξη"
COM_ADMINTOOLS_JCONFIG_SECRETWORD_DESC="Προστατεύει τη λειτουργία προγραμματισμού διεπαφής από επιθέσεις DoS απαιτώντας να διαβιβάσετε αυτή τη μυστική λέξη στη διεύθυνση URL προγραμματισμού διεπαφής. Χρησιμοποιήστε μακρούς και πολύπλοκους κωδικούς πρόσβασης. Συμβουλευτείτε την τεκμηρίωση για περισσότερες πληροφορίες."
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_LABEL="Ζώνη ώρας για email"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DESC="Όλες οι ημερομηνίες και ώρες στα email που αποστέλλει το Admin Tools για να σας ειδοποιεί για πιθανά ζητήματα ασφαλείας θα εκφράζονται στην επιλεγμένη ζώνη ώρας. Προεπιλογή: GMT"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DEFAULT="Ζώνη Ώρας Διακομιστή"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_LABEL="Προτιμώμενη εφεδρική γλώσσα για ειδοποιήσεις email"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_DESC="Η γλώσσα που χρησιμοποιείται για τα email ειδοποιήσεων που αποστέλλονται σε διεύθυνση η οποία δεν αντιστοιχεί σε λογαριασμό χρήστη Joomla, καθώς και για λογαριασμούς χρηστών των οποίων η ρύθμιση γλώσσας είναι «Χρήση προεπιλογής».<br/><br/>Όταν μια ειδοποίηση αποστέλλεται σε διεύθυνση που <em>όντως</em> αντιστοιχεί σε λογαριασμό χρήστη Joomla, χρησιμοποιείται η ρύθμιση γλώσσας εκείνου του λογαριασμού, εκτός αν ενεργοποιήσετε και την παρακάτω επιλογή.<br/><br/>Αν δεν είναι δυνατός ο προσδιορισμός γλώσσας, χρησιμοποιούνται τα Αγγλικά (en-GB). Το Admin Tools δεν στέλνει ποτέ ειδοποίηση στη γλώσσα στην οποία τυχαίνει να εμφανίζεται ο ιστότοπός σας εκείνη τη στιγμή.<br/><br/>Προεπιλογή: Καμία, δηλαδή Αγγλικά (en-GB)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_NONE="Καμία (χρήση Αγγλικών)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_LABEL="Επιβολή αυτής της γλώσσας σε όλα τα email ειδοποιήσεων"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_DESC="Όταν είναι ενεργοποιημένη, κάθε email ειδοποίησης αποστέλλεται στη γλώσσα που επιλέξατε παραπάνω, ακόμη κι όταν απευθύνεται σε λογαριασμό χρήστη Joomla με διαφορετική ρύθμιση γλώσσας.<br/><br/>Ενεργοποιήστε την αν επεξεργάζεστε αυτόματα τα email ειδοποιήσεων και χρειάζεται να φτάνουν πάντα σε μία, προβλέψιμη γλώσσα.<br/><br/>Προεπιλογή: Όχι"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_LABEL="Εξαιρούμενοι Φάκελοι"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_DESC="Φάκελοι που θα παραλείπονται κατά τη σάρωση του ιστότοπού σας.<br/><br/>Οι φάκελοι δίνονται σχετικά με τον ριζικό κατάλογο του ιστότοπού σας. Εισάγετε έναν φάκελο ανά γραμμή.<br/><br/>Προεπιλογή: τίποτα<br/><br/><em>Σημείωση</em>: Ορισμένοι φάκελοι εξαιρούνται αυτόματα χωρίς να τους προσθέσετε εδώ: ο κατάλογος αρχείων καταγραφής και προσωρινών αρχείων του ιστότοπού σας, οι κατάλογοι κρυφής μνήμης διεπαφής και παρασκηνίου, καθώς και φάκελοι με όνομα tmp, log ή logs στη διεπαφή ή στο παρασκήνιο του ιστότοπού σας. Τέλος, οι συμβολικοί σύνδεσμοι προς φακέλους εκτός του ριζικού καταλόγου του ιστότοπού σας δεν ακολουθούνται (τα περιεχόμενά τους δεν θα σαρωθούν)."
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_LABEL="Εξαιρούμενα Αρχεία"
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_DESC="Αρχεία που θα παραλείπονται κατά τη σάρωση του ιστότοπού σας.<br/><br/>Τα αρχεία δίνονται σχετικά με τον ριζικό κατάλογο του ιστότοπού σας. Εισάγετε μία διαδρομή αρχείου ανά γραμμή.<br/><br/>Προεπιλογή: τίποτα<br/><br/>Χρησιμοποιήστε μόνο για να εξαιρέσετε αρχεία που δεν είναι πραγματικά εκτελέσιμα, π.χ. αρχεία καταγραφής με επέκταση .php εκτός του φακέλου καταγραφής της Joomla!. ΜΗΝ χρησιμοποιείτε για να επισημαίνετε αρχεία ως ασφαλή· χρησιμοποιήστε αντ' αυτού τη λειτουργία Επισήμανσης ως Ασφαλούς στη σελίδα αναφοράς σάρωσης."
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_LABEL="Επεκτάσεις προς σάρωση"
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_DESC="Μια λίστα επεκτάσεων αρχείων προς σάρωση διαχωρισμένη με κόμμα, χωρίς την αρχική τελεία.<br/><br/>Προεπιλεγμένη τιμή: php, phps, phtml, php3, inc<br/><br/>Να θυμάστε ότι ο Ανιχνευτής Αλλαγών Αρχείων PHP έχει σχεδιαστεί αξιόπιστα μόνο για τη σάρωση και αξιολόγηση Βαθμού Απειλής αρχείων PHP. Συνιστούμε έντονα να μην προσθέτετε επεκτάσεις αρχείων πηγαίου κώδικα διαφορετικών γλωσσών προγραμματισμού, όπως JavaScript και Perl, ή δυαδικά αρχεία. Εάν δεν λάβετε υπόψη αυτή την προειδοποίηση ενδέχεται να λάβετε πολλά ψευδώς θετικά αποτελέσματα ή, χειρότερα, ψευδώς αρνητικά αποτελέσματα σε αρχεία που δεν περιέχουν πηγαίο κώδικα γλώσσας προγραμματισμού PHP."
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_LABEL="Σάρωση αρχείων με διπλές επεκτάσεις"
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_DESC="Σαρώνει αρχεία όπου οι επεκτάσεις προς σάρωση εμφανίζονται πριν από άλλες επεκτάσεις. Για παράδειγμα, εάν έχετε προσθέσει <code>php</code> στις &quot;Επεκτάσεις προς σάρωση&quot; και ενεργοποιήσετε αυτή την επιλογή εδώ, ο Ανιχνευτής Αλλαγών Αρχείων PHP θα σαρώνει τόσο το <code>example.php</code> όσο και το <code>example.php.png</code>."
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_LABEL="Αντιστοίχιση επέκτασης χωρίς διάκριση πεζών-κεφαλαίων"
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_DESC="Καθιστά την αντιστοίχιση επέκτασης αρχείου αδιάφορη ως προς τη διάκριση πεζών-κεφαλαίων. Για παράδειγμα, εάν έχετε προσθέσει <code>php</code> στις &quot;Επεκτάσεις προς σάρωση&quot; και ενεργοποιήσετε αυτή την επιλογή εδώ, ο Ανιχνευτής Αλλαγών Αρχείων PHP θα σαρώνει τόσο το <code>example.php</code> όσο και το <code>example.PHP</code>"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_LABEL="Όριο μεγάλου αρχείου"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_DESC="Ο Ανιχνευτής Αλλαγών Αρχείων PHP θα σταματά σκόπιμα την εργασία και θα την επαναλαμβάνει στο επόμενο αίτημα πριν από τη σάρωση αρχείων μεγαλύτερων από αυτόν τον αριθμό byte. Αυτό αποτρέπει τυχαία λήξη χρόνου PHP κατά τη σάρωση μεγάλου αρχείου στο τέλος του κατανεμημένου Μέγιστου Χρόνου Εργασίας.<br/><br/>Συνιστώμενη τιμή: 524288"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_LABEL="Υπολογισμός διαφορών κατά τη σάρωση"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_DESC="Όταν αυτή η επιλογή είναι ενεργοποιημένη, το Admin Tools θα υπολογίζει μια διαφορά (συμπαγής μορφή διαφορών αρχείου) για κάθε τροποποιημένο αρχείο που εντοπίζεται από τη λειτουργία Ανιχνευτή Αρχείων PHP. ΠΡΟΕΙΔΟΠΟΙΗΣΗ: Αυτό καταναλώνει ΠΟΛΥ χώρο βάσης δεδομένων, περίπου 20-40 MB για έναν τυπικό ιστότοπο!"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_LABEL="Να μην αναφέρονται αρχεία με μηδενικό Βαθμό Απειλής"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_DESC="Όταν είναι ενεργοποιημένο, οποιοδήποτε νέο ή τροποποιημένο αρχείο με μηδενικό Βαθμό Απειλής δεν θα αναφέρεται.<br/><br/>Συνιστώμενη τιμή: Όχι<br/><br/><strong>ΠΡΟΕΙΔΟΠΟΙΗΣΗ</strong>: ΔΕΝ συνιστούμε την ενεργοποίηση αυτής της επιλογής. Είναι εφικτό τα κακόβουλα τροποποιημένα αρχεία να έχουν μηδενικό Βαθμό Απειλής επειδή το κακόβουλο ωφέλιμο φορτίο τους είναι γραμμένο με τρόπο που είναι αδύνατο για έναν αυτόματο ανιχνευτή να διακρίνει από νόμιμο, έστω και λίγο ακατάστατο, κώδικα. Η ενεργοποίηση αυτής της επιλογής δεν θα σας ειδοποιεί για αυτά τα αρχεία, θέτοντας ενδεχομένως τον ιστότοπό σας σε κίνδυνο. Αυτή η επιλογή υπάρχει για τον εντοπισμό σφαλμάτων στον υπολογισμό Βαθμού Απειλής και ΟΧΙ ως κάτι που πρέπει να ενεργοποιείτε σε ιστότοπους παραγωγής."
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_LABEL="Όριο υπερβολικά μεγάλου αρχείου"
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_DESC="Τα αρχεία μεγαλύτερα από αυτόν τον αριθμό byte δεν θα έχουν αξιολογηθεί ο Βαθμός Απειλής τους.<br/><br/>Συνιστώμενη τιμή: 5242880<br/><br/>Μια τιμή πολύ μικρή θα προκαλούσε τη μη σάρωση εκτελέσιμων αρχείων για κακόβουλο κώδικα, κάτι που θα μπορούσε να αποτελεί ανησυχία ασφαλείας. Ο ορισμός αυτής σε πολύ υψηλή τιμή πιθανότατα θα οδηγήσει σε λήξη χρόνου PHP κατά τη σάρωση ενός πολύ μεγάλου αρχείου, τυπικά ενός που δεν είναι καν εκτελέσιμο παρά την επέκταση .php (π.χ. αρχείο καταγραφής)."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_LABEL="Αρχεία εκτός πυρήνα σε φακέλους πυρήνα"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_DESC="Ελέγχει τον τρόπο με τον οποίο ο ανιχνευτής αντιμετωπίζει αρχεία που ΔΕΝ είναι επίσημα αρχεία πυρήνα του Joomla αλλά βρίσκονται μέσα σε κατάλογο πυρήνα του Joomla (κατάλογο που ανήκει σε επέκταση, βιβλιοθήκη ή πρότυπο του πυρήνα, ή σε έναν από τους administrator/help, administrator/includes, includes). <strong>Αγνόηση</strong>: να μην εντοπίζονται αυτά τα αρχεία. <strong>Επισήμανση</strong>: εμφάνιση ενός σήματος \"εκτός πυρήνα\" στα αποτελέσματα της σάρωσης. <strong>Επισήμανση και Αναφορά ως Απειλή</strong>: εμφάνιση του σήματος και προσθήκη 1000 στη Βαθμολογία απειλής, ώστε το αρχείο να εμφανίζεται στην κορυφή των αποτελεσμάτων. Τα αρχεία μέσα σε καταλόγους επεκτάσεων τρίτων θεωρούνται εκτός εμβέλειας και δεν επισημαίνονται ποτέ."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_IGNORE="Αγνόηση"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_FLAG="Επισήμανση"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_THREAT="Επισήμανση και Αναφορά ως Απειλή"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_LABEL="URL υπηρεσίας CoreSums"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_DESC="Βασικό URL της υπηρεσίας αθροισμάτων ελέγχου CoreSums που χρησιμοποιεί ο Ανιχνευτής Αλλαγών Αρχείων PHP για να αναγνωρίζει και να επαληθεύει τα αρχεία πυρήνα του Joomla. Η προεπιλογή είναι <code>https://getpanopticon.com/checksums</code>. Το Admin Tools μόνο ΛΑΜΒΑΝΕΙ ένα δημόσιο αρχείο αθροισμάτων ελέγχου από αυτή την υπηρεσία για τη δική σας έκδοση του Joomla· δεν αποστέλλει ποτέ καμία πληροφορία για τον ιστότοπό σας ή τους χρήστες του. Αν προτιμάτε να φιλοξενείτε ο ίδιος τα αθροίσματα ελέγχου, μπορείτε να εκτελέσετε τη δική σας υπηρεσία — δείτε <code>https://github.com/akeeba/coresums</code> — και να στρέψετε αυτή την επιλογή σε αυτήν."
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_LABEL="Χρονικό όριο λήψης CoreSums (δευτερόλεπτα)"
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_DESC="Ο μέγιστος αριθμός δευτερολέπτων αναμονής κατά τη λήψη του αρχείου αθροισμάτων ελέγχου CoreSums πριν εγκαταλειφθεί η προσπάθεια. Προεπιλογή: 5. Αν η λήψη αποτύχει, η σάρωση εκτελείται κανονικά, αλλά κανένα αρχείο δεν επισημαίνεται ως πυρήνα ή εκτός πυρήνα και εμφανίζεται μια προειδοποίηση, την οποία μπορείτε να απορρίψετε, μέχρι την επόμενη επιτυχημένη σάρωσή σας."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_DESC="Τα αποτελέσματα σάρωσης θα αποστέλλονται αυτόματα σε αυτή την ηλεκτρονική διεύθυνση. Εάν την αφήσετε κενή, δεν θα αποστέλλεται κανένα email."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_LABEL="Αποστολή αποτελεσμάτων σε αυτό το email"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_LABEL="Email μόνο για στοιχεία που απαιτούν ενέργεια"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_DESC="Όταν είναι ενεργοποιημένο (προεπιλογή), ο Ανιχνευτής Αλλαγών Αρχείων PHP θα σας αποστέλλει email με τη σύνοψη αποτελεσμάτων σάρωσης <em>μόνο</em> όταν ανιχνεύονται στοιχεία που απαιτούν ενέργεια (αρχεία που προστέθηκαν, τροποποιήθηκαν ή αποτελούν πιθανή απειλή)."

;; Email sending
COM_ADMINTOOLS_JCONFIG_EMAIL_LABEL="Αποστολή Email"
COM_ADMINTOOLS_JCONFIG_EMAIL_DESC="Επιλογές που ελέγχουν τον τρόπο αποστολής email από το Admin Tools για αποκλεισμένα αιτήματα. Αυτές οι επιλογές ισχύουν μόνο στην έκδοση Professional."
COM_ADMINTOOLS_JCONFIG_THROTTLE_LABEL="Περιορισμός email αποκλεισμένων αιτημάτων"
COM_ADMINTOOLS_JCONFIG_THROTTLE_DESC="Όταν είναι ενεργοποιημένο, το Admin Tools θα αποστέλλει μέχρι έναν συγκεκριμένο αριθμό email σε ένα συγκεκριμένο χρονικό διάστημα. Αυτό προστατεύει το email σας από υπερφόρτωση όταν ο ιστότοπός σας δέχεται επίθεση. Πρέπει να έχετε ενεργοποιημένη την καταγραφή αποκλεισμένων αιτημάτων για <em>όλους τους λόγους αποκλεισμού</em> για τους οποίους αποστέλλετε email. Επιπλέον, ο μέγιστος αριθμός καταχωρήσεων αρχείου καταγραφής που διατηρείτε — σύμφωνα με τη ρύθμιση παραμέτρων του πρόσθετου συστήματος — πρέπει να είναι <em>ίσος ή μεγαλύτερος</em> από τον μέγιστο αριθμό email που ρυθμίζεται παρακάτω. Σε οποιαδήποτε άλλη περίπτωση τα email εξαιρέσεων ασφαλείας σας δεν θα περιορίζονται."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_LABEL="Μέγιστος αριθμός αποκλεισμένων αιτημάτων για αποστολή email"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_DESC="Ο μέγιστος αριθμός αποκλεισμένων αιτημάτων για τα οποία μπορούν να αποστέλλονται email εντός της χρονικής περιόδου που ορίζεται παρακάτω. Να λαμβάνετε υπόψη ότι κατά τη διάρκεια μιας παρατεταμένης επίθεσης ενδέχεται να αποστέλλονται περισσότερα email από αυτόν τον αριθμό, ανάλογα με το πόσο αργά ανταποκρίνονται οι διακομιστές web, βάσης δεδομένων και ηλεκτρονικού ταχυδρομείου σας όταν ο ιστότοπός σας βρίσκεται υπό πολύ μεγάλο φορτίο. Επιπλέον, να λαμβάνετε υπόψη ότι αυτό επηρεάζει μόνο τα αποκλεισμένα αιτήματα που καταγράφονται στη βάση δεδομένων και τα οποία έχουν λόγο αποκλεισμού που ΔΕΝ βρίσκεται στους ρυθμισμένους λόγους για τους οποίους δεν αποστέλλονται ποτέ email."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_LABEL="Περίοδος περιορισμού email"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_DESC="Ο περιορισμός email λειτουργεί ελέγχοντας πόσα αποκλεισμένα αιτήματα έχουν καταγραφεί σε αυτόν τον αριθμό δευτερολέπτων, λεπτών, ωρών ή ημερών. Επιλέγετε τη μονάδα μέτρησης χρόνου παρακάτω."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_LABEL="Μονάδα μέτρησης χρόνου"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DESC="Η παραπάνω περίοδος εκφράζεται στη μονάδα μέτρησης χρόνου που επιλέγεται εδώ. Να σημειωθεί ότι για τους σκοπούς αυτών των υπολογισμών ένα λεπτό είναι 60 δευτερόλεπτα, 1 ώρα είναι 3600 δευτερόλεπτα, 1 ημέρα είναι 86400 δευτερόλεπτα. Αυτό μπορεί να διαφέρει από τα λεπτά, ώρες και ημέρες του ρολογιού τοίχου σε έτη με δευτερόλεπτα άλματος και στη μετάβαση μεταξύ Θερινής και Χειμερινής Ώρας (ή αντίστροφα). Η χρονομέτρηση είναι ένα αρκετά περίπλοκο θέμα."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_SECONDS="Δευτερόλεπτα"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_MINUTES="Λεπτά"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_HOURS="Ώρες"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DAYS="Ημέρες"

COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_DESC="Για πόσο χρόνο, σε λεπτά, χρησιμοποιείται μια ληφθείσα λίστα IP των crawlers πριν ληφθεί ξανά. Είναι επίσης ο χρόνος που περιμένει το Admin Tools πριν προσπαθήσει ξανά μετά από αποτυχημένη λήψη. Το ελάχιστο είναι 15 λεπτά."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_LABEL="Διάρκεια ζωής cache των λιστών crawlers (λεπτά)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DESC="Επιλογές για τις λίστες IP των crawlers, τις οποίες ενεργοποιείτε στο Ρύθμιση Παραμέτρων WAF, καρτέλα Crawlers."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_DESC="Αν μια λίστα IP των crawlers δεν μπορεί να ανανεωθεί, το Admin Tools συνεχίζει να χρησιμοποιεί την τελευταία λίστα που έλαβε για τόσες ημέρες, μετρώντας από τη στιγμή που η λίστα θα έληγε κανονικά. Μετά από αυτό, η λίστα δεν χρησιμοποιείται πλέον. Ορίστε 0 για να σταματά η χρήση μιας λίστας μόλις λήξει."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_LABEL="Απόρριψη παλαιών λιστών crawlers μετά από (ημέρες)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_LABEL="Crawlers"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_DESC="Ο μέγιστος χρόνος, σε χιλιοστά του δευτερολέπτου, που περιμένει το Admin Tools για τη λήψη μιας λίστας IP: των λιστών IP των crawlers, καθώς και των λιστών CloudFlare, Sucuri και BunnyCDN που χρησιμοποιούν οι δημιουργοί ρυθμίσεων διακομιστή. Οι λίστες που δημοσιεύονται ως ιστοσελίδες και όχι ως αρχεία δεδομένων (της Amazon και της Sucuri) λαμβάνουν το τριπλάσιο αυτού του ορίου (το πολύ 60 δευτερόλεπτα). Αυτό το όριο τηρείται με ακρίβεια μόνο όταν ο διακομιστής σας χρησιμοποιεί την επέκταση cURL της PHP. Με άλλες μεθόδους σύνδεσης, και για την αναζήτηση DNS σε ορισμένες εκδόσεις του cURL, είναι μόνο κατά προσέγγιση: στρογγυλοποιείται προς τα πάνω σε ακέραια δευτερόλεπτα και ένας πολύ αργός διακομιστής μπορεί να χρειαστεί περισσότερο χρόνο."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_LABEL="Χρονικό όριο λήψης λιστών crawlers και CDN (χιλιοστά του δευτερολέπτου)"

;; Backend options
COM_ADMINTOOLS_JCONFIG_BACKEND_LABEL="Παρασκήνιο"
COM_ADMINTOOLS_JCONFIG_BACKEND_DESC="Επιλογές που καθορίζουν τον τρόπο λειτουργίας του παρασκηνίου του συστατικού"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_LABEL="Εμφάνιση γραφημάτων και στατιστικών"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_DESC="Εμφάνιση γραφημάτων και στατιστικών σχετικά με αποκλεισμένα αιτήματα (μόνο στην έκδοση Professional)"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_LABEL="Αυτόματη αναδιάταξη του πρόσθετου"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_DESC="Το πρόσθετο Συστήματος - Admin Tools πρέπει να είναι διατεταγμένο ως το πρώτο δημοσιευμένο πρόσθετο για να λειτουργεί σωστά. Όταν επισκέπτεστε το Admin Tools στο παρασκήνιο, το πρόσθετο αναδιατάσσεται αυτόματα ώστε να είναι το πρώτο. Σε ορισμένες σπάνιες περιπτώσεις άλλα πρόσθετα πρέπει να δημοσιεύονται πρώτα, για παράδειγμα εναλλακτικοί χειριστές αλληλογραφίας όπως το CMandrill. Σε αυτή την περίπτωση ορίστε αυτή την επιλογή σε Όχι. ΣΟΒΑΡΟΣ ΚΙΝΔΥΝΟΣ! ΘΑ ΕΞΑΡΤΑΤΑΙ ΑΠΟΚΛΕΙΣΤΙΚΑ ΑΠΟ ΕΣΑΣ Η ΑΝΑΔΙΑΤΑΞΗ ΤΟΥ ΠΡΟΣΘΕΤΟΥ. ΕΑΝ ΕΝΑ ΕΥΑΛΩΤΟ ΠΡΟΣΘΕΤΟ ΔΗΜΟΣΙΕΥΕΤΑΙ ΠΡΙΝ ΑΠΟ ΤΟ ΠΡΟΣΘΕΤΟ ΣΥΣΤΗΜΑΤΟΣ - ADMIN TOOLS, Ο ΙΣΤΟΤΟΠΟΣ ΣΑΣ ΜΠΟΡΕΙ ΝΑ ΠΑΡΑΒΙΑΣΤΕΙ. ΤΟ ADMIN TOOLS ΔΕΝ ΘΑ ΕΙΝΑΙ ΣΕ ΘΕΣΗ ΝΑ ΣΑΣ ΠΡΟΣΤΑΤΕΥΣΕΙ ΣΕ ΑΥΤΗ ΤΗΝ ΠΕΡΙΠΤΩΣΗ ΚΑΘΩΣ ΔΕΝ ΘΑ ΕΚΤΕΛΕΙΤΑΙ ΠΡΙΝ ΑΠΟ ΤΟΝ ΕΥΑΛΩΤΟ ΚΩΔΙΚΑ, ΑΔΥΝΑΤΩΝΤΑΣ ΕΠΟΜΕΝΩΣ ΝΑ ΕΝΤΟΠΙΣΕΙ ΤΗΝ ΕΠΙΘΕΣΗ. ΜΗΝ ΟΡΙΣΕΤΕ ΑΥΤΗ ΤΗΝ ΕΠΙΛΟΓΗ ΣΕ &quot;ΟΧΙ&quot; ΕΑΝ ΔΕΝ ΕΙΣΤΕ ΕΙΔΙΚΟΣ ΚΑΙ ΔΕΝ ΚΑΤΑΝΟΕΙΤΕ ΤΙΣ ΣΥΝΕΠΕΙΕΣ."
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_LABEL="Προειδοποίηση για χειροκίνητες επεξεργασίες σε αρχεία ρυθμίσεων διακομιστή"
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_DESC="Το Admin Tools θα ελέγχει εάν επεξεργαστήκατε χειροκίνητα ένα αρχείο ρυθμίσεων διακομιστή (δηλ. .htaccess, nginx.conf ή web.config) αντί να χρησιμοποιήσατε τον Δημιουργό Htaccess, NginX ή WebConfig"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_LABEL="Υπενθύμιση όταν το αρχείο καταγραφής εντοπισμού σφαλμάτων είναι ενεργοποιημένο"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_DESC="Εμφανίζει μια υπενθύμιση σε κάθε σελίδα της περιοχής διαχείρισης του ιστότοπού σας όσο είναι ενεργοποιημένη η επιλογή «Διατήρηση αρχείου καταγραφής εντοπισμού σφαλμάτων» του Ρύθμιση Παραμέτρων WAF. Το αρχείο καταγραφής εντοπισμού σφαλμάτων προορίζεται μόνο για την αντιμετώπιση προβλημάτων. Καταγράφει λεπτομερώς κάθε αποκλεισμένο αίτημα, συμπεριλαμβανομένων των δεδομένων φορμών που υποβλήθηκαν, σε μη κρυπτογραφημένο αρχείο."
COM_ADMINTOOLS_JCONFIG_USAGESTATS_LABEL="Ενεργοποίηση ανώνυμης αναφοράς εκδόσεων PHP, MySQL και Joomla!"
COM_ADMINTOOLS_JCONFIG_USAGESTATS_DESC="Βοηθήστε μας να βελτιώσουμε το λογισμικό μας αναφέροντας ανώνυμα και αυτόματα τις εκδόσεις PHP, MySQL και Joomla! που χρησιμοποιείτε. Αυτές οι πληροφορίες θα μας βοηθήσουν να αποφασίσουμε ποιες εκδόσεις Joomla!, PHP και MySQL θα υποστηρίξουμε σε μελλοντικές εκδόσεις. Σημείωση: ΔΕΝ συλλέγουμε το όνομα του ιστότοπού σας, τη διεύθυνση IP ή οποιαδήποτε άλλη άμεση ή έμμεσα μοναδική ταυτοποιητική πληροφορία."
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_LABEL="Ακριβής διαδρομή PHP-CLI"
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_DESCRIPTION="Ενεργοποιήστε για να προσπαθήσει το Admin Tools να ανιχνεύσει την ακριβή διαδρομή PHP-CLI στον διακομιστή σας. Απενεργοποιήστε εάν ο διακομιστής σας δεν σας επιτρέπει να το κάνετε αυτό, κλειδώνοντας τη διεύθυνση IP σας εκτός του ιστότοπού σας για αρκετά λεπτά έως ώρες όταν συμβεί αυτό (για παράδειγμα IONOS)."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_LABEL="Παράκαμψη κατεστραμμένων Προτύπων Email στη Joomla! 5.2 και νεότερες εκδόσεις."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_DESC="Η Joomla! 5.2 εισήγαγε τη λειτουργία Διάταξης Προτύπου Email και την ενεργοποιεί από προεπιλογή. Ωστόσο, αυτή η λειτουργία <em>σπάει</em> τους συνδέσμους στα email εάν η διεύθυνση URL τους προέρχεται από μια μεταβλητή, όπως <code>{URL}</code>, προσθέτοντας τη διεύθυνση URL του ιστότοπου μπροστά από τη διεύθυνση URL, καθιστώντας την έτσι μη έγκυρη. Αυτό επηρεάζει ακόμη και τα δικά της συστατικά της Joomla!. Παρόλο που δεν μπορούμε να διορθώσουμε την ίδια τη Joomla!, μπορούμε να παρέχουμε μια παράκαμψη για τα email που αποστέλλονται από το λογισμικό μας. Εάν για οποιονδήποτε λόγο δεν θέλετε αυτή την παράκαμψη, μπορείτε να την απενεργοποιήσετε ορίζοντας αυτή την επιλογή σε Όχι."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_LABEL="Διακομιστής Web"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_DESCRIPTION="Ποιον διακομιστή web χρησιμοποιείτε για τον ιστότοπό σας; Η χρήση του &quot;Αυτόματη ανίχνευση&quot; συνιστάται για τους περισσότερους ιστότοπους. Επιλέξτε τον τύπο του διακομιστή web σας μόνο εάν ο κεντρικός υπολογιστής σας έχει σκόπιμα καταστήσει τη μεταβλητή περιβάλλοντος <code>SERVER_SOFTWARE</code> μη προσβάσιμη στην PHP, ή έχει σκόπιμα ορίσει μια κενή ή παραπλανητική τιμή."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_AUTO="Αυτόματη ανίχνευση"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_APACHE="Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_LITESPEED="LiteSpeed"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_NGINX="NginX"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_IIS="IIS"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_LABEL="Έκδοση διακομιστή web Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_DESCRIPTION="Εάν χρησιμοποιείτε τον διακομιστή web Apache, επιλέξτε ποια έκδοση του Apache είναι. Η χρήση του &quot;Αυτόματη ανίχνευση&quot; συνιστάται για τους περισσότερους ιστότοπους. Επιλέξτε την έκδοση μόνο εάν ο κεντρικός υπολογιστής σας έχει σκόπιμα καταστήσει τη μεταβλητή περιβάλλοντος <code>SERVER_SOFTWARE</code> μη προσβάσιμη στην PHP, ή έχει σκόπιμα ορίσει μια κενή ή παραπλανητική τιμή."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_AUTO="Αυτόματη ανίχνευση"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_1_3="1.3"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_0="2.0"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_2="2.2"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_4="2.4"
