COM_ADMINTOOLS_OBSOLETECORE_LBL_FAILED_INTRO_N="%d παρωχημένα αρχεία και φάκελοι υπάρχουν ακόμη στον ιστότοπό σας και το Admin Tools δεν μπόρεσε να τα αφαιρέσει:"
