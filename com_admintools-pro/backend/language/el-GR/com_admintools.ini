COM_ADMINTOOLS_MAIL_USERREACTIVATE_TITLE="Admin Tools: Επανενεργοποίηση χρήστη"
COM_ADMINTOOLS_MAIL_USERREACTIVATE_DESC="Αποστέλλεται από το Admin Tools κάθε φορά που ένας λογαριασμός χρήστη απενεργοποιείται προσωρινά λόγω υπερβολικά πολλών αποτυχημένων συνδέσεων."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_SUBJECT="Ο λογαριασμός χρήστη αποκλείστηκε προσωρινά στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY="Γεια σας,\n\nΕντοπίσαμε αρκετές αποτυχημένες προσπάθειες σύνδεσης με τον λογαριασμό χρήστη {USER} στον ιστότοπό μας {SITENAME}. Ως αποτέλεσμα, το σύστημά μας έχει θέσει αυτόματα έναν προσωρινό αποκλεισμό στον λογαριασμό χρήστη στις {DATE}.\n\nΑν πιστεύετε ότι λαμβάνετε αυτό το μήνυμα κατά λάθος, δηλαδή ήσασταν εσείς που προσπαθήσατε κατά λάθος να συνδεθείτε με λάθος κωδικό πρόσβασης, κάντε κλικ στον παρακάτω σύνδεσμο για να άρετε τον προσωρινό αποκλεισμό από τον λογαριασμό χρήστη σας:\n{ACTIVATE}\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή διαθέτετε λογαριασμό χρήστη στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY_HTML="<p>Γεια σας,</p><p>Εντοπίσαμε αρκετές αποτυχημένες προσπάθειες σύνδεσης με τον λογαριασμό χρήστη {USER} στον ιστότοπό μας {SITENAME}. Ως αποτέλεσμα, το σύστημά μας έχει θέσει αυτόματα έναν προσωρινό αποκλεισμό στον λογαριασμό χρήστη στις {DATE}.</p><p>Αν πιστεύετε ότι λαμβάνετε αυτό το μήνυμα κατά λάθος, δηλαδή ήσασταν εσείς που προσπαθήσατε κατά λάθος να συνδεθείτε με λάθος κωδικό πρόσβασης, κάντε κλικ στον παρακάτω σύνδεσμο για να άρετε τον προσωρινό αποκλεισμό από τον λογαριασμό χρήστη σας:</p><p><a href=\"{ACTIVATE}\">{ACTIVATE}</a></p><p>Με εκτίμηση,</p><p>Η ομάδα του {SITENAME}</p><p><small>Σημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή διαθέτετε λογαριασμό χρήστη στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_TITLE="Admin Tools: Αποτυχημένη σύνδεση διαχειριστή"
COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_DESC="Αποστέλλεται από το Admin Tools όταν γίνεται μια αποτυχημένη προσπάθεια σύνδεσης στο backend, εφόσον η αντίστοιχη δυνατότητα είναι ενεργοποιημένη."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_SUBJECT="Αποτυχημένη σύνδεση διαχειριστή για τον χρήστη {USER} στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι ο χρήστης {USER} δεν συνδέθηκε με επιτυχία στην περιοχή διαχείρισης backend του ιστοτόπου σας, {SITENAME}. Περαιτέρω πληροφορίες:\n\nΌνομα Χρήστη: {USER}\nΔιεύθυνση IP: {IP} ({LOOKUP})\nΣυμβολοσειρά User Agent προγράμματος περιήγησης: {UA}\n\nΑν αυτό αναμενόταν, δεν χρειάζεται να κάνετε τίποτα. Αν υποψιάζεστε μια απόπειρα παραβίασης, συνδεθείτε αμέσως στο backend του ιστοτόπου σας και ενεργοποιήστε αμέσως την Κατάσταση Έκτακτης Ανάγκης Εκτός Σύνδεσης του Admin Tools.\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι ο χρήστης <strong>{USER}</strong> <strong>δεν</strong> συνδέθηκε με επιτυχία στην περιοχή διαχείρισης backend του ιστοτόπου σας, {SITENAME}. Περαιτέρω πληροφορίες:</p><p>Όνομα Χρήστη: {USER}<br />Διεύθυνση IP: {IP} (<a href=\"{LOOKUP}\">Αναζήτηση IP</a>)<br />Συμβολοσειρά User Agent προγράμματος περιήγησης: {UA}</p><p>Αν αυτό αναμενόταν, δεν χρειάζεται να κάνετε τίποτα. Αν υποψιάζεστε μια απόπειρα παραβίασης, συνδεθείτε αμέσως στο backend του ιστοτόπου σας και ενεργοποιήστε αμέσως την Κατάσταση Έκτακτης Ανάγκης Εκτός Σύνδεσης του Admin Tools.</p><p>Με εκτίμηση,</p><p>Η ομάδα του {SITENAME}</p><p><small>Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο <em>{SITENAME}</em>. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_TITLE="Admin Tools: Επιτυχής σύνδεση διαχειριστή"
COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_DESC="Αποστέλλεται από το Admin Tools όταν γίνεται μια επιτυχής προσπάθεια σύνδεσης στο backend, εφόσον η αντίστοιχη δυνατότητα είναι ενεργοποιημένη."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_SUBJECT="Ο χρήστης {USER} συνδέθηκε στην περιοχή διαχείρισης του {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι ο χρήστης {USER} μόλις συνδέθηκε στην περιοχή διαχείρισης backend του ιστοτόπου σας, {SITENAME}. Περαιτέρω πληροφορίες:\n\nΌνομα Χρήστη: {USER}\nΔιεύθυνση IP: {IP} ({LOOKUP})\nΣυμβολοσειρά User Agent προγράμματος περιήγησης: {UA}\n\nΑν αυτό αναμενόταν, δεν χρειάζεται να κάνετε τίποτα. Αν υποψιάζεστε μια απόπειρα παραβίασης, συνδεθείτε αμέσως στο backend του ιστοτόπου σας και ενεργοποιήστε αμέσως την Κατάσταση Έκτακτης Ανάγκης Εκτός Σύνδεσης του Admin Tools.\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
