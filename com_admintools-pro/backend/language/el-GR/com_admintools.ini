COM_ADMINTOOLS_CLI_IMPORT_FILE_MISSING="Λείπει ή δεν είναι έγκυρο το αρχείο '%s'"
COM_ADMINTOOLS_CLI_IMPORT_OPT_FILE="Αρχείο που περιέχει ρυθμίσεις κωδικοποιημένες σε JSON"
COM_ADMINTOOLS_CLI_IMPORT_ERRORS="Παρουσιάστηκε σφάλμα κατά την εισαγωγή δεδομένων: %s"
COM_ADMINTOOLS_CLI_IMPORT_PARTIAL="Η εισαγωγή δεν είναι ατομική λειτουργία. Ορισμένες από τις ρυθμίσεις του αρχείου ενδέχεται να έχουν ήδη εφαρμοστεί πριν προκύψει το σφάλμα. Παρακαλώ ελέγξτε τις ρυθμίσεις σας."
COM_ADMINTOOLS_CLI_IMPORT_SUCCESS="Τα δεδομένα εισήχθησαν επιτυχώς από το %s"
