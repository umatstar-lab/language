COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_APPLIED="Ο ιστότοπός σας βρίσκεται τώρα σε Κατάσταση Έκτακτης Ανάγκης Εκτός Σύνδεσης"
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREAPPLY="Κάνοντας κλικ στο παρακάτω κουμπί, ο ιστότοπός σας θα τεθεί σε Κατάσταση Έκτακτης Ανάγκης Εκτός Σύνδεσης. Σε αυτή την κατάσταση, κανείς δεν θα μπορεί να αποκτήσει πρόσβαση στον ιστότοπό σας, εκτός από επισκέπτες που προέρχονται από την τρέχουσα διεύθυνση IP σας. Εάν η σύνδεσή σας στο Διαδίκτυο διακοπεί ή η IP σας αλλάξει για οποιονδήποτε λόγο, ο μόνος τρόπος πρόσβασης στον ιστότοπό σας θα είναι η αφαίρεση του αρχείου <code>.htaccess</code> από τον ριζικό κατάλογο του ιστότοπού σας μέσω FTP. Παρακαλούμε διαβάστε αυτές τις οδηγίες προσεκτικά και εκτυπώστε αυτή τη σελίδα για αναφορά."
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREAPPLYMANUAL="Σε περίπτωση που αυτό το αυτοματοποιημένο εργαλείο αποτύχει να δημιουργήσει το αρχείο <code>.htaccess</code> στον ριζικό κατάλογο του ιστότοπού σας, αφαιρέστε το τρέχον <code>.htaccess</code> (εάν υπάρχει) και δημιουργήστε ένα νέο αρχείο <code>.htaccess</code> με το ακόλουθο περιεχόμενο:"
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREUNAPPLY="Κάνοντας κλικ στο κουμπί Ορισμός Εκτός Σύνδεσης θα εφαρμοστεί εκ νέου το αρχείο <code>.htaccess</code> της Κατάστασης Έκτακτης Ανάγκης Εκτός Σύνδεσης στον ριζικό κατάλογο του ιστότοπού σας. Κάνοντας κλικ στο κουμπί Ορισμός Σε Σύνδεση, το αρχείο αυτό θα αφαιρεθεί."
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREUNAPPLYMANUAL="Εάν η επαναφορά του ιστότοπού σας σε σύνδεση αποτύχει, μπορείτε ακόμα να το κάνετε χρησιμοποιώντας FTP, SFTP ή τον διαχειριστή αρχείων του πίνακα ελέγχου φιλοξενίας σας. Αφαιρέστε το τρέχον αρχείο <code>.htaccess</code> από τον ριζικό κατάλογο του ιστότοπού σας. Στη συνέχεια, μετονομάστε το αρχείο <code>.htaccess.eom</code> πίσω σε <code>.htaccess</code>."
