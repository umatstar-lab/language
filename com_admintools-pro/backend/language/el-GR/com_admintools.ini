COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_TITLE="Admin Tools: Email αντιμετώπισης προβλημάτων"
COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_DESC="Αποστέλλεται κάθε φορά που κάνετε μια αλλαγή στις ρυθμίσεις του Admin Tools η οποία θα μπορούσε να σας κλειδώσει έξω από τον ιστότοπό σας."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_SUBJECT="Πληροφορίες αντιμετώπισης προβλημάτων Admin Tools"
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY="Γεια σας {USER},\n\nΜόλις {ACTION} χρησιμοποιώντας το συστατικό Admin Tools στον ιστότοπό σας \"{SITENAME}\". Αυτή είναι γενικά μια ασφαλής διαδικασία. Σε ορισμένες περιπτώσεις, μια παρανόηση, μια παράλειψη ή η παραμόρφωση των ρυθμίσεών σας από ένα πρόγραμμα περιήγησης ή διακομιστή μπορεί να οδηγήσει σε δυσλειτουργία ή αδυναμία πρόσβασης στον ιστότοπό σας. Αυτό ισχύει τόσο για το ίδιο το Joomla! όσο και για τις επεκτάσεις τρίτων. Σε αυτήν την απίθανη περίπτωση, παρακαλούμε συμβουλευτείτε τις παρακάτω διευθύνσεις URL για οδηγίες αντιμετώπισης προβλημάτων:\n\n{TROUBLESHOOTING_URLS}\n\nΑν δεν μπορείτε να βρείτε λύση μόνοι σας και διαθέτετε ενεργή συνδρομή για το Admin Tools, παρακαλούμε υποβάλετε ένα αίτημα υποστήριξης στον ιστότοπό μας, https://www.akeeba.com και ενημερώστε μας τι κάνατε πριν εμφανιστεί το πρόβλημα, ποιο είναι το πρόβλημα και ποια βήματα αντιμετώπισης προβλημάτων έχετε ήδη δοκιμάσει.\n\nΠοιος έστειλε αυτό το email;\n======================================================================\n\nΑυτό το email αποστέλλεται αυτόματα από το Admin Tools που εκτελείται στον ιστότοπό σας στη διεύθυνση ηλεκτρονικής αλληλογραφίας που είναι καταχωρημένη στο προφίλ χρήστη σας στο Joomla! κάθε φορά που εκτελείτε μια διαχειριστική ενέργεια που θα μπορούσε κατά λάθος να σας κλειδώσει έξω από τον ιστότοπό σας. Δεν αποστέλλεται σε άλλους χρήστες του ιστοτόπου σας.\n\nΑν δεν επιθυμείτε πλέον να λαμβάνετε αυτά τα email, συνδεθείτε στο περιβάλλον διαχείρισης του ιστοτόπου σας και μεταβείτε στα Συστατικά, Admin Tools, Web Application Firewall, Ρύθμιση WAF και κάντε κλικ στην καρτέλα Προσαρμογή. Βρείτε την επιλογή «Αποστολή email αντιμετώπισης προβλημάτων σε διαχειριστικές λειτουργίες» και ορίστε την σε Όχι."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY_HTML="<p>Γεια σας {USER},</p><p>Μόλις {ACTION} χρησιμοποιώντας το συστατικό Admin Tools στον ιστότοπό σας \"{SITENAME}\". Αυτή είναι γενικά μια ασφαλής διαδικασία. Σε ορισμένες περιπτώσεις, μια παρανόηση, μια παράλειψη ή η παραμόρφωση των ρυθμίσεών σας από ένα πρόγραμμα περιήγησης ή διακομιστή μπορεί να οδηγήσει σε δυσλειτουργία ή αδυναμία πρόσβασης στον ιστότοπό σας. Αυτό ισχύει τόσο για το ίδιο το Joomla! όσο και για τις επεκτάσεις τρίτων. Σε αυτήν την απίθανη περίπτωση, παρακαλούμε συμβουλευτείτε τις παρακάτω διευθύνσεις URL για οδηγίες αντιμετώπισης προβλημάτων:</p>{TROUBLESHOOTING_URLS_HTML}<p>Αν δεν μπορείτε να βρείτε λύση μόνοι σας και διαθέτετε ενεργή συνδρομή για το Admin Tools, παρακαλούμε υποβάλετε ένα αίτημα υποστήριξης στον ιστότοπό μας, https://www.akeeba.com και ενημερώστε μας τι κάνατε πριν εμφανιστεί το πρόβλημα, ποιο είναι το πρόβλημα και ποια βήματα αντιμετώπισης προβλημάτων έχετε ήδη δοκιμάσει.</p><h3>Ποιος έστειλε αυτό το email;</h3><p>Αυτό το email αποστέλλεται αυτόματα από το Admin Tools που εκτελείται στον ιστότοπό σας στη διεύθυνση ηλεκτρονικής αλληλογραφίας που είναι καταχωρημένη στο προφίλ χρήστη σας στο Joomla! κάθε φορά που εκτελείτε μια διαχειριστική ενέργεια που θα μπορούσε κατά λάθος να σας κλειδώσει έξω από τον ιστότοπό σας. Δεν αποστέλλεται σε άλλους χρήστες του ιστοτόπου σας.</p><p>Αν δεν επιθυμείτε πλέον να λαμβάνετε αυτά τα email, συνδεθείτε στο περιβάλλον διαχείρισης του ιστοτόπου σας και μεταβείτε στα Συστατικά, Admin Tools, Web Application Firewall, Ρύθμιση WAF και κάντε κλικ στην καρτέλα Προσαρμογή. Βρείτε την επιλογή «Αποστολή email αντιμετώπισης προβλημάτων σε διαχειριστικές λειτουργίες» και ορίστε την σε Όχι.</p>"

COM_ADMINTOOLS_MAIL_CONFIGMONITOR_TITLE="Admin Tools: Παρακολούθηση Ρυθμίσεων"
COM_ADMINTOOLS_MAIL_CONFIGMONITOR_DESC="Αποστέλλεται από το Admin Tools κάθε φορά που αλλάζετε τις Γενικές Ρυθμίσεις ή τις επιλογές ρύθμισης παραμέτρων ενός συστατικού, όταν οι επιλογές «Παρακολούθηση Γενικών Ρυθμίσεων» ή/και «Παρακολούθηση ρυθμίσεων παραμέτρων συστατικού» είναι ενεργοποιημένες στο Web Application Firewall."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_SUBJECT="Τροποποιήθηκαν οι επιλογές ρύθμισης παραμέτρων για {AREA} στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι οι επιλογές ρύθμισης παραμέτρων για {AREA} στον ιστότοπό σας, {SITENAME}, τροποποιήθηκαν από τον χρήστη {USER}. Οι ρυθμίσεις που άλλαξαν παρατίθενται παρακάτω:\n\n{INFO}\n\nΠερισσότερες λεπτομέρειες σχετικά με την προέλευση αυτής της αλλαγής ακολουθούν:\n\nΔιεύθυνση IP: {IP} (Αναζήτηση IP: {LOOKUP})\nUser Agent: {UA}\n\nΑν αυτή η αλλαγή δεν έγινε από εσάς ή έναν διαχειριστή που εμπιστεύεστε, παρακαλούμε ελέγξτε αμέσως τον ιστότοπό σας, καθώς αυτό θα μπορούσε να είναι ένδειξη δραστηριότητας παραβίασης.\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι οι επιλογές ρύθμισης παραμέτρων για {AREA} στον ιστότοπό σας, {SITENAME}, τροποποιήθηκαν από τον χρήστη {USER}. Οι ρυθμίσεις που άλλαξαν παρατίθενται παρακάτω:</p>{INFO_HTML}<p>Περισσότερες λεπτομέρειες σχετικά με την προέλευση αυτής της αλλαγής ακολουθούν:</p><ul><li>Διεύθυνση IP: {IP} (<a href=\"{LOOKUP}\">Αναζήτηση IP</a>)</li><li>User Agent: {UA}</li></ul><p>Αν αυτή η αλλαγή δεν έγινε από εσάς ή έναν διαχειριστή που εμπιστεύεστε, παρακαλούμε ελέγξτε αμέσως τον ιστότοπό σας, καθώς αυτό θα μπορούσε να είναι ένδειξη δραστηριότητας παραβίασης.</p><p>Με εκτίμηση,</p><p>Η ομάδα του {SITENAME}</p><p><small>Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο <em>{SITENAME}</em>. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση.</small></p>"
