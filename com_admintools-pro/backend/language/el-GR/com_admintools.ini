COM_ADMINTOOLS_TITLE_QUICKSTART="Οδηγός Γρήγορης Εγκατάστασης"

COM_ADMINTOOLS_QUICKSTART_ADMINISTRATORPASSORD_INFO="Κάθε φορά που επισκέπτεστε την περιοχή σύνδεσης <code>administrator</code> θα πρέπει να εισάγετε αυτό το όνομα χρήστη και κωδικό πρόσβασης στο πρόγραμμα περιήγησής σας πριν δείτε τη φόρμα σύνδεσης όπου μπορείτε να εισάγετε το όνομα χρήστη και τον κωδικό πρόσβασης Joomla! σας. Αυτό θα επιβραδύνει σημαντικά τους χάκερ."
COM_ADMINTOOLS_QUICKSTART_ADMINLOGINEMAIL_DESC="Κάθε φορά που εντοπίζεται απόπειρα σύνδεσης διαχειριστή, επιτυχής ή αποτυχημένη, θα αποστέλλεται ηλεκτρονικό μήνυμα σε αυτή τη διεύθυνση με πληροφορίες σχετικά με το όνομα χρήστη σύνδεσης, τη διεύθυνση IP κ.λπ."
COM_ADMINTOOLS_QUICKSTART_ADMINLOGINEMAIL_LBL="Αποστολή ηλεκτρονικού μηνύματος για όλες τις απόπειρες σύνδεσης διαχειριστή"
COM_ADMINTOOLS_QUICKSTART_ALMOSTTHERE_INTRO="Είμαστε σχεδόν έτοιμοι. Πριν προχωρήσετε, πρέπει να γνωρίζετε τι να κάνετε αν κάτι πάει στραβά. Το Admin Tools είναι ένα εργαλείο ασφαλείας που αλλάζει τον τρόπο λειτουργίας του ιστοτόπου σας. Ανάλογα με το τι προσπαθείτε να κάνετε και τη ρύθμιση παραμέτρων του Admin Tools, μπορεί μερικές φορές να επηρεάζει τον τρόπο λειτουργίας τόσο του ίδιου του Joomla! όσο και των διαφόρων επεκτάσεών του. Εάν δεν μπορείτε να συνδεθείτε ή να αποκτήσετε πρόσβαση στον ιστοτόπο σας, ή έχετε κάποιο άλλο μη αναγνωρισμένο πρόβλημα κατά τη χρήση του ιστοτόπου σας αμέσως μετά την εφαρμογή αυτού του οδηγού, ανατρέξτε στις παρακάτω διευθύνσεις URL για οδηγίες αντιμετώπισης προβλημάτων:"
COM_ADMINTOOLS_QUICKSTART_ALMOSTTHERE_OUTRO="Πριν κάνετε κλικ στο παρακάτω κουμπί, <strong>παρακαλώ εκτυπώστε αυτή τη σελίδα ή τραβήξτε ένα στιγμιότυπο οθόνης</strong> για αναφορά σας."
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_BODY="Έχετε ήδη ρυθμίσει το Admin Tools, είτε χειροκίνητα είτε εκτελώντας αυτόν τον Οδηγό Γρήγορης Εγκατάστασης στο παρελθόν. Δεν συνιστάται ούτε υποστηρίζεται η εκ νέου εκτέλεση του Οδηγού Γρήγορης Εγκατάστασης. Κάτι τέτοιο θα αντικαταστήσει τη ρύθμιση παραμέτρων του Admin Tools, πιθανώς προκαλώντας βλάβη στον ιστοτόπο σας. Είστε σίγουροι ότι θέλετε να συνεχίσετε;"
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_BTN_NO="Όχι, πίσω!"
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_BTN_YES="Ναι, εκτέλεση του Οδηγού Γρήγορης Εγκατάστασης"
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_HEAD="Έχετε ήδη ρυθμίσει το Admin Tools."
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_NOSUPPORT_BODY="Η χρήση αυτού του οδηγού θα αντικαταστήσει όλες τις ρυθμίσεις παραμέτρων του Admin Tools. Εάν δεν θέλετε να αντικαταστήσετε ΟΛΕΣ τις ρυθμίσεις του Admin Tools, κάντε κλικ στο κουμπί Πίσω τώρα."
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_NOSUPPORT_HEAD="Πρόκειται να αντικαταστήσετε όλες τις ρυθμίσεις παραμέτρων σας"
COM_ADMINTOOLS_QUICKSTART_AUTOBAN_DESC="Εάν ένα αίτημα από την ίδια διεύθυνση IP αποκλειστεί τρεις ή περισσότερες φορές σε ένα λεπτό, θα αποκλειστεί από την πρόσβαση στον ιστοτόπο σας για 15 λεπτά."
COM_ADMINTOOLS_QUICKSTART_AUTOBAN_LBL="Αυτόματος αποκλεισμός υπότροπων"
COM_ADMINTOOLS_QUICKSTART_AUTOBLACKLIST_DESC="Εάν η IP ενός υπότροπου αποκλειστεί αυτόματα τρεις ή περισσότερες φορές, η IP του θα προστεθεί μόνιμα στη Λίστα Μη Επιτρεπόμενων IP, πράγμα που σημαίνει ότι δεν θα μπορεί πλέον να αποκτήσει πρόσβαση στον ιστοτόπο σας."
COM_ADMINTOOLS_QUICKSTART_AUTOBLACKLIST_LBL="Προσθήκη επαναλαμβανόμενων αποκλεισμένων IP στη Λίστα Μη Επιτρεπόμενων IP"
COM_ADMINTOOLS_QUICKSTART_ENABLEWAF_DESC="Η ενεργοποίηση του Web Application Firewall θα επιτρέψει στο Admin Tools να σας προστατεύει από τις πιο συνηθισμένες επιθέσεις στον ιστοτόπο σας. Μπορείτε να βελτιώσετε αυτή την προστασία αργότερα από τη σελίδα WAF, Ρύθμιση Παραμέτρων WAF του Admin Tools."
COM_ADMINTOOLS_QUICKSTART_ENABLEWAF_LBL="Ενεργοποίηση Web Application Firewall"
COM_ADMINTOOLS_QUICKSTART_HEAD_ADMINSECURITY="Ασφάλεια διαχειριστή"
COM_ADMINTOOLS_QUICKSTART_HEAD_ADVANCEDSECURITY="Προηγμένη ασφάλεια"
COM_ADMINTOOLS_QUICKSTART_HEAD_ALMOSTTHERE="Είμαστε σχεδόν έτοιμοι..."
COM_ADMINTOOLS_QUICKSTART_HTMAKER_DESC="Αυτό το αρχείο .htaccess θα αποτρέψει πολλούς τύπους επιθέσεων σε επίπεδο διακομιστή ιστού."
COM_ADMINTOOLS_QUICKSTART_HTMAKER_LBL="Δημιουργία αρχείου .htaccess ενίσχυσης ασφαλείας"
COM_ADMINTOOLS_QUICKSTART_INTRO="Αυτός ο οδηγός θα σας καθοδηγήσει στη βασική ρύθμιση παραμέτρων του Admin Tools. Τοποθετήστε τον δείκτη του ποντικιού σας πάνω από κάθε ετικέτα για να λάβετε περισσότερες πληροφορίες σχετικά με τη λειτουργία κάθε επιλογής. Παρακαλώ χρησιμοποιήστε τον μόνο σε νέα εγκατάσταση του Admin Tools. Θα αντικαταστήσει τυχόν ρυθμίσεις που μπορεί να έχετε ήδη ορίσει. Αυτός ο οδηγός δεν προορίζεται ως υποκατάστατο της ανάγνωσης της <a href=\"%s\">τεκμηρίωσης</a> και της λεπτομερούς προσαρμογής της προστασίας για τον ιστοτόπο σας."
COM_ADMINTOOLS_QUICKSTART_MSG_DONE="Οι προτιμήσεις ρύθμισης του Admin Tools αποθηκεύτηκαν"
COM_ADMINTOOLS_QUICKSTART_MSG_HTMAKERNOTAPPLIED="Δεν ήταν δυνατή η εγγραφή του αρχείου .htaccess. Μεταβείτε στη σελίδα Δημιουργός .htaccess και χρησιμοποιήστε το κουμπί Προεπισκόπηση για να λάβετε τα περιεχόμενα του νέου αρχείου .htaccess. Στη συνέχεια, ανεβάστε το αρχείο χειροκίνητα σύμφωνα με τις οδηγίες τεκμηρίωσης."
COM_ADMINTOOLS_QUICKSTART_MSG_IPADDEDBYWIZARD="Η IP σας όπως εντοπίστηκε από τον Οδηγό Γρήγορης Εγκατάστασης"
COM_ADMINTOOLS_QUICKSTART_NONEWADMINS_DESC="Δεν θα μπορείτε πλέον να επεξεργάζεστε ή να δημιουργείτε χρήστες με πρόσβαση στην περιοχή διαχειριστή, π.χ. Υπέρ-Χρήστες ή Διαχειριστές. Επίσης, δεν θα μπορείτε να μετατρέψετε υπάρχοντες χρήστες σε Υπέρ-Χρήστες, Διαχειριστές κ.λπ. Η προσπάθεια κάτι τέτοιου θα έχει ως αποτέλεσμα μήνυμα σφάλματος 403 Άρνηση Πρόσβασης."
COM_ADMINTOOLS_QUICKSTART_WHITELIST_DESC="Η πρόσβαση στην περιοχή διαχειριστή θα επιτρέπεται μόνο σε μια προκαθορισμένη λίστα διευθύνσεων IP. Από προεπιλογή, αυτή περιλαμβάνει μόνο την τρέχουσα διεύθυνση IP σας, <code>%s</code>."
COM_ADMINTOOLS_QUICKSTART_MSG_PLEASERUNWIZARD="Το Admin Tools δεν προστατεύει ακόμα τον ιστοτόπο σας. Παρακαλώ εκτελέστε τον <a href='%s'>Οδηγό Γρήγορης Εγκατάστασης</a> για να ρυθμίσετε το Admin Tools στον ιστοτόπο σας."


