COM_ADMINTOOLS_CLI_SERVERCONFIGLIST_DESC="Λίστα όλων των κανόνων ρυθμίσεων διακομιστή"
COM_ADMINTOOLS_CLI_SERVERCONFIGLIST_HELP="<info>%command.name%</info> θα εμφανίσει τους κανόνες Ρύθμισης Παραμέτρων Διακομιστή του Admin Tools.\nΧρήση: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_ERR_NO_ACTION="Πρέπει να χρησιμοποιήσετε μία από τις επιλογές --value, --add, --remove και --empty για να δηλώσετε τι θέλετε να κάνετε."
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_ERR_MUTUALLY_EXCLUSIVE="Οι επιλογές --value, --add, --remove και --empty είναι αμοιβαία αποκλειόμενες. Μπορείτε να χρησιμοποιήσετε μόνο μία από αυτές."
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_ERR_VALUE_ON_LIST="Η επιλογή \"%s\" περιέχει μια λίστα τιμών. Χρησιμοποιήστε τις --add, --remove ή --empty για να την αλλάξετε, όχι την --value."
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_ERR_LIST_NOTALLOWED="Οι επιλογές --add, --remove και --empty ισχύουν μόνο για επιλογές που περιέχουν λίστα τιμών. Χρησιμοποιήστε την --value για να αλλάξετε την επιλογή \"%s\"."
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_LBL_UNCHANGED="Η τιμή της επιλογής ρύθμισης παραμέτρων διακομιστή '%s' παρέμεινε αμετάβλητη."
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_LBL_SETTING="Η τιμή της επιλογής ρύθμισης παραμέτρων διακομιστή '%s' άλλαξε."
