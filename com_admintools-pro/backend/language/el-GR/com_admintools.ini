COM_ADMINTOOLS_REDIRECTION_LBL_DEST="Επίσκεψη αυτού"
COM_ADMINTOOLS_REDIRECTION_LBL_DEST_DESC="Αυτό είναι ένα σχετικό URL στον ιστοτόπό σας. Όταν κάποιος το επισκεφτεί, θα ανακατευθυνθεί στο URL «Μεταφορά εδώ» παρακάτω. Δεν πρέπει να έχει το πρόθεμα πρωτοκόλλου http:// ή https://, το όνομα τομέα σας ή μια αρχική κάθετο. Παραδείγματα: <code>search/on/google</code> ή <code>456-blog/123-my-article</code>. Σημειώστε ότι δεν μπορείτε να ορίσετε το τμήμα (το σύμβολο <code>#</code> στο URL και ό,τι ακολουθεί) καθώς αυτή είναι μια λειτουργία από την πλευρά του προγράμματος-πελάτη· ο διακομιστής σας ΔΕΝ βλέπει το τμήμα, επομένως δεν μπορούμε να πραγματοποιήσουμε ανακατεύθυνση από την πλευρά του διακομιστή με βάση τα περιεχόμενα του τμήματος."
COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE="Μεταφορά εδώ"
