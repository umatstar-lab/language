COM_ADMINTOOLS_CONTROLPANEL_LBL_RELOADUPDATE="Ανανέωση πληροφοριών ενημέρωσης"
COM_ADMINTOOLS_CONTROLPANEL_LBL_UPDATE_INFORMATION_RELOADED="Οι πληροφορίες ενημέρωσης έχουν ανανεωθεί από τον διακομιστή"

COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_HEAD="Κατάσταση Διάσωσης"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_MESSAGE="Το Admin Tools εκτελείται σε Κατάσταση Διάσωσης. Αυτή είναι μια λειτουργία αντιμετώπισης προβλημάτων που σας επιτρέπει να αποκαταστήσετε την πρόσβασή σας εάν κατά λάθος έχετε κλειδωθεί έξω από τον ιστότοπό σας. Οι προστασίες του Admin Tools είναι προσωρινά απενεργοποιημένες μόνο για την πρόσβαση διαχειριστή από τον λογαριασμό σας και μόνο από το πρόγραμμα περιήγησης και τη διεύθυνση IP σας. Ενώ βλέπετε αυτό το μήνυμα, το Admin Tools συνεχίζει να προστατεύει τον ιστότοπό σας."
