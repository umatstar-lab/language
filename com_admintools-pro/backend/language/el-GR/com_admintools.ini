COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_TIP="Για παράδειγμα, αν εισαγάγετε τη λέξη <code>test</code> εδώ, θα μπορείτε να αποκτήσετε πρόσβαση στην περιοχή διαχείρισης του ιστότοπού σας μόνο με URL παρόμοιο με <code>http://www.example.com/test</code>. Αν προσπαθήσετε να αποκτήσετε πρόσβαση ως <code>http://www.example.com/administrator</code> θα ανακατευθυνθείτε στην αρχική σελίδα του ιστότοπου. Αφού επισκεφθείτε το μυστικό URL με το πρόγραμμα περιήγησής σας, θα μπορείτε επίσης να επισκεφθείτε <code>http://www.example.com/administrator</code> χωρίς αποκλεισμό μέχρι να λήξει η συνεδρία σας. Αν δεν επιθυμείτε να χρησιμοποιήσετε αυτή τη λειτουργία, αφήστε αυτό το πεδίο κενό. Λάβετε υπόψη ότι αυτή η λειτουργία απαιτεί οι επιλογές <strong>SEF URLs</strong> και <strong>Χρήση επανεγγραφής URL</strong> στη σελίδα Γενικής Ρύθμισης Παραμέτρων του Joomla! να έχουν και οι δύο οριστεί σε Ναι."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_HEAD="Αυτή η λειτουργία είναι πειραματική και χωρίς υποστήριξη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_TEXT="Σε ορισμένους ιστότοπους ο <strong>Προσαρμοσμένος κατάλογος σύνδεσης διαχειριστή</strong> μπορεί να συμπεριφέρεται απρόβλεπτα, να μην λειτουργεί καθόλου ή να καθιστά αδύνατη τη σύνδεση. Το γνωρίζουμε και δεν υπάρχει λύση. Για αυτόν τον λόγο αυτή η λειτουργία παρέχεται <strong>ΧΩΡΙΣ ΥΠΟΣΤΗΡΙΞΗ</strong>. Παρακαλώ διαβάστε την τεκμηρίωση για περισσότερες πληροφορίες."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_DESC="Αυτό το μήνυμα θα εμφανίζεται στους χρήστες όταν το αίτημά τους θεωρείται ύποπτο παραβίασης ασφαλείας. Κρατήστε το σύντομο και ευγενικό. Αφήστε το κενό για να χρησιμοποιηθεί το προεπιλεγμένο μήνυμα."
