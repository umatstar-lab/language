COM_ADMINTOOLS_TITLE_NGINXCONFMAKER="Δημιουργός Ρυθμίσεων NginX"

COM_ADMINTOOLS_NGINXCONFMAKER_LBL_APPLIED="Το νέο nginx.conf έχει γραφτεί στον δίσκο. Θυμηθείτε να το συμπεριλάβετε ή να το αντιγράψετε μέσα στο αρχείο ρυθμίσεων του ιστότοπου NginX και να επαναφορτώσετε ή επανεκκινήσετε τον διακομιστή σας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_APPLY="Αποθήκευση και δημιουργία nginx.conf"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_EXCEPTIONPATHINFO="Αποδοχή path info για τα εξαιρούμενα αρχεία PHP"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_EXCEPTIONPATHINFO_NOTE="Τα εξαιρούμενα αρχεία PHP, καθώς και τα αρχεία PHP στους καταλόγους με άμεση πρόσβαση συμπεριλαμβανομένων των αρχείων .php, θα χειρίζονται επίσης URL όπου μια διαδρομή ακολουθεί το όνομα του αρχείου, π.χ. <code>foobar.php/baz.png</code>. Για να λάβει η PHP αυτή τη διαδρομή, η ρύθμιση <em>μπλοκ κώδικα fastcgi_pass</em> πρέπει να ορίζει τα <code>SCRIPT_FILENAME</code> και <code>PATH_INFO</code>· το αρχείο <code>fastcgi_params</code> που συνοδεύει το NginX δεν ορίζει το <code>PATH_INFO</code>. <a href=\"https://www.akeeba.com/documentation/admin-tools-joomla/nginx-server-protection.html#nginx-path-info\" target=\"_blank\">Διαβάστε την τεκμηρίωση</a> για την απαιτούμενη ρύθμιση και τα ζητήματα ασφαλείας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_NOTAPPLIED="Δεν ήταν δυνατή η εγγραφή του αρχείου nginx.conf. Χρησιμοποιήστε το κουμπί Προεπισκόπηση για να λάβετε τα περιεχόμενά του και συμπεριλάβετέ το χειροκίνητα στο αρχείο ρυθμίσεων του ιστότοπού σας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_RESET="Επαναφορά επιλογών Δημιουργού NginX"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_RESET_DONE="Οι επιλογές του Δημιουργού Nginx έχουν επαναφερθεί"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_SAVE="Αποθήκευση χωρίς δημιουργία nginx.conf"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_SAVED="Οι αλλαγές αποθηκεύτηκαν επιτυχώς. Μην ξεχάσετε να τις εφαρμόσετε δημιουργώντας το νέο αρχείο nginx.conf και επαναφορτώνοντας ή επανεκκινώντας τον διακομιστή NginX σας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_SYMLINKS_NEVER="Όχι, ποτέ"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_TUNETEXT="Εάν κάποιες πτυχές του ιστότοπού σας σταματήσουν ξαφνικά να λειτουργούν, εναπόκειται σε εσάς να βρείτε τις κατάλληλες εξαιρέσεις που απαιτούνται για τη σωστή τους λειτουργία. Οδηγίες παρέχονται στην τεκμηρίωση του συστατικού. Θυμηθείτε ότι οι ρυθμίσεις δεν τίθενται σε ισχύ μέχρι να επαναφορτώσετε ή επανεκκινήσετε τον διακομιστή NginX σας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WARNING="ΣΗΜΑΝΤΙΚΟ"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WARNTEXT="Λόγω του αποδοτικού τρόπου λειτουργίας του NginX, θα χρειαστεί να κάνετε δύο πράγματα για να έχουν αποτέλεσμα αυτές οι ρυθμίσεις. Πρώτα, θα πρέπει να αντιγράψετε τα περιεχόμενα του αρχείου ρυθμίσεων NginX για αυτόν τον ιστότοπο και να τα ενσωματώσετε στο κύριο αρχείο σας (αν πρόκειται για δοκιμαστικό ιστότοπο, μπορείτε απλώς να συμπεριλάβετε το αρχείο ιστότοπου προσθέτοντας τη γραμμή <code>include %s;</code> μέσα στον ορισμό του διακομιστή). Στη συνέχεια πρέπει να επαναφορτώσετε ή επανεκκινήσετε τον διακομιστή σας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK="Θα λειτουργήσει ο Δημιουργός Ρυθμίσεων NginX με τον διακομιστή μου;"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK_MAYBE="<b>Ίσως</b>. Δεν μπορέσαμε να εντοπίσουμε τον τύπο του διακομιστή, επομένως δεν γνωρίζουμε αν ο ιστότοπός σας υποστηρίζει αρχεία ρυθμίσεων NginX. Συμβουλευτείτε τον πάροχο φιλοξενίας σας σχετικά με την υποστήριξη αρχείων ρυθμίσεων NginX και τον σωστό τρόπο χρήσης ενός προσαρμοσμένου αρχείου nginx.conf με τον ιστότοπό σας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK_NO="<b>Όχι, καθόλου</b>. Εντοπίσαμε ότι χρησιμοποιείτε έναν τύπο διακομιστή που δεν είναι συμβατός με αρχεία ρυθμίσεων NginX (π.χ. Microsoft IIS, Apache, Lightspeed ή Lighttpd). Η χρήση του Δημιουργού Ρυθμίσεων NginX δεν θα έχει <strong>κανένα απολύτως αποτέλεσμα</strong> στον ιστότοπό σας."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK_YES="<b>Πιθανότατα ναι</b>. Εντοπίσαμε ότι ο τύπος του διακομιστή ιστού σας είναι NginX. Η υποστήριξη προσαρμοσμένης ρύθμισης ανά ιστότοπο εξαρτάται, ωστόσο, από τον πάροχο φιλοξενίας σας. Συμβουλευτείτε τον πάροχο φιλοξενίας σας σχετικά με τον σωστό τρόπο χρήσης ενός προσαρμοσμένου αρχείου nginx.conf με τον ιστότοπό σας."

