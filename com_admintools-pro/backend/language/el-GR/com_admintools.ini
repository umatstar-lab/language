COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN="Το Admin Tools εντόπισε ότι το αρχείο ρυθμίσεων του διακομιστή σας (π.χ. .htaccess, nginx.conf ή web.config) έχει τροποποιηθεί. Σας συνιστούμε ανεπιφύλακτα να τοποθετείτε οποιαδήποτε χειροκίνητη επεξεργασία εντός των πεδίων <strong>Προσαρμοσμένοι κανόνες</strong>, ώστε να μην τις χάσετε αν ποτέ αναδημιουργήσετε το αρχείο μέσω του Admin Tools"
