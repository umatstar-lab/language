COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_INTRO = "Αυτή η σελίδα σάς επιτρέπει να επιλέξετε συγκεκριμένα συστατικά, προβολές ή παραμέτρους αιτήματος <i>που ΔΕΝ θα προστατεύονται</i> από το Web Application Firewall. Οι εξαιρέσεις εφαρμόζονται σε δύο ομάδες:"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_A = "Όταν ορίζονται <i>όλες οι παράμετροι αιτήματος</i> για ένα συστατικό ή προβολή, οι παρακάτω λειτουργίες WAF απενεργοποιούνται εντελώς: Bad Behaviour, SQLiShield, XSSShield, MUAShield, RFIShield, DFIShield και φιλτράρισμα Απαγορευμένων Λέξεων"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_B = "Όταν ορίζονται <i>συγκεκριμένες παράμετροι αιτήματος</i> για ένα συστατικό ή προβολή, οι παρακάτω λειτουργίες WAF απενεργοποιούνται <i>μόνο για αυτές τις παραμέτρους</i>: SQLiShield, XSSShield, RFIShield, DFIShield, φιλτράρισμα Απαγορευμένων Λέξεων και Αποκλεισμός Ύποπτων Παραμέτρων URL"

