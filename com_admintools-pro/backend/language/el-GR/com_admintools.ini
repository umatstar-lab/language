COM_ADMINTOOLS_CLI_SERVERCONFIGSET_OPT_REMOVE="Αφαίρεση τιμής από την τρέχουσα λίστα τιμών (μόνο για υποστηριζόμενα κλειδιά)"
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_OPT_EMPTY="Εκκαθάριση όλων των αποθηκευμένων τιμών (μόνο για υποστηριζόμενα κλειδιά)"
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_DESC="Ορισμός συγκεκριμένου κανόνα ρυθμίσεων διακομιστή"
COM_ADMINTOOLS_CLI_SERVERCONFIGSET_HELP="<info>%command.name%</info> θα ορίσει έναν συγκεκριμένο κανόνα Ρύθμισης Παραμέτρων Διακομιστή του Admin Tools.\nΧρήση: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_SERVERCONFIGMAKE_DESC="Δημιουργεί αρχείο ρυθμίσεων διακομιστή σύμφωνα με τους κανόνες του Admin Tools"
COM_ADMINTOOLS_CLI_SERVERCONFIGMAKE_HELP="<info>%command.name%</info> θα δημιουργήσει το αρχείο ρυθμίσεων διακομιστή του Admin Tools.\nΧρήση: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_SERVERCONFIGMAKE_OPT_PREVIEW="Εμφάνιση των ρυθμίσεων αντί για εγγραφή στον δίσκο"
COM_ADMINTOOLS_CLI_SERVERCONFIGMAKE_OPT_VERSION="Εξαναγκασμός της Μηχανής Διακομιστή σε συγκεκριμένη έκδοση"
COM_ADMINTOOLS_CLI_SERVERCONFIGMAKE_OPT_WRITEKO="Παρουσιάστηκε σφάλμα κατά την εγγραφή του αρχείου ρυθμίσεων διακομιστή στον δίσκο"
COM_ADMINTOOLS_CLI_SERVERCONFIGMAKE_OPT_WRITEOK="Το αρχείο ρυθμίσεων διακομιστή γράφτηκε σωστά στον δίσκο"
COM_ADMINTOOLS_CLI_JUPDATE_LIST_DESC="Επαναφορά Ενημέρωσης Joomla!"
COM_ADMINTOOLS_CLI_JUPDATE_LIST_HELP="<info>%command.name%</info> θα επαναφέρει την Ενημέρωση Joomla! στις προεπιλεγμένες ρυθμίσεις.\nΧρήση: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_TEMP_CLEAR_DESC="Εκκαθάριση του προσωρινού καταλόγου"
COM_ADMINTOOLS_CLI_TEMP_CLEAR_HELP="<info>%command.name%</info> θα εκκαθαρίσει τα περιεχόμενα του προσωρινού καταλόγου του ιστότοπου.\nΤα αρχεία index.htm[l], .htaccess και web.config ΔΕΝ θα αφαιρεθούν.\nΧρήση: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_TEMP_CLEAR_OPT_AGE="Ελάχιστη ηλικία. Αρχεία/φάκελοι νεότεροι από αυτόν τον αριθμό δευτερολέπτων δεν θα αφαιρεθούν."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_DESC="Αφαίρεση παρωχημένων αρχείων και φακέλων του πυρήνα του Joomla!"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_HELP="Η <info>%command.name%</info> θα αφαιρέσει τα αρχεία και τους φακέλους του Joomla! που μια ενημέρωση του Joomla όφειλε να διαγράψει, αλλά δεν διέγραψε.\nΤα εναπομείναντα αρχεία πυρήνα μπορούν να προκαλέσουν ολική βλάβη στον ιστότοπό σας, συνήθως με ένα μοιραίο σφάλμα σχετικό με ένα class alias.\nΧρησιμοποιήστε το <info>--dry-run</info> για να δείτε τι θα αφαιρεθεί, χωρίς να αλλάξει τίποτα.\nΧρήση: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_OPT_DRYRUN="Εμφάνιση των παρωχημένων αρχείων και φακέλων που βρέθηκαν, και του αν η PHP μπορεί να γράψει σε αυτά, χωρίς να διαγραφεί τίποτα."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTHINGTODO="Δεν υπάρχουν παρωχημένα αρχεία ή φάκελοι του πυρήνα του Joomla! σε αυτόν τον ιστότοπο."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_DELETED="διαγράφηκε"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_FAILED="ΑΠΕΤΥΧΕ"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_WRITEABLE="εγγράψιμο"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTWRITEABLE="ΜΗ εγγράψιμο"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_ERR_SOMEFAILED="%d παρωχημένα αρχεία και φάκελοι δεν ήταν δυνατόν να αφαιρεθούν. Παρακαλούμε διαγράψτε τα χειροκίνητα μέσω FTP, SFTP ή με τον διαχειριστή αρχείων που παρέχει ο πάροχος φιλοξενίας σας."

