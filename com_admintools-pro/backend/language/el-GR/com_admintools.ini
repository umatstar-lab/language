COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERDECIDE="Απενεργοποιημένο για χρήστες backend, οι άλλοι αποφασίζουν"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBODY="Απενεργοποιημένο για όλους"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS="Επιτρεπόμενοι τομείς"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS_TIP="Εισάγετε όλα τα πλήρως αναλυμένα ονόματα τομέα στα οποία υποτίθεται ότι ανταποκρίνεται ο ιστότοπός σας, π.χ. <em>example.com, www.example.com, example.net</em>. Μία καταχώρηση ανά πεδίο κειμένου· προσθέστε περισσότερα πεδία κάνοντας κλικ/πάτημα στο πράσινο κουμπί +. Δεν χρειάζεται να προσθέσετε <code>localhost</code> ή οποιοδήποτε άλλο όνομα τομέα που αντιστοιχεί σε <code>127.0.0.1</code> ή <code>::1</code> (διευθύνσεις localhost). Εάν κάποιος προσπαθήσει να παραποιήσει την κεφαλίδα HTTP Host σε όνομα τομέα που δεν περιλαμβάνεται σε αυτή τη λίστα, θα λάβει απόκριση HTTP 421 Misdirected Request. Αυτή η λειτουργία αποτρέπει την παραποίηση κεφαλίδας Host σε ορισμένους κακώς ρυθμισμένους κεντρικούς υπολογιστές."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL="Αποστολή email σε αυτή τη διεύθυνση κατά αύξηση αποκλεισμένων αιτημάτων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL_TIP="Θα αποστέλλεται email σε αυτή τη διεύθυνση εάν το Admin Tools εντοπίσει ότι μεγάλος αριθμός αιτημάτων έχει αποκλειστεί σε ορισμένη χρονική περίοδο. Μπορείτε να ρυθμίσετε αυτό παρακάτω· η προεπιλογή είναι 1000 αποκλεισμένα αιτήματα σε μία ώρα."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM="Ποσότητα αποκλεισμένων αιτημάτων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM_TIP="Τουλάχιστον τόσα αποκλεισμένα αιτήματα πρέπει να εντοπιστούν στη χρονική περίοδο που ορίζεται παρακάτω για να αποστέλλεται email."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ="Χρονική περίοδος"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ_TIP="Τα αποκλεισμένα αιτήματα που ορίστηκαν παραπάνω πρέπει να συμβούν εντός αυτών των δευτερολέπτων, λεπτών, ωρών ή ημερών. Εισάγετε τον αριθμό εδώ· επιλέγετε τη μονάδα μέτρησης χρόνου στην παρακάτω επιλογή."
