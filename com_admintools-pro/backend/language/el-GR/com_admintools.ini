COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_INTRO="Η <em>Μυστική Λέξη</em> σας δεν είναι ασφαλής και μπορεί να μαντευτεί εύκολα. Για να προστατεύσει τον ιστότοπό σας, το Admin Tools έχει απενεργοποιήσει την πρόσβαση στον προγραμματισμό frontend μέχρι να εισαγάγετε μια ασφαλή Μυστική Λέξη. Το εντοπισμένο πρόβλημα είναι:"
COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Εναλλακτικά, κάντε κλικ στο παρακάτω κουμπί για να επαναφέρετε τη μυστική λέξη στην προτεινόμενη τιμή <code>%s</code> Σε κάθε περίπτωση θα χρειαστεί να ενημερώσετε τις εργασίες CRON σας με τη νέα Μυστική Λέξη."
