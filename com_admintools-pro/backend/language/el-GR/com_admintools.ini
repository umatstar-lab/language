COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_CHMOD_TMPFOLDER="Δεν είναι δυνατή η αλλαγή των δικαιωμάτων του προσωρινού φακέλου. Ενεργοποιήστε το επίπεδο FTP στην Καθολική Ρύθμιση Παραμέτρων της Joomla! και δοκιμάστε ξανά. Εάν το έχετε ήδη κάνει, επικοινωνήστε με τον πάροχο φιλοξενίας σας και ζητήστε του να διορθώσει τα δικαιώματα στον ιστότοπό σας."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_TMPDIR_CREATION="Δεν είναι δυνατή η δημιουργία προσωρινού φακέλου. Ενεργοποιήστε το επίπεδο FTP στην Καθολική Ρύθμιση Παραμέτρων της Joomla! και δοκιμάστε ξανά. Εάν το έχετε ήδη κάνει, επικοινωνήστε με τον πάροχο φιλοξενίας σας και ζητήστε του να διορθώσει τα δικαιώματα στον ιστότοπό σας."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_CHMOD_LOGFOLDER="Δεν είναι δυνατή η αλλαγή των δικαιωμάτων του φακέλου αρχείων καταγραφής. Ενεργοποιήστε το επίπεδο FTP στην Καθολική Ρύθμιση Παραμέτρων της Joomla! και δοκιμάστε ξανά. Εάν το έχετε ήδη κάνει, επικοινωνήστε με τον πάροχο φιλοξενίας σας και ζητήστε του να διορθώσει τα δικαιώματα στον ιστότοπό σας."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_LOGDIR_CREATION="Δεν είναι δυνατή η δημιουργία φακέλου αρχείων καταγραφής. Ενεργοποιήστε το επίπεδο FTP στην Καθολική Ρύθμιση Παραμέτρων της Joomla! και δοκιμάστε ξανά. Εάν το έχετε ήδη κάνει, επικοινωνήστε με τον πάροχο φιλοξενίας σας και ζητήστε του να διορθώσει τα δικαιώματα στον ιστότοπό σας."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_SAVING_JCONFIG="Το Admin Tools δεν μπόρεσε να ενημερώσει την Καθολική Ρύθμιση Παραμέτρων της Joomla!. Ενεργοποιήστε το επίπεδο FTP στην Καθολική Ρύθμιση Παραμέτρων της Joomla! και δοκιμάστε ξανά."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_LBL_TMPDIR_WORKAROUND="Προκειμένου να καταστεί ο προσωρινός φάκελος εγγράψιμος για τη Joomla!, το Admin Tools όρισε τα δικαιώματά του σε 777 και τον προστάτεψε από πρόσβαση στο διαδίκτυο δημιουργώντας ένα αρχείο .htaccess. <strong>Αυτή είναι απλώς μια προσωρινή λύση</strong>. Θα πρέπει να επικοινωνήσετε με τον πάροχο φιλοξενίας σας και να ζητήσετε να διορθώσει τα δικαιώματα στον ιστότοπό σας· στη συνέχεια θυμηθείτε να αλλάξετε τα δικαιώματα του φακέλου %s πίσω σε 0755"
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_LBL_LOGDIR_WORKAROUND="Προκειμένου να καταστεί ο φάκελος αρχείων καταγραφής εγγράψιμος για τη Joomla!, το Admin Tools όρισε τα δικαιώματά του σε 777 και τον προστάτεψε από πρόσβαση στο διαδίκτυο δημιουργώντας ένα αρχείο .htaccess. <strong>Αυτή είναι απλώς μια προσωρινή λύση</strong>. Θα πρέπει να επικοινωνήσετε με τον πάροχο φιλοξενίας σας και να ζητήσετε να διορθώσει τα δικαιώματα στον ιστότοπό σας· στη συνέχεια θυμηθείτε να αλλάξετε τα δικαιώματα του φακέλου %s πίσω σε 0755"

