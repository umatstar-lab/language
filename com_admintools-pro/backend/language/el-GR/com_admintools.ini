COM_ADMINTOOLS_HTACCESSMAKER_LBL_WWWREDIR_WWW="Ανακατεύθυνση non-www σε www"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_COMMON_DIRECTORY="Κατάλογος"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_COMMON_FILE="Αρχείο"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_COMMON_URL_PATH="Σχετικό URL"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_BESTATICRISKS="Απενεργοποίηση επικίνδυνων ενεργειών από την πλευρά του πελάτη στο στατικό περιεχόμενο διαχείρισης"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_FESTATICRISKS="Απενεργοποίηση επικίνδυνων ενεργειών από την πλευρά του πελάτη στο στατικό περιεχόμενο frontend"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS="Εντοπίστηκαν οδηγίες χειριστή PHP"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_DESC="Το Admin Tools εντόπισε ότι το αρχείο <code>.htaccess</code> σας περιέχει οδηγίες που δίνουν εντολή στον διακομιστή ιστού σας να χρησιμοποιεί μια συγκεκριμένη έκδοση PHP. Αυτές οι οδηγίες, που εμφανίζονται παρακάτω, πρέπει να αντιγραφούν στο πεδίο Προσαρμοσμένοι Κανόνες .htaccess για να λειτουργεί σωστά ο ιστότοπός σας κατά τη δημιουργία ενός νέου αρχείου .htaccess με το Admin Tools. Κάντε κλικ στο κουμπί Εφαρμογή παρακάτω για να γίνει αυτό αυτόματα."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_APPLY="Εφαρμογή"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_ERR_NO_HTACCESS="Δεν υπάρχει αρχείο <code>.htaccess</code> στον ριζικό κατάλογο του ιστότοπού σας."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_ERR_NO_HANDLERS="Δεν υπάρχουν αναγνωρίσιμες οδηγίες χειριστή PHP στο αρχείο <code>.htaccess</code> στον ριζικό κατάλογο του ιστότοπού σας."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_ERR_ALREADY_SAVED="Οι οδηγίες χειριστή PHP έχουν ήδη οριστεί στο πεδίο Προσαρμοσμένοι Κανόνες .htaccess. Αφαιρέστε τες πρώτα και αποθηκεύστε τις αλλαγές σας (χωρίς να δημιουργήσετε αρχείο .htaccess) πριν προσπαθήσετε να χρησιμοποιήσετε ξανά αυτή τη λειτουργία."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_SAVED="Οι οδηγίες χειριστή PHP που βρέθηκαν στο αρχείο <code>.htaccess</code> στον ριζικό κατάλογο του ιστότοπού σας έχουν αντιγραφεί στο πεδίο Προσαρμοσμένοι Κανόνες .htaccess. Ελέγξτε ότι φαίνονται σωστές και στη συνέχεια κάντε κλικ στο Αποθήκευση &amp; δημιουργία .htaccess για να ολοκληρώσετε τη διαδικασία."

