COM_ADMINTOOLS_WEBCONFIGMAKER_LBL_WILLTHISWORK_MAYBE="<b>Ίσως</b>. Υπήρξε αβεβαιότητα στον εντοπισμό τύπου διακομιστή. Απλά, δεν είμαστε σίγουροι ότι εκτελείτε τον ιστότοπό σας σε Microsoft IIS, τον μοναδικό τύπο διακομιστή που υποστηρίζει αρχεία web.config. Εάν ο πάροχος φιλοξενίας σας σας πληροφορήσει ότι εκτελείτε σε Microsoft IIS, μπορείτε να δοκιμάσετε τον Δημιουργό web.config."
