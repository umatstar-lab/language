COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_INTRO="Ο διαχειριστής αυτού του ιστότοπου έχει κλειδώσει ορισμένες ή όλες τις λειτουργίες του Admin Tools με κωδικό πρόσβασης. Εισαγάγετε τον κωδικό πρόσβασης για να αποκτήσετε πρόσβαση σε αυτές."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MUSTENTERDLID="Πρέπει να εισαγάγετε το Download ID σας"
COM_ADMINTOOLS_CONTROLPANEL_LBL_NEEDSDLID="Πρέπει να εισαγάγετε το <b>Download ID</b> σας πριν μπορέσετε να ενημερώσετε το Admin Tools Professional. <a href='%s' target='_blank'>Εάν δεν γνωρίζετε το Download ID σας, κάντε κλικ εδώ</a>."
COM_ADMINTOOLS_CONTROLPANEL_MSG_WHERETOENTERDLID="Μεταβείτε στο μενού Σύστημα του Joomla! από την αριστερή πλευρά. Βρείτε το παράθυρο Ενημέρωσης και κάντε κλικ στον σύνδεσμο Ιστότοποι Ενημέρωσης. Βρείτε το στοιχείο «Admin Tools Professional» και κάντε κλικ σε αυτό. Εναλλακτικά, <a href=\"%s\">κάντε κλικ εδώ</a> για να μεταβείτε απευθείας σε αυτή τη σελίδα. Εισαγάγετε το Download ID σας — είτε το Κύριο ID είτε ένα πρόσθετο Download ID — στο πλαίσιο «Κλειδί Λήψης» και κάντε κλικ στο κουμπί Αποθήκευση."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED="Το αρχείο καταγραφής εντοπισμού σφαλμάτων απενεργοποιήθηκε. Τα υπάρχοντα αρχεία καταγραφής εντοπισμού σφαλμάτων διατηρήθηκαν."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED_DELETED="Το αρχείο καταγραφής εντοπισμού σφαλμάτων απενεργοποιήθηκε και τα υπάρχοντα αρχεία καταγραφής εντοπισμού σφαλμάτων διαγράφηκαν."
COM_ADMINTOOLS_CONTROLPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Σημαντικό:</strong> Εάν το Joomla! έχει ήδη εντοπίσει ενημερώσεις για το Admin Tools πριν εισαγάγετε το Download ID σας, <em>ενδέχεται να μην μπορεί να τις κατεβάσει</em> ακόμα και αφού εισαγάγετε το Download ID σας, λόγω ορισμένων παλαιών σφαλμάτων του Joomla!. Σε αυτή την περίπτωση, κατεβάστε το αρχείο ZIP της τελευταίας έκδοσης από τον ιστότοπό μας. Στη συνέχεια, μεταβείτε στο μενού Σύστημα του Joomla!, βρείτε το παράθυρο Εγκατάστασης, κάντε κλικ στις Επεκτάσεις, κάντε κλικ στην καρτέλα Αποστολή Αρχείου Πακέτου και εγκαταστήστε το αρχείο ZIP που κατεβάσατε <strong>δύο φορές</strong> στη σειρά, <strong>χωρίς</strong> να απεγκαταστήσετε το Admin Tools πριν ή ενδιάμεσα. Η διπλή εγκατάσταση απαιτείται για την αντιμετώπιση ενός άλλου παλαιού σφάλματος του Joomla! που μερικές φορές το εμποδίζει να αντιγράψει όλα τα ενημερωμένα αρχεία κατά την εγκατάσταση μιας ενημέρωσης επέκτασης."

