COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_CONTENT="Οι κανόνες Εξαίρεσης WAF σάς επιτρέπουν να αποτρέψετε τον αποκλεισμό αιτημάτων προς τον ιστότοπό σας για συγκεκριμένα συστατικά, προβολές και παραμέτρους αιτήματος. Αυτό μπορεί να χρησιμοποιηθεί όταν γνωρίζετε ότι ένα συστατικό είναι ασφαλές αλλά ο τρόπος λειτουργίας του θα οδηγεί πάντα σε ψευδώς θετικά αποτελέσματα."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_BUTTON_ADD="Προσθήκη κανόνα Εξαίρεσης WAF"

COM_ADMINTOOLS_WAFEXCEPTION_TABLE_CAPTION="Πίνακας κανόνων Εξαίρεσης Web Application Firewall."

