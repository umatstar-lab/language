COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW="Όνομα Προβολής"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_DESC="Η προβολή (περιοχή συστατικού) ή το όνομα ελεγκτή του συστατικού που πρέπει να υπάρχει στο URL για να ταιριάζει αυτός ο κανόνας. Απενεργοποιήστε τα SEF URLs και θα δείτε είτε <code>view=ΌνομαΠροβολής</code> είτε <code>task=ΌνομαΠροβολής.ΌνομαΕργασίας</code> όπου <var>ΌνομαΠροβολής</var> είναι το Όνομα Προβολής που πρέπει να εισάγετε εδώ. Αν αφεθεί κενό, ταιριάζει με όλες τις προβολές."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_ANY="(Όλες)"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK="Εργασία"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_ANY="(Όλες)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_DESC="Ποια εργασία (εντολή για συγκεκριμένη περιοχή συστατικού) θα εφαρμόζεται σε αυτόν τον κανόνα. Απενεργοποιήστε τα SEF URLs και θα δείτε είτε <code>task=ΌνομαΕργασίας</code> είτε <code>task=ΌνομαΠροβολής.ΌνομαΕργασίας</code> όπου <var>ΌνομαΕργασίας</var> είναι η Εργασία που πρέπει να εισάγετε εδώ. Αν αφεθεί κενό, ταιριάζει με όλες τις προβολές."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY="Παράμετρος Ερωτήματος"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_DESC="Το περιεχόμενο ποιας παραμέτρου συμβολοσειράς ερωτήματος θα χρησιμοποιείται για την αντιστοίχιση αυτού του κανόνα, π.χ. <code>id</code>. Αφήστε κενό για να ταιριάζει ο κανόνας ανεξάρτητα από το περιεχόμενο της παραμέτρου ερωτήματος. Σημειώστε ότι η αντιστοίχιση περιεχομένου ερωτήματος εφαρμόζεται μόνο <strong>αφού</strong> το Joomla! έχει μετατρέψει ένα SEF URL στη μη-SEF μορφή του. Αυτό σημαίνει ότι ορισμένες παράμετροι ερωτήματος μπορεί να μην είναι ορατές σε εσάς — παρόλο που είναι ορατές στο Joomla! και στο Admin Tools, και συνεπώς μπορούν να οδηγήσουν στον αποκλεισμό του αιτήματος από το Τείχος Προστασίας Εφαρμογής Web — εκτός αν απενεργοποιήσετε τα SEF URLs."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE="Τύπος φίλτρου Παραμέτρου Ερωτήματος"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_ANY="(Όλες)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_DESC="Επιλέξτε τον τρόπο αντιστοίχισης της Παραμέτρου Ερωτήματος. Η επιλογή «RegEx» σημαίνει ότι το πεδίο Παράμετρος Ερωτήματος περιέχει μια <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">κανονική έκφραση PHP</a> για αντιστοίχιση με τα περιεχόμενα της παραμέτρου ερωτήματος. Μπορείτε να αντιστρέψετε μια κανονική έκφραση βάζοντας θαυμαστικό (<code>!</code>) στην αρχή. Η επιλογή «Ακριβής» σημαίνει ότι το όνομα της παραμέτρου ερωτήματος πρέπει να ταιριάζει ακριβώς με το πεδίο Παράμετρος Ερωτήματος όπως έχει εισαχθεί, συμπεριλαμβανομένων κεφαλαίων και πεζών γραμμάτων. Η επιλογή «Μερική» σημαίνει ότι το όνομα της παραμέτρου ερωτήματος πρέπει να περιλαμβάνει την Παράμετρο Ερωτήματος που εισαγάγατε, π.χ. η Παράμετρος Ερωτήματος «bar» θα ταιριάζει με οποιοδήποτε από τα ακόλουθα ονόματα παραμέτρων: «re<em>bar</em>», «<em>bar</em>tender» και «<em>bar</em>»."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_EXACT="Ακριβής"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_PARTIAL="Μερική"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_REGEX="RegEx"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT="Περιεχόμενο ερωτήματος"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_ANY="(Οποιοδήποτε περιεχόμενο)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_DESC="Αφήστε κενό για να ταιριάζει ο κανόνας ανεξάρτητα από το περιεχόμενο του ερωτήματος. Διαφορετικά, παρέχετε μια <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">κανονική έκφραση PHP</a>· αν ταιριάζει με το περιεχόμενο της παραμέτρου ερωτήματος, ο κανόνας ταιριάζει. Μπορείτε να αντιστρέψετε μια κανονική έκφραση βάζοντας θαυμαστικό (<code>!</code>) στην αρχή."

