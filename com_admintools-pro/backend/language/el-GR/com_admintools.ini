COM_ADMINTOOLS_EMAILTEMPLATES_LBL_WHERE_TEXT="Τα πρότυπα email για βασικές και επεκτάσεις τρίτων, όπως το Admin Tools, διαχειρίζονται κεντρικά από το ίδιο το Joomla! στη σελίδα Σύστημα, Πρότυπα αλληλογραφίας. Ωστόσο, οι επεκτάσεις τρίτων χρειάζεται να υλοποιήσουν τον δικό τους κώδικα για την εγκατάσταση και ενημέρωση των προτύπων email. Αυτό κάνει αυτή η σελίδα. Αν θέλετε να προσαρμόσετε τα πρότυπα email, κάντε κλικ στο παρακάτω κουμπί για να μεταβείτε στη σελίδα Πρότυπα αλληλογραφίας του Joomla!."
