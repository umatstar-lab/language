COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_TITLE="Η Αποσφαλμάτωση Συστήματος πρέπει να είναι απενεργοποιημένη"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_DESC="Ενεργοποιήστε την Αποσφαλμάτωση Συστήματος μόνο κατά την αντιμετώπιση ενός προβλήματος του ιστοτόπου σας, ιδανικά σε ένα ιδιωτικό αντίγραφο του ιστοτόπου ή για πολύ περιορισμένο χρονικό διάστημα. Η έξοδός της μπορεί να αποκαλύψει ευαίσθητες πληροφορίες ή πληροφορίες χρήσιμες σε επιτιθέμενους."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_MSG_FAIL="Η Αποσφαλμάτωση Συστήματος είναι ενεργοποιημένη. Μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις, καρτέλα Σύστημα, και ορίστε την Αποσφαλμάτωση Συστήματος σε Όχι."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_MSG_CONSTANT="Η Αποσφαλμάτωση Συστήματος είναι απενεργοποιημένη στις Γενικές Ρυθμίσεις, αλλά κάτι άλλο ενεργοποιεί την κατάσταση αποσφαλμάτωσης της Joomla! στον ιστότοπό σας. Συνήθως πρόκειται για ένα αρχείο <code>defines.php</code> στον ριζικό φάκελο του ιστοτόπου σας ή στον φάκελο <code>administrator</code>, το οποίο ορίζει τη σταθερά <code>JDEBUG</code>. Απενεργοποιήστε εκεί την κατάσταση αποσφαλμάτωσης."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_FIX="Απενεργοποίηση της Αποσφαλμάτωσης Συστήματος"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_FIX_DONE="Η Αποσφαλμάτωση Συστήματος απενεργοποιήθηκε."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_TITLE="Η Αποσφαλμάτωση Γλώσσας πρέπει να είναι απενεργοποιημένη"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_DESC="Η Αποσφαλμάτωση Γλώσσας προορίζεται μόνο για προγραμματιστές και μεταφραστές που θέλουν να δουν αν το κείμενο μιας σελίδας προέρχεται από μια γλωσσική σταθερά και αν αυτή είναι μεταφρασμένη στην τρέχουσα γλώσσα. Σε όλους τους άλλους ιστοτόπους πρέπει να είναι απενεργοποιημένη."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_MSG_FAIL="Η Αποσφαλμάτωση Γλώσσας είναι ενεργοποιημένη. Μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις, καρτέλα Σύστημα, και ορίστε την Αποσφαλμάτωση Γλώσσας σε Όχι."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX="Απενεργοποίηση της Αποσφαλμάτωσης Γλώσσας"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX_DONE="Η Αποσφαλμάτωση Γλώσσας απενεργοποιήθηκε."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_TITLE="Το $live_site πρέπει να είναι κενό στο configuration.php"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_DESC="Η επιλογή <code>$live_site</code> είναι μια παρωχημένη λύση για διακομιστές web πίσω από reverse proxy, load balancer ή CDN που είτε δεν στέλνει την κεφαλίδα HTTP <code>X-Forwarded-Host</code> είτε η κεφαλίδα του αγνοείται λόγω λανθασμένης ρύθμισης του διακομιστή web. Ορισμένοι τη χρησιμοποιούν επίσης για να ορίσουν το URL του ιστοτόπου για το Joomla CLI. Ούτε αυτό συνιστάται: το Joomla CLI έχει έναν ασφαλέστερο τρόπο για το ίδιο, την επιλογή <code>--live-site=%s</code>."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MATCH="Ο ιστότοπός σας είναι προσβάσιμος με το ίδιο όνομα host με αυτό στο <code>$live_site</code>, οπότε δεν το χρειάζεστε. Επεξεργαστείτε το αρχείο <code>configuration.php</code> του ιστοτόπου σας και αδειάστε τη μεταβλητή <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MISMATCH="Ο διακομιστής σας αναφέρει διαφορετικό όνομα host από αυτό στο <code>$live_site</code>. Ζητήστε από τον πάροχο φιλοξενίας σας να ρυθμίσει τον διακομιστή web ώστε να λαμβάνει υπόψη την κεφαλίδα HTTP <code>X-Forwarded-Host</code> που στέλνει το reverse proxy, ο load balancer ή το CDN μπροστά από τον ιστότοπό σας. Στη συνέχεια, επεξεργαστείτε το αρχείο <code>configuration.php</code> του ιστοτόπου σας και αδειάστε τη μεταβλητή <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_NOHOST="Ο διακομιστής σας δεν αναφέρει την κεφαλίδα HTTP Host. Ζητήστε από τον πάροχο φιλοξενίας σας να ρυθμίσει τον διακομιστή ώστε να την ορίζει. Αν μπροστά από τον ιστότοπό σας βρίσκεται reverse proxy, load balancer ή CDN, αυτό μπορεί να απαιτεί τη ρύθμιση του διακομιστή web ώστε να λαμβάνει υπόψη την κεφαλίδα HTTP <code>X-Forwarded-Host</code>. Στη συνέχεια, επεξεργαστείτε το αρχείο <code>configuration.php</code> του ιστοτόπου σας και αδειάστε τη μεταβλητή <code>$live_site</code>: <code>public $live_site = '';</code>"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_TITLE="Η Αναφορά Λαθών πρέπει να έχει τιμή Κανένα σε ιστότοπο σε λειτουργία"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_DESC="Η Αναφορά Λαθών πρέπει να έχει τιμή Κανένα στους ιστοτόπους σε λειτουργία. Διαφορετικά, τα σφάλματα, οι προειδοποιήσεις και οι σημειώσεις της PHP ενδέχεται να αποκαλύψουν ακούσια ευαίσθητες πληροφορίες ή πληροφορίες χρήσιμες σε επιτιθέμενους. Χρησιμοποιήστε την τιμή Μέγιστο μόνο κατά την αντιμετώπιση ενός προβλήματος, ιδανικά σε ένα ιδιωτικό αντίγραφο του ιστοτόπου."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_MSG_FAIL="Η Αναφορά Λαθών δεν έχει τιμή Κανένα. Μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις, καρτέλα Διακομιστής, και ορίστε την Αναφορά Λαθών σε Κανένα."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX="Ορισμός της Αναφοράς Λαθών σε Κανένα"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX_DONE="Η Αναφορά Λαθών ορίστηκε σε Κανένα."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_TITLE="Οι Διαμοιραζόμενες συνεδρίες πρέπει να είναι απενεργοποιημένες"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_DESC="Οι Διαμοιραζόμενες συνεδρίες είναι εγγενώς επικίνδυνες. Όταν ένας χρήστης συνδέεται στο frontend, συνδέεται αυτόματα και στο backend. Αυτό επιτρέπει σε επιτιθέμενους να εκτελούν επιθέσεις credential stuffing και brute force στο frontend και, αν πετύχουν, να καταλήγουν συνδεδεμένοι στο backend. Μπορεί να έχει απρόβλεπτες αρνητικές συνέπειες και αναιρεί εν μέρει άλλα μέτρα ασφαλείας που προστατεύουν το backend του ιστοτόπου σας."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_MSG_FAIL="Οι Διαμοιραζόμενες συνεδρίες είναι ενεργοποιημένες. Μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις, καρτέλα Σύστημα, και ορίστε τις Διαμοιραζόμενες συνεδρίες σε Όχι."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX="Απενεργοποίηση των Διαμοιραζόμενων συνεδριών"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_CONFIRM="Η απενεργοποίηση των Διαμοιραζόμενων συνεδριών αλλάζει το όνομα του cookie συνεδρίας. Όλοι, συμπεριλαμβανομένων και εσάς, θα αποσυνδεθούν από τον ιστότοπο και θα πρέπει να συνδεθούν ξανά. Συνέχεια;"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_DONE="Οι Διαμοιραζόμενες συνεδρίες απενεργοποιήθηκαν. Ίσως χρειαστεί να συνδεθείτε ξανά."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_TITLE="Το configuration.php δεν πρέπει να ορίζει όνομα συνεδρίας όταν οι Διαμοιραζόμενες συνεδρίες είναι απενεργοποιημένες"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_DESC="Η Joomla! ονομάζει το cookie συνεδρίας με βάση το όνομα συνεδρίας. Όταν το <code>configuration.php</code> ορίζει όνομα συνεδρίας, το frontend και το backend του ιστοτόπου σας χρησιμοποιούν το ίδιο cookie συνεδρίας, δηλαδή μοιράζονται τις συνεδρίες τους, παρότι οι Διαμοιραζόμενες συνεδρίες είναι απενεργοποιημένες. Αυτό έχει τους ίδιους κινδύνους με τις Διαμοιραζόμενες συνεδρίες. Η Joomla! αποθηκεύει όνομα συνεδρίας μόνο όσο οι Διαμοιραζόμενες συνεδρίες είναι ενεργοποιημένες. Το Admin Tools 7.9.4 και οι παλαιότερες εκδόσεις έγραφαν κατά λάθος ένα στο <code>configuration.php</code> κάθε φορά που ο Έλεγχος Προσωρινών Καταλόγων και Καταλόγων Αρχείων Καταγραφής διόρθωνε τον προσωρινό φάκελο ή τον φάκελο αρχείων καταγραφής του ιστοτόπου σας."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_MSG_FAIL="Το <code>configuration.php</code> του ιστοτόπου σας ορίζει όνομα συνεδρίας (<code>$session_name</code>), παρότι οι Διαμοιραζόμενες συνεδρίες είναι απενεργοποιημένες. Το frontend και το backend του ιστοτόπου σας μοιράζονται τις συνεδρίες τους. Αφαιρέστε το, μαζί με άλλες τιμές που ισχύουν μόνο κατά τη φόρτωση μιας σελίδας και γράφτηκαν εκεί κατά λάθος."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX="Αφαίρεση του ονόματος συνεδρίας"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_CONFIRM="Η αφαίρεση του ονόματος συνεδρίας αλλάζει το όνομα του cookie συνεδρίας του frontend. Όλοι όσοι είναι συνδεδεμένοι στο frontend του ιστοτόπου σας, ενδεχομένως και εσείς, θα αποσυνδεθούν και θα πρέπει να συνδεθούν ξανά. Συνέχεια;"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_DONE="Το όνομα συνεδρίας αφαιρέθηκε από το configuration.php. Το frontend και το backend του ιστοτόπου σας δεν μοιράζονται πλέον τις συνεδρίες τους. Ίσως χρειαστεί να συνδεθείτε ξανά."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_TITLE="Λειτουργίες της Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_DESC="Αυτοί οι έλεγχοι εξετάζουν ρυθμίσεις λειτουργιών του πυρήνα της Joomla! και του Admin Tools και προτείνουν τιμές κατάλληλες για ιστοτόπους σε λειτουργία."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_TITLE="Το πρόσθετο Αποσφαλμάτωσης πρέπει να είναι απενεργοποιημένο ή περιορισμένο στους Υπέρ-Χρήστες"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_DESC="Χρησιμοποιήστε το πρόσθετο «Σύστημα - Αποσφαλμάτωση» μόνο κατά την αντιμετώπιση ενός προβλήματος του ιστοτόπου σας, ιδανικά σε ένα ιδιωτικό αντίγραφο του ιστοτόπου ή για περιορισμένο χρονικό διάστημα. Η έξοδός του μπορεί να περιέχει ευαίσθητες πληροφορίες ή πληροφορίες που ένας επιτιθέμενος μπορεί να χρησιμοποιήσει εναντίον του ιστοτόπου σας."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_MSG_FAIL="Το πρόσθετο «Σύστημα - Αποσφαλμάτωση» είναι ενεργοποιημένο και χρήστες που δεν είναι Υπέρ-Χρήστες μπορούν να δουν την έξοδό του. Απενεργοποιήστε το πρόσθετο στους ιστοτόπους σε λειτουργία ή περιορίστε τις «Επιτρεπόμενες Ομάδες» του μόνο στην ομάδα Super Users. Αυτές οι ομάδες χρηστών μπορούν αυτή τη στιγμή να δουν την έξοδό του:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX="Απενεργοποίηση του πρόσθετου Αποσφαλμάτωσης"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX_DONE="Το πρόσθετο «Σύστημα - Αποσφαλμάτωση» απενεργοποιήθηκε."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_TITLE="Ο χρήστης «admin» δεν πρέπει να υπάρχει ή πρέπει να είναι απενεργοποιημένος"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_DESC="Τα προβλέψιμα ονόματα χρηστών, όπως το <code>admin</code>, είναι αγαπημένος στόχος επιθέσεων credential stuffing και brute force. Η παραβίαση ενός τέτοιου λογαριασμού χρήστη μπορεί να βλάψει σοβαρά τον ιστότοπό σας. Ακόμη και με ελάχιστα δικαιώματα (π.χ. μόνο στην ομάδα Registered) ένας τέτοιος λογαριασμός παραμένει επικίνδυνος, αν η ίδια η Joomla! ή μια επέκταση τρίτου κατασκευαστή έχει ευπάθεια κλιμάκωσης δικαιωμάτων."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_MSG_FAIL="Υπάρχει ενεργός λογαριασμός χρήστη με όνομα χρήστη <code>admin</code>. Αποκλείστε τον, μετονομάστε τον ή διαγράψτε τον. Η μεταφορά του σε ομάδα χρηστών με λιγότερα δικαιώματα δεν αρκεί."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX="Αποκλεισμός του χρήστη"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_CONFIRM="Ο λογαριασμός χρήστη με όνομα admin θα αποκλειστεί και δεν θα μπορεί πλέον να συνδεθεί στον ιστότοπό σας. Συνέχεια;"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_DONE="Ο λογαριασμός χρήστη με όνομα admin αποκλείστηκε."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SELF="Είστε συνδεδεμένοι ως ο χρήστης με όνομα admin. Δεν μπορείτε να αποκλείσετε τον δικό σας λογαριασμό χρήστη. Μετονομάστε τον ή συνδεθείτε με άλλον λογαριασμό."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SAVE="Δεν ήταν δυνατός ο αποκλεισμός του λογαριασμού χρήστη με όνομα admin."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_TITLE="Ενεργοποιήστε την εγγραφή χρηστών μόνο αν τη χρειάζεστε"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_DESC="Από προεπιλογή, η Joomla! επιτρέπει την εγγραφή νέων χρηστών. Αυτό είναι δυνατό ακόμη κι αν δεν έχετε δημοσιεύσει ένθεμα σύνδεσης ή στοιχείο μενού για σύνδεση ή εγγραφή χρηστών, εφόσον είναι ενεργοποιημένη η επιλογή «Επιτρέπεται η Εγγραφή Χρηστών». Αν δεν χρειάζεστε επισκέπτες να δημιουργούν λογαριασμούς, όπως συμβαίνει στους περισσότερους ιστοτόπους που διαχειρίζεστε μόνοι σας, πρέπει να απενεργοποιήσετε αυτή τη λειτουργία."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_MSG_FAIL="Η εγγραφή χρηστών είναι ενεργοποιημένη. Αν δεν χρειάζεστε επισκέπτες να δημιουργούν λογαριασμούς χρηστών στον ιστότοπό σας, μεταβείτε στο Χρήστες, Επιλογές, καρτέλα Επιλογές Χρήστη, και ορίστε την επιλογή «Επιτρέπεται η Εγγραφή Χρηστών» σε Όχι."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX="Απενεργοποίηση της εγγραφής χρηστών"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX_DONE="Η εγγραφή χρηστών απενεργοποιήθηκε."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_TITLE="Περιορίστε την πρόσβαση στο backend σε λίγους, έμπιστους χειριστές"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_DESC="Η πρόσβαση στο backend σπάνια χρειάζεται και κάθε χρήστης που τη διαθέτει διευρύνει την επιφάνεια επίθεσης που πρέπει να προστατεύσετε. Αξιολογήστε ποιοι χρήστες χρειάζονται πραγματικά πρόσβαση στο backend και αν θα μπορούσαν να κάνουν τη δουλειά τους από το frontend. Οι χρήστες που χρειάζονται πρόσβαση στο backend μόνο περιστασιακά πρέπει να αφαιρούνται από τις ομάδες με πρόσβαση στο backend (Super Users, Administrator, Manager) και να προστίθενται ξανά μόνο όταν τη χρειάζονται."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_PASS="Ενεργοί λογαριασμοί χρηστών με πρόσβαση στο backend: %d."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_FAIL="%1$d ενεργοί λογαριασμοί χρηστών έχουν πρόσβαση στο backend, δηλαδή περισσότεροι από %2$d."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_TITLE="Χρησιμοποιήστε Ταυτοποίηση Πολλαπλών Παραγόντων σε όλους τους λογαριασμούς με πρόσβαση στο backend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_DESC="Οι χρήστες με πρόσβαση στο backend είναι πρωταρχικός στόχος επιθέσεων credential stuffing και brute force. Ένας μόνο παραβιασμένος λογαριασμός, ακόμη και ενός απλού Manager, μπορεί να προκαλέσει μεγάλη ζημιά στον ιστότοπό σας. Ενεργοποιείτε πάντα την Ταυτοποίηση Πολλαπλών Παραγόντων σε αυτούς τους λογαριασμούς χρηστών. Κάντε την υποχρεωτική μεταβαίνοντας στο Χρήστες, Επιλογές, καρτέλα Ταυτοποίηση Πολλαπλών Παραγόντων, και επιλέγοντας όλες τις ομάδες χρηστών του backend του ιστοτόπου σας στην επιλογή «Εφαρμογή Ελεγχου Ταυτότητας Πολλαπλών Παραγόντων»."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_MSG_FAIL="Ενεργοί λογαριασμοί χρηστών με πρόσβαση στο backend που δεν χρησιμοποιούν Ταυτοποίηση Πολλαπλών Παραγόντων (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_TITLE="Προστατέψτε τον κατάλογο administrator με κωδικό πρόσβασης"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_DESC="Η προστασία του καταλόγου administrator με κωδικό πρόσβασης κάνει τις επιθέσεις credential stuffing και brute force λιγότερο αποτελεσματικές. Ακόμη κι αν διαρρεύσουν τα διαπιστευτήρια ενός χρήστη, ο επιτιθέμενος έχει ένα ακόμη εμπόδιο να ξεπεράσει πριν συνδεθεί στο backend του ιστοτόπου σας. Επειδή την επιβάλλει ο ίδιος ο διακομιστής web, είναι πολύ αποδοτική και περιορίζει τις επιπτώσεις ενός επιτιθέμενου που προσπαθεί να παραβιάσει με brute force τη σύνδεση στο backend."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_MSG_FAIL="Ο κατάλογος administrator δεν προστατεύεται με κωδικό πρόσβασης. Χρησιμοποιήστε τη λειτουργία «Προστασία Διαχειριστή με Κωδικό Πρόσβασης» του Admin Tools για να τον προστατέψετε."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_TITLE="Ορίστε μια μυστική παράμετρο URL"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_DESC="Μια μυστική παράμετρος URL κάνει τις επιθέσεις credential stuffing και brute force λιγότερο αποτελεσματικές. Ακόμη κι αν διαρρεύσουν τα διαπιστευτήρια ενός χρήστη, ο επιτιθέμενος έχει ένα ακόμη εμπόδιο να ξεπεράσει πριν συνδεθεί στο backend του ιστοτόπου σας."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_MSG_FAIL="Δεν έχετε ορίσει μυστική παράμετρο URL για τον διαχειριστή. Ορίστε μία στο Web Application Firewall, Ρύθμιση Παραμέτρων WAF, καρτέλα Βασικές Λειτουργίες, «Μυστική παράμετρος URL διαχειριστή»."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_TITLE="Αφαιρέστε τους λογαριασμούς που δεν έχουν συνδεθεί ποτέ"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_DESC="Οι λογαριασμοί χρηστών που δημιουργήθηκαν αλλά δεν έχουν συνδεθεί ποτέ είναι είτε λογαριασμοί spam που δεν χρειάζεστε είτε ξεχασμένοι λογαριασμοί με πιθανώς παραβιασμένους κωδικούς πρόσβασης. Αφαιρέστε τους με μια Προγραμματισμένη Εργασία της Joomla! του τύπου «Admin Tools – Διαγραφή ανενεργών χρηστών»."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_FAIL="Λογαριασμοί χρηστών που εγγράφηκαν πριν από περισσότερες από %2$d ημέρες και δεν έχουν συνδεθεί ποτέ: %1$d. Δημιουργήστε μια Προγραμματισμένη Εργασία του τύπου «Admin Tools – Διαγραφή ανενεργών χρηστών» για να τους αφαιρέσετε."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_TASK="Μια ενεργή Προγραμματισμένη Εργασία του τύπου «Admin Tools – Διαγραφή ανενεργών χρηστών» φροντίζει για αυτούς τους λογαριασμούς."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_TITLE="Οι Υπέρ-Χρήστες δεν πρέπει να μπορούν να συνδεθούν στο frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_DESC="Από προεπιλογή, οι Υπέρ-Χρήστες μπορούν να συνδεθούν και στο frontend του ιστοτόπου σας. Αυτό επιτρέπει σε επιτιθέμενους να εκτελούν επιθέσεις credential stuffing και brute force στο λιγότερο προστατευμένο frontend για να βρουν τον κωδικό πρόσβασης ενός Υπέρ-Χρήστη. Η λειτουργία «Απαγόρευση σύνδεσης Υπέρ-Διαχειριστή στο frontend» του Admin Tools εμποδίζει τους Υπέρ-Χρήστες να συνδεθούν στο frontend, ανατρέποντας τα σχέδια των επιτιθέμενων."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_MSG_FAIL="Οι Υπέρ-Χρήστες μπορούν να συνδεθούν στο frontend. Ενεργοποιήστε την επιλογή «Απαγόρευση σύνδεσης Υπέρ-Διαχειριστή στο frontend» στο Web Application Firewall, Ρύθμιση Παραμέτρων WAF, καρτέλα Επιλογές Σκλήρυνσης."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX="Απαγόρευση σύνδεσης Υπέρ-Χρηστών στο frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX_DONE="Οι Υπέρ-Χρήστες δεν μπορούν πλέον να συνδεθούν στο frontend."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_TITLE="Οι χρήστες του backend δεν πρέπει να μπορούν να συνδεθούν στο frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_DESC="Από προεπιλογή, οι χρήστες του backend μπορούν να συνδεθούν και στο frontend του ιστοτόπου σας. Αυτό επιτρέπει σε επιτιθέμενους να εκτελούν επιθέσεις credential stuffing και brute force στο λιγότερο προστατευμένο frontend για να βρουν τον κωδικό πρόσβασης ενός χρήστη του backend. Επεξεργαστείτε τα δικαιώματα των ομάδων χρηστών με πρόσβαση στο backend και ορίστε το δικαίωμα «Σύνδεση Επισκεπτών» σε «Απαγορεύεται», ανατρέποντας τα σχέδια των επιτιθέμενων."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_MSG_FAIL="Ενεργοί λογαριασμοί χρηστών που μπορούν να συνδεθούν τόσο στο backend όσο και στο frontend: %d. Μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις, καρτέλα Δικαιώματα, και ορίστε τη «Σύνδεση Επισκεπτών» σε «Απαγορεύεται» για αυτές τις ομάδες χρηστών:"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_TITLE="Αρχεία και Φάκελοι"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_DESC="Αυτοί οι έλεγχοι αναζητούν αρχεία και φακέλους που δεν πρέπει να παραμένουν σε ιστότοπο σε λειτουργία."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_TITLE="Το Akeeba Kickstart δεν πρέπει να παραμένει στον ριζικό φάκελο web"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_DESC="Το Kickstart μπορεί να αποσυμπιέσει οποιοδήποτε αρχείο JPA, JPS ή ZIP οπουδήποτε στον ιστότοπό σας. Σε συνδυασμό με μια ευπάθεια αυθαίρετης μεταφόρτωσης αρχείων στην ίδια τη Joomla! ή σε μια επέκταση τρίτου κατασκευαστή, επιτρέπει σε έναν επιτιθέμενο να γράψει αυθαίρετα αρχεία στον ιστότοπό σας, να εκτελέσει δικό του κώδικα και να παραβιάσει τον ιστότοπό σας. Η μετονομασία του αρχείου ή ο ορισμός κωδικού πρόσβασης είναι καλό μέτρο μόνο <em>προσωρινά</em>, όσο αποσυμπιέζετε ένα αρχείο αντιγράφου ασφαλείας. Μόλις τελειώσετε, το Kickstart <strong>πρέπει</strong> να αφαιρεθεί από τον ιστότοπό σας."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_MSG_FAIL="Αυτά τα αρχεία στον ριζικό φάκελο του ιστοτόπου σας είναι αντίγραφα του Akeeba Kickstart. Διαγράψτε τα."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_FIX_DONE="Διαγράφηκε: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_TITLE="Ο φάκελος installation πρέπει να διαγραφεί"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_DESC="Ένας φάκελος <code>installation</code> που παρέμεινε μετά την εγκατάσταση της Joomla! ή την επαναφορά ενός αντιγράφου ασφαλείας μπορεί να χρησιμοποιηθεί για την αντικατάσταση του ιστοτόπου σας. Πρέπει να αφαιρεθεί μόλις τελειώσετε."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_MSG_FAIL="Υπάρχει φάκελος <code>installation</code> στον ριζικό φάκελο του ιστοτόπου σας. Διαγράψτε τον."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX="Διαγραφή του φακέλου installation"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_CONFIRM="Ο φάκελος installation στον ριζικό φάκελο του ιστοτόπου σας, μαζί με όλο το περιεχόμενό του, θα διαγραφεί. Αυτό δεν μπορεί να αναιρεθεί. Συνέχεια;"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_DONE="Ο φάκελος installation διαγράφηκε."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_TITLE="Οι φάκελοι που απέμειναν από εγκαταστάσεις επεκτάσεων πρέπει να διαγραφούν"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_DESC="Η Joomla! χρησιμοποιεί προσωρινούς φακέλους <code>install_*</code> κατά την αντιγραφή των αρχείων μιας επέκτασης στην τελική τους θέση και κανονικά τους διαγράφει αμέσως. Αν μια εγκατάσταση δεν ολοκληρωθεί σωστά, παραμένουν και μπορεί να αποτελέσουν κίνδυνο ασφαλείας. Διαγράψτε τους. Μπορείτε επίσης να δημιουργήσετε μια Προγραμματισμένη Εργασία του τύπου «Admin Tools – Εκκαθάριση προσωρινού καταλόγου» για να γίνεται αυτό αυτόματα."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_MSG_FAIL="Αυτοί οι φάκελοι που απέμειναν από εγκαταστάσεις βρίσκονται στον προσωρινό φάκελο του ιστοτόπου σας, <code>%s</code>:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_FIX_DONE="Διαγράφηκε: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_TITLE="Αφαιρέστε τα περιττά αρχεία πυρήνα της Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_DESC="Η Joomla! τοποθετεί στον ριζικό φάκελο του ιστοτόπου σας ορισμένα δείγματα και ενημερωτικά αρχεία που δεν χρειάζονται για τη λειτουργία του. Το μόνο που κάνουν είναι να δείχνουν σε όλους ποιο λογισμικό χρησιμοποιεί ο ιστότοπός σας. Η Joomla! τα επαναφέρει σε κάθε ενημέρωση, οπότε ελέγξτε ξανά μετά από κάθε ενημέρωση."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_MSG_FAIL="Αυτά τα περιττά αρχεία βρίσκονται στον ριζικό φάκελο του ιστοτόπου σας:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_HTACCESS="Δείγμα αρχείου .htaccess. Δεν έχει καμία επίδραση, εκτός αν μετονομαστεί σε .htaccess σε διακομιστή web Apache ή LiteSpeed. Καλύτερα να χρησιμοποιήσετε τον Δημιουργό .htaccess του Admin Tools."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_LICENSE="Το κείμενο της άδειας χρήσης της Joomla!. Δεν χρειάζεται να υπάρχει για να χρησιμοποιήσετε τη Joomla!."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_ROBOTS="Δείγμα αρχείου robots.txt. Δεν έχει καμία επίδραση, εκτός αν μετονομαστεί σε robots.txt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_WEBCONFIG="Δείγμα αρχείου web.config. Δεν έχει καμία επίδραση, εκτός αν μετονομαστεί σε web.config σε διακομιστή web Microsoft IIS."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FIX_DONE="Διαγράφηκε: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_TITLE="Το αρχείο καταγραφής εντοπισμού σφαλμάτων του Admin Tools πρέπει να είναι απενεργοποιημένο και τα αρχεία του να έχουν διαγραφεί"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_DESC="Η επιλογή «Διατήρηση αρχείου καταγραφής εντοπισμού σφαλμάτων» του Admin Tools προορίζεται μόνο για την αντιμετώπιση προβλημάτων. Ενεργοποιήστε την για πολύ περιορισμένο χρόνο, ιδανικά σε ένα ιδιωτικό αντίγραφο του ιστοτόπου σας. Το αρχείο καταγραφής καταγράφει δεδομένα αιτημάτων, τα οποία μπορεί να περιλαμβάνουν ευαίσθητες πληροφορίες. Μόλις ολοκληρώσετε την αντιμετώπιση του προβλήματος, απενεργοποιήστε την επιλογή και διαγράψτε τα αρχεία καταγραφής."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_ENABLED="Η επιλογή «Διατήρηση αρχείου καταγραφής εντοπισμού σφαλμάτων» του Admin Tools είναι ενεργοποιημένη. Απενεργοποιήστε την στο Web Application Firewall, Ρύθμιση Παραμέτρων WAF, καρτέλα Καταγραφή &amp; Αναφορά."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_FILES="Τα αρχεία καταγραφής εντοπισμού σφαλμάτων του Admin Tools εξακολουθούν να υπάρχουν στον φάκελο αρχείων καταγραφής του ιστοτόπου σας. Διαγράψτε τα."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE="Απενεργοποίηση"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DELETE="Απενεργοποίηση και διαγραφή των αρχείων καταγραφής"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE="Διαγραφή των αρχείων καταγραφής"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DONE="Το αρχείο καταγραφής εντοπισμού σφαλμάτων απενεργοποιήθηκε."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE_DONE="Το αρχείο καταγραφής εντοπισμού σφαλμάτων είναι απενεργοποιημένο και τα αρχεία καταγραφής του διαγράφηκαν."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_TITLE="Ανιχνευτής Αλλαγών Αρχείων PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_DESC="Αυτοί οι έλεγχοι χρησιμοποιούν τις πληροφορίες που συλλέγει ο Ανιχνευτής Αλλαγών Αρχείων PHP κατά τη σάρωση του ιστοτόπου σας ή εξετάζουν τις ρυθμίσεις του."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_TITLE="Χρησιμοποιήστε τον Ανιχνευτή Αλλαγών Αρχείων PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_DESC="Εκτελείτε τον Ανιχνευτή Αλλαγών Αρχείων PHP τουλάχιστον μία φορά την εβδομάδα, καθώς και πριν και μετά την εγκατάσταση μιας ενημέρωσης της Joomla!, μιας ενημέρωσης επέκτασης τρίτου κατασκευαστή ή μιας νέας επέκτασης τρίτου κατασκευαστή. Όχι μόνο σας προειδοποιεί έγκαιρα για πιθανώς παραβιασμένα αρχεία, αλλά επιτρέπει επίσης στο Admin Tools να συλλέγει πληροφορίες για άλλα προβληματικά αρχεία στον ιστότοπό σας."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_NEVER="Ο Ανιχνευτής Αλλαγών Αρχείων PHP δεν έχει ολοκληρώσει ποτέ σάρωση του ιστοτόπου σας."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_OLD="Ο Ανιχνευτής Αλλαγών Αρχείων PHP ολοκλήρωσε την τελευταία του σάρωση στις %1$s, πριν από περισσότερες από %2$d ημέρες."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_PASS="Ο Ανιχνευτής Αλλαγών Αρχείων PHP ολοκλήρωσε την τελευταία του σάρωση στις %s."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_TITLE="Δεν πρέπει να υπάρχουν αρχεία εκτός πυρήνα σε φακέλους πυρήνα"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_DESC="Οι φάκελοι πυρήνα της Joomla! πρέπει να περιέχουν μόνο τα αρχεία που περιλαμβάνει η ίδια η Joomla!. Οποιοδήποτε άλλο αρχείο σε αυτούς είτε απέμεινε από μια παλιά έκδοση της Joomla!, είτε τοποθετήθηκε εκεί από μια επέκταση που δεν λειτουργεί σωστά, είτε φυτεύτηκε από έναν επιτιθέμενο. Ελέγξτε αυτά τα αρχεία και αφαιρέστε όσα δεν ανήκουν εκεί. Τα αρχεία που έχετε ελέγξει και επισημάνει ως ασφαλή στην αναφορά σάρωσης δεν εμφανίζονται."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_FAIL="Αρχεία εκτός πυρήνα που βρήκε ο Ανιχνευτής Αλλαγών Αρχείων PHP σε φακέλους πυρήνα της Joomla! (%d):"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_IGNORED="Αυτό δεν μπορεί να ελεγχθεί, επειδή ο Ανιχνευτής Αλλαγών Αρχείων PHP είναι ρυθμισμένος να αγνοεί τα αρχεία εκτός πυρήνα σε φακέλους πυρήνα. Μεταβείτε στις Επιλογές του Admin Tools, καρτέλα Ανιχνευτής Αρχείων, και ορίστε την επιλογή «Αρχεία εκτός πυρήνα σε φακέλους πυρήνα» σε «Επισήμανση» ή «Επισήμανση και Αναφορά ως Απειλή». Στη συνέχεια εκτελέστε μια σάρωση."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_TITLE="Δεν πρέπει να υπάρχουν αρχεία PHP σε φακέλους πολυμέσων, εικόνων, αρχείων και γλωσσών"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_DESC="Ο φάκελος <code>images</code> (και κάθε άλλος φάκελος του Διαχειριστή Πολυμέσων), καθώς και οι <code>media</code>, <code>files</code>, <code>language</code>, <code>administrator/language</code> και <code>.well-known</code> προορίζονται για στατικά αρχεία: εικόνες, έγγραφα, CSS, JavaScript και αρχεία γλώσσας. Τα αρχεία PHP σε αυτούς είναι πολύ συχνά backdoors που ανέβασαν επιτιθέμενοι μέσω μιας ευάλωτης επέκτασης. Ελέγξτε καθένα από αυτά· διαγράψτε όσα δεν ανήκουν σε επέκταση που χρησιμοποιείτε."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_MSG_FAIL="Αρχεία PHP σε σημεία όπου δεν θα έπρεπε να βρίσκονται (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_TITLE="Τα αρχεία ρυθμίσεων διακομιστή δεν πρέπει να επιτρέπουν την εκτέλεση αρχείων ως PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_DESC="Ένα αρχείο <code>.htaccess</code> μπορεί να κάνει τον διακομιστή web να εκτελεί οποιοδήποτε αρχείο ως PHP ή ως σενάριο CGI, όποιο κι αν είναι το όνομά του (π.χ. <code>AddType application/x-httpd-php .jpg</code>), ή να αλλάζει τις ρυθμίσεις της PHP. Ένα αρχείο <code>.user.ini</code> μπορεί να κάνει την PHP να εκτελεί ένα άλλο αρχείο, ακόμη και μια εικόνα, πριν ή μετά από κάθε σενάριο PHP (<code>auto_prepend_file</code>). Οι επιτιθέμενοι τα χρησιμοποιούν για να μετατρέψουν ένα φαινομενικά αθώο αρχείο που ανέβασαν σε backdoor. Τα αρχεία που απλώς εμποδίζουν την εκτέλεση σεναρίων, π.χ. με <code>SetHandler none</code> ή <code>php_flag engine off</code>, δεν αναφέρονται. Ούτε όσα βρίσκονται απευθείας στον ριζικό φάκελο του ιστοτόπου σας και στον φάκελο <code>administrator</code>, όπου οι πάροχοι φιλοξενίας τα χρησιμοποιούν για να επιλέξουν την έκδοση της PHP. Ελέγξτε καθένα από τα αρχεία της λίστας· διαγράψτε όσα δεν δημιουργήσατε εσείς και δεν ανήκουν σε επέκταση που χρησιμοποιείτε."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_MSG_FAIL="Αρχεία ρυθμίσεων διακομιστή που επιτρέπουν την εκτέλεση αρχείων ως PHP ή αλλάζουν τις ρυθμίσεις της PHP (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_TITLE="Μην μετονομάζετε αρχεία και φακέλους για να κρατάτε παλιές εκδόσεις τους"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_DESC="Αντίγραφα όπως τα <code>index-bak.php</code>, <code>index.php.old</code>, <code>configuration (1).php</code> ή <code>cassiopeia-copy</code> είναι ένας συνηθισμένος τρόπος διατήρησης μιας παλιάς έκδοσης ενός αρχείου ή φακέλου. Δεν ενημερώνονται ποτέ, μπορεί να εξακολουθούν να είναι προσβάσιμα μέσω web, μπορεί να αποκαλύπτουν ευαίσθητες πληροφορίες (ένα μετονομασμένο αρχείο ρυθμίσεων είναι δώρο για έναν επιτιθέμενο) και μπορεί να περιέχουν παλιό, ευάλωτο κώδικα. Χρησιμοποιήστε στη θέση τους αντίγραφα ασφαλείας ή ένα σύστημα ελέγχου εκδόσεων· διαγράψτε αυτά τα αντίγραφα."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_MSG_FAIL="Αρχεία και φάκελοι που μοιάζουν με μετονομασμένα αντίγραφα (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_TITLE="Εντοπίστε και ελέγξτε τα μεγάλα αρχεία"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_DESC="Τα μεγάλα αρχεία εκτός των φακέλων του Διαχειριστή Πολυμέσων και του φακέλου <code>files</code> είναι συχνά ξεχασμένα αρχεία αντιγράφων ασφαλείας, εξαγωγές βάσεων δεδομένων ή αρχεία καταγραφής. Μπορεί να αποκαλύψουν ευαίσθητες πληροφορίες αν είναι δυνατή η λήψη τους και σπαταλούν χώρο στον δίσκο. Ελέγξτε τα και αφαιρέστε όσα δεν χρειάζεστε. Μπορείτε να αλλάξετε το όριο μεγέθους ή να απενεργοποιήσετε αυτόν τον έλεγχο στις Επιλογές του Admin Tools, καρτέλα Ανιχνευτής Αρχείων."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_MSG_FAIL="Μεγάλα αρχεία που βρέθηκαν (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_TITLE="Κρυφά αρχεία και φάκελοι"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_DESC="Τα αρχεία και οι φάκελοι των οποίων το όνομα ξεκινά με τελεία είναι κρυφά στις περισσότερες λίστες αρχείων. Ορισμένα είναι νόμιμα, όπως τα <code>.htaccess</code>, <code>.htpasswd</code>, <code>.user.ini</code> και <code>.well-known</code>, τα οποία δεν αναφέρονται. Άλλα, όπως τα <code>.git</code>, <code>.env</code> ή οι ρυθμίσεις επεξεργαστών κώδικα, αποκαλύπτουν πληροφορίες για τον ιστότοπό σας και δεν πρέπει να βρίσκονται σε ιστότοπο σε λειτουργία. Οι επιτιθέμενοι επίσης συνηθίζουν να κρύβουν τα αρχεία τους με αυτόν τον τρόπο."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_MSG_FAIL="Κρυφά αρχεία και φάκελοι που βρέθηκαν (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_TITLE="Περισσότερα Εργαλεία"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_DESC="Αυτές οι λειτουργίες του Admin Tools μπορούν να σας βοηθήσουν να διατηρείτε τον ιστότοπό σας σε καλή κατάσταση. Εδώ δεν ελέγχεται τίποτα· ρίξτε μια ματιά και αποφασίστε αν σας είναι χρήσιμες."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_TITLE="Προσωρινοί Υπέρ-Χρήστες"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_DESC="Χρησιμοποιείτε τους Προσωρινούς Υπέρ-Χρήστες όποτε χρειάζεται να δώσετε σε κάποιον πρόσβαση Υπέρ-Χρήστη για περιορισμένο χρόνο, π.χ. σε έναν προγραμματιστή επεκτάσεων που διερευνά ένα πρόβλημα στον ιστότοπό σας. Ο λογαριασμός λήγει αυτόματα."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_TITLE="Ρύθμιση Δικαιωμάτων και Διόρθωση Δικαιωμάτων"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_DESC="Ελέγξτε την ιδιοκτησία και τα δικαιώματα των αρχείων και φακέλων του ιστοτόπου σας και εφαρμόστε λογικά δικαιώματα που ταιριάζουν στην περίπτωση χρήσης σας και στη ρύθμιση του διακομιστή σας."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_TITLE="Έλεγχος Προσωρινών Καταλόγων και Καταλόγων Αρχείων Καταγραφής"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_DESC="Εκτελείτε κατά διαστήματα τον «Έλεγχο Προσωρινών Καταλόγων και Καταλόγων Αρχείων Καταγραφής», από την ενότητα Εργαλεία του Πίνακα Ελέγχου, για να βεβαιωθείτε ότι οι προσωρινοί φάκελοι και οι φάκελοι αρχείων καταγραφής του ιστοτόπου σας υπάρχουν και είναι εγγράψιμοι."

COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_LABEL="Έλεγχος Υγείας Ιστοτόπου: έλεγχος και στους εξαιρεμένους φακέλους και αρχεία"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_DESC="Κατά τη σάρωση, ο Ανιχνευτής Αλλαγών Αρχείων PHP συλλέγει επίσης πληροφορίες για τον Έλεγχο Υγείας Ιστοτόπου: αρχεία PHP σε φακέλους πολυμέσων, μετονομασμένα αντίγραφα, μεγάλα αρχεία και κρυφά αρχεία. Όταν είναι ενεργοποιημένο, αυτές οι πληροφορίες συλλέγονται και μέσα στους φακέλους και τα αρχεία που έχετε εξαιρέσει από τη σάρωση· αυτά εξακολουθούν να μη σαρώνονται για αλλαγές. Οι ενσωματωμένες εξαιρέσεις του Admin Tools (προσωρινοί φάκελοι, φάκελοι αρχείων καταγραφής και κρυφής μνήμης) παραλείπονται πάντα."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_LABEL="Έλεγχος Υγείας Ιστοτόπου: αναφορά μεγάλων αρχείων"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_DESC="Επιτρέπει στον Έλεγχο Υγείας Ιστοτόπου να εμφανίζει τα μεγάλα αρχεία που βρήκε ο Ανιχνευτής Αλλαγών Αρχείων PHP στον ιστότοπό σας, ώστε να τα ελέγξετε. Τα αρχεία στους φακέλους του Διαχειριστή Πολυμέσων (π.χ. <code>images</code>) και στον φάκελο <code>files</code> δεν αναφέρονται ποτέ, καθώς εκεί αναμένονται μεγάλα αρχεία."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_LABEL="Έλεγχος Υγείας Ιστοτόπου: μέγεθος μεγάλου αρχείου (MiB)"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_DESC="Τα αρχεία με μέγεθος τουλάχιστον αυτό, σε MiB, αναφέρονται ως μεγάλα αρχεία από τον Έλεγχο Υγείας Ιστοτόπου. Η ρύθμιση εφαρμόζεται την επόμενη φορά που θα εκτελεστεί ο Ανιχνευτής Αλλαγών Αρχείων PHP."
