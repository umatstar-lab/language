COM_ADMINTOOLS_HTACCESSMAKER_LBL_TUNETEXT="Εάν κάποιες πτυχές του ιστότοπού σας σταματήσουν ξαφνικά να λειτουργούν, εναπόκειται σε εσάς να βρείτε τις κατάλληλες εξαιρέσεις που απαιτούνται για τη σωστή τους λειτουργία. Οδηγίες παρέχονται στην τεκμηρίωση του συστατικού."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_UTF8CHARSET="Ορισμός του συνόλου χαρακτήρων UTF-8 ως προεπιλογή"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WARNING="ΠΡΟΕΙΔΟΠΟΙΗΣΗ!"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WARNTEXT="Λόγω της διαφορετικής συμβατότητας των παρακάτω ρυθμίσεων μεταξύ διακομιστών, η εφαρμογή του αρχείου .htaccess μπορεί να προκαλέσει αδυναμία πρόσβασης στον ιστότοπό σας με λευκή σελίδα ή μήνυμα Εσωτερικού Σφάλματος Διακομιστή 500. Σε αυτή την περίπτωση, αφαιρέστε το .htaccess και δοκιμάστε να απενεργοποιήσετε ορισμένες επιλογές πριν επανεφαρμόσετε."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK="Θα λειτουργήσει ο Δημιουργός .htaccess με τον διακομιστή μου;"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK_MAYBE="<b>Ίσως</b>. Εντοπίσαμε έναν τύπο διακομιστή που μπορεί ή δεν μπορεί να είναι συμβατός με αρχεία .htaccess. Εάν οι παρακάτω επιλογές δεν έχουν αποτέλεσμα, ρωτήστε τον πάροχο φιλοξενίας σας αν ο διακομιστής σας υποστηρίζει αρχεία .htaccess."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK_NO="<b>Όχι, καθόλου</b>. Εντοπίσαμε ότι χρησιμοποιείτε έναν τύπο διακομιστή που δεν είναι συμβατός με αρχεία .htaccess (π.χ. Microsoft IIS ή NginX). Η χρήση του Δημιουργού .htaccess δεν θα έχει <strong>κανένα απολύτως αποτέλεσμα</strong> στον ιστότοπό σας."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK_YES="<b>Πιθανότατα ναι</b>. Εντοπίσαμε ότι ο τύπος του διακομιστή ιστού σας είναι Apache, ο οποίος υποστηρίζει αρχεία .htaccess. Εάν οι παρακάτω επιλογές δεν έχουν αποτέλεσμα ή η απενεργοποίησή τους εξακολουθεί να οδηγεί σε Εσωτερικό Σφάλμα Διακομιστή 500 ή κενή σελίδα, επικοινωνήστε με τον πάροχο φιλοξενίας σας και ζητήστε του να ενεργοποιήσει την υποστήριξη αρχείων .htaccess."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WWWREDIR="Ανακατεύθυνση διευθύνσεων www και non-www"
