COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINEXISTS="Πρέπει να εγκαταστήσετε και να δημοσιεύσετε το πρόσθετο «Σύστημα - Admin Tools» (plg_admintools) πριν οποιαδήποτε από αυτές τις ρυθμίσεις έχουν οποιοδήποτε αποτέλεσμα. Μπορείτε να δοκιμάσετε να επανεγκαταστήσετε το Admin Tools, δύο φορές στη σειρά, χωρίς να το απεγκαταστήσετε πριν ή ανάμεσα, για να αναγκάσετε το Joomla! να εγκαταστήσει το πρόσθετο που λείπει."
