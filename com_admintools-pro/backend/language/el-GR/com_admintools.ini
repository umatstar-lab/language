COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_LABEL="Υπηρεσία αναζήτησης IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS="Να μην αποκλείονται ποτέ αυτές οι διευθύνσεις IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS_TIP="Εισαγάγετε τις διευθύνσεις IP που δεν πρέπει ποτέ να αποκλείονται αυτόματα, ανεξαρτήτως των ρυθμίσεων Αυτόματου Αποκλεισμού. Μπορείτε να χρησιμοποιήσετε μεμονωμένες διευθύνσεις IPv4 και IPv6 (π.χ. <em>127.0.0.1</em> και <em>::1</em>), εύρη IPv4 (π.χ. <em>127.0.0.1-127.0.0.10</em>), συντομογραφική σημειογραφία εύρους IPv4 (<em>127.0.0.</em> για ολόκληρο το μπλοκ 127.0.0.1 έως 127.0.0.255) και σημειογραφία μπλοκ CIDR IPv4/IPv6 (π.χ. <em>127.0.0.0/8</em> για IPv4 ή <em>2001:db8::/32</em> για IPv6)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_ACTIVEFILTERING="Φιλτράρισμα Αιτημάτων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASIC="Βασική Ασφάλεια"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASICSETTINGS="Βασικές Λειτουργίες"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_EXCEPTIONS="Εξαιρέσεις"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_CRAWLERS="Crawlers"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_DESC="Το Admin Tools λαμβάνει τις λίστες με τις διευθύνσεις IP που δημοσιεύουν οι μηχανές αναζήτησης και οι εταιρείες τεχνητής νοημοσύνης για τους crawlers τους και τις χρησιμοποιεί για τους crawlers που επιλέγετε παρακάτω. Με την επιλογή Αποκλεισμός, αποκλείονται όλα τα αιτήματα του crawler. Με την επιλογή Να μην αποκλείεται, ο crawler αντιμετωπίζεται όπως στο «Να μην αποκλείονται ποτέ αυτές οι διευθύνσεις IP»: ένα κακόβουλο αίτημά του εξακολουθεί να αποκλείεται, αλλά δεν καταγράφεται, δεν αποστέλλεται σχετικό email και η διεύθυνση IP δεν αποκλείεται ποτέ αυτόματα. Λαμβάνονται μόνο οι crawlers που ορίζετε σε Αποκλεισμός ή Να μην αποκλείεται. Αν οι λίστες δεν μπορούν να ληφθούν ή η cache του ιστοτόπου δεν λειτουργεί, το Admin Tools απενεργοποιεί μόνο του αυτή την επιλογή και ειδοποιεί τους Υπέρ-Χρήστες με email."
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_LABEL="Χρήση λιστών IP των crawlers"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_ALLOW="Να μην αποκλείεται"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_BLOCK="Αποκλεισμός"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_IGNORE="Παράβλεψη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_FINGERPRINTING="Απόκρυψη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_JHARDENING="Επιλογές Σκλήρυνσης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_LOGGINGANDREPORTING="Καταγραφή & Αναφορά"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD="404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE="Ενεργοποίηση 404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE_TIP="Κάντε κλικ για ενεργοποίηση ή απενεργοποίηση της λειτουργίας 404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_TIP="Αυτή η λειτουργία αντιμετωπίζει τα σφάλματα 404 Δεν βρέθηκε ως λόγο αποκλεισμού ενός αιτήματος όταν αυτά εμφανίζονται σε URL που είναι γνωστό ότι χρησιμοποιούνται από χάκερ για ανίχνευση τρωτών σημείων στον ιστότοπό σας. Για παράδειγμα, όταν ένας χάκερ προσπαθεί να αποκτήσει πρόσβαση στη σελίδα σύνδεσης WordPress παρόλο που έχετε ιστότοπο Joomla!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW="Μυστική παράμετρος URL διαχειριστή"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP="Για παράδειγμα, αν εισαγάγετε 'test', τότε θα μπορείτε να αποκτήσετε πρόσβαση στην περιοχή διαχείρισης μόνο πληκτρολογώντας το URL <code>http://www.example.com/administrator/index.php?test</code>. <strong>ΠΡΟΕΙΔΟΠΟΙΗΣΗ! ΠΡΕΠΕΙ ΝΑ ΑΡΧΙΖΕΙ ΜΕ ΓΡΑΜΜΑ, ΟΧΙ ΜΕ ΑΡΙΘΜΟ</strong>. Για καλύτερη συμβατότητα σε διαφορετικούς διακομιστές, χρησιμοποιήστε μόνο πεζούς χαρακτήρες ASCII και αριθμούς (a-z, 0-9)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP_LONG="Η Μυστική Παράμετρος URL Διαχειριστή μπορεί να αποτελείται μόνο από πεζά και κεφαλαία λατινικά γράμματα χωρίς τόνους ή διακριτικά (a-z και A-Z), αριθμούς 0-9, παύλες και κάτω παύλες. Ο πρώτος χαρακτήρας δεν μπορεί να είναι παύλα ή κάτω παύλα. Πρέπει να έχει μήκος 4 έως 64 χαρακτήρων."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_INVALID="Η Μυστική Παράμετρος URL Διαχειριστή δεν είναι έγκυρη. Θυμηθείτε ότι μπορεί να αποτελείται μόνο από πεζά και κεφαλαία λατινικά γράμματα χωρίς τόνους ή διακριτικά (a-z και A-Z), αριθμούς 0-9, παύλες και κάτω παύλες. Ο πρώτος χαρακτήρας δεν μπορεί να είναι παύλα ή κάτω παύλα. Πρέπει να έχει μήκος 4 έως 64 χαρακτήρων."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION="Ενέργεια για μη έγκυρη μυστική παράμετρο URL διαχειριστή"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_TIP="Τι να γίνει όταν λείπει ή είναι μη έγκυρη η μυστική παράμετρος URL διαχειριστή. Ανακατεύθυνση: ανακατευθύνει το πρόγραμμα περιήγησης στη ρίζα του ιστότοπου (προεπιλογή). Αποκλεισμός: αποκλείει το αίτημα με το μήνυμα αποκλεισμένου αιτήματος του Admin Tools και κατάσταση HTTP 403. Λάβετε υπόψη ότι αυτό δεν βοηθά τόσο πολύ στην αντιμετώπιση της υψηλής φόρτωσης διακομιστή σε επίθεση brute force κωδικών πρόσβασης, καθώς τα bots brute force τυπικά δεν ακολουθούν ανακατευθύνσεις. Χρησιμοποιήστε τη λειτουργία κωδικού πρόσβασης διαχειριστή για την καλύτερη διαχείριση της υψηλής φόρτωσης διακομιστή σε αυτή την περίπτωση."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_REDIRECT="Ανακατεύθυνση"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_BLOCK="Αποκλεισμός"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE="Παράκαμψη cookie προγράμματος περιήγησης για τη μυστική παράμετρο URL διαχειριστή"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_TIP="Να ορίσω cookie προγράμματος περιήγησης κατά την επιτυχή σύνδεση διαχειριστή που επιτρέπει στο πρόγραμμα περιήγησης πρόσβαση στη σελίδα σύνδεσης διαχειριστή οποιαδήποτε στιγμή στις επόμενες 30 ημέρες χωρίς την παροχή της μυστικής παραμέτρου URL διαχειριστή; Το cookie ακυρώνεται αν χρησιμοποιήσετε τη λειτουργία Αποσύνδεσης του Joomla! ή αλλάξετε τον κωδικό πρόσβασης του χρήστη. Παρακαλώ διαβάστε την τεκμηρίωση για περισσότερες πληροφορίες. Αν δεν είστε σίγουροι, ορίστε σε «Ενεργοποιημένο, με ειδοποίηση κατά τη χρήση»."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_OFF="Απενεργοποιημένο"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON="Ενεργοποιημένο"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_WARN="Ενεργοποιημένο, με ειδοποίηση κατά τη χρήση"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_MAXWARN="Ενεργοποιημένο, με υπενθύμιση χρήσης πλήρους URL"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE="Να επιτρέπονται πρότυπα ιστότοπου"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE_TIP="Η ενεργοποίηση αυτής της επιλογής παρακάμπτει μερικώς την προηγούμενη επιλογή (αποκλεισμός του template=foo στο URL). Αν η παράμετρος URL template= καθορίζει το όνομα ενός προτύπου που υπάρχει στον κατάλογο προτύπων σας, τότε θα επιτρέπεται χωρίς να προκαλείται αποκλεισμός του αιτήματος. Αυτό απαιτείται μόνο σε ιστότοπους που χρησιμοποιούν περισσότερα από ένα πρότυπα ταυτόχρονα."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM="Φιλτράρισμα anti-spam βάσει λίστας Απαγορευμένων Λέξεων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM_TIP="Όταν είναι ενεργοποιημένο, όλα τα αιτήματα που περιέχουν τουλάχιστον μία λέξη από τη λίστα Απαγορευμένων Λέξεων θα αποκλείονται."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY="Κλειδί HTTP:BL του <a href='http://www.projecthoneypot.org/httpbl_configure.php' target='_blank'>Project Honeypot</a>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY_TIP="Εισαγάγετε το κλειδί HTTP:BL σας. Μπορείτε να εγγραφείτε στο Project Honeypot και να αποκτήσετε το κλειδί σας στη διεύθυνση <a href='http://www.projecthoneypot.org/httpbl_configure.php'>http://www.projecthoneypot.org/httpbl_configure.php</a>."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS="Τομείς ηλεκτρονικής αλληλογραφίας"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS_TIP="Εισαγάγετε έναν τομέα ανά καταχώρηση, χωρίς πρωτόκολλο π.χ. <code>example.com</code> αλλά ΟΧΙ <s><code>https://www.example.com</code></s>. Το Admin Tools θα επιτρέπει ή θα αποκλείει την εγγραφή ανάλογα με το παραπάνω πεδίο. Αφήστε το κενό για να απενεργοποιήσετε οποιοδήποτε περιορισμό κατά την εγγραφή χρήστη."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES="Αποκλεισμός κοινών ονομάτων χρήστη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_TIP="Όταν είναι ενεργοποιημένο, το Admin Tools θα αποκλείει τη δημιουργία νέων λογαριασμών χρηστών των οποίων το όνομα χρήστη βρίσκεται στην προεπιλεγμένη λίστα αποκλεισμού (π.χ. admin, ceo, manager κ.λπ.)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW="Ονόματα χρήστη που επιτρέπονται ρητά"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW_TIP="Λίστα ονομάτων χρήστη που επιτρέπονται ρητά, ένα ανά γραμμή."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID="Ονόματα χρήστη που απαγορεύονται ρητά"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID_TIP="Λίστα ονομάτων χρήστη που απαγορεύονται ρητά, ένα ανά γραμμή."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN="Άμεσος αποκλεισμός IP κατά την αποτυχημένη σύνδεση με απαγορευμένο όνομα χρήστη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN_TIP="Αν κάποιος προσπαθήσει να συνδεθεί στον ιστότοπό σας χρησιμοποιώντας ένα από τα κοινά ονόματα χρήστη που είναι ενσωματωμένα στο Admin Tools ή ένα από τα Ονόματα Χρήστη που Απαγορεύονται Ρητά που περιγράφονται παρακάτω, αλλά δεν υπάρχει χρήστης με τέτοιο όνομα χρήστη στον ιστότοπό σας, το αίτημα αποκλείεται. Επιπλέον, αν ο Αποκλεισμός IP Επαναλαμβανόμενων Παραβατών είναι ενεργοποιημένος στην καρτέλα Αυτόματου Αποκλεισμού, η διεύθυνση IP του εισβολέα αποκλείεται αμέσως, ακόμα και αν δεν έχει φτάσει τον αριθμό επιθέσεων που καθορίζεται στην επιλογή Αποκλεισμός IP Μετά από Τόσα Αποκλεισμένα Αιτήματα. Η λογική είναι ότι η προσπάθεια σύνδεσης στον ιστότοπο με απαγορευμένο ή κοινό όνομα χρήστη είναι πιθανότατα επίθεση εισαγωγής διαπιστευτηρίων που πρέπει να αντιμετωπιστεί το συντομότερο δυνατό."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION="Ενέργεια για παρακολούθηση ρύθμισης παραμέτρων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_BLOCK="Αποκλεισμός"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_EMAIL="Ηλεκτρονική αλληλογραφία"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_TIP="Τι θέλετε να γίνεται όταν η παρακολούθηση γενικής ή ρύθμισης παραμέτρων συστατικού είναι ενεργοποιημένη και εντοπίζεται αλλαγή στη ρύθμιση παραμέτρων. Η «Ηλεκτρονική αλληλογραφία» θα στείλει απλώς ένα email προειδοποίησης στις διευθύνσεις ηλεκτρονικής αλληλογραφίας που έχετε ρυθμίσει παρακάτω. Οι αλλαγές στη ρύθμιση παραμέτρων θα εφαρμοστούν. Ο «Αποκλεισμός» θα αντιμετωπίσει αυτές τις αλλαγές ως λόγο αποκλεισμού του αιτήματος. Οι αλλαγές στη ρύθμιση παραμέτρων ΔΕΝ θα εφαρμοστούν και δεν θα σταλεί ηλεκτρονική αλληλογραφία."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS="Παρακολούθηση ρυθμίσεων στοιχείου"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS_TIP="Όταν αυτό είναι ενεργοποιημένο και κάποιος προσπαθεί να αλλάξει τη ρύθμιση παραμέτρων οποιουδήποτε πυρήνα Joomla! ή συστατικού τρίτου μέρους (αυτό που βλέπετε όταν κάνετε κλικ στις Επιλογές στη γραμμή εργαλείων ενός συστατικού) από το τμήμα διαχείρισης του ιστότοπού σας, θα ειδοποιηθείτε ή θα αποκλειστούν (ανάλογα με τις ρυθμίσεις σας παρακάτω)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL="Παρακολούθηση Γενικής Ρύθμισης Παραμέτρων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL_TIP="Όταν αυτό είναι ενεργοποιημένο και κάποιος προσπαθεί να αλλάξει τη Γενική Ρύθμιση Παραμέτρων του Joomla!, είτε από το τμήμα διαχείρισης είτε από το frontend, θα ειδοποιηθείτε ή θα αποκλειστούν (ανάλογα με τις ρυθμίσεις σας παρακάτω)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL="Αποστολή email σε αυτή τη διεύθυνση κατά την αλλαγή παρακολουθούμενης ρύθμισης παραμέτρων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL_TIP="Οι ηλεκτρονικές διευθύνσεις, διαχωρισμένες με κόμματα, στις οποίες θέλετε να αποστέλλεται email για οποιαδήποτε αλλαγή στη παρακολουθούμενη γενική ή/και ρύθμιση παραμέτρων συστατικού. Αν αφεθεί κενό, θα χρησιμοποιηθεί η ηλεκτρονική διεύθυνση που έχει οριστεί στην επιλογή «Αποστολή email σε αυτή τη διεύθυνση μετά από αυτόματο αποκλεισμό IP». Αν και τα δύο πεδία είναι κενά, θα αποσταλεί email σε όλους τους ενεργοποιημένους λογαριασμούς Υπέρ-Χρηστών που έχουν ενεργοποιημένη την επιλογή Λήψη Email Συστήματος στο προφίλ τους."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN="Προειδοποίηση για Self XSS"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN_TIP="Εμφάνιση μηνύματος στην κονσόλα του προγράμματος περιήγησης για να προειδοποιηθεί ο χρήστης να αποφύγει την εκτέλεση οποιασδήποτε εντολής μέσα σε αυτήν. Αυτό μπορεί να οδηγήσει σε hacking του εαυτού σας (γνωστό και ως επιθέσεις Self XSS) και κλοπή των δεδομένων του λογαριασμού σας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES="Παρακολούθηση Κρίσιμων Αρχείων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL="Παρακολούθηση αυτών των αρχείων για αλλαγές"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL_TIP="Παρακολούθηση των παρακάτω αρχείων (ένα ανά καταχώρηση) για αλλαγές. Αν εντοπιστεί αλλαγή, θα ειδοποιηθείτε με email. Οι διαδρομές αρχείων είναι σχετικές με τη ρίζα του ιστότοπού σας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_TIP="Τα κρίσιμα αρχεία που τροποποιούνται συχνά από χάκερ (index.php, administrator/index.php και τα index.php, error.php και component.php όλων των προτύπων που είναι εγκατεστημένα στον ιστότοπο) θα παρακολουθούνται για αλλαγές σε κάθε φόρτωση σελίδας. Αν εντοπιστεί αλλαγή, θα ειδοποιηθείτε με email. Αυτό συνήθως σας δίνει έγκαιρη προειδοποίηση σε περίπτωση επιτυχημένης απόπειρας hacking."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL="Αποστολή email σε αυτή τη διεύθυνση κατά την αλλαγή παρακολουθούμενων αρχείων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL_TIP="Οι ηλεκτρονικές διευθύνσεις, διαχωρισμένες με κόμματα, στις οποίες θέλετε να αποστέλλεται email για οποιαδήποτε αλλαγή στα παρακολουθούμενα κρίσιμα ή/και προσαρμοσμένα αρχεία. Αν αφεθεί κενό, θα χρησιμοποιηθεί η ηλεκτρονική διεύθυνση που έχει οριστεί στην επιλογή «Αποστολή email σε αυτή τη διεύθυνση μετά από αυτόματο αποκλεισμό IP». Αν και τα δύο πεδία είναι κενά, θα αποσταλεί email σε όλους τους ενεργοποιημένους λογαριασμούς Υπέρ-Χρηστών που έχουν ενεργοποιημένη την επιλογή Λήψη Email Συστήματος στο προφίλ τους."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR="Προσαρμογή της ετικέτας meta generator"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR_TIP="Όλες οι εγκαταστάσεις Joomla! ορίζουν την ετικέτα meta generator, ένα τμήμα HTML στην κεφαλίδα όλων των σελίδων, για να διαφημίζουν ότι ο ιστότοπός σας λειτουργεί με Joomla!. Αυτές οι πληροφορίες αποθηκεύονται στην κρυφή μνήμη των μηχανών αναζήτησης και εκμεταλλεύονται από επιτιθέμενους για να συμπεράνουν ότι ο ιστότοπός σας τρέχει Joomla! όταν αναζητούν πιθανούς στόχους. Η ενεργοποίηση αυτής της επιλογής σάς επιτρέπει να ορίσετε μια προσαρμοσμένη τιμή για την ετικέτα generator στην επόμενη επιλογή. Να είστε δημιουργικοί!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USEROPTS="Σκλήρυνση Διαχείρισης Χρηστών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR="Παρακολούθηση"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS="Απενεργοποίηση χρηστών κατά την αποτυχία σύνδεσης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS_TIP="Το Admin Tools μπορεί προαιρετικά να απενεργοποιεί υπάρχοντες λογαριασμούς χρηστών όταν υπάρχουν πολλαπλές αποτυχημένες προσπάθειες σύνδεσης με το όνομα χρήστη τους, προστατεύοντας τους λογαριασμούς χρηστών από επιθέσεις brute force. Εδώ μπορείτε να καθορίσετε τον αριθμό των αποτυχημένων συνδέσεων και το χρονικό διάστημα κατά το οποίο πρέπει να συμβούν πριν απενεργοποιηθεί ο χρήστης, π.χ. 3 αποτυχημένες συνδέσεις σε 1 λεπτό. Η ρύθμιση του αριθμού αποτυχημένων συνδέσεων σε 0 απενεργοποιεί αυτή τη λειτουργία."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD="Ασπίδα Άμεσης Συμπερίληψης Αρχείων (DFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD_TIP="Όταν αυτή η επιλογή είναι ενεργοποιημένη, το Admin Tools ελέγχει τις παραμέτρους GET και POST κάθε αιτήματος προς το frontend του ιστότοπού σας. Το αίτημα αποκλείεται αν μια παράμετρος περιέχει μηδενικό byte (null byte) ή αν η τιμή της μοιάζει με διαδρομή αρχείου, επειδή ξεκινά με κάθετο, με ../ ή με γράμμα μονάδας δίσκου όπως C:, και αντιστοιχεί σε αρχείο ή φάκελο που υπάρχει στον διακομιστή σας, οποιουδήποτε τύπου. Μια τιμή που αποτελείται μόνο από κάθετους, π.χ. return=/, δεν αποκλείεται."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET="Απενεργοποίηση επαναφοράς κωδικού πρόσβασης για συγκεκριμένες Ομάδες Χρηστών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_TIP="Αποκλείει τους χρήστες που ανήκουν σε μία από τις επιλεγμένες Ομάδες Χρηστών από το να ζητήσουν επαναφορά κωδικού πρόσβασης χρησιμοποιώντας τη λειτουργία «Ξεχάσατε τον κωδικό σας;» στο frontend του ιστότοπου."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS="Ομάδες χρηστών που αποκλείονται από την επαναφορά κωδικού πρόσβασης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS_TIP="Οι χρήστες σε αυτές τις ομάδες χρηστών δεν θα επιτρέπεται να ζητήσουν επαναφορά κωδικού πρόσβασης. Δεν χρειάζεται να προσθέσετε ομάδες με δικαιώματα Υπέρ-Χρήστη· αυτές αποκλείονται αυτόματα από το ίδιο το Joomla!."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_HEAD="Κλείδωμα Ξεχασμένων Χρηστών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS="Αποτροπή ξεχασμένων χρηστών διαχείρισης από τη σύνδεση"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION="Μέθοδος αποτροπής σύνδεσης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_BLOCK="Αποκλεισμός"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_RESET="Αναγκαστική επαναφορά κωδικού πρόσβασης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_TIP="Επιλέξτε πώς το Admin Tools θα επιβάλλει την αποτροπή σύνδεσης για τους ξεχασμένους χρήστες. Ο «Αποκλεισμός» θα αποκλείσει μόνιμα τον χρήστη· ένας Υπέρ-Χρήστης θα πρέπει να τον ξεμπλοκάρει χειροκίνητα. Η «Αναγκαστική επαναφορά κωδικού πρόσβασης» (συνιστάται) θα αναγκάσει τον χρήστη να επαναφέρει τον κωδικό του την επόμενη φορά που θα συνδεθεί και δεν θα του επιτρέψει να κάνει τίποτε άλλο στον ιστότοπο έως ότου ολοκληρωθεί η επαναφορά κωδικού πρόσβασης."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ="Έλεγχος κάθε [λεπτά]"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ_TIP="Εκτέλεση αυτού του ελέγχου το πολύ κάθε τόσα λεπτά."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS="Ομάδες χρηστών διαχείρισης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS_TIP="Σε ποιες ομάδες χρηστών με πρόσβαση στο τμήμα διαχείρισης εφαρμόζεται αυτή η λειτουργία; Μην επιλέξετε καμία ομάδα για εφαρμογή σε όλες τις ομάδες χρηστών με πρόσβαση σύνδεσης στο τμήμα διαχείρισης του ιστότοπού σας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS="Μέγιστος αριθμός ημερών από την τελευταία σύνδεση"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS_TIP="Οι χρήστες που ανήκουν στις ομάδες χρηστών που ορίζονται παραπάνω και δεν έχουν συνδεθεί για τουλάχιστον αυτές τις ημέρες θα αποτρέπονται από τη σύνδεση."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED="Προστατευμένοι χρήστες"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED_TIP="Αυτοί οι χρήστες δεν θα αποκλείονται ποτέ. Συνιστάται να τοποθετήσετε <strong>πολύ</strong> περιορισμένο αριθμό λογαριασμών χρηστών σε αυτή τη λίστα. Συνήθως, αυτοί θα πρέπει να είναι οι λογαριασμοί χρηστών του ιδιοκτήτη και του προγραμματιστή του ιστότοπου, κανένας άλλος (και σίγουρα <strong>ΟΧΙ</strong> άλλα μέλη προσωπικού που μπορεί να φύγουν ενώ οι λογαριασμοί τους έχουν μείνει πίσω, δηλαδή ακριβώς το σημείο αυτής της προστασίας)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_TIP="Αποτρέψτε τους χρήστες με πρόσβαση στο τμήμα διαχείρισης που δεν έχουν συνδεθεί για πολύ μεγάλο χρονικό διάστημα από τη σύνδεσή τους στον ιστότοπο. Πιθανότατα αυτοί είναι παρωχημένοι χρήστες που ξεχάσατε να αφαιρέσετε και ο κωδικός πρόσβασής τους έχει εν τω μεταξύ παραβιαστεί."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN="Αποστολή email σε αυτή τη διεύθυνση κατά την αποτυχημένη σύνδεση διαχειριστή"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN_TIP="Εισαγάγετε μια ηλεκτρονική διεύθυνση για να ειδοποιείστε σε περίπτωση ανεπιτυχούς σύνδεσης οποιουδήποτε στο τμήμα διαχείρισης του ιστότοπού σας. Αφήστε κενό για να μην λαμβάνετε ειδοποίηση. Βεβαιωθείτε πρώτα ότι ο ιστότοπός σας μπορεί να στέλνει email!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN="Αποστολή email σε αυτή τη διεύθυνση κατά την επιτυχημένη σύνδεση στο τμήμα διαχείρισης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN_TIP="Εισαγάγετε μια ηλεκτρονική διεύθυνση για να ειδοποιείστε σε περίπτωση επιτυχούς σύνδεσης οποιουδήποτε στο τμήμα διαχείρισης του ιστότοπού σας. Αφήστε κενό για να μην λαμβάνετε ειδοποίηση. Βεβαιωθείτε πρώτα ότι ο ιστότοπός σας μπορεί να στέλνει email!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES="Αποστολή email σε αυτή τη διεύθυνση κατά τον αποκλεισμό αιτήματος"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES_TIP="Εισαγάγετε μια ηλεκτρονική διεύθυνση για να ειδοποιείστε για οποιοδήποτε αίτημα αποκλείεται στον ιστότοπό σας. Αφήστε κενό για να μην λαμβάνετε ειδοποίηση. Βεβαιωθείτε πρώτα ότι ο ιστότοπός σας μπορεί να στέλνει email!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS="Αποστολή Εξαιρέσεων PHP σε αυτή τη διεύθυνση"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS_TIP="Κάθε φορά που εγείρεται μια μη διαχειριζόμενη εξαίρεση PHP (δηλ. σφάλμα σε ερώτημα βάσης δεδομένων), το Admin Tools θα στείλει ένα email που περιέχει όλες τις λεπτομέρειες (χρόνος, αρχείο και γραμμή που εγείρει την εξαίρεση) για μεταγενέστερη αποσφαλμάτωση."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE="Ενεργοποίηση περιορισμού αποστολής email αποκλεισμένων αιτημάτων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE_TIP="Όταν είναι ενεργοποιημένο, η συχνότητα των email που αποστέλλει το Admin Tools μπορεί να μειωθεί. Ανατρέξτε στα Πρότυπα Email για τις ρυθμίσεις μέγιστης συχνότητας email."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION="Φιλτράρισμα εγγραφής χρηστών με βάση το email"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_ALLOW="Αποδοχή"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_BLOCK="Αποκλεισμός"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_TIP="Επιλέξτε αν το Admin Tools θα πρέπει να επιτρέπει ή να αποκλείει μόνο τους τομείς email από την παρακάτω λίστα"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS="Αποκλεισμός και ύποπτων IP, όχι μόνο επιβεβαιωμένων spammers"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS_TIP="Μερικές φορές το Project Honeypot δεν είναι σίγουρο αν μια IP ανήκει σε spammer ή είναι ένας άτυχος χρήστης που έκανε κλικ στον λάθος σύνδεσμο. Σε αυτή την περίπτωση η IP επισημαίνεται ως \"ύποπτη\". Η προεπιλεγμένη συμπεριφορά είναι να μην αποκλείει αυτές τις IP. Ωστόσο, αν λαμβάνετε πολύ spam, είναι καλή ιδέα να ενεργοποιήσετε αυτή τη λειτουργία και να αποκλείσετε ακόμη και \"ύποπτες\" IP. Σε κάθε περίπτωση, ορισμένοι ατυχείς χρήστες ενδέχεται να αποκλειστούν ακούσια, οπότε χρησιμοποιήστε αυτή την επιλογή με προσοχή!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE="Ενεργοποίηση φιλτραρίσματος HTTP:BL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE_TIP="Ενεργοποιεί την ενσωμάτωση με το <a href='http://www.projecthoneypot.org'>Project Honeypot</a>. <strong>ΣΗΜΑΝΤΙΚΟ</strong>: Πρέπει να εγγραφείτε στο Project Honeypot, να αποκτήσετε ένα κλειδί και να το εισαγάγετε στην επόμενη επιλογή για να λειτουργήσει αυτή η λειτουργία."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE="Μέγιστη ηλικία αποδεκτών αποτελεσμάτων HTTP:BL (ημέρες)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE_TIP="Το Project Honeypot αναφέρει πότε ήταν η τελευταία φορά που αυτή η IP εντοπίστηκε να αποστέλλει μηνύματα spam. Όσο παλαιότερο είναι αυτό (όσο μεγαλύτερη η ηλικία), τόσο λιγότερο πιθανό είναι αυτή η IP να χρησιμοποιείται ακόμη από spammer. Μπορείτε να επιλέξετε εδώ ποια θα είναι η μέγιστη αναφερόμενη ηλικία που θα αποκλείεται. Η προεπιλεγμένη τιμή 30 σημαίνει ότι θα αποκλείονται οι IP που έχουν υποβάλει μήνυμα spam τις τελευταίες 30 ημέρες."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD="Ελάχιστη Βαθμολογία Απειλής για αποκλεισμό"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD_TIP="Το Project Honeypot χρησιμοποιεί λογαριθμική «βαθμολογία απειλής» για να κατατάξει την πιθανότητα μια συγκεκριμένη IP να είναι spammer. Αυτή η επιλογή ορίζει το ελάχιστο επίπεδο απειλής που πρέπει να έχει μια IP πριν αποκλειστεί. Μια τιμή 25 σημαίνει ότι αυτή η IP έχει υποβάλει 100 μηνύματα spam στα honeypots σύλληψης spam του Project Honeypot και συνήθως αποτελεί ασφαλή ένδειξη ότι ανήκει σε spammer. Σημειώστε ότι η βαθμολογία είναι λογαριθμική. Μια τιμή 50 σημαίνει 1.000 μηνύματα spam και μια τιμή 75 σημαίνει ένα εκατομμύριο μηνύματα spam. Μην τη ρυθμίζετε σε τιμές άνω του 50, καθώς πιθανότατα δεν θα αποκλείετε κανένα spammer. Η προεπιλεγμένη τιμή είναι 25 (100 μηνύματα spam εντοπίστηκαν από αυτή τη διεύθυνση IP)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL="Απαγόρευση πρόσβασης στον ιστότοπο για IP στη Λίστα Μη Επιτρεπόμενων IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL_TIP="Όταν είναι ενεργοποιημένο, αν η IP του επισκέπτη βρίσκεται στη Λίστα Μη Επιτρεπόμενων IP (βλ. λειτουργία Λίστα Μη Επιτρεπόμενων IP) θα λαμβάνουν αμέσως μήνυμα σφάλματος 403 Απαγορευμένο κατά την προσπάθεια πρόσβασης στον ιστότοπό σας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL="Επιτρέψτε πρόσβαση διαχειριστή μόνο σε IP στη Λίστα Αποκλειστικής Αποδοχής IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL_TIP="Όταν είναι ενεργοποιημένο, μόνο οι IP στη Λίστα Αποκλειστικής Αποδοχής IP (βλ. λειτουργία Λίστα Αποκλειστικής Αποδοχής IP Διαχειριστή) θα επιτρέπεται να έχουν πρόσβαση στο τμήμα διαχείρισης του ιστότοπου. Όλες οι άλλες προσπάθειες πρόσβασης στις σελίδες διαχείρισης θα ανακατευθύνονται στην αρχική σελίδα του ιστότοπου. Να είστε προσεκτικοί κατά τη χρήση αυτής της λειτουργίας! Αν δεν έχετε προσθέσει τη δική σας IP στη Λίστα Αποκλειστικής Αποδοχής IP, θα κλειδωθείτε έξω από το τμήμα διαχείρισής σας!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD="ItemidShield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_TIP="Όταν είναι ενεργοποιημένο, το Admin Tools θα αποκλείει οποιαδήποτε μη έγκυρη τιμή για την παράμετρο URL ItemId ή θα προσπαθεί να την καθαρίσει σε έγκυρη ακέραια τιμή"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_OFF="Ανενεργό"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_BLOCK="Αποκλεισμός"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_CLEAN="Καθαρισμός"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS="Αποκλεισμός Ύποπτων Βασικών Παραμέτρων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS_TIP="Αποκλείει αιτήματα με ύποπτες τιμές σε βασικές παραμέτρους συμβολοσειράς ερωτήματος Joomla!, όπως <code>option</code>, <code>view</code>, <code>task</code> κ.λπ."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD="Προειδοποίηση για χρήση γνωστών κωδικών πρόσβασης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS="Ομάδες χρηστών για έλεγχο γνωστών κωδικών πρόσβασης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS_TIP="Το Admin Tools θα ελέγχει για γνωστούς κωδικούς πρόσβασης μόνο τους χρήστες που ανήκουν σε αυτές τις ομάδες (προεπιλογή Υπέρ-Χρήστες)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_TIP="Όταν αυτή η επιλογή είναι ενεργοποιημένη, το Admin Tools θα συνδέεται στη βάση δεδομένων Have I Been Pwned και θα ελέγχει αν ο κατακερματισμός του τρέχοντος κωδικού πρόσβασης είναι γνωστός. Αν βρεθεί αντιστοιχία, ο χρήστης θα αποκλείεται από τη χρήση μη ασφαλούς κωδικού πρόσβασης."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES="Καταγραφή αποκλεισμένων αιτημάτων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES_TIP="Συνιστάται να διατηρείτε αυτή την επιλογή ενεργοποιημένη. Όταν είναι ενεργοποιημένη, όλες οι πιθανές παραβιάσεις ασφαλείας —που αποκλείονται από το Admin Tools— θα καταγράφονται στη βάση δεδομένων και θα είναι διαθέσιμες στο εργαλείο Αρχείο Καταγραφής Αποκλεισμένων Αιτημάτων."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE="Διατήρηση αρχείου καταγραφής εντοπισμού σφαλμάτων"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE_TIP="Το Admin Tools μπορεί προαιρετικά να διατηρεί ένα αρχείο καταγραφής μέσα στον ρυθμισμένο φάκελο αρχείων καταγραφής Joomla. Όταν αυτή η επιλογή είναι ενεργοποιημένη, προστίθεται μια καταχώρηση στο αρχείο καταγραφής κάθε φορά που αποκλείεται ένα αίτημα. Αυτή η καταχώρηση περιέχει πρόσθετες πληροφορίες χρήσιμες για αντιμετώπιση προβλημάτων, συμπεριλαμβανομένης πλήρους ένδειξης των δεδομένων αιτήματος. Αυτό σημαίνει ότι ενδέχεται να αποθηκεύετε προσωπικά αναγνωρίσιμες ή ευαίσθητες πληροφορίες σε μη κρυπτογραφημένο αρχείο. Συνιστάται να ενεργοποιείτε αυτή την επιλογή μόνο όταν αντιμετωπίζετε ένα κατά τα άλλα δυσεντόπιστο πρόβλημα και να την απενεργοποιείτε ξανά όταν έχετε συγκεντρώσει αρκετές πληροφορίες για την επίλυση του προβλήματος."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES="Καταγραφή ονομάτων χρηστών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES_TIP="Όταν είναι ενεργοποιημένο, το Admin Tools θα συμπεριλαμβάνει το όνομα χρήστη κατά την παρακολούθηση αποτυχημένων συνδέσεων (βλ. παραπάνω). ΠΡΟΕΙΔΟΠΟΙΗΣΗ! Συνιστούμε έντονα να διατηρείτε αυτή την επιλογή απενεργοποιημένη για να αποφύγετε προβλήματα με τον GDPR"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD="Αποκλεισμός Κακόβουλου User Agent (MUAShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD_TIP="Πολλοί χάκερ θα προσπαθήσουν να αποκτήσουν πρόσβαση στον ιστότοπό σας χρησιμοποιώντας ένα πρόγραμμα περιήγησης ρυθμισμένο να αποστέλλει κακόβουλο κώδικα PHP στη συμβολοσειρά user agent του (ένα μικρό κομμάτι κειμένου που χρησιμοποιείται για να περιγράψει το πρόγραμμα περιήγησης στον διακομιστή σας). Η ιδέα είναι ότι ελαττωματικό λογισμικό επεξεργασίας αρχείων καταγραφής θα το αναλύσει και θα επιτρέψει στον χάκερ να αποκτήσει έλεγχο του ιστότοπού σας. Όταν είναι ενεργοποιημένη, αυτή η λειτουργία επιτρέπει στο Admin Tools να εντοπίζει τέτοιες επιθέσεις και να αποκλείει το αίτημα."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN="Απαγόρευση σύνδεσης Υπέρ-Διαχειριστή στο frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN_TIP="Όταν είναι ενεργοποιημένο, δεν θα είναι δυνατή η σύνδεση των Υπέρ-Διαχειριστών στο frontend του ιστότοπού σας. Αυτό αποτελεί μέτρο ασφαλείας κατά των επιθέσεων brute force κωδικών πρόσβασης. Ακόμη και χρήστες με δικαιώματα Υπέρ-Χρήστη δεν θα μπορούν να συνδεθούν στο frontend του ιστότοπού σας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS="Απενεργοποίηση επεξεργασίας ιδιοτήτων χρηστών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_TIP="Όταν είναι ενεργοποιημένο, η προσπάθεια τροποποίησης των ρυθμίσεων υπάρχοντος ή δημιουργίας νέου Διαχειριστή, Προχωρημένου Διαχειριστή ή Υπέρ-Διαχειριστή θα αποτυγχάνει."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS="Απενεργοποίηση επεξεργασίας ιδιοτήτων χρηστών για αυτές τις ομάδες χρηστών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS_TIP="Σε ποιες ομάδες χρηστών με πρόσβαση στο διαχειριστικό υποσύστημα εφαρμόζεται αυτή η λειτουργία; Εάν δεν επιλέξετε καμία ομάδα, το Admin Tools θα απενεργοποιήσει την επεξεργασία ιδιοτήτων χρηστών για όλους τους χρήστες που έχουν πρόσβαση σύνδεσης στο διαχειριστικό υποσύστημα του ιστότοπού σας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS="Απενεργοποίηση δημιουργίας / επεξεργασίας χρηστών από το frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_TIP="Κανονικά δεν θα πρέπει να μπορείτε να δημιουργήσετε νέο χρήστη με δικαιώματα σύνδεσης στο backend διαχείρισης από το δημόσιο frontend. Όταν αυτή η επιλογή είναι ενεργοποιημένη, οι προσπάθειες δημιουργίας τέτοιων λογαριασμών θα αντιμετωπίζονται ως απόπειρες hacking και θα αποκλείονται. Αυτό αντιμετωπίζει ορισμένες από τις πιο διαβόητες επιθέσεις zero day στο Joomla! που έλαβαν χώρα μεταξύ 2015 και 2016."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS="Απενεργοποίηση δημιουργίας / επεξεργασίας χρηστών αυτών των ομάδων από το frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS_TIP="Σε ποιες ομάδες χρηστών με πρόσβαση στο backend εφαρμόζεται αυτή η λειτουργία; Εάν δεν επιλέξετε καμία ομάδα, το Admin Tools θα απενεργοποιήσει τη δημιουργία ή επεξεργασία χρηστών από το backend για όλους τους χρήστες που έχουν ή θα αποκτήσουν πρόσβαση σύνδεσης στο backend του ιστότοπου."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD="Αποκλεισμός PHP stream wrappers (PHPShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD_TIP="Ορισμένοι hackers θα προσπαθήσουν να χρησιμοποιήσουν τα λεγόμενα PHP stream wrappers (μοιάζουν με URL που αρχίζουν με php://, phar:// κ.λπ.) για να χειριστούν ύπουλα αρχεία του ιστότοπού σας, παρακάμπτοντας τους κανονικούς ελέγχους μεταφόρτωσης αρχείων που είναι ενσωματωμένοι στο Joomla!. Όταν αυτή η επιλογή είναι ενεργοποιημένη, το Admin Tools θα αποκλείει κάθε αίτημα που περιέχει κείμενο που αντιστοιχεί σε οποιοδήποτε από τα PHP stream wrappers που χρησιμοποιούνται συνήθως από hackers."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL="Να μην αποστέλλονται ειδοποιήσεις email για αυτούς τους λόγους"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL_TIP="Τα αιτήματα που αποκλείστηκαν για αυτούς τους λόγους δεν θα αποστέλλουν email στη διεύθυνση που ορίζεται στο <em>Αποστολή email σε αυτή τη διεύθυνση κατά τον αποκλεισμό αιτήματος</em>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG="Να μην καταγράφονται αυτοί οι λόγοι"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG_TIP="Τα αιτήματα που αποκλείστηκαν για αυτούς τους λόγους δεν θα καταγράφονται. Ως αποτέλεσμα, οι διευθύνσεις IP που ενεργοποιούν επανειλημμένα ένα αποκλεισμένο αίτημα για αυτόν τον λόγο δεν θα αποκλείονται αυτόματα από τον ιστότοπό σας. Επιπλέον, καθώς δεν υπάρχει αρχείο καταγραφής, θα είναι αδύνατο να προσδιοριστεί γιατί κάποιος αποκλείεται από την πρόσβαση στον ιστότοπό σας όταν ενεργοποιεί έναν από αυτούς τους λόγους."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA="Απενεργοποίηση Ελέγχου Ταυτότητας Δύο Παραγόντων του Joomla! κατά την επαναφορά κωδικού πρόσβασης"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA_TIP="Όταν είναι ενεργοποιημένο, το Admin Tools θα απενεργοποιεί τη ρύθμιση Ελέγχου Ταυτότητας Δύο Παραγόντων του Joomla! για έναν χρήστη όταν επαναφέρει τον κωδικό πρόσβασής του. Αυτό ισχύει μόνο για την ενσωματωμένη λειτουργία Ελέγχου Ταυτότητας Δύο Παραγόντων του Joomla! 3.2 και νεότερων εκδόσεων, όχι για τη λειτουργία Ελέγχου Ταυτότητας Δύο Παραγόντων του Admin Tools."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD="Αποκλεισμός Απομακρυσμένης Συμπερίληψης Αρχείων (RFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD_TIP="Ορισμένοι hackers θα προσπαθήσουν να αναγκάσουν μια ευάλωτη επέκταση να φορτώσει κώδικα PHP απευθείας από τον διακομιστή τους. Αυτό γίνεται με την πάροδο ενός URL http(s):// ή ftp:// στο αίτημά τους, που οδηγεί στον κακόβουλο ιστότοπό τους. Όταν αυτή η επιλογή είναι ενεργοποιημένη, το Admin Tools θα αναζητά τέτοιες περιπτώσεις, θα προσπαθεί να ανακτήσει το απομακρυσμένο URL και να σαρώσει τα περιεχόμενά του. Εάν διαπιστωθεί ότι περιέχει κώδικα PHP, θα αποκλείσει το αίτημα."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP="Αποθήκευση IP εγγραφής χρήστη στις Σημειώσεις Χρήστη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_TIP="Όταν είναι ενεργοποιημένο, η διεύθυνση IP από την οποία εγγράφηκαν οι νέοι χρήστες θα αποθηκεύεται ως Σημείωση Χρήστη. Οι χρήστες που δημιουργήθηκαν μέσω του backend δεν θα έχουν την IP τους αποθηκευμένη ως Σημείωση Χρήστη, διότι δεν έχει νόημα να γίνει αυτό (ένας διαχειριστής δηλώνει τον λογαριασμό χρήστη για λογαριασμό του). Επίσης, τα τρίτα συστατικά που δημιουργούν νέους λογαριασμούς χρηστών ενδέχεται να μην ενεργοποιούν το γεγονός του πρόσθετου."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY="Κατηγορία Σημειώσεων Χρήστη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY_TIP="Επιλέξτε τις Κατηγορίες Σημειώσεων Χρήστη όπου το Admin Tools θα αποθηκεύει την IP του χρήστη· η προεπιλογή είναι Χωρίς Κατηγορία"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT="Προστασία από απενεργοποίηση πρόσθετου"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT_TIP="Όταν είναι ενεργοποιημένο, το Admin Tools θα αποτρέπει τους χρήστες του backend από το να απενεργοποιούν (αποδημοσιεύουν) το πρόσθετο. Αυτό σημαίνει ότι δεν θα μπορείτε να αποδημοσιεύσετε το πρόσθετο έως ότου απενεργοποιήσετε αυτή την επιλογή! Επιπλέον, σημειώστε ότι αυτό δεν έχει καμία επίδραση σε κάποιον που επεξεργάζεται τη βάση δεδομένων σας απευθείας· ή σε μετονομασία ή διαγραφή των αρχείων του πρόσθετου συστήματος Admin Tools (ο κατάλογος <code>plugins/system/admintools</code> στον ιστότοπό σας). Επίσης δεν προστατεύει από την απεγκατάσταση του Admin Tools, διότι μόνο οι Υπέρ-Χρήστες μπορούν να το κάνουν από προεπιλογή. Εάν ένας εισβολέας αποκτήσει δικαιώματα Υπέρ-Χρήστη, η απενεργοποίηση του Admin Tools από αυτόν είναι η λιγότερη ανησυχία σας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD="Προστασία από δηλητηρίαση δεδομένων συνεδρίας PHP (SessionShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD_TIP="Αποτρέπει κακόβουλα δεδομένα εισόδου που μπορούν να χρησιμοποιηθούν για να εξαπατηθεί ο εσωτερικός χειριστής συνεδρίας της PHP ώστε να εκτελέσει αυθαίρετο κώδικα κατά την επαναφορά της συνεδρίας χρήστη. ΠΡΟΣΟΧΗ: <em>Ενδέχεται</em> να αποκλείσει επίσης ορισμένα νόμιμα αιτήματα."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD="Προστασία SQLiShield κατά επιθέσεων SQL injection"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD_TIP="Όταν είναι ενεργοποιημένο, το Admin Tools θα προσπαθεί να εντοπίζει κοινές επιθέσεις SQL injection κατά του ιστότοπού σας και να τις αποκλείει."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST="Παρακολούθηση λογαριασμών Υπέρ-Χρήστη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_TIP="Το Admin Tools θα παρακολουθεί τους λογαριασμούς χρηστών με πρόσβαση Υπέρ-Χρήστη. Εάν προστεθεί νέος Υπέρ-Χρήστης εκτός της σελίδας Χρηστών του Joomla!, θα ειδοποιηθείτε μέσω email. Επιπλέον, οι εντοπισμένοι νέοι λογαριασμοί Υπέρ-Χρήστη θα αποκλείονται αυτόματα. Οι χρήστες που δημιουργήθηκαν ή προστέθηκαν από άλλους Υπέρ-Χρήστες στο backend του ιστότοπου μέσω της σελίδας Χρηστών του Joomla! ΔΕΝ θα αποκλείονται από αυτή τη λειτουργία. Χρησιμοποιήστε τη λειτουργία &ldquo;Απενεργοποίηση επεξεργασίας ιδιοτήτων χρηστών backend&rdquo; για να αποτρέψετε αυτό."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL="Αποστολή email σε αυτή τη διεύθυνση κατά αλλαγή Υπέρ-Χρηστών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL_TIP="Οι διευθύνσεις email, διαχωρισμένες με κόμματα, στις οποίες θέλετε να αποστέλλεται email για κάθε απόπειρα (και αποκλεισμένη!) αλλαγή στη λίστα Υπέρ-Χρηστών του ιστότοπού σας. Εάν αφεθεί κενό, θα χρησιμοποιηθεί η διεύθυνση email που ορίζεται στην επιλογή «Αποστολή email σε αυτή τη διεύθυνση μετά από αυτόματο αποκλεισμό IP». Εάν και τα δύο πεδία είναι κενά, θα αποστέλλεται email σε όλους τους ενεργοποιημένους λογαριασμούς Υπέρ-Χρήστη που έχουν ενεργοποιημένη την επιλογή Λήψη Email Συστήματος στο προφίλ χρήστη τους."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE="Αποκλεισμός αλλαγής προτύπου ιστότοπου template=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE_TIP="Μια άλλη κρυφή λειτουργία του Joomla! είναι η δυνατότητα εναλλαγής μεταξύ εγκατεστημένων προτύπων με πάροδο ειδικής παραμέτρου URL. Για παράδειγμα, εάν θέλετε να εφαρμόσετε το πρότυπο Beez5, απλώς περάστε την παράμετρο <code>?template=beez5</code>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL="Αποκλεισμός αλλαγής προτύπου συστήματος tmpl=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST="Λίστα επιτρεπόμενων λέξεων-κλειδιών tmpl="
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST_TIP="Μία λέξη-κλειδί tmpl ανά καταχώρηση. Οι καταχωρήσεις component και system προστίθενται πάντα, ανεξάρτητα από το αν τις προσθέσετε ρητά εδώ."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL_TIP="Μία από τις λιγότερο γνωστές λειτουργίες του Joomla! είναι τα πρότυπα συστήματός του. Κάθε φορά που παρουσιάζεται σφάλμα ή θέτετε τον ιστότοπό σας εκτός σύνδεσης, το Joomla! φορτώνει το αντίστοιχο πρότυπο συστήματος. Η πάροδος του ονόματος του προτύπου στη URL με προσθήκη, π.χ., ?tmpl=offline σάς επιτρέπει να δοκιμάσετε αυτά τα πρότυπα χωρίς να χρειαστεί να παράγετε πραγματικό σφάλμα ή να θέσετε τον ιστότοπό σας εκτός σύνδεσης. Η ενεργοποίηση αυτής της επιλογής θα απενεργοποιήσει αυτή την κρυφή λειτουργία του Joomla!. Σημειώστε ότι τα tmpl=system και tmpl=component πρέπει να επιτρέπονται (βλ. επόμενη επιλογή), καθώς απαιτούνται από ορισμένες επεκτάσεις για τη λειτουργία τους."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS="Αντιμετώπιση αποτυχημένων συνδέσεων ως λόγος αποκλεισμού αιτήματος"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS_TIP="Όταν είναι ενεργοποιημένο, οι αποτυχημένες απόπειρες σύνδεσης οποιουδήποτε είδους χρήστη (ακόμα και απλών εγγεγραμμένων χρηστών) μετρούν ως έγκυρος λόγος αποκλεισμού του αιτήματος και καταγράφονται στο Αρχείο Καταγραφής Αποκλεισμένων Αιτημάτων του Admin Tools. Υπάρχει μια πολύ χρήσιμη συνέπεια σε αυτό. Καθώς μετρούν ως λόγοι αποκλεισμού αιτήματος, μετρούν επίσης προς το όριο που έχετε ορίσει για τον αυτόματο αποκλεισμό IP. Επομένως, μετά από έναν αριθμό αποτυχημένων προσπαθειών σύνδεσης, η IP του χρήστη θα αποκλειστεί αυτόματα για τη διάρκεια που έχετε ορίσει."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL="Αποστολή email αντιμετώπισης προβλημάτων κατά διοικητικές λειτουργίες"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL_TIP="Αποστέλλει email στον συνδεδεμένο χρήστη backend κάθε φορά που εκτελεί μια διοικητική λειτουργία Admin Tools που μπορεί να έχει ως αποτέλεσμα τον αποκλεισμό του από τον ιστότοπο ή τη μη ορθή λειτουργία του ιστότοπου. Το email περιέχει συνδέσμους προς άρθρα αντιμετώπισης προβλημάτων που τον βοηθούν να διορθώσει το πρόβλημα και να επαναφέρει τον ιστότοπο στην κανονική του κατάσταση. Συνιστάται ιδιαίτερα να διατηρείτε αυτή τη λειτουργία ενεργοποιημένη. Η ακολούθηση των πληροφοριών αντιμετώπισης προβλημάτων είναι πολύ πιο γρήγορη από την αναμονή απάντησης από την υποστήριξή μας."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD="Ανιχνευτής μεταφορτωμένων αρχείων (UploadShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_TIP="Ελέγχει κάθε αρχείο που μεταφορτώνεται στον ιστότοπό σας και αποκλείει το αίτημα όταν το αρχείο φαίνεται ότι θα μπορούσε να χρησιμοποιηθεί για την εκτέλεση κώδικα στον διακομιστή σας. Αυτό σας προστατεύει από ευάλωτες επεκτάσεις τρίτων που επιτρέπουν σε επιτιθέμενους να μεταφορτώσουν αυθαίρετα αρχεία. Οι μεταφορτώσεις από συνδεδεμένους Υπέρ-Χρήστες δεν ελέγχονται ποτέ."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS="UploadShield: αποτροπή παράκαμψης μέσω .htaccess"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS_TIP="Αποκλείει το αίτημα όταν μεταφορτώνεται αρχείο με όνομα .htaccess και το περιεχόμενό του περιλαμβάνει οδηγία SetHandler ή AddHandler του Apache. Οι επιτιθέμενοι χρησιμοποιούν αυτές τις οδηγίες για να κάνουν τον Apache να εκτελεί ως κώδικα PHP αρχεία που κατά τα άλλα είναι αδρανή, όπως εικόνες."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT="UploadShield: αποτροπή μεταφόρτωσης αρχείων με πολλαπλές επεκτάσεις"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT_TIP="Αποκλείει το αίτημα όταν οποιοδήποτε τμήμα του ονόματος του μεταφορτωμένου αρχείου μοιάζει με επέκταση αρχείου PHP, π.χ. evil.php.jpg ή evil.jpg.php5. Ορισμένες εσφαλμένες ρυθμίσεις διακομιστή εκτελούν τέτοια αρχεία ως κώδικα PHP, ανεξάρτητα από τον φαινομενικό τους τύπο."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT="UploadShield: αποτροπή μεταφόρτωσης αρχείων PHP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT_TIP="Αποκλείει το αίτημα όταν η επέκταση του μεταφορτωμένου αρχείου είναι επέκταση αρχείου PHP, όπως .php, .phps, .phtml, .inc, .php7 και ούτω καθεξής."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT="UploadShield: αποτροπή περιεχομένου PHP στις μεταφορτώσεις"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT_TIP="Αποκλείει το αίτημα όταν ένα μεταφορτωμένο αρχείο περιέχει κάτι που μοιάζει με κώδικα PHP, ανεξάρτητα από το όνομα του αρχείου. Αυτό εντοπίζει επιθέσεις που κρύβουν κώδικα PHP μέσα σε ένα κατά τα άλλα έγκυρο αρχείο εικόνας ή εγγράφου."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW="Εμφάνιση σφαλμάτων χρησιμοποιώντας προσαρμόσιμο πρότυπο HTML"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW_TIP="Από προεπιλογή, το Μήνυμα Αποκλεισμένου Αιτήματος εμφανίζεται χρησιμοποιώντας την τυπική σελίδα μηνύματος σφάλματος του Joomla!. Όταν αυτή η επιλογή είναι ενεργοποιημένη, το Admin Tools θα χρησιμοποιεί ένα προσαρμόσιμο πρότυπο HTML. Το προεπιλεγμένο αρχείο προτύπου HTML βρίσκεται στο αρχείο components/com_admintools/View/Blocks/tmpl/default.php. ΜΗΝ ΤΡΟΠΟΠΟΙΕΙΤΕ ΑΥΤΟ ΤΟ ΑΡΧΕΙΟ ΑΜΕΣΑ! Διαβάστε την τεκμηρίωση για τη σωστή μέθοδο δημιουργίας παράκαμψης προτύπου."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS="Τομείς που δεν αποκλείονται ποτέ"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS_TIP="Εάν η διεύθυνση IP ενός επισκέπτη του οποίου το αίτημα αποκλείεται αντιστοιχεί σε όνομα τομέα που τελειώνει με αυτό που εισάγετε εδώ, το αίτημα εξακολουθεί να αποκλείεται, αλλά δεν καταγράφεται, δεν αποστέλλεται σχετικό email και η διεύθυνση IP δεν αποκλείεται ποτέ αυτόματα. Το όνομα τομέα πρέπει επίσης να αντιστοιχεί πίσω στη διεύθυνση IP του επισκέπτη, ώστε μια πλαστή εγγραφή αντίστροφου DNS να μην λαμβάνεται υπόψη. Σημειώστε ότι μια μεγάλη λίστα θα προκαλέσει σημαντική επίδραση στην απόδοση. Η λίστα είναι κενή από προεπιλογή. Για τις μηχανές αναζήτησης και τους ανιχνευτές ΤΝ, χρησιμοποιήστε καλύτερα την καρτέλα Crawler."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN="Προσθήκη επίμονων παραβατών στη Λίστα Μη Επιτρεπόμενων IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM="Μόνιμος αποκλεισμός IP μετά από τόσους αυτόματους αποκλεισμούς"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_2="αυτόματοι αποκλεισμοί IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_TIP="Όταν η προηγούμενη επιλογή είναι ενεργοποιημένη, μετά από πόσους αυτόματους αποκλεισμούς μια IP θα αποκλείεται μόνιμα (προστίθεται στη Λίστα Μη Επιτρεπόμενων IP)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN_TIP="Εάν μια IP ενεργοποιεί τόσους αυτόματους αποκλεισμούς, θα αποκλείεται μόνιμα (προστίθεται στη Λίστα Μη Επιτρεπόμενων IP) εάν πρόκειται να αποκλειστεί αυτόματα ξανά. Βεβαιωθείτε ότι έχετε ενεργοποιήσει τη λειτουργία Λίστας Μη Επιτρεπόμενων IP ρυθμίζοντας το <em>Αποκλεισμός πρόσβασης στον ιστότοπο σε IP στη Λίστα Μη Επιτρεπόμενων IP</em> σε Ναι, διαφορετικά η μόνιμη προσθήκη στη Λίστα Μη Επιτρεπόμενων IP δεν θα έχει κανένα αποτέλεσμα."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PROJECTHONEYPOT="Project Honeypot"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_BODY="<p>Ο χρήστης εγγράφηκε στον ιστότοπο χρησιμοποιώντας τη διεύθυνση IP <strong>%s</strong></p><p>Η συμβολοσειρά πράκτορα χρήστη του προγράμματος περιήγησης ήταν:<br/>%s</p><p>Αυτές οι πληροφορίες καταγράφηκαν αυτόματα σε αυτή τη Σημείωση Χρήστη από το Admin Tools Professional.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_SUBJECT="Διεύθυνση IP εγγραφής"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE="Εμφάνιση αυτού του μηνύματος σε αποκλεισμένες διευθύνσεις IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE_TIP="Σας επιτρέπει να εμφανίζετε ένα συγκεκριμένο μήνυμα σε αποκλεισμένες διευθύνσεις IP. Ίσως θελήσετε να εξηγήσετε στον χρήστη ότι η IP του αποκλείστηκε λόγω εντοπισμού ύποπτης δραστηριότητας από τη διεύθυνση IP του. Μπορείτε να χρησιμοποιήσετε το ειδικό κείμενο [IP] με κεφαλαία γράμματα, χωρίς κενά μεταξύ των αγκυλών και IP, για να εμφανίσετε την IP του χρήστη στο μήνυμα. Αυτό μπορεί να είναι χρήσιμο εάν κάποιος αποκλειστεί κατά λάθος και σας ζητήσει βοήθεια."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSR="Αυτόματος αποκλεισμός"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM="Διάρκεια αποκλεισμού"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM_TIP="Πόσο θα διαρκεί ο αποκλεισμός. Για παράδειγμα, η ρύθμιση σε 1 ημέρα θα αποκλείσει κάθε πρόσβαση από αυτή τη διεύθυνση IP για μια ολόκληρη ημέρα. Εισάγετε τον αριθμό σε αυτό το πεδίο, επιλέξτε τη μονάδα μέτρησης χρόνου στο επόμενο πεδίο."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY="Μονάδα μέτρησης χρόνου για τη διάρκεια αποκλεισμού"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY_TIP="Η μονάδα μέτρησης χρόνου για την παραπάνω ρύθμιση «Διάρκεια αποκλεισμού». Επιλέξτε ένα από: δευτερόλεπτα, λεπτά, ημέρες ή ώρες."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE="Αποκλεισμός IP επαναλαμβανόμενων παραβατών"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE_TIP="Όταν ρυθμιστεί σε ναι, η διεύθυνση IP επαναλαμβανόμενων παραβατών θα αποκλείεται αυτόματα βάσει των υπόλοιπων ρυθμίσεων"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES="Αποκλεισμός IP μετά από τόσα αποκλεισμένα αιτήματα"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES_TIP="Όταν τα αιτήματα από μια διεύθυνση IP αποκλείονται τουλάχιστον τόσες φορές εντός της χρονικής περιόδου που ορίζεται από τις επόμενες δύο επιλογές, θα αποκλειστεί προσωρινά από την πρόσβαση στον ιστότοπο. Για παράδειγμα, εάν ορίσετε 3 επιθέσεις σε 1 ώρα, το Admin Tools θα απαγορεύσει την πρόσβαση από μια διεύθυνση IP που είχε τουλάχιστον 3 αποκλεισμένα αιτήματα εντός της τελευταίας ώρας. Εισάγετε την τιμή 0 για να απενεργοποιήσετε αυτή τη λειτουργία."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ="Χρονική περίοδος"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ_TIP="Ο αριθμός αποκλεισμένων αιτημάτων που ορίστηκε παραπάνω πρέπει να συμβεί εντός αυτών των δευτερολέπτων, λεπτών, ωρών ή ημερών. Εισάγετε τον αριθμό εδώ· επιλέγετε τη μονάδα μέτρησης χρόνου στην παρακάτω επιλογή."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY="Μονάδα μέτρησης χρόνου"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY_TIP="Η μονάδα μέτρησης χρόνου για την παραπάνω ρύθμιση «Χρονική περίοδος». Επιλέξτε ένα από: δευτερόλεπτα, λεπτά, ημέρες ή ώρες."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN="Έλεγχος ταυτότητας με κωδικό πρόσβασης όταν η σύνδεση με passkey είναι ενεργοποιημένη για λογαριασμό χρήστη"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_TIP="Εάν ένας χρήστης ενεργοποιήσει τον έλεγχο ταυτότητας με passkey για τον λογαριασμό χρήστη του, θα πρέπει να του επιτρέπεται εναλλακτικά να συνδέεται με κωδικό πρόσβασης;"
