COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTAPPLIED="Δεν ήταν δυνατή η εφαρμογή της προστασίας με κωδικό πρόσβασης. Ενεργοποιήστε το επίπεδο FTP στις Γενικές Ρυθμίσεις του ιστοτόπου σας."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTUNAPPLIED="Δεν ήταν δυνατή η κατάργηση της προστασίας με κωδικό πρόσβασης. Ενεργοποιήστε το επίπεδο FTP στις Γενικές Ρυθμίσεις του ιστοτόπου σας."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOUSERNAME="Πρέπει να εισαγάγετε ένα όνομα χρήστη"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_PASSWORDNOMATCH="Οι κωδικοί πρόσβασης δεν ταιριάζουν"

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HOWITWORKS="Πώς λειτουργεί αυτό;"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_INFO="Κατά την εφαρμογή της προστασίας με κωδικό πρόσβασης, το πρόγραμμα περιήγησής σας θα σας ζητά όνομα χρήστη και κωδικό πρόσβασης κάθε φορά που ζητείται η διεύθυνση URL ενός προστατευμένου πόρου στον φάκελο <code>administrator</code>. Θα πρέπει να εισαγάγετε το όνομα χρήστη και τον κωδικό πρόσβασης που έχετε καταχωρίσει σε αυτή τη σελίδα. Αυτό το όνομα χρήστη και ο κωδικός πρόσβασης είναι <em>κοινός</em> για όλους που διαχειρίζονται τον ιστοτόπο σας και <em>πρέπει να διαφέρει</em> από τα στοιχεία σύνδεσής σας στο Joomla!. Αυτό λειτουργεί σε επίπεδο διακομιστή, χρησιμοποιώντας ένα αρχείο <code>.htaccess</code> στον φάκελο <code>administrator</code> του ιστοτόπου σας. Ο διακομιστής σας πρέπει να υποστηρίζει προστασία καταλόγου με κωδικό πρόσβασης μέσω αρχείων .htaccess για να έχει αποτέλεσμα αυτή η λειτουργία. Εάν δεν είστε σίγουροι για’ αυτό, επικοινωνήστε με τον πάροχο φιλοξενίας σας."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_WARN="Σημειώστε ότι αυτή η προστασία ισχύει ακόμα και αν απενεργοποιήσετε ή απεγκαταστήσετε το Admin Tools. Εάν η περιοχή διαχείρισης σας καταστεί μη προσβάσιμη ή χρειαστεί να αφαιρέσετε την προστασία με κωδικό πρόσβασης χωρίς πρόσβαση σε αυτή τη σελίδα, θα πρέπει να <strong>διαγράψετε</strong> τα αρχεία <code>.htaccess</code> και <code>.htpasswd</code> από τον κατάλογο <code>administrator</code> του ιστοτόπου σας μέσω FTP, SFTP ή της Διαχείρισης Αρχείων του πίνακα ελέγχου φιλοξενίας σας."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORDPROTECTION="Ρύθμιση Προστασίας Διαχειριστή με Κωδικό Πρόσβασης"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES="Επαναφορά προσαρμοσμένων σελίδων σφάλματος"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES_HELP="Επαναφέρει τις προσαρμοσμένες σελίδες σφάλματος Apache για HTTP 401 και 403 στις προεπιλεγμένες ρυθμίσεις. Αυτό αποτρέπει ένα σφάλμα 404 Άρθρο Δεν Βρέθηκε κατά την προσπάθεια πρόσβασης στη σελίδα σύνδεσης διαχειριστή μετά την ενεργοποίηση της λειτουργίας Προστασίας Διαχειριστή με Κωδικό Πρόσβασης. Συνιστάται ανεπιφύλακτα να διατηρείτε αυτήν την επιλογή ενεργοποιημένη, εκτός εάν προκαλεί πρόβλημα HTTP 500 Εσωτερικό Σφάλμα Διακομιστή."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE="Πόροι διαχειριστή για προστασία"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_JOOMLA="Joomla"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_PHP="Όλα τα αρχεία PHP"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_EVERYTHING="Τα πάντα"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_HELP="Επιλέξτε τι θα προστατεύεται με κωδικό πρόσβασης. Το «Ιομαλα» προστατεύει μόνο το index.php του Joomla! (το σημείο εισόδου εφαρμογής διαχειριστή). Όλα τα υπόλοιπα μπορούν να προσπελαστούν ελεύθερα, συμπεριλαμβανομένων των αρχείων .php από εφαρμογές τρίτων. Το «Όλα τα αρχεία PHP» προστατεύει όλα τα αρχεία PHP στον φάκελο <code>administrator</code> και τους υποφακέλους του. Το «Τα πάντα» λειτουργεί όπως οι παλαιές εκδόσεις του Admin Tools, απαγορεύοντας την πρόσβαση σε οποιοδήποτε αρχείο στον φάκελο <code>administrator</code> και τους υποφακέλους του, ανεξαρτήτως επέκτασης."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE="Αλγόριθμος κατακερματισμού κωδικού πρόσβασης"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_HELP="Οι κωδικοί πρόσβασης αποθηκεύονται κατακερματισμένοι στο αρχείο <code>administrator/.htpasswd</code>. Αυτή η επιλογή καθορίζει τον αλγόριθμο κατακερματισμού. Το bCrypt είναι το πιο ασφαλές, αλλά δεν υποστηρίζεται πάντοτε. Το APR-1 (προεπιλογή) είναι αρκετά ασφαλές και υποστηρίζεται από τους περισσότερους παρόχους. Το SHA-1 υποστηρίζεται πάντα, αλλά δεν θεωρείται πλέον ασφαλές. Το crypt() επιτρέπει κωδικούς πρόσβασης μόνο έως 8 χαρακτήρες, δεν υποστηρίζεται στα Windows και θεωρείται μη ασφαλές. Το Απλό Κείμενο δεν εφαρμόζει κανέναν κατακερματισμό και δεν πρέπει ΠΟΤΕ να χρησιμοποιείται για άλλο σκοπό πέραν της αντιμετώπισης προβλημάτων, με έναν κωδικό πρόσβασης μίας χρήσης που πρέπει αμέσως να θεωρείται παραβιασμένος."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_APR1="APR-1"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_BCRYPT="bCrypt"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_SHA1="SHA-1"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_CRYPT="crypt()"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_PLAIN="Απλό Κείμενο"

