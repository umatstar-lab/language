COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_DESC="Αποστέλλεται από το Admin Tools όταν δημιουργείται ένας Υπέρ-Χρήστης και η δυνατότητα Παρακολούθησης λογαριασμών Υπέρ-Χρήστη είναι ενεργοποιημένη."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_SUBJECT="Προστέθηκαν Υπέρ-Χρήστες στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι εντοπίσαμε την ύποπτη προσθήκη ενός ή περισσότερων λογαριασμών Υπέρ-Χρήστη στον ιστότοπό σας, {SITENAME}. Αυτοί οι νέοι λογαριασμοί Υπέρ-Χρήστη δεν φαίνεται να δημιουργήθηκαν μέσω της κανονικής διαδικασίας, δηλαδή της σελίδας «Χρήστες» του Joomla!. Επομένως έχουν αποκλειστεί. Οι νέοι λογαριασμοί Υπέρ-Χρήστη που εντοπίστηκαν και αποκλείστηκαν είναι:\n\n{INFO}\n\nΠρέπει να ανησυχώ;\n======================================================================\n\nΟι λογαριασμοί Υπέρ-Χρήστη έχουν πλήρη πρόσβαση στον ιστότοπό σας. Μπορούν να τροποποιήσουν όλο το περιεχόμενο, χωρίς κανέναν περιορισμό. Μπορούν επίσης να εγκαταστήσουν λογισμικό που μπορεί να προσπελάσει ή να τροποποιήσει κάθε πτυχή του ιστοτόπου σας, συμπεριλαμβανομένων αυθαίρετων αρχείων, περιεχομένου βάσης δεδομένων και ρυθμίσεων παραμέτρων. Χορηγείτε πρόσβαση Υπέρ-Χρήστη μόνο σε άτομα που εμπιστεύεστε.\n\nΑν λαμβάνετε αυτό το email, σημαίνει ότι αυτοί οι λογαριασμοί Υπέρ-Χρήστη δημιουργήθηκαν εκτός της σελίδας «Χρήστες» του Joomla!. Συνήθως αυτό σημαίνει ότι ένας χάκερ βρήκε τρόπο να παρακάμψει την ασφάλεια του ιστοτόπου ή του διακομιστή σας και προσπάθησε να δημιουργήσει κρυφά λογαριασμούς Υπέρ-Χρήστη για τον εαυτό του. Για αυτόν τον λόγο αυτοί οι λογαριασμοί αποκλείστηκαν, δηλαδή δεν μπορούν να χρησιμοποιηθούν για σύνδεση στον ιστότοπό σας.\n\nΩστόσο, είναι πιθανό να λαμβάνετε αυτό το email κατά λάθος: αν εσείς ή ένας άλλος Υπέρ-Χρήστης σκοπεύατε να δημιουργήσετε αυτούς τους λογαριασμούς Υπέρ-Χρήστη και χρησιμοποιήσατε εργαλείο τρίτου μέρους για να το κάνετε. Αν συμβαίνει αυτό, μην ανησυχείτε. Απλώς συνδεθείτε στο περιβάλλον διαχείρισης backend του ιστοτόπου σας με τον δικό σας λογαριασμό Υπέρ-Χρήστη, μεταβείτε στη σελίδα Χρήστες, επεξεργαστείτε τους χρήστες που αναφέρονται παραπάνω σε αυτό το email και αφαιρέστε τον αποκλεισμό τους.\n\nΑν εσείς ή ένας άλλος Υπέρ-Χρήστης ΔΕΝ σκοπεύατε να δημιουργήσετε αυτούς τους Υπέρ-Χρήστες, σας συνιστούμε να ελέγξετε τον ιστότοπό σας και τον διακομιστή σας για τυχόν άλλες ενδείξεις ανώμαλης δραστηριότητας.\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι εντοπίσαμε την ύποπτη προσθήκη ενός ή περισσότερων λογαριασμών Υπέρ-Χρήστη στον ιστότοπό σας, {SITENAME}. Αυτοί οι νέοι λογαριασμοί Υπέρ-Χρήστη δεν φαίνεται να δημιουργήθηκαν μέσω της κανονικής διαδικασίας, δηλαδή της σελίδας «Χρήστες» του Joomla!. Επομένως έχουν αποκλειστεί. Οι νέοι λογαριασμοί Υπέρ-Χρήστη που εντοπίστηκαν <strong>και αποκλείστηκαν</strong> είναι:</p>{INFO_HTML}<h3>Πρέπει να ανησυχώ;</h3><p>Οι λογαριασμοί Υπέρ-Χρήστη έχουν πλήρη πρόσβαση στον ιστότοπό σας. Μπορούν να τροποποιήσουν όλο το περιεχόμενο, χωρίς κανέναν περιορισμό. Μπορούν επίσης να εγκαταστήσουν λογισμικό που μπορεί να προσπελάσει ή να τροποποιήσει κάθε πτυχή του ιστοτόπου σας, συμπεριλαμβανομένων αυθαίρετων αρχείων, περιεχομένου βάσης δεδομένων και ρυθμίσεων παραμέτρων. Χορηγείτε πρόσβαση Υπέρ-Χρήστη μόνο σε άτομα που εμπιστεύεστε.</p><p>Αν λαμβάνετε αυτό το email, σημαίνει ότι αυτοί οι λογαριασμοί Υπέρ-Χρήστη δημιουργήθηκαν εκτός της σελίδας «Χρήστες» του Joomla!. Συνήθως αυτό σημαίνει ότι ένας χάκερ βρήκε τρόπο να παρακάμψει την ασφάλεια του ιστοτόπου ή του διακομιστή σας και προσπάθησε να δημιουργήσει κρυφά λογαριασμούς Υπέρ-Χρήστη για τον εαυτό του. Για αυτόν τον λόγο αυτοί οι λογαριασμοί αποκλείστηκαν, δηλαδή δεν μπορούν να χρησιμοποιηθούν για σύνδεση στον ιστότοπό σας.</p><p>Ωστόσο, είναι πιθανό να λαμβάνετε αυτό το email κατά λάθος: αν εσείς ή ένας άλλος Υπέρ-Χρήστης σκοπεύατε να δημιουργήσετε αυτούς τους λογαριασμούς Υπέρ-Χρήστη και χρησιμοποιήσατε εργαλείο τρίτου μέρους για να το κάνετε. Αν συμβαίνει αυτό, μην ανησυχείτε. Απλώς συνδεθείτε στο περιβάλλον διαχείρισης backend του ιστοτόπου σας με τον δικό σας λογαριασμό Υπέρ-Χρήστη, μεταβείτε στη σελίδα Χρήστες, επεξεργαστείτε τους χρήστες που αναφέρονται παραπάνω σε αυτό το email και αφαιρέστε τον αποκλεισμό τους.</p><p>Αν εσείς ή ένας άλλος Υπέρ-Χρήστης ΔΕΝ σκοπεύατε να δημιουργήσετε αυτούς τους Υπέρ-Χρήστες, σας συνιστούμε να ελέγξετε τον ιστότοπό σας και τον διακομιστή σας για τυχόν άλλες ενδείξεις ανώμαλης δραστηριότητας.</p><p>Με εκτίμηση,</p><p>Η ομάδα του {SITENAME}</p><p><small>Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο <em>{SITENAME}</em>. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση.</small></p>"

COM_ADMINTOOLS_MAIL_RESCUEURL_TITLE="Admin Tools: URL Διάσωσης"
COM_ADMINTOOLS_MAIL_RESCUEURL_DESC="Αποστέλλεται από το Admin Tools όταν ένας χρήστης backend ζητά ένα URL Διάσωσης για να ανακτήσει πρόσβαση στον ιστότοπο."
COM_ADMINTOOLS_EMAIL_RESCUEURL_SUBJECT="Ζητήθηκε URL Διάσωσης στο {SITENAME} για τον {USER}"
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι ο χρήστης {USER} έχει ζητήσει ένα URL Διάσωσης για τον ιστότοπό σας, {SITENAME}. Αν κάνατε εσείς αυτό το αίτημα, κάντε κλικ στον παρακάτω σύνδεσμο ή αντιγράψτε και επικολλήστε τη διεύθυνση URL στο πρόγραμμα περιήγησής σας. Αυτό θα σας επιτρέψει να συνδεθείτε στο περιβάλλον διαχείρισης backend του ιστοτόπου σας, όπου μπορείτε να τροποποιήσετε τον αποκλεισμό σας ή/και να αλλάξετε τις ρυθμίσεις του Admin Tools. Το URL Διάσωσης είναι:\n\n{RESCUEURL}\n\nΟι πληροφορίες στο τέλος αυτού του email σας ενημερώνουν για το τι πρέπει να κάνετε μόλις συνδεθείτε στο backend του ιστοτόπου σας.\n\nΔεν έχω ιδέα γιατί λαμβάνω αυτό το email\n======================================================================\n\nΔείτε την ενότητα «Τι είναι το URL Διάσωσης» παρακάτω. ΔΕΝ χρειάζεται να κάνετε καμία ενέργεια και ΔΕΝ χρειάζεται να ανησυχείτε.\n\nΠοιος ζήτησε το URL Διάσωσης;\n======================================================================\n\nΌνομα Χρήστη: {USER}\nΔιεύθυνση IP: {IP} (Αναζήτηση IP: {LOOKUP})\nUser Agent: {UA}\n\nΤι είναι το URL Διάσωσης;\n======================================================================\n\nΜερικές φορές μια υπερβολικά αυστηρή ρύθμιση παραμέτρων του Admin Tools μπορεί να οδηγήσει στον κατά λάθος αποκλεισμό σας, ενός Υπέρ-Χρήστη, από τον ιστότοπο. Κανονικά αυτό θα απαιτούσε τη μετονομασία του αρχείου του πρόσθετου συστήματος του Admin Tools για να αφαιρεθεί ο αποκλεισμός. Αυτό είναι λίγο πολύπλοκο και επιρρεπές σε σφάλματα.\n\nΗ δυνατότητα URL Διάσωσης αντιμετωπίζει αυτό. Αποκτώντας πρόσβαση σε μια ειδική διεύθυνση URL όταν αποκλείεστε από τον ιστότοπο, λαμβάνετε αυτό το email. Η διεύθυνση URL σε αυτό το email είναι έγκυρη μόνο για το ίδιο πρόγραμμα περιήγησης και διεύθυνση IP που έκανε το αίτημα και μόνο για περιορισμένο χρονικό διάστημα. Η πρόσβαση σε αυτήν θα σας οδηγήσει σε μια προσωρινά μη αποκλεισμένη σελίδα σύνδεσης διαχειριστή. Αυτό σας επιτρέπει να αποκτήσετε πρόσβαση στο περιβάλλον διαχείρισης backend του ιστοτόπου σας για να αφαιρέσετε τον αποκλεισμό σας ή/και να τροποποιήσετε τις ρυθμίσεις του Admin Tools.\n\nΑπό προεπιλογή, αυτή η δυνατότητα είναι ενεργοποιημένη σε όλες τις εγκαταστάσεις του Admin Tools. Επίσης, ένα μήνυμα σχετικά με την πρόσβαση στο URL Διάσωσης εμφανίζεται από προεπιλογή όταν κάποιος αποκλείεται, ΕΚΤΟΣ ΑΝ ορίσετε ένα «Προσαρμοσμένο μήνυμα» στη σελίδα Ρύθμιση WAF του Admin Tools. Αν δεν έχετε ιδέα γιατί λάβατε αυτό το μήνυμα, πιθανώς κάποιος είδε το προεπιλεγμένο μήνυμα αποκλεισμού IP και μάντεψε σωστά τη διεύθυνση email του Υπέρ-Χρήστη σας. Μην ανησυχείτε όμως, αυτό που έκαναν είναι εντελώς άχρηστο, καθώς θα χρειαζόντουσαν επίσης πρόσβαση στον λογαριασμό email σας και τον κωδικό πρόσβασής σας ως Υπέρ-Χρήστη για να αποκτήσουν πρόσβαση στον ιστότοπό σας, δηλαδή θα έπρεπε να σας έχουν ήδη παραβιάσει. Όπως έχει ήδη τεκμηριωθεί, σας συνιστούμε ανεπιφύλακτα να αλλάξετε το «Προσαρμοσμένο μήνυμα» για να μην είναι τόσο εμφανές ότι ο ιστότοπός σας προστατεύεται από το Admin Tools. Αν δεν επιθυμείτε να χρησιμοποιήσετε τη δυνατότητα URL Διάσωσης -και είστε εντάξει με τη μη αυτόματη μετονομασία αρχείων σύμφωνα με την τεκμηρίωση όταν αποκλειστείτε- μεταβείτε στις Επεκτάσεις, Πρόσθετα και επεξεργαστείτε τις επιλογές του πρόσθετου συστήματος Admin Tools. Θα δείτε μια επιλογή για URL Διάσωσης. Ορίστε την σε Όχι για να απενεργοποιήσετε αυτήν τη δυνατότητα.\n\nΤι πρέπει να κάνω μετά τη σύνδεση;\n======================================================================\n\nΑν η διεύθυνση IP σας έχει αποκλειστεί από το Admin Tools, μεταβείτε στα Συστατικά, Admin Tools και κάντε κλικ στο μεγάλο κουμπί Κατάργηση Αποκλεισμού IP μου στην κορυφή της σελίδας.\n\nΑν συνεχίζετε να αποκλείεστε χωρίς να κάνετε τίποτα ύποπτο, η αποκλεισμένη IP είναι πάντα η ίδια αλλά διαφορετική από αυτήν που αναφέρεται από http://www.ip-adress.eu/ και https://www.whatismyip.com/, τότε ο ιστότοπός σας μπορεί να βρίσκεται πίσω από ένα CDN ή αντίστροφο διακομιστή μεσολάβησης. Σε αυτήν την περίπτωση, επιπλέον των παραπάνω οδηγιών, μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις. Ορίστε την επιλογή «Πίσω από Load Balancer» σε Ναι και αποθηκεύστε.\n\nΑν όμως η πραγματική διεύθυνση IP σας όπως αναφέρεται από τα δύο εργαλεία που αναφέρονται παραπάνω συνεχίζει να αποκλείεται, πρέπει να αντιμετωπίσετε την αιτία του αποκλεισμού. Μεταβείτε στα Συστατικά, Admin Tools, Web Application Firewall, Αρχείο Καταγραφής Εξαιρέσεων Ασφαλείας και ελέγξτε την Αιτία και την Διεύθυνση URL στόχου για τις καταχωρήσεις που έχουν τη διεύθυνση IP σας στο πεδίο διεύθυνσης IP. Αν δεν είστε σίγουροι για το τι σημαίνει αυτό, υποβάλετε ένα αίτημα υποστήριξης θυμούμενοι να αντιγράψετε τις πληροφορίες από το Αρχείο Καταγραφής Εξαιρέσεων Ασφαλείας. Σημειώστε ότι πρέπει να διαθέτετε ενεργή συνδρομή για να λάβετε υποστήριξη.\n\nΑν έχετε ξεχάσει την παράμετρο Μυστικής Διεύθυνσης URL Διαχειριστή, μεταβείτε στα Συστατικά, Admin Tools, Web Application Firewall, Ρύθμιση WAF, κάντε κλικ στην καρτέλα Βασικές Λειτουργίες Προστασίας και βρείτε την επιλογή «Μυστική παράμετρος URL Διαχειριστή». Αλλάξτε ή αφαιρέστε όλο το κείμενο σε αυτό το πεδίο για να επαναφέρετε ή να καταργήσετε, αντίστοιχα, αυτήν τη δυνατότητα.\n\nΤι πρέπει να κάνω αν εξακολουθώ να μην μπορώ να συνδεθώ στον ιστότοπό μου;\n======================================================================\n\nΥπάρχουν δύο περιπτώσεις όπου η δυνατότητα URL Διάσωσης, ή η μετονομασία του αρχείου του πρόσθετου συστήματος του Admin Tools, δεν θα σας βοηθήσει. Αυτές είναι οι δύο περιπτώσεις όπου το Admin Tools έχει δημιουργήσει ένα αρχείο ρυθμίσεων διακομιστή, που σημαίνει ότι αποκλείεστε από τον διακομιστή σας, όχι από το Admin Tools.\n\nΗ πρώτη είναι η δυνατότητα Προστασίας καταλόγου Διαχειριστή με κωδικό πρόσβασης. Διαγράψτε τα αρχεία με ονόματα .htaccess και .htpasswd από τον κατάλογο administrator του ιστοτόπου σας.\n\nΗ άλλη περίπτωση είναι όταν έχετε χρησιμοποιήσει τη δυνατότητα Δημιουργός .htaccess του Admin Tools. Σε αυτήν την περίπτωση υπάρχει ένα αρχείο .htaccess στον ριζικό κατάλογο του ιστοτόπου σας. Ίσως θέλετε να αντικαταστήσετε τα περιεχόμενά του με το προεπιλεγμένο περιεχόμενο αρχείου .htaccess του Joomla!.\n\nΚαι στις δύο περιπτώσεις θα πρέπει να σημειώσετε ότι τα αρχεία έχουν ονόματα που αρχίζουν με τελεία. Αυτό τα καθιστά κρυφά. Θα πρέπει να ενεργοποιήσετε την εμφάνιση κρυφών αρχείων για να επεξεργαστείτε ή να διαγράψετε αυτά τα αρχεία. Αν δεν είστε σίγουροι για το πώς να το κάνετε, ρωτήστε τον πάροχο φιλοξενίας σας και πείτε τους ότι πρέπει να επεξεργαστείτε ή να διαγράψετε κρυφά αρχεία. Συνήθως θα σας υποδείξουν μια επιλογή στη διαχείριση αρχείων του πίνακα ελέγχου φιλοξενίας τους.\n\nΣε οποιαδήποτε άλλη περίπτωση, το πρόβλημά σας δεν σχετίζεται με το Admin Tools. Έχετε άλλο πρόσθετο ασφαλείας στον ιστότοπό σας; Αν ναι, ελέγξτε τις ρυθμίσεις του. Αν όχι, επικοινωνήστε με τον πάροχο φιλοξενίας σας. Τις περισσότερες φορές οι πάροχοι φιλοξενίας έχουν τα δικά τους συστήματα ασφαλείας διακομιστή που μπορούν να σας αποκλείσουν από τον ιστότοπό σας."
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι ο χρήστης {USER} έχει ζητήσει ένα URL Διάσωσης για τον ιστότοπό σας, {SITENAME}. Αν κάνατε εσείς αυτό το αίτημα, κάντε κλικ στον παρακάτω σύνδεσμο ή αντιγράψτε και επικολλήστε τη διεύθυνση URL στο πρόγραμμα περιήγησής σας. Αυτό θα σας επιτρέψει να συνδεθείτε στο περιβάλλον διαχείρισης backend του ιστοτόπου σας, όπου μπορείτε να τροποποιήσετε τον αποκλεισμό σας ή/και να αλλάξετε τις ρυθμίσεις του Admin Tools. Το URL Διάσωσης είναι:</p><p><a href=\"{RESCUEURL}\" rel=\"alternate\">{RESCUEURL}</a></p><p>Οι πληροφορίες στο τέλος αυτού του email σας ενημερώνουν για το τι πρέπει να κάνετε μόλις συνδεθείτε στο backend του ιστοτόπου σας.</p><h3>Δεν έχω ιδέα γιατί λαμβάνω αυτό το email</h3><p>Δείτε την ενότητα «Τι είναι το URL Διάσωσης» παρακάτω. <strong>ΔΕΝ</strong> χρειάζεται να κάνετε καμία ενέργεια και <strong>ΔΕΝ</strong> χρειάζεται να ανησυχείτε.</p><h3>Ποιος ζήτησε το URL Διάσωσης;</h3><p>Όνομα Χρήστη: {USER}<br />Διεύθυνση IP: {IP} (<a href=\"{LOOKUP}\">Αναζήτηση IP</a>)<br />User Agent: {UA}</p><h3>Τι είναι το URL Διάσωσης;</h3><p>Μερικές φορές μια υπερβολικά αυστηρή ρύθμιση παραμέτρων του Admin Tools μπορεί να οδηγήσει στον κατά λάθος αποκλεισμό σας, ενός Υπέρ-Χρήστη, από τον ιστότοπο. Κανονικά αυτό θα απαιτούσε τη μετονομασία του αρχείου του πρόσθετου συστήματος του Admin Tools για να αφαιρεθεί ο αποκλεισμός. Αυτό είναι λίγο πολύπλοκο και επιρρεπές σε σφάλματα.</p><p>Η δυνατότητα URL Διάσωσης αντιμετωπίζει αυτό. Αποκτώντας πρόσβαση σε μια ειδική διεύθυνση URL όταν αποκλείεστε από τον ιστότοπο, λαμβάνετε αυτό το email. Η διεύθυνση URL σε αυτό το email είναι έγκυρη μόνο για το ίδιο πρόγραμμα περιήγησης και διεύθυνση IP που έκανε το αίτημα και μόνο για περιορισμένο χρονικό διάστημα. Η πρόσβαση σε αυτήν θα σας οδηγήσει σε μια <em>προσωρινά</em> μη αποκλεισμένη σελίδα σύνδεσης διαχειριστή. Αυτό σας επιτρέπει να αποκτήσετε πρόσβαση στο περιβάλλον διαχείρισης backend του ιστοτόπου σας για να αφαιρέσετε τον αποκλεισμό σας ή/και να τροποποιήσετε τις ρυθμίσεις του Admin Tools.</p><p>Από προεπιλογή, αυτή η δυνατότητα είναι ενεργοποιημένη σε όλες τις εγκαταστάσεις του Admin Tools. Επίσης, ένα μήνυμα σχετικά με την πρόσβαση στο URL Διάσωσης εμφανίζεται από προεπιλογή όταν κάποιος αποκλείεται, ΕΚΤΟΣ ΑΝ ορίσετε ένα «Προσαρμοσμένο μήνυμα» στη σελίδα Ρύθμιση WAF του Admin Tools. Αν δεν έχετε ιδέα γιατί λάβατε αυτό το μήνυμα, πιθανώς κάποιος είδε το προεπιλεγμένο μήνυμα αποκλεισμού IP και μάντεψε σωστά τη διεύθυνση email του Υπέρ-Χρήστη σας. Μην ανησυχείτε όμως, αυτό που έκαναν είναι εντελώς άχρηστο, καθώς θα χρειαζόντουσαν επίσης πρόσβαση στον λογαριασμό email σας και τον κωδικό πρόσβασής σας ως Υπέρ-Χρήστη για να αποκτήσουν πρόσβαση στον ιστότοπό σας, δηλαδή θα έπρεπε να σας έχουν ήδη παραβιάσει. Όπως έχει ήδη τεκμηριωθεί, σας συνιστούμε ανεπιφύλακτα να αλλάξετε το «Προσαρμοσμένο μήνυμα» για να μην είναι τόσο εμφανές ότι ο ιστότοπός σας προστατεύεται από το Admin Tools. Αν δεν επιθυμείτε να χρησιμοποιήσετε τη δυνατότητα URL Διάσωσης -και είστε εντάξει με τη μη αυτόματη μετονομασία αρχείων σύμφωνα με την τεκμηρίωση όταν αποκλειστείτε- μεταβείτε στις Επεκτάσεις, Πρόσθετα και επεξεργαστείτε τις επιλογές του πρόσθετου συστήματος Admin Tools. Θα δείτε μια επιλογή για URL Διάσωσης. Ορίστε την σε Όχι για να απενεργοποιήσετε αυτήν τη δυνατότητα.</p><h3>Τι πρέπει να κάνω μετά τη σύνδεση;</h3><p>Αν η διεύθυνση IP σας έχει αποκλειστεί από το Admin Tools, μεταβείτε στα Συστατικά, Admin Tools και κάντε κλικ στο μεγάλο κουμπί Κατάργηση Αποκλεισμού IP μου στην κορυφή της σελίδας.</p><p>Αν συνεχίζετε να αποκλείεστε χωρίς να κάνετε τίποτα ύποπτο, η αποκλεισμένη IP είναι πάντα η ίδια αλλά διαφορετική από αυτήν που αναφέρεται από <a href=\"http://www.ip-adress.eu/\">http://www.ip-adress.eu/ </a><em>και</em> <a href=\"https://www.whatismyip.com/\">https://www.whatismyip.com/</a>, τότε ο ιστότοπός σας μπορεί να βρίσκεται πίσω από ένα CDN ή αντίστροφο διακομιστή μεσολάβησης. Σε αυτήν την περίπτωση, επιπλέον των παραπάνω οδηγιών, μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις. Ορίστε την επιλογή «Πίσω από Load Balancer» σε Ναι και αποθηκεύστε.</p><p>Αν όμως η πραγματική διεύθυνση IP σας όπως αναφέρεται από τα δύο εργαλεία που αναφέρονται παραπάνω συνεχίζει να αποκλείεται, πρέπει να αντιμετωπίσετε την αιτία του αποκλεισμού. Μεταβείτε στα Συστατικά, Admin Tools, Web Application Firewall, Αρχείο Καταγραφής Εξαιρέσεων Ασφαλείας και ελέγξτε την Αιτία και την Διεύθυνση URL στόχου για τις καταχωρήσεις που έχουν τη διεύθυνση IP σας στο πεδίο διεύθυνσης IP. Αν δεν είστε σίγουροι για το τι σημαίνει αυτό, <a href=\"https://www.akeeba.com/support/admin-tools.html\" rel=\"alternate\">υποβάλετε ένα αίτημα υποστήριξης</a> θυμούμενοι να αντιγράψετε τις πληροφορίες από το Αρχείο Καταγραφής Εξαιρέσεων Ασφαλείας. Σημειώστε ότι πρέπει να διαθέτετε ενεργή συνδρομή για να λάβετε υποστήριξη.</p><p>Αν έχετε ξεχάσει την παράμετρο Μυστικής Διεύθυνσης URL Διαχειριστή, μεταβείτε στα Συστατικά, Admin Tools, Web Application Firewall, Ρύθμιση WAF, κάντε κλικ στην καρτέλα Βασικές Λειτουργίες Προστασίας και βρείτε την επιλογή «Μυστική παράμετρος URL Διαχειριστή». Αλλάξτε ή αφαιρέστε όλο το κείμενο σε αυτό το πεδίο για να επαναφέρετε ή να καταργήσετε, αντίστοιχα, αυτήν τη δυνατότητα.</p><h3>Τι πρέπει να κάνω αν εξακολουθώ να μην μπορώ να συνδεθώ στον ιστότοπό μου;</h3><p>Υπάρχουν δύο περιπτώσεις όπου η δυνατότητα URL Διάσωσης, ή η μετονομασία του αρχείου του πρόσθετου συστήματος του Admin Tools, δεν θα σας βοηθήσει. Αυτές είναι οι δύο περιπτώσεις όπου το Admin Tools έχει δημιουργήσει ένα αρχείο ρυθμίσεων <em>διακομιστή</em>, που σημαίνει ότι αποκλείεστε από <em>τον διακομιστή σας</em>, όχι από το Admin Tools.</p><p>Η πρώτη είναι η δυνατότητα <strong>Προστασίας καταλόγου Διαχειριστή με κωδικό πρόσβασης</strong>. Διαγράψτε τα αρχεία με ονόματα <code>.htaccess</code> και <code>.htpasswd</code> από τον κατάλογο <code>administrator</code> του ιστοτόπου σας. </p><p>Η άλλη περίπτωση είναι όταν έχετε χρησιμοποιήσει τη δυνατότητα <strong>Δημιουργός .htaccess</strong> του Admin Tools. Σε αυτήν την περίπτωση υπάρχει ένα αρχείο <code>.htaccess</code> στον ριζικό κατάλογο του ιστοτόπου σας. Ίσως θέλετε να αντικαταστήσετε τα περιεχόμενά του με το <a href=\"https://raw.githubusercontent.com/joomla/joomla-cms/staging/htaccess.txt\" rel=\"alternate\">προεπιλεγμένο περιεχόμενο αρχείου .htaccess του Joomla!</a>.</p><p>Και στις δύο περιπτώσεις θα πρέπει να σημειώσετε ότι τα αρχεία έχουν ονόματα που αρχίζουν με τελεία. Αυτό τα καθιστά <em>κρυφά</em>. Θα πρέπει να ενεργοποιήσετε την εμφάνιση κρυφών αρχείων για να επεξεργαστείτε ή να διαγράψετε αυτά τα αρχεία. Αν δεν είστε σίγουροι για το πώς να το κάνετε, ρωτήστε τον πάροχο φιλοξενίας σας και πείτε τους ότι πρέπει να επεξεργαστείτε ή να διαγράψετε <em>κρυφά</em> αρχεία. Συνήθως θα σας υποδείξουν μια επιλογή στη διαχείριση αρχείων του πίνακα ελέγχου φιλοξενίας τους. </p><p>Σε οποιαδήποτε άλλη περίπτωση, το πρόβλημά σας δεν σχετίζεται με το Admin Tools. Έχετε άλλο πρόσθετο ασφαλείας στον ιστότοπό σας; Αν ναι, ελέγξτε τις ρυθμίσεις του. Αν όχι, επικοινωνήστε με τον πάροχο φιλοξενίας σας. Τις περισσότερες φορές οι πάροχοι φιλοξενίας έχουν τα δικά τους συστήματα ασφαλείας διακομιστή που μπορούν να σας αποκλείσουν από τον ιστότοπό σας.</p>"

COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_TITLE="Admin Tools: Αποκλεισμένο αίτημα"
COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_DESC="Αποστέλλεται από το Admin Tools όταν ένα αίτημα αποκλείεται από το Web Application Firewall."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_SUBJECT="Αποκλεισμένο αίτημα στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι εντοπίστηκε μια εξαίρεση ασφαλείας στον ιστότοπό σας, {SITENAME}, με τις ακόλουθες λεπτομέρειες:\n\nΔιεύθυνση IP: {IP} (Αναζήτηση IP: {LOOKUP})\nΑιτία: {REASON}\n\nΑν αυτού του είδους η εξαίρεση ασφαλείας επαναλαμβάνεται, συνδεθείτε στο backend του ιστοτόπου σας και προσθέστε αυτήν τη διεύθυνση IP στη δυνατότητα Web Application Firewall του Admin Tools σας για να αποκλείσετε πλήρως τον χρήστη που παραβιάζει κανόνες.\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι εντοπίστηκε μια εξαίρεση ασφαλείας στον ιστότοπό σας, {SITENAME}, με τις ακόλουθες λεπτομέρειες:</p><p>Διεύθυνση IP: {IP} (<a href=\"{LOOKUP}\">Αναζήτηση IP</a>)<br />Αιτία: {REASON}</p><p>Αν αυτού του είδους η εξαίρεση ασφαλείας επαναλαμβάνεται, συνδεθείτε στο backend του ιστοτόπου σας και προσθέστε αυτήν τη διεύθυνση IP στη δυνατότητα Web Application Firewall του Admin Tools σας για να αποκλείσετε πλήρως τον χρήστη που παραβιάζει κανόνες.</p><p>Με εκτίμηση,</p><p>Η ομάδα του {SITENAME}</p><p><small>Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο <em>{SITENAME}</em>. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση.</small></p>"

COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_TITLE="Admin Tools: Πολλά αποκλεισμένα αιτήματα"
COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_DESC="Αποστέλλεται από το Admin Tools όταν ο ιστότοπός σας έχει αποκλείσει μεγάλο αριθμό αιτημάτων σε μια χρονική περίοδο."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_SUBJECT="Αυξημένος αριθμός αποκλεισμένων αιτημάτων στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι ο ιστότοπος {SITENAME} αποκλείει αυτήν τη στιγμή αυξημένο αριθμό αιτημάτων.\n\nΣυνολικά {NUM} αιτήματα έχουν αποκλειστεί από τις {DATE}. Ίσως θέλετε να ελέγξετε την αιτία των αποκλεισμένων αιτημάτων και να εξετάσετε αν απαιτούνται πρόσθετα μέτρα αν υποψιάζεστε ότι είναι η αρχή μιας επίμονης επίθεσης κατά του ιστοτόπου σας."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι ο ιστότοπος {SITENAME} αποκλείει αυτήν τη στιγμή αυξημένο αριθμό αιτημάτων</p><p>Συνολικά {NUM} αιτήματα έχουν αποκλειστεί από τις {DATE}. Ίσως θέλετε να ελέγξετε την αιτία των αποκλεισμένων αιτημάτων και να εξετάσετε αν απαιτούνται πρόσθετα μέτρα αν υποψιάζεστε ότι είναι η αρχή μιας επίμονης επίθεσης κατά του ιστοτόπου σας.</p>"

COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_TITLE="Admin Tools: Απενεργοποιήθηκαν οι λίστες IP των crawlers"
COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_DESC="Αποστέλλεται από το Admin Tools στους Υπέρ-Χρήστες όταν απενεργοποιεί αυτόματα την επιλογή «Χρήση λιστών IP των crawlers» επειδή η cache του ιστοτόπου φαίνεται να μην λειτουργεί ή οι λίστες δεν μπορούν να ληφθούν."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_SUBJECT="Οι λίστες IP των crawlers απενεργοποιήθηκαν στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY="Γεια σας,\n\nΤο Admin Tools απενεργοποίησε αυτόματα την επιλογή «Χρήση λιστών IP των crawlers» στο {SITENAME} στις {DATE}, επειδή {CAUSE}.\n\nΑυτό προστατεύει τον ιστότοπό σας από επιβράδυνση. Μέχρι να ενεργοποιήσετε ξανά την επιλογή, οι ρυθμίσεις σας Αποκλεισμός και Να μην αποκλείεται για τους crawlers μηχανών αναζήτησης και τεχνητής νοημοσύνης δεν εφαρμόζονται.\n\nΠώς να το διορθώσετε:\n\n* Αν η αιτία είναι ότι η cache του ιστοτόπου δεν αποθηκεύει δεδομένα: μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις, Σύστημα, και ελέγξτε τις ρυθμίσεις της Cache. Βεβαιωθείτε ότι ο φάκελος cache είναι εγγράψιμος ή ότι ο διακομιστής Redis ή Memcached εκτελείται και είναι προσβάσιμος.\n* Αν η αιτία είναι ότι η λήψη των λιστών αποτυγχάνει συνεχώς: ελέγξτε ότι ο διακομιστής σας επιτρέπεται να πραγματοποιεί εξερχόμενες συνδέσεις σε άλλους ιστότοπους (τείχος προστασίας, ρυθμίσεις proxy, περιορισμοί του παρόχου φιλοξενίας).\n\nΜόλις διορθωθεί το πρόβλημα, μεταβείτε στο Στοιχεία, Admin Tools, Web Application Firewall, Ρύθμιση Παραμέτρων WAF, κάντε κλικ στην καρτέλα Crawlers και ενεργοποιήστε ξανά το «Χρήση λιστών IP των crawlers». Μπορείτε να το κάνετε απευθείας στη διεύθυνση {URL}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικού ταχυδρομείου επειδή είστε Υπέρ-Χρήστης στο {SITENAME}. Μην απαντήσετε σε αυτό το μήνυμα, αποστέλλεται από διεύθυνση που δεν παρακολουθείται."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY_HTML="<p>Γεια σας,</p><p>Το Admin Tools απενεργοποίησε αυτόματα την επιλογή «Χρήση λιστών IP των crawlers» στο {SITENAME} στις {DATE}, επειδή {CAUSE}.</p><p>Αυτό προστατεύει τον ιστότοπό σας από επιβράδυνση. Μέχρι να ενεργοποιήσετε ξανά την επιλογή, οι ρυθμίσεις σας Αποκλεισμός και Να μην αποκλείεται για τους crawlers μηχανών αναζήτησης και τεχνητής νοημοσύνης δεν εφαρμόζονται.</p><p>Πώς να το διορθώσετε:</p><ul><li>Αν η αιτία είναι ότι η cache του ιστοτόπου δεν αποθηκεύει δεδομένα: μεταβείτε στο Σύστημα, Γενικές Ρυθμίσεις, Σύστημα, και ελέγξτε τις ρυθμίσεις της Cache. Βεβαιωθείτε ότι ο φάκελος cache είναι εγγράψιμος ή ότι ο διακομιστής Redis ή Memcached εκτελείται και είναι προσβάσιμος.</li><li>Αν η αιτία είναι ότι η λήψη των λιστών αποτυγχάνει συνεχώς: ελέγξτε ότι ο διακομιστής σας επιτρέπεται να πραγματοποιεί εξερχόμενες συνδέσεις σε άλλους ιστότοπους (τείχος προστασίας, ρυθμίσεις proxy, περιορισμοί του παρόχου φιλοξενίας).</li></ul><p>Μόλις διορθωθεί το πρόβλημα, μεταβείτε στο Στοιχεία, Admin Tools, Web Application Firewall, Ρύθμιση Παραμέτρων WAF, κάντε κλικ στην καρτέλα Crawlers και ενεργοποιήστε ξανά το «Χρήση λιστών IP των crawlers». Μπορείτε να το κάνετε απευθείας <a href=\"{URL}\">στη Ρύθμιση Παραμέτρων WAF</a>.</p><p><small>Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικού ταχυδρομείου επειδή είστε Υπέρ-Χρήστης στο <em>{SITENAME}</em>. Μην απαντήσετε σε αυτό το μήνυμα, αποστέλλεται από διεύθυνση που δεν παρακολουθείται.</small></p>"

