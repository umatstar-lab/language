COM_ADMINTOOLS_CLI_SERVERCONFIGGET_HELP="<info>%command.name%</info> θα ανακτήσει την τιμή μιας επιλογής Ρύθμισης Παραμέτρων Διακομιστή του Admin Tools.\nΧρήση: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_SERVERCONFIG_OPT_RULE="Το όνομα του κανόνα για ανάκτηση"
