COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_TITLE="Δεν έχουν οριστεί ακόμα Απαγορευμένες Λέξεις."
COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_CONTENT="Οι Απαγορευμένες Λέξεις σάς επιτρέπουν να αποκλείετε οποιοδήποτε δημόσιο αίτημα στο frontend που περιλαμβάνει μία ή περισσότερες από αυτές τις λέξεις σε οποιαδήποτε παράμετρο αιτήματος. Μπορούν να χρησιμοποιηθούν για τον αποκλεισμό προφανούς spam και ανάρμοστης γλώσσας από την υποβολή στον ιστοτόπο σας."
