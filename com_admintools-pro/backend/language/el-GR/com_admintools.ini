COM_ADMINTOOLS_EMAILTEMPLATES_LBL_RESET="Επαναφέρει τα πρότυπα email. Αυτό αφαιρεί όλα τα πρότυπα email για το Admin Tools, <strong>συμπεριλαμβανομένων τυχόν προτύπων email που έχουν τροποποιηθεί από τον χρήστη</strong>. Στη συνέχεια εγκαθιστά εκ νέου όλα τα πρότυπα email του Admin Tools. Χρησιμοποιήστε αυτό το κουμπί μόνο αν πιστεύετε ότι έχετε καταστρέψει κάτι στη βάση δεδομένων σας. Διαφορετικά, χρησιμοποιήστε τη διαχείριση Προτύπων Email του Joomla! για να επαναφέρετε το θέμα και το σώμα κάθε email στο προεπιλεγμένο χρησιμοποιώντας τα κουμπιά που παρέχονται στη διεπαφή του Joomla!."

