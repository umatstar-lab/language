COM_ADMINTOOLS_ACL_PERMISSION_UTILS_DESC="Να επιτρέπεται η πρόσβαση σε λειτουργίες βοηθητικών προγραμμάτων"
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_TITLE="Βοηθητικά Προγράμματα"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_TITLE="Ασφάλεια"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_DESC="Να επιτρέπεται η πρόσβαση σε λειτουργίες ασφαλείας. Περιλαμβάνει τον οδηγό Προσωρινών Υπέρ-Χρηστών, επομένως αντιμετωπίστε το ως ισοδύναμο με παραχώρηση πρόσβασης Υπέρ-Χρήστη."
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_TITLE="Συντήρηση"
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_DESC="Να επιτρέπεται η πρόσβαση σε συντήρηση βάσης δεδομένων και δικαιωμάτων"

