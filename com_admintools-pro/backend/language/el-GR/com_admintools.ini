COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_DESC="Το όνομα του συστατικού Joomla! που αντιστοιχεί σε αυτόν τον κανόνα. Αν αφεθεί κενό (\"– Συστατικό –\") αντιστοιχεί σε όλα τα συστατικά."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_SELECT="– Συστατικό –"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW="Όνομα Προβολής"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_DESC="Η προβολή (περιοχή συστατικού) ή το όνομα του ελεγκτή του συστατικού που πρέπει να υπάρχει στη διεύθυνση URL για να αντιστοιχεί αυτός ο κανόνας. Απενεργοποιήστε τις SEF διευθύνσεις URL και θα δείτε είτε <code>view=ViewName</code> είτε <code>task=ViewName.TaskName</code> όπου <var>ViewName</var> είναι το Όνομα Προβολής που πρέπει να εισάγετε εδώ. Αν αφεθεί κενό αντιστοιχεί σε όλες τις προβολές. Εάν θέλετε να αντιστοιχεί μια διαδρομή SEF URL, αφήστε το Συστατικό στο \"(Όλα)\" και εισάγετε τη διαδρομή SEF <strong>ΜΕ</strong> κάθετο στην αρχή αλλά <strong>ΧΩΡΙΣ</strong> <code>index.php</code>. Για παράδειγμα, χρησιμοποιήστε <code>/foo/bar</code>. Σε πολύγλωσσους ιστότοπους ΔΕΝ πρέπει να συμπεριλαμβάνετε το πρόθεμα γλώσσας, π.χ. <s><code>/en/example</code></s> είναι λάθος, ενώ <code>/example</code> είναι σωστό. Σημειώστε ότι αυτή μπορεί να είναι μια <em>μερική</em> διαδρομή, π.χ. <code>/foo/bar</code> αντιστοιχεί τόσο στο <code>/foo/bar/test</code> όσο και στο <code>/foo/bar.html</code>."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_ANY="(Όλα)"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY="Παράμετρος Αιτήματος"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_DESC="Ποια παράμετρος αιτήματος να απενεργοποιήσει το φιλτράρισμα ασφαλείας, π.χ. <code>id</code>. Αφήστε κενό για αντιστοίχιση με όλες τις παραμέτρους αιτήματος. Σημειώστε ότι οι Εξαιρέσεις WAF εφαρμόζονται αφού η Joomla! μετατρέψει μια SEF διεύθυνση URL στη μη-SEF μορφή της, ανεξάρτητα από το αν έχετε ενεργοποιήσει SEF διευθύνσεις URL στον ιστότοπό σας."
