COM_ADMINTOOLS_BADWORDS_LBL_WORD="Λέξη"
COM_ADMINTOOLS_BADWORDS_LBL_WORD_DESC="Η Απαγορευμένη Λέξη που θέλετε να αποκλείσετε. Δεν κάνει διάκριση πεζών-κεφαλαίων, δηλ. τα <code>test</code>, <code>TEST</code> και <code>TesT</code> θεωρούνται ως η ίδια λέξη."
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE="Διαφυγή κανονικής έκφρασης"
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE_DESC="Το πεδίο Λέξη είναι κανονική έκφραση, η οποία ενσωματώνεται στο <code>#\b&lt;ΟΤΙ ΠΛΗΚΤΡΟΛΟΓΗΣΑΤΕ&gt;\b#iu</code>. Οτιδήποτε περιέχει εκτός από γράμματα, αριθμούς, παύλες και κάτω παύλες έχει ειδική σημασία — το <code>.</code> ταιριάζει με οποιονδήποτε χαρακτήρα, το <code>*</code> επαναλαμβάνει τον προηγούμενο χαρακτήρα, το <code>#</code> τερματίζει την έκφραση, και ούτω καθεξής. Όταν αυτή η επιλογή είναι ορισμένη σε Ναι, το Admin Tools εφαρμόζει αυτόματα διαφυγή σε αυτούς τους χαρακτήρες κατά την αποθήκευση της καταχώρησης, ώστε η λέξη να ταιριάζει κυριολεκτικά με τον εαυτό της. Αφήστε την ορισμένη σε Ναι, εκτός αν γνωρίζετε πώς να γράφετε κανονικές εκφράσεις και θέλετε σκόπιμα να χρησιμοποιήσετε μία. Παρακαλώ συμβουλευτείτε την τεκμηρίωση πριν την απενεργοποιήσετε.<br><br><strong>Κατά την επεξεργασία υπάρχουσας καταχώρησης, ΜΗΝ την ενεργοποιήσετε αν η λέξη είχε ήδη υποστεί διαφυγή όταν προστέθηκε.</strong> Η διαφυγή μιας έκφρασης που έχει ήδη υποστεί διαφυγή την καταστρέφει, και τότε δεν θα ταιριάζει με απολύτως τίποτα. Γι' αυτό η επιλογή έχει προεπιλογή Ναι για νέες καταχωρήσεις και Όχι όταν επεξεργάζεστε μια υπάρχουσα."

COM_ADMINTOOLS_BADWORDS_N_ITEMS_COPIED="%d Απαγορευμένες Λέξεις αντιγράφηκαν."
