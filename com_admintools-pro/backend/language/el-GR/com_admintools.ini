COM_ADMINTOOLS_CLI_OFFLINE_WARN_NOEXEMPTION="Καμία διεύθυνση IP δεν επιτρέπεται να περάσει τον αποκλεισμό. Ο ιστότοπός σας είναι πλέον απροσπέλαστος για όλους, συμπεριλαμβανομένου και εσάς, μέχρι να εκτελέσετε ξανά αυτή την εντολή με --disable. Χρησιμοποιήστε το --exempt-ip με τη δική σας διεύθυνση IP για να διατηρήσετε έναν τρόπο πρόσβασης στον ιστότοπό σας."
COM_ADMINTOOLS_CLI_OFFLINE_RESULT_SUCCESS="Η λειτουργία ολοκληρώθηκε με επιτυχία"
COM_ADMINTOOLS_CLI_OFFLINE_RESULT_FAILURE="Παρουσιάστηκε σφάλμα κατά την αλλαγή κατάστασης"
