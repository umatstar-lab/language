COM_ADMINTOOLS_HTACCESSMAKER_ERR_INVALID_RESTRICTIP="Δεν ήταν δυνατή η λήψη των διευθύνσεων IP για τον ζητούμενο πάροχο. Δοκιμάστε να χρησιμοποιήσετε Προσαρμοσμένη Λίστα και πληκτρολογήστε μη αυτόματα τις διευθύνσεις IP ή τις περιοχές IP."
COM_ADMINTOOLS_HTACCESSMAKER_ERR_RESTRICTIP_EMPTY_HEAD="Περιορισμός πρόσβασης βάσει IP: η λίστα των επιτρεπόμενων διευθύνσεων IP είναι κενή"
COM_ADMINTOOLS_HTACCESSMAKER_ERR_RESTRICTIP_EMPTY="Ο Περιορισμός πρόσβασης βάσει IP έχει οριστεί σε Προσαρμοσμένη Λίστα, αλλά δεν υπάρχουν περιοχές IP με επιτρεπόμενη πρόσβαση. Αυτό θα απέκλειε όλους από τον ιστότοπό σας, και εσάς μαζί, γι' αυτό το παραγόμενο αρχείο δεν περιορίζει καθόλου την πρόσβαση βάσει IP. Προσθέστε τις διευθύνσεις IP ή τις περιοχές IP που πρέπει να έχουν πρόσβαση στον ιστότοπό σας, ή ορίστε τον Περιορισμό πρόσβασης βάσει IP σε Κανένα."
COM_ADMINTOOLS_HTACCESSMAKER_WARN_SKIPPED_USERAGENTS_HEAD="Ορισμένοι user agents προς αποκλεισμό παραλείπονται"
COM_ADMINTOOLS_HTACCESSMAKER_WARN_SKIPPED_USERAGENTS="Ο Αποκλεισμός πρόσβασης από συγκεκριμένους user agents είναι ενεργοποιημένος, αλλά οι παρακάτω καταχωρήσεις των User agents προς αποκλεισμό δεν είναι κανονικές εκφράσεις που μπορεί να χρησιμοποιήσει αυτός ο διακομιστής, π.χ. λόγω μιας παρένθεσης χωρίς ζεύγος, ενός χαρακτήρα ελέγχου ή σύνταξης που δεν υποστηρίζει αυτός ο διακομιστής. Το παραγόμενο αρχείο τις παραλείπει, ώστε ο ιστότοπός σας να συνεχίσει να λειτουργεί· οι υπόλοιποι user agents εξακολουθούν να αποκλείονται. Διορθώστε ή αφαιρέστε αυτές τις καταχωρήσεις."
COM_ADMINTOOLS_NGINXCONFMAKER_WARN_RESTRICTIP_REALIP_HEAD="Ο Περιορισμός πρόσβασης βάσει IP δεν εφαρμόζεται"
COM_ADMINTOOLS_NGINXCONFMAKER_WARN_RESTRICTIP_REALIP="Ο Περιορισμός πρόσβασης βάσει IP είναι ενεργοποιημένος, αλλά η Αποδοχή προώθησης IP εμπιστεύεται τις Διευθύνσεις IP αντίστροφης μεσολάβησης / εξισορρόπησης φορτίου. Τότε το NginX ελέγχει τη διεύθυνση IP του επισκέπτη, από την κεφαλίδα X-Forwarded-For, αντί για τη διεύθυνση του αντίστροφου διαμεσολαβητή ή του CDN σας, οπότε αν επιτρέπονταν μόνο οι επιλεγμένες διευθύνσεις IP θα απορριπτόταν κάθε επισκέπτης. Το παραγόμενο αρχείο δεν περιορίζει την πρόσβαση βάσει IP. Αντί γι' αυτό, περιορίστε στο τείχος προστασίας του διακομιστή σας ποιες διευθύνσεις IP μπορούν να τον φτάσουν, ή απενεργοποιήστε την Αποδοχή προώθησης IP."
