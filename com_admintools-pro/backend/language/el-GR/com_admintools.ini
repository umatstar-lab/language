COM_ADMINTOOLS_CONTROLPANEL_LBL_DISTEXT="Συστατικά που σχετίζονται με την ασφάλεια, όπως το Admin Tools, δεν είναι σχεδιασμένα να προσφέρουν 100% προστασία του ιστότοπού σας έναντι οποιασδήποτε επίθεσης. Μπορούν και βοηθούν στη βελτίωση της ασφάλειας του ιστότοπού σας. Εξακολουθείτε να πρέπει να εφαρμόζετε κοινή λογική και καλές πρακτικές ασφαλείας για να διατηρείτε έναν υγιή και ασφαλή ιστότοπο. Ως ελάχιστο, θα πρέπει να ενημερώνετε τακτικά το Joomla! και τις επεκτάσεις του· να διατηρείτε τακτικά δοκιμασμένα αντίγραφα ασφαλείας εκτός τοποθεσίας· και να παρακολουθείτε για μη φυσιολογική συμπεριφορά του ιστότοπου."

COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_HEAD="Κενή διαδρομή ως βασικός κατάλογος του ιστότοπού σας."
COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_BODY="Η PHP αναφέρει κενή διαδρομή ως βασικό κατάλογο του ιστότοπού σας. Αυτό οφείλεται σε σφάλμα σε παλαιότερες εκδόσεις PHP. Παρακαλώ ζητήστε από τον πάροχό σας να αναβαθμίσει την εγκατεστημένη έκδοση PHP στον διακομιστή του. Εάν προσπαθήσετε να χρησιμοποιήσετε το κουμπί Διόρθωση Δικαιωμάτων, είναι πολύ πιθανό να χάσετε την πρόσβαση στον ιστότοπό σας."

