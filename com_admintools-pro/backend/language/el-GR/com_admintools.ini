COM_ADMINTOOLS_OBSOLETECORE_LBL_FAILED_ADVICE="Αυτό σχεδόν πάντα σημαίνει ότι τα δικαιώματα ή η ιδιοκτησία των αρχείων στον ιστότοπό σας εμποδίζουν την PHP να τα διαγράψει. Παρακαλούμε αφαιρέστε τα μόνοι σας μέσω FTP, SFTP ή με τον διαχειριστή αρχείων που παρέχει ο πάροχος φιλοξενίας σας. Αν δεν είστε βέβαιοι πώς να το κάνετε, ζητήστε βοήθεια από τον πάροχό σας."
COM_ADMINTOOLS_OBSOLETECORE_LBL_TYPE_FILE="Αρχείο"
COM_ADMINTOOLS_OBSOLETECORE_LBL_TYPE_FOLDER="Φάκελος"

COM_ADMINTOOLS_OBSOLETECORE_ERR_CANNOT_READ_SCRIPT="Το Admin Tools δεν μπόρεσε να διαβάσει το σενάριο μετά την ενημέρωση του Joomla, %s. Χωρίς αυτό δεν υπάρχει τρόπος να γνωρίζουμε ποια αρχεία έχει καταστήσει παρωχημένα αυτή η έκδοση του Joomla."
COM_ADMINTOOLS_OBSOLETECORE_ERR_CANNOT_PARSE_SCRIPT="Το Admin Tools δεν μπόρεσε να ερμηνεύσει το σενάριο μετά την ενημέρωση του Joomla. Αυτό συνήθως σημαίνει ότι το αρχείο έχει τροποποιηθεί ή ότι ανήκει σε μια έκδοση του Joomla την οποία αυτή η έκδοση του Admin Tools δεν γνωρίζει ακόμη."
COM_ADMINTOOLS_OBSOLETECORE_ERR_CANNOT_FIND_METHOD="Το Admin Tools δεν μπόρεσε να βρει τη μέθοδο %s στο σενάριο μετά την ενημέρωση του Joomla."
COM_ADMINTOOLS_OBSOLETECORE_ERR_CANNOT_FIND_ARRAY="Το Admin Tools δεν μπόρεσε να βρει τη λίστα %s στο σενάριο μετά την ενημέρωση του Joomla."
COM_ADMINTOOLS_OBSOLETECORE_ERR_UNSAFE_ARRAY="Η λίστα %s στο σενάριο μετά την ενημέρωση του Joomla περιέχει κάτι άλλο εκτός από διαδρομές αρχείων. Το Admin Tools αρνήθηκε να τη διαβάσει περαιτέρω. Παρακαλούμε ελέγξτε αυτό το αρχείο για ενδείξεις παραποίησης."
COM_ADMINTOOLS_OBSOLETECORE_ERR_TMPDIR_UNWRITABLE="Το Admin Tools χρειάζεται να γράψει ένα προσωρινό αρχείο για να διαβάσει τη λίστα παρωχημένων αρχείων του Joomla, αλλά ο προσωρινός κατάλογος που έχει οριστεί στη Γενική Διαμόρφωση του ιστοτόπου σας δεν είναι εγγράψιμος."

