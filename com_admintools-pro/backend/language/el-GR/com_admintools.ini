COM_ADMINTOOLS_MAIL_IPAUTOBAN_TITLE="Admin Tools: Αυτόματος Αποκλεισμός IP"
COM_ADMINTOOLS_MAIL_IPAUTOBAN_DESC="Αποστέλλεται από το Admin Tools όταν αποκλείεται αυτόματα μια διεύθυνση IP, εφόσον έχουν επιλεγεί μία ή περισσότερες διευθύνσεις ηλεκτρονικής αλληλογραφίας για αυτήν τη δυνατότητα. Αυτό περιλαμβάνει επίσης τις οδηγίες Κατάστασης Διάσωσης· σας συνιστούμε να "
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_SUBJECT="Ειδοποίηση αυτόματου αποκλεισμού IP για {IP} στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι η διεύθυνση IP {IP} θα αποκλειστεί προσωρινά από την πρόσβαση στον ιστότοπό σας, {SITENAME}. Παρακαλούμε βρείτε πρόσθετες λεπτομέρειες παρακάτω.\n\nΔιεύθυνση IP: {IP} (Αναζήτηση IP: {LOOKUP})\nΑιτία τελευταίου αποκλεισμένου αιτήματος: {REASON}\nΑποκλεισμένο έως: {UNTIL}\n\n{RESCUEINFO}\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΛαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι η διεύθυνση IP {IP} θα αποκλειστεί προσωρινά από την πρόσβαση στον ιστότοπό σας, {SITENAME}. Παρακαλούμε βρείτε πρόσθετες λεπτομέρειες παρακάτω.</p><p>Διεύθυνση IP: {IP} (<a href=\"{LOOKUP}\">Αναζήτηση IP</a>)<br />Αιτία τελευταίου αποκλεισμένου αιτήματος: {REASON}<br />Αποκλεισμένο έως: {UNTIL}</p><p>{RESCUEINFO}</p><p>Με εκτίμηση,</p><p>Η ομάδα του {SITENAME}</p><p><small>Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο <em>{SITENAME}</em>. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_TITLE="Admin Tools: Τροποποιήθηκε κρίσιμο αρχείο"
COM_ADMINTOOLS_MAIL_CRITICALFILES_DESC="Αποστέλλεται από το Admin Tools όταν ένα «κρίσιμο αρχείο» έχει τροποποιηθεί."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_SUBJECT="Τροποποιήθηκε κρίσιμο αρχείο στο {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY="Γεια σας,\n\nΘα θέλαμε να σας ενημερώσουμε ότι ένα ή περισσότερα κρίσιμα αρχεία έχουν τροποποιηθεί στον ιστότοπό σας, {SITENAME}. Η λίστα των αρχείων που τροποποιήθηκαν στον ιστότοπό σας είναι η εξής:\n\n{INFO}\n\nΠρέπει να ανησυχώ;\n======================================================================\n\nΤα «κρίσιμα αρχεία», στο πλαίσιο αυτού του μηνύματος ηλεκτρονικής αλληλογραφίας, είναι τα αρχεία που στοχεύονται συνήθως από χάκερ μετά από επιτυχή παραβίαση ενός ιστοτόπου. Αυτά τα αρχεία μπορούν επίσης να τροποποιηθούν και συχνότερα τροποποιούνται για νόμιμους λόγους. Για παράδειγμα, θα τροποποιηθούν όταν αποθηκεύετε τις Γενικές Ρυθμίσεις του ιστοτόπου σας ή όταν ενημερώνετε το Joomla! ή ένα από τα πρότυπά του.\n\nΔΕΝ χρειάζεται να ανησυχείτε αν λάβατε αυτό το email μετά από εσάς ή έναν άλλο διαχειριστή που εμπιστεύεστε, πραγματοποίησε οποιαδήποτε από τις παρακάτω αλλαγές στον ιστότοπό σας:\n\n* Επαναφέρατε τα αρχεία ή/και τα περιεχόμενα της βάσης δεδομένων του ιστοτόπου από αντίγραφο ασφαλείας\n* Τροποποιήσατε τις Γενικές Ρυθμίσεις\n* Ενημερώσατε το Joomla!\n* Ενημερώσατε ένα πρότυπο ιστοτόπου\n\nΑν αυτό το μήνυμα ΔΕΝ σας εστάλη ως αποτέλεσμα μιας τέτοιας επιθυμητής και αναμενόμενης αλλαγής, παρακαλούμε ελέγξτε αμέσως τον ιστότοπό σας, καθώς αυτό θα μπορούσε να είναι ένδειξη δραστηριότητας παραβίασης· ή μια επέκταση ή άλλο λογισμικό τρίτου μέρους που κάνει κάτι που δεν γνωρίζατε και το οποίο θα μπορούσε να έχει δυσμενείς επιπτώσεις στον ιστότοπό σας.\n\nΜε εκτίμηση,\n\nΗ ομάδα του {SITENAME}\n\nΣημείωση: Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο {SITENAME}. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY_HTML="<p>Γεια σας,</p><p>Θα θέλαμε να σας ενημερώσουμε ότι ένα ή περισσότερα κρίσιμα αρχεία έχουν τροποποιηθεί στον ιστότοπό σας, {SITENAME}. Η λίστα των αρχείων που τροποποιήθηκαν στον ιστότοπό σας είναι η εξής:</p>{INFO_HTML}<h3>Πρέπει να ανησυχώ;</h3><p>Τα «κρίσιμα αρχεία», στο πλαίσιο αυτού του μηνύματος ηλεκτρονικής αλληλογραφίας, είναι τα αρχεία που στοχεύονται συνήθως από χάκερ μετά από επιτυχή παραβίαση ενός ιστοτόπου. Αυτά τα αρχεία μπορούν επίσης να τροποποιηθούν <em>και συχνότερα τροποποιούνται</em> για νόμιμους λόγους. Για παράδειγμα, θα τροποποιηθούν όταν αποθηκεύετε τις Γενικές Ρυθμίσεις του ιστοτόπου σας ή όταν ενημερώνετε το Joomla! ή ένα από τα πρότυπά του.</p><p>ΔΕΝ χρειάζεται να ανησυχείτε αν λάβατε αυτό το email μετά από εσάς ή έναν άλλο διαχειριστή που εμπιστεύεστε, πραγματοποίησε οποιαδήποτε από τις παρακάτω αλλαγές στον ιστότοπό σας:</p><ul><li>Επαναφέρατε τα αρχεία ή/και τα περιεχόμενα της βάσης δεδομένων του ιστοτόπου από αντίγραφο ασφαλείας</li><li>Τροποποιήσατε τις Γενικές Ρυθμίσεις</li><li>Ενημερώσατε το Joomla!</li><li>Ενημερώσατε ένα πρότυπο ιστοτόπου</li></ul><p>Αν αυτό το μήνυμα ΔΕΝ σας εστάλη ως αποτέλεσμα μιας τέτοιας επιθυμητής και αναμενόμενης αλλαγής, παρακαλούμε ελέγξτε αμέσως τον ιστότοπό σας, καθώς αυτό θα μπορούσε να είναι ένδειξη δραστηριότητας παραβίασης· ή μια επέκταση ή άλλο λογισμικό τρίτου μέρους που κάνει κάτι που δεν γνωρίζατε και το οποίο θα μπορούσε να έχει δυσμενείς επιπτώσεις στον ιστότοπό σας.</p><p>Με εκτίμηση,</p><p>Η ομάδα του {SITENAME}</p><p><small>Λαμβάνετε αυτό το αυτόματο μήνυμα ηλεκτρονικής αλληλογραφίας επειδή είστε διαχειριστής στο <em>{SITENAME}</em>. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια διεύθυνση ηλεκτρονικής αλληλογραφίας χωρίς παρακολούθηση.</small></p>"

