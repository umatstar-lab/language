COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_DESC="Eliminar archivos y carpetas obsoletos del núcleo de Joomla!"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_HELP="<info>%command.name%</info> eliminará los archivos y carpetas de Joomla! que una actualización de Joomla debería haber borrado, pero no borró.\nLos archivos del núcleo que quedan atrás pueden inutilizar por completo su sitio, normalmente con un error fatal relacionado con un alias de clase.\nUse <info>--dry-run</info> para ver qué se eliminaría sin tocar nada.\nUso: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_OPT_DRYRUN="Listar los archivos y carpetas obsoletos encontrados, y si PHP puede escribir en ellos, sin borrar nada."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTHINGTODO="No hay archivos ni carpetas obsoletos del núcleo de Joomla! en este sitio."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_DELETED="eliminado"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_FAILED="FALLÓ"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_WRITEABLE="escribible"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTWRITEABLE="NO escribible"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_ERR_SOMEFAILED="No se han podido eliminar %d archivos y carpetas obsoletos. Bórrelos a mano por FTP, SFTP o con el gestor de archivos que le proporcione su alojamiento."

[options]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Component Options
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;; File Scanner
COM_ADMINTOOLS_JCONFIG_SCAN_LABEL="Escáner de archivos"
COM_ADMINTOOLS_JCONFIG_SCAN_DESC="Configurar cómo funciona el escáner de archivos PHP"

COM_ADMINTOOLS_JCONFIG_LOGLEVEL_LABEL="Nivel de registro"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DESC="La verbosidad del registro del escáner de archivos PHP, guardado en el directorio de registros configurado de su sitio. Valores recomendados: \"Advertencias\" para sitios en producción, \"Depuración\" cuando desee solicitar soporte técnico."
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_NONE="Ninguno"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_ERROR="Errores"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_WARNING="Advertencias"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_INFO="Información"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DEBUG="Depuración"
COM_ADMINTOOLS_JCONFIG_MINEXEC_LABEL="Tiempo mínimo de solicitud"
COM_ADMINTOOLS_JCONFIG_MINEXEC_DESC="Tiempo mínimo que tardará cada solicitud al Escáner de Cambios de Archivos PHP. Auméntelo si su servidor produce un error porque las solicitudes llegan con demasiada frecuencia o alcanza los límites de CPU / recursos.<br/><br/>Valores recomendados: 2,0 a 7,0."
COM_ADMINTOOLS_JCONFIG_MAXEXEC_LABEL="Tiempo máximo de trabajo"
COM_ADMINTOOLS_JCONFIG_MAXEXEC_DESC="Cantidad máxima de tiempo consumida al analizar su sitio en cada solicitud al Escáner de cambios en archivos PHP. Redúzcalo si alcanza los límites de CPU / recursos de su servidor. Configúrelo por debajo del Tiempo mínimo de solicitud para crear un período de «enfriamiento del uso de CPU», reduciendo así el uso de recursos durante el análisis de archivos a costa de hacerlo más lento.<br/><br/>Valores recomendados: 3.0 a 7.0"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_LABEL="Sesgo del tiempo de trabajo"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_DESC="Un valor de 50 a 100 que determina la agresividad con la que Admin Tools predice si está a punto de alcanzar el límite del Tiempo máximo de trabajo. 50 es el más agresivo y resultará en que el análisis tome aproximadamente la mitad del Tiempo máximo de trabajo en cada solicitud al Escáner de cambios en archivos PHP. 100 es el menos agresivo y resultará en que el análisis tome al menos, y generalmente más que, el Tiempo máximo de trabajo en cada solicitud.<br/><br/>Valor recomendado: 75.<br/><br/><strong>¡Consejo!</strong> Si tiene un servidor particularmente sensible, recomendamos configurar el Tiempo mínimo de solicitud en 7.0, el Tiempo máximo de trabajo en 5.0 y el Sesgo del tiempo de trabajo en 50. Esto significa que el escáner trabaja de 2.5 a 5.0 segundos a la vez y luego su servidor no hace nada durante 2.0 a 4.5 segundos. Analizar su sitio tardará aproximadamente tres veces más, pero tiene más posibilidades de completarse."
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_LABEL="Nº máx. de carpetas por lote"
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_DESC="El número máximo de carpetas a listar en un directorio dado a la vez. Esto evita que PHP agote el tiempo de espera al listar el contenido de carpetas <em>realmente</em> grandes, con cientos de carpetas contenidas directamente en ellas.<br/><br/>Valor recomendado: 50<br/><br/>Recuerde que listar el contenido de carpetas es <strong>exponencialmente proporcional</strong> al número de archivos y carpetas que contienen. Esta es una limitación del funcionamiento de los sistemas operativos y sus controladores de sistema de archivos. No hay nada que nosotros, Joomla! o PHP podamos hacer al respecto. Se recomienda encarecidamente excluir las carpetas realmente grandes y tomar medidas para evitar tener carpetas con miles de archivos y carpetas contenidos directamente. En caso de duda, anide sus carpetas en profundidad."
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_LABEL="Nº máx. de archivos por lote"
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_DESC="El número máximo de archivos a listar en un directorio dado a la vez. Esto evita que PHP agote el tiempo de espera al listar el contenido de carpetas <em>realmente</em> grandes, con miles de archivos contenidos directamente en ellas.<br/><br/>Valor recomendado: 100<br/><br/>Recuerde que listar el contenido de carpetas es <strong>exponencialmente proporcional</strong> al número de archivos y carpetas que contienen. Esta es una limitación del funcionamiento de los sistemas operativos y sus controladores de sistema de archivos. No hay nada que nosotros, Joomla! o PHP podamos hacer al respecto. Se recomienda encarecidamente excluir las carpetas realmente grandes y tomar medidas para evitar tener carpetas con miles de archivos y carpetas contenidos directamente. En caso de duda, anide sus carpetas en profundidad."
COM_ADMINTOOLS_JCONFIG_FEBENABLE_LABEL="Habilitar programación desde el frontend"
COM_ADMINTOOLS_JCONFIG_FEBENABLE_DESC="Cuando está habilitado, le permite ejecutar el Escáner de cambios en archivos PHP sin iniciar sesión en el backend."
COM_ADMINTOOLS_JCONFIG_SECRETWORD_LABEL="Palabra secreta"
COM_ADMINTOOLS_JCONFIG_SECRETWORD_DESC="Protege la función de programación desde el frontend contra ataques de denegación de servicio (DoS) al requerir que pase esta palabra secreta en la URL de programación del frontend. Utilice contraseñas largas y complejas. Consulte la documentación para obtener más información."
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_LABEL="Zona horaria para correos electrónicos"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DESC="Todas las fechas y horas en los correos electrónicos enviados por Admin Tools para avisarle sobre posibles problemas de seguridad se expresarán en la zona horaria seleccionada. Predeterminado: GMT"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DEFAULT="Zona horaria del servidor"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_LABEL="Idioma alternativo preferido para las notificaciones por correo electrónico"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_DESC="El idioma utilizado para los correos electrónicos de notificación enviados a una dirección que no pertenece a una cuenta de usuario de Joomla, y para las cuentas de usuario cuya preferencia de idioma es «Usar predeterminado».<br/><br/>Cuando una notificación se envía a una dirección que <em>sí</em> pertenece a una cuenta de usuario de Joomla, se utiliza la preferencia de idioma de esa cuenta, salvo que active también la opción de abajo.<br/><br/>Si no se puede determinar ningún idioma, se utiliza el inglés (en-GB). Admin Tools nunca envía una notificación en el idioma en el que su sitio se esté mostrando en ese momento.<br/><br/>Predeterminado: Ninguno, es decir, inglés (en-GB)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_NONE="Ninguno (usar inglés)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_LABEL="Forzar este idioma en todos los correos electrónicos de notificación"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_DESC="Cuando está activado, todos los correos electrónicos de notificación se envían en el idioma seleccionado arriba, incluso cuando van dirigidos a una cuenta de usuario de Joomla con una preferencia de idioma distinta.<br/><br/>Actívelo si procesa los correos electrónicos de notificación de forma automática y necesita que lleguen siempre en un único idioma previsible.<br/><br/>Predeterminado: No"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_LABEL="Carpetas excluidas"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_DESC="Carpetas a omitir al analizar su sitio.<br/><br/>Las carpetas se indican de forma relativa a la raíz de su sitio. Introduzca una carpeta por línea.<br/><br/>Predeterminado: ninguna<br/><br/><em>Nota</em>: Algunas carpetas se excluyen automáticamente sin añadirlas aquí: el directorio de registros y temporal de su sitio, los directorios de caché del frontend y backend, así como las carpetas llamadas tmp, log o logs en el frontend o backend de su sitio. Por último, los enlaces simbólicos a carpetas fuera de la raíz de su sitio no se siguen (su contenido no se analizará)."
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_LABEL="Archivos excluidos"
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_DESC="Archivos a omitir al analizar su sitio.<br/><br/>Los archivos se indican de forma relativa a la raíz de su sitio. Introduzca una ruta de archivo por línea.<br/><br/>Predeterminado: ninguno<br/><br/>Úselo solo para excluir archivos que no son realmente ejecutables, p. ej. registros con extensión .php fuera de la carpeta de registros de Joomla. NO lo use para marcar archivos como seguros; use la función Marcar como seguro en la página de informe del análisis."
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_LABEL="Extensiones a analizar"
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_DESC="Una lista de extensiones de archivo a analizar separada por comas, sin el punto inicial.<br/><br/>Valor predeterminado: php, phps, phtml, php3, inc<br/><br/>Recuerde que el Escáner de cambios en archivos PHP está diseñado únicamente para analizar y evaluar de forma fiable la Puntuación de amenaza de archivos PHP. Le recomendamos encarecidamente que no añada extensiones de archivos de código fuente de otros lenguajes de programación, como JavaScript y Perl, ni archivos binarios. Si no tiene en cuenta esta advertencia, podría obtener muchos falsos positivos o, peor aún, falsos negativos en archivos que no contienen código fuente del lenguaje de programación PHP."
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_LABEL="Analizar archivos con extensiones dobles"
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_DESC="Analiza archivos donde las extensiones a analizar aparecen antes de otras extensiones. Por ejemplo, si ha añadido <code>php</code> a «Extensiones a analizar» y habilita esta opción aquí, el Escáner de cambios en archivos PHP analizará tanto <code>example.php</code> como <code>example.php.png</code>."
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_LABEL="Coincidencia de extensión sin distinción de mayúsculas y minúsculas"
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_DESC="Hace que la coincidencia de extensión de archivo no distinga entre mayúsculas y minúsculas. Por ejemplo, si ha añadido <code>php</code> a «Extensiones a analizar» y habilita esta opción aquí, el Escáner de cambios en archivos PHP analizará tanto <code>example.php</code> como <code>example.PHP</code>"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_LABEL="Umbral de archivo grande"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_DESC="El Escáner de cambios en archivos PHP pausará deliberadamente el trabajo y lo reanudará en la siguiente solicitud antes de analizar archivos mayores que este número de bytes. Esto evita un tiempo de espera accidental de PHP al analizar un archivo grande al final del Tiempo máximo de trabajo asignado.<br/><br/>Valor recomendado: 524288"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_LABEL="Calcular diferencias al analizar"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_DESC="Cuando esta opción está habilitada, Admin Tools calculará un diff (forma compacta de diferencias de archivo) para cada archivo modificado detectado por la función Escáner de archivos PHP. ADVERTENCIA: ¡Esto consume MUCHO espacio en la base de datos, aproximadamente entre 20 y 40 MB para un sitio típico!"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_LABEL="No informar de archivos con Puntuación de amenaza cero"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_DESC="Cuando está habilitado, cualquier archivo nuevo o modificado con una Puntuación de amenaza cero no será notificado.<br/><br/>Valor recomendado: No<br/><br/><strong>ADVERTENCIA</strong>: NO recomendamos habilitar esta opción. Es concebible que archivos modificados maliciosamente puedan tener una Puntuación de amenaza cero porque su carga maliciosa está escrita de una manera que es imposible para un escáner automatizado distinguir del código legítimo, aunque un poco desordenado. Habilitar esta opción no le alertará de estos archivos, poniendo posiblemente su sitio en riesgo. Esta opción está aquí para depurar problemas con el cálculo de la Puntuación de amenaza, NO como algo que deba habilitar en sitios en producción."
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_LABEL="Umbral de archivo sobredimensionado"
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_DESC="Los archivos mayores que este número de bytes no tendrán su Puntuación de amenaza evaluada.<br/><br/>Valor recomendado: 5242880<br/><br/>Un valor demasiado pequeño haría que los archivos ejecutables no fueran analizados en busca de código malicioso, lo que podría ser un problema de seguridad. Configurarlo demasiado alto probablemente resultará en un tiempo de espera de PHP al analizar un archivo muy grande, típicamente uno que ni siquiera es ejecutable a pesar de la extensión .php (p. ej. un archivo de registro)."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_LABEL="Archivos ajenos al núcleo en carpetas del núcleo"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_DESC="Controla cómo trata el escáner los archivos que NO son archivos oficiales del núcleo de Joomla pero que se encuentran dentro de un directorio del núcleo de Joomla (un directorio perteneciente a una extensión, biblioteca o plantilla del núcleo, o uno de administrator/help, administrator/includes, includes). <strong>Ignorar</strong>: no detectar estos archivos. <strong>Señalar</strong>: mostrar una insignia \"ajeno al núcleo\" en los resultados del análisis. <strong>Señalar e informar como amenaza</strong>: mostrar la insignia y añadir 1000 a la Puntuación de amenaza para que el archivo aparezca al principio de los resultados. Los archivos situados en directorios de extensiones de terceros se consideran fuera del ámbito y nunca se señalan."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_IGNORE="Ignorar"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_FLAG="Señalar"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_THREAT="Señalar e informar como amenaza"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_LABEL="URL del servicio CoreSums"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_DESC="URL base del servicio de sumas de verificación CoreSums que utiliza el Escáner de cambios en archivos PHP para identificar y verificar los archivos del núcleo de Joomla. El valor predeterminado es <code>https://getpanopticon.com/checksums</code>. Admin Tools únicamente DESCARGA de este servicio un archivo público de sumas de verificación correspondiente a su versión de Joomla; nunca envía información alguna sobre su sitio ni sobre sus usuarios. Si prefiere alojar usted mismo las sumas de verificación, puede ejecutar su propio servicio — consulte <code>https://github.com/akeeba/coresums</code> — y apuntar esta opción hacia él."
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_LABEL="Tiempo de espera de la descarga de CoreSums (segundos)"
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_DESC="Número máximo de segundos que se esperará al descargar el archivo de sumas de verificación de CoreSums antes de desistir. Valor predeterminado: 5. Si la descarga falla, el análisis se ejecuta igualmente, pero ningún archivo se marca como del núcleo o ajeno al núcleo y se muestra un aviso que puede descartar hasta su siguiente análisis correcto."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_DESC="Los resultados del análisis se enviarán automáticamente a esta dirección de correo electrónico. Si lo deja en blanco, no se enviará ningún correo electrónico."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_LABEL="Enviar resultados a este correo electrónico"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_LABEL="Enviar correo electrónico solo con elementos accionables"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_DESC="Cuando está habilitado (predeterminado), el Escáner de cambios en archivos PHP le enviará un correo electrónico con el resumen de los resultados del análisis <em>únicamente</em> cuando se detecten elementos accionables (archivos añadidos, modificados o posibles amenazas)."

;; Email sending
COM_ADMINTOOLS_JCONFIG_EMAIL_LABEL="Envío de correo electrónico"
COM_ADMINTOOLS_JCONFIG_EMAIL_DESC="Opciones que controlan cómo Admin Tools envía correos electrónicos para las solicitudes bloqueadas. Estas opciones solo se aplican en la edición Professional."
COM_ADMINTOOLS_JCONFIG_THROTTLE_LABEL="Limitación de correos electrónicos de solicitudes bloqueadas"
COM_ADMINTOOLS_JCONFIG_THROTTLE_DESC="Cuando está habilitado, Admin Tools solo enviará hasta un cierto número de correos electrónicos durante un período de tiempo específico. Esto protege su correo electrónico de inundaciones cuando su sitio está bajo ataque. Necesita tener el registro de solicitudes bloqueadas habilitado para <em>todas las razones de bloqueo</em> por las que está enviando correos electrónicos. Además, el número máximo de entradas de registro que conserva —según la configuración del plugin del sistema— debe ser <em>igual o mayor</em> que el número máximo de correos electrónicos configurado a continuación. En cualquier otro caso, sus correos electrónicos de excepción de seguridad NO se limitarán."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_LABEL="Número máximo de solicitudes bloqueadas para las que enviar correos electrónicos"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_DESC="El número máximo de solicitudes bloqueadas para las que se pueden enviar correos electrónicos dentro del período de tiempo definido a continuación. Tenga en cuenta que durante un ataque sostenido pueden enviarse más correos electrónicos de los indicados, dependiendo de la lentitud de respuesta de sus servidores web, de base de datos y de correo cuando su sitio está bajo una carga muy pesada. Además, tenga en cuenta que esto solo afecta a las solicitudes bloqueadas registradas en la base de datos y con una razón de bloqueo que NO está en las razones configuradas para las que nunca se deben enviar correos electrónicos."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_LABEL="Período para la limitación de correos electrónicos"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_DESC="La limitación de correos electrónicos funciona comprobando cuántas solicitudes bloqueadas se han registrado en este número de segundos, minutos, horas o días. Seleccione la unidad de medida de tiempo a continuación."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_LABEL="Unidad de medida de tiempo"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DESC="El período anterior se expresa en la unidad de medida de tiempo seleccionada aquí. Tenga en cuenta que a efectos de estos cálculos, un minuto son 60 segundos, 1 hora son 3600 segundos y 1 día son 86400 segundos. Esto puede diferir de los minutos, horas y días del reloj en años con segundos intercalares y en el cambio entre el horario de verano y el estándar (o viceversa). La gestión del tiempo es un tema bastante complicado."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_SECONDS="Segundos"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_MINUTES="Minutos"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_HOURS="Horas"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DAYS="Días"

COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_DESC="Cuánto tiempo, en minutos, se usa una lista de IP de rastreadores descargada antes de volver a descargarla. Es también el tiempo que Admin Tools espera antes de reintentar tras una descarga fallida. El mínimo es de 15 minutos."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_LABEL="Duración de la caché de las listas de rastreadores (minutos)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DESC="Opciones de las listas de IP de rastreadores, que se activan en Configurar WAF, pestaña Rastreadores."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_DESC="Si no se puede actualizar una lista de IP de rastreadores, Admin Tools sigue usando la última lista descargada durante este número de días, contados desde el momento en que la lista habría caducado normalmente. Después, la lista deja de usarse. Con 0, una lista deja de usarse en cuanto caduca."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_LABEL="Descartar listas de rastreadores obsoletas después de (días)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_LABEL="Rastreadores"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_DESC="El tiempo máximo, en milisegundos, que Admin Tools espera a que se descargue una lista de IP: las listas de IP de rastreadores y las listas de CloudFlare, Sucuri y BunnyCDN que usan los generadores de configuración del servidor. Las listas publicadas como páginas web en lugar de archivos de datos (las de Amazon y Sucuri) disponen del triple de este límite (60 segundos como máximo). Este límite solo se aplica con exactitud cuando su servidor usa la extensión cURL de PHP. Con otros métodos de conexión, y para la resolución DNS en algunas versiones de cURL, es solo aproximado: se redondea a segundos enteros y un servidor muy lento puede tardar más."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_LABEL="Límite de tiempo de descarga de las listas de rastreadores y CDN (milisegundos)"

;; Backend options
COM_ADMINTOOLS_JCONFIG_BACKEND_LABEL="Backend"
COM_ADMINTOOLS_JCONFIG_BACKEND_DESC="Opciones que definen cómo funciona el backend del componente"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_LABEL="Mostrar gráficos y estadísticas"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_DESC="Mostrar gráficos y estadísticas sobre solicitudes bloqueadas (solo en la versión Professional)"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_LABEL="Reordenar el plugin automáticamente"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_DESC="El plugin Sistema - Admin Tools necesita estar ordenado como el primer plugin publicado para funcionar correctamente. Cuando visita Admin Tools en el backend, el plugin se reordena automáticamente para ser el primero. En algunos casos excepcionales, otros plugins necesitan publicarse primero, por ejemplo, manejadores de correo alternativos como CMandrill. En ese caso, establezca esta opción en No. ¡PELIGRO MAYOR! SERÁ EXCLUSIVAMENTE SU RESPONSABILIDAD REORDENAR EL PLUGIN. SI UN PLUGIN VULNERABLE SE PUBLICA ANTES QUE EL PLUGIN SISTEMA - ADMIN TOOLS, SU SITIO PUEDE SER HACKEADO. ADMIN TOOLS NO PODRÁ PROTEGERLE EN ESTE CASO, YA QUE NO SE EJECUTARÁ ANTES QUE EL CÓDIGO VULNERABLE Y, POR LO TANTO, NO PODRÁ DETECTAR EL ATAQUE. NO ESTABLEZCA ESTA OPCIÓN EN «NO» A MENOS QUE SEA UN EXPERTO Y COMPRENDA LAS IMPLICACIONES."
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_LABEL="Advertir sobre ediciones manuales en archivos de configuración del servidor"
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_DESC="Admin Tools comprobará si ha editado manualmente un archivo de configuración del servidor (es decir, .htaccess, nginx.conf o web.config) en lugar de utilizar el Generador de .htaccess, NginX o WebConfig"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_LABEL="Recordarme cuando el archivo de registro de depuración esté habilitado"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_DESC="Muestra un recordatorio en todas las páginas del área de administración de su sitio mientras la opción \"Mantener un archivo de registro de depuración\" de Configurar WAF esté habilitada. El archivo de registro de depuración está pensado solo para la resolución de problemas. Registra con detalle cada solicitud bloqueada, incluidos los datos de formulario enviados, en un archivo sin cifrar."
COM_ADMINTOOLS_JCONFIG_USAGESTATS_LABEL="Habilitar el informe anónimo de versiones de PHP, MySQL y Joomla!"
COM_ADMINTOOLS_JCONFIG_USAGESTATS_DESC="Ayúdenos a mejorar nuestro software informando de forma anónima y automática sus versiones de PHP, MySQL y Joomla!. Esta información nos ayudará a decidir qué versiones de Joomla!, PHP y MySQL admitir en versiones futuras. Nota: NO recopilamos el nombre de su sitio, su dirección IP ni ninguna otra información de identificación directa o indirectamente única."
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_LABEL="Ruta precisa de PHP-CLI"
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_DESCRIPTION="Habilite esta opción para que Admin Tools intente detectar la ruta precisa de PHP-CLI en su servidor. Deshabilítela si su servidor no le permite hacerlo, bloqueando su dirección IP fuera de su sitio durante varios minutos u horas cuando esto ocurre (por ejemplo, IONOS)."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_LABEL="Solución alternativa para plantillas de correo rotas en Joomla! 5.2 y posteriores."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 introdujo la función de diseño de plantilla de correo y la habilita de forma predeterminada. Sin embargo, esta función <em>rompe</em> los enlaces en los correos electrónicos si su URL proviene de una variable, como <code>{URL}</code>, al añadir la URL del sitio delante de la URL, convirtiéndola en una URL no válida. Esto incluso afecta a los propios componentes de Joomla. Aunque no podemos solucionar Joomla en sí, podemos proporcionar una solución alternativa para los correos electrónicos enviados por nuestro software. Si por alguna razón no desea esa solución alternativa, puede desactivarla estableciendo esta opción en No."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_LABEL="Servidor web"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_DESCRIPTION="¿Qué servidor web está utilizando para su sitio? Se recomienda usar «Detección automática» para la mayoría de los sitios. Seleccione el tipo de servidor web si y solo si su proveedor de alojamiento ha hecho que la variable de entorno <code>SERVER_SOFTWARE</code> no sea accesible para PHP de forma deliberada, o la ha configurado intencionadamente con un valor vacío o engañoso."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_AUTO="Detección automática"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_APACHE="Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_LITESPEED="LiteSpeed"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_NGINX="NginX"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_IIS="IIS"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_LABEL="Versión del servidor web Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_DESCRIPTION="Si está utilizando el servidor web Apache, seleccione qué versión de Apache es. Se recomienda usar «Detección automática» para la mayoría de los sitios. Seleccione la versión si y solo si su proveedor de alojamiento ha hecho que la variable de entorno <code>SERVER_SOFTWARE</code> no sea accesible para PHP de forma deliberada, o la ha configurado intencionadamente con un valor vacío o engañoso."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_AUTO="Detección automática"
