COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE_DESC="Esta es la URL relativa o absoluta a la que se llevará al visitante. Esta URL debe ser válida incluso si desactiva la función de redirección. Puede ser una URL de su propio sitio o de otro diferente. Ejemplos: <code>https://www.example.com</code> o <code>blog/123-mi-articulo</code>."
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS="Conservar parámetros de URL"
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS_DESC="Elija qué hacer con los parámetros de cadena de consulta en la URL visitada. «Ninguno» los ignora y conserva los parámetros de cadena de consulta de la URL «Le lleva aquí», si los hay. «Reemplazar todos» los combina con los parámetros de cadena de consulta de la URL «Le lleva aquí», reemplazando estos últimos aunque estén definidos. «Añadir nuevos» añadirá cualquier parámetro de cadena de consulta definido en la URL visitada <em>siempre que</em> NO estén ya definidos en la URL «Le lleva aquí»."

