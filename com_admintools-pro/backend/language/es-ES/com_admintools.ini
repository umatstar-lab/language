COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_INTRO="El administrador de este sitio ha bloqueado con contraseña algunas o todas las funciones de Admin Tools. Por favor, introduzca la contraseña para acceder a ellas."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MUSTENTERDLID="Necesita introducir su ID de descarga"
COM_ADMINTOOLS_CONTROLPANEL_LBL_NEEDSDLID="Debe introducir su <b>ID de descarga</b> antes de poder actualizar Admin Tools Professional. <a href='%s' target='_blank'>Si no conoce su ID de descarga, haga clic aquí</a>."
COM_ADMINTOOLS_CONTROLPANEL_MSG_WHERETOENTERDLID="Vaya al menú Sistema de Joomla! en el lado izquierdo. Busque el panel Actualización y haga clic en el enlace Sitios de actualización. Encuentre el elemento «Admin Tools Professional» y haga clic en él. Alternativamente, <a href=\"%s\">haga clic aquí</a> para ir directamente a esa página. Introduzca su ID de descarga —ya sea su ID principal o un ID de descarga adicional— en el campo «Clave de descarga» y haga clic en el botón Guardar."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED="Se ha desactivado el archivo de registro de depuración. Se han conservado los archivos de registro de depuración existentes."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED_DELETED="Se ha desactivado el archivo de registro de depuración y se han eliminado los archivos de registro de depuración existentes."
COM_ADMINTOOLS_CONTROLPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Importante:</strong> Si Joomla! ya ha determinado que hay actualizaciones para Admin Tools antes de que introdujera su ID de descarga, <em>puede que no pueda descargarlas</em> incluso después de haberlo introducido, debido a varios errores de larga data en Joomla!. En este caso, descargue el archivo ZIP de la última versión desde nuestro sitio. A continuación, vaya al menú Sistema de Joomla!, busque el panel Instalar, haga clic en Extensiones, haga clic en la pestaña Subir archivo de paquete e instale el archivo ZIP descargado <strong>dos veces</strong> seguidas, <strong>sin</strong> desinstalar Admin Tools antes ni entre ambas instalaciones. La doble instalación es necesaria para solucionar otro error de larga data en Joomla! que a veces impide que copie todos los archivos actualizados al instalar una actualización de extensión."

COM_ADMINTOOLS_CONTROLPANEL_LBL_FESECRETWORD_RESET="La Palabra secreta ha sido cambiada a <code>%s</code>"

