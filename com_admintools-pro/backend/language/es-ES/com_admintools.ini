COM_ADMINTOOLS_TITLE_CONFIGUREWAF="Configurar WAF"

COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINACTIVE="Debe publicar el plugin «System - Admin Tools» antes de que cualquiera de estos ajustes tenga efecto."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINACTIVE_DOIT="Haga clic aquí para ir al Administrador de plugins"
COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINEXISTS="Debe instalar y publicar el plugin «System - Admin Tools» (plg_admintools) antes de que cualquiera de estos ajustes tenga efecto. Puede intentar reinstalar Admin Tools dos veces seguidas, sin desinstalarlo antes ni entre medias, para forzar a Joomla! a instalar el plugin que falta."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_KNOWN="Ha renombrado el archivo <code>plugins/system/admintools/services/provider.php</code> a <code>%s</code>. Como resultado, Admin Tools <strong>no</strong> protege su sitio. Si lo hizo intencionadamente para resolver algún problema que experimentaba, recuerde renombrar el archivo de vuelta a provider.php. En la mayoría de los casos puede hacer clic en el enlace de abajo para hacerlo automáticamente."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_DOIT="Renombrar el archivo de vuelta a provider.php"
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_UNKNOWN="Ha renombrado el archivo <code>plugins/system/admintools/services/provider.php</code>. Como resultado, Admin Tools <strong>no</strong> protege su sitio. Si lo hizo intencionadamente para resolver algún problema que experimentaba, recuerde renombrar el archivo de vuelta a provider.php."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_PLUGINNOTLOADED="El plugin System - Admin Tools no está cargado. Lamentablemente no podemos determinar la causa. Es posible que falte algún archivo o esté dañado. Recomendamos encarecidamente reinstalar Admin Tools dos veces seguidas, sin desinstalarlo antes ni entre medias, para forzar a Joomla! a instalar y sobrescribir cualquier archivo que falte o esté dañado."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_AWAYSCHEDULE_TIME="%1$s: «%2$s» no es una hora válida. Introduzca la hora como hh:mm, de 00:00 a 23:59, o deje el campo vacío para desactivar la programación de ausencia."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_DOMAIN="Nombre de dominio"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_FILEPATH="Ruta de archivo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_USER="Usuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_USERNAME="Nombre de usuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_TMPL="Palabra clave de plantilla"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_URLPATH="Ruta de URL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_IP="Dirección IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_COMMON_DESCRIPTION="Descripción"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_WORKS="La autoactivación de usuarios está habilitada en su sitio. Los usuarios desactivados automáticamente recibirán por correo electrónico instrucciones para reactivar su cuenta de usuario."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_ADMINACTIVATION="La activación de usuarios está configurada como <strong>Administrador</strong>, lo que significa que el nuevo correo electrónico de activación se enviará a los Superusuarios y tendrán que reactivar al usuario."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_NOREGISTRATION="El registro de usuarios en su sitio está deshabilitado, por lo tanto Admin Tools no puede desactivar usuarios."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_NOUSERACTIVATION="La activación de usuarios en su sitio está deshabilitada, por lo tanto Admin Tools no puede desactivar usuarios"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE="Programación de ausencia"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_FROM="Programación de ausencia desde (hh:mm)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE_HEAD="Su servidor informa que la hora actual es <strong>%s</strong> (zona horaria <em>%s</em>)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE="<p>Los horarios de la programación de ausencia deben indicarse en la zona horaria %s. Puede cambiar esta zona horaria en la página de Configuración global de Joomla!. Si la hora actual sigue sin parecer correcta, pida a su proveedor de hosting que compruebe la hora del servidor y la configuración de zona horaria de PHP y del sistema operativo.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIP="La programación de ausencia deshabilita el acceso al área de administración de su sitio durante el período de tiempo que especifique en los campos desde y hasta. Esto es útil cuando usted es el único administrador del sitio y quiere asegurarse de que mientras duerme o está fuera nadie pueda acceder a la sección de administración de su sitio. La hora debe indicarse en la zona horaria del servidor que haya configurado en la Configuración global de su sitio. La zona horaria y la hora actual en dicha zona horaria se muestran en el mensaje situado bajo el campo Programación de ausencia desde para su comodidad."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TO="Programación de ausencia hasta (hh:mm)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGSAVED="La configuración del Cortafuegos de Aplicaciones Web se ha guardado."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGNOTSAVED="Se produjeron errores al intentar guardar la configuración del Cortafuegos de Aplicaciones Web."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER="Cambiar el directorio de inicio de sesión del administrador a"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_TIP="Por ejemplo, si introduce la palabra <code>test</code> aquí, solo podrá acceder al área de administración de su sitio con una URL similar a <code>http://www.example.com/test</code>. Si intenta acceder como <code>http://www.example.com/administrator</code> será redirigido a la página de inicio del sitio. Después de visitar la URL secreta con su navegador, también podrá visitar <code>http://www.example.com/administrator</code> sin ser bloqueado hasta que su sesión expire. Si no desea usar esta funcionalidad, deje este campo en blanco. Tenga en cuenta que esta funcionalidad requiere que las opciones <strong>URLs SEF</strong> y <strong>Usar reescritura de URL</strong> en la página de Configuración global de Joomla! estén ambas establecidas en Sí."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_HEAD="Esta funcionalidad es experimental y no cuenta con soporte"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_TEXT="En algunos sitios, la <strong>carpeta de inicio de sesión de administrador personalizada</strong> puede comportarse de forma errática, no funcionar en absoluto o hacer imposible el inicio de sesión. Somos conscientes de ello y no existe ninguna solución alternativa. Por este motivo, esta funcionalidad se proporciona <strong>SIN SOPORTE</strong>. Lea la documentación para obtener más información."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_DESC="Este mensaje se mostrará a los usuarios cuando su solicitud sea considerada sospechosa de una infracción de seguridad. Sea breve y cortés. Déjelo en blanco para usar el mensaje predeterminado."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_HEADER="Personalización"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_LABEL="Mensaje personalizado"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM="Número de intentos de inicio de sesión fallidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM_TIP="Los usuarios serán desactivados cuando se produzca este número de intentos de inicio de sesión fallidos durante el período de tiempo configurado en las dos opciones siguientes."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ="Período de intentos fallidos de inicio de sesión"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ_TIP="Los usuarios serán desactivados cuando se produzcan al menos tantos intentos de inicio de sesión fallidos como los indicados anteriormente en un tiempo máximo igual a este valor. La unidad de medida de tiempo (segundos, minutos, horas, días) se especifica en la opción siguiente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ="Unidad de medida de tiempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ_TIP="Establece la unidad de medida de tiempo para el campo Período de intentos fallidos de inicio de sesión."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQSECOND="Segundos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQMINUTE="Minutos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQDAY="Días"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQHOUR="Horas"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN="Enviar correo electrónico a esta dirección tras un bloqueo de IP automático"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN_TIP="Admin Tools puede enviarle opcionalmente un correo electrónico cuando una IP sea bloqueada automáticamente, a la dirección de correo electrónico introducida en este campo. Deje este campo vacío (predeterminado) para deshabilitar esta funcionalidad."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR="Etiqueta generadora"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR_TIP="Introduzca un valor personalizado para la metaetiqueta generadora, o déjelo en blanco para usar un valor generado automáticamente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_HTACCESSTIP="Para mayor protección de su sitio, utilice también la funcionalidad Generador de .htaccess de este componente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTP="http://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTPS="https://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_DESC="Enlace a un servicio de consulta de IP. {ip} será sustituido por la dirección IP. Predeterminado: whatismyipaddress.com/ip/{ip}"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_LABEL="Servicio de consulta de IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS="No bloquear nunca estas IPs"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS_TIP="Introduzca las direcciones IP que nunca deben bloquearse automáticamente, independientemente de su configuración de bloqueo automático. Puede usar direcciones IPv4 e IPv6 individuales (p. ej., <em>127.0.0.1</em> y <em>::1</em>), rangos IPv4 (p. ej., <em>127.0.0.1-127.0.0.10</em>), notación de rango IPv4 implícita (<em>127.0.0.</em> para todo el bloque 127.0.0.1 a 127.0.0.255) y notación de bloque CIDR IPv4/IPv6 (p. ej., <em>127.0.0.0/8</em> para IPv4 o <em>2001:db8::/32</em> para IPv6)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_ACTIVEFILTERING="Filtrado de solicitudes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASIC="Seguridad básica"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASICSETTINGS="Funcionalidades básicas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_EXCEPTIONS="Excepciones"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_CRAWLERS="Rastreadores"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_DESC="Admin Tools descarga las listas de direcciones IP que los buscadores y las empresas de IA publican para sus rastreadores, y las usa para los rastreadores que elija a continuación. Con Bloquear, se bloquean todas las solicitudes del rastreador. Con No bloquear, el rastreador se trata como en «No bloquear nunca estas IPs»: una solicitud maliciosa suya se sigue bloqueando, pero no se registra, no se envía ningún correo electrónico sobre ella y la dirección IP nunca se bloquea automáticamente. Solo se descargan los rastreadores que configure como Bloquear o No bloquear. Si no se pueden descargar las listas o la caché del sitio no funciona, Admin Tools desactiva esta opción por sí mismo y avisa por correo electrónico a los Superusuarios."
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_LABEL="Usar listas de IP de rastreadores"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_ALLOW="No bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_IGNORE="Ignorar"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_FINGERPRINTING="Camuflaje"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_JHARDENING="Opciones de endurecimiento"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_LOGGINGANDREPORTING="Registro e informes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD="Escudo 404"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE="Habilitar el escudo 404"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE_TIP="Haga clic para habilitar o deshabilitar la funcionalidad Escudo 404"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_TIP="Esta funcionalidad trata los errores 404 No encontrado como motivo para bloquear una solicitud cuando estos se producen en URLs conocidas por ser utilizadas por piratas informáticos para analizar su sitio en busca de vulnerabilidades. Por ejemplo, cuando un pirata informático intenta acceder a la página de inicio de sesión de WordPress aunque usted tenga un sitio Joomla!."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW="Parámetro secreto de URL de administrador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP="Por ejemplo, si introduce 'test', solo podrá acceder al área de administración escribiendo la URL <code>http://www.example.com/administrator/index.php?test</code>. <strong>ADVERTENCIA: DEBE COMENZAR POR UNA LETRA, NO POR UN NÚMERO</strong>. Para una mayor compatibilidad entre servidores, utilice únicamente caracteres ASCII en minúsculas y números (a-z, 0-9)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP_LONG="El parámetro secreto de URL de administrador solo puede estar compuesto por letras latinas en mayúsculas y minúsculas sin acentos ni diacríticos (a-z y A-Z), números del 0 al 9, guiones y guiones bajos. El primer carácter no puede ser un guion ni un guion bajo. Debe tener entre 4 y 64 caracteres."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_INVALID="El parámetro secreto de URL de administrador no es válido. Recuerde que solo puede estar compuesto por letras latinas en mayúsculas y minúsculas sin acentos ni diacríticos (a-z y A-Z), números del 0 al 9, guiones y guiones bajos. El primer carácter no puede ser un guion ni un guion bajo. Debe tener entre 4 y 64 caracteres."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION="Acción cuando el parámetro secreto de URL de administrador no es válido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_TIP="Qué hacer cuando el parámetro secreto de URL de administrador está ausente o no es válido. Redirigir: redirige el navegador a la raíz del sitio (predeterminado). Bloquear: bloquea la solicitud con el mensaje de solicitud bloqueada de Admin Tools y un estado HTTP 403. Tenga en cuenta que esto no ayuda tanto como cabría esperar a aliviar la alta carga del servidor en ataques sostenidos de fuerza bruta de contraseñas, ya que los bots de fuerza bruta de contraseñas normalmente no siguen redirecciones; en ese caso use la funcionalidad de contraseña de administrador para gestionar mejor la alta carga del servidor."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_REDIRECT="Redirigir"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE="Cookie del navegador como alternativa al parámetro secreto de URL de administrador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_TIP="¿Debo establecer una cookie en el navegador al iniciar sesión correctamente como administrador para que el navegador pueda acceder a la página de inicio de sesión del administrador en cualquier momento durante los próximos 30 días sin necesidad de proporcionar el parámetro secreto de URL de administrador? La cookie queda invalidada si usa la función Cerrar sesión de Joomla! o si cambia la contraseña del usuario. Lea la documentación para obtener más información. Si no está seguro, establézcalo en «Habilitado, notificar cuando se use»."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_OFF="Deshabilitado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON="Habilitado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_WARN="Habilitado, notificar cuando se use"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_MAXWARN="Habilitado, recordar usar la URL completa"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE="Permitir plantillas del sitio"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE_TIP="Habilitar esta opción anula parcialmente la opción anterior (el bloqueo de template=foo en la URL). Si el parámetro de consulta de URL template= especifica el nombre de una plantilla que existe en su directorio de plantillas, se permitirá sin que la solicitud sea bloqueada. Esto solo es necesario en sitios que utilizan más de una plantilla al mismo tiempo."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM="Filtrado antispam basado en la lista de palabras prohibidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM_TIP="Cuando está habilitado, todas las solicitudes que contengan al menos una palabra de la lista de palabras prohibidas serán bloqueadas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY="Clave HTTP:BL de <a href='http://www.projecthoneypot.org/httpbl_configure.php' target='_blank'>Project Honeypot</a>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY_TIP="Introduzca su clave HTTP:BL. Puede registrarse en Project Honeypot y obtener su clave en <a href='http://www.projecthoneypot.org/httpbl_configure.php'>http://www.projecthoneypot.org/httpbl_configure.php</a>."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS="Dominios de correo electrónico"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS_TIP="Introduzca un dominio por entrada, sin protocolo, p. ej. <code>example.com</code> pero NO <s><code>https://www.example.com</code></s>. Admin Tools permitirá o bloqueará el registro según el campo anterior. Déjelo vacío para deshabilitar cualquier restricción durante el registro de usuarios."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES="Bloquear nombres de usuario comunes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_TIP="Cuando está habilitado, Admin Tools bloqueará la creación de nuevas cuentas de usuario cuyo nombre de usuario figure en la lista de bloqueo predeterminada (p. ej., admin, ceo, manager, etc.)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW="Nombres de usuario explícitamente permitidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW_TIP="Lista de nombres de usuario que están explícitamente permitidos, uno por línea."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID="Nombres de usuario explícitamente prohibidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID_TIP="Lista de nombres de usuario que están explícitamente prohibidos, uno por línea."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN="Bloqueo inmediato de IP por intento de inicio de sesión con un nombre de usuario prohibido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN_TIP="Si alguien intenta iniciar sesión en su sitio usando uno de los nombres de usuario comunes integrados en Admin Tools o uno de los nombres de usuario explícitamente prohibidos descritos a continuación, pero no existe ningún usuario con dicho nombre en su sitio, la solicitud es bloqueada. Además, si el bloqueo de IP de reincidentes está habilitado en la pestaña de bloqueo automático, la dirección IP del atacante se bloquea inmediatamente, aunque no haya alcanzado el número de ataques especificado en la opción Bloquear IP después de este número de solicitudes bloqueadas. El razonamiento es que intentar iniciar sesión en el sitio con un nombre de usuario prohibido o común es muy probablemente un ataque de relleno de credenciales que debe ser combatido lo antes posible."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION="Acción para la supervisión de configuración"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_EMAIL="Correo electrónico"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_TIP="Qué desea hacer cuando la supervisión de la configuración global o de un componente está habilitada y se detecta un cambio en la configuración. «Correo electrónico» simplemente enviará un correo electrónico de advertencia a las direcciones de correo electrónico que haya configurado a continuación; los cambios de configuración se llevarán a cabo. «Bloquear» tratará estos cambios como motivo para bloquear la solicitud; los cambios de configuración NO se llevarán a cabo y no se enviará ningún correo electrónico."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS="Supervisar la configuración de los componentes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS_TIP="Cuando esta opción está habilitada y alguien intenta cambiar la configuración de cualquier componente principal de Joomla! o de terceros (lo que se ve al hacer clic en Opciones en la barra de herramientas de un componente) desde el backend de su sitio, se le notificará o serán bloqueados (según su configuración a continuación)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL="Supervisar la Configuración global"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL_TIP="Cuando esta opción está habilitada y alguien intenta cambiar la Configuración global de Joomla!, ya sea desde el backend o el frontend, se le notificará o serán bloqueados (según su configuración a continuación)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL="Enviar correo electrónico a esta dirección cuando se cambie la configuración supervisada"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL_TIP="Las direcciones de correo electrónico, separadas por comas, a las que desea que se le informe sobre cualquier cambio en la configuración global supervisada y/o en la configuración del componente. Si se deja en blanco, se utilizará la dirección de correo electrónico configurada en la opción «Enviar correo electrónico a esta dirección después de un bloqueo automático de IP». Si ambos campos están vacíos, se enviará un correo electrónico a todas las cuentas de Superusuario activadas que tengan la opción Recibir correo electrónico del sistema habilitada en su perfil de usuario."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN="Advertir sobre self XSS"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN_TIP="Muestra un mensaje en la consola del navegador para advertir al usuario que evite ejecutar cualquier comando dentro de ella. Esto puede llevar a hackearse a uno mismo (ataques de tipo Self XSS) y robar los datos de su cuenta."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES="Supervisar archivos críticos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL="Supervisar estos archivos en busca de cambios"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL_TIP="Supervise los siguientes archivos (uno por entrada) en busca de cambios. Si se detecta un cambio, se le notificará por correo electrónico. Las rutas de los archivos son relativas a la raíz de su sitio."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_TIP="Los archivos críticos que los piratas informáticos suelen modificar (index.php, administrator/index.php y los archivos index.php, error.php y component.php de todas las plantillas instaladas en el sitio) serán supervisados en busca de cambios en cada carga de página. Si se detecta un cambio, se le notificará por correo electrónico. Esto generalmente le permite obtener una advertencia anticipada en caso de un intento de piratería exitoso."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL="Enviar correo electrónico a esta dirección cuando se cambien los archivos supervisados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL_TIP="Las direcciones de correo electrónico, separadas por comas, a las que desea que se le informe sobre cualquier cambio en los archivos críticos supervisados y/o en los archivos personalizados. Si se deja en blanco, se utilizará la dirección de correo electrónico configurada en la opción «Enviar correo electrónico a esta dirección después de un bloqueo automático de IP». Si ambos campos están vacíos, se enviará un correo electrónico a todas las cuentas de Superusuario activadas que tengan la opción Recibir correo electrónico del sistema habilitada en su perfil de usuario."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR="Personalizar la metaetiqueta del generador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR_TIP="Todas las instalaciones de Joomla! establecen la metaetiqueta del generador, un fragmento de HTML en el encabezado de todas las páginas, para anunciar que su sitio funciona con Joomla!. Esta información es almacenada en caché por los motores de búsqueda y es aprovechada por los atacantes para deducir que su sitio funciona con Joomla! cuando buscan objetivos potenciales. Habilitar esta opción le permite establecer un valor personalizado para la etiqueta del generador en la siguiente opción. ¡Sea creativo!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USEROPTS="Endurecimiento de la gestión de usuarios"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR="Supervisión"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS="Desactivar usuarios en caso de inicio de sesión fallido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS_TIP="Admin Tools puede opcionalmente desactivar cuentas de usuario existentes cuando hay múltiples intentos fallidos de inicio de sesión usando su nombre de usuario, protegiendo las cuentas de usuario de ataques de fuerza bruta. Aquí puede especificar el número de inicios de sesión fallidos y el período de tiempo en que deben ocurrir antes de que el usuario sea desactivado, por ejemplo, 3 inicios de sesión fallidos en 1 minuto. Establecer el número de inicios de sesión fallidos en 0 desactiva esta función."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD="Escudo de inclusión directa de archivos (DFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD_TIP="Cuando esta opción está habilitada, Admin Tools comprueba los parámetros GET y POST de cada solicitud al frontend de su sitio. La solicitud se bloquea si un parámetro contiene un byte nulo, o si su valor parece una ruta de archivo, porque empieza por una barra, por ../ o por una letra de unidad como C:, y nombra un archivo o una carpeta que existe en su servidor, sea cual sea su tipo. Un valor formado solo por barras, p. ej. return=/, no se bloquea."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET="Deshabilitar el restablecimiento de contraseña para grupos de usuarios específicos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_TIP="Bloquea a los usuarios pertenecientes a uno de los grupos de usuarios seleccionados de solicitar un restablecimiento de contraseña usando la función «¿Olvidó su contraseña?» en el frontend del sitio."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS="Grupos de usuarios bloqueados para restablecer la contraseña"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS_TIP="Los usuarios de estos grupos de usuarios no podrán solicitar un restablecimiento de contraseña. No necesita añadir grupos con permisos de Superusuario; estos son bloqueados automáticamente por el propio Joomla!."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_HEAD="Bloqueo de usuarios olvidados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS="Impedir que los usuarios del backend olvidados inicien sesión"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION="Método de prevención de inicio de sesión"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_RESET="Forzar restablecimiento de contraseña"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_TIP="Elija cómo Admin Tools aplicará la prevención de inicio de sesión para los usuarios olvidados. «Bloquear» bloqueará permanentemente al usuario; un Superusuario deberá desbloquearlo manualmente. «Forzar restablecimiento de contraseña» (recomendado) obligará al usuario a restablecer su contraseña la próxima vez que inicie sesión y no le permitirá hacer nada más en el sitio hasta que complete el restablecimiento de contraseña."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ="Comprobar cada [minutos]"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ_TIP="Ejecutar esta comprobación como máximo cada este número de minutos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS="Grupos de usuarios del backend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS_TIP="¿A qué grupos de usuarios con acceso al backend se aplica esta función? Seleccione ningún grupo para aplicarla a todos los grupos de usuarios con acceso de inicio de sesión al backend de su sitio."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS="Número máximo de días desde el último inicio de sesión"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS_TIP="Los usuarios que pertenezcan a los grupos de usuarios especificados anteriormente y que no hayan iniciado sesión durante al menos este número de días no podrán iniciar sesión."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED="Usuarios protegidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED_TIP="Estos usuarios nunca serán bloqueados. Se recomienda que solo incluya un número <strong>muy</strong> limitado de cuentas de usuario en esta lista. Normalmente, deberían ser las cuentas del propietario del sitio y del desarrollador del sitio, nadie más (especialmente <strong>NO</strong> otros miembros del personal que puedan marcharse mientras sus cuentas de usuario quedan atrás, es decir, el objetivo principal de esta protección)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_TIP="Impedir que los usuarios con acceso al backend que no han iniciado sesión durante mucho tiempo inicien sesión en el sitio. Lo más probable es que sean usuarios obsoletos que olvidó eliminar y cuya contraseña pudo haber quedado comprometida mientras tanto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN="Enviar correo electrónico a esta dirección en caso de inicio de sesión fallido de administrador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN_TIP="Introduzca una dirección de correo electrónico para recibir una notificación cuando alguien no pueda iniciar sesión en el backend administrador de su sitio. Déjelo en blanco para no recibir notificaciones. ¡Asegúrese primero de que su sitio puede enviar correos electrónicos!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN="Enviar correo electrónico a esta dirección en caso de inicio de sesión exitoso en el backend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN_TIP="Introduzca una dirección de correo electrónico para recibir una notificación cuando alguien inicie sesión correctamente en el backend administrador de su sitio. Déjelo en blanco para no recibir notificaciones. ¡Asegúrese primero de que su sitio puede enviar correos electrónicos!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES="Enviar correo electrónico a esta dirección en caso de solicitud bloqueada"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES_TIP="Introduzca una dirección de correo electrónico para recibir una notificación cuando cualquier solicitud sea bloqueada en su sitio. Déjelo en blanco para no recibir notificaciones. ¡Asegúrese primero de que su sitio puede enviar correos electrónicos!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS="Enviar excepciones de PHP por correo electrónico a esta dirección"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS_TIP="Cada vez que se produzca una excepción PHP no manejada (es decir, un error en una consulta a la base de datos), Admin Tools enviará un correo electrónico con todos los detalles (hora, archivo y línea que genera la excepción) para depuración posterior."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE="Habilitar la limitación de correos electrónicos de solicitudes bloqueadas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE_TIP="Cuando está habilitada, la frecuencia de los correos electrónicos enviados por Admin Tools puede ser limitada. Consulte las Plantillas de correo electrónico para la configuración de frecuencia máxima de correos electrónicos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION="Filtrar el registro de usuarios por correo electrónico"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_ALLOW="Permitir"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_TIP="Elija si Admin Tools debe solo permitir o bloquear los dominios de correo electrónico de la lista que aparece a continuación"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS="Bloquear también las IP sospechosas, no solo las de spammers confirmados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS_TIP="A veces Project Honeypot no está seguro de si una IP pertenece a un spammer o es una persona desafortunada que hizo clic en el enlace equivocado. En ese caso, la IP se marca como \"sospechosa\". El comportamiento predeterminado es no bloquear estas IP. Sin embargo, si está recibiendo mucho spam, es buena idea habilitar esta función y bloquear incluso las IP \"sospechosas\". En última instancia, algunos usuarios desafortunados serán bloqueados inadvertidamente, ¡así que utilice esta opción con precaución!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE="Habilitar el filtrado HTTP:BL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE_TIP="Habilita la integración con <a href='http://www.projecthoneypot.org'>Project Honeypot</a>. <strong>IMPORTANTE</strong>: Necesita registrarse en Project Honeypot, obtener una clave e introducirla en la siguiente opción para que esta función funcione."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE="Antigüedad máxima de los resultados HTTP:BL aceptados (días)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE_TIP="Project Honeypot informa cuándo fue la última vez que esta IP fue detectada enviando mensajes de spam. Cuanto más antigua sea esta información (mayor sea la antigüedad), menos probable es que esta IP siga siendo utilizada por un spammer. Aquí puede elegir cuál será la antigüedad máxima informada que será bloqueada. El valor predeterminado de 30 significa que las IP que han enviado un mensaje de spam en los últimos 30 días serán bloqueadas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD="Nivel mínimo de amenaza para bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD_TIP="Project Honeypot utiliza una «clasificación de amenaza» logarítmica para evaluar la posibilidad de que una IP específica sea un spammer. Esta opción define el nivel mínimo de amenaza que debe tener una IP antes de ser bloqueada. Un valor de 25 significa que esta IP ha enviado 100 mensajes de spam en las honeypots de captura de spam de Project Honeypot y suele ser una indicación segura de que pertenece a un spammer. Tenga en cuenta que la clasificación es logarítmica. Un valor de 50 significa 1.000 mensajes de spam y un valor de 75 significa un millón de mensajes de spam. No lo establezca en valores superiores a 50, ya que lo más probable es que nunca bloquee ningún spammer. El valor predeterminado es 25 (100 mensajes de spam detectados desde esa dirección IP)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL="Denegar el acceso al sitio a las IP en la Lista de IP no permitidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL_TIP="Cuando está habilitada, si la IP del visitante está en la Lista de IP no permitidas (consulte la función Lista de IP no permitidas), recibirá inmediatamente un error 403 Prohibido al intentar acceder a su sitio."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL="Permitir acceso de administrador solo a las IP en la Lista de IP exclusivas permitidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL_TIP="Cuando está habilitada, solo las IP en la Lista de IP exclusivas permitidas (consulte la función Lista de IP exclusivas permitidas del administrador) podrán acceder al área de administrador del sitio. Todos los demás intentos de acceder a las páginas de administrador serán redirigidos a la página principal del sitio. ¡Tenga cuidado al usar esta función! Si no ha añadido su propia IP a la Lista de IP exclusivas permitidas, quedará bloqueado fuera de su área de administrador."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD="ItemidShield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_TIP="Cuando está habilitado, Admin Tools bloqueará cualquier valor no válido para el parámetro de URL ItemId o intentará limpiarlo a un valor entero válido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_OFF="Desactivado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_CLEAN="Limpiar"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS="Bloquear parámetros principales sospechosos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS_TIP="Bloquea las solicitudes con valores sospechosos en los parámetros de cadena de consulta principales de Joomla!, como <code>option</code>, <code>view</code>, <code>task</code>, etc."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD="Advertir sobre el uso de contraseñas conocidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS="Grupos de usuarios para comprobar contraseñas conocidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS_TIP="Admin Tools comprobará si hay contraseñas conocidas solo para los usuarios que pertenezcan a esos grupos (por defecto Superusuarios)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_TIP="Cuando esta opción está habilitada, Admin Tools se conectará a la base de datos Have I Been Pwned y comprobará si el hash de la contraseña actual es conocido. Si se encuentra una coincidencia, se bloqueará al usuario para que no use una contraseña insegura."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES="Registrar solicitudes bloqueadas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES_TIP="Se sugiere mantener esta opción habilitada. Cuando está habilitada, todas las posibles brechas de seguridad —bloqueadas por Admin Tools— se registrarán en la base de datos y estarán disponibles en la herramienta Registro de solicitudes bloqueadas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE="Mantener un archivo de registro de depuración"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE_TIP="Admin Tools puede opcionalmente mantener un archivo de registro dentro de la carpeta de registros de Joomla configurada. Cuando esta opción está habilitada, se añade una entrada al archivo de registro cada vez que se bloquea una solicitud. Esta entrada contiene información adicional útil para la resolución de problemas, incluyendo un volcado completo de los datos de la solicitud. Esto significa que potencialmente estará almacenando información de identificación personal o información confidencial en un archivo no cifrado. Se recomienda activar esta opción solo cuando esté resolviendo un problema difícil de detectar y desactivarla una vez que haya recopilado suficiente información para solucionar el problema."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES="Registrar nombres de usuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES_TIP="Cuando está habilitado, Admin Tools incluirá el nombre de usuario al rastrear los inicios de sesión fallidos (véase más arriba). ADVERTENCIA: Se recomienda encarecidamente mantener esta opción deshabilitada para evitar problemas con el RGPD"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD="Bloqueo de agente de usuario malicioso (MUAShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD_TIP="Muchos piratas informáticos intentarán acceder a su sitio usando un navegador configurado para enviar código PHP malicioso en su cadena de agente de usuario (un pequeño fragmento de texto utilizado para describir el navegador al servidor). La idea es que el software de procesamiento de registros defectuoso lo analizará y permitirá al pirata informático tomar el control de su sitio web. Cuando está habilitada, esta función permite a Admin Tools detectar tales ataques y bloquear la solicitud."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN="Prohibir el inicio de sesión de Superadministradores en el frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN_TIP="Cuando está habilitada, no será posible que los Superadministradores inicien sesión en el frontend de su sitio. Esta es una precaución de seguridad contra los ataques de fuerza bruta de contraseñas. Incluso los usuarios con privilegios de Superusuario no podrán iniciar sesión en el frontend de su sitio."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS="Deshabilitar la edición de propiedades de usuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_TIP="Cuando está habilitada, intentar modificar la configuración de un Gestor, Administrador o Superadministrador existente, o crear uno nuevo, fallará."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS="Deshabilitar la edición de propiedades de usuario para estos grupos de usuarios"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS_TIP="¿A qué grupos de usuarios con acceso al backend se aplica esta función? Si no selecciona ningún grupo, Admin Tools desactivará la edición de propiedades de usuario para todos los usuarios que tengan acceso de inicio de sesión al backend de su sitio."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS="Deshabilitar la creación / edición de usuarios desde el frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_TIP="Normalmente debería ser imposible crear un nuevo usuario con privilegios de acceso al backend de administración desde el frontend público. Cuando esta opción está habilitada, tratará los intentos de crear este tipo de cuentas como intentos de intrusión y los bloqueará. Esto aborda algunos de los ataques de día cero más notorios en Joomla! que tuvieron lugar entre 2015 y 2016."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS="Deshabilitar la creación / edición de usuarios en estos grupos desde el frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS_TIP="¿A qué grupos de usuarios con acceso al backend se aplica esta función? Si no selecciona ningún grupo, Admin Tools deshabilitará la creación o edición de usuarios desde el backend para todos los usuarios que tengan o pudieran obtener acceso de inicio de sesión al backend del sitio."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD="Bloqueo de envoltorios de flujo PHP (PHPShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD_TIP="Algunos piratas informáticos intentarán usar los llamados envoltorios de flujo PHP (parecen URLs que comienzan con php://, phar://, etc.) para manipular subrepticiamente los archivos de su sitio, eludiendo los controles de carga de archivos integrados en Joomla!. Cuando esta opción está habilitada, Admin Tools bloqueará toda solicitud que incluya texto que coincida con cualquiera de los envoltorios de flujo PHP comúnmente utilizados por piratas informáticos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL="No enviar notificaciones por correo electrónico por estos motivos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL_TIP="Las solicitudes bloqueadas por estos motivos no generarán el envío de un correo electrónico a la dirección especificada en <em>Enviar correo electrónico a esta dirección cuando se bloquee una solicitud</em>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG="No registrar estos motivos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG_TIP="Las solicitudes bloqueadas por estos motivos no se registrarán. Como resultado, las IP que provoquen repetidamente una solicitud bloqueada por este motivo no serán prohibidas automáticamente de su sitio. Además, al no existir registro, será imposible determinar por qué alguien está siendo bloqueado en su sitio cuando activa uno de esos motivos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA="Deshabilitar la autenticación de dos factores de Joomla! al restablecer la contraseña"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA_TIP="Cuando está habilitado, Admin Tools deshabilitará la configuración de autenticación de dos factores de Joomla! para un usuario cuando restablezca su contraseña. Esto solo se aplica a la función de autenticación de dos factores integrada en Joomla! 3.2 y versiones posteriores, no a la función de autenticación de dos factores de Admin Tools."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD="Bloqueo de inclusión remota de archivos (RFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD_TIP="Algunos piratas informáticos intentarán forzar a una extensión vulnerable a cargar código PHP directamente desde su servidor. Esto se hace pasando una URL http(s):// o ftp:// en su solicitud, apuntando a su sitio malicioso. Cuando esta opción está habilitada, Admin Tools buscará tales casos, intentará obtener la URL remota y analizará su contenido. Si se determina que contiene código PHP, bloqueará la solicitud."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP="Guardar la IP de registro de usuario en Notas de usuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_TIP="Cuando está habilitado, la IP desde la que se registraron los nuevos usuarios se almacenará como Notas de usuario. Los usuarios creados a través del backend no tendrán su IP guardada como Nota de usuario porque no tiene sentido hacerlo (es un administrador que registra la cuenta de usuario en su nombre). Los componentes de terceros que crean nuevas cuentas de usuario también pueden no activar el evento del plugin."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY="Categoría de Notas de usuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY_TIP="Seleccione las categorías de Notas de usuario donde Admin Tools debe guardar la IP del usuario; por defecto, Sin categoría"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT="Defenderse contra la desactivación del plugin"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT_TIP="Cuando está habilitado, Admin Tools impedirá a los usuarios del backend intentar deshabilitar (despublicar) el plugin. ¡Esto significa que usted tampoco podrá despublicar el plugin hasta que deshabilite esta opción! Además, tenga en cuenta que esto no tiene efecto contra alguien que edite su base de datos directamente, o que cambie el nombre o elimine los archivos del plugin del sistema de Admin Tools (el directorio <code>plugins/system/admintools</code> de su sitio). Tampoco protege contra la desinstalación de Admin Tools porque solo los superusuarios pueden hacerlo por defecto. Si un atacante obtiene privilegios de superusuario, que deshabilite Admin Tools es lo de menos que debería preocuparle."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD="Protección contra el envenenamiento de datos de sesión PHP (SessionShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD_TIP="Evita datos de entrada maliciosos que pueden usarse para engañar al manejador de sesiones interno de PHP para que ejecute código arbitrario al restaurar la sesión del usuario. PRECAUCIÓN: <em>Puede</em> bloquear también algunas solicitudes legítimas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD="Protección SQLiShield contra ataques de inyección SQL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD_TIP="Cuando está habilitado, Admin Tools intentará detectar ataques comunes de inyección SQL contra su sitio y bloquearlos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST="Monitorear cuentas de superusuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_TIP="Admin Tools realizará un seguimiento de las cuentas de usuario con acceso de superusuario. Si se añade un nuevo superusuario fuera de la página de Usuarios de Joomla, se le notificará por correo electrónico. Además, las nuevas cuentas de superusuario detectadas serán bloqueadas automáticamente. Los usuarios creados o añadidos por otros superusuarios en el backend del sitio mediante la página de Usuarios de Joomla NO serán bloqueados por esta función. Por favor, utilice la función &ldquo;Deshabilitar la edición de propiedades de usuarios del backend&rdquo; para evitar esto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL="Enviar correo electrónico a esta dirección cuando cambie la lista de superusuarios"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL_TIP="Las direcciones de correo electrónico, separadas por comas, a las que desea recibir notificaciones sobre cualquier cambio intentado (¡y bloqueado!) en la lista de superusuarios de su sitio. Si se deja en blanco, se utilizará la dirección de correo electrónico configurada en la opción \"Enviar correo electrónico a esta dirección después de un bloqueo automático de IP\". Si ambos campos están vacíos, se enviará un correo electrónico a todas las cuentas de superusuario activadas que tengan habilitada la opción Recibir correo electrónico del sistema en su perfil de usuario."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE="Bloquear el cambio de plantilla del sitio mediante template=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE_TIP="Otra función oculta de Joomla! es la capacidad de cambiar entre plantillas instaladas pasando un parámetro de URL especial. Por ejemplo, si desea aplicar la plantilla Beez5, solo tiene que pasar el parámetro <code>?template=beez5</code>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL="Bloquear el cambio de plantilla del sistema mediante tmpl=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST="Lista de palabras clave tmpl= permitidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST_TIP="Una palabra clave tmpl por entrada. Las entradas component y system siempre se añaden, independientemente de si las añade aquí explícitamente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL_TIP="Una de las características menos conocidas de Joomla! son sus plantillas del sistema. Cuando se produce un error o pone su sitio fuera de línea, Joomla! carga la plantilla del sistema correspondiente. Pasar el nombre de la plantilla en la URL añadiendo, por ejemplo, ?tmpl=offline le permite probar esas plantillas sin tener que producir realmente un error o poner su sitio fuera de línea. Habilitar esta opción desactivará esta función oculta de Joomla!. Tenga en cuenta que tmpl=system y tmpl=component deben estar permitidos (véase la siguiente opción), ya que algunas extensiones los requieren para funcionar."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS="Tratar los inicios de sesión fallidos como motivo para bloquear la solicitud"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS_TIP="Cuando está habilitado, los intentos de inicio de sesión fallidos de cualquier tipo de usuario (incluso simples usuarios registrados) cuentan como motivo válido para bloquear la solicitud y se registran en el Registro de solicitudes bloqueadas de Admin Tools. Esto tiene una implicación muy útil. Como cuentan como motivos para bloquear una solicitud, también cuentan hacia el límite configurado en el bloqueo automático de IP. Por lo tanto, tras un número de intentos de inicio de sesión fallidos, la IP del usuario será bloqueada automáticamente durante el tiempo que haya configurado."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL="Enviar correo electrónico de resolución de problemas en funciones administrativas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL_TIP="Envía un correo electrónico al usuario del backend que haya iniciado sesión siempre que realice una función administrativa de Admin Tools que pueda resultar en que quede bloqueado fuera del sitio o que el sitio deje de funcionar correctamente. El correo electrónico contiene enlaces a los artículos de resolución de problemas que le ayudan a rectificar el problema y restaurar el sitio a su estado de funcionamiento. Se recomienda encarecidamente mantener esta función habilitada. Seguir la información de resolución de problemas es mucho más rápido que esperar una respuesta de nuestro soporte."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD="Escáner de archivos subidos (UploadShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_TIP="Inspecciona cada archivo subido a su sitio y bloquea la solicitud cuando el archivo parece que podría utilizarse para ejecutar código en su servidor. Esto le protege frente a extensiones de terceros vulnerables que permiten a los atacantes subir archivos arbitrarios. Las subidas realizadas por Superusuarios que han iniciado sesión nunca se inspeccionan."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS="UploadShield: impedir la sobrescritura mediante .htaccess"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS_TIP="Bloquea la solicitud cuando se sube un archivo llamado .htaccess y su contenido incluye una directiva SetHandler o AddHandler de Apache. Los atacantes utilizan estas directivas para hacer que Apache ejecute como código PHP archivos que de otro modo serían inertes, como las imágenes."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT="UploadShield: impedir la subida de archivos con múltiples extensiones"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT_TIP="Bloquea la solicitud cuando cualquier parte del nombre del archivo subido parece una extensión de archivo PHP, p. ej. evil.php.jpg o evil.jpg.php5. Algunas configuraciones erróneas del servidor ejecutan tales archivos como código PHP, independientemente de su tipo de archivo aparente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT="UploadShield: impedir la subida de archivos PHP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT_TIP="Bloquea la solicitud cuando la extensión del archivo subido es una extensión de archivo PHP, como .php, .phps, .phtml, .inc, .php7 y así sucesivamente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT="UploadShield: impedir contenido PHP en las subidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT_TIP="Bloquea la solicitud cuando un archivo subido contiene algo que parece código PHP, sin importar cómo se llame el archivo. Esto detecta los ataques que ocultan código PHP dentro de un archivo de imagen o documento por lo demás válido."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW="Mostrar errores usando una plantilla HTML personalizable"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW_TIP="De forma predeterminada, el mensaje de solicitud bloqueada se mostrará utilizando la página de mensaje de error estándar de Joomla!. Sin embargo, cuando esta opción está habilitada, Admin Tools utilizará una plantilla HTML personalizable. El archivo de plantilla HTML predeterminado se encuentra en el archivo components/com_admintools/View/Blocks/tmpl/default.php. ¡NO MODIFIQUE ESTE ARCHIVO DIRECTAMENTE! Lea la documentación para conocer el método adecuado de crear una sustitución de plantilla."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS="Dominios nunca bloqueados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS_TIP="Si la dirección IP de un visitante cuya solicitud se bloquea se resuelve a un nombre de dominio que termina con lo que introduzca aquí, la solicitud se sigue bloqueando, pero no se registra, no se envía ningún correo electrónico sobre ella y la dirección IP nunca se bloquea automáticamente. El nombre de dominio también debe resolverse de vuelta a la dirección IP del visitante, por lo que un registro DNS inverso falsificado no cuenta. Tenga en cuenta que una lista larga causará un gran impacto en el rendimiento. La lista está vacía de forma predeterminada. Para los motores de búsqueda y los rastreadores de IA, utilice en su lugar la pestaña Rastreadores."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN="Añadir infractores persistentes a la Lista de IP no permitidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM="Prohibir permanentemente la IP tras este número de bloqueos automáticos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_2="bloqueos automáticos de IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_TIP="Cuando la opción anterior está habilitada, ¿tras cuántos bloqueos automáticos se prohibirá permanentemente una IP (añadiéndola a la Lista de IP no permitidas)?"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN_TIP="Si una IP activa este número de bloqueos automáticos, será prohibida permanentemente (añadida a la Lista de IP no permitidas) si está a punto de ser bloqueada automáticamente de nuevo. Asegúrese de activar la función de Lista de IP no permitidas configurando <em>Denegar el acceso al sitio a las IP de la Lista de IP no permitidas</em> en Sí; de lo contrario, la adición permanente a la Lista de IP no permitidas no tendrá efecto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PROJECTHONEYPOT="Project Honeypot"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_BODY="<p>El usuario se registró en el sitio utilizando la dirección IP <strong>%s</strong></p><p>La cadena de agente de usuario del navegador del usuario fue:<br/>%s</p><p>Esta información fue registrada automáticamente en esta Nota de usuario por Admin Tools Professional.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_SUBJECT="Dirección IP de registro"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE="Mostrar este mensaje a las IP bloqueadas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE_TIP="Le permite mostrar un mensaje específico a las direcciones IP bloqueadas. Puede informar al usuario de que su IP fue bloqueada porque se detectó actividad sospechosa proveniente de su dirección IP. Puede usar el texto especial [IP] en mayúsculas, sin espacios entre los corchetes e IP, para mostrar la IP del usuario en el mensaje. Esto puede ser útil si alguien queda bloqueado accidentalmente y le pide ayuda."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSR="Bloqueo automático"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM="Duración del bloqueo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM_TIP="Cuánto tiempo durará el bloqueo. Por ejemplo, configurarlo en 1 día bloqueará todo el acceso desde esa dirección IP durante un día completo. Introduzca el número en este campo y seleccione la unidad de medida de tiempo en el campo siguiente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY="Unidad de medida de tiempo para la duración del bloqueo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY_TIP="La unidad de medida de tiempo para la configuración de \"Duración del bloqueo\" anterior. Elija entre segundos, minutos, días u horas."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE="Bloqueo de IP de reincidentes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE_TIP="Cuando se establece en sí, la dirección IP de los reincidentes será prohibida automáticamente en función del resto de la configuración"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES="Bloquear IP tras este número de solicitudes bloqueadas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES_TIP="Cuando las solicitudes de una dirección IP son bloqueadas al menos este número de veces dentro del período de tiempo definido por las dos opciones siguientes, será bloqueada temporalmente del acceso al sitio. Por ejemplo, si lo configura en 3 ataques en 1 hora, Admin Tools denegará el acceso desde una dirección IP que haya tenido al menos 3 de sus solicitudes bloqueadas en la última hora. Introduzca el valor 0 para deshabilitar esta función."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ="Período de tiempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ_TIP="El número de solicitudes bloqueadas definido anteriormente debe ocurrir dentro de este número de segundos, minutos, horas o días. Introduzca el número aquí; elija la unidad de medida de tiempo en la opción siguiente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY="Unidad de medida de tiempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY_TIP="La unidad de medida de tiempo para la configuración de \"Período de tiempo\" anterior. Elija entre segundos, minutos, días u horas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN="Autenticación por contraseña cuando el inicio de sesión con clave de acceso está habilitado para una cuenta de usuario"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_TIP="Si un usuario habilita la autenticación por clave de acceso para su cuenta de usuario, ¿debería permitírsele iniciar sesión alternativamente con una contraseña?"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_ALLOWED="Siempre permitido (predeterminado de Joomla)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_USERDECIDES="Dejar que los usuarios decidan"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERALLOWED="Deshabilitado para usuarios del backend, permitido para otros"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERDECIDE="Deshabilitado para usuarios del backend, dejar que otros decidan"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBODY="Deshabilitado para todos"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS="Dominios permitidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS_TIP="Introduzca todos los nombres de dominio completos a los que se supone que debe responder su sitio, p. ej. <em>example.com, www.example.com, example.net</em>. Una entrada por campo de texto; añada más campos haciendo clic/tocando el botón verde +. No es necesario añadir <code>localhost</code> ni ningún otro nombre de dominio que se resuelva a <code>127.0.0.1</code> o <code>::1</code> (direcciones de localhost). Si alguien intenta falsificar la cabecera HTTP Host con un nombre de dominio que no esté en esta lista, recibirá una respuesta HTTP 421 Solicitud mal dirigida. Esta función evita la falsificación de la cabecera Host en algunos servidores mal configurados."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL="Enviar correo electrónico a esta dirección cuando aumenten las solicitudes bloqueadas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL_TIP="Se enviará un correo electrónico a esta dirección si Admin Tools detecta que se ha bloqueado un gran número de solicitudes en un período de tiempo determinado. Puede configurarlo a continuación; el valor predeterminado es 1000 solicitudes bloqueadas en una hora."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM="Cantidad de solicitudes bloqueadas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM_TIP="Deben detectarse al menos este número de solicitudes bloqueadas en el período de tiempo definido a continuación para que se envíe un correo electrónico."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ="Período de tiempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ_TIP="Las solicitudes bloqueadas definidas anteriormente deben ocurrir dentro de este número de segundos, minutos, horas o días. Introduzca el número aquí; elija la unidad de medida de tiempo en la opción siguiente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGEFREQUENCY="Unidad de medida de tiempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGEFREQUENCY_TIP="La unidad de medida de tiempo para la configuración de \"Período de tiempo\" anterior. Elija entre segundos, minutos, días u horas."

[Wafexceptions]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; WAF Exceptions
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_WAFEXCEPTIONS="Excepciones del WAF"
COM_ADMINTOOLS_TITLE_WAFEXCEPTION_ADD="Añadir una Excepción WAF"
COM_ADMINTOOLS_TITLE_WAFEXCEPTION_EDIT="Editar una excepción del WAF"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_INTRO = "Esta página le permite seleccionar componentes, vistas o cadenas de consulta específicas <i>para que NO estén protegidos</i> por el Web Application Firewall. Las excepciones se aplican en dos grupos:"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_A = "Cuando se especifican <i>todas las cadenas de consulta</i> para un componente o vista, las siguientes funciones del WAF se deshabilitan completamente: Bad Behaviour, SQLiShield, XSSShield, MUAShield, RFIShield, DFIShield y filtrado de palabras prohibidas"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_B = "Cuando se especifican <i>cadenas de consulta específicas</i> para un componente o vista, las siguientes funciones del WAF se deshabilitan <i>solo para esas cadenas de consulta</i>: SQLiShield, XSSShield, RFIShield, DFIShield, filtrado de palabras prohibidas y bloqueo de parámetros de URL sospechosos"

COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_TITLE="Aún no se han creado reglas de excepción del WAF."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_CONTENT="Las reglas de excepción del WAF le permiten evitar el bloqueo de solicitudes a su sitio para componentes, vistas y parámetros de cadena de consulta específicos. Esto puede usarse cuando sabe que un componente es seguro pero la forma en que funciona siempre generará falsos positivos."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_BUTTON_ADD="Añadir una regla de excepción del WAF"

