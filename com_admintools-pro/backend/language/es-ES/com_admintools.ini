;; Password-protect Administrator
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_ADMINPASSWORD="Proteger con contraseña el administrador"

COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOPASSWORD="Debe introducir una contraseña"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTAPPLIED="No se pudo aplicar la protección con contraseña. Por favor, habilite la capa FTP en la Configuración global de su sitio."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTUNAPPLIED="No se pudo eliminar la protección con contraseña. Por favor, habilite la capa FTP en la Configuración global de su sitio."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOUSERNAME="Debe introducir un nombre de usuario"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_PASSWORDNOMATCH="Las contraseñas no coinciden"

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HOWITWORKS="¿Cómo funciona esto?"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_INFO="Al aplicar la protección con contraseña, su navegador le pedirá un nombre de usuario y una contraseña cada vez que se solicite la URL de un recurso protegido en la carpeta <code>administrator</code>. Deberá introducir el nombre de usuario y la contraseña que ha introducido en esta página. Este nombre de usuario y contraseña son <em>comunes</em> para todos los que administran su sitio y <em>deben ser diferentes</em> a su inicio de sesión en Joomla!. Esto funciona a nivel del servidor, utilizando un archivo <code>.htaccess</code> en la carpeta <code>administrator</code> de su sitio. Su servidor debe admitir la protección de directorios con contraseña mediante archivos .htaccess para que esta función tenga algún efecto. Si no está seguro de que sea así, consulte a su proveedor de alojamiento."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_WARN="Tenga en cuenta que esta protección se aplica incluso si deshabilita o desinstala Admin Tools. Si su área de administrador queda inaccesible, o necesita eliminar la protección con contraseña sin tener acceso a esta página, deberá <strong>eliminar</strong> los archivos <code>.htaccess</code> y <code>.htpasswd</code> de la carpeta <code>administrator</code> de su sitio mediante FTP, SFTP o el gestor de archivos de su panel de control de alojamiento."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORDPROTECTION="Configurar la protección con contraseña del administrador"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES="Restablecer páginas de error personalizadas"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES_HELP="Restablece las páginas de error personalizadas de Apache para HTTP 401 y 403 a los valores predeterminados. Esto evita un error 404 Artículo no encontrado al intentar acceder a la página de inicio de sesión del administrador después de habilitar la función Proteger con contraseña el administrador. Se recomienda encarecidamente mantener esta opción habilitada a menos que cause un problema de Error interno del servidor HTTP 500."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE="Recursos del administrador a proteger"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_JOOMLA="Joomla"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_PHP="Todos los archivos PHP"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_EVERYTHING="Todo"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_HELP="Elija qué se protegerá con contraseña. «Joomla» solo protege el index.php de Joomla! (el punto de entrada de la aplicación de administrador). Todo lo demás puede accederse libremente, incluidos los archivos .php de aplicaciones de terceros. «Todos los archivos PHP» protege todos los archivos PHP en la carpeta <code>administrator</code> y sus subdirectorios. «Todo» funciona igual que las versiones antiguas de Admin Tools, denegando el acceso a cualquier archivo en la carpeta <code>administrator</code> y sus subdirectorios, independientemente de su extensión."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE="Algoritmo de hash de contraseña"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_HELP="Las contraseñas se almacenan cifradas en el archivo <code>administrator/.htpasswd</code>. Esta opción selecciona el algoritmo de hash. bCrypt es el más seguro, pero no siempre está disponible. APR-1 (predeterminado) es suficientemente seguro y compatible con la mayoría de los proveedores. SHA-1 siempre está disponible, pero ya no se considera seguro. crypt() solo permite contraseñas de hasta 8 caracteres, no es compatible con Windows y se considera inseguro. Texto sin formato no aplica ningún hash y NUNCA debe utilizarse para ningún propósito que no sea la resolución de problemas, con una contraseña desechable que debe considerarse comprometida de inmediato."
