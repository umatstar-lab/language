COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_TITLE="No se han definido palabras prohibidas todavía."
COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_CONTENT="Las palabras prohibidas le permiten bloquear cualquier solicitud pública en el frontend que incluya una o más de estas palabras en cualquier parámetro de solicitud. Pueden utilizarse para bloquear spam evidente y lenguaje soez en su sitio."
