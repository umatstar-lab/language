COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_TITLE="Admin Tools: Correo electrónico de resolución de problemas"
COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_DESC="Se envía cada vez que realiza un cambio en la configuración de Admin Tools que podría bloquearle el acceso a su sitio."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_SUBJECT="Información de resolución de problemas de Admin Tools"
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY="Hola {USER},\n\nAcaba de {ACTION} usando el componente Admin Tools en su sitio \"{SITENAME}\". Este es un proceso generalmente seguro. En algunos casos, un malentendido, un descuido, o que un navegador o servidor altere su configuración puede provocar que su sitio no funcione correctamente o quede inaccesible. Esto se aplica tanto a Joomla! en sí como a sus diversas extensiones de terceros. En ese improbable caso, consulte las siguientes URLs para obtener instrucciones de resolución de problemas:\n\n{TROUBLESHOOTING_URLS}\n\nSi no puede encontrar una solución por sí mismo y tiene una suscripción activa de Admin Tools, presente un ticket de soporte en nuestro sitio, https://www.akeeba.com, e indíquenos qué hizo antes de que ocurriera el problema, cuál es el problema y qué pasos de resolución de problemas ya ha intentado.\n\n¿Quién envió este correo electrónico?\n======================================================================\n\nEste correo electrónico es enviado automáticamente por Admin Tools ejecutándose en su sitio a la dirección de correo electrónico registrada en su perfil de usuario de Joomla! cada vez que realiza una acción administrativa que podría bloquearle accidentalmente el acceso a su sitio. No se envía a ningún otro usuario de su sitio.\n\nSi ya no desea recibir estos correos electrónicos, inicie sesión en el panel de administración de su sitio y vaya a Componentes, Admin Tools, Web Application Firewall, Configurar WAF y haga clic en la pestaña Personalización. Busque \"Enviar correo electrónico de resolución de problemas en funciones administrativas\" y establézcalo en No."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY_HTML="<p>Hola {USER},</p><p>Acaba de {ACTION} usando el componente Admin Tools en su sitio \"{SITENAME}\". Este es un proceso generalmente seguro. En algunos casos, un malentendido, un descuido, o que un navegador o servidor altere su configuración puede provocar que su sitio no funcione correctamente o quede inaccesible. Esto se aplica tanto a Joomla! en sí como a sus diversas extensiones de terceros. En ese improbable caso, consulte las siguientes URLs para obtener instrucciones de resolución de problemas:</p>{TROUBLESHOOTING_URLS_HTML}<p>Si no puede encontrar una solución por sí mismo y tiene una suscripción activa de Admin Tools, presente un ticket de soporte en nuestro sitio, https://www.akeeba.com, e indíquenos qué hizo antes de que ocurriera el problema, cuál es el problema y qué pasos de resolución de problemas ya ha intentado.</p><h3>¿Quién envió este correo electrónico?</h3><p>Este correo electrónico es enviado automáticamente por Admin Tools ejecutándose en su sitio a la dirección de correo electrónico registrada en su perfil de usuario de Joomla! cada vez que realiza una acción administrativa que podría bloquearle accidentalmente el acceso a su sitio. No se envía a ningún otro usuario de su sitio.</p><p>Si ya no desea recibir estos correos electrónicos, inicie sesión en el panel de administración de su sitio y vaya a Componentes, Admin Tools, Web Application Firewall, Configurar WAF y haga clic en la pestaña Personalización. Busque \"Enviar correo electrónico de resolución de problemas en funciones administrativas\" y establézcalo en No.</p>"

COM_ADMINTOOLS_MAIL_CONFIGMONITOR_TITLE="Admin Tools: Monitorización de configuración"
COM_ADMINTOOLS_MAIL_CONFIGMONITOR_DESC="Enviado por Admin Tools cuando realiza un cambio en su Configuración global o en las opciones de configuración de un componente cuando las opciones \"Monitorizar Configuración global\" y/o \"Monitorizar configuración de componentes\" están habilitadas en el Web Application Firewall."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_SUBJECT="Opciones de configuración para {AREA} modificadas en {SITENAME}"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY="Hola,\n\nLe informamos de que las opciones de configuración para {AREA} en su sitio, {SITENAME}, han sido modificadas por el usuario {USER}. Los ajustes que cambiaron se enumeran a continuación:\n\n{INFO}\n\nA continuación encontrará más detalles sobre el origen de este cambio:\n\nDirección IP: {IP} (Consulta de IP: {LOOKUP})\nAgente de usuario: {UA}\n\nSi este cambio no fue realizado por usted ni por un administrador de su confianza, revise su sitio de inmediato, ya que podría ser un indicio de actividad de hackeo.\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY_HTML="<p>Hola,</p><p>Le informamos de que las opciones de configuración para {AREA} en su sitio, {SITENAME}, han sido modificadas por el usuario {USER}. Los ajustes que cambiaron se enumeran a continuación:</p>{INFO_HTML}<p>A continuación encontrará más detalles sobre el origen de este cambio:</p><ul><li>Dirección IP: {IP} (<a href=\"{LOOKUP}\">Consulta de IP</a>)</li><li>Agente de usuario: {UA}</li></ul><p>Si este cambio no fue realizado por usted ni por un administrador de su confianza, revise su sitio de inmediato, ya que podría ser un indicio de actividad de hackeo.</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_CHANGED="Opciones modificadas"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_ADDED="Opciones añadidas"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REMOVED="Opciones eliminadas"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REDACTED="(modificado; valor oculto por seguridad)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPAQUE="(modificado)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_EMPTY="(vacío)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPTION="Opción"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OLD="Valor anterior"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_NEW="Nuevo valor"
; Diff layout strings. Override these to restyle the changed-options table in the notification email.
; Plain text: %1$s = option label, %2$s = previous value, %3$s = new value (as applicable).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_SECTION="%s:"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_CHANGED="  %1$s: %2$s → %3$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_ADDED="  %1$s: %2$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_REMOVED="  %1$s: %2$s"
; Opaque line: the value is not shown (sensitive, compound, or a custom field type). %1$s = label, %2$s = marker.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_OPAQUE="  %1$s: %2$s"
; HTML: %s in the section is the section title; in a row %1$s = label, %2$s = previous value, %3$s = new value;
; in the table %1$s = Option header, %2$s = Previous value header, %3$s = New value header, %4$s = the rows.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_SECTION="<tr><th colspan=\"3\" style=\"text-align:left;background:#f0f0f0;\">%s</th></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW="<tr><td>%1$s</td><td>%2$s</td><td>%3$s</td></tr>"
; Opaque HTML row: %1$s = label, %2$s = marker (spans the previous/new value columns).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW_OPAQUE="<tr><td>%1$s</td><td colspan=\"2\">%2$s</td></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_TABLE="<table border=\"1\" cellpadding=\"4\" cellspacing=\"0\"><thead><tr><th>%1$s</th><th>%2$s</th><th>%3$s</th></tr></thead><tbody>%4$s</tbody></table>"

COM_ADMINTOOLS_MAIL_USERREACTIVATE_TITLE="Admin Tools: Reactivación de usuario"
COM_ADMINTOOLS_MAIL_USERREACTIVATE_DESC="Enviado por Admin Tools cuando una cuenta de usuario es temporalmente desactivada debido a demasiados intentos fallidos de inicio de sesión."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_SUBJECT="Cuenta de usuario bloqueada temporalmente en {SITENAME}"
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY="Hola,\n\nHemos detectado varios intentos fallidos de inicio de sesión con la cuenta de usuario {USER} en nuestro sitio {SITENAME}. Como resultado, nuestro sistema ha aplicado automáticamente un bloqueo temporal a la cuenta de usuario el {DATE}.\n\nSi cree que está recibiendo este mensaje por error, es decir, fue usted quien intentó iniciar sesión accidentalmente con la contraseña incorrecta, haga clic en el siguiente enlace para levantar el bloqueo temporal de su cuenta de usuario:\n{ACTIVATE}\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque tiene una cuenta de usuario en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY_HTML="<p>Hola,</p><p>Hemos detectado varios intentos fallidos de inicio de sesión con la cuenta de usuario {USER} en nuestro sitio {SITENAME}. Como resultado, nuestro sistema ha aplicado automáticamente un bloqueo temporal a la cuenta de usuario el {DATE}.</p><p>Si cree que está recibiendo este mensaje por error, es decir, fue usted quien intentó iniciar sesión accidentalmente con la contraseña incorrecta, haga clic en el siguiente enlace para levantar el bloqueo temporal de su cuenta de usuario:</p><p><a href=\"{ACTIVATE}\">{ACTIVATE}</a></p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Nota: Está recibiendo este correo electrónico automático porque tiene una cuenta de usuario en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_TITLE="Admin Tools: Intento fallido de inicio de sesión de administrador"
COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_DESC="Enviado por Admin Tools cuando se produce un intento fallido de inicio de sesión en el panel de administración, siempre que la función correspondiente esté habilitada."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_SUBJECT="Intento fallido de inicio de sesión de administrador para el usuario {USER} en {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY="Hola,\n\nLe informamos de que el usuario {USER} no ha podido iniciar sesión correctamente en el área de administración de su sitio, {SITENAME}. Información adicional:\n\nNombre de usuario: {USER}\nDirección IP: {IP} ({LOOKUP})\nCadena de agente de usuario del navegador: {UA}\n\nSi esto era esperado, no necesita hacer nada al respecto. Si sospecha de un intento de hackeo, inicie sesión en el panel de administración de su sitio de inmediato y active el modo sin conexión de emergencia de Admin Tools.\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY_HTML="<p>Hola,</p><p>Le informamos de que el usuario <strong>{USER}</strong> <strong>no</strong> ha podido iniciar sesión correctamente en el área de administración de su sitio, {SITENAME}. Información adicional:</p><p>Nombre de usuario: {USER}<br />Dirección IP: {IP} (<a href=\"{LOOKUP}\">Consulta de IP</a>)<br />Cadena de agente de usuario del navegador: {UA}</p><p>Si esto era esperado, no necesita hacer nada al respecto. Si sospecha de un intento de hackeo, inicie sesión en el panel de administración de su sitio de inmediato y active el modo sin conexión de emergencia de Admin Tools.</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_TITLE="Admin Tools: Inicio de sesión de administrador exitoso"
COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_DESC="Enviado por Admin Tools cuando se produce un intento exitoso de inicio de sesión en el panel de administración, siempre que la función correspondiente esté habilitada."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_SUBJECT="El usuario {USER} ha iniciado sesión en el área de administración de {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY="Hola,\n\nLe informamos de que el usuario {USER} acaba de iniciar sesión en el área de administración de su sitio, {SITENAME}. Información adicional:\n\nNombre de usuario: {USER}\nDirección IP: {IP} ({LOOKUP})\nCadena de agente de usuario del navegador: {UA}\n\nSi esto era esperado, no necesita hacer nada al respecto. Si sospecha de un intento de hackeo, inicie sesión en el panel de administración de su sitio de inmediato y active el modo sin conexión de emergencia de Admin Tools.\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY_HTML="<p>Hola,</p><p>Le informamos de que el usuario <strong>{USER}</strong> acaba de iniciar sesión en el área de administración de su sitio, {SITENAME}. Información adicional:</p><p>Nombre de usuario: {USER}<br />Dirección IP: {IP} (<a href=\"{LOOKUP}\">Consulta de IP</a>)<br />Cadena de agente de usuario del navegador: {UA}</p><p>Si esto era esperado, no necesita hacer nada al respecto. Si sospecha de un intento de hackeo, inicie sesión en el panel de administración de su sitio de inmediato y active el modo sin conexión de emergencia de Admin Tools.</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_IPAUTOBAN_TITLE="Admin Tools: Bloqueo automático de IP"
COM_ADMINTOOLS_MAIL_IPAUTOBAN_DESC="Enviado por Admin Tools cuando una dirección IP es bloqueada automáticamente, siempre que se hayan seleccionado una o más direcciones de correo electrónico para esta función. Esto también incluye las instrucciones del Modo de rescate; le recomendamos que "
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_SUBJECT="Notificación de bloqueo automático de IP para {IP} en {SITENAME}"
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY="Hola,\n\nLe informamos de que la dirección IP {IP} será bloqueada temporalmente para acceder a su sitio, {SITENAME}. A continuación encontrará detalles adicionales.\n\nDirección IP: {IP} (Consulta de IP: {LOOKUP})\nMotivo de la última solicitud bloqueada: {REASON}\nBloqueada hasta: {UNTIL}\n\n{RESCUEINFO}\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nEstá recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY_HTML="<p>Hola,</p><p>Le informamos de que la dirección IP {IP} será bloqueada temporalmente para acceder a su sitio, {SITENAME}. A continuación encontrará detalles adicionales.</p><p>Dirección IP: {IP} (<a href=\"{LOOKUP}\">Consulta de IP</a>)<br />Motivo de la última solicitud bloqueada: {REASON}<br />Bloqueada hasta: {UNTIL}</p><p>{RESCUEINFO}</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_TITLE="Admin Tools: Archivo crítico modificado"
COM_ADMINTOOLS_MAIL_CRITICALFILES_DESC="Enviado por Admin Tools cuando se ha modificado un \"archivo crítico\"."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_SUBJECT="Archivo crítico modificado en {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY="Hola,\n\nLe informamos de que uno o más archivos críticos han sido modificados en su sitio, {SITENAME}. La lista de archivos modificados en su sitio es la siguiente:\n\n{INFO}\n\n¿Debo preocuparme?\n======================================================================\n\nLos \"archivos críticos\", en el contexto de este mensaje de correo electrónico, son los archivos a los que más suelen dirigirse los hackers tras hackear con éxito un sitio. Estos archivos también pueden ser modificados, y con mayor frecuencia lo son, por razones legítimas. Por ejemplo, serán modificados cuando guarde la Configuración global de su sitio o cuando actualice Joomla! o una de sus plantillas.\n\nNO debe preocuparse si recibió este correo electrónico después de que usted, u otro administrador de su confianza, realizara alguno de los siguientes cambios en su sitio:\n\n* Restauró los archivos y/o el contenido de la base de datos del sitio desde una copia de seguridad\n* Modificó la Configuración global\n* Actualizó Joomla!\n* Actualizó una plantilla del sitio\n\nSi este mensaje NO fue enviado como resultado de un cambio deseable y esperado, revise su sitio de inmediato, ya que podría ser un indicio de actividad de hackeo; o una extensión u otro software de terceros haciendo algo que no era consciente y que podría tener un impacto negativo en su sitio.\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY_HTML="<p>Hola,</p><p>Le informamos de que uno o más archivos críticos han sido modificados en su sitio, {SITENAME}. La lista de archivos modificados en su sitio es la siguiente:</p>{INFO_HTML}<h3>¿Debo preocuparme?</h3><p>Los \"archivos críticos\", en el contexto de este mensaje de correo electrónico, son los archivos a los que más suelen dirigirse los hackers tras hackear con éxito un sitio. Estos archivos también pueden ser <em>y con mayor frecuencia son</em> modificados por razones legítimas. Por ejemplo, serán modificados cuando guarde la Configuración global de su sitio o cuando actualice Joomla! o una de sus plantillas.</p><p>NO debe preocuparse si recibió este correo electrónico después de que usted, u otro administrador de su confianza, realizara alguno de los siguientes cambios en su sitio:</p><ul><li>Restauró los archivos y/o el contenido de la base de datos del sitio desde una copia de seguridad</li><li>Modificó la Configuración global</li><li>Actualizó Joomla!</li><li>Actualizó una plantilla del sitio</li></ul><p>Si este mensaje NO fue enviado como resultado de un cambio deseable y esperado, revise su sitio de inmediato, ya que podría ser un indicio de actividad de hackeo; o una extensión u otro software de terceros haciendo algo que no era consciente y que podría tener un impacto negativo en su sitio.</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_TITLE="Admin Tools: Archivo monitoreado cambiado"
COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_DESC="Enviado por Admin Tools cuando uno o más archivos que eligió monitorear han sido modificados."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_SUBJECT="Archivos monitoreados cambiados en {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY="Hola,\n\nLe informamos de que uno o más archivos que solicitó a Admin Tools monitorear han sido modificados en su sitio, {SITENAME}. La lista de archivos modificados en su sitio es la siguiente:\n\n{INFO}\n\nSi este mensaje no fue enviado como resultado de un cambio deseable y esperado, revise su sitio de inmediato, ya que podría ser un indicio de actividad de hackeo.\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY_HTML="<p>Hola,</p><p>Le informamos de que uno o más archivos que solicitó a Admin Tools monitorear han sido modificados en su sitio, {SITENAME}. La lista de archivos modificados en su sitio es la siguiente:</p>{INFO_HTML}<p>Si este mensaje no fue enviado como resultado de un cambio deseable y esperado, revise su sitio de inmediato, ya que podría ser un indicio de actividad de hackeo.</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_TITLE="Admin Tools: Superusuarios añadidos"
COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_DESC="Enviado por Admin Tools cuando se ha creado un Superusuario y la función Monitorear cuentas de Superusuario está habilitada."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_SUBJECT="Se añadieron Superusuarios a {SITENAME}"
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY="Hola,\n\nLe informamos de que hemos detectado la sospechosa adición de una o más cuentas de Superusuario en su sitio, {SITENAME}. Estas nuevas cuentas de Superusuario no parecen haber sido creadas por los medios habituales, es decir, la página \"Usuarios\" de Joomla!. Por ello, han sido bloqueadas. Las nuevas cuentas de Superusuario detectadas y bloqueadas son:\n\n{INFO}\n\n¿Debo preocuparme?\n======================================================================\n\nLas cuentas de Superusuario tienen acceso completo a su sitio. Pueden modificar todo el contenido, sin ninguna restricción. También pueden instalar software que puede acceder o modificar cada aspecto de su sitio, incluidos archivos arbitrarios, contenido de la base de datos y ajustes de configuración. Conceda acceso de Superusuario solo a personas de su confianza.\n\nSi está recibiendo este correo electrónico significa que estas cuentas de Superusuario fueron creadas fuera de la página \"Usuarios\" de Joomla!. Típicamente esto significa que un hacker encontró una manera de eludir la seguridad de su sitio o su servidor e intentó crear subrepticiamente cuentas de Superusuario para sí mismo. Por este motivo estas cuentas han sido bloqueadas, es decir, no se pueden utilizar para iniciar sesión en su sitio.\n\nEs posible, sin embargo, que reciba este correo electrónico por error: si usted u otro Superusuario tenía la intención de crear estas cuentas de Superusuario y utilizó una herramienta de terceros para ello. En ese caso no se preocupe. Simplemente inicie sesión en el panel de administración de su sitio con su propia cuenta de Superusuario, vaya a la página Usuarios, edite los usuarios listados más arriba en este correo y desbloquéelos.\n\nSi usted u otro Superusuario NO tenía la intención de crear estos Superusuarios, le recomendamos auditar su sitio y su servidor en busca de cualquier otro signo de actividad anómala.\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY_HTML="<p>Hola,</p><p>Le informamos de que hemos detectado la sospechosa adición de una o más cuentas de Superusuario en su sitio, {SITENAME}. Estas nuevas cuentas de Superusuario no parecen haber sido creadas por los medios habituales, es decir, la página \"Usuarios\" de Joomla!. Por ello, han sido bloqueadas. Las nuevas cuentas de Superusuario detectadas <strong>y bloqueadas</strong> son:</p>{INFO_HTML}<h3>¿Debo preocuparme?</h3><p>Las cuentas de Superusuario tienen acceso completo a su sitio. Pueden modificar todo el contenido, sin ninguna restricción. También pueden instalar software que puede acceder o modificar cada aspecto de su sitio, incluidos archivos arbitrarios, contenido de la base de datos y ajustes de configuración. Conceda acceso de Superusuario solo a personas de su confianza.</p><p>Si está recibiendo este correo electrónico significa que estas cuentas de Superusuario fueron creadas fuera de la página \"Usuarios\" de Joomla!. Típicamente esto significa que un hacker encontró una manera de eludir la seguridad de su sitio o su servidor e intentó crear subrepticiamente cuentas de Superusuario para sí mismo. Por este motivo estas cuentas han sido bloqueadas, es decir, no se pueden utilizar para iniciar sesión en su sitio.</p><p>Es posible, sin embargo, que reciba este correo electrónico por error: si usted u otro Superusuario tenía la intención de crear estas cuentas de Superusuario y utilizó una herramienta de terceros para ello. En ese caso no se preocupe. Simplemente inicie sesión en el panel de administración de su sitio con su propia cuenta de Superusuario, vaya a la página Usuarios, edite los usuarios listados más arriba en este correo y desbloquéelos.</p><p>Si usted u otro Superusuario NO tenía la intención de crear estos Superusuarios, le recomendamos auditar su sitio y su servidor en busca de cualquier otro signo de actividad anómala.</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_RESCUEURL_TITLE="Admin Tools: URL de rescate"
COM_ADMINTOOLS_MAIL_RESCUEURL_DESC="Enviado por Admin Tools cuando un usuario del panel de administración solicita una URL de rescate para recuperar el acceso al sitio."
COM_ADMINTOOLS_EMAIL_RESCUEURL_SUBJECT="URL de rescate solicitada en {SITENAME} para {USER}"
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY="Hola,\n\nLe informamos de que el usuario {USER} ha solicitado una URL de rescate para su sitio, {SITENAME}. Si usted mismo realizó esa solicitud, haga clic en el siguiente enlace o copie y pegue la URL en su navegador. Esto le permitirá iniciar sesión en el panel de administración de su sitio donde podrá desbloquearse a sí mismo y/o cambiar la configuración de Admin Tools. La URL de rescate es:\n\n{RESCUEURL}\n\nLa información al final de este correo electrónico le indica qué hacer una vez que haya iniciado sesión en el panel de administración de su sitio.\n\nNo sé por qué estoy recibiendo este correo electrónico\n======================================================================\n\nConsulte el apartado \"¿Qué es la URL de rescate?\" más abajo. NO necesita tomar ninguna medida y NO necesita preocuparse.\n\n¿Quién solicitó la URL de rescate?\n======================================================================\n\nNombre de usuario: {USER}\nDirección IP: {IP} (Consulta de IP: {LOOKUP})\nAgente de usuario: {UA}\n\n¿Qué es la URL de rescate?\n======================================================================\n\nEn ocasiones, una configuración demasiado estricta de Admin Tools puede bloquear accidentalmente el acceso de un Superusuario al sitio. Normalmente eso requeriría renombrar el archivo del plugin de sistema de Admin Tools para desbloquearse. Esto es algo complicado y susceptible de errores.\n\nLa función URL de rescate resuelve ese problema. Al acceder a una URL especial cuando está bloqueado del sitio, se le envía este correo electrónico. La URL de este correo solo es válida para el mismo navegador y dirección IP que realizó la solicitud y solo por un tiempo limitado. Al acceder a ella llegará a una página de inicio de sesión de administrador temporalmente desbloqueada. Esto le permite acceder al panel de administración de su sitio para desbloquearse a sí mismo y/o modificar la configuración de Admin Tools.\n\nDe forma predeterminada, esta función está habilitada en todas las instalaciones de Admin Tools. Además, de forma predeterminada se muestra un mensaje sobre cómo acceder a la URL de rescate cuando alguien queda bloqueado, A MENOS QUE haya configurado un \"Mensaje personalizado\" en la página Configurar WAF de Admin Tools. Si no tiene idea de por qué recibió este mensaje, probablemente se deba a que alguien vio el mensaje predeterminado de IP bloqueada y adivinó correctamente su correo electrónico de Superusuario. Sin embargo, no se preocupe, lo que hicieron es completamente inútil ya que también necesitarían acceso a su cuenta de correo electrónico y a su contraseña de Superusuario para acceder a su sitio, es decir, ya lo habrían hackeado. Como ya está documentado, le recomendamos encarecidamente que cambie el \"Mensaje personalizado\" para que sea menos obvio que su sitio está protegido por Admin Tools. Si no desea usar la función URL de rescate —y está de acuerdo con renombrar archivos manualmente según la documentación cuando quede bloqueado— vaya a Extensiones, Plugins y edite las opciones del plugin de sistema de Admin Tools. Verá una opción para la URL de rescate. Establézcala en No para deshabilitar esta función.\n\n¿Qué hacer después de iniciar sesión?\n======================================================================\n\nSi su IP está bloqueada por Admin Tools, vaya a Componentes, Admin Tools y haga clic en el gran botón Desbloquear mi IP en la parte superior de la página.\n\nSi sigue teniendo su IP bloqueada sin hacer nada sospechoso a su juicio, la IP bloqueada es siempre la misma pero diferente a la informada por http://www.ip-adress.eu/ y https://www.whatismyip.com/, entonces su sitio podría estar detrás de una CDN o un proxy inverso. En ese caso, además de las instrucciones anteriores, vaya a Sistema, Configuración global. Establezca la opción \"Detrás de equilibrador de carga\" en Sí y guarde.\n\nSin embargo, si su dirección IP real según los dos servicios mencionados sigue siendo bloqueada, debe solucionar el motivo del bloqueo. Vaya a Componentes, Admin Tools, Web Application Firewall, Registro de excepciones de seguridad y compruebe el Motivo y la URL de destino de las entradas que tienen su dirección IP en el campo de dirección IP. Si no está seguro de lo que eso significa, presente un ticket de soporte recordando copiar la información del Registro de excepciones de seguridad. Tenga en cuenta que necesita tener una suscripción activa para recibir soporte.\n\nSi ha olvidado su parámetro secreto de URL de administrador, vaya a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, haga clic en la pestaña Funciones de protección básica y busque la opción \"Parámetro secreto de URL de administrador\". Cambie o elimine todo el texto de ese campo para restablecer o eliminar, respectivamente, esta función.\n\n¿Qué hacer si aún no puedo iniciar sesión en mi sitio?\n======================================================================\n\nHay dos casos en los que la función URL de rescate, o renombrar el archivo del plugin de sistema de Admin Tools, no le ayudará. Son los dos casos en que Admin Tools ha creado un archivo de configuración del servidor, lo que significa que está bloqueado por su servidor, no por Admin Tools.\n\nEl primero es la función de protección con contraseña del directorio de administrador. Elimine los archivos llamados .htaccess y .htpasswd del directorio de administrador de su sitio.\n\nEl otro caso es cuando ha utilizado la función Generador de .htaccess de Admin Tools. En ese caso hay un archivo .htaccess en la raíz de su sitio. Puede que desee reemplazar su contenido con el contenido predeterminado del archivo .htaccess de Joomla!.\n\nEn ambos casos tenga en cuenta que los archivos tienen nombres que comienzan con un punto. Eso los hace ocultos. Necesitará habilitar la visualización de archivos ocultos para editar/eliminar esos archivos. Si no está seguro de cómo hacerlo, consulte con su proveedor de hosting e indíquele que necesita editar/eliminar archivos ocultos. Por lo general, le indicarán una opción en el administrador de archivos del panel de control de su hosting.\n\nEn cualquier otro caso, su problema no está relacionado con Admin Tools. ¿Tiene otro plugin de seguridad en su sitio? Si es así, compruebe su configuración. Si no, consulte con su proveedor de hosting. La mayoría de las veces los proveedores de hosting tienen sus propios sistemas de seguridad del servidor que pueden bloquearle el acceso a su sitio."
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY_HTML="<p>Hola,</p><p>Le informamos de que el usuario {USER} ha solicitado una URL de rescate para su sitio, {SITENAME}. Si usted mismo realizó esa solicitud, haga clic en el siguiente enlace o copie y pegue la URL en su navegador. Esto le permitirá iniciar sesión en el panel de administración de su sitio donde podrá desbloquearse a sí mismo y/o cambiar la configuración de Admin Tools. La URL de rescate es:</p><p><a href=\"{RESCUEURL}\" rel=\"alternate\">{RESCUEURL}</a></p><p>La información al final de este correo electrónico le indica qué hacer una vez que haya iniciado sesión en el panel de administración de su sitio.</p><h3>No sé por qué estoy recibiendo este correo electrónico</h3><p>Consulte el apartado \"¿Qué es la URL de rescate?\" más abajo. <strong>NO</strong> necesita tomar ninguna medida y <strong>NO</strong> necesita preocuparse.</p><h3>¿Quién solicitó la URL de rescate?</h3><p>Nombre de usuario: {USER}<br />Dirección IP: {IP} (<a href=\"{LOOKUP}\">Consulta de IP</a>)<br />Agente de usuario: {UA}</p><h3>¿Qué es la URL de rescate?</h3><p>En ocasiones, una configuración demasiado estricta de Admin Tools puede bloquear accidentalmente el acceso de un Superusuario al sitio. Normalmente eso requeriría renombrar el archivo del plugin de sistema de Admin Tools para desbloquearse. Esto es algo complicado y susceptible de errores.</p><p>La función URL de rescate resuelve ese problema. Al acceder a una URL especial cuando está bloqueado del sitio, se le envía este correo electrónico. La URL de este correo solo es válida para el mismo navegador y dirección IP que realizó la solicitud y solo por un tiempo limitado. Al acceder a ella llegará a una página de inicio de sesión de administrador <em>temporalmente</em> desbloqueada. Esto le permite acceder al panel de administración de su sitio para desbloquearse a sí mismo y/o modificar la configuración de Admin Tools.</p><p>De forma predeterminada, esta función está habilitada en todas las instalaciones de Admin Tools. Además, de forma predeterminada se muestra un mensaje sobre cómo acceder a la URL de rescate cuando alguien queda bloqueado, A MENOS QUE haya configurado un \"Mensaje personalizado\" en la página Configurar WAF de Admin Tools. Si no tiene idea de por qué recibió este mensaje, probablemente se deba a que alguien vio el mensaje predeterminado de IP bloqueada y adivinó correctamente su correo electrónico de Superusuario. Sin embargo, no se preocupe, lo que hicieron es completamente inútil ya que también necesitarían acceso a su cuenta de correo electrónico y a su contraseña de Superusuario para acceder a su sitio, es decir, ya lo habrían hackeado. Como ya está documentado, le recomendamos encarecidamente que cambie el \"Mensaje personalizado\" para que sea menos obvio que su sitio está protegido por Admin Tools. Si no desea usar la función URL de rescate —y está de acuerdo con renombrar archivos manualmente según la documentación cuando quede bloqueado— vaya a Extensiones, Plugins y edite las opciones del plugin de sistema de Admin Tools. Verá una opción para la URL de rescate. Establézcala en No para deshabilitar esta función.</p><h3>¿Qué hacer después de iniciar sesión?</h3><p>Si su IP está bloqueada por Admin Tools, vaya a Componentes, Admin Tools y haga clic en el gran botón Desbloquear mi IP en la parte superior de la página.</p><p>Si sigue teniendo su IP bloqueada sin hacer nada sospechoso a su juicio, la IP bloqueada es siempre la misma pero diferente a la informada por <a href=\"http://www.ip-adress.eu/\">http://www.ip-adress.eu/ </a><em>y</em> <a href=\"https://www.whatismyip.com/\">https://www.whatismyip.com/</a>, entonces su sitio podría estar detrás de una CDN o un proxy inverso. En ese caso, además de las instrucciones anteriores, vaya a Sistema, Configuración global. Establezca la opción \"Detrás de equilibrador de carga\" en Sí y guarde.</p><p>Sin embargo, si su dirección IP real según los dos servicios mencionados sigue siendo bloqueada, debe solucionar el motivo del bloqueo. Vaya a Componentes, Admin Tools, Web Application Firewall, Registro de excepciones de seguridad y compruebe el Motivo y la URL de destino de las entradas que tienen su dirección IP en el campo de dirección IP. Si no está seguro de lo que eso significa, <a href=\"https://www.akeeba.com/support/admin-tools.html\" rel=\"alternate\">presente un ticket de soporte</a> recordando copiar la información del Registro de excepciones de seguridad. Tenga en cuenta que necesita tener una suscripción activa para recibir soporte.</p><p>Si ha olvidado su parámetro secreto de URL de administrador, vaya a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, haga clic en la pestaña Funciones de protección básica y busque la opción \"Parámetro secreto de URL de administrador\". Cambie o elimine todo el texto de ese campo para restablecer o eliminar, respectivamente, esta función.</p><h3>¿Qué hacer si aún no puedo iniciar sesión en mi sitio?</h3><p>Hay dos casos en los que la función URL de rescate, o renombrar el archivo del plugin de sistema de Admin Tools, no le ayudará. Son los dos casos en que Admin Tools ha creado un archivo de configuración del <em>servidor</em>, lo que significa que está bloqueado por <em>su servidor</em>, no por Admin Tools.</p><p>El primero es la función de <strong>protección con contraseña del directorio de administrador</strong>. Elimine los archivos llamados <code>.htaccess</code> y <code>.htpasswd</code> del directorio <code>administrator</code> de su sitio. </p><p>El otro caso es cuando ha utilizado la función <strong>Generador de .htaccess</strong> de Admin Tools. En ese caso hay un archivo <code>.htaccess</code> en la raíz de su sitio. Puede que desee reemplazar su contenido con el <a href=\"https://raw.githubusercontent.com/joomla/joomla-cms/staging/htaccess.txt\" rel=\"alternate\">contenido predeterminado del archivo .htaccess de Joomla!</a>.</p><p>En ambos casos tenga en cuenta que los archivos tienen nombres que comienzan con un punto. Eso los hace <em>ocultos</em>. Necesitará habilitar la visualización de archivos ocultos para editar/eliminar esos archivos. Si no está seguro de cómo hacerlo, consulte con su proveedor de hosting e indíquele que necesita editar/eliminar archivos <em>ocultos</em>. Por lo general, le indicarán una opción en el administrador de archivos del panel de control de su hosting. </p><p>En cualquier otro caso, su problema no está relacionado con Admin Tools. ¿Tiene otro plugin de seguridad en su sitio? Si es así, compruebe su configuración. Si no, consulte con su proveedor de hosting. La mayoría de las veces los proveedores de hosting tienen sus propios sistemas de seguridad del servidor que pueden bloquearle el acceso a su sitio.</p>"

COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_TITLE="Admin Tools: Solicitud bloqueada"
COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_DESC="Enviado por Admin Tools cuando su Web Application Firewall bloquea una solicitud."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_SUBJECT="Solicitud bloqueada en {SITENAME}"
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY="Hola,\n\nLe informamos de que se ha detectado una excepción de seguridad en su sitio, {SITENAME}, con los siguientes detalles:\n\nDirección IP: {IP} (Consulta de IP: {LOOKUP})\nMotivo: {REASON}\n\nSi este tipo de excepción de seguridad se repite, inicie sesión en el panel de administración de su sitio y añada esta dirección IP a la función Web Application Firewall de Admin Tools para bloquear completamente al usuario que muestra este comportamiento.\n\nAtentamente,\n\nEl equipo de {SITENAME}\n\nNota: Está recibiendo este correo electrónico automático porque es administrador en {SITENAME}. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY_HTML="<p>Hola,</p><p>Le informamos de que se ha detectado una excepción de seguridad en su sitio, {SITENAME}, con los siguientes detalles:</p><p>Dirección IP: {IP} (<a href=\"{LOOKUP}\">Consulta de IP</a>)<br />Motivo: {REASON}</p><p>Si este tipo de excepción de seguridad se repite, inicie sesión en el panel de administración de su sitio y añada esta dirección IP a la función Web Application Firewall de Admin Tools para bloquear completamente al usuario que muestra este comportamiento.</p><p>Atentamente,</p><p>El equipo de {SITENAME}</p><p><small>Está recibiendo este correo electrónico automático porque es administrador en <em>{SITENAME}</em>. No responda a este correo, se envía desde una dirección de correo electrónico no supervisada.</small></p>"

COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_TITLE="Admin Tools: Muchas solicitudes bloqueadas"
COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_DESC="Enviado por Admin Tools cuando su sitio ha bloqueado un gran número de solicitudes en un período de tiempo."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_SUBJECT="Número elevado de solicitudes bloqueadas en {SITENAME}"
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY="Hola,\n\nLe informamos de que el sitio web {SITENAME} está bloqueando actualmente un número elevado de solicitudes.\n\nSe han bloqueado un total de {NUM} solicitudes desde {DATE}. Puede que desee comprobar el motivo de las solicitudes bloqueadas y considerar si son necesarias medidas adicionales si sospecha que es el comienzo de un ataque sostenido contra su sitio."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY_HTML="<p>Hola,</p><p>Le informamos de que el sitio web {SITENAME} está bloqueando actualmente un número elevado de solicitudes</p><p>Se han bloqueado un total de {NUM} solicitudes desde {DATE}. Puede que desee comprobar el motivo de las solicitudes bloqueadas y considerar si son necesarias medidas adicionales si sospecha que es el comienzo de un ataque sostenido contra su sitio.</p>"

COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_TITLE="Admin Tools: listas de IP de rastreadores desactivadas"
COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_DESC="Enviado por Admin Tools a los Superusuarios cuando desactiva automáticamente la opción «Usar listas de IP de rastreadores» porque la caché del sitio parece no funcionar o no se pueden descargar las listas."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_SUBJECT="Se desactivaron las listas de IP de rastreadores en {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY="Hola,\n\nAdmin Tools desactivó automáticamente la opción «Usar listas de IP de rastreadores» en {SITENAME} el {DATE} porque {CAUSE}.\n\nEsto evita que su sitio se ralentice. Hasta que vuelva a activar la opción, no se aplican sus ajustes Bloquear y No bloquear para los rastreadores de buscadores y de IA.\n\nCómo solucionarlo:\n\n* Si la causa es que la caché del sitio no almacena ningún dato: vaya a Sistema, Configuración global, Sistema, y revise los ajustes de caché. Asegúrese de que la carpeta de caché tenga permisos de escritura, o de que su servidor Redis o Memcached esté en marcha y sea accesible.\n* Si la causa es que la descarga de las listas falla continuamente: compruebe que su servidor puede establecer conexiones salientes con otros sitios web (cortafuegos, ajustes de proxy, restricciones del alojamiento).\n\nUna vez solucionado el problema, vaya a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, haga clic en la pestaña Rastreadores y vuelva a activar «Usar listas de IP de rastreadores». Puede hacerlo directamente en {URL}\n\nNota: Está recibiendo este correo electrónico automático porque es Superusuario en {SITENAME}. No responda a este correo electrónico, se envía desde una dirección no supervisada."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY_HTML="<p>Hola,</p><p>Admin Tools desactivó automáticamente la opción «Usar listas de IP de rastreadores» en {SITENAME} el {DATE} porque {CAUSE}.</p><p>Esto evita que su sitio se ralentice. Hasta que vuelva a activar la opción, no se aplican sus ajustes Bloquear y No bloquear para los rastreadores de buscadores y de IA.</p><p>Cómo solucionarlo:</p><ul><li>Si la causa es que la caché del sitio no almacena ningún dato: vaya a Sistema, Configuración global, Sistema, y revise los ajustes de caché. Asegúrese de que la carpeta de caché tenga permisos de escritura, o de que su servidor Redis o Memcached esté en marcha y sea accesible.</li><li>Si la causa es que la descarga de las listas falla continuamente: compruebe que su servidor puede establecer conexiones salientes con otros sitios web (cortafuegos, ajustes de proxy, restricciones del alojamiento).</li></ul><p>Una vez solucionado el problema, vaya a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, haga clic en la pestaña Rastreadores y vuelva a activar «Usar listas de IP de rastreadores». Puede hacerlo directamente <a href=\"{URL}\">en Configurar WAF</a>.</p><p><small>Está recibiendo este correo electrónico automático porque es Superusuario en <em>{SITENAME}</em>. No responda a este correo electrónico, se envía desde una dirección no supervisada.</small></p>"

