COM_ADMINTOOLS_BADWORDS_LBL_WORD="Palabra"
COM_ADMINTOOLS_BADWORDS_LBL_WORD_DESC="La palabra prohibida que desea bloquear. No distingue entre mayúsculas y minúsculas, es decir, <code>test</code>, <code>TEST</code> y <code>TesT</code> se consideran la misma palabra."
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE="Escapar la expresión regular"
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE_DESC="El campo Palabra es una expresión regular, que se interpola en <code>#\b&lt;LO QUE HA ESCRITO&gt;\b#iu</code>. Todo lo que contenga aparte de letras, números, guiones y guiones bajos tiene un significado especial — <code>.</code> coincide con cualquier carácter, <code>*</code> repite el carácter anterior, <code>#</code> termina la expresión, y así sucesivamente. Cuando esta opción está en Sí, Admin Tools escapa esos caracteres por usted al guardar el registro, de modo que la palabra coincida literalmente consigo misma. Déjela en Sí a menos que sepa escribir expresiones regulares y quiera utilizar una deliberadamente. Por favor, consulte la documentación antes de desactivarla.<br><br><strong>Al editar un registro existente, NO active esta opción si la palabra ya fue escapada cuando se añadió.</strong> Escapar una expresión ya escapada la estropea, y entonces no coincidirá absolutamente con nada. Por eso la opción vale Sí de forma predeterminada para los registros nuevos y No cuando está editando uno existente."

