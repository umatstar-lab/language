COM_ADMINTOOLS_EMAILTEMPLATES_LBL_WHERE_HEAD="¿Dónde están las plantillas de correo electrónico?"
COM_ADMINTOOLS_EMAILTEMPLATES_LBL_WHERE_TEXT="Las plantillas de correo electrónico para extensiones principales y de terceros, como Admin Tools, son gestionadas centralmente por Joomla! en la página Sistema, Plantillas de correo. Sin embargo, las extensiones de terceros necesitan implementar su propio código para instalar y actualizar las plantillas de correo electrónico. Eso es lo que hace esta página. Si desea personalizar las plantillas de correo electrónico, haga clic en el botón de abajo para ir a la página Plantillas de correo de Joomla!."
