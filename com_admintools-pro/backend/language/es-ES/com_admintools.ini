COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN="Admin Tools ha detectado que su archivo de configuración del servidor (es decir, .htaccess, nginx.conf o web.config) ha sido modificado. Le recomendamos encarecidamente que coloque cualquier edición manual dentro de los campos <strong>Reglas personalizadas</strong>, para no perderlas si alguna vez regenera el archivo usando Admin Tools"
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_REGENERATE="Regenerar"
