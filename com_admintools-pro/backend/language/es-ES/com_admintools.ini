COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Alternativamente, haga clic en el botón de abajo para restablecer la palabra secreta al valor sugerido <code>%s</code>. En cualquier caso, deberá actualizar sus trabajos CRON con la nueva Palabra secreta."
