COM_ADMINTOOLS_TITLE_SCHEDULINGINFORMATION="Programación del escáner de cambios en archivos PHP"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON="Trabajos CRON de línea de comandos alternativos"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON_INFO="Este método solo se recomienda si el trabajo CRON de línea de comandos estándar no se completa. Este método utiliza internamente el método de programación del frontend y es un poco más lento que el método CLI nativo."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON="Trabajos CRON de línea de comandos (recomendado)"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON_INFO="Este es el método recomendado para todos los servidores que admiten trabajos CRON de línea de comandos. Este método omite la interfaz web de Joomla!, logrando la máxima velocidad de análisis del sitio."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICIMPROTANTINFO="Importante"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICINFO="Recuerde sustituir <em>%s</em> por la ruta real al ejecutable PHP <strong>CLI (interfaz de línea de comandos)</strong> de su servidor. Recuerde que debe usar el ejecutable PHP CLI; el ejecutable PHP CGI (Common Gateway Interface) <em>no</em> funcionará con nuestros scripts CRON. Si no sabe qué significa esto, consulte a su proveedor de hosting. Ellos son las únicas personas que pueden proporcionar esta información."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP="Función de programación del frontend"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_INFO="Este método utiliza una URL pública y una clave secreta para iniciar un análisis de su sitio. El análisis avanza mediante redirecciones HTTP. Tenga en cuenta que la mayoría de los trabajos «CRON» basados en URL de los proveedores de hosting, así como la mayoría de los servicios CRON basados en URL de terceros, no admiten redirecciones HTTP. Si los ejemplos con wget y curl a continuación no funcionan, utilice la URL de programación del frontend con el servicio de terceros muy económico webcron.org."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_MANYMETHODS="La función de programación del frontend se puede usar con una gran variedad de métodos. Haga clic en las pestañas a continuación para ver la descripción de cada método. Recuerde que todos ellos se explican en detalle en nuestra documentación."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_CURL="cURL"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_SCRIPT="Script PHP"
