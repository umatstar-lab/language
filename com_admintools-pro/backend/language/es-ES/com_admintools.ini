COM_ADMINTOOLS_REDIRECTION_LBL_DEST_DESC="Esta es una URL relativa en su sitio. Cuando alguien la visite, será redirigido a la URL «Le lleva aquí» indicada a continuación. No debe incluir el prefijo de protocolo http:// o https://, el nombre de dominio ni una barra inclinada inicial. Ejemplos: <code>buscar/en/google</code> o <code>456-blog/123-mi-articulo</code>. Tenga en cuenta que no puede especificar el fragmento (el signo <code>#</code> en la URL y todo lo que le sigue), ya que esta es una función del lado del cliente; su servidor NO ve el fragmento, por lo que no es posible realizar una redirección en el lado del servidor basada en el contenido del fragmento."
