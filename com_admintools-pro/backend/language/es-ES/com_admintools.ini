COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_HEAD="Modo de rescate"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_MESSAGE="Admin Tools se está ejecutando en Modo de rescate. Este es un modo de solución de problemas que le permite desbloquearse si accidentalmente se ha quedado sin acceso a su sitio. Las protecciones de Admin Tools están temporalmente deshabilitadas solo para el acceso de administrador por su cuenta y solo desde su navegador y dirección IP. Mientras vea este mensaje, Admin Tools sigue protegiendo su sitio."
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_BTN_HOWTOUNBLOCK="¿Cómo me desbloqueo?"
