COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_DESC="La vista del componente (área del componente) o el nombre del controlador que debe estar presente en la URL para que esta regla coincida. Desactive las URL SEF y verá <code>view=NombreVista</code> o <code>task=NombreVista.NombreTarea</code>, donde <var>NombreVista</var> es el nombre de vista que debe introducir aquí. Dejarlo vacío coincide con todas las vistas."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_ANY="(Todas)"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK="Tarea"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_ANY="(Todas)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_DESC="Qué tarea (un comando para un área específica del componente) aplicar a esta regla. Desactive las URL SEF y verá <code>task=NombreTarea</code> o <code>task=NombreVista.NombreTarea</code>, donde <var>NombreTarea</var> es la tarea que debe introducir aquí. Dejarlo vacío coincide con todas las vistas."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY="Parámetro de consulta"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_DESC="Qué contenido del parámetro de cadena de consulta se utilizará para hacer coincidir esta regla, p. ej. <code>id</code>. Déjelo en blanco para que la regla coincida independientemente del contenido del parámetro de consulta. Tenga en cuenta que la comparación del contenido de la consulta solo se aplica <strong>después</strong> de que Joomla! haya convertido una URL SEF a su formato no SEF. Esto significa que algunos parámetros de consulta pueden no ser visibles para usted, aunque sí lo sean para Joomla! y Admin Tools, y por tanto pueden provocar que la solicitud sea bloqueada por el cortafuegos de aplicaciones web, a menos que desactive las URL SEF."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE="Tipo de filtro del parámetro de consulta"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_ANY="(Todos)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_DESC="Elija cómo se comparará el parámetro de consulta. «RegEx» significa que el campo Parámetro de consulta contiene una <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">expresión regular de PHP</a> para comparar el contenido del parámetro de consulta. Puede negar una expresión regular anteponiéndole un signo de exclamación (<code>!</code>). «Exacto» significa que el nombre del parámetro de consulta debe coincidir exactamente con el campo Parámetro de consulta tal como se ha introducido, incluyendo mayúsculas y minúsculas. «Parcial» significa que el nombre del parámetro de consulta debe incluir el Parámetro de consulta introducido, p. ej. el parámetro «bar» coincidirá con cualquiera de los siguientes nombres de parámetro de consulta: «re<em>bar</em>», «<em>bar</em>tender» y «<em>bar</em>»."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_EXACT="Exacto"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_PARTIAL="Parcial"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_REGEX="RegEx"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT="Contenido de la consulta"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_ANY="(Cualquier contenido)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_DESC="Déjelo en blanco para que la regla coincida independientemente del contenido de la consulta. De lo contrario, proporcione una <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">expresión regular de PHP</a>; si coincide con el contenido del parámetro de consulta, la regla se aplica. Puede negar una expresión regular anteponiéndole un signo de exclamación (<code>!</code>)."

COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_COPIED="%d reglas de la lista de denegación del WAF fueron copiadas."
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_COPIED_1="La regla de la lista de denegación del WAF fue copiada."
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_DELETED="%d reglas de la lista de denegación del WAF fueron eliminadas."
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_DELETED_1="La regla de la lista de denegación del WAF fue eliminada."
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_PUBLISHED="%d reglas de la lista de denegación del WAF fueron publicadas"
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_PUBLISHED_1="La regla de la lista de denegación del WAF fue publicada"
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_UNPUBLISHED="%d reglas de la lista de denegación del WAF fueron despublicadas"
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_UNPUBLISHED_1="La regla de la lista de denegación del WAF fue despublicada"

