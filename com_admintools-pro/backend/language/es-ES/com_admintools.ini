COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_TITLE="$live_site debería estar vacío en configuration.php"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_DESC="La opción <code>$live_site</code> es una solución heredada para servidores web situados detrás de un proxy inverso, un balanceador de carga o una CDN que no envía la cabecera HTTP <code>X-Forwarded-Host</code>, o cuya cabecera ignora el servidor web por estar mal configurado. Algunas personas también la usan para establecer la URL del sitio para la CLI de Joomla. Esto también se desaconseja: la CLI de Joomla tiene una forma más segura de hacer lo mismo, su opción <code>--live-site=%s</code>."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MATCH="Se accede a su sitio con el mismo nombre de host que figura en <code>$live_site</code>, por lo que no lo necesita. Edite el archivo <code>configuration.php</code> de su sitio y vacíe la variable <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MISMATCH="Su servidor indica un nombre de host distinto del que figura en <code>$live_site</code>. Pida a su proveedor de alojamiento que configure el servidor web para que respete la cabecera HTTP <code>X-Forwarded-Host</code> enviada por el proxy inverso, el balanceador de carga o la CDN situados delante de su sitio. Después, edite el archivo <code>configuration.php</code> de su sitio y vacíe la variable <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_NOHOST="Su servidor no indica la cabecera HTTP Host. Pida a su proveedor de alojamiento que configure el servidor para que la establezca. Si hay un proxy inverso, un balanceador de carga o una CDN delante de su sitio, puede que sea necesario configurar el servidor web para que respete la cabecera HTTP <code>X-Forwarded-Host</code>. Después, edite el archivo <code>configuration.php</code> de su sitio y vacíe la variable <code>$live_site</code>: <code>public $live_site = '';</code>"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_TITLE="«Informe de errores» debería estar establecido en Nada en un sitio en producción"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_DESC="«Informe de errores» debe estar establecido en Nada en los sitios en producción. De lo contrario, los errores, advertencias y avisos de PHP pueden revelar involuntariamente información sensible o útil para los atacantes. Use Máximo solo mientras resuelve un problema, idealmente en una copia privada del sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_MSG_FAIL="«Informe de errores» no está establecido en Nada. Vaya a Sistema, Configuración global, pestaña Servidor, y establezca «Informe de errores» en Nada."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX="Establecer «Informe de errores» en Nada"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX_DONE="«Informe de errores» se ha establecido en Nada."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_TITLE="Las sesiones compartidas deben estar deshabilitadas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_DESC="Las sesiones compartidas son intrínsecamente peligrosas. Cuando un usuario inicia sesión en el frontend, también inicia sesión automáticamente en el backend. Esto permite a los atacantes lanzar ataques de relleno de credenciales (credential stuffing) y de fuerza bruta contra el frontend y, si tienen éxito, acabar con una sesión iniciada en el backend. Puede tener efectos adversos imprevistos y anula en parte otras medidas de seguridad que protegen el backend de su sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_MSG_FAIL="Las sesiones compartidas están habilitadas. Vaya a Sistema, Configuración global, pestaña Sistema, y establezca «Sesiones compartidas» en No."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX="Deshabilitar las sesiones compartidas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_CONFIRM="Al deshabilitar las sesiones compartidas cambia el nombre de la cookie de sesión. Todos los usuarios, usted incluido, cerrarán sesión en el sitio y tendrán que volver a iniciarla. ¿Desea continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_DONE="Se han deshabilitado las sesiones compartidas. Es posible que tenga que volver a iniciar sesión."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_TITLE="configuration.php no debe establecer un nombre de sesión mientras las sesiones compartidas estén deshabilitadas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_DESC="Joomla! asigna el nombre de la cookie de sesión a partir del nombre de sesión. Cuando <code>configuration.php</code> establece un nombre de sesión, el frontend y el backend de su sitio usan la misma cookie de sesión, es decir, comparten sus sesiones, aunque las sesiones compartidas estén deshabilitadas. Esto conlleva los mismos riesgos que las sesiones compartidas. Joomla! solo guarda un nombre de sesión mientras las sesiones compartidas están habilitadas. Admin Tools 7.9.4 y versiones anteriores escribían uno por error en <code>configuration.php</code> cada vez que «Comprobar directorios temporales y de registro» corregía la carpeta temporal o la carpeta de registros de su sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_MSG_FAIL="El archivo <code>configuration.php</code> de su sitio establece un nombre de sesión (<code>$session_name</code>), aunque las sesiones compartidas están deshabilitadas. El frontend y el backend de su sitio comparten sus sesiones. Elimínelo, junto con otros valores que solo se aplican mientras se carga una página y que se escribieron allí por error."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX="Eliminar el nombre de sesión"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_CONFIRM="Al eliminar el nombre de sesión cambia el nombre de la cookie de sesión del frontend. Todos los usuarios con sesión iniciada en el frontend de su sitio, posiblemente usted incluido, cerrarán sesión y tendrán que volver a iniciarla. ¿Desea continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_DONE="Se ha eliminado el nombre de sesión de configuration.php. El frontend y el backend de su sitio ya no comparten sus sesiones. Es posible que tenga que volver a iniciar sesión."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_TITLE="Funcionalidades de Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_DESC="Estas comprobaciones revisan los ajustes de las funcionalidades del núcleo de Joomla! y de Admin Tools, y proponen valores adecuados para sitios en producción."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_TITLE="El plugin de depuración debe estar deshabilitado o limitado a los Superusuarios"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_DESC="Use el plugin «Sistema - Depurador» solo mientras resuelve un problema de su sitio, idealmente en una copia privada del sitio, o durante un tiempo limitado. La información que muestra puede contener datos sensibles o información que un atacante puede usar contra su sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_MSG_FAIL="El plugin «Sistema - Depurador» está habilitado y usuarios que no son Superusuarios pueden ver la información que muestra. Deshabilite el plugin en los sitios en producción, o limite sus «Grupos permitidos» solo a Superusuarios. Estos grupos de usuarios pueden ver actualmente esa información:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX="Deshabilitar el plugin de depuración"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX_DONE="Se ha deshabilitado el plugin «Sistema - Depurador»."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_TITLE="El usuario «admin» no debe existir o debe estar deshabilitado"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_DESC="Los nombres de usuario previsibles, como <code>admin</code>, son un objetivo predilecto de los ataques de relleno de credenciales y de fuerza bruta. Que una cuenta de usuario así quede comprometida puede ser muy perjudicial para su sitio. Incluso con permisos mínimos (p. ej., solo en el grupo Registered), una cuenta así sigue siendo peligrosa si el propio Joomla! o una extensión de terceros tiene una vulnerabilidad de escalada de privilegios."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_MSG_FAIL="Existe una cuenta de usuario habilitada con el nombre de usuario <code>admin</code>. Bloquéela, cámbiele el nombre o elimínela. No basta con ponerla en un grupo de usuarios con menos privilegios."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX="Bloquear el usuario"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_CONFIRM="Se bloqueará la cuenta de usuario llamada admin y ya no podrá iniciar sesión en su sitio. ¿Desea continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_DONE="Se ha bloqueado la cuenta de usuario llamada admin."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SELF="Ha iniciado sesión con el usuario llamado admin. No puede bloquear su propia cuenta de usuario. Cámbiele el nombre o inicie sesión con otra cuenta."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SAVE="No se pudo bloquear la cuenta de usuario llamada admin."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_TITLE="Habilite el registro de usuarios solo si lo necesita"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_DESC="De forma predeterminada, Joomla! permite que se registren nuevos usuarios. Esto es posible incluso si no ha publicado un módulo de inicio de sesión ni un elemento de menú de inicio de sesión o registro, siempre que «Permitir el registro de usuarios» esté habilitado. Si no necesita que los visitantes registren una cuenta, como ocurre en la mayoría de los sitios que gestiona su propietario, debería deshabilitar esta función."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_MSG_FAIL="El registro de usuarios está habilitado. Si no necesita que los visitantes registren cuentas de usuario en su sitio, vaya a Usuarios, Opciones, pestaña Opciones de usuario, y establezca «Permitir el registro de usuarios» en No."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX="Deshabilitar el registro de usuarios"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX_DONE="Se ha deshabilitado el registro de usuarios."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_TITLE="Limite el acceso al backend a un número reducido de operadores de confianza"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_DESC="El acceso al backend rara vez es necesario, y cada usuario que lo tiene aumenta la superficie de ataque que debe proteger. Evalúe qué usuarios necesitan realmente acceder al backend y si podrían hacer su trabajo desde el frontend. Los usuarios que solo necesitan acceder al backend de vez en cuando deberían retirarse de los grupos con acceso al backend (Super Users, Administrator, Manager) y volver a añadirse solo cuando necesiten ese acceso."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_PASS="Cuentas de usuario habilitadas con acceso al backend: %d."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_FAIL="%1$d cuentas de usuario habilitadas pueden acceder al backend; es decir, más de %2$d."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_TITLE="Use la autenticación multifactor en todas las cuentas con acceso al backend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_DESC="Los usuarios con acceso al backend son un objetivo principal de los ataques de relleno de credenciales y de fuerza bruta. Una sola cuenta comprometida, aunque sea de un simple Manager, puede causar muchos daños a su sitio. Habilite siempre la autenticación multifactor en estas cuentas de usuario. Hágala obligatoria en Usuarios, Opciones, pestaña Autenticación multifactor, seleccionando todos los grupos de usuarios del backend de su sitio en «Forzar la autenticación multifactor»."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_MSG_FAIL="Estas cuentas de usuario habilitadas con acceso al backend (%d) no usan la autenticación multifactor:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_TITLE="Proteja con contraseña el directorio administrator"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_DESC="Proteger con contraseña el directorio administrator hace que los ataques de relleno de credenciales y de fuerza bruta sean menos eficaces. Aunque se filtren las credenciales de un usuario, el atacante todavía tiene que superar otro obstáculo antes de poder iniciar sesión en el backend de su sitio. Como lo aplica el propio servidor web, es muy eficiente y limita el impacto de un atacante que intente forzar el inicio de sesión en el backend."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_MSG_FAIL="El directorio administrator no está protegido con contraseña. Use la función «Proteger con contraseña el administrador» de Admin Tools para protegerlo."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_TITLE="Aplique un parámetro secreto de URL"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_DESC="Un parámetro secreto de URL hace que los ataques de relleno de credenciales y de fuerza bruta sean menos eficaces. Aunque se filtren las credenciales de un usuario, el atacante todavía tiene que superar otro obstáculo antes de poder iniciar sesión en el backend de su sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_MSG_FAIL="No ha establecido un parámetro secreto de URL para el administrador. Establézcalo en Web Application Firewall, Configurar WAF, pestaña Funcionalidades básicas, «Parámetro secreto de URL de administrador»."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_TITLE="Elimine las cuentas que «nunca han iniciado sesión»"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_DESC="Las cuentas de usuario que se crearon pero nunca han iniciado sesión son cuentas de spam que no necesita o cuentas olvidadas cuyas contraseñas pueden estar comprometidas. Elimínelas con una tarea programada de Joomla! del tipo «Admin Tools – Eliminar usuarios inactivos»."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_FAIL="Cuentas de usuario registradas hace más de %2$d días que nunca han iniciado sesión: %1$d. Cree una tarea programada del tipo «Admin Tools – Eliminar usuarios inactivos» para eliminarlas."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_TASK="Una tarea programada «Admin Tools – Eliminar usuarios inactivos» habilitada se encarga de estas cuentas."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_TITLE="Los Superusuarios no deben poder iniciar sesión en el frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_DESC="De forma predeterminada, los Superusuarios también pueden iniciar sesión en el frontend de su sitio. Esto permite a los atacantes lanzar ataques de relleno de credenciales y de fuerza bruta contra el frontend, menos protegido, para averiguar la contraseña de un Superusuario. La función «Prohibir el inicio de sesión de Superadministradores en el frontend» de Admin Tools impide que los Superusuarios inicien sesión en el frontend, lo que desbarata los planes de los atacantes."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_MSG_FAIL="Los Superusuarios pueden iniciar sesión en el frontend. Habilite «Prohibir el inicio de sesión de Superadministradores en el frontend» en Web Application Firewall, Configurar WAF, pestaña Opciones de endurecimiento."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX="Prohibir el inicio de sesión de Superusuarios en el frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX_DONE="Los Superusuarios ya no pueden iniciar sesión en el frontend."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_TITLE="Los usuarios del backend no deben poder iniciar sesión en el frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_DESC="De forma predeterminada, los usuarios del backend también pueden iniciar sesión en el frontend de su sitio. Esto permite a los atacantes lanzar ataques de relleno de credenciales y de fuerza bruta contra el frontend, menos protegido, para averiguar la contraseña de un usuario del backend. Edite los permisos de los grupos de usuarios con acceso al backend y establezca su permiso «Acceso al sitio» en Denegado, lo que desbarata los planes de los atacantes."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_MSG_FAIL="Cuentas de usuario habilitadas que pueden iniciar sesión tanto en el backend como en el frontend: %d. Vaya a Sistema, Configuración global, pestaña Permisos, y establezca «Acceso al sitio» en Denegado para estos grupos de usuarios:"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_TITLE="Archivos y carpetas"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_DESC="Estas comprobaciones buscan archivos y carpetas que no deberían dejarse en un sitio en producción."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_TITLE="Akeeba Kickstart no debería dejarse en la raíz web"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_DESC="Kickstart puede extraer cualquier archivo JPA, JPS o ZIP en cualquier lugar de su sitio. Combinado con una vulnerabilidad de subida arbitraria de archivos en el propio Joomla! o en una extensión de terceros, permite a un atacante escribir archivos arbitrarios en su sitio, ejecutar su propio código y hackear su sitio. Cambiar el nombre del archivo, o establecer una contraseña, solo es una buena medida <em>temporal</em> mientras extrae un archivo de copia de seguridad. Cuando haya terminado, Kickstart <strong>debe</strong> eliminarse de su sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_MSG_FAIL="Estos archivos de la raíz de su sitio son copias de Akeeba Kickstart. Elimínelos."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_FIX_DONE="Eliminado: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_TITLE="La carpeta installation debe eliminarse"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_DESC="Una carpeta <code>installation</code> que quede tras instalar Joomla! o restaurar una copia de seguridad puede usarse para sobrescribir su sitio. Debe eliminarse en cuanto termine."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_MSG_FAIL="Hay una carpeta <code>installation</code> en la raíz de su sitio. Elimínela."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX="Eliminar la carpeta installation"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_CONFIRM="Se eliminará la carpeta installation de la raíz de su sitio y todo su contenido. Esta acción no se puede deshacer. ¿Desea continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_DONE="Se ha eliminado la carpeta installation."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_TITLE="Deben eliminarse las carpetas residuales de instalación de extensiones"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_DESC="Joomla! usa carpetas temporales <code>install_*</code> mientras copia los archivos de una extensión a su ubicación final, y normalmente las elimina de inmediato. Si una instalación no termina correctamente, se quedan en el servidor y podrían suponer un riesgo de seguridad. Elimínelas. También puede crear una tarea programada del tipo «Admin Tools – Limpieza del directorio temporal» para hacerlo automáticamente."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_MSG_FAIL="Estas carpetas residuales de instalación se encuentran en la carpeta temporal de su sitio, <code>%s</code>:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_FIX_DONE="Eliminado: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_TITLE="Elimine los archivos innecesarios del núcleo de Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_DESC="Joomla! incluye en la raíz de su sitio algunos archivos de ejemplo e informativos que su sitio no necesita para funcionar. Solo sirven para que cualquiera sepa qué software usa su sitio. Joomla! los vuelve a colocar cada vez que lo actualiza, así que compruébelo de nuevo después de cada actualización."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_MSG_FAIL="Estos archivos innecesarios se encuentran en la raíz de su sitio:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_HTACCESS="Archivo .htaccess de ejemplo. No tiene ningún efecto a menos que se le cambie el nombre a .htaccess en un servidor web Apache o LiteSpeed. Es mejor usar el Generador de .htaccess de Admin Tools."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_LICENSE="Texto de la licencia de Joomla!. No es necesario que esté presente para usar Joomla!."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_ROBOTS="Archivo robots.txt de ejemplo. No tiene ningún efecto a menos que se le cambie el nombre a robots.txt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_WEBCONFIG="Archivo web.config de ejemplo. No tiene ningún efecto a menos que se le cambie el nombre a web.config en un servidor web Microsoft IIS."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FIX_DONE="Eliminado: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_TITLE="El archivo de registro de depuración de Admin Tools debería estar desactivado y sus archivos de registro eliminados"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_DESC="La opción «Mantener un archivo de registro de depuración» de Admin Tools solo está pensada para la resolución de problemas. Habilítela durante un tiempo muy limitado, idealmente en una copia privada de su sitio. El archivo de registro guarda los datos de las solicitudes, que pueden incluir información sensible. Cuando termine de resolver el problema, desactive la opción y elimine los archivos de registro."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_ENABLED="La opción «Mantener un archivo de registro de depuración» de Admin Tools está habilitada. Desactívela en Web Application Firewall, Configurar WAF, pestaña Registro e informes."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_FILES="Todavía hay archivos de registro de depuración de Admin Tools en la carpeta de registros de su sitio. Elimínelos."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE="Desactivar"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DELETE="Desactivar y eliminar los archivos de registro"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE="Eliminar los archivos de registro"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DONE="Se ha desactivado el archivo de registro de depuración."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE_DONE="El archivo de registro de depuración está desactivado y se han eliminado sus archivos de registro."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_TITLE="Escáner de cambios en archivos PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_DESC="Estas comprobaciones usan la información que el Escáner de cambios en archivos PHP recopila mientras analiza su sitio, o revisan sus ajustes."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_TITLE="Use el Escáner de cambios en archivos PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_DESC="Ejecute el Escáner de cambios en archivos PHP al menos una vez a la semana, y también antes y después de instalar una actualización de Joomla!, una actualización de una extensión de terceros o una nueva extensión de terceros. No solo le avisa pronto de archivos potencialmente comprometidos, sino que también permite a Admin Tools recopilar información sobre otros archivos problemáticos de su sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_NEVER="El Escáner de cambios en archivos PHP nunca ha completado un análisis de su sitio."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_OLD="El Escáner de cambios en archivos PHP completó su último análisis el %1$s, hace más de %2$d días."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_PASS="El Escáner de cambios en archivos PHP completó su último análisis el %s."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_TITLE="No debe haber archivos ajenos al núcleo en las carpetas del núcleo"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_DESC="Las carpetas del núcleo de Joomla! solo deberían contener los archivos que incluye el propio Joomla!. Cualquier otro archivo que haya en ellas lo dejó una versión antigua de Joomla!, lo colocó una extensión que no funciona bien o lo plantó un atacante. Revise estos archivos y elimine los que no deban estar ahí. Los archivos que haya revisado y marcado como seguros en el informe del análisis no se muestran."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_FAIL="El Escáner de cambios en archivos PHP ha encontrado %d archivo(s) ajeno(s) al núcleo en carpetas del núcleo de Joomla!:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_IGNORED="No se puede comprobar porque el Escáner de cambios en archivos PHP está configurado para ignorar los archivos ajenos al núcleo en carpetas del núcleo. Vaya a las Opciones de Admin Tools, pestaña Escáner de archivos, y establezca «Archivos ajenos al núcleo en carpetas del núcleo» en Señalar, o Señalar e informar como amenaza. Después, ejecute un análisis."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_TITLE="No debería haber archivos PHP en las carpetas de medios, imágenes, archivos e idiomas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_DESC="La carpeta <code>images</code> (y cualquier otra carpeta del Gestor multimedia), <code>media</code>, <code>files</code>, <code>language</code>, <code>administrator/language</code> y <code>.well-known</code> están pensadas para archivos estáticos: imágenes, documentos, CSS, JavaScript y archivos de idioma. Los archivos PHP que hay en ellas son muy a menudo puertas traseras subidas por atacantes a través de una extensión vulnerable. Revíselos todos; elimine los que no pertenezcan a una extensión que use."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_MSG_FAIL="Se han encontrado %d archivo(s) PHP donde no deberían estar:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_TITLE="Los archivos de configuración del servidor no deberían permitir ejecutar archivos como PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_DESC="Un archivo <code>.htaccess</code> puede hacer que el servidor web ejecute cualquier archivo como PHP o como script CGI, sea cual sea su nombre (p. ej. <code>AddType application/x-httpd-php .jpg</code>), o cambiar los ajustes de PHP. Un archivo <code>.user.ini</code> puede hacer que PHP ejecute otro archivo, incluso una imagen, antes o después de cada script PHP (<code>auto_prepend_file</code>). Los atacantes los usan para convertir un archivo subido de apariencia inofensiva en una puerta trasera. Los archivos que solo impiden la ejecución de scripts, p. ej. con <code>SetHandler none</code> o <code>php_flag engine off</code>, no se señalan. Tampoco los que están directamente en la carpeta raíz de su sitio y en la carpeta <code>administrator</code>, donde los proveedores de alojamiento los usan para elegir la versión de PHP. Revise todos los archivos de la lista; elimine los que no haya creado usted y que no pertenezcan a una extensión que use."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_MSG_FAIL="Se han encontrado %d archivo(s) de configuración del servidor que permiten ejecutar archivos como PHP o cambian los ajustes de PHP:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_TITLE="No cambie el nombre de archivos y carpetas para conservar versiones antiguas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_DESC="Las copias como <code>index-bak.php</code>, <code>index.php.old</code>, <code>configuration (1).php</code> o <code>cassiopeia-copy</code> son una forma habitual de conservar una versión antigua de un archivo o carpeta. Nunca se actualizan, puede que sigan siendo accesibles desde la web, pueden revelar información sensible (un archivo de configuración renombrado es un regalo para un atacante) y pueden contener código antiguo y vulnerable. Use copias de seguridad o un sistema de control de versiones en su lugar; elimine estas copias."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_MSG_FAIL="%d archivo(s) y carpeta(s) parecen copias renombradas:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_TITLE="Localice y revise los archivos grandes"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_DESC="Los archivos grandes situados fuera de las carpetas del Gestor multimedia y de la carpeta <code>files</code> suelen ser archivos de copia de seguridad, volcados de base de datos o archivos de registro olvidados. Pueden revelar información sensible si se pueden descargar, y desperdician espacio en disco. Revíselos y elimine los que no necesite. Puede cambiar el límite de tamaño, o desactivar esta comprobación, en las Opciones de Admin Tools, pestaña Escáner de archivos."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_MSG_FAIL="Se han encontrado %d archivo(s) grande(s):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_TITLE="Archivos y carpetas ocultos"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_DESC="Los archivos y carpetas cuyo nombre empieza por un punto no aparecen en la mayoría de los listados de archivos. Algunos son legítimos, como <code>.htaccess</code>, <code>.htpasswd</code>, <code>.user.ini</code> y <code>.well-known</code>, que no se señalan. Otros, como <code>.git</code>, <code>.env</code> o los ajustes de editores, revelan información sobre su sitio y no deberían estar en un sitio en producción. A los atacantes también les gusta ocultar sus archivos de esta forma."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_MSG_FAIL="Se han encontrado %d archivo(s) y carpeta(s) oculto(s):"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_TITLE="Otras herramientas"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_DESC="Estas funciones de Admin Tools pueden ayudarle a mantener su sitio en buen estado. Aquí no se comprueba nada; écheles un vistazo y decida si le resultan útiles."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_TITLE="Superusuarios temporales"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_DESC="Use los Superusuarios temporales siempre que necesite dar a alguien acceso de Superusuario durante un tiempo limitado, p. ej., a un desarrollador de extensiones que esté resolviendo un problema en su sitio. La cuenta caduca automáticamente."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_TITLE="Configuración de permisos y Reparar permisos"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_DESC="Compruebe el propietario y los permisos de los archivos y carpetas de su sitio, y aplique permisos razonables que se ajusten a su caso de uso y a la configuración de su servidor."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_TITLE="Comprobar directorios temporales y de registro"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_DESC="Ejecute de vez en cuando «Comprobar directorios temporales y de registro», desde la sección Herramientas del Panel de control, para asegurarse de que las carpetas temporal y de registros de su sitio existen y se pueden escribir."

COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_LABEL="Comprobación de salud del sitio: revisar carpetas y archivos excluidos"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_DESC="Mientras analiza, el Escáner de cambios en archivos PHP también recopila información para la Comprobación de salud del sitio: archivos PHP en carpetas de medios, copias renombradas, archivos grandes y archivos ocultos. Si se habilita, esta información también se recopila dentro de las carpetas y archivos que ha excluido del análisis; aun así, no se analizan en busca de cambios. Las exclusiones integradas de Admin Tools (carpetas temporal, de registros y de caché) se omiten siempre."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_LABEL="Comprobación de salud del sitio: informar de archivos grandes"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_DESC="Permite que la Comprobación de salud del sitio muestre los archivos grandes que el Escáner de cambios en archivos PHP ha encontrado en su sitio, para que pueda revisarlos. Los archivos de las carpetas del Gestor multimedia (p. ej., <code>images</code>) y de la carpeta <code>files</code> nunca se señalan, ya que en ellas es normal que haya archivos grandes."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_LABEL="Comprobación de salud del sitio: tamaño de archivo grande (MiB)"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_DESC="Los archivos de al menos este tamaño, en MiB, se señalan como archivos grandes en la Comprobación de salud del sitio. Surte efecto la próxima vez que se ejecute el Escáner de cambios en archivos PHP."
