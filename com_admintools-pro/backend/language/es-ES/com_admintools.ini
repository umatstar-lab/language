COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREAPPLYMANUAL="En caso de que esta herramienta automatizada no pueda crear el archivo <code>.htaccess</code> en la raíz de su sitio, elimine su <code>.htaccess</code> actual (si existe) y cree un nuevo archivo <code>.htaccess</code> con el siguiente contenido:"
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREUNAPPLY="Al hacer clic en el botón «Poner sin conexión» se volverá a aplicar el archivo <code>.htaccess</code> del modo sin conexión de emergencia en la raíz de su sitio. Al hacer clic en el botón «Poner en línea» se eliminará dicho archivo."
