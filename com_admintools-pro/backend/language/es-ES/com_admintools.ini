COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CURL="Programación CRON mediante cURL:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CUSTOMSCRIPT="Script PHP personalizado para ejecutar la programación del frontend:"
