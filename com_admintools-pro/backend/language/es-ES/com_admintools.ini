COM_ADMINTOOLS_EMAILTEMPLATES_LBL_MANAGE_HEAD="Gestión de plantillas de correo electrónico"
COM_ADMINTOOLS_EMAILTEMPLATES_BTN_UPDATE="Instalar o actualizar"
COM_ADMINTOOLS_EMAILTEMPLATES_LBL_UPDATE="Instala nuevas plantillas de correo electrónico para Admin Tools y actualiza las existentes si han cambiado. Las plantillas de correo electrónico modificadas por el usuario para Admin Tools se conservan intactas."
COM_ADMINTOOLS_EMAILTEMPLATES_BTN_RESET="Restablecer"
COM_ADMINTOOLS_EMAILTEMPLATES_LBL_RESET="Restablece las plantillas de correo electrónico. Esto elimina todas las plantillas de correo electrónico de Admin Tools, <strong>incluidas las plantillas de correo electrónico modificadas por el usuario</strong>. Luego instala todas las plantillas de correo electrónico de Admin Tools de nuevo. Utilice este botón solo si cree que ha dañado algo en su base de datos. En caso contrario, use el gestor de plantillas de correo electrónico de Joomla! para restablecer el asunto y el cuerpo de cada correo electrónico al valor predeterminado usando los botones proporcionados en la interfaz de Joomla!."

