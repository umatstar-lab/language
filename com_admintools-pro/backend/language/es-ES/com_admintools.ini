COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Si ya ha configurado métodos de alerta en la interfaz de webcron.org, le recomendamos elegir un método de alerta aquí y no marcar la opción «Solo en caso de error» para que siempre reciba una notificación cuando se ejecute el trabajo CRON de copia de seguridad."
