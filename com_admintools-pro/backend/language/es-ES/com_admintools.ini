COM_ADMINTOOLS_CONTROLPANEL_LBL_DISCLAIMER="AVISO LEGAL"
COM_ADMINTOOLS_CONTROLPANEL_LBL_DISTEXT="Los componentes relacionados con la seguridad, como Admin Tools, no están diseñados para ofrecer una protección del 100% de su sitio frente a cualquier ataque imaginable. Pueden ayudarle a mejorar la seguridad de su sitio. Aun así, debe aplicar el sentido común y buenos hábitos de seguridad para mantener un sitio saludable y seguro. Como mínimo, debería actualizar Joomla! y sus extensiones regularmente; mantener copias de seguridad regulares, probadas y externas; y estar atento a cualquier comportamiento anormal del sitio."

COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_HEAD="Ruta vacía como directorio base de su sitio."
COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_BODY="PHP informa de una ruta vacía como directorio base de su sitio. Esto se debe a un error en versiones antiguas de PHP. Informe a su proveedor de alojamiento para que actualice la versión de PHP instalada en su servidor. Si intenta usar el botón Reparar permisos, es muy posible que quede bloqueado fuera de su sitio."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD="Contraseña principal"
