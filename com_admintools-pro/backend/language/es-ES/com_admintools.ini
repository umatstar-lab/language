COM_ADMINTOOLS_ACL_PERMISSION_UTILS_DESC="Permitir acceso a las funciones de utilidad"
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_TITLE="Utilidad"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_TITLE="Seguridad"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_DESC="Permitir acceso a las funciones de seguridad. Esto incluye el asistente de Superusuarios temporales; trátelo como equivalente a conceder acceso de Superusuario."
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_TITLE="Mantenimiento"
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_DESC="Permitir acceso al mantenimiento de la base de datos y los permisos"

