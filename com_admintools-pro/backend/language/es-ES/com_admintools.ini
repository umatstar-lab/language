COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW="Nombre de la vista"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_DESC="El nombre de la vista (área del componente) o el nombre del controlador del componente que debe estar presente en la URL para que esta regla coincida. Desactive las URLs SEF y verá <code>view=NombreVista</code> o <code>task=NombreVista.NombreTarea</code>, donde <var>NombreVista</var> es el nombre de vista que debe introducir aquí. Si se deja vacío coincide con todas las vistas. Si desea que coincida con una ruta URL SEF, deje el Componente establecido en «(Todos)» e introduzca la ruta SEF <strong>CON</strong> una barra oblicua inicial pero <strong>SIN</strong> <code>index.php</code>. Por ejemplo, use <code>/foo/bar</code>. En sitios multilingüe NO debe incluir el prefijo de idioma, p.ej. <s><code>/en/example</code></s> es incorrecto, mientras que <code>/example</code> es correcto. Tenga en cuenta que esta puede ser una ruta <em>parcial</em>, es decir, <code>/foo/bar</code> coincide tanto con <code>/foo/bar/test</code> como con <code>/foo/bar.html</code>."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_ANY="(Todos)"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY="Parámetro de consulta"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_DESC="El parámetro de cadena de consulta para el que se deshabilitará el filtrado de seguridad, p.ej. <code>id</code>. Déjelo en blanco para que coincida con todos los parámetros de consulta. Tenga en cuenta que las excepciones del WAF se aplican después de que Joomla! haya convertido una URL SEF a su formato no SEF, independientemente de si tiene habilitadas las URLs SEF en su sitio."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_TYPE_ANY="(Todos)"

