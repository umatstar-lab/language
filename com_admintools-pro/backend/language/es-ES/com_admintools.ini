COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180seg; si el análisis no se completa, auméntelo. La mayoría de los sitios funcionarán con un valor de 180 o 600 aquí. Si tiene un sitio muy grande que tarda más de 5 minutos en analizarse, puede considerar usar el trabajo CRON nativo de CLI, ya que es mucho más eficiente."
