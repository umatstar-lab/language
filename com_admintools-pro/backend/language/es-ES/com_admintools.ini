COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WARNTEXT="Debido a la eficiente forma en que trabaja NginX, necesitará hacer dos cosas para que estos ajustes tengan algún efecto. En primer lugar, debe copiar el contenido del archivo de configuración de NginX para este sitio e insertarlo en el principal (si se trata de un sitio de desarrollo, podría simplemente incluir el archivo del sitio añadiendo la línea <code>include %s;</code> dentro de la definición del servidor). Después debe recargar o reiniciar su servidor."
