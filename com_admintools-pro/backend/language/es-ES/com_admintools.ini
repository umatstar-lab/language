COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BODY="El plugin «Tarea – Akeeba Backup» debe estar habilitado para que las Tareas programadas de Joomla! sepan cómo ejecutar copias de seguridad con Akeeba Backup. Por favor, vaya a Sistema, Gestionar, Plugins y habilite el plugin. Alternativamente, haga clic en el siguiente botón para editar el plugin directamente."
