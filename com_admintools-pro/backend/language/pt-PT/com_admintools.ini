COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE_HEAD="O seu servidor indica que a hora atual é <strong>%s</strong> (fuso horário <em>%s</em>)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE="<p>As horas do Horário de Ausência devem ser fornecidas no fuso horário %s. Pode alterar este fuso horário na página de Configuração Global do Joomla!. Se a hora atual ainda não parecer correta, peça ao seu servidor de alojamento que verifique a hora do servidor e as definições de fuso horário do PHP e do sistema operativo.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIP="O Horário de Ausência desativa o acesso à área de administração do seu site durante o período de tempo que especificar nos campos de e até. Isto é útil quando é o único administrador do site e pretende garantir que enquanto está a dormir / ausente ninguém consegue aceder à secção de administração do seu site. A hora deve ser fornecida no fuso horário do Servidor que configurou na Configuração Global do seu site. O fuso horário e a hora atual nesse fuso horário são apresentados na mensagem por baixo do campo Horário de Ausência Desde, para sua conveniência"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TO="Horário de Ausência até (hh:mm)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGSAVED="A configuração da Firewall de Aplicações Web foi guardada."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGNOTSAVED="Ocorreram erros ao tentar guardar a configuração da Firewall de Aplicações Web."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER="Alterar o diretório de login do administrador para"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_TIP="Por exemplo, se introduzir a palavra <code>teste</code> aqui, só conseguirá aceder à área de administração do seu site com um URL semelhante a <code>http://www.example.com/teste</code>. Se tentar aceder através de <code>http://www.example.com/administrator</code> será redirecionado para a página inicial do site. Após visitar o URL secreto com o seu browser, também poderá visitar <code>http://www.example.com/administrator</code> sem ser bloqueado, até a sua sessão expirar. Se não pretender utilizar esta funcionalidade, deixe este campo em branco. Tenha em atenção que esta funcionalidade requer que as opções <strong>URLs SEF</strong> e <strong>Utilizar reescrita de URL</strong> na página de Configuração Global do Joomla! estejam ambas definidas como Sim."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_HEAD="Esta funcionalidade é experimental e não tem suporte"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_TEXT="Em alguns sites, a <strong>Pasta de login de administrador personalizada</strong> pode ter um comportamento errático, não funcionar de todo, ou impossibilitar o início de sessão. Temos conhecimento disto e não existe solução alternativa. Por este motivo, esta funcionalidade é fornecida <strong>SEM SUPORTE</strong>. Por favor, consulte a documentação para mais informações."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_DESC="Esta mensagem será apresentada aos utilizadores quando o seu pedido for considerado suspeito de uma violação de segurança. Mantenha-a curta e cortês. Deixe em branco para utilizar a mensagem predefinida."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_HEADER="Personalização"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_LABEL="Mensagem personalizada"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM="Número de tentativas de login falhadas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM_TIP="Os utilizadores serão desativados quando ocorrer este número de tentativas de login falhadas no período de tempo configurado pelas duas opções seguintes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ="Período de logins falhados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ_TIP="Os utilizadores serão desativados quando ocorrer pelo menos o número de tentativas de login falhadas introduzido acima, num período máximo deste tempo. A unidade de medida de tempo (segundos, minutos, horas, dias) é especificada na opção seguinte."
