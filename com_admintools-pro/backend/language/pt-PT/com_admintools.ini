COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICINFO="Lembre-se de substituir <em>%s</em> pelo caminho real para o executável PHP <strong>CLI (Interface de Linha de Comandos)</strong> do seu alojamento. Tenha em atenção que deve utilizar o executável PHP CLI; o executável PHP CGI (Common Gateway Interface) <em>não</em> funcionará com os nossos scripts CRON. Em caso de dúvida, consulte o seu alojamento. São as únicas pessoas que podem fornecer esta informação."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP="Funcionalidade de Agendamento Frontend"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_INFO="Este método utiliza um URL público e uma chave secreta para iniciar uma análise ao seu site. A análise progride por meio de redirecionamentos HTTP. Note que a maioria dos serviços de 'CRON' baseados em URL dos alojamentos, bem como a maioria dos serviços de CRON baseados em URL de terceiros, não suporta redirecionamentos HTTP. Se os exemplos com wget e curl abaixo não funcionarem, utilize o URL de agendamento frontend com o serviço de terceiros webcron.org, de custo muito reduzido."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_MANYMETHODS="A funcionalidade de agendamento frontend pode ser utilizada com uma grande variedade de métodos. Clique nos separadores abaixo para ver a descrição de cada método. Lembre-se que todos eles são explicados em detalhe na nossa documentação."
