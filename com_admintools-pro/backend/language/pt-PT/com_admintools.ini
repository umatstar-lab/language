COM_ADMINTOOLS_CONTROLPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Importante:</strong> Se o Joomla já determinou que existem atualizações para o Admin Tools antes de ter introduzido o seu ID de Download, <em>pode não ser capaz de as descarregar</em> mesmo após ter introduzido o ID de Download, devido a vários erros antigos do Joomla. Neste caso, descarregue o ficheiro ZIP da versão mais recente do nosso site. De seguida, aceda ao menu Sistema do Joomla, encontre o painel de Instalar, clique em Extensões, clique no separador Carregar Ficheiro de Pacote e instale o ficheiro ZIP que descarregou <strong>duas vezes</strong> seguidas, <strong>sem</strong> desinstalar o Admin Tools antes ou entre as instalações. A dupla instalação é necessária para resolver outro erro antigo do Joomla que por vezes impede a cópia de todos os ficheiros atualizados ao instalar uma atualização de extensão."

