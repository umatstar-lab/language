COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION_API="API"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_VERB="Verbo HTTP"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VERB_DESC="Qual o verbo HTTP a aplicar nesta regra (GET, POST, etc.). O frontend e o backend do seu site utilizam tipicamente GET para apresentar páginas ou obter conteúdo através de pedidos JavaScript, e POST para submeter formulários ou enviar conteúdo para o site. A aplicação API utiliza tipicamente pedidos GET, POST, DELETE e PATCH."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VERB_ALL="(Qualquer)"
