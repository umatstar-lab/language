COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_DESC="Ligação para um serviço de consulta de IP. {ip} será substituído pelo endereço IP. Predefinição: whatismyipaddress.com/ip/{ip}"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_LABEL="Serviço de Consulta de IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS="Nunca bloquear estes IPs"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS_TIP="Introduza os endereços IP que nunca devem ser bloqueados automaticamente, independentemente das suas definições de bloqueio automático. Pode utilizar endereços IPv4 e IPv6 individuais (ex. <em>127.0.0.1</em> e <em>::1</em>), intervalos IPv4 (ex. <em>127.0.0.1-127.0.0.10</em>), notação de intervalo IPv4 implícita (<em>127.0.0.</em> para o bloco completo 127.0.0.1 a 127.0.0.255) e notação de bloco CIDR IPv4/IPv6 (ex. <em>127.0.0.0/8</em> para IPv4 ou <em>2001:db8::/32</em> para IPv6)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_ACTIVEFILTERING="Filtragem de Pedidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASIC="Segurança Básica"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASICSETTINGS="Funcionalidades Básicas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_EXCEPTIONS="Exceções"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_CRAWLERS="Rastreadores"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_DESC="O Admin Tools transfere as listas de endereços IP que os motores de pesquisa e as empresas de IA publicam para os seus rastreadores e utiliza-as para os rastreadores que escolher abaixo. Com Bloquear, todos os pedidos do rastreador são bloqueados. Com Não bloquear, o rastreador é tratado como em «Nunca bloquear estes IPs»: um pedido malicioso seu continua a ser bloqueado, mas não é registado, não é enviado nenhum e-mail sobre ele e o endereço IP nunca é bloqueado automaticamente. Só são transferidos os rastreadores que definir como Bloquear ou Não bloquear. Se não for possível transferir as listas ou se a cache do site não funcionar, o Admin Tools desativa esta opção por si e envia um e-mail aos Super Utilizadores."
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_LABEL="Utilizar listas de IPs de rastreadores"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_ALLOW="Não bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_IGNORE="Ignorar"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_FINGERPRINTING="Camuflagem"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_JHARDENING="Opções de Reforço de Segurança"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_LOGGINGANDREPORTING="Registo e Relatórios"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD="404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE="Ativar 404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE_TIP="Clique para ativar ou desativar a funcionalidade 404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_TIP="Esta funcionalidade trata os erros 404 Não Encontrado como motivo para bloquear um pedido quando estes ocorrem em URLs conhecidos por serem utilizados por atacantes para procurar vulnerabilidades no seu site. Por exemplo, quando um atacante tenta aceder à página de login do WordPress mesmo que tenha um site Joomla!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW="Parâmetro Secreto de URL do Administrador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP="Por exemplo, se introduzir 'teste', só conseguirá aceder à sua área de administração digitando o URL <code>http://www.example.com/administrator/index.php?teste</code>. <strong>ATENÇÃO! DEVE COMEÇAR COM UMA LETRA, NÃO COM UM NÚMERO</strong>. Para melhor compatibilidade entre servidores, utilize apenas caracteres ASCII em minúsculas e números (a-z, 0-9)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP_LONG="O Parâmetro Secreto de URL do Administrador só pode ser composto por letras latinas minúsculas e maiúsculas sem acentos ou diacríticos (a-z e A-Z), números de 0-9, hífens e sublinhados. O primeiro carácter não pode ser um hífen ou sublinhado. Deve ter entre 4 e 64 caracteres."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_INVALID="O Parâmetro Secreto de URL do Administrador é inválido. Lembre-se que só pode ser composto por letras latinas minúsculas e maiúsculas sem acentos ou diacríticos (a-z e A-Z), números de 0-9, hífens e sublinhados. O primeiro carácter não pode ser um hífen ou sublinhado. Deve ter entre 4 e 64 caracteres."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION="Ação em caso de parâmetro secreto de URL do administrador inválido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_TIP="O que fazer quando o parâmetro secreto de URL do administrador está em falta ou é inválido. Redirecionamento: redireciona o browser para a raiz do site (predefinição). Bloquear: bloqueia o pedido com a mensagem de pedido bloqueado do Admin Tools e um estado HTTP 403. Note que isto não ajuda a aliviar a carga elevada do servidor em ataques de força bruta de palavra-passe sustentados tanto quanto se poderia pensar, uma vez que os bots de força bruta de palavra-passe normalmente não seguem redirecionamentos; utilize a funcionalidade de palavra-passe de administrador para gerir melhor a carga elevada do servidor neste caso."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_REDIRECT="Redirecionamento"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE="Cookie do browser para substituição do parâmetro secreto de URL do administrador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_TIP="Deverá ser definido um cookie no browser após um login de administrador bem-sucedido que permita ao browser aceder à página de login do administrador a qualquer momento nos próximos 30 dias sem fornecer o parâmetro secreto de URL do administrador? O cookie é invalidado se utilizar a funcionalidade de Terminar Sessão do Joomla! ou alterar a palavra-passe do utilizador. Por favor, consulte a documentação para mais informações. Em caso de dúvida, defina como \"Ativado, notificar quando utilizado\"."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_OFF="Desativado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON="Ativado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_WARN="Ativado, notificar quando utilizado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_MAXWARN="Ativado, lembrar para utilizar o URL completo"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE="Permitir templates do site"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE_TIP="Ativar esta opção substitui parcialmente a opção anterior (o bloqueio de template=foo no URL). Se o parâmetro de consulta de URL template= especificar o nome de um template que existe no seu diretório de templates, então será permitido sem causar o bloqueio do pedido. Isto só é necessário em sites que utilizam mais do que um template em simultâneo."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM="Filtragem anti-spam baseada na lista de Palavras Proibidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM_TIP="Quando ativado, todos os pedidos que contenham pelo menos uma palavra da lista de Palavras Proibidas serão bloqueados."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY="Chave HTTP:BL do <a href='http://www.projecthoneypot.org/httpbl_configure.php' target='_blank'>Project Honeypot</a>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY_TIP="Introduza a sua chave HTTP:BL. Pode registar-se no Project Honeypot e obter a sua chave em <a href='http://www.projecthoneypot.org/httpbl_configure.php'>http://www.projecthoneypot.org/httpbl_configure.php</a>."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS="Domínios de e-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS_TIP="Introduza um domínio por entrada, sem protocolo, ex. <code>example.com</code> mas NÃO <s><code>https://www.example.com</code></s>. O Admin Tools permitirá ou bloqueará o registo de acordo com o campo acima. Deixe em branco para desativar qualquer restrição durante o registo de utilizadores."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES="Bloquear nomes de utilizador comuns"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_TIP="Quando ativado, o Admin Tools bloqueará a criação de novas contas de utilizador cujo nome de utilizador esteja na lista de bloqueio predefinida (ex. admin, ceo, manager, etc.)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW="Nomes de utilizador explicitamente permitidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW_TIP="Lista de nomes de utilizador que são explicitamente permitidos, um por linha."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID="Nomes de utilizador explicitamente proibidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID_TIP="Lista de nomes de utilizador que são explicitamente proibidos, um por linha."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN="Bloqueio de IP imediato por tentativa de login com nome de utilizador proibido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN_TIP="Se alguém tentar fazer login no seu site utilizando um dos nomes de utilizador comuns integrados no Admin Tools ou um dos Nomes de Utilizador Explicitamente Proibidos descritos abaixo, mas não existir nenhum utilizador com esse nome de utilizador no seu site, o pedido é bloqueado. Além disso, se o Bloqueio de IP de Reincidentes estiver ativado no separador de Bloqueio Automático, o endereço IP do atacante é imediatamente bloqueado, mesmo que não tenha atingido o número de ataques especificado na opção Bloquear IP Após Este Número de Pedidos Bloqueados. O raciocínio é que tentar fazer login no site com um nome de utilizador proibido / comum é muito provavelmente um ataque de credential stuffing que precisa de ser defendido o mais rapidamente possível."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION="Ação para monitorização de configuração"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_EMAIL="E-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_TIP="O que pretende fazer quando a monitorização de configuração global ou de componente está ativada e é detetada uma alteração na configuração. 'E-mail' enviará simplesmente um e-mail de aviso para os endereços de e-mail que configurou abaixo. As alterações na configuração serão processadas. 'Bloquear' tratará estas alterações como motivo para bloquear o pedido. As alterações na configuração NÃO serão processadas e não será enviado nenhum e-mail."

