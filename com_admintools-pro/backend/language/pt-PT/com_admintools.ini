COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW="Nome da Vista"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_DESC="O nome da vista (área do componente) ou do controlador que deve estar presente no URL para que esta regra corresponda. Desative os URLs SEF e verá <code>view=NomeDaVista</code> ou <code>task=NomeDaVista.NomeDaTarefa</code>, em que <var>NomeDaVista</var> é o Nome da Vista que deve introduzir aqui. Deixar em branco corresponde a todas as vistas. Se pretender corresponder a um caminho de URL SEF, deixe o Componente definido como \"(Todos)\" e introduza o caminho SEF <strong>COM</strong> uma barra inicial mas <strong>SEM</strong> <code>index.php</code>. Por exemplo, utilize <code>/foo/bar</code>. Em sites multilingues, NÃO deve incluir o prefixo de idioma, por exemplo <s><code>/en/example</code></s> está errado, enquanto <code>/example</code> está correto. Note que este pode ser um caminho <em>parcial</em>, ou seja, <code>/foo/bar</code> corresponde tanto a <code>/foo/bar/test</code> como a <code>/foo/bar.html</code>."
