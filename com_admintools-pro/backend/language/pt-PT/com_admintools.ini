COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE_DESC="Esta é a URL relativa ou absoluta para onde o visitante será encaminhado. Esta URL deve ser válida mesmo que desative a funcionalidade de redirecionamento. Pode ser uma URL do seu próprio site ou de um site diferente. Exemplos: <code>https://www.example.com</code> ou <code>blog/123-my-article</code>."
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS="Manter Parâmetros de URL"
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS_DESC="Escolha o que fazer com os parâmetros de cadeia de consulta na URL visitada. \"Nenhum\" ignora-os e mantém os parâmetros de cadeia de consulta da URL 'Leva-o para', se existirem. \"Substituir todos\" combina-os com os parâmetros de cadeia de consulta da URL 'Leva-o para', sobrepondo-se a estes mesmo que já estejam definidos. \"Adicionar novos\" adicionará quaisquer parâmetros de cadeia de consulta definidos na URL visitada <em>desde que</em> NÃO estejam já definidos na URL 'Leva-o para'."

