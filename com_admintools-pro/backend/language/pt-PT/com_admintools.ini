COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_TITLE="Admin Tools: E-mail de resolução de problemas"
COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_DESC="Enviado sempre que efetua uma alteração na configuração do Admin Tools que possa impedir o seu acesso ao site."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_SUBJECT="Informações de resolução de problemas do Admin Tools"
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY="Olá {USER},\n\nAcabou de {ACTION} utilizando o componente Admin Tools no seu site \"{SITENAME}\". Trata-se geralmente de um processo seguro. Em alguns casos, um mal-entendido, um descuido, ou o facto de um browser ou servidor alterar as suas definições pode resultar no funcionamento incorreto ou na inacessibilidade do site. Isto aplica-se tanto ao próprio Joomla! como às suas várias extensões de terceiros. Nesse improvável cenário, consulte os seguintes URLs para obter instruções de resolução de problemas:\n\n{TROUBLESHOOTING_URLS}\n\nSe não conseguir encontrar uma solução por si próprio e tiver uma subscrição ativa do Admin Tools, abra um ticket de suporte no nosso site, https://www.akeeba.com, e indique-nos o que fez antes de o problema ocorrer, qual é o problema e que passos de resolução já tentou.\n\nQuem enviou este e-mail?\n======================================================================\n\nEste e-mail é enviado automaticamente pelo Admin Tools em execução no seu site para o endereço de e-mail registado no seu perfil de utilizador Joomla!, sempre que efetua uma ação administrativa que possa acidentalmente impedir o seu acesso ao site. Não é enviado a nenhum outro utilizador do site.\n\nSe já não pretende receber estes e-mails, inicie sessão na área de administração do seu site e vá a Componentes, Admin Tools, Web Application Firewall, Configurar WAF e clique no separador Personalização. Localize a opção \"Enviar e-mail de resolução de problemas em funções administrativas\" e defina-a como Não."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY_HTML="<p>Olá {USER},</p><p>Acabou de {ACTION} utilizando o componente Admin Tools no seu site \"{SITENAME}\". Trata-se geralmente de um processo seguro. Em alguns casos, um mal-entendido, um descuido, ou o facto de um browser ou servidor alterar as suas definições pode resultar no funcionamento incorreto ou na inacessibilidade do site. Isto aplica-se tanto ao próprio Joomla! como às suas várias extensões de terceiros. Nesse improvável cenário, consulte os seguintes URLs para obter instruções de resolução de problemas:</p>{TROUBLESHOOTING_URLS_HTML}<p>Se não conseguir encontrar uma solução por si próprio e tiver uma subscrição ativa do Admin Tools, abra um ticket de suporte no nosso site, https://www.akeeba.com, e indique-nos o que fez antes de o problema ocorrer, qual é o problema e que passos de resolução já tentou.</p><h3>Quem enviou este e-mail?</h3><p>Este e-mail é enviado automaticamente pelo Admin Tools em execução no seu site para o endereço de e-mail registado no seu perfil de utilizador Joomla!, sempre que efetua uma ação administrativa que possa acidentalmente impedir o seu acesso ao site. Não é enviado a nenhum outro utilizador do site.</p><p>Se já não pretende receber estes e-mails, inicie sessão na área de administração do seu site e vá a Componentes, Admin Tools, Web Application Firewall, Configurar WAF e clique no separador Personalização. Localize a opção \"Enviar e-mail de resolução de problemas em funções administrativas\" e defina-a como Não.</p>"

COM_ADMINTOOLS_MAIL_CONFIGMONITOR_TITLE="Admin Tools: Monitorização de Configuração"
COM_ADMINTOOLS_MAIL_CONFIGMONITOR_DESC="Enviado pelo Admin Tools sempre que efetua uma alteração na sua Configuração Global ou nas opções de configuração de um componente, quando as opções \"Monitorizar Configuração Global\" e/ou \"Monitorizar configuração do componente\" estão ativadas na Web Application Firewall."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_SUBJECT="Opções de configuração para {AREA} modificadas em {SITENAME}"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY="Olá,\n\nGostaríamos de o notificar de que as opções de configuração para {AREA} no seu site, {SITENAME}, foram modificadas pelo utilizador {USER}. As definições alteradas são apresentadas abaixo:\n\n{INFO}\n\nSeguem-se mais detalhes sobre a origem desta alteração:\n\n\n\nEndereço IP: {IP} (Pesquisa de IP: {LOOKUP})\nUser Agent: {UA}\n\nSe esta alteração não foi efetuada por si ou por um utilizador administrador em quem confia, reveja o seu site imediatamente, pois poderá ser indicação de atividade maliciosa.\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que as opções de configuração para {AREA} no seu site, {SITENAME}, foram modificadas pelo utilizador {USER}. As definições alteradas são apresentadas abaixo:</p>{INFO_HTML}<p>Seguem-se mais detalhes sobre a origem desta alteração:</p><ul><li>Endereço IP: {IP} (<a href=\"{LOOKUP}\">Pesquisa de IP</a>)</li><li>User Agent: {UA}</li></ul><p>Se esta alteração não foi efetuada por si ou por um utilizador administrador em quem confia, reveja o seu site imediatamente, pois poderá ser indicação de atividade maliciosa.</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_CHANGED="Opções alteradas"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_ADDED="Opções adicionadas"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REMOVED="Opções removidas"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REDACTED="(alterado; valor ocultado por segurança)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPAQUE="(alterado)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_EMPTY="(vazio)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPTION="Opção"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OLD="Valor anterior"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_NEW="Novo valor"
; Diff layout strings. Override these to restyle the changed-options table in the notification email.
; Plain text: %1$s = option label, %2$s = previous value, %3$s = new value (as applicable).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_SECTION="%s:"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_CHANGED="  %1$s: %2$s → %3$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_ADDED="  %1$s: %2$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_REMOVED="  %1$s: %2$s"
; Opaque line: the value is not shown (sensitive, compound, or a custom field type). %1$s = label, %2$s = marker.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_OPAQUE="  %1$s: %2$s"
; HTML: %s in the section is the section title; in a row %1$s = label, %2$s = previous value, %3$s = new value;
; in the table %1$s = Option header, %2$s = Previous value header, %3$s = New value header, %4$s = the rows.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_SECTION="<tr><th colspan=\"3\" style=\"text-align:left;background:#f0f0f0;\">%s</th></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW="<tr><td>%1$s</td><td>%2$s</td><td>%3$s</td></tr>"
; Opaque HTML row: %1$s = label, %2$s = marker (spans the previous/new value columns).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW_OPAQUE="<tr><td>%1$s</td><td colspan=\"2\">%2$s</td></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_TABLE="<table border=\"1\" cellpadding=\"4\" cellspacing=\"0\"><thead><tr><th>%1$s</th><th>%2$s</th><th>%3$s</th></tr></thead><tbody>%4$s</tbody></table>"

COM_ADMINTOOLS_MAIL_USERREACTIVATE_TITLE="Admin Tools: Reativação de utilizador"
COM_ADMINTOOLS_MAIL_USERREACTIVATE_DESC="Enviado pelo Admin Tools sempre que uma conta de utilizador é temporariamente desativada devido a demasiadas tentativas de início de sessão falhadas."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_SUBJECT="Conta de utilizador temporariamente bloqueada em {SITENAME}"
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY="Olá,\n\nDetetámos várias tentativas falhadas de início de sessão com a conta de utilizador {USER} no nosso site {SITENAME}. Como resultado, o nosso sistema bloqueou automaticamente a conta de utilizador em {DATE}.\n\nSe acredita que está a receber esta mensagem por engano, ou seja, foi você que tentou acidentalmente iniciar sessão com a palavra-passe errada, clique na seguinte ligação para remover o bloqueio temporário da sua conta de utilizador:\n{ACTIVATE}\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque tem uma conta de utilizador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY_HTML="<p>Olá,</p><p>Detetámos várias tentativas falhadas de início de sessão com a conta de utilizador {USER} no nosso site {SITENAME}. Como resultado, o nosso sistema bloqueou automaticamente a conta de utilizador em {DATE}.</p><p>Se acredita que está a receber esta mensagem por engano, ou seja, foi você que tentou acidentalmente iniciar sessão com a palavra-passe errada, clique na seguinte ligação para remover o bloqueio temporário da sua conta de utilizador:</p><p><a href=\"{ACTIVATE}\">{ACTIVATE}</a></p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Nota: Está a receber este e-mail automático porque tem uma conta de utilizador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_TITLE="Admin Tools: Falha no início de sessão do administrador"
COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_DESC="Enviado pelo Admin Tools quando ocorre uma tentativa falhada de início de sessão no backend, desde que a funcionalidade correspondente esteja ativada."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_SUBJECT="Falha no início de sessão do administrador para o utilizador {USER} em {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY="Olá,\n\nGostaríamos de o notificar de que o utilizador {USER} não iniciou sessão com sucesso na área de administração do seu site, {SITENAME}. Informações adicionais:\n\nNome de Utilizador: {USER}\nEndereço IP: {IP} ({LOOKUP})\nString do User Agent do Browser: {UA}\n\nSe tal era esperado, não necessita de tomar qualquer ação. Se suspeitar de uma tentativa de intrusão, inicie sessão no backend do seu site imediatamente e ative o modo de Emergência Offline do Admin Tools.\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que o utilizador <strong>{USER}</strong> <strong>não</strong> iniciou sessão com sucesso na área de administração do seu site, {SITENAME}. Informações adicionais:</p><p>Nome de Utilizador: {USER}<br />Endereço IP: {IP} (<a href=\"{LOOKUP}\">Pesquisa de IP</a>)<br />String do User Agent do Browser: {UA}</p><p>Se tal era esperado, não necessita de tomar qualquer ação. Se suspeitar de uma tentativa de intrusão, inicie sessão no backend do seu site imediatamente e ative o modo de Emergência Offline do Admin Tools.</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_TITLE="Admin Tools: Início de sessão do administrador bem-sucedido"
COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_DESC="Enviado pelo Admin Tools quando ocorre uma tentativa bem-sucedida de início de sessão no backend, desde que a funcionalidade correspondente esteja ativada."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_SUBJECT="O utilizador {USER} iniciou sessão na área de administração de {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY="Olá,\n\nGostaríamos de o notificar de que o utilizador {USER} acabou de iniciar sessão na área de administração do seu site, {SITENAME}. Informações adicionais:\n\nNome de Utilizador: {USER}\nEndereço IP: {IP} ({LOOKUP})\nString do User Agent do Browser: {UA}\n\nSe tal era esperado, não necessita de tomar qualquer ação. Se suspeitar de uma tentativa de intrusão, inicie sessão no backend do seu site imediatamente e ative o modo de Emergência Offline do Admin Tools.\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que o utilizador <strong>{USER}</strong> acabou de iniciar sessão na área de administração do seu site, {SITENAME}. Informações adicionais:</p><p>Nome de Utilizador: {USER}<br />Endereço IP: {IP} (<a href=\"{LOOKUP}\">Pesquisa de IP</a>)<br />String do User Agent do Browser: {UA}</p><p>Se tal era esperado, não necessita de tomar qualquer ação. Se suspeitar de uma tentativa de intrusão, inicie sessão no backend do seu site imediatamente e ative o modo de Emergência Offline do Admin Tools.</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_IPAUTOBAN_TITLE="Admin Tools: Bloqueio Automático de IP"
COM_ADMINTOOLS_MAIL_IPAUTOBAN_DESC="Enviado pelo Admin Tools quando um endereço IP é automaticamente bloqueado, desde que tenham sido selecionados um ou mais endereços de e-mail para esta funcionalidade. Isto inclui também as instruções do Modo de Recuperação; recomendamos que "
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_SUBJECT="Notificação de bloqueio automático de IP para {IP} em {SITENAME}"
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY="Olá,\n\nGostaríamos de o notificar de que o endereço IP {IP} será temporariamente bloqueado no acesso ao seu site, {SITENAME}. Encontre abaixo informações adicionais.\n\nEndereço IP: {IP} (Pesquisa de IP: {LOOKUP})\nMotivo do Último Pedido Bloqueado: {REASON}\nBloqueado até: {UNTIL}\n\n{RESCUEINFO}\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nEstá a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que o endereço IP {IP} será temporariamente bloqueado no acesso ao seu site, {SITENAME}. Encontre abaixo informações adicionais.</p><p>Endereço IP: {IP} (<a href=\"{LOOKUP}\">Pesquisa de IP</a>)<br />Motivo do Último Pedido Bloqueado: {REASON}<br />Bloqueado até: {UNTIL}</p><p>{RESCUEINFO}</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_TITLE="Admin Tools: Ficheiro crítico modificado"
COM_ADMINTOOLS_MAIL_CRITICALFILES_DESC="Enviado pelo Admin Tools quando um \"ficheiro crítico\" foi modificado."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_SUBJECT="Ficheiro crítico modificado em {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY="Olá,\n\nGostaríamos de o notificar de que um ou mais ficheiros críticos foram modificados no seu site, {SITENAME}. A lista de ficheiros modificados no seu site é a seguinte:\n\n{INFO}\n\nDevo preocupar-me?\n======================================================================\n\n\"Ficheiros críticos\", no contexto desta mensagem de e-mail, são os ficheiros mais frequentemente visados por hackers após uma intrusão bem-sucedida num site. Estes ficheiros também podem ser e, na maioria das vezes, são modificados por razões legítimas. Por exemplo, serão modificados quando guardar a Configuração Global do seu site ou quando atualizar o Joomla! ou um dos seus templates.\n\nNÃO deve preocupar-se se recebeu este e-mail depois de você, ou outro administrador em quem confia, ter efetuado qualquer uma das seguintes alterações no seu site:\n\n* Restauração dos ficheiros e/ou conteúdo da base de dados a partir de uma cópia de segurança\n* Modificação da Configuração Global\n* Atualização do Joomla!\n* Atualização de um template do site\n\nSe esta mensagem NÃO lhe foi enviada como resultado de uma alteração desejada e esperada, reveja o seu site imediatamente, pois pode ser indicação de atividade maliciosa; ou de uma extensão ou outro software de terceiros que está a fazer algo que desconhecia e que pode ter um impacto negativo no seu site.\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que um ou mais ficheiros críticos foram modificados no seu site, {SITENAME}. A lista de ficheiros modificados no seu site é a seguinte:</p>{INFO_HTML}<h3>Devo preocupar-me?</h3><p>\"Ficheiros críticos\", no contexto desta mensagem de e-mail, são os ficheiros mais frequentemente visados por hackers após uma intrusão bem-sucedida num site. Estes ficheiros também podem ser <em>e, na maioria das vezes, são</em> modificados por razões legítimas. Por exemplo, serão modificados quando guardar a Configuração Global do seu site ou quando atualizar o Joomla! ou um dos seus templates.</p><p>NÃO deve preocupar-se se recebeu este e-mail depois de você, ou outro administrador em quem confia, ter efetuado qualquer uma das seguintes alterações no seu site:</p><ul><li>Restauração dos ficheiros e/ou conteúdo da base de dados a partir de uma cópia de segurança</li><li>Modificação da Configuração Global</li><li>Atualização do Joomla!</li><li>Atualização de um template do site</li></ul><p>Se esta mensagem NÃO lhe foi enviada como resultado de uma alteração desejada e esperada, reveja o seu site imediatamente, pois pode ser indicação de atividade maliciosa; ou de uma extensão ou outro software de terceiros que está a fazer algo que desconhecia e que pode ter um impacto negativo no seu site.</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_TITLE="Admin Tools: Ficheiro monitorizado alterado"
COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_DESC="Enviado pelo Admin Tools quando um ou mais ficheiros que escolheu monitorizar foram modificados."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_SUBJECT="Ficheiros monitorizados alterados em {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY="Olá,\n\nGostaríamos de o notificar de que um ou mais ficheiros que pediu ao Admin Tools para monitorizar foram modificados no seu site, {SITENAME}. A lista de ficheiros modificados no seu site é a seguinte:\n\n{INFO}\n\nSe esta mensagem não lhe foi enviada como resultado de uma alteração desejada e esperada, reveja o seu site imediatamente, pois pode ser indicação de atividade maliciosa.\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que um ou mais ficheiros que pediu ao Admin Tools para monitorizar foram modificados no seu site, {SITENAME}. A lista de ficheiros modificados no seu site é a seguinte:</p>{INFO_HTML}<p>Se esta mensagem não lhe foi enviada como resultado de uma alteração desejada e esperada, reveja o seu site imediatamente, pois pode ser indicação de atividade maliciosa.</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_TITLE="Admin Tools: Super Utilizadores adicionados"
COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_DESC="Enviado pelo Admin Tools quando um Super Utilizador é criado e a funcionalidade Monitorizar contas de Super Utilizador está ativada."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_SUBJECT="Super Utilizadores foram adicionados a {SITENAME}"
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY="Olá,\n\nGostaríamos de o notificar de que detetámos a adição suspeita de uma ou mais contas de Super Utilizador ao seu site, {SITENAME}. Estas novas contas de Super Utilizador não parecem ter sido criadas pelos meios habituais, ou seja, através da página \"Utilizadores\" do Joomla!. Por isso, foram bloqueadas. As novas contas de Super Utilizador detetadas e bloqueadas são:\n\n{INFO}\n\nDevo preocupar-me?\n======================================================================\n\nAs contas de Super Utilizador têm acesso total ao seu site. Podem modificar todo o conteúdo, sem qualquer restrição. Também podem instalar software que pode aceder ou modificar todos os aspetos do seu site, incluindo ficheiros arbitrários, conteúdo da base de dados e definições de configuração. Conceda acesso de Super Utilizador apenas a pessoas em quem confia.\n\nSe está a receber este e-mail, significa que estas contas de Super Utilizador foram criadas fora da página \"Utilizadores\" do Joomla!. Normalmente, isto significa que um hacker encontrou uma forma de contornar a segurança do seu site ou do seu servidor e tentou criar clandestinamente contas de Super Utilizador para si próprio. Por este motivo, estas contas foram bloqueadas, ou seja, não podem ser utilizadas para iniciar sessão no seu site.\n\nNo entanto, é possível que esteja a receber este e-mail por engano: se você ou outro Super Utilizador tencionava criar estas contas de Super Utilizador e utilizou uma ferramenta de terceiros para o fazer. Nesse caso, não se preocupe. Basta iniciar sessão na área de administração do seu site com a sua própria conta de Super Utilizador, aceder à página Utilizadores, editar os utilizadores listados acima neste e-mail e desbloqueá-los.\n\nSe você ou outro Super Utilizador NÃO tencionava criar estes Super Utilizadores, recomendamos que audite o seu site e o seu servidor em busca de outros sinais de atividade anómala.\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que detetámos a adição suspeita de uma ou mais contas de Super Utilizador ao seu site, {SITENAME}. Estas novas contas de Super Utilizador não parecem ter sido criadas pelos meios habituais, ou seja, através da página \"Utilizadores\" do Joomla!. Por isso, foram bloqueadas. As novas contas de Super Utilizador detetadas <strong>e bloqueadas</strong> são:</p>{INFO_HTML}<h3>Devo preocupar-me?</h3><p>As contas de Super Utilizador têm acesso total ao seu site. Podem modificar todo o conteúdo, sem qualquer restrição. Também podem instalar software que pode aceder ou modificar todos os aspetos do seu site, incluindo ficheiros arbitrários, conteúdo da base de dados e definições de configuração. Conceda acesso de Super Utilizador apenas a pessoas em quem confia.</p><p>Se está a receber este e-mail, significa que estas contas de Super Utilizador foram criadas fora da página \"Utilizadores\" do Joomla!. Normalmente, isto significa que um hacker encontrou uma forma de contornar a segurança do seu site ou do seu servidor e tentou criar clandestinamente contas de Super Utilizador para si próprio. Por este motivo, estas contas foram bloqueadas, ou seja, não podem ser utilizadas para iniciar sessão no seu site.</p><p>No entanto, é possível que esteja a receber este e-mail por engano: se você ou outro Super Utilizador tencionava criar estas contas de Super Utilizador e utilizou uma ferramenta de terceiros para o fazer. Nesse caso, não se preocupe. Basta iniciar sessão na área de administração do seu site com a sua própria conta de Super Utilizador, aceder à página Utilizadores, editar os utilizadores listados acima neste e-mail e desbloqueá-los.</p><p>Se você ou outro Super Utilizador NÃO tencionava criar estes Super Utilizadores, recomendamos que audite o seu site e o seu servidor em busca de outros sinais de atividade anómala.</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_RESCUEURL_TITLE="Admin Tools: URL de Recuperação"
COM_ADMINTOOLS_MAIL_RESCUEURL_DESC="Enviado pelo Admin Tools quando um utilizador de backend solicita uma URL de Recuperação para recuperar o acesso ao site."
COM_ADMINTOOLS_EMAIL_RESCUEURL_SUBJECT="URL de Recuperação solicitada em {SITENAME} para {USER}"
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY="Olá,\n\nGostaríamos de o notificar de que o utilizador {USER} solicitou uma URL de Recuperação para o seu site, {SITENAME}. Se foi você que fez esse pedido, clique na ligação seguinte ou copie e cole o URL no seu browser. Isto permitir-lhe-á iniciar sessão na área de administração do seu site, onde pode modificar o desbloqueio e / ou alterar a configuração do Admin Tools. A URL de Recuperação é:\n\n{RESCUEURL}\n\nAs informações no final deste e-mail indicam-lhe o que fazer após iniciar sessão no backend do seu site.\n\nNão faço ideia por que razão estou a receber este e-mail\n======================================================================\n\nConsulte a secção \"O que é a URL de Recuperação\" mais abaixo. NÃO necessita de tomar qualquer ação e NÃO necessita de se preocupar.\n\nQuem solicitou a URL de Recuperação?\n======================================================================\n\nNome de Utilizador: {USER}\nEndereço IP: {IP} (Pesquisa de IP: {LOOKUP})\nUser Agent: {UA}\n\nO que é a URL de Recuperação?\n======================================================================\n\nPor vezes, uma configuração demasiado rigorosa do Admin Tools pode resultar no bloqueio acidental de um Super Utilizador do site. Normalmente, tal exigiria que renomeasse o ficheiro do plugin de sistema do Admin Tools para se desbloquear. Isso é um pouco complicado e suscetível a erros.\n\nA funcionalidade URL de Recuperação contorna esse problema. Ao aceder a um URL especial quando está bloqueado no site, é-lhe enviado este e-mail. O URL neste e-mail é válido apenas para o mesmo browser e endereço IP que efetuou o pedido e apenas por um período de tempo limitado. Ao acedê-lo, acederá a uma página de início de sessão do administrador temporariamente desbloqueada. Isto permite-lhe aceder à área de administração do seu site para se desbloquear e / ou modificar as definições do Admin Tools.\n\nPor predefinição, esta funcionalidade está ativada em todas as instalações do Admin Tools. Além disso, uma mensagem sobre como aceder à URL de Recuperação é apresentada por predefinição quando alguém é bloqueado, A MENOS QUE configure uma \"Mensagem personalizada\" na página Configurar WAF do Admin Tools. Se não tem ideia por que razão recebeu esta mensagem, é provável que alguém tenha visto a mensagem de bloqueio de IP predefinida e tenha adivinhado corretamente o seu e-mail de Super Utilizador. Não se preocupe, porém, pois o que fizeram é completamente inútil, uma vez que também precisariam de acesso à sua conta de e-mail e à sua palavra-passe de Super Utilizador para aceder ao seu site, ou seja, precisariam de já o ter invadido. Conforme documentado, recomendamos vivamente que altere a \"Mensagem personalizada\" para tornar menos óbvio que o seu site está protegido pelo Admin Tools. Se não pretende utilizar a funcionalidade URL de Recuperação -e não se importa de renomear ficheiros manualmente conforme a documentação quando for bloqueado- aceda a Extensões, Plugins e edite as opções do plugin de sistema do Admin Tools. Verá uma opção para URL de Recuperação. Defina-a como Não para desativar esta funcionalidade.\n\nO que fazer após iniciar sessão?\n======================================================================\n\nSe o seu IP for bloqueado pelo Admin Tools, aceda a Componentes, Admin Tools e clique no grande botão Desbloquear o Meu IP no topo da página.\n\nSe o seu IP continuar a ser bloqueado sem que faça nada suspeito, o IP bloqueado é sempre o mesmo mas diferente do reportado por http://www.ip-adress.eu/ e https://www.whatismyip.com/, o seu site pode estar por detrás de uma CDN ou de um proxy reverso. Nesse caso, para além das instruções acima, aceda a Sistema, Configuração Global. Defina a opção \"Por detrás de um balanceador de carga\" como Sim e guarde.\n\nSe, no entanto, o seu endereço IP real, conforme reportado pelas duas ferramentas listadas acima, continuar a ser banido, deve diagnosticar o motivo do banimento. Aceda a Componentes, Admin Tools, Web Application Firewall, Registo de Exceções de Segurança e verifique o Motivo e o URL de Destino para as entradas que têm o seu endereço IP no campo de endereço IP. Se não tiver a certeza do que isso significa, abra um ticket de suporte e lembre-se de copiar as informações do Registo de Exceções de Segurança. Note que é necessário ter uma subscrição ativa para receber suporte.\n\nSe se esqueceu do Parâmetro Secreto de URL do Administrador, aceda a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, clique no separador Funcionalidades de Proteção Básicas e localize a opção \"Parâmetro secreto de URL do administrador\". Altere ou remova todo o texto nessa caixa para repor ou anular, respetivamente, esta funcionalidade.\n\nO que fazer se ainda não consigo iniciar sessão no meu site?\n======================================================================\n\nExistem dois casos em que a funcionalidade URL de Recuperação, ou a renomeação do ficheiro do plugin de sistema do Admin Tools, não o ajudarão. São os dois casos em que o Admin Tools criou um ficheiro de configuração do servidor, o que significa que está a ser bloqueado pelo seu servidor, e não pelo Admin Tools.\n\nO primeiro é a funcionalidade de proteção por palavra-passe do diretório do Administrador. Elimine os ficheiros com o nome .htaccess e .htpasswd do diretório administrator do seu site.\n\nO outro caso é quando utilizou a funcionalidade Gerador de .htaccess do Admin Tools. Nesse caso, existe um ficheiro .htaccess na raiz do seu site. Poderá querer substituir o seu conteúdo pelo conteúdo predefinido do ficheiro .htaccess do Joomla!.\n\nEm ambos os casos, tenha em atenção que os ficheiros têm nomes que começam com um ponto. Isso torna-os ocultos. Terá de ativar a visualização de ficheiros ocultos para editar / eliminar esses ficheiros. Se não sabe como fazê-lo, contacte o seu alojamento e diga-lhe que precisa de editar/eliminar ficheiros ocultos. Normalmente, indicar-lhe-ão uma opção no gestor de ficheiros do painel de controlo do seu alojamento.\n\nEm qualquer outro caso, o seu problema não está relacionado com o Admin Tools. Tem outro plugin de segurança no seu site? Se tiver, verifique as suas definições. Se não tiver, contacte o seu alojamento. Na maioria das vezes, os alojamentos têm os seus próprios sistemas de segurança no servidor que podem bloqueá-lo no acesso ao site."
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que o utilizador {USER} solicitou uma URL de Recuperação para o seu site, {SITENAME}. Se foi você que fez esse pedido, clique na ligação seguinte ou copie e cole o URL no seu browser. Isto permitir-lhe-á iniciar sessão na área de administração do seu site, onde pode modificar o desbloqueio e / ou alterar a configuração do Admin Tools. A URL de Recuperação é:</p><p><a href=\"{RESCUEURL}\" rel=\"alternate\">{RESCUEURL}</a></p><p>As informações no final deste e-mail indicam-lhe o que fazer após iniciar sessão no backend do seu site.</p><h3>Não faço ideia por que razão estou a receber este e-mail</h3><p>Consulte a secção \"O que é a URL de Recuperação\" mais abaixo. <strong>NÃO</strong> necessita de tomar qualquer ação e <strong>NÃO</strong> necessita de se preocupar.</p><h3>Quem solicitou a URL de Recuperação?</h3><p>Nome de Utilizador: {USER}<br />Endereço IP: {IP} (<a href=\"{LOOKUP}\">Pesquisa de IP</a>)<br />User Agent: {UA}</p><h3>O que é a URL de Recuperação?</h3><p>Por vezes, uma configuração demasiado rigorosa do Admin Tools pode resultar no bloqueio acidental de um Super Utilizador do site. Normalmente, tal exigiria que renomeasse o ficheiro do plugin de sistema do Admin Tools para se desbloquear. Isso é um pouco complicado e suscetível a erros.</p><p>A funcionalidade URL de Recuperação contorna esse problema. Ao aceder a um URL especial quando está bloqueado no site, é-lhe enviado este e-mail. O URL neste e-mail é válido apenas para o mesmo browser e endereço IP que efetuou o pedido e apenas por um período de tempo limitado. Ao acedê-lo, acederá a uma página de início de sessão do administrador <em>temporariamente</em> desbloqueada. Isto permite-lhe aceder à área de administração do seu site para se desbloquear e / ou modificar as definições do Admin Tools.</p><p>Por predefinição, esta funcionalidade está ativada em todas as instalações do Admin Tools. Além disso, uma mensagem sobre como aceder à URL de Recuperação é apresentada por predefinição quando alguém é bloqueado, A MENOS QUE configure uma \"Mensagem personalizada\" na página Configurar WAF do Admin Tools. Se não tem ideia por que razão recebeu esta mensagem, é provável que alguém tenha visto a mensagem de bloqueio de IP predefinida e tenha adivinhado corretamente o seu e-mail de Super Utilizador. Não se preocupe, porém, pois o que fizeram é completamente inútil, uma vez que também precisariam de acesso à sua conta de e-mail e à sua palavra-passe de Super Utilizador para aceder ao seu site, ou seja, precisariam de já o ter invadido. Conforme documentado, recomendamos vivamente que altere a \"Mensagem personalizada\" para tornar menos óbvio que o seu site está protegido pelo Admin Tools. Se não pretende utilizar a funcionalidade URL de Recuperação -e não se importa de renomear ficheiros manualmente conforme a documentação quando for bloqueado- aceda a Extensões, Plugins e edite as opções do plugin de sistema do Admin Tools. Verá uma opção para URL de Recuperação. Defina-a como Não para desativar esta funcionalidade.</p><h3>O que fazer após iniciar sessão?</h3><p>Se o seu IP for bloqueado pelo Admin Tools, aceda a Componentes, Admin Tools e clique no grande botão Desbloquear o Meu IP no topo da página.</p><p>Se o seu IP continuar a ser bloqueado sem que faça nada suspeito, o IP bloqueado é sempre o mesmo mas diferente do reportado por <a href=\"http://www.ip-adress.eu/\">http://www.ip-adress.eu/ </a><em>e</em> <a href=\"https://www.whatismyip.com/\">https://www.whatismyip.com/</a>, o seu site pode estar por detrás de uma CDN ou de um proxy reverso. Nesse caso, para além das instruções acima, aceda a Sistema, Configuração Global. Defina a opção \"Por detrás de um balanceador de carga\" como Sim e guarde.</p><p>Se, no entanto, o seu endereço IP real, conforme reportado pelas duas ferramentas listadas acima, continuar a ser banido, deve diagnosticar o motivo do banimento. Aceda a Componentes, Admin Tools, Web Application Firewall, Registo de Exceções de Segurança e verifique o Motivo e o URL de Destino para as entradas que têm o seu endereço IP no campo de endereço IP. Se não tiver a certeza do que isso significa, <a href=\"https://www.akeeba.com/support/admin-tools.html\" rel=\"alternate\">abra um ticket de suporte</a> e lembre-se de copiar as informações do Registo de Exceções de Segurança. Note que é necessário ter uma subscrição ativa para receber suporte.</p><p>Se se esqueceu do Parâmetro Secreto de URL do Administrador, aceda a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, clique no separador Funcionalidades de Proteção Básicas e localize a opção \"Parâmetro secreto de URL do administrador\". Altere ou remova todo o texto nessa caixa para repor ou anular, respetivamente, esta funcionalidade.</p><h3>O que fazer se ainda não consigo iniciar sessão no meu site?</h3><p>Existem dois casos em que a funcionalidade URL de Recuperação, ou a renomeação do ficheiro do plugin de sistema do Admin Tools, não o ajudarão. São os dois casos em que o Admin Tools criou um ficheiro de configuração do <em>servidor</em>, o que significa que está a ser bloqueado pelo <em>seu servidor</em>, e não pelo Admin Tools.</p><p>O primeiro é a funcionalidade de <strong>proteção por palavra-passe do diretório do Administrador</strong>. Elimine os ficheiros com o nome <code>.htaccess</code> e <code>.htpasswd</code> do diretório <code>administrator</code> do seu site. </p><p>O outro caso é quando utilizou a funcionalidade <strong>Gerador de .htaccess</strong> do Admin Tools. Nesse caso, existe um ficheiro <code>.htaccess</code> na raiz do seu site. Poderá querer substituir o seu conteúdo pelo <a href=\"https://raw.githubusercontent.com/joomla/joomla-cms/staging/htaccess.txt\" rel=\"alternate\">conteúdo predefinido do ficheiro .htaccess do Joomla!</a>.</p><p>Em ambos os casos, tenha em atenção que os ficheiros têm nomes que começam com um ponto. Isso torna-os <em>ocultos</em>. Terá de ativar a visualização de ficheiros ocultos para editar / eliminar esses ficheiros. Se não sabe como fazê-lo, contacte o seu alojamento e diga-lhe que precisa de editar/eliminar ficheiros <em>ocultos</em>. Normalmente, indicar-lhe-ão uma opção no gestor de ficheiros do painel de controlo do seu alojamento. </p><p>Em qualquer outro caso, o seu problema não está relacionado com o Admin Tools. Tem outro plugin de segurança no seu site? Se tiver, verifique as suas definições. Se não tiver, contacte o seu alojamento. Na maioria das vezes, os alojamentos têm os seus próprios sistemas de segurança no servidor que podem bloqueá-lo no acesso ao site.</p>"

COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_TITLE="Admin Tools: Pedido bloqueado"
COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_DESC="Enviado pelo Admin Tools quando um pedido é bloqueado pela sua Web Application Firewall."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_SUBJECT="Pedido bloqueado em {SITENAME}"
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY="Olá,\n\nGostaríamos de o notificar de que foi detetada uma exceção de segurança no seu site, {SITENAME}, com os seguintes detalhes:\n\nEndereço IP: {IP} (Pesquisa de IP: {LOOKUP})\nMotivo: {REASON}\n\nSe este tipo de exceção de segurança se repetir, inicie sessão no backend do seu site e adicione este endereço IP à funcionalidade Web Application Firewall do Admin Tools para bloquear completamente o utilizador problemático.\n\nCom os melhores cumprimentos,\n\nA equipa de {SITENAME}\n\nNota: Está a receber este e-mail automático porque é administrador em {SITENAME}. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que foi detetada uma exceção de segurança no seu site, {SITENAME}, com os seguintes detalhes:</p><p>Endereço IP: {IP} (<a href=\"{LOOKUP}\">Pesquisa de IP</a>)<br />Motivo: {REASON}</p><p>Se este tipo de exceção de segurança se repetir, inicie sessão no backend do seu site e adicione este endereço IP à funcionalidade Web Application Firewall do Admin Tools para bloquear completamente o utilizador problemático.</p><p>Com os melhores cumprimentos,</p><p>A equipa de {SITENAME}</p><p><small>Está a receber este e-mail automático porque é administrador em <em>{SITENAME}</em>. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.</small></p>"

COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_TITLE="Admin Tools: Muitos pedidos bloqueados"
COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_DESC="Enviado pelo Admin Tools quando o seu site bloqueou muitos pedidos num determinado período de tempo."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_SUBJECT="Número elevado de pedidos bloqueados em {SITENAME}"
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY="Olá,\n\nGostaríamos de o notificar de que o site {SITENAME} está atualmente a bloquear um número elevado de pedidos.\n\nUm total de {NUM} pedidos foi bloqueado desde {DATE}. Poderá querer verificar o motivo dos pedidos bloqueados e considerar se são necessárias medidas adicionais, caso suspeite que é o início de um ataque persistente ao seu site."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY_HTML="<p>Olá,</p><p>Gostaríamos de o notificar de que o site {SITENAME} está atualmente a bloquear um número elevado de pedidos</p><p>Um total de {NUM} pedidos foi bloqueado desde {DATE}. Poderá querer verificar o motivo dos pedidos bloqueados e considerar se são necessárias medidas adicionais, caso suspeite que é o início de um ataque persistente ao seu site.</p>"

COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_TITLE="Admin Tools: listas de IPs de rastreadores desativadas"
COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_DESC="Enviado pelo Admin Tools aos Super Utilizadores quando desativa automaticamente a opção «Utilizar listas de IPs de rastreadores» porque a cache do site parece não funcionar ou não é possível transferir as listas."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_SUBJECT="As listas de IPs de rastreadores foram desativadas em {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY="Olá,\n\nO Admin Tools desativou automaticamente a opção «Utilizar listas de IPs de rastreadores» em {SITENAME} em {DATE} porque {CAUSE}.\n\nIsto evita que o seu site fique mais lento. Enquanto não voltar a ativar a opção, as suas definições Bloquear e Não bloquear para os rastreadores de motores de pesquisa e de IA não são aplicadas.\n\nComo resolver:\n\n* Se a causa for que a cache do site não guarda quaisquer dados: aceda a Sistema, Configuração Global, Sistema, e verifique as suas definições de cache. Certifique-se de que a pasta da cache tem permissões de escrita, ou que o seu servidor Redis ou Memcached está em execução e acessível.\n* Se a causa for que a transferência das listas falha repetidamente: verifique se o seu servidor tem permissão para estabelecer ligações de saída para outros sites (firewall, definições de proxy, restrições do alojamento).\n\nDepois de resolver o problema, aceda a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, clique no separador Rastreadores e volte a ativar «Utilizar listas de IPs de rastreadores». Pode fazê-lo diretamente em {URL}\n\nNota: Está a receber este e-mail automático porque é Super Utilizador em {SITENAME}. Não responda a este e-mail, é enviado a partir de um endereço não monitorizado."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY_HTML="<p>Olá,</p><p>O Admin Tools desativou automaticamente a opção «Utilizar listas de IPs de rastreadores» em {SITENAME} em {DATE} porque {CAUSE}.</p><p>Isto evita que o seu site fique mais lento. Enquanto não voltar a ativar a opção, as suas definições Bloquear e Não bloquear para os rastreadores de motores de pesquisa e de IA não são aplicadas.</p><p>Como resolver:</p><ul><li>Se a causa for que a cache do site não guarda quaisquer dados: aceda a Sistema, Configuração Global, Sistema, e verifique as suas definições de cache. Certifique-se de que a pasta da cache tem permissões de escrita, ou que o seu servidor Redis ou Memcached está em execução e acessível.</li><li>Se a causa for que a transferência das listas falha repetidamente: verifique se o seu servidor tem permissão para estabelecer ligações de saída para outros sites (firewall, definições de proxy, restrições do alojamento).</li></ul><p>Depois de resolver o problema, aceda a Componentes, Admin Tools, Web Application Firewall, Configurar WAF, clique no separador Rastreadores e volte a ativar «Utilizar listas de IPs de rastreadores». Pode fazê-lo diretamente <a href=\"{URL}\">em Configurar WAF</a>.</p><p><small>Está a receber este e-mail automático porque é Super Utilizador em <em>{SITENAME}</em>. Não responda a este e-mail, é enviado a partir de um endereço não monitorizado.</small></p>"

