COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_TITLE="Ainda não foram definidas Palavras Proibidas."
COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_CONTENT="As Palavras Proibidas permitem bloquear qualquer pedido público do frontend que contenha uma ou mais dessas palavras em qualquer parâmetro do pedido. Podem ser usadas para bloquear spam evidente e linguagem imprópria que seja submetida ao seu site."
