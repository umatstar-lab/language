COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_FIX_DONE="Depurar sistema foi desativado."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_TITLE="Depurar idioma deve estar desativado"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_DESC="Depurar idioma destina-se apenas a programadores e tradutores que pretendem ver se o texto de uma página provém de uma cadeia de idioma e se essa cadeia está traduzida no idioma atual. Todos os outros sites devem tê-lo desativado."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_MSG_FAIL="Depurar idioma está ativado. Aceda a Sistema, Configuração global, separador Sistema, e defina Depurar idioma como Não."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX="Desativar Depurar idioma"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX_DONE="Depurar idioma foi desativado."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_TITLE="$live_site deve estar vazio em configuration.php"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_DESC="A opção <code>$live_site</code> é uma solução antiga para servidores web por detrás de um proxy inverso, balanceador de carga ou CDN que não envia um cabeçalho HTTP <code>X-Forwarded-Host</code>, ou cujo cabeçalho o servidor web, mal configurado, ignora. Algumas pessoas também a utilizam para definir o URL do site para a CLI do Joomla. Também isto é desaconselhado: a CLI do Joomla tem uma forma mais segura de fazer o mesmo, a sua opção <code>--live-site=%s</code>."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MATCH="O seu site é acedido através do mesmo nome de anfitrião indicado em <code>$live_site</code>, pelo que não precisa dele. Edite o ficheiro <code>configuration.php</code> do seu site e esvazie a variável <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MISMATCH="O seu servidor indica um nome de anfitrião diferente do indicado em <code>$live_site</code>. Peça ao seu fornecedor de alojamento que configure o servidor web para respeitar o cabeçalho HTTP <code>X-Forwarded-Host</code> enviado pelo proxy inverso, balanceador de carga ou CDN à frente do seu site. Depois, edite o ficheiro <code>configuration.php</code> do seu site e esvazie a variável <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_NOHOST="O seu servidor não indica o cabeçalho HTTP Host. Peça ao seu fornecedor de alojamento que configure o servidor para o definir. Se existir um proxy inverso, balanceador de carga ou CDN à frente do seu site, poderá ser necessário configurar o servidor web para respeitar o cabeçalho HTTP <code>X-Forwarded-Host</code>. Depois, edite o ficheiro <code>configuration.php</code> do seu site e esvazie a variável <code>$live_site</code>: <code>public $live_site = '';</code>"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_TITLE="Relatório de erros deve estar definido como Nenhum num site em produção"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_DESC="Relatório de erros tem de estar definido como Nenhum em sites em produção. Caso contrário, os erros, avisos e notificações do PHP podem revelar inadvertidamente informações sensíveis, ou informações úteis a atacantes. Utilize Máximo apenas durante a resolução de um problema, idealmente numa cópia privada do site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_MSG_FAIL="Relatório de erros não está definido como Nenhum. Aceda a Sistema, Configuração global, separador Servidor, e defina Relatório de erros como Nenhum."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX="Definir Relatório de erros como Nenhum"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX_DONE="Relatório de erros foi definido como Nenhum."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_TITLE="Sessões partilhadas tem de estar desativado"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_DESC="As sessões partilhadas são intrinsecamente perigosas. Quando um utilizador inicia sessão no frontend, inicia automaticamente sessão também no backend. Isto permite que atacantes realizem ataques de credential stuffing e de força bruta contra o frontend e, quando são bem-sucedidos, acabem com sessão iniciada no backend. Pode ter efeitos adversos imprevistos e anula parcialmente outras medidas de segurança que protegem o backend do seu site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_MSG_FAIL="Sessões partilhadas está ativado. Aceda a Sistema, Configuração global, separador Sistema, e defina Sessões partilhadas como Não."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX="Desativar Sessões partilhadas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_CONFIRM="Desativar Sessões partilhadas altera o nome do cookie de sessão. Todos, incluindo o próprio, terão a sessão terminada no site e terão de iniciar sessão novamente. Continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_DONE="Sessões partilhadas foi desativado. Poderá ter de iniciar sessão novamente."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_TITLE="O configuration.php não deve definir um nome de sessão enquanto Sessões partilhadas estiver desativado"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_DESC="A Joomla! dá ao cookie de sessão o nome correspondente ao nome de sessão. Quando o <code>configuration.php</code> define um nome de sessão, o frontend e o backend do seu site utilizam o mesmo cookie de sessão, ou seja, partilham as sessões, mesmo com Sessões partilhadas desativado. Isto tem os mesmos riscos que as Sessões partilhadas. A Joomla! só guarda um nome de sessão enquanto Sessões partilhadas estiver ativado. O Admin Tools 7.9.4 e versões anteriores escreviam um por engano no <code>configuration.php</code> sempre que Verificar Diretórios Temporários e de Registo corrigia a pasta temporária ou a pasta de registos do seu site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_MSG_FAIL="O <code>configuration.php</code> do seu site define um nome de sessão (<code>$session_name</code>), embora Sessões partilhadas esteja desativado. O frontend e o backend do seu site partilham as sessões. Remova-o, juntamente com outros valores que só se aplicam durante o carregamento de uma página e que foram escritos aí por engano."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX="Remover o nome de sessão"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_CONFIRM="Remover o nome de sessão altera o nome do cookie de sessão do frontend. Todos os que tiverem sessão iniciada no frontend do seu site, possivelmente incluindo o próprio, terão a sessão terminada e terão de iniciar sessão novamente. Continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_DONE="O nome de sessão foi removido do configuration.php. O frontend e o backend do seu site já não partilham as sessões. Poderá ter de iniciar sessão novamente."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_TITLE="Funcionalidades do Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_DESC="Estas verificações analisam as definições de funcionalidades do núcleo do Joomla! e do Admin Tools e propõem valores adequados para sites em produção."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_TITLE="O plugin de depuração tem de estar desativado, ou limitado aos Super Utilizadores"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_DESC="Utilize o plugin Sistema — Depurar apenas durante a resolução de um problema do seu site, idealmente numa cópia privada do site, ou durante um período de tempo limitado. O seu resultado pode conter informações sensíveis, ou informações que um atacante pode utilizar contra o seu site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_MSG_FAIL="O plugin Sistema — Depurar está ativado e utilizadores que não são Super Utilizadores podem ver o seu resultado. Desative o plugin em sites em produção, ou defina os seus Grupos permitidos apenas como Super Users. Estes grupos de utilizadores podem atualmente ver o seu resultado:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX="Desativar o plugin de depuração"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX_DONE="O plugin Sistema — Depurar foi desativado."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_TITLE="O utilizador \"admin\" não pode existir, ou tem de estar desativado"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_DESC="Nomes de utilizador previsíveis, como <code>admin</code>, são um alvo preferido de ataques de credential stuffing e de força bruta. Comprometer uma conta de utilizador deste tipo pode ser prejudicial para o seu site. Mesmo com permissões mínimas (por exemplo, apenas no grupo Registered) uma conta destas continua a ser perigosa se o próprio Joomla! ou uma extensão de terceiros tiver uma vulnerabilidade de escalonamento de privilégios."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_MSG_FAIL="Existe uma conta de utilizador ativa com o nome de utilizador <code>admin</code>. Bloqueie-a, mude-lhe o nome ou elimine-a. Colocá-la num grupo de utilizadores com menos privilégios não é suficiente."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX="Bloquear o utilizador"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_CONFIRM="A conta de utilizador com o nome admin será bloqueada e deixará de poder iniciar sessão no seu site. Continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_DONE="A conta de utilizador com o nome admin foi bloqueada."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SELF="Tem sessão iniciada como o utilizador admin. Não pode bloquear a sua própria conta de utilizador. Em alternativa, mude-lhe o nome ou inicie sessão com outra conta."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SAVE="Não foi possível bloquear a conta de utilizador com o nome admin."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_TITLE="Ative o registo de utilizadores apenas se necessário"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_DESC="Por predefinição, o Joomla! permite o registo de novos utilizadores. Isto é possível mesmo que não tenha publicado um módulo de início de sessão, ou um item de menu para início de sessão ou registo de utilizadores, desde que Permitir o registo de novos utilizadores esteja ativado. Se não precisa que os visitantes registem uma conta, como acontece na maioria dos sites geridos pelo próprio, deve desativar esta funcionalidade."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_MSG_FAIL="O registo de utilizadores está ativado. Se não precisa que os visitantes registem contas de utilizador no seu site, aceda a Utilizadores, Opções, separador Utilizadores — Opções, e defina Permitir o registo de novos utilizadores como Não."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX="Desativar o registo de utilizadores"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX_DONE="O registo de utilizadores foi desativado."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_TITLE="Limite o acesso ao backend a um pequeno número de operadores de confiança"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_DESC="O acesso ao backend raramente é necessário, e cada utilizador que o tem aumenta a superfície de ataque que tem de proteger. Avalie quais os utilizadores que precisam realmente de aceder ao backend e se poderiam fazer o seu trabalho a partir do frontend. Os utilizadores que só precisam de acesso ao backend ocasionalmente devem ser removidos dos grupos com acesso ao backend (Super Users, Administrator, Manager) e só voltar a ser adicionados quando precisarem desse acesso."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_PASS="%d conta(s) de utilizador ativa(s) pode(m) aceder ao backend."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_FAIL="%1$d contas de utilizador ativas podem aceder ao backend; isso é mais do que %2$d."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_TITLE="Utilize a autenticação multifator em todas as contas com acesso ao backend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_DESC="Os utilizadores com acesso ao backend são um alvo privilegiado de ataques de credential stuffing e de força bruta. Uma única conta comprometida, mesmo a de um simples Manager, pode causar muitos danos ao seu site. Ative sempre a autenticação multifator nestas contas de utilizador. Torne-a obrigatória acedendo a Utilizadores, Opções, separador Autenticação multifator, e selecionando todos os grupos de utilizadores do backend do seu site em Impor autenticação multifator."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_MSG_FAIL="%d conta(s) de utilizador ativa(s) com acesso ao backend não utiliza(m) a autenticação multifator:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_TITLE="Proteja o diretório administrator com palavra-passe"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_DESC="Proteger o diretório administrator com palavra-passe torna os ataques de credential stuffing e de força bruta menos eficazes. Mesmo que as credenciais de um utilizador sejam divulgadas, o atacante tem ainda mais um obstáculo a ultrapassar antes de conseguir iniciar sessão no backend do seu site. Como esta proteção é imposta pelo próprio servidor web, é muito eficiente e limita o impacto de um atacante que tente forçar um início de sessão no backend."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_MSG_FAIL="O diretório administrator não está protegido por palavra-passe. Utilize a funcionalidade Proteger Administrador por Palavra-passe do Admin Tools para o proteger."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_TITLE="Aplique um parâmetro secreto de URL"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_DESC="Um parâmetro secreto de URL torna os ataques de credential stuffing e de força bruta menos eficazes. Mesmo que as credenciais de um utilizador sejam divulgadas, o atacante tem ainda mais um obstáculo a ultrapassar antes de conseguir iniciar sessão no backend do seu site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_MSG_FAIL="Não definiu um parâmetro secreto de URL para o administrador. Defina-o em Web Application Firewall, Configurar WAF, separador Funcionalidades Básicas, Parâmetro Secreto de URL do Administrador."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_TITLE="Remova as contas que \"nunca iniciaram sessão\""
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_DESC="As contas de utilizador que foram criadas mas nunca iniciaram sessão são contas de spam de que não precisa, ou contas esquecidas com palavras-passe potencialmente comprometidas. Remova-as com uma tarefa agendada do Joomla! do tipo \"Admin Tools – Eliminar utilizadores inativos\"."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_FAIL="%1$d conta(s) de utilizador registada(s) há mais de %2$d dias nunca iniciou(aram) sessão. Crie uma tarefa agendada do tipo \"Admin Tools – Eliminar utilizadores inativos\" para as remover."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_TASK="Uma tarefa agendada \"Admin Tools – Eliminar utilizadores inativos\" ativa trata destas contas."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_TITLE="Os Super Utilizadores não devem poder iniciar sessão no frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_DESC="Por predefinição, os Super Utilizadores também podem iniciar sessão no frontend do seu site. Isto permite que atacantes realizem ataques de credential stuffing e de força bruta contra o frontend, menos protegido, para descobrir a palavra-passe de um Super Utilizador. A funcionalidade \"Proibir autenticação de Super Administrador na parte pública\" do Admin Tools impede os Super Utilizadores de iniciar sessão no frontend, frustrando os planos dos atacantes."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_MSG_FAIL="Os Super Utilizadores podem iniciar sessão no frontend. Ative \"Proibir autenticação de Super Administrador na parte pública\" em Web Application Firewall, Configurar WAF, separador Opções de Reforço de Segurança."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX="Proibir o início de sessão de Super Utilizadores no frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX_DONE="Os Super Utilizadores já não podem iniciar sessão no frontend."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_TITLE="Os utilizadores do backend não devem poder iniciar sessão no frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_DESC="Por predefinição, os utilizadores do backend também podem iniciar sessão no frontend do seu site. Isto permite que atacantes realizem ataques de credential stuffing e de força bruta contra o frontend, menos protegido, para descobrir a palavra-passe de um utilizador do backend. Edite as permissões dos grupos de utilizadores com acesso ao backend e defina a sua permissão Autenticação no sítio como Negado, frustrando os planos dos atacantes."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_MSG_FAIL="%d conta(s) de utilizador ativa(s) pode(m) iniciar sessão tanto no backend como no frontend. Aceda a Sistema, Configuração global, separador Permissões, e defina Autenticação no sítio como Negado para estes grupos de utilizadores:"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_TITLE="Ficheiros e Pastas"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_DESC="Estas verificações procuram ficheiros e pastas que não devem ser deixados num site em produção."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_TITLE="O Akeeba Kickstart não deve ser deixado na raiz web"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_DESC="O Kickstart consegue extrair qualquer ficheiro JPA, JPS ou ZIP em qualquer local do seu site. Em combinação com uma vulnerabilidade de envio arbitrário de ficheiros no próprio Joomla! ou numa extensão de terceiros, isto permite que um atacante escreva ficheiros arbitrários no seu site, execute o seu próprio código e comprometa o seu site. Mudar o nome do ficheiro, ou definir uma palavra-passe, é apenas uma boa medida <em>temporária</em> enquanto extrai um arquivo de cópia de segurança. Depois de terminar, o Kickstart <strong>tem</strong> de ser removido do seu site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_MSG_FAIL="Estes ficheiros na raiz do seu site são cópias do Akeeba Kickstart. Elimine-os."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_FIX_DONE="Eliminado: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_TITLE="A pasta installation tem de ser eliminada"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_DESC="Uma pasta <code>installation</code> deixada após instalar o Joomla! ou restaurar uma cópia de segurança pode ser utilizada para substituir o seu site. Tem de ser removida depois de terminar."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_MSG_FAIL="Existe uma pasta <code>installation</code> na raiz do seu site. Elimine-a."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX="Eliminar a pasta installation"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_CONFIRM="A pasta installation na raiz do seu site, e todo o seu conteúdo, serão eliminados. Esta ação não pode ser anulada. Continuar?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_DONE="A pasta installation foi eliminada."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_TITLE="As pastas remanescentes de instalação de extensões têm de ser eliminadas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_DESC="O Joomla! utiliza pastas temporárias <code>install_*</code> enquanto copia os ficheiros de uma extensão para a sua localização final, e normalmente elimina-as de imediato. Se uma instalação não terminar corretamente, ficam para trás e podem representar um risco de segurança. Elimine-as. Também pode criar uma tarefa agendada do tipo \"Admin Tools – Limpar o diretório temporário\" para o fazer automaticamente."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_MSG_FAIL="Estas pastas de instalação remanescentes encontram-se na pasta temporária do seu site, <code>%s</code>:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_FIX_DONE="Eliminado: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_TITLE="Remova os ficheiros desnecessários do núcleo do Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_DESC="O Joomla! inclui na raiz do seu site alguns ficheiros de exemplo e informativos de que o seu site não precisa para funcionar. Servem apenas para dizer a todos que software o seu site utiliza. O Joomla! repõe-nos sempre que o atualiza, por isso verifique novamente após cada atualização."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_MSG_FAIL="Estes ficheiros desnecessários encontram-se na raiz do seu site:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_HTACCESS="Ficheiro .htaccess de exemplo. Não tem qualquer efeito a menos que lhe mude o nome para .htaccess num servidor web Apache ou LiteSpeed. É preferível utilizar o Gerador de .htaccess do Admin Tools."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_LICENSE="O texto da licença do Joomla!. Não precisa de estar presente para utilizar o Joomla!."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_ROBOTS="Ficheiro robots.txt de exemplo. Não tem qualquer efeito a menos que lhe mude o nome para robots.txt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_WEBCONFIG="Ficheiro web.config de exemplo. Não tem qualquer efeito a menos que lhe mude o nome para web.config num servidor web Microsoft IIS."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FIX_DONE="Eliminado: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_TITLE="O ficheiro de registo de depuração do Admin Tools deve ser desligado e os seus ficheiros de registo eliminados"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_DESC="A opção \"Manter um ficheiro de registo de depuração\" do Admin Tools destina-se apenas à resolução de problemas. Ative-a durante um período muito limitado, idealmente numa cópia privada do seu site. O ficheiro de registo regista dados dos pedidos, que podem incluir informações sensíveis. Depois de resolver o problema, desligue a opção e elimine os ficheiros de registo."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_ENABLED="A opção \"Manter um ficheiro de registo de depuração\" do Admin Tools está ativada. Desligue-a em Web Application Firewall, Configurar WAF, separador Registo e Relatórios."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_FILES="Os ficheiros de registo de depuração do Admin Tools continuam presentes na pasta de registos do seu site. Elimine-os."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE="Desligar"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DELETE="Desligar e eliminar os ficheiros de registo"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE="Eliminar os ficheiros de registo"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DONE="O ficheiro de registo de depuração foi desligado."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE_DONE="O ficheiro de registo de depuração está desligado e os seus ficheiros de registo foram eliminados."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_TITLE="Scanner de Alterações em Ficheiros PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_DESC="Estas verificações utilizam a informação que o Scanner de Alterações em Ficheiros PHP recolhe enquanto analisa o seu site, ou analisam as suas definições."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_TITLE="Utilize o Scanner de Alterações em Ficheiros PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_DESC="Execute o Scanner de Alterações em Ficheiros PHP pelo menos uma vez por semana, e também antes e depois de instalar uma atualização do Joomla!, uma atualização de uma extensão de terceiros ou uma nova extensão de terceiros. Não só lhe dá um aviso antecipado sobre ficheiros potencialmente comprometidos, como também permite que o Admin Tools recolha informações sobre outros ficheiros problemáticos no seu site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_NEVER="O Scanner de Alterações em Ficheiros PHP nunca concluiu uma análise do seu site."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_OLD="O Scanner de Alterações em Ficheiros PHP concluiu a última análise em %1$s, há mais de %2$d dias."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_PASS="O Scanner de Alterações em Ficheiros PHP concluiu a última análise em %s."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_TITLE="Não podem existir ficheiros não pertencentes ao núcleo em pastas do núcleo"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_DESC="As pastas do núcleo do Joomla! devem conter apenas os ficheiros distribuídos pelo próprio Joomla!. Qualquer outro ficheiro nelas foi deixado por uma versão antiga do Joomla!, colocado por uma extensão com mau comportamento, ou plantado por um atacante. Reveja estes ficheiros e remova os que não pertencem a esse local. Os ficheiros que reviu e marcou como seguros no relatório da análise não são listados."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_FAIL="O Scanner de Alterações em Ficheiros PHP encontrou %d ficheiro(s) não pertencente(s) ao núcleo em pastas do núcleo do Joomla!:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_IGNORED="Não é possível verificar isto, porque o Scanner de Alterações em Ficheiros PHP está configurado para ignorar ficheiros não pertencentes ao núcleo em pastas do núcleo. Aceda a Admin Tools, Opções, separador Scanner de Ficheiros, e defina \"Ficheiros não pertencentes ao núcleo em pastas do núcleo\" como Assinalar, ou Assinalar e Reportar como Ameaça. Depois, execute uma análise."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_TITLE="Não devem existir ficheiros PHP nas pastas de multimédia, imagens, ficheiros e idiomas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_DESC="A pasta <code>images</code> (e qualquer outra pasta do Gestor de media), <code>media</code>, <code>files</code>, <code>language</code>, <code>administrator/language</code> e <code>.well-known</code> destinam-se a ficheiros estáticos: imagens, documentos, CSS, JavaScript e ficheiros de idioma. Os ficheiros PHP nesses locais são muitas vezes backdoors enviados por atacantes através de uma extensão vulnerável. Reveja cada um deles; elimine os que não pertencem a uma extensão que utiliza."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_MSG_FAIL="%d ficheiro(s) PHP encontrado(s) onde não deveria(m) estar:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_TITLE="Os ficheiros de configuração do servidor não devem permitir executar ficheiros como PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_DESC="Um ficheiro <code>.htaccess</code> pode fazer o servidor web executar qualquer ficheiro como PHP ou como script CGI, seja qual for o seu nome (p. ex. <code>AddType application/x-httpd-php .jpg</code>), ou alterar as definições do PHP. Um ficheiro <code>.user.ini</code> pode fazer o PHP executar outro ficheiro, até uma imagem, antes ou depois de cada script PHP (<code>auto_prepend_file</code>). Os atacantes usam-nos para transformar um ficheiro enviado de aspeto inofensivo num backdoor. Os ficheiros que apenas impedem a execução de scripts, p. ex. com <code>SetHandler none</code> ou <code>php_flag engine off</code>, não são reportados. Também não o são os que estão diretamente na pasta raiz do seu site e na pasta <code>administrator</code>, onde os fornecedores de alojamento os usam para escolher a versão do PHP. Reveja cada um dos ficheiros listados; elimine os que não criou e que não pertencem a uma extensão que utiliza."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_MSG_FAIL="%d ficheiro(s) de configuração do servidor que permite(m) executar ficheiros como PHP ou altera(m) as definições do PHP:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_TITLE="Não mude o nome de ficheiros e pastas para guardar versões antigas"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_DESC="Cópias como <code>index-bak.php</code>, <code>index.php.old</code>, <code>configuration (1).php</code> ou <code>cassiopeia-copy</code> são uma forma comum de guardar uma versão antiga de um ficheiro ou pasta. Nunca são atualizadas, podem continuar acessíveis através da web, podem revelar informações sensíveis (um ficheiro de configuração com o nome alterado é um presente para um atacante) e podem conter código antigo e vulnerável. Em vez disso, utilize cópias de segurança ou um sistema de controlo de versões; elimine estas cópias."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_MSG_FAIL="%d ficheiro(s) e pasta(s) parece(m) ser cópias com o nome alterado:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_TITLE="Localize e reveja ficheiros grandes"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_DESC="Os ficheiros grandes fora das pastas do Gestor de media e da pasta <code>files</code> são muitas vezes arquivos de cópia de segurança, cópias da base de dados ou ficheiros de registo esquecidos. Podem revelar informações sensíveis se puderem ser transferidos, e desperdiçam espaço em disco. Reveja-os e remova os de que não precisa. Pode alterar o limite de tamanho, ou desligar esta verificação, em Admin Tools, Opções, separador Scanner de Ficheiros."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_MSG_FAIL="%d ficheiro(s) grande(s) encontrado(s):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_TITLE="Ficheiros e pastas ocultos"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_DESC="Os ficheiros e pastas cujo nome começa por um ponto ficam ocultos na maioria das listagens de ficheiros. Alguns são legítimos, como <code>.htaccess</code>, <code>.htpasswd</code>, <code>.user.ini</code> e <code>.well-known</code>, que não são reportados. Outros, como <code>.git</code>, <code>.env</code> ou definições de editores, revelam informações sobre o seu site e não devem estar num site em produção. Os atacantes também gostam de esconder os seus ficheiros desta forma."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_MSG_FAIL="%d ficheiro(s) e pasta(s) oculto(s) encontrado(s):"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_TITLE="Outras Ferramentas"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_DESC="Estas funcionalidades do Admin Tools podem ajudá-lo a manter o seu site em boas condições. Aqui nada é verificado; dê uma vista de olhos e decida se lhe são úteis."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_TITLE="Super Utilizadores Temporários"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_DESC="Utilize os Super Utilizadores Temporários sempre que precisar de dar a alguém acesso de Super Utilizador durante um período limitado, por exemplo, ao programador de uma extensão que esteja a resolver um problema no seu site. A conta expira automaticamente."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_TITLE="Configuração de Permissões e Corrigir Permissões"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_DESC="Verifique a propriedade e as permissões dos ficheiros e pastas do seu site e aplique permissões sensatas, adequadas ao seu caso de utilização e à configuração do servidor."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_TITLE="Verificar Diretórios Temporários e de Registo"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_DESC="Execute de vez em quando Verificar Diretórios Temporários e de Registo, a partir da secção Ferramentas do Painel de Controlo, para garantir que as pastas temporárias e de registos do seu site existem e são graváveis."

COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_LABEL="Verificação do Estado do Site: analisar pastas e ficheiros excluídos"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_DESC="Durante a análise, o Scanner de Alterações em Ficheiros PHP também recolhe informações para a Verificação do Estado do Site: ficheiros PHP em pastas de multimédia, cópias com o nome alterado, ficheiros grandes e ficheiros ocultos. Quando esta opção está ativada, estas informações também são recolhidas dentro das pastas e ficheiros que excluiu da análise; estes continuam a não ser analisados quanto a alterações. As exclusões incorporadas do Admin Tools (pastas temporárias, de registos e de cache) são sempre ignoradas."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_LABEL="Verificação do Estado do Site: reportar ficheiros grandes"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_DESC="Permite que a Verificação do Estado do Site liste os ficheiros grandes que o Scanner de Alterações em Ficheiros PHP encontrou no seu site, para que os possa rever. Os ficheiros nas pastas do Gestor de media (por exemplo, <code>images</code>) e na pasta <code>files</code> nunca são reportados, pois é normal existirem ficheiros grandes nesses locais."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_LABEL="Verificação do Estado do Site: tamanho de ficheiro grande (MiB)"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_DESC="Os ficheiros com pelo menos este tamanho, em MiB, são reportados como ficheiros grandes pela Verificação do Estado do Site. A alteração produz efeito na próxima execução do Scanner de Alterações em Ficheiros PHP."
