COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_HEAD="Modo de Recuperação"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_MESSAGE="O Admin Tools está a executar em Modo de Recuperação. Este é um modo de resolução de problemas que lhe permite desbloquear-se caso tenha bloqueado acidentalmente o acesso ao seu site. As proteções do Admin Tools estão temporariamente desativadas apenas para o acesso do administrador pela sua conta e apenas a partir do seu browser e endereço IP. Enquanto vir esta mensagem, o Admin Tools continua a proteger o seu site."
