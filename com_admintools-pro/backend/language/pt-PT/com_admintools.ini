COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK_YES="<b>Muito provavelmente sim</b>. Detetámos que o tipo do seu servidor web é NginX. No entanto, o suporte a configuração personalizada por site depende do seu alojador. Por favor, consulte o seu alojador sobre a forma correta de utilizar um ficheiro nginx.conf personalizado com o seu site."

