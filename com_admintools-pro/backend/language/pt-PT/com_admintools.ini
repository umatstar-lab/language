COM_ADMINTOOLS_WAFDENYLIST_EMPTYSTATE_BUTTON_ADD="Adicionar uma regra da Lista Negra do WAF"

COM_ADMINTOOLS_WAFDENYLIST_TABLE_CAPTION="Tabela de regras da Lista Negra do WAF."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_ERR_ALLEMPTY="Deve fornecer pelo menos um valor para Componente, Vista, Tarefa ou Parâmetro para que a regra da Lista Negra do WAF seja válida."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION="Aplicação"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION_DESC="A que aplicação Joomla! deve esta regra ser aplicada. Frontend é a área pública do seu site, Backend é a interface de administração (<code>/administrator/</code> URLs), API é a aplicação API do Joomla! (<code>/api/</code> URLs). \"(Qualquer)\" aplica a regra em todas as aplicações."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_APPLICATION_SELECT="– Aplicação –"
