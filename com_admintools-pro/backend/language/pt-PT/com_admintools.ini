COM_ADMINTOOLS_WAFDENYLISTS_LBL_VERB_HEAD="HEAD"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VERB_TRACE="TRACE"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_OPTION="Componente"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_OPTION_ALL="(Todos)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_OPTION_DESC="O nome do componente Joomla! ao qual esta regra corresponde. Deixar em branco (\"– Componente –\") corresponde a todos os componentes."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_OPTION_SELECT="– Componente –"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW="Nome da Vista"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_DESC="A vista (área do componente) ou o nome do controlador do componente que deve estar presente no URL para que esta regra corresponda. Desative os URLs SEF e verá <code>view=NomeDaVista</code> ou <code>task=NomeDaVista.NomeDaTarefa</code>, onde <var>NomeDaVista</var> é o Nome da Vista a introduzir aqui. Deixar em branco corresponde a todas as vistas."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_ANY="(Todas)"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK="Tarefa"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_ANY="(Todas)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_DESC="Qual a tarefa (um comando para uma área específica do componente) a aplicar nesta regra. Desative os URLs SEF e verá <code>task=NomeDaTarefa</code> ou <code>task=NomeDaVista.NomeDaTarefa</code>, onde <var>NomeDaTarefa</var> é a Tarefa a introduzir aqui. Deixar em branco corresponde a todas as vistas."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY="Parâmetro de Consulta"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_DESC="Qual o conteúdo do parâmetro de cadeia de consulta a utilizar para fazer corresponder esta regra, por exemplo <code>id</code>. Deixe em branco para que a regra corresponda independentemente do conteúdo do parâmetro de consulta. Note que a correspondência do conteúdo de consulta é sempre aplicada <strong>após</strong> o Joomla! ter convertido um URL SEF para o seu formato não-SEF. Isto significa que alguns parâmetros de consulta podem não estar visíveis para si — embora estejam visíveis para o Joomla! e para o Admin Tools, podendo assim resultar no bloqueio do pedido pela Firewall de Aplicações Web — a não ser que desative os URLs SEF."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE="Tipo de filtro do Parâmetro de Consulta"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_ANY="(Todos)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_DESC="Escolha como o Parâmetro de Consulta será correspondido. \"RegEx\" significa que o campo Parâmetro de Consulta contém uma <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">expressão regular PHP</a> para corresponder ao conteúdo do parâmetro de consulta. Pode negar uma expressão regular prefixando-a com um ponto de exclamação (<code>!</code>). \"Exato\" significa que o nome do parâmetro de consulta deve corresponder exatamente ao campo Parâmetro de Consulta tal como introduzido, incluindo maiúsculas e minúsculas. \"Parcial\" significa que o nome do parâmetro de consulta deve incluir o Parâmetro de Consulta introduzido; por exemplo, o Parâmetro de Consulta \"bar\" corresponderá a qualquer um dos seguintes nomes de parâmetro de consulta: \"re<em>bar</em>\", \"<em>bar</em>tender\" e \"<em>bar</em>\"."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_EXACT="Exato"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_PARTIAL="Parcial"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_REGEX="RegEx"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT="Conteúdo da Consulta"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_ANY="(Qualquer conteúdo)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_DESC="Deixe em branco para que a regra corresponda independentemente do conteúdo da consulta. Caso contrário, forneça uma <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">expressão regular PHP</a>; se corresponder ao conteúdo do parâmetro de consulta, a regra é aplicada. Pode negar uma expressão regular prefixando-a com um ponto de exclamação (<code>!</code>)."

COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_COPIED="%d regras da Lista Negra do WAF foram copiadas."
COM_ADMINTOOLS_WAFDENYLISTS_N_ITEMS_COPIED_1="A regra da Lista Negra do WAF foi copiada."
