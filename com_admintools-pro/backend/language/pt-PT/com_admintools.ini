COM_ADMINTOOLS_CORESUMS_WARN_HEAD="Verificação dos ficheiros do núcleo indisponível"
COM_ADMINTOOLS_CORESUMS_WARN_BODY="A execução mais recente do Scanner de Alterações em Ficheiros PHP não conseguiu transferir os dados de checksums do CoreSums, pelo que os ficheiros não foram verificados face aos checksums oficiais do núcleo do Joomla. A análise foi concluída à mesma, mas nenhum ficheiro foi marcado como do núcleo ou não do núcleo. Trata-se normalmente de um problema temporário de rede. Se persistir, verifique as opções \"URL do serviço CoreSums\" e \"Tempo limite de transferência do CoreSums\" na configuração do componente."
