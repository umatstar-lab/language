COM_ADMINTOOLS_TITLE_ADMINPASSWORD="Proteger Administrador por Palavra-passe"

COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOPASSWORD="Tem de fornecer uma palavra-passe"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTAPPLIED="Não foi possível aplicar a proteção por palavra-passe. Ative a camada FTP na Configuração Global do seu site."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTUNAPPLIED="Não foi possível remover a proteção por palavra-passe. Ative a camada FTP na Configuração Global do seu site."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOUSERNAME="Tem de fornecer um nome de utilizador"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_PASSWORDNOMATCH="As palavras-passe não coincidem"

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HOWITWORKS="Como funciona isto?"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_INFO="Ao aplicar a proteção por palavra-passe, o seu browser irá solicitar um nome de utilizador e uma palavra-passe sempre que for solicitado o URL de um recurso protegido na pasta <code>administrator</code>. Terá de introduzir o nome de utilizador e a palavra-passe definidos nesta página. Este nome de utilizador e palavra-passe são <em>comuns</em> a todos os que gerem o seu site e <em>devem ser diferentes</em> do seu acesso ao Joomla!. Isto funciona ao nível do servidor, utilizando um ficheiro <code>.htaccess</code> na pasta <code>administrator</code> do seu site. O seu servidor tem de suportar proteção de diretório por palavra-passe com ficheiros .htaccess para esta funcionalidade ter efeito. Se não tiver a certeza, consulte o seu alojamento."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_WARN="Tenha em atenção que esta proteção é aplicada mesmo que desative ou desinstale o Admin Tools. Se a sua área de administração ficar inacessível, ou se precisar de remover a proteção por palavra-passe sem ter acesso a esta página, terá de <strong>eliminar</strong> os ficheiros <code>.htaccess</code> e <code>.htpasswd</code> da pasta <code>administrator</code> do seu site via FTP, SFTP ou o Gestor de Ficheiros do painel de controlo do seu alojamento."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORDPROTECTION="Configurar a Proteção por Palavra-passe do Administrador"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES="Repor páginas de erro personalizadas"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES_HELP="Repõe as páginas de erro personalizadas do Apache para HTTP 401 e 403 com as definições predefinidas. Isto evita que apareça um erro 404 Artigo Não Encontrado ao tentar aceder à página de início de sessão do administrador depois de ativar a funcionalidade de Proteção por Palavra-passe do Administrador. Recomenda-se vivamente manter esta opção ativada, a não ser que provoque um erro HTTP 500 Internal Server Error."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE="Recursos do administrador a proteger"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_JOOMLA="Joomla"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_PHP="Todos os ficheiros PHP"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_EVERYTHING="Tudo"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_HELP="Escolha o que será protegido por palavra-passe. \"Joomla\" protege apenas o index.php do Joomla! (o ponto de entrada da aplicação do administrador). Todo o resto pode ser acedido livremente, incluindo ficheiros .php de aplicações de terceiros. \"Todos os ficheiros PHP\" protege todos os ficheiros PHP na pasta <code>administrator</code> e as suas subdiretorias. \"Tudo\" funciona da mesma forma que as versões antigas do Admin Tools, proibindo o acesso a qualquer ficheiro na pasta <code>administrator</code> e nas suas subdiretorias, independentemente da extensão."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE="Algoritmo de hash de palavra-passe"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_HELP="As palavras-passe são armazenadas com hash no ficheiro <code>administrator/.htpasswd</code>. Esta opção seleciona o algoritmo de hash. bCrypt é o mais seguro, mas nem sempre é suportado. APR-1 (predefinição) é suficientemente seguro e suportado pela maioria dos alojamentos. SHA-1 é sempre suportado, mas já não é considerado seguro. crypt() só permite palavras-passe até 8 caracteres, não é suportado no Windows e é considerado inseguro. Texto Simples não aplica qualquer hash e NUNCA deve ser utilizado para outro fim que não a resolução de problemas, com uma palavra-passe descartável que deve ser imediatamente considerada comprometida."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_APR1="APR-1"
