[Configurewaf]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Configure WAF
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;


COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS="Monitorizar configuração de componentes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS_TIP="Quando esta opção está ativada e alguém tenta alterar a configuração de qualquer componente do núcleo do Joomla! ou de terceiros (o que vê quando clica em Opções na barra de ferramentas de um componente) a partir da área de administração do seu site, será notificado ou o acesso será bloqueado (conforme as definições abaixo)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL="Monitorizar Configuração Global"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL_TIP="Quando esta opção está ativada e alguém tenta alterar a Configuração Global do Joomla!, seja a partir da área de administração ou da parte pública, será notificado ou o acesso será bloqueado (conforme as definições abaixo)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL="Enviar e-mail para este endereço em alterações monitorizadas de configuração"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL_TIP="Os endereços de e-mail, separados por vírgulas, para os quais pretende receber notificações sobre qualquer alteração na configuração global e/ou de componentes monitorizada. Se este campo for deixado em branco, será utilizado o endereço de e-mail definido na opção “Enviar e-mail para este endereço após um bloqueio automático de IP”. Se ambos os campos estiverem vazios, será enviado um e-mail a todas as contas de Super Utilizador ativadas que tenham a opção Receber E-mail do Sistema ativada no seu perfil de utilizador."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN="Avisar sobre Self XSS"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN_TIP="Apresenta uma mensagem na consola do navegador para avisar o utilizador a evitar executar qualquer comando dentro desta. Isto pode levar a comprometer a sua própria conta (ataques Self XSS) e à divulgação dos seus dados de acesso."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES="Monitorizar Ficheiros Críticos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL="Monitorizar alterações nestes ficheiros"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL_TIP="Monitorize os seguintes ficheiros (um por entrada) para detetar alterações. Se uma alteração for detetada, será notificado por e-mail. Os caminhos dos ficheiros são relativos à raiz do seu site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_TIP="Os ficheiros críticos frequentemente modificados por atacantes (index.php, administrator/index.php e os ficheiros index.php, error.php e component.php de todos os templates instalados no site) serão monitorizados para detetar alterações em cada carregamento de página. Se uma alteração for detetada, será notificado por e-mail. Isto permite-lhe geralmente receber um aviso antecipado em caso de uma tentativa de intrusão bem-sucedida."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL="Enviar e-mail para este endereço em alterações de ficheiros monitorizados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL_TIP="Os endereços de e-mail, separados por vírgulas, para os quais pretende receber notificações sobre qualquer alteração nos ficheiros críticos e/ou personalizados monitorizados. Se este campo for deixado em branco, será utilizado o endereço de e-mail definido na opção “Enviar e-mail para este endereço após um bloqueio automático de IP”. Se ambos os campos estiverem vazios, será enviado um e-mail a todas as contas de Super Utilizador ativadas que tenham a opção Receber E-mail do Sistema ativada no seu perfil de utilizador."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR="Personalizar a meta tag generator"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR_TIP="Todas as instalações do Joomla! definem a meta tag generator, um fragmento HTML no cabeçalho de todas as páginas, para publicitar o facto de o seu site estar a correr em Joomla!. Esta informação é indexada pelos motores de busca e é explorada por atacantes para deduzir que o seu site utiliza Joomla! quando procuram alvos potenciais. Ativar esta opção permite-lhe definir um valor personalizado para a meta tag generator na opção seguinte. Seja criativo!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USEROPTS="Reforço da Gestão de Utilizadores"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR="Monitorização"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS="Desativar utilizadores em caso de falha de autenticação"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS_TIP="O Admin Tools pode opcionalmente desativar contas de utilizador existentes quando existem múltiplas tentativas falhadas de autenticação com o respetivo nome de utilizador, protegendo as contas contra ataques de força bruta. Aqui pode especificar o número de falhas de autenticação e o período de tempo durante o qual estas devem ocorrer antes de o utilizador ser desativado, por exemplo, 3 falhas de autenticação em 1 minuto. Definir o número de falhas de autenticação para 0 desativa esta funcionalidade."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD="Escudo contra Inclusão Direta de Ficheiros (DFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD_TIP="Quando esta opção está ativada, o Admin Tools verifica os parâmetros GET e POST de cada pedido ao frontend do seu site. O pedido é bloqueado se um parâmetro contiver um byte nulo, ou se o seu valor parecer um caminho de ficheiro, por começar com uma barra, com ../ ou com uma letra de unidade como C:, e indicar um ficheiro ou uma pasta que existe no seu servidor, seja qual for o tipo. Um valor composto apenas por barras, p. ex. return=/, não é bloqueado."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET="Desativar redefinição de palavra-passe para grupos de utilizadores específicos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_TIP="Bloqueia os utilizadores pertencentes a um dos Grupos de Utilizadores selecionados de solicitarem uma redefinição de palavra-passe através da funcionalidade “Esqueceu-se da palavra-passe?” na parte pública do site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS="Grupos de utilizadores bloqueados de redefinir a palavra-passe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS_TIP="Os utilizadores nestes grupos de utilizadores não poderão solicitar uma redefinição de palavra-passe. Não é necessário adicionar grupos com permissões de Super Utilizador; estes são bloqueados automaticamente pelo próprio Joomla!."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_HEAD="Bloqueio de Utilizadores Esquecidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS="Impedir utilizadores de administração esquecidos de iniciar sessão"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION="Método de prevenção de acesso"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_RESET="Forçar redefinição de palavra-passe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_TIP="Escolha como o Admin Tools irá aplicar a prevenção de acesso para os utilizadores esquecidos. “Bloquear” irá bloquear permanentemente o utilizador; um Super Utilizador terá de o desbloquear manualmente. “Forçar redefinição de palavra-passe” (recomendado) irá forçar o utilizador a redefinir a sua palavra-passe na próxima vez que iniciar sessão e não lhe permitirá fazer mais nada no site até concluir a redefinição da palavra-passe."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ="Verificar a cada [minutos]"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ_TIP="Executar esta verificação no máximo uma vez a cada este número de minutos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS="Grupos de utilizadores de administração"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS_TIP="A quais grupos de utilizadores com acesso à administração se aplica esta funcionalidade? Selecione nenhum grupo para aplicar a todos os grupos de utilizadores com acesso de autenticação à área de administração do seu site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS="Número máximo de dias desde o último acesso"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS_TIP="Os utilizadores que pertencem aos grupos de utilizadores especificados acima e que não iniciaram sessão há pelo menos este número de dias serão impedidos de iniciar sessão."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED="Utilizadores protegidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED_TIP="Estes utilizadores nunca serão bloqueados. É recomendado que coloque apenas um número <strong>muito</strong> limitado de contas de utilizador nesta lista. Normalmente, deverão ser as contas do proprietário do site e do programador, mais ninguém (especialmente <strong>NÃO</strong> outros membros da equipa que possam sair enquanto as suas contas de utilizador ficam por eliminar, ou seja, o propósito principal desta proteção)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_TIP="Impedir utilizadores com acesso à administração que não iniciaram sessão há muito tempo de aceder ao site. Muito provavelmente são utilizadores obsoletos que se esqueceu de remover e cuja palavra-passe foi comprometida entretanto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN="Enviar e-mail para este endereço em caso de falha de autenticação de administrador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN_TIP="Introduza um endereço de e-mail para ser notificado quando ocorre uma tentativa de autenticação falhada na área de administração do seu site. Deixe em branco para não receber notificações. Certifique-se de que o seu site consegue enviar e-mails primeiro!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN="Enviar e-mail para este endereço em caso de autenticação bem-sucedida na administração"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN_TIP="Introduza um endereço de e-mail para ser notificado quando ocorre uma autenticação bem-sucedida na área de administração do seu site. Deixe em branco para não receber notificações. Certifique-se de que o seu site consegue enviar e-mails primeiro!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES="Enviar e-mail para este endereço em caso de pedido bloqueado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES_TIP="Introduza um endereço de e-mail para ser notificado quando qualquer pedido é bloqueado no seu site. Deixe em branco para não receber notificações. Certifique-se de que o seu site consegue enviar e-mails primeiro!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS="Enviar exceções PHP por e-mail para este endereço"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS_TIP="Sempre que uma exceção PHP não tratada for gerada (ou seja, um erro numa consulta à base de dados), o Admin Tools enviará um e-mail com todos os detalhes (hora, ficheiro e linha que gerou a exceção) para posterior depuração."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE="Ativar limitação de e-mails de pedidos bloqueados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE_TIP="Quando ativado, a frequência dos e-mails enviados pelo Admin Tools pode ser limitada. Consulte os Templates de E-mail para as definições de frequência máxima de e-mails."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION="Filtrar registo de utilizadores por e-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_ALLOW="Permitir"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_TIP="Escolha se o Admin Tools deve apenas permitir ou bloquear domínios de e-mail da lista abaixo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS="Bloquear também IPs suspeitos, não apenas spammers confirmados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS_TIP="Por vezes o Project Honeypot não tem a certeza se um IP pertence a um spammer ou se é um utilizador infeliz que clicou numa hiperligação errada. Nesse caso, o IP é marcado como \"suspeito\". O comportamento predefinido é não bloquear estes IPs. No entanto, se estiver a receber muito spam, é uma boa ideia ativar esta funcionalidade e bloquear mesmo os IPs \"suspeitos\". Em última análise, alguns utilizadores infelizes poderão ser bloqueados inadvertidamente, por isso utilize esta opção com cautela!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE="Ativar filtragem HTTP:BL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE_TIP="Ativa a integração com o <a href='http://www.projecthoneypot.org'>Project Honeypot</a>. <strong>IMPORTANTE</strong>: É necessário registar-se no Project Honeypot, obter uma chave e introduzi-la na opção seguinte para que esta funcionalidade funcione."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE="Idade máxima de resultados HTTP:BL aceites (dias)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE_TIP="O Project Honeypot informa quando foi a última vez que este IP foi apanhado a enviar mensagens de spam. Quanto mais antiga for esta informação (quanto maior for a idade), menor é a probabilidade de este IP ainda ser utilizado por um spammer. Pode escolher aqui qual será a idade máxima reportada que será bloqueada. O valor predefinido de 30 significa que os IPs que enviaram uma mensagem de spam nos últimos 30 dias serão bloqueados."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD="Classificação de ameaça mínima para bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD_TIP="O Project Honeypot utiliza uma \"classificação de ameaça\" logarítmica para classificar a probabilidade de um IP específico ser um spammer. Esta opção define o nível mínimo de ameaça que um IP deve ter antes de ser bloqueado. Um valor de 25 significa que este IP submeteu 100 mensagens de spam nos honeypots de captura de spam do Project Honeypot e é geralmente uma indicação segura de que pertence a um spammer. Note que a classificação é logarítmica. Um valor de 50 significa 1.000 mensagens de spam e um valor de 75 significa um milhão de mensagens de spam. Não defina valores acima de 50, pois muito provavelmente nunca bloqueará nenhum spammer. O valor predefinido é 25 (100 mensagens de spam detetadas a partir desse endereço IP)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL="Não permitir acesso ao site a IPs na Lista de IPs Não Permitidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL_TIP="Quando ativado, se o IP do visitante estiver na Lista de IPs Não Permitidos (consulte a funcionalidade Lista de IPs Não Permitidos), receberá imediatamente um erro 403 Proibido ao tentar aceder ao seu site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL="Permitir acesso de administrador apenas a IPs na Lista Exclusiva de IPs Permitidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL_TIP="Quando ativado, apenas os IPs na Lista Exclusiva de IPs Permitidos (consulte a funcionalidade Lista Exclusiva de IPs Permitidos para Administrador) poderão aceder à área de administração do site. Todas as outras tentativas de acesso às páginas de administração serão redirecionadas para a página inicial do site. Tenha cuidado ao utilizar esta funcionalidade! Se não tiver adicionado o seu próprio IP à Lista Exclusiva de IPs Permitidos, ficará sem acesso à sua área de administração!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD="ItemidShield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_TIP="Quando ativado, o Admin Tools irá bloquear qualquer valor inválido para o parâmetro de URL ItemId ou tentará limpá-lo para um valor inteiro válido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_OFF="Desativado"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_BLOCK="Bloquear"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_CLEAN="Limpar"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS="Bloquear Parâmetros Principais Suspeitos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS_TIP="Bloqueia pedidos com valores suspeitos nos parâmetros principais da string de consulta do Joomla!, tais como <code>option</code>, <code>view</code>, <code>task</code>, etc."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD="Avisar sobre utilização de palavras-passe conhecidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS="Grupos de utilizadores a verificar quanto a palavras-passe conhecidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS_TIP="O Admin Tools irá verificar palavras-passe conhecidas apenas para utilizadores pertencentes a esses grupos (por omissão, Super Utilizadores)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_TIP="Quando esta opção está ativada, o Admin Tools irá ligar-se à base de dados Have I Been Pwned e verificar se o hash da palavra-passe atual é conhecido. Se for encontrada uma correspondência, o utilizador será impedido de utilizar uma palavra-passe insegura."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES="Registar pedidos bloqueados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES_TIP="Sugere-se que mantenha esta opção ativada. Quando ativada, todas as potenciais violações de segurança — bloqueadas pelo Admin Tools — serão registadas na base de dados e disponibilizadas na ferramenta Registo de Pedidos Bloqueados."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE="Manter um ficheiro de registo de depuração"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE_TIP="O Admin Tools pode opcionalmente manter um ficheiro de registo dentro da pasta de registos do Joomla! configurada. Quando esta opção está ativada, é adicionada uma entrada ao ficheiro de registo sempre que um pedido é bloqueado. Esta entrada contém informações adicionais úteis para resolução de problemas, incluindo um dump completo dos dados do pedido. Isto significa que poderá estar a armazenar informações pessoais identificáveis ou sensíveis num ficheiro não encriptado. Recomenda-se que apenas ative esta opção quando estiver a resolver um problema difuso e que a desative quando tiver recolhido informações suficientes para resolver o problema."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES="Registar nomes de utilizador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES_TIP="Quando ativado, o Admin Tools irá incluir o nome de utilizador ao registar falhas de autenticação (ver acima). AVISO! Recomendamos vivamente que mantenha esta opção desativada para evitar problemas com o RGPD"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD="Bloqueio de Agente de Utilizador Malicioso (MUAShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD_TIP="Muitos atacantes tentarão aceder ao seu site utilizando um navegador configurado para enviar código PHP malicioso na sua string de agente de utilizador (um pequeno fragmento de texto utilizado para descrever o navegador ao servidor). A ideia é que software de processamento de registos com falhas irá analisá-lo e permitir ao atacante obter controlo do seu site. Quando ativada, esta funcionalidade permite ao Admin Tools detetar tais ataques e bloquear o pedido."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN="Proibir autenticação de Super Administrador na parte pública"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN_TIP="Quando ativado, não será possível aos Super Administradores iniciarem sessão na parte pública do seu site. Esta é uma precaução de segurança contra ataques de força bruta a palavras-passe. Mesmo utilizadores com privilégios de Super Utilizador não poderão iniciar sessão na parte pública do seu site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS="Desativar edição de propriedades de utilizadores"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_TIP="Quando ativado, tentar modificar as definições de um Gestor, Administrador ou Super Administrador existente ou criar um novo falhará."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS="Desativar edição de propriedades de utilizadores para estes grupos de utilizadores"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS_TIP="A quais grupos de utilizadores com acesso à administração se aplica esta funcionalidade? Se não selecionar nenhum grupo, o Admin Tools irá desativar a edição de propriedades de utilizadores para todos os utilizadores que tenham acesso de autenticação à área de administração do seu site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS="Desativar criação / edição de utilizadores a partir do frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_TIP="Normalmente não deverá ser possível criar um novo utilizador com privilégios de acesso à administração a partir do frontend público. Quando esta opção está ativada, tentativas de criar este tipo de contas serão tratadas como tentativas de pirataria e bloqueadas. Esta opção resolve alguns dos ataques de dia zero mais conhecidos no Joomla! que ocorreram entre 2015 e 2016."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS="Desativar criação / edição de utilizadores nestes grupos a partir do frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS_TIP="A quais grupos de utilizadores com acesso à administração se aplica esta funcionalidade? Se não selecionar nenhum grupo, o Admin Tools irá desativar a criação ou edição de utilizadores a partir do frontend para todos os utilizadores que tenham ou venham a ter acesso de autenticação à área de administração do site."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD="Bloqueio de stream wrappers PHP (PHPShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD_TIP="Alguns piratas informáticos tentarão utilizar os chamados PHP stream wrappers (que se parecem com URLs começando por php://, phar://, etc.) para manipular furtivamente ficheiros do seu site, contornando os controlos de upload de ficheiros integrados no Joomla!. Quando esta opção está ativada, o Admin Tools bloqueará todos os pedidos que contenham texto correspondente a qualquer um dos PHP stream wrappers normalmente utilizados por piratas informáticos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL="Não enviar notificações por e-mail para estas razões"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL_TIP="Os pedidos bloqueados por estas razões não resultarão no envio de um e-mail para o endereço especificado em <em>Enviar e-mail para este endereço em pedido bloqueado</em>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG="Não registar estas razões"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG_TIP="Os pedidos bloqueados por estas razões não serão registados. Como resultado, os IPs que desencadeiem repetidamente um pedido bloqueado por esta razão não serão automaticamente banidos do seu site. Além disso, como não existe registo, será impossível saber por que motivo alguém está a ser bloqueado no acesso ao seu site quando desencadeia uma dessas razões."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA="Desativar a Autenticação de Dois Fatores do Joomla! na reposição de palavra-passe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA_TIP="Quando ativado, o Admin Tools irá desativar a configuração de Autenticação de Dois Fatores do Joomla! para um utilizador quando este repõe a sua palavra-passe. Isto aplica-se apenas à funcionalidade de Autenticação de Dois Fatores integrada no Joomla! 3.2 e posterior, não à funcionalidade de Autenticação de Dois Fatores do Admin Tools."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD="Bloqueio de Inclusão de Ficheiros Remotos (RFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD_TIP="Alguns piratas informáticos tentarão forçar uma extensão vulnerável a carregar código PHP diretamente a partir do seu servidor. Isto é feito passando um URL http(s):// ou ftp:// no pedido, apontando para o seu site malicioso. Quando esta opção está ativada, o Admin Tools procurará tais casos, tentará obter o URL remoto e analisar o seu conteúdo. Se for encontrado código PHP, o pedido será bloqueado."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP="Guardar IP de registo de utilizador em Notas de Utilizador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_TIP="Quando ativado, o IP a partir do qual os novos utilizadores se registaram será guardado como Notas de Utilizador. Os utilizadores criados através da administração não terão o seu IP guardado como Nota de Utilizador porque não faz sentido fazê-lo (é um administrador a registar a conta de utilizador em seu nome). Componentes de terceiros que criem novas contas de utilizador também podem não desencadear o evento de plugin."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY="Categoria de Notas de Utilizador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY_TIP="Selecione a Categoria de Notas de Utilizador onde o Admin Tools deve guardar o IP do utilizador, por defeito Sem Categoria"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT="Proteger contra desativação do plugin"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT_TIP="Quando ativado, o Admin Tools impedirá os utilizadores da administração de tentar desativar (despublicar) o plugin. Isto significa que também não poderá despublicar o plugin até desativar esta opção! Além disso, note que isto não tem efeito contra alguém que edite a sua base de dados diretamente; ou renomeie ou apague os ficheiros do plugin de sistema do Admin Tools (o diretório <code>plugins/system/admintools</code> no seu site). Também não protege contra a desinstalação do Admin Tools porque apenas Super Utilizadores podem fazê-lo por defeito. Se um atacante obtiver privilégios de Super Utilizador, a desativação do Admin Tools será o menor dos seus problemas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD="Proteção contra envenenamento de dados de sessão PHP (SessionShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD_TIP="Previne dados de entrada maliciosos que podem ser utilizados para enganar o gestor de sessão interno do PHP a executar código arbitrário quando está a restaurar a sessão do utilizador. ATENÇÃO: <em>Pode</em> também bloquear alguns pedidos legítimos."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD="Proteção SQLiShield contra ataques de injeção SQL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD_TIP="Quando ativado, o Admin Tools tentará detetar ataques comuns de injeção SQL contra o seu site e bloqueá-los."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST="Monitorizar contas de Super Utilizador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_TIP="O Admin Tools irá monitorizar as contas de utilizador com acesso de Super Utilizador. Se um novo Super Utilizador for adicionado fora da página de Utilizadores do Joomla será notificado por e-mail. Além disso, as novas contas de Super Utilizador detetadas serão automaticamente bloqueadas. Os utilizadores criados ou adicionados por outros Super Utilizadores na administração do site através da página de Utilizadores do Joomla NÃO serão bloqueados por esta funcionalidade. Por favor utilize a funcionalidade &ldquo;Desativar edição de propriedades de utilizadores&rdquo; para evitar isto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL="Enviar e-mail para este endereço em alteração de Super Utilizadores"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL_TIP="Os endereços de e-mail, separados por vírgulas, para os quais pretende ser notificado sobre qualquer tentativa de alteração (e bloqueada!) na lista de Super Utilizadores do seu site. Se este campo for deixado em branco, será utilizado o endereço de e-mail configurado na opção \"Enviar e-mail para este endereço após um bloqueio automático de IP\". Se ambos os campos estiverem vazios, será enviado um e-mail para todas as contas de Super Utilizador ativadas que tenham a opção Receber E-mail do Sistema ativada no seu perfil de utilizador."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE="Bloquear comutação de template do site com template=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE_TIP="Outra funcionalidade oculta do Joomla! é a capacidade de alternar entre templates instalados passando um parâmetro de URL especial. Por exemplo, se pretender aplicar o template Beez5, basta passar o parâmetro <code>?template=beez5</code>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL="Bloquear comutação de template de sistema com tmpl=foo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST="Lista de palavras-chave tmpl= permitidas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST_TIP="Uma palavra-chave tmpl por entrada. As entradas component e system são sempre adicionadas, independentemente de as adicionar explicitamente aqui."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL_TIP="Uma das funcionalidades menos conhecidas do Joomla! são os seus templates de sistema. Sempre que ocorre um erro ou coloca o seu site offline, o Joomla! carrega o respetivo template de sistema. Passar o nome do template no URL acrescentando, por exemplo, ?tmpl=offline permite-lhe testar esses templates sem ter de produzir efetivamente um erro ou colocar o site offline. Ativar esta opção irá desligar esta funcionalidade oculta do Joomla!. Note que tmpl=system e tmpl=component têm de ser permitidos (ver opção seguinte), pois são necessários por algumas extensões para funcionar."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS="Tratar falhas de autenticação como razão para bloquear o pedido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS_TIP="Quando ativado, as tentativas de autenticação falhadas de qualquer tipo de utilizador (mesmo simples utilizadores registados) contam como razão válida para bloquear o pedido e são registadas no Registo de Pedidos Bloqueados do Admin Tools. Existe uma implicação muito útil para isso. Uma vez que contam como razões para bloquear um pedido, também contam para o limite configurado no bloqueio automático de IP. Portanto, após um número de tentativas de autenticação falhadas, o IP do utilizador será automaticamente bloqueado pelo período de tempo configurado."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL="Enviar e-mail de resolução de problemas em funções administrativas"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL_TIP="Envia um e-mail ao utilizador da administração atualmente autenticado sempre que este execute uma função administrativa do Admin Tools que possa resultar no seu bloqueio do site ou no site deixar de funcionar corretamente. O e-mail contém ligações para os artigos de resolução de problemas que o ajudam a retificar o problema e a restaurar o site ao seu estado de funcionamento. É muito aconselhável manter esta funcionalidade ativada. Seguir as informações de resolução de problemas é muito mais rápido do que aguardar uma resposta do nosso suporte."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD="Scanner de ficheiros enviados (UploadShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_TIP="Inspeciona todos os ficheiros enviados para o seu site e bloqueia o pedido quando o ficheiro parece poder ser usado para executar código no seu servidor. Isto protege-o contra extensões de terceiros vulneráveis que permitem aos atacantes enviar ficheiros arbitrários. Os envios feitos por Super Utilizadores autenticados nunca são inspecionados."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS="UploadShield: impedir a substituição via .htaccess"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS_TIP="Bloqueia o pedido quando é enviado um ficheiro com o nome .htaccess cujo conteúdo inclui uma diretiva SetHandler ou AddHandler do Apache. Os atacantes usam estas diretivas para fazer com que o Apache execute como código PHP ficheiros que de outra forma seriam inertes, como imagens."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT="UploadShield: impedir o envio de ficheiros com múltiplas extensões"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT_TIP="Bloqueia o pedido quando qualquer parte do nome do ficheiro enviado se assemelha a uma extensão de ficheiro PHP, por exemplo evil.php.jpg ou evil.jpg.php5. Algumas configurações incorretas do servidor executam esses ficheiros como código PHP, independentemente do seu tipo aparente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT="UploadShield: impedir o envio de ficheiros PHP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT_TIP="Bloqueia o pedido quando a extensão do ficheiro enviado é uma extensão de ficheiro PHP, como .php, .phps, .phtml, .inc, .php7 e assim por diante."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT="UploadShield: impedir conteúdo PHP nos envios"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT_TIP="Bloqueia o pedido quando um ficheiro enviado contém algo que se assemelha a código PHP, independentemente do nome do ficheiro. Isto apanha ataques que escondem código PHP dentro de um ficheiro de imagem ou documento que de outra forma seria válido."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW="Mostrar erros usando um template HTML personalizável"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW_TIP="Por defeito, a Mensagem de Pedido Bloqueado será mostrada utilizando a página de mensagem de erro padrão do Joomla!. Quando esta opção está ativada, no entanto, o Admin Tools utilizará um template HTML personalizável. O ficheiro de template HTML predefinido está localizado no ficheiro components/com_admintools/View/Blocks/tmpl/default.php. NÃO MODIFIQUE ESTE FICHEIRO DIRETAMENTE! Consulte a documentação para o método correto de criar uma substituição de template."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS="Domínios nunca bloqueados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS_TIP="Se o endereço IP de um visitante cujo pedido é bloqueado resolver para um nome de domínio que termine com o que introduzir aqui, o pedido continua a ser bloqueado, mas não é registado, não é enviado nenhum e-mail sobre ele e o endereço IP nunca é bloqueado automaticamente. O nome de domínio tem também de resolver de volta para o endereço IP do visitante, pelo que um registo DNS inverso forjado não conta. Note que uma lista longa causará um grande impacto no desempenho. A lista está vazia por predefinição. Para motores de pesquisa e crawlers de IA, utilize antes o separador Rastreadores."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN="Adicionar infratores persistentes à Lista de IPs Não Permitidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM="Proibir IP permanentemente após este número de bloqueios automáticos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_2="bloqueios automáticos de IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_TIP="Quando a opção anterior está ativada, após quantos bloqueios automáticos um IP será permanentemente banido (adicionado à Lista de IPs Não Permitidos)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN_TIP="Se um IP desencadear este número de bloqueios automáticos será permanentemente banido (adicionado à Lista de IPs Não Permitidos) se estiver prestes a ser novamente bloqueado automaticamente. Certifique-se de que ativa a funcionalidade Lista de IPs Não Permitidos definindo <em>Proibir acesso ao site para IPs na Lista de IPs Não Permitidos</em> como Sim, caso contrário a adição permanente à Lista de IPs Não Permitidos não terá efeito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PROJECTHONEYPOT="Project Honeypot"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_BODY="<p>O utilizador registou-se no site utilizando o endereço IP <strong>%s</strong></p><p>A cadeia de agente de utilizador do browser do utilizador foi:<br/>%s</p><p>Esta informação foi automaticamente registada nesta Nota de Utilizador pelo Admin Tools Professional.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_SUBJECT="Endereço IP de registo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE="Mostrar esta mensagem aos IPs bloqueados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE_TIP="Permite-lhe mostrar uma mensagem específica aos endereços IP bloqueados. Pode querer explicar ao utilizador que o seu IP foi bloqueado porque foi detetada atividade suspeita originada no seu endereço IP. Pode utilizar o texto especial [IP] em letras maiúsculas, sem espaços entre os parênteses e IP, para mostrar o IP do utilizador na mensagem. Isto pode ser útil se alguém for bloqueado acidentalmente e lhe pedir ajuda."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSR="Bloqueio automático"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM="Duração do bloqueio"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM_TIP="Quanto tempo durará o bloqueio. Por exemplo, definir para 1 dia bloqueará todo o acesso deste endereço IP durante um dia inteiro. Introduza o número neste campo, selecione a unidade de medida de tempo no campo seguinte."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY="Unidade de medida de tempo para a duração do bloqueio"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY_TIP="A unidade de medida de tempo para a definição \"Duração do bloqueio\" acima. Escolha entre segundos, minutos, dias ou horas."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE="Bloqueio de IP para infratores reincidentes"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE_TIP="Quando definido como sim, o endereço IP dos infratores reincidentes será automaticamente banido com base nas restantes definições"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES="Bloquear IP após este número de pedidos bloqueados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES_TIP="Quando os pedidos de um endereço IP são bloqueados pelo menos este número de vezes dentro do período de tempo definido pelas duas opções seguintes, será temporariamente impedido de aceder ao site. Por exemplo, se definir para 3 ataques em 1 hora, o Admin Tools irá proibir o acesso de um endereço IP que tenha tido pelo menos 3 dos seus pedidos bloqueados na última hora. Introduza o valor 0 para desativar esta funcionalidade."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ="Período de tempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ_TIP="O número de pedidos bloqueados definido acima deve ocorrer dentro deste número de segundos, minutos, horas ou dias. Introduza o número aqui; escolha a unidade de medida de tempo na opção abaixo."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY="Unidade de medida de tempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY_TIP="A unidade de medida de tempo para a definição \"Período de tempo\" acima. Escolha entre segundos, minutos, dias ou horas."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN="Autenticação por palavra-passe quando o login por passkey está ativado para uma conta de utilizador"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_TIP="Se um utilizador ativar a autenticação por passkey para a sua conta de utilizador, deverá ser-lhe permitido autenticar-se alternativamente com uma palavra-passe?"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_ALLOWED="Sempre permitido (predefinição do Joomla)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_USERDECIDES="Deixar os utilizadores decidir"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERALLOWED="Desativado para utilizadores da administração, permitido para outros"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERDECIDE="Desativado para utilizadores da administração, deixar outros decidir"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBODY="Desativado para todos"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS="Domínios permitidos"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS_TIP="Introduza todos os nomes de domínio totalmente qualificados aos quais o seu site deve responder, por exemplo <em>example.com, www.example.com, example.net</em>. Uma entrada por campo de texto; adicione mais campos clicando/tocando no botão verde +. Não precisa de adicionar <code>localhost</code> ou qualquer outro nome de domínio que resolva para <code>127.0.0.1</code> ou <code>::1</code> (endereços localhost). Se alguém tentar falsificar o cabeçalho HTTP Host para um nome de domínio não nesta lista receberá uma resposta HTTP 421 Misdirected Request. Esta funcionalidade previne a falsificação de cabeçalho Host em alguns servidores mal configurados."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL="Enviar e-mail para este endereço em aumento de pedidos bloqueados"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL_TIP="Será enviado um e-mail para este endereço se o Admin Tools detetar que um grande número de pedidos foi bloqueado num determinado período de tempo. Pode configurar isso abaixo; o valor predefinido é 1000 pedidos bloqueados numa hora."
