COM_ADMINTOOLS_BADWORDS_LBL_WORD="Palavra"
COM_ADMINTOOLS_BADWORDS_LBL_WORD_DESC="A Palavra Proibida que pretende bloquear. Não distingue maiúsculas de minúsculas, ou seja, <code>test</code>, <code>TEST</code> e <code>TesT</code> são consideradas a mesma palavra."
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE="Aplicar escape à expressão regular"
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE_DESC="O campo Palavra é uma expressão regular, interpolada em <code>#\b&lt;O QUE ESCREVEU&gt;\b#iu</code>. Tudo o que nele constar para além de letras, números, hífenes e sublinhados tem um significado especial — <code>.</code> corresponde a qualquer carácter, <code>*</code> repete o carácter anterior, <code>#</code> termina a expressão, e assim por diante. Quando esta opção está definida como Sim, o Admin Tools aplica escape a esses caracteres por si ao guardar o registo, para que a palavra corresponda literalmente a si própria. Deixe-a definida como Sim a menos que saiba escrever expressões regulares e queira deliberadamente usar uma. Por favor, consulte a documentação antes de a desativar.<br><br><strong>Ao editar um registo existente, NÃO ative esta opção se à palavra já tiver sido aplicado escape quando foi adicionada.</strong> Aplicar escape a uma expressão que já o tem estraga-a, e esta deixará de corresponder a seja o que for. É por isso que a opção assume o valor Sim para novos registos e Não quando está a editar um existente."

