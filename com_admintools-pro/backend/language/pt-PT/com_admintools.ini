COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_INTRO = "Esta página permite-lhe seleccionar componentes, vistas ou parâmetros de consulta específicos <i>para NÃO serem protegidos</i> pelo Web Application Firewall. As excepções são aplicadas em dois grupos:"
