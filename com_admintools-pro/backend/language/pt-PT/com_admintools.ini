COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN="Enviar e-mail para este endereço após um bloqueio automático de IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN_TIP="O Admin Tools pode opcionalmente enviar-lhe um e-mail quando um IP é automaticamente banido, para o endereço de e-mail introduzido neste campo. Deixe este campo vazio (predefinição) para desativar esta funcionalidade."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR="Etiqueta Generator"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR_TIP="Introduza um valor personalizado para a meta etiqueta generator, ou deixe em branco para utilizar um valor gerado automaticamente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_HTACCESSTIP="Para maior proteção do seu site, utilize também a funcionalidade Gerador de .htaccess deste componente"
