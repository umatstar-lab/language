COM_ADMINTOOLS_REDIRECTION_LBL_DEST="Ao visitar esta"
COM_ADMINTOOLS_REDIRECTION_LBL_DEST_DESC="Esta é uma URL relativa no seu site. Quando alguém a visitar, será redirecionado para a URL \"Leva-o para\" indicada abaixo. Não deve incluir o prefixo de protocolo http:// ou https://, o nome do domínio ou uma barra inicial. Exemplos: <code>search/on/google</code> ou <code>456-blog/123-my-article</code>. Note que não é possível especificar o fragmento (o sinal <code>#</code> na URL e tudo o que se segue), pois esta é uma funcionalidade do lado do cliente; o seu servidor NÃO vê o fragmento, pelo que não é possível efetuar um redirecionamento do lado do servidor com base no conteúdo do fragmento."
