COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_HELP="O <info>%command.name%</info> irá remover os ficheiros e pastas do Joomla! que uma atualização do Joomla deveria ter apagado, mas não apagou.\nOs ficheiros do núcleo deixados para trás podem inutilizar completamente o seu site, normalmente com um erro fatal relacionado com um alias de classe.\nUse <info>--dry-run</info> para ver o que seria removido sem alterar nada.\nUtilização: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_OPT_DRYRUN="Listar os ficheiros e pastas obsoletos encontrados, e se o PHP consegue escrever neles, sem apagar nada."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTHINGTODO="Não existem ficheiros ou pastas obsoletos do núcleo do Joomla! neste site."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_DELETED="apagado"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_FAILED="FALHOU"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_WRITEABLE="gravável"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTWRITEABLE="NÃO gravável"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_ERR_SOMEFAILED="Não foi possível remover %d ficheiros e pastas obsoletos. Apague-os manualmente por FTP, SFTP ou com o gestor de ficheiros disponibilizado pelo seu alojamento."

[options]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Component Options
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;; File Scanner
COM_ADMINTOOLS_JCONFIG_SCAN_LABEL="Scanner de Ficheiros"
COM_ADMINTOOLS_JCONFIG_SCAN_DESC="Configurar o funcionamento do Scanner de Ficheiros PHP"

COM_ADMINTOOLS_JCONFIG_LOGLEVEL_LABEL="Nível de Registo"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DESC="O nível de detalhe do registo do Scanner de Ficheiros PHP, guardado no diretório de registos configurado no site. Valores recomendados: \"Avisos\" para sites em produção, \"Depuração\" quando pretende solicitar suporte."
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_NONE="Nenhum"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_ERROR="Erros"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_WARNING="Avisos"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_INFO="Informação"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DEBUG="Depuração"
COM_ADMINTOOLS_JCONFIG_MINEXEC_LABEL="Tempo Mínimo de Pedido"
COM_ADMINTOOLS_JCONFIG_MINEXEC_DESC="Quantidade mínima de tempo que cada pedido ao Scanner de Ficheiros PHP irá demorar. Aumente este valor se o servidor devolver um erro porque os pedidos chegam com demasiada frequência ou se atingir os limites de CPU/recursos.<br/><br/>Valores recomendados: 2.0 a 7.0."
COM_ADMINTOOLS_JCONFIG_MAXEXEC_LABEL="Tempo Máximo de Trabalho"
COM_ADMINTOOLS_JCONFIG_MAXEXEC_DESC="Quantidade máxima de tempo consumida na análise do site em cada pedido ao Scanner de Alterações em Ficheiros PHP. Diminua se atingir os limites de CPU / recursos do servidor. Defina um valor inferior ao Tempo Mínimo do Pedido para criar um período de \"resfriamento de uso de CPU\", reduzindo assim a utilização de recursos durante a análise de ficheiros à custa de tornar a análise mais lenta.<br/><br/>Valores recomendados: 3.0 a 7.0"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_LABEL="Fator de Enviesamento do Tempo de Trabalho"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_DESC="Um valor entre 50 e 100 que afeta a agressividade com que o Admin Tools prevê se está prestes a atingir o limite do Tempo Máximo de Trabalho. 50 é o mais agressivo e resultará numa análise que ocupa cerca de metade do Tempo Máximo de Trabalho em cada pedido ao Scanner de Alterações em Ficheiros PHP. 100 é o menos agressivo e resultará numa análise que ocupa pelo menos, e normalmente mais do que, o Tempo Máximo de Trabalho em cada pedido.<br/><br/>Valor recomendado: 75.<br/><br/><strong>Dica!</strong> Se tiver um servidor particularmente sensível, recomendamos definir o Tempo Mínimo do Pedido para 7.0, o Tempo Máximo de Trabalho para 5.0 e o Fator de Enviesamento para 50. Isto significa que o scanner trabalha durante 2.5 a 5.0 segundos de cada vez e depois o servidor fica inativo durante 2.0 a 4.5 segundos. A análise do site demorará cerca de três vezes mais, mas terá maior probabilidade de ser concluída."
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_LABEL="Número máx. de Pastas por lote"
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_DESC="O número máximo de pastas a listar num determinado diretório de cada vez. Isto impede que o PHP exceda o tempo limite ao listar o conteúdo de pastas <em>muito</em> grandes, com centenas de pastas contidas diretamente no seu interior.<br/><br/>Valor recomendado: 50<br/><br/>Tenha em atenção que listar o conteúdo de pastas é <strong>exponencialmente proporcional</strong> ao número de ficheiros e pastas nelas contidos. Esta é uma limitação do funcionamento dos Sistemas Operativos e dos seus controladores de sistema de ficheiros. Não há nada que nós, o Joomla! ou o PHP possamos fazer a esse respeito. Recomendamos vivamente que exclua pastas muito grandes e tome medidas para evitar ter pastas com milhares de ficheiros e pastas diretamente contidos. Em caso de dúvida, organize as suas pastas em hierarquias profundas."
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_LABEL="Número máx. de Ficheiros por lote"
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_DESC="O número máximo de ficheiros a listar num determinado diretório de cada vez. Isto impede que o PHP exceda o tempo limite ao listar o conteúdo de pastas <em>muito</em> grandes, com milhares de ficheiros contidos diretamente no seu interior.<br/><br/>Valor recomendado: 100<br/><br/>Tenha em atenção que listar o conteúdo de pastas é <strong>exponencialmente proporcional</strong> ao número de ficheiros e pastas nelas contidos. Esta é uma limitação do funcionamento dos Sistemas Operativos e dos seus controladores de sistema de ficheiros. Não há nada que nós, o Joomla! ou o PHP possamos fazer a esse respeito. Recomendamos vivamente que exclua pastas muito grandes e tome medidas para evitar ter pastas com milhares de ficheiros e pastas diretamente contidos. Em caso de dúvida, organize as suas pastas em hierarquias profundas."
COM_ADMINTOOLS_JCONFIG_FEBENABLE_LABEL="Ativar agendamento frontend"
COM_ADMINTOOLS_JCONFIG_FEBENABLE_DESC="Quando ativado, permite executar o Scanner de Alterações em Ficheiros PHP sem iniciar sessão no backend."
COM_ADMINTOOLS_JCONFIG_SECRETWORD_LABEL="Palavra secreta"
COM_ADMINTOOLS_JCONFIG_SECRETWORD_DESC="Protege a funcionalidade de agendamento frontend contra ataques DoS, exigindo que esta palavra secreta seja passada no URL de agendamento frontend. Utilize palavras-passe longas e complexas. Consulte a documentação para mais informações."
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_LABEL="Fuso horário para e-mails"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DESC="Todas as datas e horas nos e-mails enviados pelo Admin Tools para alertar sobre potenciais problemas de segurança serão expressas no fuso horário selecionado. Predefinição: GMT"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DEFAULT="Fuso Horário do Servidor"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_LABEL="Idioma alternativo preferido para as notificações por e-mail"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_DESC="O idioma utilizado nos e-mails de notificação enviados para um endereço que não pertence a uma conta de utilizador Joomla e para as contas de utilizador cuja preferência de idioma é «Usar predefinição».<br/><br/>Quando uma notificação é enviada para um endereço que <em>de facto</em> pertence a uma conta de utilizador Joomla, é utilizada a preferência de idioma dessa conta, a menos que ative também a opção abaixo.<br/><br/>Se não for possível determinar qualquer idioma, é utilizado o inglês (en-GB). O Admin Tools nunca envia uma notificação no idioma em que o seu site estiver a ser apresentado nesse momento.<br/><br/>Predefinição: Nenhum, ou seja, inglês (en-GB)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_NONE="Nenhum (usar inglês)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_LABEL="Forçar este idioma em todos os e-mails de notificação"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_DESC="Quando ativado, todos os e-mails de notificação são enviados no idioma selecionado acima, mesmo quando se destinam a uma conta de utilizador Joomla com uma preferência de idioma diferente.<br/><br/>Ative esta opção se processar automaticamente os e-mails de notificação e precisar que cheguem sempre num único idioma previsível.<br/><br/>Predefinição: Não"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_LABEL="Pastas Excluídas"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_DESC="Pastas a ignorar durante a análise do site.<br/><br/>As pastas são indicadas relativamente à raiz do site. Introduza uma pasta por linha.<br/><br/>Predefinição: nenhuma<br/><br/><em>Nota</em>: Algumas pastas são automaticamente excluídas sem as adicionar aqui: o diretório de registos e temporário do site, os diretórios de cache do frontend e backend, bem como as pastas com o nome tmp, log ou logs no frontend ou backend do site. Por fim, os links simbólicos para pastas fora da raiz do site não são seguidos (o seu conteúdo não será analisado)."
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_LABEL="Ficheiros Excluídos"
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_DESC="Ficheiros a ignorar durante a análise do site.<br/><br/>Os ficheiros são indicados relativamente à raiz do site. Introduza um caminho de ficheiro por linha.<br/><br/>Predefinição: nenhum<br/><br/>Utilize apenas para excluir ficheiros que não são realmente executáveis, por exemplo registos com extensão .php fora da pasta de registos do Joomla. NÃO utilize para marcar ficheiros como seguros; utilize a funcionalidade Marcar como Seguro na página de relatório de análise."
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_LABEL="Extensões a analisar"
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_DESC="Uma lista separada por vírgulas de extensões de ficheiros a analisar, sem o ponto inicial.<br/><br/>Valor predefinido: php, phps, phtml, php3, inc<br/><br/>Tenha em atenção que o Scanner de Alterações em Ficheiros PHP foi concebido apenas para analisar de forma fiável e avaliar uma Pontuação de Ameaça de ficheiros PHP. Desaconselhamos vivamente que adicione extensões de ficheiros de código fonte de linguagens de programação diferentes, como JavaScript e Perl, ou ficheiros binários. Se não respeitar este aviso, poderá obter muitos falsos positivos ou, pior, falsos negativos em ficheiros que não contêm código fonte na linguagem de programação PHP."
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_LABEL="Analisar ficheiros com extensões duplas"
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_DESC="Analisa ficheiros onde as extensões a analisar surgem antes de outras extensões. Por exemplo, se tiver adicionado <code>php</code> a \"Extensões a analisar\" e ativar esta opção, o Scanner de Alterações em Ficheiros PHP irá analisar tanto <code>example.php</code> como <code>example.php.png</code>."
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_LABEL="Correspondência de extensão sem distinção entre maiúsculas e minúsculas"
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_DESC="Torna a correspondência de extensões de ficheiros insensível a maiúsculas e minúsculas. Por exemplo, se tiver adicionado <code>php</code> a \"Extensões a analisar\" e ativar esta opção, o Scanner de Alterações em Ficheiros PHP irá analisar tanto <code>example.php</code> como <code>example.PHP</code>"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_LABEL="Limiar de ficheiro grande"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_DESC="O Scanner de Alterações em Ficheiros PHP irá deliberadamente pausar o trabalho e retomá-lo no pedido seguinte antes de analisar ficheiros maiores do que este número de bytes. Isto evita um tempo limite de PHP acidental ao analisar um ficheiro grande no final do Tempo Máximo de Trabalho atribuído.<br/><br/>Valor recomendado: 524288"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_LABEL="Calcular diferenças durante a análise"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_DESC="Quando esta opção está ativada, o Admin Tools calculará um diff (forma compacta de diferenças de ficheiros) para cada ficheiro modificado detetado pela funcionalidade Scanner de Ficheiros PHP. ATENÇÃO: Isto consome MUITO espaço na base de dados, cerca de 20 a 40 MB para um site típico!"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_LABEL="Não reportar ficheiros com Pontuação de Ameaça zero"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_DESC="Quando ativado, qualquer ficheiro novo ou modificado com uma Pontuação de Ameaça zero não será reportado.<br/><br/>Valor recomendado: Não<br/><br/><strong>ATENÇÃO</strong>: NÃO recomendamos ativar esta opção. É concebível que ficheiros maliciosamente modificados possam ter uma Pontuação de Ameaça zero porque o seu conteúdo malicioso está escrito de uma forma impossível de distinguir por um scanner automatizado de código legítimo, ainda que algo confuso. Ativar esta opção não o alertará sobre esses ficheiros, colocando possivelmente o seu site em risco. Esta opção existe para depurar problemas com o cálculo da Pontuação de Ameaça, NÃO como algo que deva ativar em sites em produção."
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_LABEL="Limiar de ficheiro demasiado grande"
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_DESC="Os ficheiros maiores do que este número de bytes não terão a sua Pontuação de Ameaça avaliada.<br/><br/>Valor recomendado: 5242880<br/><br/>Um valor demasiado pequeno faria com que os ficheiros executáveis não fossem analisados em busca de código malicioso, o que poderia ser um risco de segurança. Definir este valor demasiado alto resultará provavelmente num tempo limite de PHP ao analisar um ficheiro muito grande, tipicamente um que não é sequer executável apesar da extensão .php (por exemplo, um ficheiro de registo)."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_LABEL="Ficheiros não pertencentes ao núcleo em pastas do núcleo"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_DESC="Controla a forma como o scanner trata os ficheiros que NÃO são ficheiros oficiais do núcleo do Joomla mas que se encontram dentro de um diretório do núcleo do Joomla (um diretório pertencente a uma extensão, biblioteca ou template do núcleo, ou um de administrator/help, administrator/includes, includes). <strong>Ignorar</strong>: não detetar estes ficheiros. <strong>Assinalar</strong>: mostrar um distintivo \"não do núcleo\" nos resultados da análise. <strong>Assinalar e Reportar como Ameaça</strong>: mostrar o distintivo e adicionar 1000 à Pontuação de ameaça, para que o ficheiro apareça no topo dos resultados. Os ficheiros dentro de diretórios de extensões de terceiros são considerados fora do âmbito e nunca são assinalados."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_IGNORE="Ignorar"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_FLAG="Assinalar"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_THREAT="Assinalar e Reportar como Ameaça"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_LABEL="URL do serviço CoreSums"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_DESC="URL base do serviço de checksums CoreSums utilizado pelo Scanner de Alterações em Ficheiros PHP para identificar e verificar os ficheiros do núcleo do Joomla. O valor predefinido é <code>https://getpanopticon.com/checksums</code>. O Admin Tools apenas TRANSFERE deste serviço um ficheiro público de checksums para a sua versão do Joomla; nunca envia qualquer informação sobre o seu site ou os seus utilizadores. Se preferir alojar você mesmo os checksums, pode executar o seu próprio serviço — consulte <code>https://github.com/akeeba/coresums</code> — e apontar esta opção para ele."
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_LABEL="Tempo limite de transferência do CoreSums (segundos)"
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_DESC="Número máximo de segundos a aguardar ao transferir o ficheiro de checksums do CoreSums antes de desistir. Predefinição: 5. Se a transferência falhar, a análise é executada à mesma, mas nenhum ficheiro é marcado como do núcleo ou não do núcleo e é mostrado um aviso que pode dispensar até à sua próxima análise bem-sucedida."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_DESC="Os resultados da análise serão enviados automaticamente para este endereço de e-mail. Se deixar em branco, nenhum e-mail será enviado."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_LABEL="Enviar resultados para este e-mail"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_LABEL="Enviar e-mail apenas para itens com ação necessária"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_DESC="Quando ativado (predefinição), o Scanner de Alterações em Ficheiros PHP enviará um e-mail com o resumo dos resultados da análise <em>apenas</em> quando forem detetados itens que requerem ação (ficheiros adicionados, modificados ou possíveis ameaças)."

;; Email sending
COM_ADMINTOOLS_JCONFIG_EMAIL_LABEL="Envio de E-mail"
COM_ADMINTOOLS_JCONFIG_EMAIL_DESC="Opções que controlam como o Admin Tools envia e-mails para pedidos bloqueados. Estas opções aplicam-se apenas na edição Profissional."
COM_ADMINTOOLS_JCONFIG_THROTTLE_LABEL="Limitação de e-mails de pedidos bloqueados"
COM_ADMINTOOLS_JCONFIG_THROTTLE_DESC="Quando ativado, o Admin Tools enviará apenas até um determinado número de e-mails durante um período de tempo específico. Isto protege o seu e-mail de ficar inundado quando o site está sob ataque. É necessário ter o registo de pedidos bloqueados ativado para <em>todas as razões de bloqueio</em> para as quais está a enviar e-mails. Além disso, o número máximo de entradas de registo que mantém — de acordo com a configuração do plugin de sistema – deve ser <em>igual ou superior</em> ao número máximo de e-mails configurado abaixo. Em qualquer outro caso, os e-mails de exceções de segurança NÃO serão limitados."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_LABEL="Número máximo de pedidos bloqueados para os quais enviar e-mails"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_DESC="O número máximo de pedidos bloqueados para os quais podem ser enviados e-mails dentro do período de tempo definido abaixo. Tenha em atenção que durante um ataque prolongado podem ser enviados mais e-mails do que este número, dependendo de quão lentos estiverem os servidores web, de base de dados e de correio quando o site está sob carga muito elevada. Além disso, tenha em atenção que isto afeta apenas os pedidos bloqueados registados na base de dados e com uma razão de bloqueio que NÃO esteja nas razões configuradas para as quais nunca enviar e-mails."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_LABEL="Período para limitação de e-mails"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_DESC="A limitação de e-mails funciona verificando quantos pedidos bloqueados foram registados neste número de segundos, minutos, horas ou dias. Selecione a unidade de medida de tempo abaixo."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_LABEL="Unidade de medida de tempo"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DESC="O período acima é expresso na unidade de medida de tempo aqui selecionada. Tenha em atenção que, para efeitos destes cálculos, um minuto corresponde a 60 segundos, 1 hora a 3600 segundos e 1 dia a 86400 segundos. Isto pode ser diferente dos minutos, horas e dias reais do relógio em anos com segundos bissextos e na transição entre a Hora de Verão e a Hora Legal (ou vice-versa). A medição do tempo é um assunto bastante complexo."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_SECONDS="Segundos"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_MINUTES="Minutos"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_HOURS="Horas"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DAYS="Dias"

COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_DESC="Durante quanto tempo, em minutos, uma lista de IPs de rastreadores transferida é utilizada antes de ser transferida novamente. É também o tempo que o Admin Tools aguarda antes de tentar novamente após uma transferência falhada. O mínimo é de 15 minutos."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_LABEL="Duração da cache das listas de rastreadores (minutos)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DESC="Opções das listas de IPs de rastreadores, que ativa em Configurar WAF, separador Rastreadores."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_DESC="Se não for possível atualizar uma lista de IPs de rastreadores, o Admin Tools continua a utilizar a última lista transferida durante este número de dias, contados a partir do momento em que a lista expiraria normalmente. Depois disso, a lista deixa de ser utilizada. Defina 0 para deixar de utilizar uma lista assim que expire."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_LABEL="Descartar listas de rastreadores desatualizadas após (dias)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_LABEL="Rastreadores"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_DESC="O tempo máximo, em milissegundos, que o Admin Tools aguarda pela transferência de uma lista de IPs: as listas de IPs de rastreadores e as listas da CloudFlare, Sucuri e BunnyCDN utilizadas pelos geradores de configuração do servidor. As listas publicadas como páginas web e não como ficheiros de dados (as da Amazon e da Sucuri) dispõem do triplo deste limite (no máximo 60 segundos). Este limite só é aplicado com exatidão quando o seu servidor utiliza a extensão cURL do PHP. Com outros métodos de ligação, e para a resolução de DNS em algumas versões do cURL, é apenas aproximado: é arredondado para segundos inteiros e um servidor muito lento pode demorar mais."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_LABEL="Limite de tempo de transferência das listas de rastreadores e CDN (milissegundos)"

;; Backend options
COM_ADMINTOOLS_JCONFIG_BACKEND_LABEL="Backend"
COM_ADMINTOOLS_JCONFIG_BACKEND_DESC="Opções que definem como funciona o backend do componente"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_LABEL="Mostrar gráficos e estatísticas"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_DESC="Apresentar gráficos e estatísticas sobre pedidos bloqueados (apenas na versão Profissional)"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_LABEL="Reordenar o plugin automaticamente"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_DESC="O plugin System - Admin Tools precisa de ser ordenado como o primeiro plugin publicado para funcionar corretamente. Quando visita o Admin Tools no backend, o plugin é automaticamente reordenado para ser o primeiro. Em alguns casos raros, outros plugins precisam de ser publicados primeiro, por exemplo gestores de correio alternativos como o CMandrill. Nesse caso, defina esta opção como Não. PERIGO GRAVE! SERÁ EXCLUSIVAMENTE DA SUA RESPONSABILIDADE REORDENAR O PLUGIN. SE UM PLUGIN VULNERÁVEL FOR PUBLICADO ANTES DO PLUGIN SYSTEM - ADMIN TOOLS O SEU SITE PODE SER PIRATEADO. O ADMIN TOOLS NÃO PODERÁ PROTEGÊ-LO NESSE CASO, UMA VEZ QUE NÃO ESTARÁ A SER EXECUTADO ANTES DO CÓDIGO VULNERÁVEL, SENDO PORTANTO INCAPAZ DE DETETAR O ATAQUE. NÃO DEFINA ESTA OPÇÃO COMO \"NÃO\" A MENOS QUE SEJA UM ESPECIALISTA E COMPREENDA AS IMPLICAÇÕES."
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_LABEL="Avisar sobre edições manuais em ficheiros de configuração do servidor"
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_DESC="O Admin Tools verificará se editou manualmente um ficheiro de configuração do servidor (ou seja, .htaccess, nginx.conf ou web.config) em vez de utilizar o Gerador de .htaccess, NginX ou WebConfig"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_LABEL="Lembrar-me quando o ficheiro de registo de depuração estiver ativado"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_DESC="Mostra um lembrete em todas as páginas da área de administração do seu site enquanto a opção \"Manter um ficheiro de registo de depuração\" de Configurar WAF estiver ativada. O ficheiro de registo de depuração destina-se apenas à resolução de problemas. Regista em detalhe cada pedido bloqueado, incluindo os dados de formulário submetidos, num ficheiro não encriptado."
COM_ADMINTOOLS_JCONFIG_USAGESTATS_LABEL="Ativar relatório anónimo das versões de PHP, MySQL e Joomla!"
COM_ADMINTOOLS_JCONFIG_USAGESTATS_DESC="Ajude-nos a melhorar o nosso software reportando anonimamente e automaticamente as suas versões de PHP, MySQL e Joomla!. Esta informação ajudar-nos-á a decidir quais as versões de Joomla!, PHP e MySQL a suportar em versões futuras. Nota: NÃO recolhemos o nome do seu site, endereço IP ou qualquer outra informação de identificação direta ou indiretamente única."
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_LABEL="Caminho preciso do PHP-CLI"
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_DESCRIPTION="Ative para que o Admin Tools tente detetar o caminho preciso do PHP-CLI no seu servidor. Desative se o seu servidor não o permitir, bloqueando o seu endereço IP fora do site durante vários minutos ou horas quando isso acontece (por exemplo, IONOS)."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_LABEL="Contornar Templates de Correio quebrados no Joomla! 5.2 e posterior."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_DESC="O Joomla! 5.2 introduziu a funcionalidade Mail Template Layout e ativa-a por predefinição. No entanto, esta funcionalidade <em>quebra</em> as ligações nos e-mails se o URL vier de uma variável, como <code>{URL}</code>, adicionando o URL do site antes do URL, tornando-o assim um URL inválido. Isto afeta até os componentes do próprio Joomla. Embora não possamos corrigir o Joomla em si, podemos fornecer uma solução alternativa para os e-mails enviados pelo nosso software. Se por qualquer razão não desejar essa solução alternativa, pode desativá-la definindo esta opção como Não."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_LABEL="Servidor Web"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_DESCRIPTION="Qual é o servidor web que está a utilizar para o seu site? Utilizar \"Deteção automática\" é recomendado para a maioria dos sites. Selecione o tipo de servidor web se e somente se o seu alojamento deliberadamente tornou a variável de ambiente <code>SERVER_SOFTWARE</code> inacessível ao PHP, ou a definiu intencionalmente com um valor vazio ou enganoso."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_AUTO="Deteção automática"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_APACHE="Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_LITESPEED="LiteSpeed"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_NGINX="NginX"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_IIS="IIS"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_LABEL="Versão do servidor web Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_DESCRIPTION="Se estiver a utilizar o servidor web Apache, selecione qual é a versão do Apache. Utilizar \"Deteção automática\" é recomendado para a maioria dos sites. Selecione a versão se e somente se o seu alojamento deliberadamente tornou a variável de ambiente <code>SERVER_SOFTWARE</code> inacessível ao PHP, ou a definiu intencionalmente com um valor vazio ou enganoso."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_AUTO="Deteção automática"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_1_3="1.3"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_0="2.0"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_2="2.2"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_4="2.4"
;; Permissions
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_DESC="Permitir acesso às funcionalidades utilitárias"
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_TITLE="Utilitário"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_TITLE="Segurança"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_DESC="Permitir acesso às funcionalidades de segurança. Isto inclui o assistente de Super Utilizadores Temporários; trate-o como equivalente a conceder acesso de Super Utilizador."
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_TITLE="Manutenção"
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_DESC="Permitir acesso à manutenção de base de dados e permissões"

