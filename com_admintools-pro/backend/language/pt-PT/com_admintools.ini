COM_ADMINTOOLS_CONTROLPANEL_LBL_NEEDSDLID="Deve introduzir o seu <b>ID de Download</b> antes de poder atualizar o Admin Tools Professional. <a href='%s' target='_blank'>Se não souber o seu ID de Download, clique aqui</a>."
COM_ADMINTOOLS_CONTROLPANEL_MSG_WHERETOENTERDLID="Aceda ao menu Sistema do Joomla no lado esquerdo. Encontre o painel de Atualização e clique na ligação Sites de Atualização. Localize o item \"Admin Tools Professional\" e clique nele. Em alternativa, <a href=\"%s\">clique aqui</a> para ir diretamente a essa página. Introduza o seu ID de Download — o ID Principal ou um ID de Download adicional — no campo \"Chave de Download\" e clique no botão Guardar."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED="O ficheiro de registo de depuração foi desativado. Os ficheiros de registo de depuração existentes foram mantidos."
