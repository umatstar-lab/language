COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WARNTEXT="Devido ao modo eficiente como o NginX funciona, precisará de fazer duas coisas para que estas definições tenham efeito. Primeiro, deverá copiar o conteúdo do ficheiro de configuração NginX deste site e copiá-lo para o principal (se este for um site de desenvolvimento, poderá simplesmente incluir o ficheiro do site adicionando a linha <code>include %s;</code> dentro da definição do servidor). Depois, terá de recarregar ou reiniciar o seu servidor."
