COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON_INFO="Este método é recomendado apenas se a tarefa CRON de linha de comandos habitual não for concluída. Este método utiliza internamente o método de agendamento frontend e é ligeiramente mais lento do que o método CLI nativo."
