COM_ADMINTOOLS_TITLE_CONFIGUREWAF="Configurar WAF"

COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINACTIVE="Tem de publicar o plugin \"System - Admin Tools\" antes de qualquer uma destas definições ter efeito."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINACTIVE_DOIT="Clique aqui para ir ao Gestor de Plugins"
COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINEXISTS="Tem de instalar e publicar o plugin \"System - Admin Tools\" (plg_admintools) antes de qualquer uma destas definições ter efeito. Pode tentar reinstalar o Admin Tools, duas vezes consecutivas, sem desinstalar antes nem entre as duas instalações, para forçar o Joomla! a instalar o plugin em falta."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_KNOWN="Renomeou o ficheiro <code>plugins/system/admintools/services/provider.php</code> para <code>%s</code>. Como resultado, o Admin Tools <strong>não</strong> está a proteger o seu site. Se o fez intencionalmente para resolver algum problema, lembre-se de renomear o ficheiro novamente para provider.php. Na maioria dos casos pode clicar na ligação abaixo para o fazer automaticamente."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_DOIT="Renomear o ficheiro de volta para provider.php"
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_UNKNOWN="Renomeou o ficheiro <code>plugins/system/admintools/services/provider.php</code>. Como resultado, o Admin Tools <strong>não</strong> está a proteger o seu site. Se o fez intencionalmente para resolver algum problema, lembre-se de renomear o ficheiro novamente para provider.php."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_PLUGINNOTLOADED="O plugin System - Admin Tools não está carregado. Infelizmente não é possível determinar a causa. Algum ficheiro pode estar em falta ou corrompido. Recomendamos vivamente a reinstalação do Admin Tools, duas vezes consecutivas, sem desinstalar antes nem entre as duas instalações, para forçar o Joomla! a instalar e substituir quaisquer ficheiros em falta ou corrompidos."
