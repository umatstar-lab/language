COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_ADMINACTIVATION="A ativação de utilizadores está definida como <strong>Admin</strong>, o que significa que o novo e-mail de ativação será enviado aos Super Utilizadores e estes terão de reativar o utilizador."
