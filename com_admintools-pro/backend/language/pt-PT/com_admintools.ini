COM_ADMINTOOLS_NGINXCONFMAKER_LBL_EXCEPTIONPATHINFO_NOTE="Os ficheiros PHP em exceção, bem como os ficheiros PHP nos diretórios com acesso direto (incluindo ficheiros .php), passam também a tratar URL em que um caminho se segue ao nome do ficheiro, p. ex. <code>foobar.php/baz.png</code>. Para que o PHP receba esse caminho, a definição <em>bloco de código fastcgi_pass</em> tem de definir <code>SCRIPT_FILENAME</code> e <code>PATH_INFO</code>; o ficheiro <code>fastcgi_params</code> fornecido com o NginX não define <code>PATH_INFO</code>. <a href=\"https://www.akeeba.com/documentation/admin-tools-joomla/nginx-server-protection.html#nginx-path-info\" target=\"_blank\">Consulte a documentação</a> sobre a configuração necessária e as considerações de segurança."
