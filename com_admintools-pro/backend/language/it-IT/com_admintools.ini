COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW="Nome vista"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_DESC="Il nome della vista (area del componente) o del controller del componente che deve essere presente nell'URL affinché questa regola corrisponda. Disabilitare gli URL SEF per vedere <code>view=NomeVista</code> o <code>task=NomeVista.NomeTask</code> dove <var>NomeVista</var> è il Nome vista da inserire qui. Lasciare vuoto per corrispondere a tutte le viste. Se si desidera corrispondere a un percorso URL SEF, lasciare il Componente impostato su \"(Tutti)\" e inserire il percorso SEF <strong>CON</strong> una barra iniziale ma <strong>SENZA</strong> <code>index.php</code>. Ad esempio, usare <code>/foo/bar</code>. Nei siti multilingua NON includere il prefisso della lingua, ad esempio <s><code>/en/example</code></s> è sbagliato, mentre <code>/example</code> è corretto. Si noti che questo può essere un percorso <em>parziale</em>, ovvero <code>/foo/bar</code> corrisponde sia a <code>/foo/bar/test</code> che a <code>/foo/bar.html</code>."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_ANY="(Tutti)"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY="Parametro di query"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_DESC="Quale parametro di stringa di query disabilitare dal filtraggio di sicurezza, ad esempio <code>id</code>. Lasciare vuoto per corrispondere a tutti i parametri di query. Si noti che le eccezioni WAF vengono applicate dopo che Joomla! ha convertito un URL SEF nel suo formato non-SEF, indipendentemente dal fatto che gli URL SEF siano abilitati sul sito."
