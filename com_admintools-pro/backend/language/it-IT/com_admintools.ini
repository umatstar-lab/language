COM_ADMINTOOLS_BADWORDS_LBL_WORD="Parola"
COM_ADMINTOOLS_BADWORDS_LBL_WORD_DESC="La parola vietata che si desidera bloccare. Non è sensibile alle maiuscole/minuscole, ad es. <code>test</code>, <code>TEST</code> e <code>TesT</code> sono considerate la stessa parola."
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE="Applica escape all'espressione regolare"
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE_DESC="Il campo Parola è un'espressione regolare, interpolata in <code>#\b&lt;QUELLO CHE HAI DIGITATO&gt;\b#iu</code>. Tutto ciò che contiene al di fuori di lettere, numeri, trattini e trattini bassi ha un significato speciale — <code>.</code> corrisponde a qualsiasi carattere, <code>*</code> ripete il carattere precedente, <code>#</code> termina l'espressione, e così via. Quando questa opzione è impostata su Sì, Admin Tools applica automaticamente l'escape a quei caratteri al salvataggio del record, in modo che la parola corrisponda letteralmente a sé stessa. Lasciala impostata su Sì a meno che tu non sappia scrivere espressioni regolari e voglia deliberatamente usarne una. Consulta la documentazione prima di disattivarla.<br><br><strong>Quando modifichi un record esistente, NON attivarla se alla parola era già stato applicato l'escape al momento dell'inserimento.</strong> Applicare l'escape a un'espressione a cui è già stato applicato la rovina, e a quel punto non corrisponderà proprio a nulla. Per questo l'opzione è impostata su Sì per i nuovi record e su No quando ne stai modificando uno esistente."

