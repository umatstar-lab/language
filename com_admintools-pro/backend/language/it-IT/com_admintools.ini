COM_ADMINTOOLS_REDIRECTION_LBL_DEST="Visita questo"
COM_ADMINTOOLS_REDIRECTION_LBL_DEST_DESC="Questo è un URL relativo del tuo sito. Quando qualcuno lo visita viene reindirizzato all'URL \"Ti porta qui\" indicato di seguito. Non deve contenere il prefisso di protocollo http:// o https://, il nome del dominio o una barra iniziale. Esempi: <code>search/on/google</code> o <code>456-blog/123-my-article</code>. Nota che non puoi specificare il frammento (il segno <code>#</code> nell'URL e tutto ciò che lo segue) poiché si tratta di una funzionalità lato client; il tuo server NON vede il frammento, pertanto non è possibile effettuare un reindirizzamento lato server basato sul contenuto del frammento."
COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE="Ti porta qui"
COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE_DESC="Questo è l'URL relativo o assoluto verso cui verrà inviato il visitatore. Questo URL deve essere valido anche se disabiliti la funzione di reindirizzamento. Può essere un URL del tuo stesso sito o di un sito diverso. Esempi: <code>https://www.example.com</code> o <code>blog/123-my-article</code>."
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS="Mantieni parametri URL"
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS_DESC="Scegli cosa fare con i parametri della stringa di query nell'URL visitato. \"Nessuno\" li ignora e mantiene i parametri della stringa di query dall'URL 'Ti porta qui', se presenti. \"Sostituisci tutti\" li unisce con i parametri della stringa di query dell'URL 'Ti porta qui', sovrascrivendo questi ultimi anche se già impostati. \"Aggiungi nuovi\" aggiungerà tutti i parametri della stringa di query definiti nell'URL visitato <em>a condizione che</em> non siano già definiti nell'URL 'Ti porta qui'."

