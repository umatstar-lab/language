COM_ADMINTOOLS_CONTROLPANEL_HEADER_QUICKSETUP="Configurazione rapida"
COM_ADMINTOOLS_CONTROLPANEL_HEADER_QUICKSETUP_HELP="La procedura guidata di avvio rapido dovrebbe essere eseguita una sola volta, al primo avvio di Admin Tools. Se la esegui di nuovo sovrascrivera' tutte le tue impostazioni! Se desideri modificare la configurazione utilizza gli altri pulsanti qui sopra."

COM_ADMINTOOLS_CONTROLPANEL_LBL_IP_UNBLOCKED="IP sbloccato con successo"
