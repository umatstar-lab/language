COM_ADMINTOOLS_NGINXCONFMAKER_LBL_TUNETEXT="Se alcuni aspetti del tuo sito smettono improvvisamente di funzionare, spetta a te trovare le eccezioni necessarie per il loro corretto funzionamento. Le istruzioni sono disponibili nella documentazione del componente. Ricorda che le impostazioni non hanno effetto finché non ricarichi o riavvii il server NginX."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WARNING="IMPORTANTE"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WARNTEXT="A causa del modo efficiente in cui funziona NginX, dovrai eseguire due operazioni affinché queste impostazioni abbiano effetto. Prima di tutto, copia il contenuto del file di configurazione NginX per questo sito e inseriscilo in quello principale (se si tratta di un sito di sviluppo puoi semplicemente includere il file del sito aggiungendo la riga <code>include %s;</code> all'interno della definizione del server). Poi devi ricaricare o riavviare il server."
