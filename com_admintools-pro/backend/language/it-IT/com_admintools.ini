COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_TITLE="Admin Tools: E-mail di risoluzione dei problemi"
COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_DESC="Inviata ogni volta che si apporta una modifica alla configurazione di Admin Tools che potrebbe bloccare l'accesso al sito."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_SUBJECT="Informazioni per la risoluzione dei problemi di Admin Tools"
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY="Salve {USER},\n\nHai appena {ACTION} utilizzando il componente Admin Tools sul tuo sito \"{SITENAME}\". Si tratta di un processo generalmente sicuro. In alcuni casi un malinteso, una svista o un browser o server che altera le impostazioni potrebbe causare un malfunzionamento del sito o renderlo inaccessibile. Questo vale sia per Joomla! stesso che per le varie estensioni di terze parti. In questo improbabile caso, consulta i seguenti URL per le istruzioni di risoluzione dei problemi:\n\n{TROUBLESHOOTING_URLS}\n\nSe non riesci a trovare una soluzione da solo e hai un abbonamento attivo per Admin Tools, apri un ticket di supporto sul nostro sito, https://www.akeeba.com, e comunicaci cosa hai fatto prima che si verificasse il problema, qual è il problema e quali passaggi di risoluzione hai già tentato.\n\nChi ha inviato questa e-mail?\n======================================================================\n\nQuesta e-mail viene inviata automaticamente da Admin Tools in esecuzione sul tuo sito all'indirizzo e-mail registrato nel tuo profilo utente Joomla! ogni volta che esegui un'azione amministrativa che potrebbe accidentalmente bloccarti fuori dal sito. Non viene inviata ad altri utenti del tuo sito.\n\nSe non desideri più ricevere queste e-mail, accedi al pannello di amministrazione del tuo sito e vai su Componenti, Admin Tools, Web Application Firewall, Configura WAF e fai clic sulla scheda Personalizzazione. Trova l'opzione \"Invia e-mail di risoluzione dei problemi per le funzioni amministrative\" e impostala su No."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY_HTML="<p>Salve {USER},</p><p>Hai appena {ACTION} utilizzando il componente Admin Tools sul tuo sito \"{SITENAME}\". Si tratta di un processo generalmente sicuro. In alcuni casi un malinteso, una svista o un browser o server che altera le impostazioni potrebbe causare un malfunzionamento del sito o renderlo inaccessibile. Questo vale sia per Joomla! stesso che per le varie estensioni di terze parti. In questo improbabile caso, consulta i seguenti URL per le istruzioni di risoluzione dei problemi:</p>{TROUBLESHOOTING_URLS_HTML}<p>Se non riesci a trovare una soluzione da solo e hai un abbonamento attivo per Admin Tools, apri un ticket di supporto sul nostro sito, https://www.akeeba.com, e comunicaci cosa hai fatto prima che si verificasse il problema, qual è il problema e quali passaggi di risoluzione hai già tentato.</p><h3>Chi ha inviato questa e-mail?</h3><p>Questa e-mail viene inviata automaticamente da Admin Tools in esecuzione sul tuo sito all'indirizzo e-mail registrato nel tuo profilo utente Joomla! ogni volta che esegui un'azione amministrativa che potrebbe accidentalmente bloccarti fuori dal sito. Non viene inviata ad altri utenti del tuo sito.</p><p>Se non desideri più ricevere queste e-mail, accedi al pannello di amministrazione del tuo sito e vai su Componenti, Admin Tools, Web Application Firewall, Configura WAF e fai clic sulla scheda Personalizzazione. Trova l'opzione \"Invia e-mail di risoluzione dei problemi per le funzioni amministrative\" e impostala su No.</p>"

COM_ADMINTOOLS_MAIL_CONFIGMONITOR_TITLE="Admin Tools: Monitoraggio della configurazione"
COM_ADMINTOOLS_MAIL_CONFIGMONITOR_DESC="Inviata da Admin Tools ogni volta che si apporta una modifica alla Configurazione globale o alle opzioni di configurazione di un componente quando le opzioni \"Monitora configurazione globale\" e/o \"Monitora configurazione componente\" sono abilitate nel Web Application Firewall."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_SUBJECT="Opzioni di configurazione per {AREA} modificate su {SITENAME}"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY="Salve,\n\nVi informiamo che le opzioni di configurazione per {AREA} sul vostro sito, {SITENAME}, sono state modificate dall'utente {USER}. Le impostazioni modificate sono elencate di seguito:\n\n{INFO}\n\nUlteriori dettagli sull'origine di questa modifica:\n\nIndirizzo IP: {IP} (Ricerca IP: {LOOKUP})\nUser Agent: {UA}\n\nSe questa modifica non è stata apportata da voi o da un amministratore di cui vi fidate, vi invitiamo a verificare immediatamente il vostro sito poiché potrebbe essere un'indicazione di attività di hacking.\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY_HTML="<p>Salve,</p><p>Vi informiamo che le opzioni di configurazione per {AREA} sul vostro sito, {SITENAME}, sono state modificate dall'utente {USER}. Le impostazioni modificate sono elencate di seguito:</p>{INFO_HTML}<p>Ulteriori dettagli sull'origine di questa modifica:</p><ul><li>Indirizzo IP: {IP} (<a href=\"{LOOKUP}\">Ricerca IP</a>)</li><li>User Agent: {UA}</li></ul><p>Se questa modifica non è stata apportata da voi o da un amministratore di cui vi fidate, vi invitiamo a verificare immediatamente il vostro sito poiché potrebbe essere un'indicazione di attività di hacking.</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_CHANGED="Opzioni modificate"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_ADDED="Opzioni aggiunte"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REMOVED="Opzioni rimosse"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REDACTED="(modificato; valore nascosto per sicurezza)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPAQUE="(modificato)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_EMPTY="(vuoto)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPTION="Opzione"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OLD="Valore precedente"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_NEW="Nuovo valore"
; Diff layout strings. Override these to restyle the changed-options table in the notification email.
; Plain text: %1$s = option label, %2$s = previous value, %3$s = new value (as applicable).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_SECTION="%s:"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_CHANGED="  %1$s: %2$s → %3$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_ADDED="  %1$s: %2$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_REMOVED="  %1$s: %2$s"
; Opaque line: the value is not shown (sensitive, compound, or a custom field type). %1$s = label, %2$s = marker.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_OPAQUE="  %1$s: %2$s"
; HTML: %s in the section is the section title; in a row %1$s = label, %2$s = previous value, %3$s = new value;
; in the table %1$s = Option header, %2$s = Previous value header, %3$s = New value header, %4$s = the rows.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_SECTION="<tr><th colspan=\"3\" style=\"text-align:left;background:#f0f0f0;\">%s</th></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW="<tr><td>%1$s</td><td>%2$s</td><td>%3$s</td></tr>"
; Opaque HTML row: %1$s = label, %2$s = marker (spans the previous/new value columns).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW_OPAQUE="<tr><td>%1$s</td><td colspan=\"2\">%2$s</td></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_TABLE="<table border=\"1\" cellpadding=\"4\" cellspacing=\"0\"><thead><tr><th>%1$s</th><th>%2$s</th><th>%3$s</th></tr></thead><tbody>%4$s</tbody></table>"

COM_ADMINTOOLS_MAIL_USERREACTIVATE_TITLE="Admin Tools: Riattivazione utente"
COM_ADMINTOOLS_MAIL_USERREACTIVATE_DESC="Inviata da Admin Tools ogni volta che un account utente viene temporaneamente disattivato a causa di troppi tentativi di accesso falliti."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_SUBJECT="Account utente temporaneamente bloccato su {SITENAME}"
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY="Salve,\n\nAbbiamo rilevato diversi tentativi falliti di accesso con l'account utente {USER} sul nostro sito {SITENAME}. Di conseguenza, il nostro sistema ha automaticamente imposto un blocco temporaneo sull'account utente in data {DATE}.\n\nSe ritieni di aver ricevuto questo messaggio per errore, ovvero sei stato tu ad aver accidentalmente tentato di accedere con la password errata, fai clic sul seguente link per rimuovere il blocco temporaneo dal tuo account utente:\n{ACTIVATE}\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché hai un account utente in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY_HTML="<p>Salve,</p><p>Abbiamo rilevato diversi tentativi falliti di accesso con l'account utente {USER} sul nostro sito {SITENAME}. Di conseguenza, il nostro sistema ha automaticamente imposto un blocco temporaneo sull'account utente in data {DATE}.</p><p>Se ritieni di aver ricevuto questo messaggio per errore, ovvero sei stato tu ad aver accidentalmente tentato di accedere con la password errata, fai clic sul seguente link per rimuovere il blocco temporaneo dal tuo account utente:</p><p><a href=\"{ACTIVATE}\">{ACTIVATE}</a></p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Nota: Stai ricevendo questo messaggio e-mail automatico perché hai un account utente in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_TITLE="Admin Tools: Accesso amministratore fallito"
COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_DESC="Inviata da Admin Tools quando si verifica un tentativo di accesso al backend fallito, a condizione che la relativa funzionalità sia abilitata."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_SUBJECT="Accesso amministratore fallito per l'utente {USER} su {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY="Salve,\n\nVi informiamo che l'utente {USER} non ha effettuato l'accesso con successo all'area di amministrazione backend del vostro sito, {SITENAME}. Ulteriori informazioni:\n\nNome utente: {USER}\nIndirizzo IP: {IP} ({LOOKUP})\nStringa User Agent del browser: {UA}\n\nSe ciò era previsto, non è necessario intraprendere alcuna azione. Se si sospetta un tentativo di hacking, accedere immediatamente al backend del sito e attivare immediatamente la modalità offline di emergenza di Admin Tools.\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY_HTML="<p>Salve,</p><p>Vi informiamo che l'utente <strong>{USER}</strong> <strong>non</strong> ha effettuato l'accesso con successo all'area di amministrazione backend del vostro sito, {SITENAME}. Ulteriori informazioni:</p><p>Nome utente: {USER}<br />Indirizzo IP: {IP} (<a href=\"{LOOKUP}\">Ricerca IP</a>)<br />Stringa User Agent del browser: {UA}</p><p>Se ciò era previsto, non è necessario intraprendere alcuna azione. Se si sospetta un tentativo di hacking, accedere immediatamente al backend del sito e attivare immediatamente la modalità offline di emergenza di Admin Tools.</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_TITLE="Admin Tools: Accesso amministratore riuscito"
COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_DESC="Inviata da Admin Tools quando si verifica un tentativo di accesso al backend riuscito, a condizione che la relativa funzionalità sia abilitata."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_SUBJECT="L'utente {USER} ha effettuato l'accesso all'area amministratore di {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY="Salve,\n\nVi informiamo che l'utente {USER} ha appena effettuato l'accesso all'area amministratore backend del vostro sito, {SITENAME}. Ulteriori informazioni:\n\nNome utente: {USER}\nIndirizzo IP: {IP} ({LOOKUP})\nStringa User Agent del browser: {UA}\n\nSe ciò era previsto, non è necessario intraprendere alcuna azione. Se si sospetta un tentativo di hacking, accedere immediatamente al backend del sito e attivare immediatamente la modalità offline di emergenza di Admin Tools.\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY_HTML="<p>Salve,</p><p>Vi informiamo che l'utente <strong>{USER}</strong> ha appena effettuato l'accesso all'area amministratore backend del vostro sito, {SITENAME}. Ulteriori informazioni:</p><p>Nome utente: {USER}<br />Indirizzo IP: {IP} (<a href=\"{LOOKUP}\">Ricerca IP</a>)<br />Stringa User Agent del browser: {UA}</p><p>Se ciò era previsto, non è necessario intraprendere alcuna azione. Se si sospetta un tentativo di hacking, accedere immediatamente al backend del sito e attivare immediatamente la modalità offline di emergenza di Admin Tools.</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_IPAUTOBAN_TITLE="Admin Tools: Blocco IP automatico"
COM_ADMINTOOLS_MAIL_IPAUTOBAN_DESC="Inviata da Admin Tools quando un indirizzo IP viene bloccato automaticamente, a condizione che siano stati selezionati uno o più indirizzi e-mail per questa funzionalità. Include anche le istruzioni per la Modalità di recupero; si consiglia di "
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_SUBJECT="Notifica di blocco IP automatico per {IP} su {SITENAME}"
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY="Salve,\n\nVi informiamo che l'indirizzo IP {IP} verrà temporaneamente bloccato dall'accesso al vostro sito, {SITENAME}. Ulteriori dettagli di seguito.\n\nIndirizzo IP: {IP} (Ricerca IP: {LOOKUP})\nMotivo dell'ultima richiesta bloccata: {REASON}\nBloccato fino a: {UNTIL}\n\n{RESCUEINFO}\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nStai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY_HTML="<p>Salve,</p><p>Vi informiamo che l'indirizzo IP {IP} verrà temporaneamente bloccato dall'accesso al vostro sito, {SITENAME}. Ulteriori dettagli di seguito.</p><p>Indirizzo IP: {IP} (<a href=\"{LOOKUP}\">Ricerca IP</a>)<br />Motivo dell'ultima richiesta bloccata: {REASON}<br />Bloccato fino a: {UNTIL}</p><p>{RESCUEINFO}</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_TITLE="Admin Tools: File critico modificato"
COM_ADMINTOOLS_MAIL_CRITICALFILES_DESC="Inviata da Admin Tools quando un \"file critico\" è stato modificato."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_SUBJECT="File critico modificato su {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY="Salve,\n\nVi informiamo che uno o più file critici sono stati modificati sul vostro sito, {SITENAME}. L'elenco dei file modificati sul vostro sito è il seguente:\n\n{INFO}\n\nDevo preoccuparmi?\n======================================================================\n\nI \"file critici\", nel contesto di questo messaggio e-mail, sono i file più frequentemente presi di mira dagli hacker dopo un attacco riuscito a un sito. Questi file possono anche essere e il più delle volte lo sono modificati per motivi legittimi. Ad esempio, vengono modificati quando si salva la Configurazione globale del sito o quando si aggiorna Joomla! o uno dei suoi template.\n\nNON dovreste preoccuparvi se avete ricevuto questa e-mail dopo che voi, o un altro amministratore di cui vi fidate, avete apportato una delle seguenti modifiche al vostro sito:\n\n* Ripristino dei file e/o dei contenuti del database del sito da un backup\n* Modifica della Configurazione globale\n* Aggiornamento di Joomla!\n* Aggiornamento di un template del sito\n\nSe questo messaggio NON vi è stato inviato come risultato di una modifica desiderata e prevista, vi invitiamo a verificare immediatamente il vostro sito poiché potrebbe essere un'indicazione di attività di hacking; oppure di un'estensione o altro software di terze parti che fa qualcosa di cui non eravate a conoscenza e che potrebbe avere un impatto negativo sul vostro sito.\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY_HTML="<p>Salve,</p><p>Vi informiamo che uno o più file critici sono stati modificati sul vostro sito, {SITENAME}. L'elenco dei file modificati sul vostro sito è il seguente:</p>{INFO_HTML}<h3>Devo preoccuparmi?</h3><p>I \"file critici\", nel contesto di questo messaggio e-mail, sono i file più frequentemente presi di mira dagli hacker dopo un attacco riuscito a un sito. Questi file possono anche essere <em>e il più delle volte lo sono</em> modificati per motivi legittimi. Ad esempio, vengono modificati quando si salva la Configurazione globale del sito o quando si aggiorna Joomla! o uno dei suoi template.</p><p>NON dovreste preoccuparvi se avete ricevuto questa e-mail dopo che voi, o un altro amministratore di cui vi fidate, avete apportato una delle seguenti modifiche al vostro sito:</p><ul><li>Ripristino dei file e/o dei contenuti del database del sito da un backup</li><li>Modifica della Configurazione globale</li><li>Aggiornamento di Joomla!</li><li>Aggiornamento di un template del sito</li></ul><p>Se questo messaggio NON vi è stato inviato come risultato di una modifica desiderata e prevista, vi invitiamo a verificare immediatamente il vostro sito poiché potrebbe essere un'indicazione di attività di hacking; oppure di un'estensione o altro software di terze parti che fa qualcosa di cui non eravate a conoscenza e che potrebbe avere un impatto negativo sul vostro sito.</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_TITLE="Admin Tools: File monitorato modificato"
COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_DESC="Inviata da Admin Tools quando uno o più file che hai scelto di monitorare per le modifiche sono stati modificati."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_SUBJECT="File monitorati modificati su {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY="Salve,\n\nVi informiamo che uno o più file che avete richiesto ad Admin Tools di monitorare per le modifiche sono stati modificati sul vostro sito, {SITENAME}. L'elenco dei file modificati sul vostro sito è il seguente:\n\n{INFO}\n\nSe questo messaggio non vi è stato inviato come risultato di una modifica desiderata e prevista, vi invitiamo a verificare immediatamente il vostro sito poiché potrebbe essere un'indicazione di attività di hacking.\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY_HTML="<p>Salve,</p><p>Vi informiamo che uno o più file che avete richiesto ad Admin Tools di monitorare per le modifiche sono stati modificati sul vostro sito, {SITENAME}. L'elenco dei file modificati sul vostro sito è il seguente:</p>{INFO_HTML}<p>Se questo messaggio non vi è stato inviato come risultato di una modifica desiderata e prevista, vi invitiamo a verificare immediatamente il vostro sito poiché potrebbe essere un'indicazione di attività di hacking.</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_TITLE="Admin Tools: Super utenti aggiunti"
COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_DESC="Inviata da Admin Tools quando viene creato un Super utente e la funzionalità Monitora account Super utente è abilitata."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_SUBJECT="Sono stati aggiunti Super utenti a {SITENAME}"
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY="Salve,\n\nVi informiamo che abbiamo rilevato l'aggiunta sospetta di uno o più account Super utente al vostro sito, {SITENAME}. Questi nuovi account Super utente non sembrano essere stati creati tramite i mezzi ordinari, ovvero la pagina \"Utenti\" di Joomla!. Pertanto sono stati bloccati. I nuovi account Super utente rilevati e bloccati sono:\n\n{INFO}\n\nDevo preoccuparmi?\n======================================================================\n\nGli account Super utente hanno pieno accesso al vostro sito. Possono modificare tutti i contenuti, senza alcuna restrizione. Possono anche installare software in grado di accedere o modificare ogni aspetto del vostro sito, inclusi file arbitrari, contenuti del database e impostazioni di configurazione. Concedete l'accesso Super utente solo a persone di cui vi fidate.\n\nSe state ricevendo questa e-mail significa che questi account Super utente sono stati creati al di fuori della pagina \"Utenti\" di Joomla!. In genere ciò significa che un hacker ha trovato un modo per aggirare la sicurezza del vostro sito o del vostro server e ha tentato di creare furtivamente account Super utente per sé stesso. Per questo motivo questi account sono stati bloccati, ovvero non possono essere utilizzati per accedere al vostro sito.\n\nÈ tuttavia possibile che stiate ricevendo questa e-mail per errore: se voi o un altro Super utente avevate intenzione di creare questi account Super utente e avete utilizzato uno strumento di terze parti per farlo. In tal caso non preoccupatevi. Accedete semplicemente al pannello di amministrazione backend del vostro sito con il vostro account Super utente, andate alla pagina Utenti, modificate gli utenti elencati in questa e-mail e sbloccateli.\n\nSe voi o un altro Super utente NON avevate intenzione di creare questi Super utenti, vi consigliamo di verificare il vostro sito e il vostro server per qualsiasi altro segno di attività anomala.\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY_HTML="<p>Salve,</p><p>Vi informiamo che abbiamo rilevato l'aggiunta sospetta di uno o più account Super utente al vostro sito, {SITENAME}. Questi nuovi account Super utente non sembrano essere stati creati tramite i mezzi ordinari, ovvero la pagina \"Utenti\" di Joomla!. Pertanto sono stati bloccati. I nuovi account Super utente rilevati <strong>e bloccati</strong> sono:</p>{INFO_HTML}<h3>Devo preoccuparmi?</h3><p>Gli account Super utente hanno pieno accesso al vostro sito. Possono modificare tutti i contenuti, senza alcuna restrizione. Possono anche installare software in grado di accedere o modificare ogni aspetto del vostro sito, inclusi file arbitrari, contenuti del database e impostazioni di configurazione. Concedete l'accesso Super utente solo a persone di cui vi fidate.</p><p>Se state ricevendo questa e-mail significa che questi account Super utente sono stati creati al di fuori della pagina \"Utenti\" di Joomla!. In genere ciò significa che un hacker ha trovato un modo per aggirare la sicurezza del vostro sito o del vostro server e ha tentato di creare furtivamente account Super utente per sé stesso. Per questo motivo questi account sono stati bloccati, ovvero non possono essere utilizzati per accedere al vostro sito.</p><p>È tuttavia possibile che stiate ricevendo questa e-mail per errore: se voi o un altro Super utente avevate intenzione di creare questi account Super utente e avete utilizzato uno strumento di terze parti per farlo. In tal caso non preoccupatevi. Accedete semplicemente al pannello di amministrazione backend del vostro sito con il vostro account Super utente, andate alla pagina Utenti, modificate gli utenti elencati in questa e-mail e sbloccateli.</p><p>Se voi o un altro Super utente NON avevate intenzione di creare questi Super utenti, vi consigliamo di verificare il vostro sito e il vostro server per qualsiasi altro segno di attività anomala.</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_RESCUEURL_TITLE="Admin Tools: URL di recupero"
COM_ADMINTOOLS_MAIL_RESCUEURL_DESC="Inviata da Admin Tools quando un utente backend richiede un URL di recupero per riottenere l'accesso al sito."
COM_ADMINTOOLS_EMAIL_RESCUEURL_SUBJECT="URL di recupero richiesto su {SITENAME} per {USER}"
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY="Salve,\n\nVi informiamo che l'utente {USER} ha richiesto un URL di recupero per il vostro sito, {SITENAME}. Se siete stati voi a fare questa richiesta, fate clic sul seguente link, oppure copiate e incollate l'URL nel vostro browser. Questo vi permetterà di accedere al pannello di amministrazione backend del vostro sito dove potrete sbloccarvi e/o modificare la configurazione di Admin Tools. L'URL di recupero è:\n\n{RESCUEURL}\n\nLe informazioni verso la fine di questa e-mail vi indicano cosa fare una volta effettuato l'accesso al backend del vostro sito.\n\nNon ho idea del perché sto ricevendo questa e-mail\n======================================================================\n\nConsultate la sezione \"Cos'è l'URL di recupero\" più in basso. NON è necessario intraprendere alcuna azione e NON è necessario preoccuparsi.\n\nChi ha richiesto l'URL di recupero?\n======================================================================\n\nNome utente: {USER}\nIndirizzo IP: {IP} (Ricerca IP: {LOOKUP})\nUser Agent: {UA}\n\nCos'è l'URL di recupero?\n======================================================================\n\nA volte una configurazione di Admin Tools troppo restrittiva può comportare il blocco accidentale di voi, un Super utente, fuori dal sito. Normalmente ciò richiederebbe la rinomina del file del plugin di sistema di Admin Tools per sbloccarsi. Questa operazione è un po' complessa e soggetta a errori.\n\nLa funzionalità URL di recupero aggira questo problema. Accedendo a un URL speciale quando si è bloccati fuori dal sito, viene inviata questa e-mail. L'URL in questa e-mail è valido solo per lo stesso browser e indirizzo IP che ha effettuato la richiesta e solo per un tempo limitato. Accedendovi si arriva a una pagina di accesso amministratore temporaneamente sbloccata. Questo consente di accedere al pannello di amministrazione backend del vostro sito per sbloccarsi e/o modificare le impostazioni di Admin Tools.\n\nPer impostazione predefinita, questa funzionalità è abilitata su tutte le installazioni di Admin Tools. Inoltre, un messaggio sull'accesso all'URL di recupero viene visualizzato per impostazione predefinita quando qualcuno viene bloccato, A MENO CHE non abbiate impostato un \"Messaggio personalizzato\" nella pagina Configura WAF di Admin Tools. Se non avete idea del perché abbiate ricevuto questo messaggio, è probabile che qualcuno abbia visto il messaggio predefinito di IP bloccato e abbia indovinato correttamente il vostro indirizzo e-mail di Super utente. Non preoccupatevi però, quello che ha fatto è completamente inutile poiché avrebbe anche bisogno di accedere al vostro account e-mail e alla vostra password di Super utente per accedere al vostro sito, ovvero avrebbe già dovuto avervi hackerato. Come già documentato, vi consigliamo vivamente di modificare il \"Messaggio personalizzato\" per rendere meno ovvio che il vostro sito è protetto da Admin Tools. Se non desiderate utilizzare la funzionalità URL di recupero - e siete disposti a rinominare manualmente i file secondo la documentazione quando venite bloccati - andate su Estensioni, Plugin e modificate le opzioni del plugin di sistema Admin Tools. Vedrete un'opzione per l'URL di recupero. Impostatela su No per disabilitare questa funzionalità.\n\nCosa fare dopo aver effettuato l'accesso?\n======================================================================\n\nSe il vostro IP è bloccato da Admin Tools, andate su Componenti, Admin Tools e fate clic sul grande pulsante Sblocca il mio IP nella parte superiore della pagina.\n\nSe continuate a vedere il vostro IP bloccato senza aver fatto nulla di sospetto a vostra conoscenza, l'IP bloccato è sempre lo stesso ma diverso da quello riportato da http://www.ip-adress.eu/ e https://www.whatismyip.com/, il vostro sito potrebbe essere dietro un CDN o un proxy inverso. In questo caso, oltre alle istruzioni precedenti, andate su Sistema, Configurazione globale. Impostate l'opzione \"Dietro un load balancer\" su Sì e salvate.\n\nSe, tuttavia, il vostro indirizzo IP reale come riportato dai due strumenti elencati sopra continua a essere bannato, dovreste risolvere il problema della causa del ban. Andate su Componenti, Admin Tools, Web Application Firewall, Registro eccezioni di sicurezza e controllate il Motivo e l'URL di destinazione per le voci che hanno il vostro indirizzo IP nel campo indirizzo IP. Se non siete sicuri di cosa significhi, aprite un ticket di supporto ricordando di copiare le informazioni dal Registro eccezioni di sicurezza. Si noti che è necessario avere un abbonamento attivo per ricevere supporto.\n\nSe avete dimenticato il parametro URL segreto dell'amministratore, andate su Componenti, Admin Tools, Web Application Firewall, Configura WAF, fate clic sulla scheda Funzionalità di protezione di base e trovate l'opzione \"Parametro URL segreto dell'amministratore\". Modificate o rimuovete tutto il testo in quella casella per reimpostare o rimuovere, rispettivamente, questa funzionalità.\n\nCosa fare se non riesco ancora ad accedere al mio sito?\n======================================================================\n\nCi sono due casi in cui la funzionalità URL di recupero, o la rinomina del file del plugin di sistema di Admin Tools, non vi aiuterà. Questi sono i due casi in cui Admin Tools ha creato un file di configurazione del server, il che significa che siete bloccati dal vostro server, non da Admin Tools.\n\nIl primo è la funzionalità di protezione con password della directory amministratore. Eliminate i file denominati .htaccess e .htpasswd dalla directory administrator del vostro sito.\n\nL'altro caso è quando avete utilizzato la funzionalità Generatore di .htaccess di Admin Tools. In questo caso c'è un file .htaccess nella radice del vostro sito. Potreste voler sostituire il suo contenuto con il contenuto predefinito del file .htaccess di Joomla!.\n\nIn entrambi i casi occorre notare che i file hanno nomi che iniziano con un punto. Questo li rende nascosti. Sarà necessario abilitare la visualizzazione dei file nascosti per modificarli/eliminarli. Se non siete sicuri di come farlo, chiedete al vostro hosting e ditegli che avete bisogno di modificare/eliminare file nascosti. Di solito indicheranno un'opzione nel gestore file del pannello di controllo del loro hosting.\n\nIn qualsiasi altro caso il vostro problema non è correlato ad Admin Tools. Avete un altro plugin di sicurezza sul vostro sito? In caso affermativo, controllate le sue impostazioni. In caso contrario, verificate con il vostro hosting. Il più delle volte gli hosting hanno i propri sistemi di sicurezza del server che possono bloccarvi fuori dal vostro sito."
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY_HTML="<p>Salve,</p><p>Vi informiamo che l'utente {USER} ha richiesto un URL di recupero per il vostro sito, {SITENAME}. Se siete stati voi a fare questa richiesta, fate clic sul seguente link, oppure copiate e incollate l'URL nel vostro browser. Questo vi permetterà di accedere al pannello di amministrazione backend del vostro sito dove potrete sbloccarvi e/o modificare la configurazione di Admin Tools. L'URL di recupero è:</p><p><a href=\"{RESCUEURL}\" rel=\"alternate\">{RESCUEURL}</a></p><p>Le informazioni verso la fine di questa e-mail vi indicano cosa fare una volta effettuato l'accesso al backend del vostro sito.</p><h3>Non ho idea del perché sto ricevendo questa e-mail</h3><p>Consultate la sezione \"Cos'è l'URL di recupero\" più in basso. <strong>NON</strong> è necessario intraprendere alcuna azione e <strong>NON</strong> è necessario preoccuparsi.</p><h3>Chi ha richiesto l'URL di recupero?</h3><p>Nome utente: {USER}<br />Indirizzo IP: {IP} (<a href=\"{LOOKUP}\">Ricerca IP</a>)<br />User Agent: {UA}</p><h3>Cos'è l'URL di recupero?</h3><p>A volte una configurazione di Admin Tools troppo restrittiva può comportare il blocco accidentale di voi, un Super utente, fuori dal sito. Normalmente ciò richiederebbe la rinomina del file del plugin di sistema di Admin Tools per sbloccarsi. Questa operazione è un po' complessa e soggetta a errori.</p><p>La funzionalità URL di recupero aggira questo problema. Accedendo a un URL speciale quando si è bloccati fuori dal sito, viene inviata questa e-mail. L'URL in questa e-mail è valido solo per lo stesso browser e indirizzo IP che ha effettuato la richiesta e solo per un tempo limitato. Accedendovi si arriva a una pagina di accesso amministratore <em>temporaneamente</em> sbloccata. Questo consente di accedere al pannello di amministrazione backend del vostro sito per sbloccarsi e/o modificare le impostazioni di Admin Tools.</p><p>Per impostazione predefinita, questa funzionalità è abilitata su tutte le installazioni di Admin Tools. Inoltre, un messaggio sull'accesso all'URL di recupero viene visualizzato per impostazione predefinita quando qualcuno viene bloccato, A MENO CHE non abbiate impostato un \"Messaggio personalizzato\" nella pagina Configura WAF di Admin Tools. Se non avete idea del perché abbiate ricevuto questo messaggio, è probabile che qualcuno abbia visto il messaggio predefinito di IP bloccato e abbia indovinato correttamente il vostro indirizzo e-mail di Super utente. Non preoccupatevi però, quello che ha fatto è completamente inutile poiché avrebbe anche bisogno di accedere al vostro account e-mail e alla vostra password di Super utente per accedere al vostro sito, ovvero avrebbe già dovuto avervi hackerato. Come già documentato, vi consigliamo vivamente di modificare il \"Messaggio personalizzato\" per rendere meno ovvio che il vostro sito è protetto da Admin Tools. Se non desiderate utilizzare la funzionalità URL di recupero - e siete disposti a rinominare manualmente i file secondo la documentazione quando venite bloccati - andate su Estensioni, Plugin e modificate le opzioni del plugin di sistema Admin Tools. Vedrete un'opzione per l'URL di recupero. Impostatela su No per disabilitare questa funzionalità.</p><h3>Cosa fare dopo aver effettuato l'accesso?</h3><p>Se il vostro IP è bloccato da Admin Tools, andate su Componenti, Admin Tools e fate clic sul grande pulsante Sblocca il mio IP nella parte superiore della pagina.</p><p>Se continuate a vedere il vostro IP bloccato senza aver fatto nulla di sospetto a vostra conoscenza, l'IP bloccato è sempre lo stesso ma diverso da quello riportato da <a href=\"http://www.ip-adress.eu/\">http://www.ip-adress.eu/ </a><em>e</em> <a href=\"https://www.whatismyip.com/\">https://www.whatismyip.com/</a>, il vostro sito potrebbe essere dietro un CDN o un proxy inverso. In questo caso, oltre alle istruzioni precedenti, andate su Sistema, Configurazione globale. Impostate l'opzione \"Dietro un load balancer\" su Sì e salvate.</p><p>Se, tuttavia, il vostro indirizzo IP reale come riportato dai due strumenti elencati sopra continua a essere bannato, dovreste risolvere il problema della causa del ban. Andate su Componenti, Admin Tools, Web Application Firewall, Registro eccezioni di sicurezza e controllate il Motivo e l'URL di destinazione per le voci che hanno il vostro indirizzo IP nel campo indirizzo IP. Se non siete sicuri di cosa significhi, <a href=\"https://www.akeeba.com/support/admin-tools.html\" rel=\"alternate\">aprite un ticket di supporto</a> ricordando di copiare le informazioni dal Registro eccezioni di sicurezza. Si noti che è necessario avere un abbonamento attivo per ricevere supporto.</p><p>Se avete dimenticato il parametro URL segreto dell'amministratore, andate su Componenti, Admin Tools, Web Application Firewall, Configura WAF, fate clic sulla scheda Funzionalità di protezione di base e trovate l'opzione \"Parametro URL segreto dell'amministratore\". Modificate o rimuovete tutto il testo in quella casella per reimpostare o rimuovere, rispettivamente, questa funzionalità.</p><h3>Cosa fare se non riesco ancora ad accedere al mio sito?</h3><p>Ci sono due casi in cui la funzionalità URL di recupero, o la rinomina del file del plugin di sistema di Admin Tools, non vi aiuterà. Questi sono i due casi in cui Admin Tools ha creato un file di configurazione del <em>server</em>, il che significa che siete bloccati dal <em>vostro server</em>, non da Admin Tools.</p><p>Il primo è la funzionalità di <strong>protezione con password della directory amministratore</strong>. Eliminate i file denominati <code>.htaccess</code> e <code>.htpasswd</code> dalla directory <code>administrator</code> del vostro sito. </p><p>L'altro caso è quando avete utilizzato la funzionalità <strong>Generatore di .htaccess</strong> di Admin Tools. In questo caso c'è un file <code>.htaccess</code> nella radice del vostro sito. Potreste voler sostituire il suo contenuto con il <a href=\"https://raw.githubusercontent.com/joomla/joomla-cms/staging/htaccess.txt\" rel=\"alternate\">contenuto predefinito del file .htaccess di Joomla!</a>.</p><p>In entrambi i casi occorre notare che i file hanno nomi che iniziano con un punto. Questo li rende <em>nascosti</em>. Sarà necessario abilitare la visualizzazione dei file nascosti per modificarli/eliminarli. Se non siete sicuri di come farlo, chiedete al vostro hosting e ditegli che avete bisogno di modificare/eliminare file <em>nascosti</em>. Di solito indicheranno un'opzione nel gestore file del pannello di controllo del loro hosting. </p><p>In qualsiasi altro caso il vostro problema non è correlato ad Admin Tools. Avete un altro plugin di sicurezza sul vostro sito? In caso affermativo, controllate le sue impostazioni. In caso contrario, verificate con il vostro hosting. Il più delle volte gli hosting hanno i propri sistemi di sicurezza del server che possono bloccarvi fuori dal vostro sito.</p>"

COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_TITLE="Admin Tools: Richiesta bloccata"
COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_DESC="Inviata da Admin Tools quando una richiesta viene bloccata dal suo Web Application Firewall."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_SUBJECT="Richiesta bloccata su {SITENAME}"
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY="Salve,\n\nVi informiamo che è stata rilevata un'eccezione di sicurezza sul vostro sito, {SITENAME}, con i seguenti dettagli:\n\nIndirizzo IP: {IP} (Ricerca IP: {LOOKUP})\nMotivo: {REASON}\n\nSe questo tipo di eccezione di sicurezza si ripete, accedete al backend del vostro sito e aggiungete questo indirizzo IP alla funzionalità Web Application Firewall di Admin Tools per bloccare completamente l'utente che si comporta in modo scorretto.\n\nCordiali saluti,\n\nIl team di {SITENAME}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in {SITENAME}. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY_HTML="<p>Salve,</p><p>Vi informiamo che è stata rilevata un'eccezione di sicurezza sul vostro sito, {SITENAME}, con i seguenti dettagli:</p><p>Indirizzo IP: {IP} (<a href=\"{LOOKUP}\">Ricerca IP</a>)<br />Motivo: {REASON}</p><p>Se questo tipo di eccezione di sicurezza si ripete, accedete al backend del vostro sito e aggiungete questo indirizzo IP alla funzionalità Web Application Firewall di Admin Tools per bloccare completamente l'utente che si comporta in modo scorretto.</p><p>Cordiali saluti,</p><p>Il team di {SITENAME}</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un amministratore in <em>{SITENAME}</em>. Non rispondere a questa e-mail, è inviata da un indirizzo e-mail non monitorato.</small></p>"

COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_TITLE="Admin Tools: Numerose richieste bloccate"
COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_DESC="Inviata da Admin Tools quando il vostro sito ha bloccato molte richieste in un periodo di tempo."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_SUBJECT="Numero elevato di richieste bloccate su {SITENAME}"
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY="Salve,\n\nVi informiamo che il sito web {SITENAME} sta attualmente bloccando un numero elevato di richieste.\n\nUn totale di {NUM} richieste è stato bloccato dal {DATE}. Potreste voler verificare il motivo delle richieste bloccate e valutare se potrebbero essere necessarie misure aggiuntive nel caso in cui si sospetti che sia l'inizio di un attacco prolungato contro il vostro sito."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY_HTML="<p>Salve,</p><p>Vi informiamo che il sito web {SITENAME} sta attualmente bloccando un numero elevato di richieste</p><p>Un totale di {NUM} richieste è stato bloccato dal {DATE}. Potreste voler verificare il motivo delle richieste bloccate e valutare se potrebbero essere necessarie misure aggiuntive nel caso in cui si sospetti che sia l'inizio di un attacco prolungato contro il vostro sito.</p>"

COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_TITLE="Admin Tools: elenchi di IP dei crawler disattivati"
COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_DESC="Inviata da Admin Tools ai Super utenti quando disattiva automaticamente l'opzione «Usa gli elenchi di IP dei crawler» perché la cache del sito sembra non funzionare o gli elenchi non possono essere scaricati."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_SUBJECT="Gli elenchi di IP dei crawler sono stati disattivati su {SITENAME}"
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY="Salve,\n\nAdmin Tools ha disattivato automaticamente l'opzione «Usa gli elenchi di IP dei crawler» su {SITENAME} il {DATE} perché {CAUSE}.\n\nQuesto evita che il sito rallenti. Finché non riattivi l'opzione, le tue impostazioni Blocca e Non bloccare per i crawler dei motori di ricerca e dell'IA non vengono applicate.\n\nCome risolvere:\n\n* Se la causa è che la cache del sito non memorizza alcun dato: vai su Sistema, Configurazione globale, Sistema, e controlla le impostazioni della cache. Assicurati che la cartella della cache sia scrivibile, oppure che il tuo server Redis o Memcached sia in funzione e raggiungibile.\n* Se la causa è che il download degli elenchi continua a fallire: verifica che il tuo server possa effettuare connessioni in uscita verso altri siti web (firewall, impostazioni del proxy, restrizioni dell'hosting).\n\nUna volta risolto il problema, vai su Componenti, Admin Tools, Web Application Firewall, Configura WAF, fai clic sulla scheda Crawler e riattiva «Usa gli elenchi di IP dei crawler». Puoi farlo direttamente all'indirizzo {URL}\n\nNota: Stai ricevendo questo messaggio e-mail automatico perché sei un Super utente su {SITENAME}. Non rispondere a questa e-mail, viene inviata da un indirizzo non monitorato."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY_HTML="<p>Salve,</p><p>Admin Tools ha disattivato automaticamente l'opzione «Usa gli elenchi di IP dei crawler» su {SITENAME} il {DATE} perché {CAUSE}.</p><p>Questo evita che il sito rallenti. Finché non riattivi l'opzione, le tue impostazioni Blocca e Non bloccare per i crawler dei motori di ricerca e dell'IA non vengono applicate.</p><p>Come risolvere:</p><ul><li>Se la causa è che la cache del sito non memorizza alcun dato: vai su Sistema, Configurazione globale, Sistema, e controlla le impostazioni della cache. Assicurati che la cartella della cache sia scrivibile, oppure che il tuo server Redis o Memcached sia in funzione e raggiungibile.</li><li>Se la causa è che il download degli elenchi continua a fallire: verifica che il tuo server possa effettuare connessioni in uscita verso altri siti web (firewall, impostazioni del proxy, restrizioni dell'hosting).</li></ul><p>Una volta risolto il problema, vai su Componenti, Admin Tools, Web Application Firewall, Configura WAF, fai clic sulla scheda Crawler e riattiva «Usa gli elenchi di IP dei crawler». Puoi farlo direttamente <a href=\"{URL}\">in Configura WAF</a>.</p><p><small>Stai ricevendo questo messaggio e-mail automatico perché sei un Super utente su <em>{SITENAME}</em>. Non rispondere a questa e-mail, viene inviata da un indirizzo non monitorato.</small></p>"

