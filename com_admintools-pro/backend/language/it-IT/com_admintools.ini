COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_WORKS="L'autoattivazione dell'utente è abilitata sul tuo sito. Agli utenti disattivati automaticamente verrà inviata un'e-mail con le istruzioni per riattivare il proprio account."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_ADMINACTIVATION="L'attivazione degli utenti è impostata su <strong>Amministratore</strong>, il che significa che la nuova e-mail di attivazione verrà inviata ai Super utenti che dovranno riattivare l'utente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_NOREGISTRATION="La registrazione degli utenti sul tuo sito è disabilitata, pertanto Admin Tools non può disattivare gli utenti."
