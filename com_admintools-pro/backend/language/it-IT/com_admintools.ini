COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_TITLE="$live_site dovrebbe essere vuoto in configuration.php"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_DESC="L'opzione <code>$live_site</code> è una soluzione legacy per i server web dietro un reverse proxy, un load balancer o una CDN che non invia un'intestazione HTTP <code>X-Forwarded-Host</code>, oppure la cui intestazione viene ignorata a causa di una configurazione errata del server web. Alcuni la usano anche per impostare l'URL del sito per la CLI di Joomla. Anche questo è sconsigliato: la CLI di Joomla offre un modo più sicuro per fare la stessa cosa, la sua opzione <code>--live-site=%s</code>."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MATCH="Il tuo sito viene raggiunto con lo stesso nome host indicato in <code>$live_site</code>, quindi non ti serve. Modifica il file <code>configuration.php</code> del sito e svuota la variabile <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MISMATCH="Il tuo server riporta un nome host diverso da quello indicato in <code>$live_site</code>. Chiedi al tuo host di configurare il server web in modo che rispetti l'intestazione HTTP <code>X-Forwarded-Host</code> inviata dal reverse proxy, dal load balancer o dalla CDN davanti al tuo sito. Poi modifica il file <code>configuration.php</code> del sito e svuota la variabile <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_NOHOST="Il tuo server non riporta l'intestazione HTTP Host. Chiedi al tuo host di configurare il server in modo che la imposti. Se davanti al tuo sito c'è un reverse proxy, un load balancer o una CDN, potrebbe essere necessario configurare il server web in modo che rispetti l'intestazione HTTP <code>X-Forwarded-Host</code>. Poi modifica il file <code>configuration.php</code> del sito e svuota la variabile <code>$live_site</code>: <code>public $live_site = '';</code>"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_TITLE="Rapporto errori dovrebbe essere impostato su Nessuna in un sito in produzione"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_DESC="Rapporto errori deve essere impostato su Nessuna nei siti in produzione. In caso contrario, errori, avvisi e notifiche di PHP possono rivelare inavvertitamente informazioni sensibili o utili a un malintenzionato. Usa Massimo solo durante la risoluzione di un problema, preferibilmente su una copia privata del sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_MSG_FAIL="Rapporto errori non è impostato su Nessuna. Vai in Sistema, Configurazione globale, scheda Server, e imposta Rapporto errori su Nessuna."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX="Imposta Rapporto errori su Nessuna"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX_DONE="Rapporto errori è stato impostato su Nessuna."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_TITLE="Sessioni condivise deve essere disabilitato"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_DESC="Le sessioni condivise sono intrinsecamente pericolose. Quando un utente accede al frontend, accede automaticamente anche al backend. Questo consente a un malintenzionato di eseguire attacchi di credential stuffing e di forza bruta contro il frontend e, se hanno successo, di ritrovarsi connesso al backend. Può avere effetti negativi imprevisti e vanifica in parte altre misure di sicurezza che proteggono il backend del sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_MSG_FAIL="Sessioni condivise è abilitato. Vai in Sistema, Configurazione globale, scheda Sistema, e imposta Sessioni condivise su No."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX="Disabilita Sessioni condivise"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_CONFIRM="La disabilitazione di Sessioni condivise cambia il nome del cookie di sessione. Tutti, te compreso, verranno disconnessi dal sito e dovranno accedere di nuovo. Continuare?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_DONE="Sessioni condivise è stato disabilitato. Potrebbe essere necessario accedere di nuovo."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_TITLE="configuration.php non deve impostare un nome di sessione mentre Sessioni condivise è disabilitato"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_DESC="Joomla! assegna il nome al cookie di sessione in base al nome di sessione. Quando <code>configuration.php</code> imposta un nome di sessione, il frontend e il backend del sito usano lo stesso cookie di sessione, cioè condividono le sessioni, anche se Sessioni condivise è disabilitato. Questo comporta gli stessi rischi di Sessioni condivise. Joomla! memorizza un nome di sessione solo mentre Sessioni condivise è abilitato. Admin Tools 7.9.4 e le versioni precedenti ne scrivevano uno per errore in <code>configuration.php</code> ogni volta che la Verifica delle directory temporanee e di log correggeva la cartella temporanea o quella dei log del sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_MSG_FAIL="Il file <code>configuration.php</code> del sito imposta un nome di sessione (<code>$session_name</code>), anche se Sessioni condivise è disabilitato. Il frontend e il backend del sito condividono le sessioni. Rimuovilo, insieme ad altri valori che valgono solo durante il caricamento di una pagina e che vi sono stati scritti per errore."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX="Rimuovi il nome di sessione"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_CONFIRM="La rimozione del nome di sessione cambia il nome del cookie di sessione del frontend. Tutti coloro che hanno effettuato l'accesso al frontend del sito, forse anche tu, verranno disconnessi e dovranno accedere di nuovo. Continuare?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_DONE="Il nome di sessione è stato rimosso da configuration.php. Il frontend e il backend del sito non condividono più le sessioni. Potrebbe essere necessario accedere di nuovo."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_TITLE="Funzionalità di Joomla!"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_DESC="Questi controlli esaminano le impostazioni delle funzionalità del core di Joomla! e di Admin Tools e propongono valori adatti ai siti in produzione."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_TITLE="Il plugin Debug deve essere disabilitato o limitato ai Super utenti"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_DESC="Usa il plugin Sistema - Debug solo durante la risoluzione di un problema del sito, preferibilmente su una copia privata del sito, oppure per un periodo di tempo limitato. Il suo output può contenere informazioni sensibili o informazioni che un malintenzionato può usare contro il tuo sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_MSG_FAIL="Il plugin Sistema - Debug è abilitato e utenti che non sono Super utenti possono vederne l'output. Disabilita il plugin nei siti in produzione, oppure imposta i suoi Gruppi consentiti sui soli Super Users. Questi gruppi utente possono attualmente vederne l'output:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX="Disabilita il plugin Debug"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX_DONE="Il plugin Sistema - Debug è stato disabilitato."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_TITLE="L'utente \"admin\" non deve esistere oppure deve essere disabilitato"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_DESC="I nomi utente prevedibili, come <code>admin</code>, sono un bersaglio preferito degli attacchi di credential stuffing e di forza bruta. La compromissione di un account utente di questo tipo può essere dannosa per il tuo sito. Anche con permessi minimi (ad es. solo nel gruppo Registered) un account del genere resta pericoloso se Joomla! stesso o un'estensione di terze parti presenta una vulnerabilità di escalation dei privilegi."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_MSG_FAIL="Esiste un account utente abilitato con nome utente <code>admin</code>. Bloccalo, rinominalo o eliminalo. Spostarlo in un gruppo utente con meno privilegi non è sufficiente."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX="Blocca l'utente"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_CONFIRM="L'account utente denominato admin verrà bloccato e non potrà più accedere al tuo sito. Continuare?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_DONE="L'account utente denominato admin è stato bloccato."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SELF="Hai effettuato l'accesso come utente admin. Non puoi bloccare il tuo stesso account utente. Rinominalo, oppure accedi con un altro account."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SAVE="Impossibile bloccare l'account utente denominato admin."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_TITLE="Abilita la registrazione degli utenti solo se necessaria"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_DESC="Per impostazione predefinita, Joomla! consente la registrazione di nuovi utenti. Ciò è possibile anche se non hai pubblicato un modulo di accesso o una voce di menu per l'accesso o la registrazione degli utenti, purché Consenti registrazione utenti sia abilitato. Se non hai bisogno che i visitatori registrino un account, come accade per la maggior parte dei siti gestiti in autonomia, dovresti disabilitare questa funzionalità."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_MSG_FAIL="La registrazione degli utenti è abilitata. Se non hai bisogno che i visitatori registrino account utente sul tuo sito, vai in Utenti, Opzioni, scheda Opzioni utente, e imposta Consenti registrazione utenti su No."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX="Disabilita la registrazione degli utenti"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX_DONE="La registrazione degli utenti è stata disabilitata."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_TITLE="Limita l'accesso al backend a un piccolo numero di operatori fidati"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_DESC="L'accesso al backend è raramente necessario e ogni utente che lo possiede aumenta la superficie di attacco da proteggere. Valuta quali utenti hanno effettivamente bisogno di accedere al backend e se potrebbero svolgere il proprio lavoro dal frontend. Gli utenti che hanno bisogno dell'accesso al backend solo occasionalmente dovrebbero essere rimossi dai gruppi con accesso al backend (Super Users, Administrator, Manager) e aggiunti di nuovo solo quando ne hanno bisogno."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_PASS="%d account utente abilitati possono accedere al backend."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_FAIL="%1$d account utente abilitati possono accedere al backend: sono più di %2$d."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_TITLE="Usa l'autenticazione a più fattori su tutti gli account con accesso al backend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_DESC="Gli utenti con accesso al backend sono un bersaglio privilegiato degli attacchi di credential stuffing e di forza bruta. Un solo account compromesso, anche un semplice Manager, può causare molti danni al tuo sito. Abilita sempre l'autenticazione a più fattori su questi account utente. Rendila obbligatoria andando in Utenti, Opzioni, scheda Autenticazione a più fattori, e selezionando tutti i gruppi utente del backend del sito in Forza l'autenticazione a più fattori."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_MSG_FAIL="%d account utente abilitati con accesso al backend non usano l'autenticazione a più fattori:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_TITLE="Proteggi con password la directory administrator"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_DESC="Proteggere con password la directory administrator rende meno efficaci gli attacchi di credential stuffing e di forza bruta. Anche se le credenziali di un utente vengono divulgate, il malintenzionato deve superare un ulteriore ostacolo prima di poter accedere al backend del sito. Poiché la protezione è applicata dal server web stesso, è molto efficiente e limita l'impatto di chi tenta di forzare un accesso al backend."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_MSG_FAIL="La directory administrator non è protetta da password. Usa la funzionalità Protezione con password dell'amministratore di Admin Tools per proteggerla."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_TITLE="Applica un parametro URL segreto"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_DESC="Un parametro URL segreto rende meno efficaci gli attacchi di credential stuffing e di forza bruta. Anche se le credenziali di un utente vengono divulgate, il malintenzionato deve superare un ulteriore ostacolo prima di poter accedere al backend del sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_MSG_FAIL="Non hai impostato un parametro URL segreto per l'amministratore. Impostalo in Web Application Firewall, Configura WAF, scheda Funzionalità di base, Parametro URL segreto dell'amministratore."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_TITLE="Rimuovi gli account che \"non hanno mai effettuato l'accesso\""
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_DESC="Gli account utente creati ma che non hanno mai effettuato l'accesso sono account di spam che non ti servono, oppure account dimenticati con password potenzialmente compromesse. Rimuovili con un'attività pianificata di Joomla! di tipo \"Admin Tools – Elimina utenti inattivi\"."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_FAIL="%1$d account utente registrati più di %2$d giorni fa non hanno mai effettuato l'accesso. Crea un'attività pianificata di tipo \"Admin Tools – Elimina utenti inattivi\" per rimuoverli."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_TASK="Un'attività pianificata \"Admin Tools – Elimina utenti inattivi\" abilitata si occupa di questi account."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_TITLE="I Super utenti non devono poter accedere al frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_DESC="Per impostazione predefinita, i Super utenti possono accedere anche al frontend del sito. Questo consente a un malintenzionato di eseguire attacchi di credential stuffing e di forza bruta contro il frontend, meno protetto, per scoprire la password di un Super utente. La funzionalità \"Vieta l'accesso frontend ai Super Amministratori\" di Admin Tools impedisce ai Super utenti di accedere al frontend, mandando all'aria i piani degli attaccanti."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_MSG_FAIL="I Super utenti possono accedere al frontend. Abilita \"Vieta l'accesso frontend ai Super Amministratori\" in Web Application Firewall, Configura WAF, scheda Opzioni di hardening."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX="Vieta l'accesso frontend ai Super utenti"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX_DONE="I Super utenti non possono più accedere al frontend."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_TITLE="Gli utenti del backend non devono poter accedere al frontend"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_DESC="Per impostazione predefinita, gli utenti del backend possono accedere anche al frontend del sito. Questo consente a un malintenzionato di eseguire attacchi di credential stuffing e di forza bruta contro il frontend, meno protetto, per scoprire la password di un utente del backend. Modifica i permessi dei gruppi utente con accesso al backend e imposta il loro permesso Accesso sito su Negata, mandando all'aria i piani degli attaccanti."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_MSG_FAIL="%d account utente abilitati possono accedere sia al backend sia al frontend. Vai in Sistema, Configurazione globale, scheda Permessi, e imposta Accesso sito su Negata per questi gruppi utente:"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_TITLE="File e cartelle"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_DESC="Questi controlli cercano file e cartelle che non dovrebbero essere lasciati su un sito in produzione."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_TITLE="Akeeba Kickstart non dovrebbe essere lasciato nella radice web"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_DESC="Kickstart può estrarre qualsiasi file JPA, JPS o ZIP in qualsiasi punto del sito. In combinazione con una vulnerabilità di caricamento arbitrario di file in Joomla! stesso o in un'estensione di terze parti, consente a un malintenzionato di scrivere file arbitrari sul sito, eseguire il proprio codice e violare il sito. Rinominare il file, o impostare una password, è solo una buona misura <em>temporanea</em> mentre estrai un archivio di backup. Una volta terminato, Kickstart <strong>deve</strong> essere rimosso dal sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_MSG_FAIL="Questi file nella cartella principale del sito sono copie di Akeeba Kickstart. Eliminali."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_FIX_DONE="Eliminato: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_TITLE="La cartella installation deve essere eliminata"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_DESC="Una cartella <code>installation</code> lasciata dopo l'installazione di Joomla! o il ripristino di un backup può essere usata per sovrascrivere il sito. Deve essere rimossa una volta terminato."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_MSG_FAIL="C'è una cartella <code>installation</code> nella cartella principale del sito. Eliminala."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX="Elimina la cartella installation"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_CONFIRM="La cartella installation nella cartella principale del sito, e tutto il suo contenuto, verranno eliminati. L'operazione non può essere annullata. Continuare?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_DONE="La cartella installation è stata eliminata."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_TITLE="Le cartelle residue dell'installazione delle estensioni devono essere eliminate"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_DESC="Joomla! usa cartelle temporanee <code>install_*</code> mentre copia i file di un'estensione nella loro posizione finale, e normalmente le elimina subito. Se un'installazione non si conclude correttamente, rimangono sul sito e potrebbero rappresentare un rischio per la sicurezza. Eliminale. Puoi anche creare un'attività pianificata di tipo \"Admin Tools – Pulizia della directory temporanea\" per farlo automaticamente."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_MSG_FAIL="Queste cartelle di installazione residue si trovano nella cartella temporanea del sito, <code>%s</code>:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_FIX_DONE="Eliminato: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_TITLE="Rimuovi i file del core di Joomla! non necessari"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_DESC="Joomla! include nella cartella principale del sito alcuni file di esempio e informativi che non servono al funzionamento del sito. Servono solo a far sapere a tutti quale software usa il tuo sito. Joomla! li ripristina a ogni aggiornamento, quindi ricontrolla dopo ogni aggiornamento."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_MSG_FAIL="Questi file non necessari si trovano nella cartella principale del sito:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_HTACCESS="File .htaccess di esempio. Non ha alcun effetto se non viene rinominato in .htaccess su un server web Apache o LiteSpeed. Meglio usare il Generatore di .htaccess di Admin Tools."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_LICENSE="Il testo della licenza di Joomla!. Non è necessario per usare Joomla!."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_ROBOTS="File robots.txt di esempio. Non ha alcun effetto se non viene rinominato in robots.txt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_WEBCONFIG="File web.config di esempio. Non ha alcun effetto se non viene rinominato in web.config su un server web Microsoft IIS."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FIX_DONE="Eliminato: %s"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_TITLE="Il file di log di debug di Admin Tools dovrebbe essere disattivato e i relativi file di log eliminati"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_DESC="L'opzione \"Mantieni un file di log di debug\" di Admin Tools è pensata solo per la risoluzione dei problemi. Abilitala per un periodo molto limitato, preferibilmente su una copia privata del sito. Il file di log registra i dati delle richieste, che possono includere informazioni sensibili. Una volta risolto il problema, disattiva l'opzione ed elimina i file di log."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_ENABLED="L'opzione \"Mantieni un file di log di debug\" di Admin Tools è abilitata. Disattivala in Web Application Firewall, Configura WAF, scheda Registrazione e reporting."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_FILES="I file di log di debug di Admin Tools sono ancora presenti nella cartella dei log del sito. Eliminali."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE="Disattiva"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DELETE="Disattiva ed elimina i file di log"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE="Elimina i file di log"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DONE="Il file di log di debug è stato disattivato."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE_DONE="Il file di log di debug è disattivato e i relativi file di log sono stati eliminati."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_TITLE="Scanner delle modifiche ai file PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_DESC="Questi controlli usano le informazioni che lo Scanner delle modifiche ai file PHP raccoglie durante la scansione del sito, oppure ne esaminano le impostazioni."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_TITLE="Usa lo Scanner delle modifiche ai file PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_DESC="Esegui lo Scanner delle modifiche ai file PHP almeno una volta alla settimana, e anche prima e dopo l'installazione di un aggiornamento di Joomla!, di un aggiornamento di un'estensione di terze parti o di una nuova estensione di terze parti. Non solo ti avvisa in anticipo di file potenzialmente compromessi, ma consente anche ad Admin Tools di raccogliere informazioni su altri file problematici presenti sul sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_NEVER="Lo Scanner delle modifiche ai file PHP non ha mai completato una scansione del sito."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_OLD="Lo Scanner delle modifiche ai file PHP ha completato l'ultima scansione il %1$s, più di %2$d giorni fa."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_PASS="Lo Scanner delle modifiche ai file PHP ha completato l'ultima scansione il %s."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_TITLE="Nelle cartelle del core non devono esserci file non del core"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_DESC="Le cartelle del core di Joomla! dovrebbero contenere solo i file distribuiti da Joomla! stesso. Qualsiasi altro file al loro interno è stato lasciato da una vecchia versione di Joomla!, inserito da un'estensione che non si comporta correttamente, oppure piazzato da un malintenzionato. Esamina questi file e rimuovi quelli che non dovrebbero trovarsi lì. I file che hai esaminato e contrassegnato come sicuri nel rapporto di scansione non sono elencati."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_FAIL="Lo Scanner delle modifiche ai file PHP ha trovato %d file non del core nelle cartelle del core di Joomla!:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_IGNORED="Non è possibile verificarlo, perché lo Scanner delle modifiche ai file PHP è impostato per ignorare i file non del core nelle cartelle del core. Vai in Admin Tools, Opzioni, scheda Scanner file, e imposta \"File non del core in cartelle del core\" su Contrassegna oppure Contrassegna e segnala come minaccia. Poi esegui una scansione."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_TITLE="Nelle cartelle di media, immagini, file e lingue non dovrebbero esserci file PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_DESC="La cartella <code>images</code> (e qualsiasi altra cartella della Gestione media), <code>media</code>, <code>files</code>, <code>language</code>, <code>administrator/language</code> e <code>.well-known</code> sono destinate ai file statici: immagini, documenti, CSS, JavaScript e file di lingua. I file PHP che vi si trovano sono molto spesso backdoor caricate da malintenzionati attraverso un'estensione vulnerabile. Esaminali tutti; elimina quelli che non appartengono a un'estensione che usi."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_MSG_FAIL="%d file PHP trovati dove non dovrebbero essere:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_TITLE="I file di configurazione del server non dovrebbero consentire di eseguire file come PHP"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_DESC="Un file <code>.htaccess</code> può far eseguire al server web qualsiasi file come PHP o come script CGI, qualunque sia il suo nome (ad es. <code>AddType application/x-httpd-php .jpg</code>), oppure modificare le impostazioni di PHP. Un file <code>.user.ini</code> può far eseguire a PHP un altro file, persino un'immagine, prima o dopo ogni script PHP (<code>auto_prepend_file</code>). I malintenzionati li usano per trasformare un file caricato dall'aspetto innocuo in una backdoor. I file che impediscono soltanto l'esecuzione degli script, ad es. con <code>SetHandler none</code> o <code>php_flag engine off</code>, non vengono segnalati. Nemmeno quelli che si trovano direttamente nella cartella principale del tuo sito e nella cartella <code>administrator</code>, dove i provider di hosting li usano per scegliere la versione di PHP. Esamina tutti i file elencati; elimina quelli che non hai creato tu e che non appartengono a un'estensione che usi."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_MSG_FAIL="%d file di configurazione del server consentono di eseguire file come PHP o modificano le impostazioni di PHP:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_TITLE="Non rinominare file e cartelle per conservarne le vecchie versioni"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_DESC="Copie come <code>index-bak.php</code>, <code>index.php.old</code>, <code>configuration (1).php</code> o <code>cassiopeia-copy</code> sono un modo comune per conservare una vecchia versione di un file o di una cartella. Non vengono mai aggiornate, potrebbero essere ancora raggiungibili via web, potrebbero rivelare informazioni sensibili (un file di configurazione rinominato è un regalo per un malintenzionato) e potrebbero contenere codice vecchio e vulnerabile. Usa invece i backup o un sistema di controllo delle versioni; elimina queste copie."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_MSG_FAIL="%d file e cartelle sembrano copie rinominate:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_TITLE="Individua ed esamina i file di grandi dimensioni"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_DESC="I file di grandi dimensioni al di fuori delle cartelle della Gestione media e della cartella <code>files</code> sono spesso archivi di backup, dump del database o file di log dimenticati. Possono rivelare informazioni sensibili se possono essere scaricati e sprecano spazio su disco. Esaminali e rimuovi quelli che non ti servono. Puoi modificare il limite di dimensione, o disattivare questo controllo, in Admin Tools, Opzioni, scheda Scanner file."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_MSG_FAIL="%d file di grandi dimensioni trovati:"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_TITLE="File e cartelle nascosti"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_DESC="I file e le cartelle il cui nome inizia con un punto sono nascosti nella maggior parte degli elenchi di file. Alcuni sono legittimi, come <code>.htaccess</code>, <code>.htpasswd</code>, <code>.user.ini</code> e <code>.well-known</code>, che non vengono segnalati. Altri, come <code>.git</code>, <code>.env</code> o le impostazioni degli editor, rivelano informazioni sul tuo sito e non dovrebbero trovarsi su un sito in produzione. Anche i malintenzionati amano nascondere i propri file in questo modo."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_MSG_FAIL="%d file e cartelle nascosti trovati:"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_TITLE="Altri strumenti"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_DESC="Queste funzionalità di Admin Tools possono aiutarti a mantenere il sito in buona salute. Qui non viene verificato nulla; dai un'occhiata e decidi se ti sono utili."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_TITLE="Super utenti temporanei"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_DESC="Usa i Super utenti temporanei ogni volta che devi concedere a qualcuno l'accesso come Super utente per un periodo limitato, ad es. allo sviluppatore di un'estensione che deve risolvere un problema sul tuo sito. L'account scade automaticamente."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_TITLE="Configurazione permessi e Correzione permessi"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_DESC="Verifica la proprietà e i permessi dei file e delle cartelle del sito e applica permessi sensati, adatti al tuo caso d'uso e alla configurazione del server."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_TITLE="Verifica delle directory temporanee e di log"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_DESC="Esegui ogni tanto Verifica delle directory temporanee e di log, dalla sezione Strumenti del Pannello di controllo, per assicurarti che le cartelle temporanee e di log del sito esistano e siano scrivibili."

COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_LABEL="Controllo dello stato del sito: esamina le cartelle e i file esclusi"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_DESC="Durante la scansione, lo Scanner delle modifiche ai file PHP raccoglie anche informazioni per il Controllo dello stato del sito: file PHP nelle cartelle dei media, copie rinominate, file di grandi dimensioni e file nascosti. Se abilitata, queste informazioni vengono raccolte anche all'interno delle cartelle e dei file che hai escluso dalla scansione; questi continuano comunque a non essere analizzati alla ricerca di modifiche. Le esclusioni integrate di Admin Tools (cartelle temporanee, di log e della cache) vengono sempre saltate."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_LABEL="Controllo dello stato del sito: segnala i file di grandi dimensioni"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_DESC="Consente al Controllo dello stato del sito di elencare i file di grandi dimensioni trovati dallo Scanner delle modifiche ai file PHP sul tuo sito, in modo che tu possa esaminarli. I file nelle cartelle della Gestione media (ad es. <code>images</code>) e nella cartella <code>files</code> non vengono mai segnalati, poiché lì i file di grandi dimensioni sono previsti."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_LABEL="Controllo dello stato del sito: dimensione dei file di grandi dimensioni (MiB)"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_DESC="I file di almeno questa dimensione, in MiB, vengono segnalati come file di grandi dimensioni dal Controllo dello stato del sito. L'impostazione ha effetto alla successiva esecuzione dello Scanner delle modifiche ai file PHP."
