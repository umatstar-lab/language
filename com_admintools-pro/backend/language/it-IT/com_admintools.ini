COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_HEADER="Le funzionalita' frontend dello Scanner delle modifiche ai file PHP sono disabilitate"
COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_INTRO="La tua <em>Parola segreta</em> non e' sicura e puo' essere facilmente individuata. Per proteggere il tuo sito Admin Tools ha disabilitato l'accesso alla pianificazione frontend finche' non inserisci una parola segreta sicura. Il problema rilevato e':"
COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="In alternativa, fai clic sul pulsante qui sotto per reimpostare la parola segreta al valore suggerito <code>%s</code> In entrambi i casi dovrai aggiornare i tuoi processi CRON con la nuova parola segreta."
COM_ADMINTOOLS_CONTROLPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Fai clic su Opzioni, Frontend e inserisci una parola segreta piu' complessa."
COM_ADMINTOOLS_CONTROLPANEL_BTN_FESECRETWORD_RESET="Applica la parola segreta suggerita"

COM_ADMINTOOLS_CONTROLPANEL_LBL_DISCLAIMER="AVVERTENZA"
COM_ADMINTOOLS_CONTROLPANEL_LBL_DISTEXT="I componenti di sicurezza, come Admin Tools, non sono progettati per offrire una protezione al 100% del tuo sito contro qualsiasi attacco immaginabile. Possono aiutarti a migliorare la sicurezza del tuo sito. Devi comunque applicare il buon senso e buone abitudini di sicurezza per mantenere un sito sano e sicuro. Come minimo dovresti aggiornare regolarmente Joomla! e le sue estensioni; mantenere backup regolari, testati e off-site; e tenere d'occhio i comportamenti anomali del sito."

COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_HEAD="Percorso vuoto come directory di base del tuo sito."
COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_BODY="PHP riporta un percorso vuoto come directory di base del tuo sito. Cio' e' causato da un bug nelle versioni piu' vecchie di PHP. Chiedi al tuo host di aggiornare la versione PHP installata sul server. Se provi a utilizzare il pulsante Correzione permessi e' molto possibile che tu venga bloccato fuori dal tuo sito."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD="Password principale"
COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_HEAD="Protezione con password"
COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_INTRO="L'amministratore di questo sito ha protetto con una password alcune o tutte le funzionalita' di Admin Tools. Inserisci la password per poter accedere a tali funzionalita'."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MUSTENTERDLID="Devi inserire il tuo Download ID"
COM_ADMINTOOLS_CONTROLPANEL_LBL_NEEDSDLID="Devi inserire il tuo <b>Download ID</b> prima di poter aggiornare Admin Tools Professional. <a href='%s' target='_blank'>Se non conosci il tuo Download ID, fai clic qui</a>."
COM_ADMINTOOLS_CONTROLPANEL_MSG_WHERETOENTERDLID="Vai al menu Sistema di Joomla! dalla barra laterale sinistra. Trova il pannello Aggiornamenti e fai clic sul collegamento Siti di aggiornamento. Trova la voce \"Admin Tools Professional\" e fai clic su di essa. In alternativa, <a href=\"%s\">fai clic qui</a> per andare direttamente a quella pagina. Inserisci il tuo Download ID — che sia l'ID principale o un Download ID aggiuntivo — nel campo \"Chiave di download\" e fai clic sul pulsante Salva."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED="Il file di log di debug è stato disattivato. I file di log di debug esistenti sono stati conservati."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED_DELETED="Il file di log di debug è stato disattivato e i file di log di debug esistenti sono stati eliminati."
COM_ADMINTOOLS_CONTROLPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Importante:</strong> Se Joomla! ha gia' determinato la presenza di aggiornamenti per Admin Tools prima che tu abbia inserito il tuo Download ID, <em>potrebbe non essere in grado di scaricarli</em> anche dopo che hai inserito il tuo Download ID a causa di alcuni bug di lunga data in Joomla!. In questo caso scarica il file ZIP dell'ultima versione dal nostro sito. Quindi vai al menu Sistema di Joomla!, trova il pannello Installa, fai clic su Estensioni, fai clic sulla scheda Carica file pacchetto e installa il file ZIP scaricato <strong>due volte</strong> di seguito, <strong>senza</strong> disinstallare Admin Tools prima o tra le due installazioni. La doppia installazione e' necessaria per risolvere un altro bug di lunga data in Joomla! che a volte impedisce la copia di tutti i file aggiornati durante l'installazione di un aggiornamento dell'estensione."

COM_ADMINTOOLS_CONTROLPANEL_LBL_FESECRETWORD_RESET="La parola segreta e' stata cambiata in <code>%s</code>"

COM_ADMINTOOLS_CONTROLPANEL_LBL_RELOADUPDATE="Ricarica informazioni sull'aggiornamento"
COM_ADMINTOOLS_CONTROLPANEL_LBL_UPDATE_INFORMATION_RELOADED="Le informazioni sull'aggiornamento sono state ricaricate dal server"

COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_HEAD="Modalita' di recupero"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_MESSAGE="Admin Tools e' in esecuzione in Modalita' di recupero. Si tratta di una modalita' di risoluzione dei problemi che ti consente di sbloccarti se hai accidentalmente bloccato l'accesso al tuo sito. Le protezioni di Admin Tools sono temporaneamente disabilitate solo per l'accesso come amministratore dal tuo account e solo dal tuo browser e indirizzo IP. Finche' vedi questo messaggio Admin Tools continua a proteggere il tuo sito."
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_BTN_HOWTOUNBLOCK="Come mi sblocco?"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_BTN_ENDRESCUE="Termina modalità di recupero"

COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_HEAD="Il file di configurazione del server potrebbe dover essere rigenerato"
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN="Admin Tools ha rilevato che il file di configurazione del server (ad es. .htaccess, nginx.conf o web.config) è stato modificato. Si consiglia vivamente di inserire eventuali modifiche manuali nei campi <strong>Regole personalizzate</strong>, in modo da non perderle se si rigenera il file tramite Admin Tools"
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_REGENERATE="Rigenera"
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_IGNORE="Ignora"
COM_ADMINTOOLS_CONTROLPANEL_ERR_SERVERCONFIGWARN_REGENERATE="Impossibile rigenerare il file di configurazione del server."
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_REGENERATED="Il file di configurazione del server è stato rigenerato."
COM_ADMINTOOLS_SERVERCONFIGREMINDER_MSG="Il file di configurazione del server (.htaccess, nginx.conf o web.config) è stato generato da Admin Tools, ma non corrisponde più a quello che genererebbe questa versione di Admin Tools. <a href='%s'>Apri il Pannello di controllo di Admin Tools e rigeneralo</a> in modo che le protezioni più recenti diventino effettive."
COM_ADMINTOOLS_CORESUMS_WARN_HEAD="Verifica dei file del core non disponibile"
COM_ADMINTOOLS_CORESUMS_WARN_BODY="L'esecuzione più recente dello Scanner delle modifiche ai file PHP non è riuscita a scaricare i dati di checksum CoreSums, quindi i file non sono stati verificati rispetto ai checksum ufficiali del core di Joomla. La scansione è stata comunque completata, ma nessun file è stato contrassegnato come del core o non del core. Di solito si tratta di un problema di rete temporaneo. Se persiste, controlla le opzioni \"URL del servizio CoreSums\" e \"Timeout di download di CoreSums\" nella configurazione del componente."
COM_ADMINTOOLS_CORESUMS_WARN_DISMISS="Chiudi"

COM_ADMINTOOLS_CONTROLPANEL_LBL_DONATE="Donazione"

