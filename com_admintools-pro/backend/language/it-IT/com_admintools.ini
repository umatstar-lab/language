COM_ADMINTOOLS_NGINXCONFMAKER_WARN_RESTRICTIP_REALIP_HEAD="Limita l'accesso per IP non viene applicato"
COM_ADMINTOOLS_NGINXCONFMAKER_WARN_RESTRICTIP_REALIP="Limita l'accesso per IP è attivo, ma Consenti l'inoltro IP considera affidabili gli IP del proxy inverso / bilanciatore del carico. NginX controlla quindi l'indirizzo IP del visitatore, preso dall'intestazione X-Forwarded-For, invece dell'indirizzo del tuo proxy inverso o CDN, quindi consentire solo gli indirizzi IP selezionati rifiuterebbe ogni visitatore. Il file generato non limita l'accesso per IP. Limita invece gli indirizzi IP che possono raggiungere il server nel suo firewall, oppure disattiva Consenti l'inoltro IP."
