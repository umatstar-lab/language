COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_DESC="Debug lingua è pensato solo per sviluppatori e traduttori che vogliono vedere se il testo di una pagina proviene da una stringa di lingua e se tale stringa è tradotta nella lingua corrente. Tutti gli altri siti dovrebbero tenerlo disabilitato."
