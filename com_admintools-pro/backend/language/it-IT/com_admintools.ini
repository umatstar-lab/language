COM_ADMINTOOLS_NGINXCONFMAKER_LBL_EXCEPTIONPATHINFO="Consenti il path info per i file PHP in eccezione"
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_EXCEPTIONPATHINFO_NOTE="I file PHP in eccezione, così come i file PHP nelle directory con accesso diretto (file .php inclusi), gestiranno anche gli URL in cui un percorso segue il nome del file, ad es. <code>foobar.php/baz.png</code>. Affinché PHP riceva quel percorso, l'impostazione <em>blocco di codice fastcgi_pass</em> deve impostare <code>SCRIPT_FILENAME</code> e <code>PATH_INFO</code>; il file <code>fastcgi_params</code> fornito con NginX non imposta <code>PATH_INFO</code>. <a href=\"https://www.akeeba.com/documentation/admin-tools-joomla/nginx-server-protection.html#nginx-path-info\" target=\"_blank\">Leggi la documentazione</a> per la configurazione richiesta e le considerazioni sulla sicurezza."
