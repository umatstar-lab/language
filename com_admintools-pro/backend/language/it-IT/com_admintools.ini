COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_TITLE="Nessuna parola vietata è stata ancora definita."
COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_CONTENT="Le parole vietate consentono di bloccare qualsiasi richiesta pubblica sul frontend che contenga una o più di queste parole in qualsiasi parametro della richiesta. Possono essere utilizzate per bloccare spam evidente e linguaggio volgare inviati al sito."
