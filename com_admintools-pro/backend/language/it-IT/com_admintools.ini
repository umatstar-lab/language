COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK_MAYBE="<b>Forse</b>. Non siamo riusciti a rilevare il tipo di server, quindi non sappiamo se il tuo sito supporta i file di configurazione NginX. Consulta il tuo host riguardo al supporto per i file di configurazione NginX e al modo corretto di utilizzare un file nginx.conf personalizzato con il tuo sito."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK_NO="<b>No, per niente</b>. Abbiamo rilevato che stai utilizzando un tipo di server incompatibile con i file di configurazione NginX (ad es. Microsoft IIS, Apache, Lightspeed o Lighttpd). L'utilizzo del Generatore di configurazione NginX non avrà <strong>alcun effetto</strong> sul tuo sito."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_WILLTHISWORK_YES="<b>Molto probabilmente sì</b>. Abbiamo rilevato che il tipo di server web è NginX. Il supporto per la configurazione personalizzata per sito dipende tuttavia dal tuo host. Consulta il tuo host riguardo al modo corretto di utilizzare un file nginx.conf personalizzato con il tuo sito."

