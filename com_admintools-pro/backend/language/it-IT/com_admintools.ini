COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW="Nome vista"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_DESC="La vista del componente (area del componente) o il nome del controller che devono essere presenti nell'URL affinché questa regola corrisponda. Disabilita gli URL SEF e vedrai <code>view=NomeVista</code> o <code>task=NomeVista.NomeTask</code>, dove <var>NomeVista</var> è il Nome vista da inserire qui. Lasciando vuoto corrisponde a tutte le viste."
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_ANY="(Tutti)"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK="Task"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_ANY="(Tutti)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_DESC="Quale task (un comando per una specifica area del componente) applicare a questa regola. Disabilita gli URL SEF e vedrai <code>task=NomeTask</code> o <code>task=NomeVista.NomeTask</code>, dove <var>NomeTask</var> è il Task da inserire qui. Lasciando vuoto corrisponde a tutte le viste."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY="Parametro query"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_DESC="Il contenuto di quale parametro della query string verrà utilizzato per verificare la corrispondenza con questa regola, ad esempio <code>id</code>. Lascia vuoto per far corrispondere la regola indipendentemente dal contenuto del parametro query. Nota che la corrispondenza del contenuto query viene applicata solo <strong>dopo</strong> che Joomla ha convertito un URL SEF nel suo formato non-SEF. Ciò significa che alcuni parametri query potrebbero non essere visibili — anche se sono visibili a Joomla e Admin Tools, e quindi possono portare al blocco della richiesta da parte del Web Application Firewall — a meno che non vengano disabilitati gli URL SEF."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE="Tipo di filtro del parametro query"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_ANY="(Tutti)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_DESC="Scegli come verrà verificata la corrispondenza del parametro query. \"RegEx\" significa che il campo Parametro query contiene un'<a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">espressione regolare PHP</a> per verificare la corrispondenza con il contenuto del parametro query. Puoi negare un'espressione regolare aggiungendo un punto esclamativo come prefisso (<code>!</code>). \"Esatto\" significa che il nome del parametro query deve corrispondere esattamente al campo Parametro query così come inserito, incluse le lettere maiuscole e minuscole. \"Parziale\" significa che il nome del parametro query deve includere il Parametro query inserito, ad esempio il Parametro query \"bar\" corrisponderà a questi nomi di parametro query: \"re<em>bar</em>\", \"<em>bar</em>tender\" e \"<em>bar</em>\"."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_EXACT="Esatto"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_PARTIAL="Parziale"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_REGEX="RegEx"

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT="Contenuto query"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_ANY="(Qualsiasi contenuto)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_DESC="Lascia vuoto per far corrispondere la regola indipendentemente dal contenuto della query. Altrimenti, fornisci un'<a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">espressione regolare PHP</a>; se corrisponde al contenuto del parametro query, la regola viene soddisfatta. Puoi negare un'espressione regolare aggiungendo un punto esclamativo come prefisso (<code>!</code>)."

