COM_ADMINTOOLS_TITLE_CONFIGUREWAF="Configura WAF"

COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINACTIVE="Devi pubblicare il plugin \"System - Admin Tools\" prima che queste impostazioni abbiano effetto."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINACTIVE_DOIT="Clicca qui per andare al Gestore plugin"
COM_ADMINTOOLS_CONFIGUREWAF_ERR_NOPLUGINEXISTS="Devi installare e pubblicare il plugin \"System - Admin Tools\" (plg_admintools) prima che queste impostazioni abbiano effetto. Puoi provare a reinstallare Admin Tools, due volte di seguito, senza disinstallarlo prima o nel mezzo, per forzare Joomla! a installare il plugin mancante."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_KNOWN="Hai rinominato il file <code>plugins/system/admintools/services/provider.php</code> in <code>%s</code>. Di conseguenza Admin Tools <strong>non</strong> protegge il tuo sito. Se lo hai fatto intenzionalmente per risolvere un problema che stavi riscontrando, ricordati di rinominare il file in provider.php. Nella maggior parte dei casi puoi fare clic sul collegamento sottostante per farlo automaticamente."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_DOIT="Rinomina il file in provider.php"
COM_ADMINTOOLS_CONFIGUREWAF_ERR_MAINPHPRENAMED_UNKNOWN="Hai rinominato il file <code>plugins/system/admintools/services/provider.php</code>. Di conseguenza Admin Tools <strong>non</strong> protegge il tuo sito. Se lo hai fatto intenzionalmente per risolvere un problema che stavi riscontrando, ricordati di rinominare il file in provider.php."
COM_ADMINTOOLS_CONFIGUREWAF_ERR_PLUGINNOTLOADED="Il plugin System - Admin Tools non è caricato. Purtroppo non è possibile determinarne la causa. Alcuni file potrebbero essere mancanti o corrotti. Si consiglia vivamente di reinstallare Admin Tools, due volte di seguito, senza disinstallarlo prima o nel mezzo, per forzare Joomla! a installare e sovrascrivere eventuali file mancanti o corrotti."
