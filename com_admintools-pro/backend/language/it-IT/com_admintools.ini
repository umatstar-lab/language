COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE_HEAD="Il tuo server riporta che l'ora corrente è <strong>%s</strong> (fuso orario <em>%s</em>)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE="<p>Gli orari della pianificazione assenza devono essere inseriti nel fuso orario %s. Puoi modificare questo fuso orario nella pagina di Configurazione globale di Joomla!. Se l'ora corrente non sembra ancora corretta, chiedi al tuo hosting di verificare l'ora del server e le impostazioni del fuso orario di PHP e del sistema operativo.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIP="La pianificazione assenza disabilita l'accesso all'area amministratore del tuo sito durante il periodo di tempo specificato nei campi Da e A. È utile quando sei l'unico amministratore del sito e vuoi assicurarti che mentre dormi o sei assente nessuno possa accedere alla sezione amministratore del sito. L'orario deve essere fornito nel fuso orario del server impostato nella Configurazione globale del tuo sito. Il fuso orario e l'ora corrente in questo fuso orario sono riportati nel messaggio sotto il campo Pianificazione assenza da, per tua comodità"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TO="Pianificazione assenza fino a (hh:mm)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGSAVED="La configurazione del Web Application Firewall è stata salvata."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGNOTSAVED="Si sono verificati errori durante il salvataggio della configurazione del Web Application Firewall."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER="Cambia la directory di login dell'amministratore in"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_TIP="Ad esempio, se inserisci la parola <code>test</code> qui, potrai accedere all'area amministratore del tuo sito solo con un URL simile a <code>http://www.example.com/test</code>. Se tenti di accedervi come <code>http://www.example.com/administrator</code> verrai reindirizzato alla home page del sito. Dopo aver visitato l'URL segreto con il tuo browser potrai visitare anche <code>http://www.example.com/administrator</code> senza essere bloccato finché la tua sessione non scade. Se non desideri utilizzare questa funzionalità, lascia questo campo vuoto. Tieni presente che questa funzionalità richiede che le opzioni <strong>URL SEF</strong> e <strong>Usa la riscrittura degli URL</strong> nella pagina di Configurazione globale di Joomla! siano entrambe impostate su Sì."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_HEAD="Questa funzionalità è sperimentale e non supportata"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_TEXT="Su alcuni siti la <strong>cartella di login personalizzata dell'amministratore</strong> può comportarsi in modo imprevedibile, non funzionare affatto o rendere impossibile il login. Siamo a conoscenza del problema e non esiste alcuna soluzione alternativa. Per questo motivo questa funzionalità viene fornita <strong>SENZA SUPPORTO</strong>. Leggi la documentazione per ulteriori informazioni."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_DESC="Questo messaggio verrà mostrato agli utenti quando la loro richiesta viene ritenuta sospetta di una violazione della sicurezza. Mantienilo breve e cortese. Lascialo vuoto per utilizzare il messaggio predefinito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_HEADER="Personalizzazione"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_LABEL="Messaggio personalizzato"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM="Numero di tentativi di login falliti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM_TIP="Gli utenti verranno disattivati quando si verifica questo numero di tentativi di login falliti nel periodo di tempo configurato dalle due opzioni successive"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ="Periodo dei login falliti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ_TIP="Gli utenti verranno disattivati quando si verifica almeno il numero di tentativi di login falliti indicato sopra in un periodo non superiore a quello specificato. L'unità di misura del tempo (secondi, minuti, ore, giorni) è specificata nell'opzione successiva."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ="Unità di misura del tempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ_TIP="Imposta l'unità di misura del tempo per il campo Periodo dei login falliti."
