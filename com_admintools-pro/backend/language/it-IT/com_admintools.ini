[Schedulinginformation]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; PHP File Change Scanner Scheduling
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_SCHEDULINGINFORMATION="Pianificazione dello Scanner delle modifiche ai file PHP"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON="Job CRON alternativi da riga di comando"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON_INFO="Questo metodo è consigliato solo se il normale job CRON da riga di comando non viene completato. Questo metodo utilizza internamente il metodo di pianificazione frontend ed è leggermente più lento del metodo CLI nativo."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON="Job CRON da riga di comando (consigliato)"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON_INFO="Questo è il metodo consigliato per tutti i server che supportano i job CRON da riga di comando. Questo metodo bypassa l'interfaccia web di Joomla!, raggiungendo la massima velocità di scansione del sito."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICIMPROTANTINFO="Importante"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICINFO="Ricordarsi di sostituire <em>%s</em> con il percorso reale all'eseguibile PHP <strong>CLI (Command Line Interface)</strong> del proprio host. Si tenga presente che è necessario utilizzare l'eseguibile PHP CLI; l'eseguibile PHP CGI (Common Gateway Interface) <em>non</em> funzionerà con i nostri script CRON. In caso di dubbi sul significato di ciò, consultare il proprio host. Sono le uniche persone che possono fornire queste informazioni."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP="Funzionalità di pianificazione frontend"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_INFO="Questo metodo utilizza un URL pubblico e una chiave segreta per avviare una scansione del sito. La scansione avanza tramite reindirizzamenti HTTP. Si noti che la maggior parte dei job 'CRON' basati su URL degli host, così come la maggior parte dei servizi CRON di terze parti basati su URL, non supportano i reindirizzamenti HTTP. Se gli esempi con wget e curl di seguito non funzionano, utilizzare l'URL di pianificazione frontend con il servizio economico di terze parti webcron.org."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_MANYMETHODS="La funzionalità di pianificazione frontend può essere utilizzata con una grande varietà di metodi. Fare clic sulle schede di seguito per vedere la descrizione di ciascun metodo. Si ricorda che tutti sono spiegati in dettaglio nella nostra documentazione."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_CURL="cURL"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_SCRIPT="Script PHP"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_URL="URL"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_WEBCRON="WebCron.org"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_WGET="WGet"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CURL="Pianificazione CRON tramite cURL:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CUSTOMSCRIPT="Script PHP personalizzato per eseguire la pianificazione frontend:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_DISABLED="La funzionalità di pianificazione frontend di Admin Tools non è abilitata. Non è possibile utilizzare questo metodo di pianificazione a meno che non venga abilitato. Andare al Pannello di controllo di Admin Tools, fare clic su Opzioni e abilitare la funzionalità di pianificazione frontend. Non dimenticare di specificare anche una parola segreta a propria scelta."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_RAWURL="URL da utilizzare con i propri script e servizi di terze parti:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_SECRET="La chiave segreta della funzionalità di pianificazione frontend è vuota. Non è possibile utilizzare questo metodo di pianificazione a meno che non venga creata una chiave segreta. Andare al Pannello di controllo di Admin Tools, fare clic su Opzioni e inserire una chiave segreta a propria scelta."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON="Configurazione di un job di scansione con WebCron.org:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_ALERTS="Avvisi"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Se sono già stati configurati metodi di avviso nell'interfaccia di webcron.org, si consiglia di scegliere qui un metodo di avviso e di non selezionare 'Solo in caso di errore', in modo da ricevere sempre una notifica quando il job CRON di backup viene eseguito."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_EXECUTIONTIME="Tempo di esecuzione"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_EXECUTIONTIME_INFO="Questa è la griglia sotto le altre opzioni. Selezionare quando e con quale frequenza eseguire il job CRON."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_INFO="Accedere a webcron.org. Nell'area CRON, fare clic sul pulsante Nuovo Cron. Di seguito si trovano le informazioni da inserire nell'interfaccia di webcron.org."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_LOGIN="Accesso"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_LOGINPASSWORD_INFO="Lasciare vuoto"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_NAME="Nome del cronjob"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_NAME_INFO="Qualsiasi nome a piacere, ad esempio <em>Scansione del mio sito</em>"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_PASSWORD="Password"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_THENCLICKSUBMIT="Infine, fare clic sul pulsante Invia per completare la configurazione del job CRON."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_TIMEOUT="Timeout"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180 sec; se la scansione non viene completata, aumentare il valore. La maggior parte dei siti funzionerà con un'impostazione di 180 o 600. Se hai un sito molto grande che richiede più di 5 minuti per la scansione, potresti considerare di usare il job CRON CLI nativo, in quanto è molto più conveniente."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_URL="URL da eseguire"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WGET="Pianificazione CRON tramite wget (la maggior parte degli host):"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER="Attività pianificate di Joomla"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_INFO="Puoi pianificare una scansione del tuo sito usando la funzionalità Attività pianificate di Joomla. Leggi prima la documentazione per comprendere i compromessi e i potenziali problemi a seconda del metodo scelto per avviare le Attività pianificate di Joomla."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_BUTTON="Gestisci le tue Attività pianificate"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_ONLYJ41_HEAD="Le Attività pianificate sono disponibili solo su Joomla 4.1 e versioni successive"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_ONLYJ41_BODY="Joomla ha introdotto la funzionalità Attività pianificate nella versione 4.1.0 di Joomla!. Aggiorna il tuo sito all'ultima versione di Joomla per accedere alle Attività pianificate."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_HEAD="Il plugin \"Task – Admin Tools\" è disabilitato."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BODY="Il plugin \"Task – Akeeba Backup\" deve essere abilitato affinché le Attività pianificate di Joomla sappiano come eseguire i backup con Akeeba Backup. Vai in Sistema, Gestione, Plugin e abilita il plugin. In alternativa, fai clic sul pulsante seguente per modificare direttamente il plugin."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BUTTON="Modifica il plugin"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_GENERICREADDOC="Leggi la documentazione"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_GENERICUSECLI="Usa il seguente comando nell'interfaccia CRON del tuo host:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_HEADERINFO="Admin Tools offre diversi metodi per pianificare l'esecuzione dello Scanner delle modifiche ai file PHP. Troverai ulteriori informazioni su ciascun metodo di pianificazione qui di seguito. Ti consigliamo di leggere la documentazione di ciascun metodo di pianificazione. Risponderà a molte delle tue domande e ti aiuterà a pianificare le scansioni del tuo sito in modo più semplice."
