COM_ADMINTOOLS_TITLE_ADMINPASSWORD="Protezione con password dell'amministratore"

COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOPASSWORD="È necessario fornire una password"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTAPPLIED="Impossibile applicare la protezione con password. Abilitare il livello FTP nella configurazione globale del sito."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTUNAPPLIED="Impossibile rimuovere la protezione con password. Abilitare il livello FTP nella configurazione globale del sito."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOUSERNAME="È necessario fornire un nome utente"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_PASSWORDNOMATCH="Le password non corrispondono"

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HOWITWORKS="Come funziona?"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_INFO="Quando si applica la protezione con password, il browser chiederà nome utente e password ogni volta che viene richiesta la URL di una risorsa protetta nella cartella <code>administrator</code>. Sarà necessario inserire il nome utente e la password immessi in questa pagina. Nome utente e password sono <em>comuni</em> a tutti coloro che gestiscono il sito e <em>devono essere diversi</em> dalle credenziali di accesso a Joomla!. Questa funzione opera a livello server tramite un file <code>.htaccess</code> nella cartella <code>administrator</code> del sito. Il server deve supportare la protezione con password delle directory tramite file .htaccess affinché questa funzione abbia effetto. In caso di dubbi, contattare il proprio provider di hosting."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_WARN="Si noti che questa protezione rimane attiva anche se si disabilita o disinstalla Admin Tools. Se l'area di amministrazione diventa inaccessibile, o è necessario rimuovere la protezione con password senza accesso a questa pagina, occorrerà <strong>eliminare</strong> i file <code>.htaccess</code> e <code>.htpasswd</code> dalla directory <code>administrator</code> del sito tramite FTP, SFTP o il gestore file del pannello di controllo di hosting."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORDPROTECTION="Configura la protezione con password dell'amministratore"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES="Ripristina pagine di errore personalizzate"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES_HELP="Ripristina le pagine di errore personalizzate di Apache per HTTP 401 e 403 alle impostazioni predefinite. Questo impedisce un errore 404 Articolo non trovato quando si tenta di accedere alla pagina di accesso dell'amministratore dopo aver abilitato la funzione di protezione con password dell'amministratore. Si consiglia vivamente di mantenere questa opzione abilitata a meno che non causi un problema di errore HTTP 500 Internal Server Error."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE="Risorse dell'amministratore da proteggere"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_JOOMLA="Joomla"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_PHP="Tutti i file PHP"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_EVERYTHING="Tutto"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_HELP="Scegliere cosa proteggere con una password. «Joomla» protegge solo il file index.php di Joomla! (il punto di ingresso dell'applicazione di amministrazione). Tutto il resto rimane liberamente accessibile, inclusi i file .php di applicazioni di terze parti. «Tutti i file PHP» protegge tutti i file PHP nella cartella <code>administrator</code> e nelle sue sottodirectory. «Tutto» funziona come le versioni precedenti di Admin Tools, vietando l'accesso a qualsiasi file nella cartella <code>administrator</code> e nelle sue sottodirectory, indipendentemente dall'estensione."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE="Algoritmo di hashing della password"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_HELP="Le password vengono memorizzate con hash nel file <code>administrator/.htpasswd</code>. Questa opzione seleziona l'algoritmo di hashing. bCrypt è il più sicuro, ma non sempre supportato. APR-1 (predefinito) è sufficientemente sicuro ed è supportato dalla maggior parte dei provider. SHA-1 è sempre supportato, ma non è più considerato sicuro. crypt() consente password lunghe al massimo 8 caratteri, non è supportato su Windows ed è considerato non sicuro. Testo normale non applica alcun hashing e non dovrebbe MAI essere utilizzato per scopi diversi dalla risoluzione dei problemi, con una password temporanea da considerare immediatamente compromessa."
