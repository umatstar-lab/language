COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_HELP="<info>%command.name%</info> rimuoverà i file e le cartelle Joomla! che un aggiornamento di Joomla avrebbe dovuto eliminare, ma non ha eliminato.\nI file del core rimasti indietro possono rendere il tuo sito completamente inutilizzabile, di solito con un errore fatale relativo a un alias di classe.\nUsa <info>--dry-run</info> per vedere cosa verrebbe rimosso senza toccare nulla.\nUtilizzo: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_OPT_DRYRUN="Elenca i file e le cartelle obsoleti trovati, e se PHP può scriverci, senza eliminare nulla."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTHINGTODO="Non ci sono file o cartelle obsoleti del core di Joomla! su questo sito."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_DELETED="eliminato"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_FAILED="NON RIUSCITO"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_WRITEABLE="scrivibile"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTWRITEABLE="NON scrivibile"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_ERR_SOMEFAILED="Non è stato possibile rimuovere %d file e cartelle obsoleti. Eliminali a mano via FTP, SFTP o con il gestore file fornito dal tuo hosting."

[options]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Component Options
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;; File Scanner
COM_ADMINTOOLS_JCONFIG_SCAN_LABEL="Scanner file"
COM_ADMINTOOLS_JCONFIG_SCAN_DESC="Configura il funzionamento dello Scanner file PHP"

COM_ADMINTOOLS_JCONFIG_LOGLEVEL_LABEL="Livello di registro"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DESC="Il livello di dettaglio del registro dello Scanner file PHP, salvato nella directory di registro configurata del sito. Valori consigliati: \"Avvisi\" per i siti in produzione, \"Debug\" quando si desidera richiedere assistenza."
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_NONE="Nessuno"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_ERROR="Errori"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_WARNING="Avvisi"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_INFO="Informazioni"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DEBUG="Debug"
COM_ADMINTOOLS_JCONFIG_MINEXEC_LABEL="Tempo minimo di richiesta"
COM_ADMINTOOLS_JCONFIG_MINEXEC_DESC="Tempo minimo che impiegherà ogni richiesta allo Scanner di Modifiche ai File PHP. Aumentarlo se il server genera un errore perché le richieste arrivano troppo frequentemente o si raggiungono i limiti di CPU / risorse.<br/><br/>Valori consigliati: da 2,0 a 7,0."
COM_ADMINTOOLS_JCONFIG_MAXEXEC_LABEL="Tempo massimo di lavoro"
COM_ADMINTOOLS_JCONFIG_MAXEXEC_DESC="Quantità massima di tempo impiegato per la scansione del sito in ogni richiesta allo Scanner delle modifiche ai file PHP. Diminuire se si raggiungono i limiti di CPU / risorse del server. Impostare un valore inferiore al Tempo minimo della richiesta per creare un periodo di \"raffreddamento dell'uso della CPU\", riducendo così il consumo di risorse durante la scansione dei file a scapito di una scansione più lenta.<br/><br/>Valori consigliati: da 3.0 a 7.0"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_LABEL="Bias del tempo di lavoro"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_DESC="Un valore compreso tra 50 e 100 che influisce sull'aggressività con cui Admin Tools prevede se sta per raggiungere il limite del Tempo massimo di lavoro. 50 è il più aggressivo e determinerà una scansione che occuperà circa la metà del Tempo massimo di lavoro in ogni richiesta allo Scanner delle modifiche ai file PHP. 100 è il meno aggressivo e determinerà una scansione che occuperà almeno e di solito più del Tempo massimo di lavoro in ogni richiesta.<br/><br/>Valore consigliato: 75.<br/><br/><strong>Suggerimento!</strong> Se si dispone di un server particolarmente sensibile, si consiglia di impostare il Tempo minimo della richiesta a 7.0, il Tempo massimo di lavoro a 5.0 e il Bias del tempo di lavoro a 50. Ciò significa che lo scanner lavora per 2.5-5.0 secondi alla volta, dopodiché il server rimane inattivo per 2.0-4.5 secondi. La scansione del sito richiederà circa tre volte di più, ma avrà maggiori probabilità di completarsi."
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_LABEL="Numero max. di cartelle per batch"
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_DESC="Il numero massimo di cartelle da elencare in una determinata directory alla volta. Ciò impedisce il timeout di PHP quando si elenca il contenuto di cartelle <em>davvero</em> grandi, con centinaia di cartelle contenute direttamente al loro interno.<br/><br/>Valore consigliato: 50<br/><br/>Ricorda che l'elenco del contenuto delle cartelle è <strong>esponenzialmente proporzionale</strong> al numero di file e cartelle in esse contenuti. Questa è una limitazione del funzionamento dei sistemi operativi e dei loro driver del filesystem. Non è qualcosa che noi, Joomla! o PHP possiamo fare. Si consiglia vivamente di escludere le cartelle molto grandi e di adottare misure per evitare cartelle con migliaia di file e sottocartelle direttamente contenuti. In caso di dubbio, annida le cartelle in profondità."
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_LABEL="Numero max. di file per batch"
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_DESC="Il numero massimo di file da elencare in una determinata directory alla volta. Ciò impedisce il timeout di PHP quando si elenca il contenuto di cartelle <em>davvero</em> grandi, con migliaia di file contenuti direttamente al loro interno.<br/><br/>Valore consigliato: 100<br/><br/>Ricorda che l'elenco del contenuto delle cartelle è <strong>esponenzialmente proporzionale</strong> al numero di file e cartelle in esse contenuti. Questa è una limitazione del funzionamento dei sistemi operativi e dei loro driver del filesystem. Non è qualcosa che noi, Joomla! o PHP possiamo fare. Si consiglia vivamente di escludere le cartelle molto grandi e di adottare misure per evitare cartelle con migliaia di file e sottocartelle direttamente contenuti. In caso di dubbio, annida le cartelle in profondità."
COM_ADMINTOOLS_JCONFIG_FEBENABLE_LABEL="Abilita la pianificazione frontend"
COM_ADMINTOOLS_JCONFIG_FEBENABLE_DESC="Se abilitata, consente di eseguire lo Scanner delle modifiche ai file PHP senza accedere al backend."
COM_ADMINTOOLS_JCONFIG_SECRETWORD_LABEL="Parola segreta"
COM_ADMINTOOLS_JCONFIG_SECRETWORD_DESC="Protegge la funzione di pianificazione frontend dagli attacchi DoS richiedendo di passare questa parola segreta nell'URL di pianificazione frontend. Utilizzare password lunghe e complesse. Consultare la documentazione per ulteriori informazioni."
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_LABEL="Fuso orario per le e-mail"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DESC="Tutte le date e gli orari nelle e-mail inviate da Admin Tools per avvisarti di potenziali problemi di sicurezza saranno espressi nel fuso orario selezionato. Predefinito: GMT"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DEFAULT="Fuso orario del server"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_LABEL="Lingua di riserva preferita per le notifiche e-mail"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_DESC="La lingua utilizzata per le e-mail di notifica inviate a un indirizzo che non appartiene a un account utente Joomla e per gli account utente la cui preferenza di lingua è «Usa predefinito».<br/><br/>Quando una notifica viene inviata a un indirizzo che <em>invece</em> appartiene a un account utente Joomla, viene utilizzata la preferenza di lingua di quell'account, a meno che tu non attivi anche l'opzione qui sotto.<br/><br/>Se non è possibile determinare alcuna lingua, viene utilizzato l'inglese (en-GB). Admin Tools non invia mai una notifica nella lingua in cui il tuo sito è visualizzato in quel momento.<br/><br/>Predefinito: Nessuna, ovvero inglese (en-GB)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_NONE="Nessuna (usa l'inglese)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_LABEL="Forza questa lingua per tutte le e-mail di notifica"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_DESC="Se attiva, ogni e-mail di notifica viene inviata nella lingua selezionata sopra, anche quando è indirizzata a un account utente Joomla con una preferenza di lingua diversa.<br/><br/>Attivala se elabori automaticamente le e-mail di notifica e devi riceverle sempre in un'unica lingua prevedibile.<br/><br/>Predefinito: No"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_LABEL="Cartelle escluse"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_DESC="Cartelle da ignorare durante la scansione del sito.<br/><br/>Le cartelle sono indicate relative alla radice del sito. Inserire una cartella per riga.<br/><br/>Predefinito: nessuna<br/><br/><em>Nota</em>: alcune cartelle vengono escluse automaticamente senza aggiungerle qui: la directory dei log e quella temporanea del sito, le directory cache del frontend e del backend, nonché le cartelle denominate tmp, log o logs nel frontend o nel backend del sito. Infine, i collegamenti simbolici a cartelle esterne alla radice del sito non vengono seguiti (il loro contenuto non verrà scansionato)."
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_LABEL="File esclusi"
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_DESC="File da ignorare durante la scansione del sito.<br/><br/>I file sono indicati relativi alla radice del sito. Inserire un percorso file per riga.<br/><br/>Predefinito: nessuno<br/><br/>Utilizzare solo per escludere file che non sono realmente eseguibili, ad esempio log con estensione .php al di fuori della cartella log di Joomla. NON utilizzare per contrassegnare file come sicuri; utilizzare invece la funzione Contrassegna come sicuro nella pagina del rapporto di scansione."
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_LABEL="Estensioni da scansionare"
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_DESC="Un elenco separato da virgole di estensioni di file da scansionare, senza il punto iniziale.<br/><br/>Valore predefinito: php, phps, phtml, php3, inc<br/><br/>Si ricorda che lo Scanner delle modifiche ai file PHP è progettato per scansionare e valutare in modo affidabile il Punteggio di minaccia solo dei file PHP. Si sconsiglia vivamente di aggiungere estensioni di file di codice sorgente di linguaggi di programmazione diversi, come JavaScript e Perl, o file binari. Se non si presta attenzione a questo avviso, si potrebbero ottenere molti falsi positivi o, peggio, falsi negativi in file che non contengono codice sorgente del linguaggio di programmazione PHP."
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_LABEL="Scansiona file con doppia estensione"
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_DESC="Scansiona i file in cui le estensioni da scansionare compaiono prima di altre estensioni. Ad esempio, se hai aggiunto <code>php</code> alle \"Estensioni da scansionare\" e abiliti questa opzione qui, lo Scanner delle modifiche ai file PHP scansionerà sia <code>example.php</code> che <code>example.php.png</code>."
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_LABEL="Corrispondenza estensione senza distinzione tra maiuscole e minuscole"
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_DESC="Rende la corrispondenza delle estensioni di file non sensibile alle maiuscole/minuscole. Ad esempio, se hai aggiunto <code>php</code> alle \"Estensioni da scansionare\" e abiliti questa opzione qui, lo Scanner delle modifiche ai file PHP scansionerà sia <code>example.php</code> che <code>example.PHP</code>"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_LABEL="Soglia file di grandi dimensioni"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_DESC="Lo Scanner delle modifiche ai file PHP metterà deliberatamente in pausa il lavoro e lo riprenderà nella richiesta successiva prima di scansionare file di dimensioni superiori a questo numero di byte. Ciò impedisce un timeout accidentale di PHP durante la scansione di un file di grandi dimensioni alla fine del Tempo massimo di lavoro assegnato.<br/><br/>Valore consigliato: 524288"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_LABEL="Calcola diff durante la scansione"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_DESC="Quando questa opzione è abilitata, Admin Tools calcolerà un diff (forma compatta delle differenze tra file) per ogni file modificato rilevato dalla funzione Scanner dei file PHP. ATTENZIONE: questo consuma MOLTO spazio nel database, circa 20-40 MB per un sito tipico!"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_LABEL="Non segnalare file con Punteggio di minaccia pari a zero"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_DESC="Quando abilitata, qualsiasi file nuovo o modificato con Punteggio di minaccia pari a zero non verrà segnalato.<br/><br/>Valore consigliato: No<br/><br/><strong>ATTENZIONE</strong>: NON si consiglia di abilitare questa opzione. È possibile che file modificati in modo malevolo abbiano un Punteggio di minaccia pari a zero perché il loro payload malevolo è scritto in modo da essere impossibile da distinguere da codice legittimo, seppur un po' disordinato, da parte di uno scanner automatico. Abilitando questa opzione non si verrà avvisati di questi file, mettendo potenzialmente il sito a rischio. Questa opzione è disponibile per il debug dei problemi di calcolo del Punteggio di minaccia, NON come qualcosa da abilitare sui siti di produzione."
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_LABEL="Soglia file sovradimensionato"
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_DESC="I file di dimensioni superiori a questo numero di byte non avranno il loro Punteggio di minaccia valutato.<br/><br/>Valore consigliato: 5242880<br/><br/>Un valore troppo basso farebbe sì che i file eseguibili non vengano scansionati alla ricerca di codice malevolo, il che potrebbe rappresentare un problema di sicurezza. Impostare un valore troppo alto causerà probabilmente un timeout di PHP durante la scansione di un file molto grande, tipicamente uno che non è nemmeno eseguibile nonostante l'estensione .php (ad esempio un file di log)."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_LABEL="File non del core in cartelle del core"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_DESC="Controlla come lo scanner tratta i file che NON sono file ufficiali del core di Joomla ma si trovano all'interno di una directory del core di Joomla (una directory appartenente a un'estensione, una libreria o un template del core, oppure una fra administrator/help, administrator/includes, includes). <strong>Ignora</strong>: non rilevare questi file. <strong>Contrassegna</strong>: mostra un badge \"non del core\" nei risultati della scansione. <strong>Contrassegna e segnala come minaccia</strong>: mostra il badge e aggiunge 1000 al Punteggio minaccia, in modo che il file appaia in cima ai risultati. I file all'interno di directory di estensioni di terze parti sono considerati fuori ambito e non vengono mai contrassegnati."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_IGNORE="Ignora"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_FLAG="Contrassegna"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_THREAT="Contrassegna e segnala come minaccia"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_LABEL="URL del servizio CoreSums"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_DESC="URL di base del servizio di checksum CoreSums utilizzato dallo Scanner delle modifiche ai file PHP per identificare e verificare i file del core di Joomla. Il valore predefinito è <code>https://getpanopticon.com/checksums</code>. Admin Tools si limita a SCARICARE da questo servizio un file pubblico di checksum per la tua versione di Joomla; non invia mai alcuna informazione sul tuo sito o sui suoi utenti. Se preferisci ospitare tu stesso i checksum, puoi eseguire un tuo servizio — vedi <code>https://github.com/akeeba/coresums</code> — e puntare questa opzione su di esso."
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_LABEL="Timeout di download di CoreSums (secondi)"
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_DESC="Numero massimo di secondi di attesa durante il download del file di checksum CoreSums prima di rinunciare. Valore predefinito: 5. Se il download fallisce la scansione viene comunque eseguita, ma nessun file viene contrassegnato come del core o non del core e viene mostrato un avviso che puoi chiudere fino alla successiva scansione riuscita."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_DESC="I risultati della scansione verranno inviati automaticamente a questo indirizzo e-mail. Se lo si lascia vuoto, non verrà inviata nessuna e-mail."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_LABEL="Invia risultati a questa e-mail"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_LABEL="Invia e-mail solo per elementi che richiedono azione"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_DESC="Quando abilitata (predefinito) lo Scanner delle modifiche ai file PHP invierà un'e-mail con il riepilogo dei risultati della scansione <em>solo</em> quando vengono rilevati elementi che richiedono azione (file aggiunti, modificati o potenzialmente minacciosi)."

;; Email sending
COM_ADMINTOOLS_JCONFIG_EMAIL_LABEL="Invio e-mail"
COM_ADMINTOOLS_JCONFIG_EMAIL_DESC="Opzioni che controllano il modo in cui Admin Tools invia e-mail per le richieste bloccate. Queste opzioni si applicano solo all'edizione Professional."
COM_ADMINTOOLS_JCONFIG_THROTTLE_LABEL="Limitazione delle e-mail per richieste bloccate"
COM_ADMINTOOLS_JCONFIG_THROTTLE_DESC="Quando abilitata, Admin Tools invierà solo un certo numero di e-mail in un determinato periodo di tempo. Ciò protegge la tua casella e-mail da un'inondazione di messaggi quando il sito è sotto attacco. È necessario che la registrazione delle richieste bloccate sia abilitata per <em>tutti i motivi di blocco</em> per cui si inviano e-mail. Inoltre, il numero massimo di voci del registro che si conservano — in base alla configurazione del plugin di sistema — deve essere <em>uguale o superiore</em> al numero massimo di e-mail configurato di seguito. In caso contrario, le e-mail relative alle eccezioni di sicurezza NON verranno limitate."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_LABEL="Numero massimo di richieste bloccate per cui inviare e-mail"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_DESC="Il numero massimo di richieste bloccate per cui è possibile inviare e-mail nel periodo di tempo definito di seguito. Tieni presente che durante un attacco prolungato potrebbero essere inviate più e-mail di questo numero, a seconda della lentezza con cui rispondono i server web, database e di posta quando il sito è sotto carico molto pesante. Inoltre, tieni presente che questo influisce solo sulle richieste bloccate registrate nel database e con un motivo di blocco che NON è tra i motivi configurati per cui non inviare mai e-mail."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_LABEL="Periodo per la limitazione delle e-mail"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_DESC="La limitazione delle e-mail funziona verificando quante richieste bloccate sono state registrate in questo numero di secondi, minuti, ore o giorni. L'unità di misura del tempo viene selezionata di seguito."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_LABEL="Unità di misura del tempo"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DESC="Il periodo sopra indicato è espresso nell'unità di misura del tempo selezionata qui. Si noti che ai fini di questi calcoli un minuto corrisponde a 60 secondi, 1 ora a 3600 secondi, 1 giorno a 86400 secondi. Questo potrebbe differire dai minuti, ore e giorni del calendario negli anni con secondi intercalari e al passaggio dall'ora legale all'ora solare (o viceversa). La gestione del tempo è un argomento piuttosto complesso."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_SECONDS="Secondi"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_MINUTES="Minuti"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_HOURS="Ore"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DAYS="Giorni"

COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_DESC="Per quanto tempo, in minuti, un elenco di IP dei crawler scaricato viene utilizzato prima di essere scaricato di nuovo. È anche il tempo che Admin Tools attende prima di riprovare dopo un download non riuscito. Il minimo è 15 minuti."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_LABEL="Durata della cache degli elenchi dei crawler (minuti)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DESC="Opzioni per gli elenchi di IP dei crawler, che si abilitano in Configura WAF, scheda Crawlers."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_DESC="Se un elenco di IP dei crawler non può essere aggiornato, Admin Tools continua a usare l'ultimo elenco scaricato per questo numero di giorni, contati dal momento in cui l'elenco sarebbe normalmente scaduto. Trascorso questo periodo, l'elenco non viene più usato. Imposta 0 per smettere di usare un elenco non appena scade."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_LABEL="Scarta gli elenchi dei crawler obsoleti dopo (giorni)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_LABEL="Crawler"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_DESC="Il tempo massimo, in millisecondi, che Admin Tools attende per il download di un elenco di IP: gli elenchi di IP dei crawler e gli elenchi di CloudFlare, Sucuri e BunnyCDN usati dai generatori di configurazione del server. Gli elenchi pubblicati come pagine web anziché file di dati (quelli di Amazon e Sucuri) dispongono del triplo di questo limite (al massimo 60 secondi). Questo limite viene rispettato esattamente solo se il server usa l'estensione cURL di PHP. Con altri metodi di connessione, e per la risoluzione DNS su alcune versioni di cURL, è solo approssimativo: viene arrotondato per eccesso ai secondi interi e un server molto lento può impiegare di più."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_LABEL="Limite di tempo per il download degli elenchi di crawler e CDN (millisecondi)"

;; Backend options
COM_ADMINTOOLS_JCONFIG_BACKEND_LABEL="Backend"
COM_ADMINTOOLS_JCONFIG_BACKEND_DESC="Opzioni che definiscono il funzionamento del backend del componente"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_LABEL="Mostra grafici e statistiche"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_DESC="Visualizza grafici e statistiche sulle richieste bloccate (solo edizione Professional)"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_LABEL="Riordina automaticamente il plugin"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_DESC="Il plugin System - Admin Tools deve essere ordinato come primo plugin pubblicato per funzionare correttamente. Quando si visita Admin Tools nel backend, il plugin viene automaticamente riordinato per essere il primo. In alcuni rari casi altri plugin devono essere pubblicati prima, ad esempio gestori di posta alternativi come CMandrill. In questo caso impostare questa opzione su No. PERICOLO GRAVE! SARÀ ESCLUSIVAMENTE TUA RESPONSABILITÀ RIORDINARE IL PLUGIN. SE UN PLUGIN VULNERABILE VIENE PUBBLICATO PRIMA DEL PLUGIN SYSTEM - ADMIN TOOLS, IL TUO SITO POTREBBE ESSERE COMPROMESSO. ADMIN TOOLS NON SARÀ IN GRADO DI PROTEGGERTI IN QUESTO CASO POICHÉ NON SARÀ IN ESECUZIONE PRIMA DEL CODICE VULNERABILE, QUINDI INCAPACE DI RILEVARE L'ATTACCO. NON IMPOSTARE QUESTA OPZIONE SU \"NO\" A MENO CHE NON SI SIA UN ESPERTO E SI COMPRENDANO LE IMPLICAZIONI."
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_LABEL="Avvisa sulle modifiche manuali ai file di configurazione del server"
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_DESC="Admin Tools verificherà se hai modificato manualmente un file di configurazione del server (ad esempio .htaccess, nginx.conf o web.config) invece di utilizzare il Generatore di .htaccess, NginX o Web.config"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_LABEL="Ricordami quando il file di log di debug è abilitato"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_DESC="Mostra un promemoria in ogni pagina dell'area di amministrazione del tuo sito finché l'opzione \"Mantieni un file di log di debug\" di Configura WAF è abilitata. Il file di log di debug è pensato solo per la risoluzione dei problemi. Registra in dettaglio ogni richiesta bloccata, inclusi i dati dei moduli inviati, in un file non crittografato."
COM_ADMINTOOLS_JCONFIG_USAGESTATS_LABEL="Abilita la segnalazione anonima delle versioni di PHP, MySQL e Joomla!"
COM_ADMINTOOLS_JCONFIG_USAGESTATS_DESC="Aiutaci a migliorare il nostro software segnalando in modo anonimo e automatico le versioni di PHP, MySQL e Joomla!. Queste informazioni ci aiuteranno a decidere quali versioni di Joomla!, PHP e MySQL supportare nelle versioni future. Nota: NON raccogliamo il nome del sito, l'indirizzo IP o qualsiasi altra informazione identificativa diretta o indiretta."
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_LABEL="Percorso PHP-CLI accurato"
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_DESCRIPTION="Abilitare per far sì che Admin Tools tenti di rilevare il percorso PHP-CLI accurato sul server. Disabilitare se il server non lo consente, bloccando il proprio indirizzo IP dal sito per diversi minuti o ore quando ciò si verifica (ad esempio IONOS)."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_LABEL="Soluzione alternativa per i Template di posta non funzionanti in Joomla! 5.2 e versioni successive."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 ha introdotto la funzione Layout dei template di posta e la abilita per impostazione predefinita. Tuttavia, questa funzione <em>interrompe</em> i collegamenti nelle e-mail se il loro URL proviene da una variabile, come <code>{URL}</code>, aggiungendo l'URL del sito davanti all'URL, rendendolo così non valido. Ciò riguarda anche i componenti nativi di Joomla. Pur non potendo correggere Joomla stesso, possiamo fornire una soluzione alternativa per le e-mail inviate dal nostro software. Se per qualsiasi motivo non si desidera tale soluzione alternativa, è possibile disattivarla impostando questa opzione su No."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_LABEL="Server web"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_DESCRIPTION="Quale server web stai utilizzando per il tuo sito? L'utilizzo di \"Rilevamento automatico\" è consigliato per la maggior parte dei siti. Seleziona il tipo di server web solo se il tuo host ha deliberatamente reso inaccessibile la variabile di ambiente <code>SERVER_SOFTWARE</code> a PHP, o l'ha impostata intenzionalmente su un valore vuoto o fuorviante."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_AUTO="Rilevamento automatico"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_APACHE="Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_LITESPEED="LiteSpeed"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_NGINX="NginX"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_IIS="IIS"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_LABEL="Versione del server web Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_DESCRIPTION="Se si utilizza il server web Apache, selezionare quale versione di Apache è in uso. L'utilizzo di \"Rilevamento automatico\" è consigliato per la maggior parte dei siti. Seleziona la versione solo se il tuo host ha deliberatamente reso inaccessibile la variabile di ambiente <code>SERVER_SOFTWARE</code> a PHP, o l'ha impostata intenzionalmente su un valore vuoto o fuorviante."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_AUTO="Rilevamento automatico"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_1_3="1.3"
