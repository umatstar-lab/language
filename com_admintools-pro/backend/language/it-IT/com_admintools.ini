COM_ADMINTOOLS_EMAILTEMPLATES_LBL_WHERE_TEXT="I template e-mail per le estensioni principali e di terze parti, come Admin Tools, sono gestiti centralmente da Joomla! stesso nella pagina Sistema, Template e-mail. Le estensioni di terze parti, tuttavia, devono implementare il proprio codice per installare e aggiornare i template e-mail. E' ciò che fa questa pagina. Se desiderate personalizzare i template e-mail, fate clic sul pulsante sottostante per accedere alla pagina Template e-mail di Joomla!."
