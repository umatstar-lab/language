COM_ADMINTOOLS_ACL_PERMISSION_UTILS_DESC="Consenti l'accesso alle funzionalità di utilità"
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_TITLE="Utilità"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_TITLE="Sicurezza"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_DESC="Consenti l'accesso alle funzionalità di sicurezza. Include la procedura guidata Super utenti temporanei; trattalo quindi come equivalente alla concessione dell'accesso da Super utente."
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_TITLE="Manutenzione"
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_DESC="Consenti l'accesso alle funzionalità di manutenzione del database e dei permessi"

