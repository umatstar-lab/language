COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN="Invia e-mail a questo indirizzo dopo un blocco IP automatico"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN_TIP="Admin Tools può opzionalmente inviarti un'e-mail quando un indirizzo IP viene bloccato automaticamente, all'indirizzo e-mail inserito in questo campo. Lascia questo campo vuoto (impostazione predefinita) per disabilitare questa funzionalità."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR="Tag generator"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR_TIP="Inserisci un valore personalizzato per il meta tag generator, oppure lascia vuoto per utilizzare un valore generato automaticamente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_HTACCESSTIP="Per una maggiore protezione del tuo sito, usa anche la funzionalità Generatore di .htaccess di questo componente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTP="http://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTPS="https://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_DESC="Collegamento a un servizio di ricerca IP. {ip} verrà sostituito con l'indirizzo IP. Predefinito: whatismyipaddress.com/ip/{ip}"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_LABEL="Servizio di ricerca IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS="Non bloccare mai questi IP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS_TIP="Inserisci gli indirizzi IP che non devono mai essere bloccati automaticamente, indipendentemente dalle impostazioni di blocco automatico. Puoi usare singoli indirizzi IPv4 e IPv6 (ad es. <em>127.0.0.1</em> e <em>::1</em>), intervalli IPv4 (ad es. <em>127.0.0.1-127.0.0.10</em>), notazione di intervallo IPv4 implicita (<em>127.0.0.</em> per l'intero blocco da 127.0.0.1 a 127.0.0.255) e notazione a blocchi CIDR IPv4/IPv6 (ad es. <em>127.0.0.0/8</em> per IPv4 o <em>2001:db8::/32</em> per IPv6)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_ACTIVEFILTERING="Filtraggio delle richieste"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASIC="Sicurezza di base"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASICSETTINGS="Funzionalità di base"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_EXCEPTIONS="Eccezioni"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_CRAWLERS="Crawler"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_DESC="Admin Tools scarica gli elenchi degli indirizzi IP che i motori di ricerca e le aziende di IA pubblicano per i loro crawler e li usa per i crawler che scegli qui sotto. Con Blocca, tutte le richieste del crawler vengono bloccate. Con Non bloccare, il crawler viene trattato come in «Non bloccare mai questi IP»: una sua richiesta dannosa viene comunque bloccata, ma non viene registrata, non viene inviata alcuna e-mail al riguardo e l'indirizzo IP non viene mai bloccato automaticamente. Vengono scaricati solo i crawler impostati su Blocca o Non bloccare. Se gli elenchi non possono essere scaricati o la cache del sito non funziona, Admin Tools disattiva da solo questa opzione e invia un'e-mail ai Super utenti."
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_LABEL="Usa gli elenchi di IP dei crawler"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_ALLOW="Non bloccare"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_BLOCK="Blocca"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_IGNORE="Ignora"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_FINGERPRINTING="Occultamento"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_JHARDENING="Opzioni di hardening"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_LOGGINGANDREPORTING="Registrazione e reporting"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD="404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE="Abilita 404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE_TIP="Fai clic per abilitare o disabilitare la funzionalità 404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_TIP="Questa funzionalità tratta gli errori 404 Non trovato come un motivo per bloccare una richiesta quando si verificano su URL noti per essere utilizzati dagli hacker per analizzare il tuo sito alla ricerca di vulnerabilità. Ad esempio, quando un hacker cerca di accedere alla pagina di login di WordPress anche se hai un sito Joomla!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW="Parametro URL segreto dell'amministratore"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP="Ad esempio, se inserisci 'test', potrai accedere all'area amministratore solo digitando l'URL <code>http://www.example.com/administrator/index.php?test</code>. <strong>ATTENZIONE! DEVE INIZIARE CON UNA LETTERA, NON CON UN NUMERO</strong>. Per una migliore compatibilità tra i server, utilizza solo caratteri ASCII minuscoli e numeri (a-z, 0-9)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP_LONG="Il parametro URL segreto dell'amministratore può essere composto solo da lettere latine minuscole e maiuscole senza accenti o diacritici (a-z e A-Z), numeri 0-9, trattini e trattini bassi. Il primo carattere non può essere un trattino o un trattino basso. Deve essere lungo da 4 a 64 caratteri."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_INVALID="Il parametro URL segreto dell'amministratore non è valido. Ricorda che può essere composto solo da lettere latine minuscole e maiuscole senza accenti o diacritici (a-z e A-Z), numeri 0-9, trattini e trattini bassi. Il primo carattere non può essere un trattino o un trattino basso. Deve essere lungo da 4 a 64 caratteri."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION="Azione per parametro URL segreto dell'amministratore non valido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_TIP="Cosa fare quando il parametro URL segreto dell'amministratore è assente o non valido. Reindirizza: reindirizza il browser alla radice del sito (impostazione predefinita). Blocca: blocca la richiesta con il messaggio di richiesta bloccata di Admin Tools e uno stato HTTP 403. Tieni presente che questo non aiuta ad alleviare il carico elevato del server in caso di attacchi di forza bruta prolungati, poiché i bot per la forza bruta delle password in genere non seguono i reindirizzamenti; usa la funzionalità password dell'amministratore per gestire al meglio il carico elevato del server in questo caso."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_REDIRECT="Reindirizza"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_BLOCK="Blocca"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE="Override tramite cookie del browser per il parametro URL segreto dell'amministratore"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_TIP="Impostare un cookie del browser al login riuscito dell'amministratore, che consenta al browser di accedere alla pagina di login dell'amministratore in qualsiasi momento nei successivi 30 giorni anche senza fornire il parametro URL segreto dell'amministratore? Il cookie viene invalidato se usi la funzione di logout di Joomla! o cambi la password dell'utente. Leggi la documentazione per ulteriori informazioni. In caso di dubbi, impostalo su \"Abilitato, notifica quando viene utilizzato\"."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_OFF="Disabilitato"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON="Abilitato"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_WARN="Abilitato, notifica quando viene utilizzato"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_MAXWARN="Abilitato, ricorda di usare l'URL completo"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE="Consenti template del sito"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE_TIP="L'abilitazione di questa opzione sovrascrive parzialmente l'opzione precedente (il blocco di template=foo nell'URL). Se il parametro URL template= specifica il nome di un template esistente nella directory dei template, verrà consentito senza causare il blocco della richiesta. Ciò è necessario solo sui siti che utilizzano più di un template contemporaneamente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM="Filtraggio antispam basato sull'elenco delle parole vietate"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM_TIP="Se abilitato, tutte le richieste contenenti almeno una parola nell'elenco delle parole vietate verranno bloccate."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY="Chiave HTTP:BL di <a href='http://www.projecthoneypot.org/httpbl_configure.php' target='_blank'>Project Honeypot</a>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY_TIP="Inserisci la tua chiave HTTP:BL. Puoi iscriverti a Project Honeypot e ottenere la tua chiave su <a href='http://www.projecthoneypot.org/httpbl_configure.php'>http://www.projecthoneypot.org/httpbl_configure.php</a>."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS="Domini e-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS_TIP="Inserisci un dominio per voce, senza protocollo, ad es. <code>example.com</code> ma NON <s><code>https://www.example.com</code></s>. Admin Tools consentirà o bloccherà la registrazione in base al campo sopra. Lascia vuoto per disabilitare qualsiasi restrizione durante la registrazione degli utenti."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES="Blocca nomi utente comuni"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_TIP="Se abilitato, Admin Tools bloccherà la creazione di nuovi account utente il cui nome utente è presente nell'elenco di blocco predefinito (ad es. admin, ceo, manager, ecc.)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW="Nomi utente esplicitamente consentiti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW_TIP="Elenco di nomi utente esplicitamente consentiti, uno per riga."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID="Nomi utente esplicitamente vietati"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID_TIP="Elenco di nomi utente esplicitamente vietati, uno per riga."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN="Blocco IP immediato al login fallito con un nome utente vietato"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN_TIP="Se qualcuno tenta di accedere al tuo sito usando uno dei nomi utente comuni integrati in Admin Tools o uno dei nomi utente esplicitamente vietati descritti di seguito ma non esiste nessun utente con tale nome utente sul tuo sito, la richiesta viene bloccata. Inoltre, se il blocco IP dei recidivi è abilitato nella scheda Blocco automatico, l'indirizzo IP dell'aggressore viene bloccato immediatamente, anche se non ha raggiunto il numero di attacchi specificato nell'opzione Blocca IP dopo questo numero di richieste bloccate. Il ragionamento è che tentare di accedere al sito con un nome utente vietato o comune è molto probabilmente un attacco di credential stuffing che deve essere contrastato il prima possibile."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION="Azione per il monitoraggio della configurazione"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_BLOCK="Blocca"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_EMAIL="E-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_TIP="Cosa fare quando il monitoraggio della configurazione globale o del componente è abilitato e viene rilevata una modifica nella configurazione. 'E-mail' invierà semplicemente un'e-mail di avviso agli indirizzi e-mail configurati di seguito. Le modifiche alla configurazione verranno applicate. 'Blocca' tratterà queste modifiche come un motivo per bloccare la richiesta. Le modifiche alla configurazione NON verranno applicate e non verrà inviata alcuna e-mail."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS="Monitora la configurazione dei componenti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS_TIP="Quando questa opzione è abilitata e qualcuno tenta di modificare la configurazione di qualsiasi componente core di Joomla! o di terze parti (ciò che si vede facendo clic su Opzioni nella barra degli strumenti di un componente) dal backend del sito, si riceverà una notifica oppure l'utente verrà bloccato (in base alle impostazioni seguenti)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL="Monitora la configurazione globale"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL_TIP="Quando questa opzione è abilitata e qualcuno tenta di modificare la configurazione globale di Joomla!, dal backend o dal frontend, si riceverà una notifica oppure l'utente verrà bloccato (in base alle impostazioni seguenti)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL="Invia e-mail a questo indirizzo in caso di modifica della configurazione monitorata"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL_TIP="Gli indirizzi e-mail, separati da virgole, a cui si desidera ricevere notifiche di eventuali modifiche alla configurazione globale e/o dei componenti monitorati. Se questo campo viene lasciato vuoto, verrà utilizzato l'indirizzo e-mail impostato nell'opzione &quot;Invia e-mail a questo indirizzo dopo un blocco IP automatico&quot;. Se entrambi i campi sono vuoti, verrà inviata un'e-mail a tutti gli account Super utente attivi che hanno l'opzione Ricevi e-mail di sistema abilitata nel proprio profilo utente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN="Avvisa per Self XSS"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN_TIP="Visualizza un messaggio nella console del browser per avvisare l'utente di evitare l'esecuzione di qualsiasi comando al suo interno. Questo può portare a compromettere il proprio account (cosiddetti attacchi Self XSS) e alla sottrazione dei dati dell'account."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES="Monitora i file critici"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL="Monitora le modifiche a questi file"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL_TIP="Monitora le modifiche ai seguenti file (uno per voce). Se viene rilevata una modifica, si riceverà una notifica via e-mail. I percorsi dei file sono relativi alla radice del sito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_TIP="I file critici comunemente modificati dagli hacker (index.php, administrator/index.php e i file index.php, error.php e component.php di tutti i template installati sul sito) vengono monitorati per eventuali modifiche a ogni caricamento di pagina. Se viene rilevata una modifica, si riceverà una notifica via e-mail. Questo consente solitamente di ricevere un avviso anticipato in caso di tentativo di hacking riuscito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL="Invia e-mail a questo indirizzo in caso di modifica dei file monitorati"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL_TIP="Gli indirizzi e-mail, separati da virgole, a cui si desidera ricevere notifiche quando avviene una modifica ai file critici e/o personalizzati monitorati. Se questo campo viene lasciato vuoto, verrà utilizzato l'indirizzo e-mail impostato nell'opzione &quot;Invia e-mail a questo indirizzo dopo un blocco IP automatico&quot;. Se entrambi i campi sono vuoti, verrà inviata un'e-mail a tutti gli account Super utente attivi che hanno l'opzione Ricevi e-mail di sistema abilitata nel proprio profilo utente."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR="Personalizza il meta tag generator"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR_TIP="Tutte le installazioni di Joomla! impostano il meta tag generator, un frammento di HTML nell'intestazione di tutte le pagine, per indicare che il sito è basato su Joomla!. Questa informazione viene memorizzata nella cache dai motori di ricerca e sfruttata dagli attaccanti per dedurre che il sito utilizza Joomla! quando cercano potenziali bersagli. L'abilitazione di questa opzione consente di impostare un valore personalizzato per il tag generator nell'opzione successiva. Siate creativi!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USEROPTS="Sicurezza gestione utenti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR="Monitoraggio"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS="Disattiva utenti in caso di accesso fallito"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS_TIP="Admin Tools può facoltativamente disattivare gli account utente esistenti quando si verificano più tentativi di accesso falliti con il loro nome utente, proteggendo gli account utente dagli attacchi brute force. Qui è possibile specificare il numero di accessi falliti e il periodo di tempo entro cui devono verificarsi prima che l'utente venga disattivato, ad esempio 3 accessi falliti in 1 minuto. Impostare il numero di accessi falliti a 0 disabilita questa funzione."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD="Protezione da inclusione diretta di file (DFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD_TIP="Quando questa opzione è abilitata, Admin Tools controlla i parametri GET e POST di ogni richiesta al frontend del tuo sito. La richiesta viene bloccata se un parametro contiene un byte nullo, oppure se il suo valore sembra un percorso di file, perché inizia con una barra, con ../ o con una lettera di unità come C:, e indica un file o una cartella che esiste sul tuo server, di qualunque tipo. Un valore composto solo da barre, ad es. return=/, non viene bloccato."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET="Disabilita il ripristino della password per specifici gruppi utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_TIP="Blocca gli utenti appartenenti a uno dei gruppi utente selezionati dal richiedere un ripristino della password tramite la funzione &quot;Password dimenticata?&quot; nel frontend del sito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS="Gruppi utente bloccati dal ripristino della password"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS_TIP="Gli utenti appartenenti a questi gruppi utente non potranno richiedere un ripristino della password. Non è necessario aggiungere gruppi con autorizzazioni da Super utente; questi vengono bloccati automaticamente da Joomla! stesso."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_HEAD="Blocco utenti dimenticati"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS="Impedisci l'accesso al backend agli utenti dimenticati"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION="Metodo di prevenzione accesso"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_BLOCK="Blocca"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_RESET="Forza il ripristino della password"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_TIP="Scegli come Admin Tools applicherà la prevenzione dell'accesso per gli utenti dimenticati. &quot;Blocca&quot; bloccherà permanentemente l'utente; un Super utente dovrà sbloccarlo manualmente. &quot;Forza il ripristino della password&quot; (consigliato) costringerà l'utente a reimpostare la propria password al prossimo accesso e non gli consentirà di eseguire altre operazioni sul sito fino al completamento del ripristino della password."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ="Controlla ogni [minuti]"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ_TIP="Esegui questo controllo al massimo ogni tot minuti specificati."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS="Gruppi utente backend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS_TIP="A quali gruppi utente con accesso al backend si applica questa funzione? Selezionare nessun gruppo per applicarla a tutti i gruppi utente con accesso al backend del sito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS="Numero massimo di giorni dall'ultimo accesso"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS_TIP="Gli utenti appartenenti ai gruppi utente specificati sopra e che non hanno effettuato l'accesso per almeno questo numero di giorni verranno bloccati dall'accesso."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED="Utenti protetti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED_TIP="Questi utenti non verranno mai bloccati. Si consiglia di inserire in questo elenco un numero <strong>molto</strong> limitato di account utente. In genere, dovrebbero essere inclusi solo l'account del proprietario del sito e quello dello sviluppatore, nessun altro (in particolare <strong>NON</strong> altri collaboratori che potrebbero lasciare il progetto con i propri account ancora attivi, che è esattamente il problema che questa protezione mira a risolvere)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_TIP="Impedisce agli utenti con accesso al backend che non hanno effettuato l'accesso per molto tempo di accedere al sito. Molto probabilmente si tratta di utenti obsoleti che si è dimenticato di rimuovere e la cui password potrebbe essere stata compromessa nel frattempo."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN="Invia e-mail a questo indirizzo in caso di accesso amministratore fallito"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN_TIP="Inserire un indirizzo e-mail per ricevere una notifica in caso di accesso non riuscito di chiunque nel backend amministratore del sito. Lasciare vuoto per non ricevere notifiche. Assicurarsi prima che il sito possa inviare e-mail!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN="Invia e-mail a questo indirizzo in caso di accesso backend riuscito"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN_TIP="Inserire un indirizzo e-mail per ricevere una notifica in caso di accesso riuscito di chiunque nel backend amministratore del sito. Lasciare vuoto per non ricevere notifiche. Assicurarsi prima che il sito possa inviare e-mail!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES="Invia e-mail a questo indirizzo in caso di richiesta bloccata"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES_TIP="Inserire un indirizzo e-mail per ricevere una notifica per qualsiasi richiesta bloccata sul sito. Lasciare vuoto per non ricevere notifiche. Assicurarsi prima che il sito possa inviare e-mail!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS="Invia eccezioni PHP a questo indirizzo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS_TIP="Ogni volta che viene generata un'eccezione PHP non gestita (ovvero un errore in una query del database), Admin Tools invierà un'e-mail contenente tutti i dettagli (ora, file e riga che ha generato l'eccezione) per il debug successivo."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE="Abilita la limitazione delle e-mail per le richieste bloccate"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE_TIP="Quando abilitata, la frequenza delle e-mail inviate da Admin Tools può essere limitata. Consultare i Template e-mail per le impostazioni sulla frequenza massima delle e-mail."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION="Filtra la registrazione utenti per e-mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_ALLOW="Consenti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_BLOCK="Blocca"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_TIP="Scegli se Admin Tools deve consentire o bloccare i domini e-mail presenti nell'elenco seguente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS="Blocca anche gli IP sospetti, non solo gli spammer confermati"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS_TIP="A volte Project Honeypot non è sicuro se un IP appartiene a uno spammer o si tratta di un utente che ha cliccato sul link sbagliato. In questo caso l'IP viene contrassegnato come \"sospetto\". Il comportamento predefinito è di non bloccare questi IP. Tuttavia, se si riceve molto spam, è buona idea abilitare questa funzione e bloccare anche gli IP \"sospetti\". Va tenuto presente che alcuni utenti sfortunati potrebbero essere involontariamente bloccati, quindi utilizzare questa opzione con cautela!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE="Abilita il filtraggio HTTP:BL"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE_TIP="Abilita l'integrazione con <a href='http://www.projecthoneypot.org'>Project Honeypot</a>. <strong>IMPORTANTE</strong>: È necessario registrarsi a Project Honeypot, ottenere una chiave e inserirla nell'opzione successiva affinché questa funzione funzioni."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE="Età massima dei risultati HTTP:BL accettati (giorni)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE_TIP="Project Honeypot segnala quando è stata l'ultima volta che questo IP è stato rilevato nell'invio di messaggi spam. Più è vecchio (maggiore è l'età), meno probabile è che questo IP sia ancora utilizzato da uno spammer. Qui è possibile scegliere quale sarà l'età massima segnalata che verrà bloccata. Il valore predefinito di 30 significa che gli IP che hanno inviato un messaggio spam negli ultimi 30 giorni verranno bloccati."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD="Valutazione minima della minaccia per il blocco"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD_TIP="Project Honeypot utilizza una \"valutazione della minaccia\" logaritmica per classificare la probabilità che un determinato IP sia uno spammer. Questa opzione definisce il livello minimo di minaccia che un IP deve avere prima di essere bloccato. Un valore di 25 significa che questo IP ha inviato 100 messaggi spam sulle honeypot di cattura spam di Project Honeypot ed è solitamente un'indicazione affidabile che appartiene a uno spammer. Si noti che la valutazione è logaritmica. Un valore di 50 significa 1.000 messaggi spam e un valore di 75 significa un milione di messaggi spam. Non impostarlo su valori superiori a 50, poiché con tutta probabilità non si bloccherà alcuno spammer. Il valore predefinito è 25 (100 messaggi spam rilevati da quell'indirizzo IP)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL="Nega l'accesso al sito agli IP presenti nell'Elenco IP non consentiti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL_TIP="Quando abilitata, se l'IP del visitatore è presente nell'Elenco IP non consentiti (vedere la funzione Elenco IP non consentiti) riceverà immediatamente un errore 403 Forbidden quando tenta di accedere al sito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL="Consenti l'accesso all'amministratore solo agli IP nell'Elenco IP consentiti esclusivo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL_TIP="Quando abilitata, solo gli IP presenti nell'Elenco IP consentiti esclusivo (vedere la funzione Elenco IP consentiti esclusivo per l'amministratore) potranno accedere all'area amministratore del sito. Tutti gli altri tentativi di accedere alle pagine dell'amministratore verranno reindirizzati alla home page del sito. Prestare attenzione quando si utilizza questa funzione! Se non si è aggiunto il proprio IP all'Elenco IP consentiti esclusivo, si verrà bloccati dall'area amministratore!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD="ItemidShield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_TIP="Quando abilitata, Admin Tools bloccherà qualsiasi valore non valido per il parametro URL ItemId o tenterà di correggerlo in un valore intero valido"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_OFF="Disattivato"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_BLOCK="Blocca"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_CLEAN="Pulisci"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS="Blocca i parametri core sospetti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS_TIP="Blocca le richieste con valori sospetti nei parametri della query string core di Joomla!, come <code>option</code>, <code>view</code>, <code>task</code>, ecc."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD="Avvisa per l'uso di password notoriamente compromesse"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS="Gruppi utente da controllare per password notoriamente compromesse"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS_TIP="Admin Tools verificherà le password notoriamente compromesse solo per gli utenti appartenenti a questi gruppi (predefinito: Super utenti)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_TIP="Quando questa opzione è abilitata, Admin Tools si collegherà al database Have I Been Pwned e verificherà se l'hash della password corrente è noto. Se viene trovata una corrispondenza, all'utente verrà impedito di utilizzare una password non sicura."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES="Registra le richieste bloccate"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES_TIP="Si consiglia di mantenere abilitata questa opzione. Quando abilitata, tutte le potenziali violazioni della sicurezza — bloccate da Admin Tools — verranno registrate nel database e rese disponibili nello strumento Registro delle richieste bloccate."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE="Mantieni un file di log di debug"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE_TIP="Admin Tools può facoltativamente mantenere un file di log nella cartella log di Joomla! configurata. Quando questa opzione è abilitata, viene aggiunta una voce al file di log ogni volta che una richiesta viene bloccata. Questa voce contiene informazioni aggiuntive utili per la risoluzione dei problemi, incluso un dump completo dei dati della richiesta. Ciò significa che è possibile che vengano memorizzate informazioni personali identificabili o sensibili in un file non crittografato. Si consiglia di abilitare questa opzione solo quando si sta risolvendo un problema altrimenti difficile da individuare e di disabilitarla nuovamente una volta raccolte informazioni sufficienti per affrontare il problema."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES="Registra i nomi utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES_TIP="Quando abilitata, Admin Tools includerà il nome utente durante il monitoraggio degli accessi falliti (vedi sopra). ATTENZIONE! Si consiglia vivamente di mantenere questa opzione disabilitata per evitare problemi con il GDPR"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD="Blocco agente utente malevolo (MUAShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD_TIP="Molti hacker tenteranno di accedere al sito utilizzando un browser configurato per inviare codice PHP malevolo nella stringa dell'agente utente (un piccolo testo usato per descrivere il browser al server). L'idea è che software di elaborazione dei log difettoso possa analizzarlo e consentire all'hacker di prendere il controllo del sito. Quando abilitata, questa funzione consente a Admin Tools di rilevare tali attacchi e bloccare la richiesta."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN="Vieta l'accesso frontend ai Super Amministratori"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN_TIP="Quando abilitata, non sarà possibile per i Super Amministratori accedere al frontend del sito. Si tratta di una precauzione di sicurezza contro gli attacchi brute force alle password. Anche gli utenti con privilegi da Super utente non potranno accedere al frontend del sito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS="Disabilita la modifica delle proprietà utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_TIP="Quando abilitata, il tentativo di modificare le impostazioni di un Manager, Amministratore o Super Amministratore esistente o di crearne uno nuovo fallirà."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS="Disabilita la modifica delle proprietà utente per questi gruppi utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS_TIP="A quali gruppi utente con accesso al backend si applica questa funzione? Se non si seleziona alcun gruppo, Admin Tools disabiliterà la modifica delle proprietà utente per tutti gli utenti che hanno accesso al backend del sito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS="Disabilita la creazione / modifica degli utenti dal frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_TIP="In condizioni normali non è possibile creare un nuovo utente con privilegi di accesso al backend amministrativo dal frontend pubblico. Quando questa opzione è abilitata, Admin Tools tratterà i tentativi di creare questo tipo di account come tentativi di hacking e li bloccherà. Questa funzionalità risolve alcuni degli attacchi zero day più famosi di Joomla! verificatisi tra il 2015 e il 2016."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS="Disabilita la creazione / modifica degli utenti in questi gruppi dal frontend"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS_TIP="A quali gruppi di utenti con accesso al backend si applica questa funzionalità? Se non si seleziona alcun gruppo, Admin Tools disabiliterà la creazione o la modifica di utenti dal backend per tutti gli utenti che hanno o acquisiranno l'accesso al backend del sito."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD="Blocco dei wrapper PHP stream (PHPShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD_TIP="Alcuni hacker cercheranno di utilizzare i cosiddetti wrapper PHP stream (che appaiono come URL che iniziano con php://, phar:// ecc.) per manipolare surrettiziamente i file del sito, aggirando i controlli di caricamento dei file integrati in Joomla!. Quando questa opzione è abilitata, Admin Tools bloccherà ogni richiesta che include testo corrispondente a uno dei wrapper PHP stream comunemente utilizzati dagli hacker."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL="Non inviare notifiche e-mail per questi motivi"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL_TIP="Le richieste bloccate per questi motivi non genereranno l'invio di un'e-mail all'indirizzo specificato in <em>Invia e-mail a questo indirizzo per le richieste bloccate</em>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG="Non registrare questi motivi"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG_TIP="Le richieste bloccate per questi motivi non verranno registrate. Di conseguenza, gli IP che generano ripetutamente una richiesta bloccata per questo motivo non verranno automaticamente bannati dal sito. Inoltre, in assenza di un registro, sarà impossibile determinare perché qualcuno viene bloccato nell'accesso al sito quando attiva uno di questi motivi."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA="Disabilita l'autenticazione a due fattori di Joomla! al ripristino della password"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA_TIP="Quando abilitato, Admin Tools disabiliterà la configurazione dell'autenticazione a due fattori di Joomla! per un utente quando reimposta la propria password. Questo si applica solo alla funzionalità di autenticazione a due fattori integrata in Joomla! 3.2 e versioni successive, non alla funzionalità di autenticazione a due fattori di Admin Tools."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD="Blocco Remote File Inclusion (RFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD_TIP="Alcuni hacker cercheranno di forzare un'estensione vulnerabile a caricare codice PHP direttamente dal proprio server. Questo viene fatto passando un URL http(s):// o ftp:// nella richiesta, puntando al loro sito malevolo. Quando questa opzione è abilitata, Admin Tools cercherà tali casi, proverà a recuperare l'URL remoto e ne analizzerà il contenuto. Se viene rilevato codice PHP, bloccherà la richiesta."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP="Salva l'IP di registrazione dell'utente nelle Note utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_TIP="Quando abilitato, l'IP dal quale i nuovi utenti si sono registrati verrà memorizzato come Nota utente. Gli utenti creati tramite il backend non avranno il loro IP salvato come Nota utente perché non avrebbe senso farlo (è un amministratore che registra l'account utente per conto loro). Anche i componenti di terze parti che creano nuovi account utente potrebbero non attivare l'evento del plugin."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY="Categoria delle Note utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY_TIP="Seleziona la categoria delle Note utente in cui Admin Tools deve salvare l'IP dell'utente, predefinita su Non categorizzato"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT="Difendi dalla disattivazione del plugin"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT_TIP="Quando abilitato, Admin Tools impedirà agli utenti del backend di tentare di disabilitare (non pubblicare) il plugin. Questo significa che anche tu non potrai non pubblicare il plugin finché non disabiliti questa opzione! Tieni presente che questa funzionalità non ha effetto su chi modifica direttamente il database, rinomina o elimina i file del plugin di sistema Admin Tools (la directory <code>plugins/system/admintools</code> del sito). Non protegge nemmeno dalla disinstallazione di Admin Tools perché solo i Super utenti possono farlo per impostazione predefinita. Se un attaccante ottiene i privilegi di Super utente, la disabilitazione di Admin Tools è il minore dei problemi."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD="Protezione contro l'avvelenamento dei dati di sessione PHP (SessionShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD_TIP="Previene i dati di input malevoli che possono essere utilizzati per ingannare il gestore di sessioni interno di PHP nell'esecuzione di codice arbitrario durante il ripristino della sessione utente. ATTENZIONE: Potrebbe <em>bloccare</em> anche alcune richieste legittime."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD="Protezione SQLiShield contro gli attacchi SQL injection"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD_TIP="Quando abilitato, Admin Tools cercherà di rilevare i comuni attacchi SQL injection contro il sito e li bloccherà."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST="Monitora gli account Super utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_TIP="Admin Tools terrà traccia degli account utente con accesso da Super utente. Se viene aggiunto un nuovo Super utente al di fuori della pagina Utenti di Joomla riceverai una notifica via e-mail. Inoltre, i nuovi account Super utente rilevati verranno automaticamente bloccati. Gli utenti creati o aggiunti da altri Super utenti nel backend del sito tramite la pagina Utenti di Joomla NON verranno bloccati da questa funzionalità. Utilizza la funzionalità &ldquo;Disabilita la modifica delle proprietà degli utenti del backend&rdquo; per evitare questo."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL="Invia e-mail a questo indirizzo in caso di modifica dei Super utenti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL_TIP="Gli indirizzi e-mail, separati da virgole, ai quali si desidera ricevere notifiche su qualsiasi tentativo (bloccato!) di modifica nell'elenco dei Super utenti del sito. Se questo campo viene lasciato vuoto, verrà utilizzato l'indirizzo e-mail configurato nell'opzione \"Invia e-mail a questo indirizzo dopo un ban IP automatico\". Se entrambi i campi sono vuoti, verrà inviata un'e-mail a tutti gli account Super utente attivati che hanno l'opzione Ricevi e-mail di sistema abilitata nel loro profilo utente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE="Blocca il cambio di template del sito tramite template=pippo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE_TIP="Un'altra funzionalità nascosta di Joomla! è la possibilità di passare da un template installato all'altro tramite un parametro URL speciale. Ad esempio, per applicare il template Beez5, basta passare il parametro <code>?template=beez5</code>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL="Blocca il cambio di template di sistema tramite tmpl=pippo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST="Elenco delle parole chiave tmpl= consentite"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST_TIP="Una parola chiave tmpl per voce. Le voci component e system vengono sempre aggiunte, indipendentemente dal fatto che vengano aggiunte esplicitamente qui."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL_TIP="Una delle funzionalità meno conosciute di Joomla! sono i suoi template di sistema. Ogni volta che si verifica un errore o il sito viene messo offline, Joomla! carica il rispettivo template di sistema. Passare il nome del template nell'URL aggiungendo, ad esempio, ?tmpl=offline consente di testare questi template senza dover effettivamente produrre un errore o mettere il sito offline. L'abilitazione di questa opzione disattiverà questa funzionalità nascosta di Joomla!. Tieni presente che tmpl=system e tmpl=component devono essere consentiti (vedi opzione successiva), poiché sono richiesti da alcune estensioni per funzionare."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS="Tratta i login falliti come motivo di blocco della richiesta"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS_TIP="Quando abilitato, i tentativi di accesso falliti di qualsiasi tipo di utente (anche semplici utenti registrati) contano come motivo valido per bloccare la richiesta e vengono registrati nel Registro delle richieste bloccate di Admin Tools. Questo ha un'implicazione molto utile. Poiché contano come motivi per bloccare una richiesta, contano anche verso il limite impostato nel blocco IP automatico. Pertanto, dopo un certo numero di tentativi di accesso falliti, l'IP dell'utente verrà automaticamente bloccato per la durata impostata."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL="Invia e-mail di risoluzione problemi per le funzioni amministrative"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL_TIP="Invia un'e-mail all'utente del backend attualmente connesso ogni volta che esegue una funzione amministrativa di Admin Tools che potrebbe causare il blocco dell'accesso al sito o il malfunzionamento del sito. L'e-mail contiene link agli articoli di risoluzione problemi che aiutano a correggere il problema e ripristinare il sito al suo stato funzionante. Si consiglia vivamente di mantenere questa funzionalità abilitata. Seguire le informazioni di risoluzione problemi è molto più rapido che attendere una risposta dal nostro supporto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD="Scanner dei file caricati (UploadShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_TIP="Ispeziona ogni file caricato sul tuo sito e blocca la richiesta quando il file sembra poter essere usato per eseguire codice sul tuo server. Questo ti protegge dalle estensioni di terze parti vulnerabili che permettono agli attaccanti di caricare file arbitrari. I caricamenti effettuati da Super utenti autenticati non vengono mai ispezionati."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS="UploadShield: impedisci l'override tramite .htaccess"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS_TIP="Blocca la richiesta quando viene caricato un file di nome .htaccess il cui contenuto include una direttiva Apache SetHandler o AddHandler. Gli attaccanti usano queste direttive per far eseguire ad Apache come codice PHP file altrimenti inerti, come le immagini."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT="UploadShield: impedisci il caricamento di file con estensioni multiple"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT_TIP="Blocca la richiesta quando una qualsiasi parte del nome del file caricato somiglia a un'estensione di file PHP, ad es. evil.php.jpg o evil.jpg.php5. Alcune configurazioni errate del server eseguono tali file come codice PHP, indipendentemente dal loro tipo apparente."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT="UploadShield: impedisci il caricamento di file PHP"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT_TIP="Blocca la richiesta quando l'estensione del file caricato è un'estensione di file PHP, come .php, .phps, .phtml, .inc, .php7 e così via."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT="UploadShield: impedisci contenuto PHP nei caricamenti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT_TIP="Blocca la richiesta quando un file caricato contiene qualcosa che somiglia a codice PHP, indipendentemente dal nome del file. Questo intercetta gli attacchi che nascondono codice PHP all'interno di un file immagine o documento altrimenti valido."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW="Mostra gli errori utilizzando un template HTML personalizzabile"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW_TIP="Per impostazione predefinita, il messaggio di richiesta bloccata verrà mostrato utilizzando la pagina di errore standard di Joomla!. Quando questa opzione è abilitata, tuttavia, Admin Tools utilizzerà un template HTML personalizzabile. Il file del template HTML predefinito si trova nel file components/com_admintools/View/Blocks/tmpl/default.php. NON MODIFICARE QUESTO FILE DIRETTAMENTE! Leggi la documentazione per il metodo corretto per creare un override del template."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS="Domini mai bloccati"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS_TIP="Se l'indirizzo IP di un visitatore la cui richiesta viene bloccata si risolve in un nome di dominio che termina con quanto inserito qui, la richiesta viene comunque bloccata, ma non viene registrata, non viene inviata alcuna e-mail al riguardo e l'indirizzo IP non viene mai bloccato automaticamente. Il nome di dominio deve inoltre risolversi di nuovo nell'indirizzo IP del visitatore, quindi un record DNS inverso contraffatto non conta. Tieni presente che un elenco lungo causerà un impatto significativo sulle prestazioni. L'elenco è vuoto per impostazione predefinita. Per i motori di ricerca e i crawler IA, usa invece la scheda Crawlers."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN="Aggiungi i trasgressori persistenti all'elenco IP non consentiti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM="Aggiungi all'elenco IP non consentiti dopo questo numero di blocchi automatici"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_2="blocchi IP automatici"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_TIP="Quando l'opzione precedente è abilitata, dopo quanti ban automatici un IP verrà bannato in modo permanente (aggiunto all'elenco IP non consentiti)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN_TIP="Se un IP attiva questo numero di ban automatici verrà bannato in modo permanente (aggiunto all'elenco IP non consentiti) se sta per essere bannato automaticamente di nuovo. Assicurati di attivare la funzionalità Elenco IP non consentiti impostando <em>Nega l'accesso al sito agli IP nell'elenco IP non consentiti</em> su Sì, altrimenti l'aggiunta permanente all'elenco IP non consentiti non avrà effetto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PROJECTHONEYPOT="Project Honeypot"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_BODY="<p>L'utente si è registrato al sito utilizzando l'indirizzo IP <strong>%s</strong></p><p>La stringa user agent del browser dell'utente era:<br/>%s</p><p>Queste informazioni sono state registrate automaticamente in questa Nota utente da Admin Tools Professional.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_SUBJECT="Indirizzo IP di registrazione"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE="Mostra questo messaggio agli IP bloccati"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE_TIP="Consente di mostrare un messaggio specifico agli indirizzi IP bloccati. Puoi spiegare all'utente che il suo IP è stato bloccato perché è stata rilevata un'attività sospetta proveniente dal suo indirizzo IP. Puoi utilizzare il testo speciale [IP] in lettere maiuscole, senza spazi tra le parentesi e IP, per visualizzare l'IP dell'utente nel messaggio. Questo può essere utile se qualcuno viene bloccato accidentalmente e ti chiede aiuto."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSR="Ban automatico"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM="Durata del blocco"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM_TIP="Per quanto tempo durerà il blocco. Ad esempio, impostarlo a 1 giorno bloccherà tutti gli accessi da questo indirizzo IP per un giorno intero. Inserisci il numero in questo campo, seleziona l'unità di misura del tempo nel campo successivo."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY="Unità di misura del tempo per la durata del blocco"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY_TIP="L'unità di misura del tempo per l'impostazione \"Durata del blocco\" sopra. Scegli tra secondi, minuti, giorni o ore."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE="Blocco IP dei trasgressori abituali"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE_TIP="Quando impostato su sì, l'indirizzo IP dei trasgressori abituali verrà automaticamente bannato in base alle impostazioni rimanenti"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES="Blocca IP dopo questo numero di richieste bloccate"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES_TIP="Quando le richieste provenienti da un indirizzo IP vengono bloccate almeno questo numero di volte nel periodo di tempo definito dalle due opzioni successive, quell'IP verrà temporaneamente bloccato dall'accesso al sito. Ad esempio, se impostato a 3 attacchi in 1 ora, Admin Tools negherà l'accesso da un indirizzo IP che ha avuto almeno 3 richieste bloccate nell'ultima ora. Inserisci il valore 0 per disabilitare questa funzionalità."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ="Periodo di tempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ_TIP="Il numero di richieste bloccate definito sopra deve verificarsi entro questo numero di secondi, minuti, ore o giorni. Inserisci il numero qui; scegli l'unità di misura del tempo nell'opzione sottostante."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY="Unità di misura del tempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY_TIP="L'unità di misura del tempo per l'impostazione \"Periodo di tempo\" sopra. Scegli tra secondi, minuti, giorni o ore."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN="Autenticazione con password quando l'accesso con passkey è abilitato per un account utente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_TIP="Se un utente abilita l'autenticazione con passkey per il proprio account utente, deve essere consentito l'accesso alternativo con password?"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_ALLOWED="Sempre consentita (predefinita di Joomla)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_USERDECIDES="Lascia decidere agli utenti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERALLOWED="Disabilitata per gli utenti del backend, consentita per gli altri"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERDECIDE="Disabilitata per gli utenti del backend, lascia decidere agli altri"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBODY="Disabilitata per tutti"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS="Domini consentiti"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS_TIP="Inserisci tutti i nomi di dominio completi a cui il sito dovrebbe rispondere, ad es. <em>example.com, www.example.com, example.net</em>. Una voce per campo di testo; aggiungi altri campi facendo clic/toccando il pulsante verde +. Non è necessario aggiungere <code>localhost</code> o qualsiasi altro nome di dominio che si risolve in <code>127.0.0.1</code> o <code>::1</code> (indirizzi localhost). Se qualcuno cerca di falsificare l'intestazione HTTP Host con un nome di dominio non presente in questo elenco, riceverà una risposta HTTP 421 Misdirected Request. Questa funzionalità previene lo spoofing dell'intestazione Host su alcuni host mal configurati."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL="Invia e-mail a questo indirizzo in caso di aumento delle richieste bloccate"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL_TIP="Verrà inviata un'e-mail a questo indirizzo se Admin Tools rileva che un gran numero di richieste è stato bloccato in un determinato periodo di tempo. Puoi configurarlo di seguito; il valore predefinito è 1000 richieste bloccate in un'ora."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM="Numero di richieste bloccate"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM_TIP="Devono essere rilevate almeno questo numero di richieste bloccate nel periodo di tempo definito di seguito per generare l'invio di un'e-mail."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ="Periodo di tempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ_TIP="Le richieste bloccate definite sopra devono verificarsi entro questo numero di secondi, minuti, ore o giorni. Inserisci il numero qui; scegli l'unità di misura del tempo nell'opzione sottostante."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGEFREQUENCY="Unità di misura del tempo"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGEFREQUENCY_TIP="L'unità di misura del tempo per l'impostazione \"Periodo di tempo\" sopra. Scegli tra secondi, minuti, giorni o ore."

[Wafexceptions]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; WAF Exceptions
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_WAFEXCEPTIONS="Eccezioni WAF"
COM_ADMINTOOLS_TITLE_WAFEXCEPTION_ADD="Aggiungi un’eccezione WAF"
COM_ADMINTOOLS_TITLE_WAFEXCEPTION_EDIT="Modifica un'eccezione WAF"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_INTRO = "Questa pagina consente di selezionare componenti, viste o stringhe di query specifici <i>da NON proteggere</i> tramite il Web Application Firewall. Le eccezioni vengono applicate in due gruppi:"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_A = "Quando vengono specificate <i>tutte le stringhe di query</i> per un componente o una vista, le seguenti funzionalità WAF vengono disabilitate completamente: Bad Behaviour, SQLiShield, XSSShield, MUAShield, RFIShield, DFIShield e Filtraggio parole vietate"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_B = "Quando vengono specificate <i>stringhe di query particolari</i> per un componente o una vista, le seguenti funzionalità WAF vengono disabilitate <i>solo per quelle stringhe di query</i>: SQLiShield, XSSShield, RFIShield, DFIShield, Filtraggio parole vietate e Blocco parametri URL sospetti"

COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_TITLE="Non è ancora stata creata alcuna regola di eccezione WAF."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_CONTENT="Le regole di eccezione WAF consentono di impedire il blocco delle richieste al sito per componenti, viste e parametri di stringa di query specifici. Può essere utilizzato quando si sa che un componente è sicuro ma il modo in cui funziona genererà sempre dei falsi positivi."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_BUTTON_ADD="Aggiungi una regola di eccezione WAF"

