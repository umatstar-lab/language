COM_ADMINTOOLS_EMERGENCYOFFLINE_ERR_NOTAPPLIED="Der Notfall-Offline-Modus konnte nicht aktiviert werden. Klicken Sie auf die Schaltfläche „Notfall-Offline“, um Informationen zur manuellen Aktivierung zu erhalten."
