COM_ADMINTOOLS_WAFDENYLISTS_LBL_TASK_DESC="Welcher Task (ein Befehl für einen bestimmten Komponentenbereich) auf diese Regel angewendet werden soll. Deaktivieren Sie SEF-URLs, und Sie werden entweder <code>task=AufgabenName</code> oder <code>task=AnsichtsName.AufgabenName</code> sehen, wobei <var>AufgabenName</var> der hier einzugebende Task ist. Ein leeres Feld stimmt mit allen Ansichten überein."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY="Abfrageparameter"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_DESC="Welcher Abfragezeichenfolge-Parameter für den Abgleich dieser Regel verwendet wird, z. B. <code>id</code>. Leer lassen, um die Regel unabhängig vom Abfrageparameter-Inhalt anzuwenden. Beachten Sie, dass der Abgleich des Abfrageinhalts erst <strong>nach</strong> der Umwandlung einer SEF-URL durch Joomla in ihr Nicht-SEF-Format erfolgt. Das bedeutet, dass einige Abfrageparameter für Sie möglicherweise nicht sichtbar sind – obwohl sie für Joomla und Admin Tools sichtbar sind und daher dazu führen können, dass die Anfrage durch die Web Application Firewall blockiert wird –, sofern Sie SEF-URLs nicht deaktivieren."

COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE="Filtertyp des Abfrageparameters"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_ANY="(Alle)"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_TYPE_DESC="Wählen Sie aus, wie der Abfrageparameter abgeglichen werden soll. \"RegEx\" bedeutet, dass das Feld „Abfrageparameter\" einen <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">PHP-regulären Ausdruck</a> enthält, der mit dem Inhalt des Abfrageparameters abgeglichen wird. Sie können einen regulären Ausdruck negieren, indem Sie ihm ein Ausrufezeichen (<code>!</code>) voranstellen. \"Exakt\" bedeutet, dass der Abfrageparametername genau dem Feld „Abfrageparameter\" entsprechen muss, einschließlich Groß- und Kleinschreibung. \"Teilweise\" bedeutet, dass der Abfrageparametername den eingegebenen Abfrageparameter enthalten muss, z. B. stimmt der Abfrageparameter \"bar\" mit den folgenden Abfrageparameternamen überein: \"re<em>bar</em>\", \"<em>bar</em>tender\" und \"<em>bar</em>\"."

