COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS="PHP-Handler-Direktiven gefunden"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_DESC="Admin Tools hat festgestellt, dass Ihre <code>.htaccess</code>-Datei Direktiven enthält, die Ihren Webserver anweisen, eine bestimmte PHP-Version zu verwenden. Diese Direktiven, die unten angezeigt werden, müssen in das Feld „Benutzerdefinierte .htaccess-Regeln\" kopiert werden, damit Ihre Website nach dem Erstellen einer neuen .htaccess-Datei mit Admin Tools korrekt funktioniert. Klicken Sie auf die Schaltfläche „Übernehmen\", um dies automatisch zu tun."
