COM_ADMINTOOLS_ERR_EXCEPTIONSFROMWAF_ALLNULL="Sie können nicht alle Felder leer lassen; das würde bedeuten, dass einige WAF-Einstellungen dauerhaft inaktiv sind!"

COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_APPLIED="Ihre Website befindet sich jetzt im Notfall-Offline-Modus"
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREAPPLY="Durch Klicken auf die Schaltfläche unten wird Ihre Website in den Notfall-Offline-Modus versetzt. In diesem Modus kann niemand auf Ihre Website zugreifen, außer Besuchern, die von Ihrer aktuellen IP-Adresse kommen. Sollte Ihre Internetverbindung unterbrochen werden oder sich Ihre IP-Adresse aus irgendeinem Grund ändern, ist die einzige Möglichkeit, auf Ihre Website zuzugreifen, die Entfernung der <code>.htaccess</code>-Datei aus dem Stammverzeichnis Ihrer Website per FTP. Bitte lesen Sie dies sehr sorgfältig und drucken Sie diese Seite als Referenz aus."
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREAPPLYMANUAL="Falls dieses automatisierte Tool die <code>.htaccess</code>-Datei im Stammverzeichnis Ihrer Website nicht erstellen kann, entfernen Sie bitte Ihre aktuelle <code>.htaccess</code>-Datei (falls vorhanden) und erstellen Sie eine neue <code>.htaccess</code>-Datei mit folgendem Inhalt:"
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREUNAPPLY="Durch Klicken auf die Schaltfläche „Offline schalten“ wird die <code>.htaccess</code>-Datei des Notfall-Offline-Modus im Stammverzeichnis Ihrer Website erneut angewendet. Durch Klicken auf die Schaltfläche „Online schalten“ wird diese Datei entfernt."
COM_ADMINTOOLS_EMERGENCYOFFLINE_LBL_PREUNAPPLYMANUAL="Wenn das Wiederherstellen der Website auf Online-Betrieb fehlschlägt, können Sie dies dennoch per FTP, SFTP oder dem Dateimanager Ihres Hosting-Kontrollpanels durchführen. Entfernen Sie die aktuelle <code>.htaccess</code>-Datei aus dem Stammverzeichnis Ihrer Website. Benennen Sie dann die Datei <code>.htaccess.eom</code> wieder in <code>.htaccess</code> um."
