COM_ADMINTOOLS_TITLE_NGINXCONFMAKER="NginX-Konfigurations-Generator"

COM_ADMINTOOLS_NGINXCONFMAKER_LBL_APPLIED="Die neue nginx.conf wurde auf den Datenträger geschrieben. Denken Sie daran, sie in Ihre NginX-Website-Konfigurationsdatei einzubinden oder dorthin zu kopieren und Ihren Server neu zu laden oder neu zu starten."
