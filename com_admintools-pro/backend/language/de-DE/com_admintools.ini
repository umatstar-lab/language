COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_WORKS="Die Selbstaktivierung durch Benutzer ist auf Ihrer Website aktiviert. Automatisch deaktivierten Benutzern wird eine E-Mail mit Anweisungen zur erneuten Aktivierung ihres Benutzerkontos gesendet."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_ADMINACTIVATION="Die Benutzeraktivierung ist auf <strong>Administrator</strong> eingestellt, das bedeutet, dass die neue Aktivierungs-E-Mail an die Super-Benutzer gesendet wird und diese den Benutzer erneut aktivieren müssen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_NOREGISTRATION="Die Benutzerregistrierung auf Ihrer Website ist deaktiviert, daher kann Admin Tools keine Benutzer deaktivieren."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ALERT_NOUSERACTIVATION="Die Benutzeraktivierung auf Ihrer Website ist deaktiviert, daher kann Admin Tools keine Benutzer deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE="Abwesenheitszeitplan"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_FROM="Abwesenheitszeitplan von (hh:mm)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE_HEAD="Ihr Server meldet, dass die aktuelle Uhrzeit <strong>%s</strong> (<em>%s</em> Zeitzone) ist."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIMEZONE="<p>Die Zeiten im Abwesenheitszeitplan müssen in der Zeitzone %s angegeben werden. Sie können diese Zeitzone in der globalen Konfiguration von Joomla! ändern. Falls die aktuelle Uhrzeit immer noch nicht korrekt erscheint, bitten Sie Ihren Hoster, die Serverzeit sowie die PHP- und Betriebssystem-Zeitzoneneinstellungen zu überprüfen.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TIP="Der Abwesenheitszeitplan deaktiviert den Zugang zum Administratorbereich Ihrer Website während des von Ihnen in den Feldern „von“ und „bis“ angegebenen Zeitraums. Dies ist nützlich, wenn Sie der einzige Administrator der Website sind und sicherstellen möchten, dass während Ihrer Abwesenheit oder Schlafenszeit niemand auf den Administratorbereich Ihrer Website zugreifen kann. Die Zeit muss in der Serverzeitzone angegeben werden, die Sie in der globalen Konfiguration Ihrer Website eingerichtet haben. Die Zeitzone und die aktuelle Uhrzeit in dieser Zeitzone werden zur Ihrer Information in der Meldung unter dem Feld „Abwesenheitszeitplan von“ angezeigt."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_AWAYSCHEDULE_TO="Abwesenheitszeitplan bis (hh:mm)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGSAVED="Die Konfiguration der Web Application Firewall wurde gespeichert."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CONFIGNOTSAVED="Beim Speichern der Konfiguration der Web Application Firewall sind Fehler aufgetreten."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER="Administratoranmeldeverzeichnis ändern in"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_TIP="Wenn Sie beispielsweise das Wort <code>test</code> eingeben, können Sie nur über eine URL wie <code>http://www.example.com/test</code> auf den Administratorbereich Ihrer Website zugreifen. Wenn Sie versuchen, über <code>http://www.example.com/administrator</code> darauf zuzugreifen, werden Sie zur Startseite der Website weitergeleitet. Nachdem Sie die geheime URL mit Ihrem Browser aufgerufen haben, können Sie auch <code>http://www.example.com/administrator</code> besuchen, ohne gesperrt zu werden, bis Ihre Sitzung abläuft. Wenn Sie diese Funktion nicht verwenden möchten, lassen Sie dieses Feld leer. Bitte beachten Sie, dass diese Funktion erfordert, dass die Optionen <strong>SEF-URLs</strong> und <strong>URL-Umschreibung verwenden</strong> in der globalen Konfiguration von Joomla! beide auf „Ja“ gesetzt sind."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_HEAD="Diese Funktion ist experimentell und wird nicht unterstützt"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINLOGINFOLDER_NOTICE_TEXT="Auf manchen Websites kann der <strong>benutzerdefinierte Administrator-Anmeldeordner</strong> unzuverlässig funktionieren, überhaupt nicht funktionieren oder eine Anmeldung unmöglich machen. Wir sind uns dessen bewusst und es gibt keine Umgehungslösung. Aus diesem Grund wird diese Funktion <strong>OHNE SUPPORT</strong> bereitgestellt. Bitte lesen Sie die Dokumentation für weitere Informationen."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_DESC="Diese Meldung wird Benutzern angezeigt, wenn ihre Anfrage als möglicher Sicherheitsverstoß eingestuft wird. Halten Sie sie kurz und höflich. Lassen Sie das Feld leer, um die Standardmeldung zu verwenden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_HEADER="Anpassung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_CUSTOMMESSAGE_LABEL="Benutzerdefinierte Meldung"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM="Anzahl fehlgeschlagener Anmeldeversuche"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUM_TIP="Benutzer werden deaktiviert, wenn in dem durch die nächsten beiden Optionen konfigurierten Zeitraum so viele fehlgeschlagene Anmeldeversuche für sie aufgezeichnet werden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ="Zeitraum für fehlgeschlagene Anmeldeversuche"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_NUMFREQ_TIP="Benutzer werden deaktiviert, wenn mindestens so viele fehlgeschlagene Anmeldeversuche wie oben angegeben innerhalb dieses Zeitraums auftreten. Die Zeiteinheit (Sekunden, Minuten, Stunden, Tage) wird in der nächsten Option angegeben."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ="Zeiteinheit"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DEACTIVATE_FREQ_TIP="Legt die Zeiteinheit für das Feld „Zeitraum für fehlgeschlagene Anmeldeversuche“ fest."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQSECOND="Sekunden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQMINUTE="Minuten"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQDAY="Tage"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_FREQHOUR="Stunden"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN="Nach einer automatischen IP-Sperre diese Adresse per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_EMAILAFTERIPAUTOBAN_TIP="Admin Tools kann Ihnen optional eine E-Mail senden, wenn eine IP-Adresse automatisch gesperrt wird, an die in diesem Feld eingegebene E-Mail-Adresse. Lassen Sie dieses Feld leer (Standard), um diese Funktion zu deaktivieren."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR="Generator-Tag"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_GENERATOR_TIP="Geben Sie einen benutzerdefinierten Wert für das Generator-Meta-Tag ein oder lassen Sie das Feld leer, um einen automatisch generierten Wert zu verwenden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_HTACCESSTIP="Zum weiteren Schutz Ihrer Website verwenden Sie auch die .htaccess-Generator-Funktion dieser Komponente"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTP="http://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUPSCHEME_HTTPS="https://"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_DESC="Link zu einem IP-Lookup-Dienst. {ip} wird durch die IP-Adresse ersetzt. Standard: whatismyipaddress.com/ip/{ip}"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_IPLOOKUP_LABEL="IP-Lookup-Dienst"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS="Diese IP-Adressen niemals sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NEVERBLOCKIPS_TIP="Geben Sie die IP-Adressen ein, die unabhängig von Ihren Auto-Sperr-Einstellungen niemals automatisch gesperrt werden sollen. Sie können einzelne IPv4- und IPv6-Adressen (z. B. <em>127.0.0.1</em> und <em>::1</em>), IPv4-Bereiche (z. B. <em>127.0.0.1-127.0.0.10</em>), implizite IPv4-Bereichsnotation (<em>127.0.0.</em> für den gesamten Block 127.0.0.1 bis 127.0.0.255) sowie IPv4/IPv6-CIDR-Blocknotation (z. B. <em>127.0.0.0/8</em> für IPv4 oder <em>2001:db8::/32</em> für IPv6) verwenden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_ACTIVEFILTERING="Anfragefilterung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASIC="Grundlegende Sicherheit"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_BASICSETTINGS="Grundlegende Funktionen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_EXCEPTIONS="Ausnahmen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_CRAWLERS="Crawler"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_DESC="Admin Tools lädt die Listen der IP-Adressen herunter, die Suchmaschinen und KI-Unternehmen für ihre Crawler veröffentlichen, und verwendet sie für die unten ausgewählten Crawler. Mit „Blockieren“ werden alle Anfragen des Crawlers blockiert. Mit „Nicht blockieren“ wird der Crawler wie bei „Diese IP-Adressen niemals sperren“ behandelt: Eine schädliche Anfrage des Crawlers wird trotzdem blockiert, aber sie wird nicht protokolliert, es wird keine E-Mail dazu versendet, und die IP-Adresse wird nie automatisch gesperrt. Es werden nur die Crawler heruntergeladen, die Sie auf „Blockieren“ oder „Nicht blockieren“ einstellen. Wenn die Listen nicht heruntergeladen werden können oder der Cache der Website nicht funktioniert, deaktiviert Admin Tools diese Option selbstständig und benachrichtigt die Super-Benutzer per E-Mail."
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_LABEL="Crawler-IP-Listen verwenden"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_ALLOW="Nicht blockieren"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_BLOCK="Blockieren"
COM_ADMINTOOLS_CONFIGUREWAF_CRAWLERIPS_OPT_IGNORE="Ignorieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_FINGERPRINTING="Verschleierung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_JHARDENING="Härtungsoptionen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPTGROUP_LOGGINGANDREPORTING="Protokollierung & Berichterstattung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD="404 Shield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE="404 Shield aktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_ENABLE_TIP="Klicken Sie, um die Funktion 404 Shield zu aktivieren oder zu deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_404SHIELD_TIP="Diese Funktion behandelt 404-Nicht-gefunden-Fehler als Grund zum Sperren einer Anfrage, wenn diese bei URLs auftreten, von denen bekannt ist, dass sie von Hackern verwendet werden, um Ihre Website auf Schwachstellen zu scannen. Zum Beispiel, wenn ein Hacker versucht, auf die WordPress-Anmeldeseite zuzugreifen, obwohl Sie eine Joomla!-Website betreiben"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW="Geheimer URL-Parameter für den Administrator-Bereich"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP="Wenn Sie zum Beispiel ‘test’ eingeben, können Sie nur auf Ihren Administratorbereich zugreifen, indem Sie die URL <code>http://www.example.com/administrator/index.php?test</code> eingeben. <strong>WARNUNG! ER MUSS MIT EINEM BUCHSTABEN BEGINNEN, NICHT MIT EINER ZAHL</strong>. Für eine bessere Kompatibilität über Server hinweg verwenden Sie bitte nur ASCII-Kleinbuchstaben und Zahlen (a-z, 0-9)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_TIP_LONG="Der geheime URL-Parameter für den Administrator-Bereich darf nur aus lateinischen Kleinbuchstaben und Großbuchstaben ohne Akzente oder diakritische Zeichen (a-z und A-Z), den Ziffern 0-9, Bindestrichen und Unterstrichen bestehen. Das erste Zeichen darf kein Bindestrich oder Unterstrich sein. Er muss 4 bis 64 Zeichen lang sein."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ADMINPW_INVALID="Der geheime URL-Parameter für den Administrator-Bereich ist ungültig. Bitte beachten Sie, dass er nur aus lateinischen Kleinbuchstaben und Großbuchstaben ohne Akzente oder diakritische Zeichen (a-z und A-Z), den Ziffern 0-9, Bindestrichen und Unterstrichen bestehen darf. Das erste Zeichen darf kein Bindestrich oder Unterstrich sein. Er muss 4 bis 64 Zeichen lang sein."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION="Aktion bei ungültigem geheimen URL-Parameter für den Administrator-Bereich"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_TIP="Was zu tun ist, wenn der geheime URL-Parameter für den Administrator-Bereich fehlt oder ungültig ist. Weiterleiten: Leitet den Browser zur Website-Startseite weiter (Standard). Sperren: Sperrt die Anfrage mit der Admin Tools-Meldung für blockierte Anfragen und einem HTTP-403-Status. Bitte beachten Sie, dass dies bei anhaltenden Passwort-Brute-Force-Angriffen nicht so stark zur Entlastung des Servers beiträgt wie erwartet, da Passwort-Brute-Force-Bots Weiterleitungen in der Regel nicht folgen; verwenden Sie in diesem Fall die Administrator-Passwort-Funktion, um die hohe Serverlast am besten zu bewältigen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_REDIRECT="Weiterleiten"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_ACTION_BLOCK="Sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE="Browser-Cookie-Überschreibung für den geheimen URL-Parameter des Administrator-Bereichs"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_TIP="Soll bei erfolgreicher Administratoranmeldung ein Browser-Cookie gesetzt werden, das dem Browser ermöglicht, in den nächsten 30 Tagen jederzeit auf die Administrator-Anmeldeseite zuzugreifen, ohne den geheimen URL-Parameter des Administrator-Bereichs angeben zu müssen? Das Cookie wird ungültig, wenn Sie die Abmeldefunktion von Joomla! verwenden oder das Passwort des Benutzers ändern. Bitte lesen Sie die Dokumentation für weitere Informationen. Falls Sie unsicher sind, setzen Sie dies auf „Aktiviert, bei Verwendung benachrichtigen“."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_OFF="Deaktiviert"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON="Aktiviert"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_WARN="Aktiviert, bei Verwendung benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_ADMINPW_COOKIE_ON_MAXWARN="Aktiviert, an die Verwendung der vollständigen URL erinnern"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE="Website-Templates zulassen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWSITETEMPLATE_TIP="Das Aktivieren dieser Option überschreibt teilweise die vorherige Option (das Sperren von template=foo in der URL). Wenn der URL-Abfrageparameter template= den Namen eines Templates angibt, das in Ihrem Template-Verzeichnis vorhanden ist, wird er zugelassen, ohne dass die Anfrage gesperrt wird. Dies ist nur auf Websites erforderlich, die gleichzeitig mehr als ein Template verwenden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM="Anti-Spam-Filterung basierend auf der Liste unzulässiger Begriffe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ANTISPAM_TIP="Wenn aktiviert, werden alle Anfragen gesperrt, die mindestens ein Wort aus der Liste der unzulässigen Begriffe enthalten."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY="<a href='http://www.projecthoneypot.org/httpbl_configure.php' target='_blank'>Project Honeypot</a> HTTP:BL-Schlüssel"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BBHTTPBLKEY_TIP="Geben Sie Ihren HTTP:BL-Schlüssel ein. Sie können sich für Project Honeypot registrieren und Ihren Schlüssel unter <a href='http://www.projecthoneypot.org/httpbl_configure.php'>http://www.projecthoneypot.org/httpbl_configure.php</a> abrufen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS="E-Mail-Domains"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKEDEMAILDOMAINS_TIP="Geben Sie eine Domain pro Eintrag ein, ohne Protokoll, z. B. <code>example.com</code>, aber NICHT <s><code>https://www.example.com</code></s>. Admin Tools wird die Registrierung entsprechend dem obigen Feld zulassen oder sperren. Lassen Sie das Feld leer, um während der Benutzerregistrierung keine Einschränkungen anzuwenden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES="Häufige Benutzernamen sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_TIP="Wenn aktiviert, sperrt Admin Tools die Erstellung neuer Benutzerkonten, deren Benutzername in der Standard-Sperrliste enthalten ist (z. B. admin, ceo, manager usw.)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW="Explizit zugelassene Benutzernamen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_ALLOW_TIP="Liste der explizit zugelassenen Benutzernamen, einer pro Zeile."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID="Explizit verbotene Benutzernamen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_FORBID_TIP="Liste der explizit verbotenen Benutzernamen, einer pro Zeile."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN="Sofortige IP-Sperre bei fehlgeschlagener Anmeldung mit einem verbotenen Benutzernamen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_BLOCKUSERNAMES_IMMEBAN_TIP="Wenn jemand versucht, sich mit einem der in Admin Tools integrierten häufigen Benutzernamen oder einem der unten beschriebenen explizit verbotenen Benutzernamen auf Ihrer Website anzumelden, aber kein Benutzer mit diesem Benutzernamen auf Ihrer Website vorhanden ist, wird die Anfrage gesperrt. Wenn außerdem die IP-Sperre für Wiederholungstäter auf der Registerkarte „Auto-Sperre“ aktiviert ist, wird die IP-Adresse des Angreifers sofort gesperrt, selbst wenn sie die in der Option „IP nach dieser Anzahl gesperrter Anfragen sperren“ angegebene Anzahl von Angriffen noch nicht erreicht hat. Die Begründung lautet: Der Versuch, sich mit einem verbotenen oder häufigen Benutzernamen auf der Website anzumelden, ist höchstwahrscheinlich ein Credential-Stuffing-Angriff, dem so schnell wie möglich entgegengetreten werden muss."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION="Aktion bei Konfigurationsüberwachung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_BLOCK="Sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_EMAIL="E-Mail"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORACTION_TIP="Was soll geschehen, wenn die globale oder Komponentenkonfiguration aktiviert ist und eine Änderung in der Konfiguration erkannt wird. „E-Mail“ sendet lediglich eine Warn-E-Mail an die von Ihnen unten konfigurierten E-Mail-Adressen. Die Konfigurationsänderungen werden durchgeführt. „Sperren“ behandelt diese Änderungen als Grund zum Sperren der Anfrage. Die Konfigurationsänderungen werden NICHT durchgeführt und es wird keine E-Mail gesendet."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS="Komponentenkonfiguration überwachen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORCOMPONENTS_TIP="Wenn diese Option aktiviert ist und jemand versucht, die Konfiguration einer Joomla!-Kernkomponente oder einer Drittanbieterkomponente (was Sie sehen, wenn Sie in der Symbolleiste einer Komponente auf „Optionen\" klicken) im Backend Ihrer Website zu ändern, werden Sie entweder benachrichtigt oder die Person wird gesperrt (je nach Ihren Einstellungen unten)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL="Globale Konfiguration überwachen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITORGLOBAL_TIP="Wenn diese Option aktiviert ist und jemand versucht, die globale Konfiguration von Joomla! zu ändern – entweder im Backend oder im Frontend –, werden Sie entweder benachrichtigt oder die Person wird gesperrt (je nach Ihren Einstellungen unten)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL="Diese Adresse bei überwachten Konfigurationsänderungen per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR_EMAIL_TIP="Die E-Mail-Adressen, durch Kommas getrennt, an die Sie über Änderungen an der überwachten globalen und/oder Komponentenkonfiguration informiert werden möchten. Wenn dieses Feld leer gelassen wird, wird die E-Mail-Adresse verwendet, die in der Option „Diese Adresse nach einer automatischen IP-Sperrung per E-Mail benachrichtigen\" eingetragen ist. Wenn beide Felder leer sind, wird eine E-Mail an alle aktiven Super-Benutzer-Konten gesendet, bei denen die Option „System-E-Mail empfangen\" im Benutzerprofil aktiviert ist."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN="Vor Self-XSS warnen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONSOLEWARN_TIP="Zeigt eine Nachricht in der Browser-Konsole an, um den Benutzer davor zu warnen, darin Befehle auszuführen. Dies kann dazu führen, dass man sich selbst hackt (sog. Self-XSS-Angriffe) und die eigenen Kontodaten gestohlen werden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES="Kritische Dateien überwachen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL="Diese Dateien auf Änderungen überwachen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_GLOBAL_TIP="Überwachen Sie die folgenden Dateien (eine pro Eintrag) auf Änderungen. Wenn eine Änderung erkannt wird, werden Sie per E-Mail benachrichtigt. Die Dateipfade sind relativ zum Stammverzeichnis Ihrer Website."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_TIP="Kritische Dateien, die häufig von Hackern verändert werden (index.php, administrator/index.php sowie index.php, error.php und component.php aller auf der Website installierten Templates), werden bei jedem Seitenaufruf auf Änderungen überwacht. Wird eine Änderung festgestellt, werden Sie per E-Mail benachrichtigt. Dies gibt Ihnen in der Regel einen Vorwarnhinweis bei einem erfolgreichen Hacking-Versuch."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL="Diese Adresse bei Änderungen an überwachten Dateien per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CRITICALFILES_EMAIL_TIP="Die E-Mail-Adressen, durch Kommas getrennt, an die Sie über Änderungen an den überwachten kritischen und/oder benutzerdefinierten Dateien informiert werden möchten. Wenn dieses Feld leer gelassen wird, wird die E-Mail-Adresse verwendet, die in der Option „Diese Adresse nach einer automatischen IP-Sperrung per E-Mail benachrichtigen\" eingetragen ist. Wenn beide Felder leer sind, wird eine E-Mail an alle aktiven Super-Benutzer-Konten gesendet, bei denen die Option „System-E-Mail empfangen\" im Benutzerprofil aktiviert ist."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR="Generator-Meta-Tag anpassen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CUSTGENERATOR_TIP="Alle Joomla!-Installationen setzen den Meta-Generator-Tag – ein HTML-Element im Kopfbereich aller Seiten – so, dass bekannt gemacht wird, dass Ihre Website mit Joomla! betrieben wird. Diese Information wird von Suchmaschinen gecacht und von Angreifern genutzt, um zu erkennen, dass Ihre Website Joomla! verwendet, wenn sie nach potenziellen Zielen suchen. Wenn Sie diese Option aktivieren, können Sie im nächsten Feld einen benutzerdefinierten Wert für den Generator-Tag festlegen. Seien Sie kreativ!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USEROPTS="Benutzerverwaltung absichern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_CONFIGMONITOR="Überwachung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS="Benutzer bei fehlgeschlagener Anmeldung deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DEACTIVATEUSERS_TIP="Admin Tools kann optional bestehende Benutzerkonten deaktivieren, wenn mehrere fehlgeschlagene Anmeldeversuche mit deren Benutzernamen registriert werden, und schützt so Benutzerkonten vor Brute-Force-Angriffen. Hier können Sie die Anzahl der fehlgeschlagenen Anmeldungen und den Zeitraum angeben, in dem diese auftreten müssen, bevor der Benutzer deaktiviert wird, z. B. 3 fehlgeschlagene Anmeldungen innerhalb 1 Minute. Wenn die Anzahl der fehlgeschlagenen Anmeldungen auf 0 gesetzt wird, ist diese Funktion deaktiviert."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD="Direkter Dateieinbindungsschutz (DFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DFISHIELD_TIP="Wenn diese Option aktiviert ist, prüft Admin Tools die GET- und POST-Parameter jeder Anfrage an das Frontend Ihrer Website. Die Anfrage wird blockiert, wenn ein Parameter ein Null-Byte enthält oder wenn sein Wert wie ein Dateipfad aussieht, weil er mit einem Schrägstrich, mit ../ oder mit einem Laufwerksbuchstaben wie C: beginnt, und eine Datei oder einen Ordner bezeichnet, die bzw. der auf Ihrem Server existiert, unabhängig vom Typ. Ein Wert, der nur aus Schrägstrichen besteht, z. B. return=/, wird nicht blockiert."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET="Passwort-Reset für bestimmte Benutzergruppen deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_TIP="Verhindert, dass Benutzer, die einer der ausgewählten Benutzergruppen angehören, über die Funktion „Passwort vergessen?\" im Frontend der Website einen Passwort-Reset anfordern."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS="Benutzergruppen, denen das Zurücksetzen des Passworts gesperrt ist"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEPWDRESET_GROUPS_TIP="Benutzer in diesen Benutzergruppen dürfen keinen Passwort-Reset anfordern. Gruppen mit Super-Benutzer-Berechtigungen müssen nicht hinzugefügt werden; diese werden automatisch von Joomla! selbst gesperrt."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_HEAD="Sperrung vergessener Benutzer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS="Vergessene Backend-Benutzer am Anmelden hindern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION="Methode zur Anmeldeverhinderung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_BLOCK="Sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_RESET="Passwort-Reset erzwingen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_ACTION_TIP="Wählen Sie, wie Admin Tools die Anmeldeverhinderung für vergessene Benutzer durchsetzen soll. „Sperren\" sperrt den Benutzer dauerhaft; ein Super-Benutzer muss die Sperrung manuell aufheben. „Passwort-Reset erzwingen\" (empfohlen) zwingt den Benutzer beim nächsten Anmelden, sein Passwort zurückzusetzen, und lässt ihn nichts anderes auf der Website tun, bis er den Passwort-Reset abgeschlossen hat."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ="Alle [Minuten] prüfen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_FREQ_TIP="Diese Prüfung höchstens alle diese Anzahl Minuten durchführen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS="Backend-Benutzergruppen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_GROUPS_TIP="Auf welche Benutzergruppen mit Backend-Zugang soll diese Funktion angewendet werden? Wählen Sie keine Gruppen aus, um sie auf alle Benutzergruppen mit Anmeldezugang zum Backend Ihrer Website anzuwenden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS="Maximale Anzahl von Tagen seit der letzten Anmeldung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_MAXDAYS_TIP="Benutzer, die zu den oben angegebenen Benutzergruppen gehören und sich seit mindestens dieser Anzahl von Tagen nicht mehr angemeldet haben, werden an der Anmeldung gehindert."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED="Geschützte Benutzer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_PROTECTED_TIP="Diese Benutzer werden niemals gesperrt. Es wird empfohlen, nur eine <strong>sehr</strong> begrenzte Anzahl von Benutzerkonten in diese Liste aufzunehmen. In der Regel sollten dies nur die Benutzerkonten des Website-Eigentümers und des Website-Entwicklers sein, sonst niemand (insbesondere <strong>NICHT</strong> andere Mitarbeiter, die die Website verlassen haben, ohne dass ihre Benutzerkonten entfernt wurden – also genau das, wogegen dieser Schutz gedacht ist)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DISABLEOBSOLETEADMINS_TIP="Verhindert, dass Benutzer mit Backend-Zugang, die sich seit sehr langer Zeit nicht mehr angemeldet haben, sich bei der Website anmelden. Höchstwahrscheinlich handelt es sich dabei um veraltete Benutzer, die vergessen wurden zu entfernen, und deren Passwort in der Zwischenzeit kompromittiert wurde."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN="Diese Adresse bei fehlgeschlagener Administrator-Anmeldung per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINFAILEDLOGIN_TIP="Geben Sie eine E-Mail-Adresse ein, um bei einem fehlgeschlagenen Anmeldeversuch im Administrator-Backend Ihrer Website benachrichtigt zu werden. Lassen Sie das Feld leer, wenn Sie keine Benachrichtigung erhalten möchten. Stellen Sie zuerst sicher, dass Ihre Website E-Mails versenden kann!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN="Diese Adresse bei erfolgreicher Backend-Anmeldung per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILADMINLOGIN_TIP="Geben Sie eine E-Mail-Adresse ein, um bei einer erfolgreichen Anmeldung im Administrator-Backend Ihrer Website benachrichtigt zu werden. Lassen Sie das Feld leer, wenn Sie keine Benachrichtigung erhalten möchten. Stellen Sie zuerst sicher, dass Ihre Website E-Mails versenden kann!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES="Diese Adresse bei blockierten Anfragen per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILBREACHES_TIP="Geben Sie eine E-Mail-Adresse ein, um bei jeder auf Ihrer Website blockierten Anfrage benachrichtigt zu werden. Lassen Sie das Feld leer, wenn Sie keine Benachrichtigung erhalten möchten. Stellen Sie zuerst sicher, dass Ihre Website E-Mails versenden kann!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS="PHP-Ausnahmen an diese Adresse per E-Mail senden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILPHPEXCEPTIONS_TIP="Wenn eine nicht behandelte PHP-Ausnahme ausgelöst wird (d. h. ein Fehler bei einer Datenbankabfrage), sendet Admin Tools eine E-Mail mit allen Details (Zeitpunkt, Datei und Zeile, die die Ausnahme ausgelöst hat) zur späteren Fehlersuche."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE="Drosselung von E-Mails zu blockierten Anfragen aktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_EMAILTHROTTLE_TIP="Wenn aktiviert, kann die Häufigkeit der von Admin Tools gesendeten E-Mails gedrosselt werden. Die maximalen E-Mail-Häufigkeitseinstellungen finden Sie in den E-Mail-Vorlagen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION="Benutzerregistrierung nach E-Mail-Adresse filtern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_ALLOW="Zulassen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_BLOCK="Sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_FILTER_REGISTRATION_TIP="Wählen Sie, ob Admin Tools E-Mail-Domains aus der folgenden Liste nur zulassen oder sperren soll"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS="Auch verdächtige IPs sperren, nicht nur bestätigte Spammer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLBLOCKSUSPICIOUS_TIP="Manchmal ist Project Honeypot nicht sicher, ob eine IP zu einem Spammer gehört oder ob es sich um eine unbeteiligte Person handelt, die auf den falschen Link geklickt hat. In diesem Fall wird die IP als \"verdächtig\" markiert. Das Standardverhalten ist, diese IPs nicht zu sperren. Wenn Sie jedoch viel Spam erhalten, ist es sinnvoll, diese Funktion zu aktivieren und auch \"verdächtige\" IPs zu sperren. Dabei werden möglicherweise einige unschuldige Benutzer irrtümlich gesperrt – verwenden Sie diese Option daher mit Vorsicht!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE="HTTP:BL-Filterung aktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLENABLE_TIP="Aktiviert die Integration mit <a href='http://www.projecthoneypot.org'>Project Honeypot</a>. <strong>WICHTIG</strong>: Sie müssen sich bei Project Honeypot registrieren, einen Schlüssel erhalten und ihn in der nächsten Option eingeben, damit diese Funktion funktioniert."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE="Maximales Alter akzeptierter HTTP:BL-Ergebnisse (Tage)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLMAXAGE_TIP="Project Honeypot meldet, wann diese IP zuletzt beim Versenden von Spam-Nachrichten erwischt wurde. Je älter dieser Zeitpunkt ist (je höher das Alter), desto unwahrscheinlicher ist es, dass diese IP noch von einem Spammer verwendet wird. Hier können Sie das maximale gemeldete Alter festlegen, ab dem gesperrt wird. Der Standardwert von 30 bedeutet, dass IPs gesperrt werden, die in den letzten 30 Tagen eine Spam-Nachricht übermittelt haben."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD="Mindest-Bedrohungsbewertung zum Sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_HTTPBLTHRESHOLD_TIP="Project Honeypot verwendet eine logarithmische „Bedrohungsbewertung\", um die Wahrscheinlichkeit einzuschätzen, dass eine bestimmte IP ein Spammer ist. Diese Option legt die Mindestbedrohungsstufe fest, die eine IP aufweisen muss, bevor sie gesperrt wird. Ein Wert von 25 bedeutet, dass diese IP 100 Spam-Nachrichten in den Spam-Fallen von Project Honeypot eingereicht hat, was in der Regel ein sicherer Hinweis darauf ist, dass sie einem Spammer gehört. Beachten Sie, dass die Bewertung logarithmisch ist. Ein Wert von 50 entspricht 1.000 Spam-Nachrichten und ein Wert von 75 einer Million Spam-Nachrichten. Setzen Sie den Wert nicht über 50, da Sie sonst höchstwahrscheinlich keinen einzigen Spammer mehr sperren werden. Der Standardwert ist 25 (100 Spam-Nachrichten von dieser IP-Adresse erkannt)."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL="Seitenzugang für IPs auf der IP-Ausschlussliste verweigern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPBL_TIP="Wenn aktiviert und die IP des Besuchers in der IP-Ausschlussliste steht (siehe Funktion „IP-Ausschlussliste\"), erhält er sofort einen 403-Fehler „Zugriff verweigert\", wenn er versucht, auf Ihre Website zuzugreifen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL="Administrator-Zugang nur für IPs auf der exklusiven Zulassungsliste erlauben"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_IPWL_TIP="Wenn aktiviert, dürfen nur IPs auf der exklusiven Zulassungsliste (siehe Funktion „Administrator-Exklusiv-IP-Zulassungsliste\") auf den Administrator-Bereich der Website zugreifen. Alle anderen Versuche, auf die Administrator-Seiten zuzugreifen, werden zur Startseite der Website weitergeleitet. Seien Sie vorsichtig bei der Verwendung dieser Funktion! Wenn Sie Ihre eigene IP nicht zur exklusiven Zulassungsliste hinzugefügt haben, werden Sie aus Ihrem Administrator-Bereich ausgesperrt!"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD="ItemidShield"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_TIP="Wenn aktiviert, sperrt Admin Tools jeden ungültigen Wert für den ItemId-URL-Parameter oder versucht, ihn in einen gültigen ganzzahligen Wert zu bereinigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_OFF="Aus"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_BLOCK="Sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ITEMIDSHIELD_CLEAN="Bereinigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS="Verdächtige Kernparameter sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUSPICIOUS_PARAMS_TIP="Sperrt Anfragen mit verdächtigen Werten in Joomla!-Kernparametern der Abfragezeichenfolge, wie z. B. <code>option</code>, <code>view</code>, <code>task</code> usw."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD="Vor der Verwendung bekannter Passwörter warnen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS="Benutzergruppen, die auf bekannte Passwörter geprüft werden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_GROUPS_TIP="Admin Tools prüft nur Benutzer, die diesen Gruppen angehören, auf bekannte Passwörter (standardmäßig Super-Benutzer)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LEAKEDPWD_TIP="Wenn diese Option aktiviert ist, stellt Admin Tools eine Verbindung zur Have I Been Pwned-Datenbank her und prüft, ob der Hash des aktuellen Passworts bekannt ist. Wird eine Übereinstimmung gefunden, wird der Benutzer daran gehindert, ein unsicheres Passwort zu verwenden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES="Blockierte Anfragen protokollieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGBREACHES_TIP="Es wird empfohlen, diese Option aktiviert zu lassen. Wenn aktiviert, werden alle potenziellen Sicherheitsverletzungen – die von Admin Tools blockiert wurden – in der Datenbank protokolliert und im Werkzeug „Protokoll blockierter Anfragen\" angezeigt."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE="Eine Debug-Protokolldatei führen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGFILE_TIP="Admin Tools kann optional eine Protokolldatei im konfigurierten Joomla!-Protokollordner führen. Wenn diese Option aktiviert ist, wird bei jeder gesperrten Anfrage ein Eintrag in der Protokolldatei erstellt. Dieser Eintrag enthält zusätzliche Informationen zur Fehlersuche, einschließlich eines vollständigen Dumps der Anfragedaten. Das bedeutet, dass Sie möglicherweise personenbezogene oder sensible Daten in einer unverschlüsselten Datei speichern. Es wird empfohlen, diese Option nur dann zu aktivieren, wenn Sie ein schwer zu findendes Problem beheben möchten, und sie wieder zu deaktivieren, sobald Sie genügend Informationen zur Lösung des Problems gesammelt haben."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES="Benutzernamen protokollieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_LOGUSERNAMES_TIP="Wenn aktiviert, nimmt Admin Tools den Benutzernamen bei der Nachverfolgung fehlgeschlagener Anmeldungen auf (siehe oben). WARNUNG! Wir empfehlen dringend, diese Option deaktiviert zu lassen, um Probleme mit der DSGVO zu vermeiden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD="Sperrung bösartiger User-Agents (MUAShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_MUASHIELD_TIP="Viele Hacker versuchen, auf Ihre Website über einen Browser zuzugreifen, der so konfiguriert ist, dass er bösartigen PHP-Code in seinem User-Agent-String sendet (ein kurzer Text, der den Browser gegenüber Ihrem Server beschreibt). Die Idee dahinter ist, dass fehlerhafte Protokollverarbeitungssoftware diesen Text analysiert und dem Hacker so die Kontrolle über Ihre Website ermöglicht. Wenn aktiviert, erkennt Admin Tools solche Angriffe und sperrt die Anfrage."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN="Frontend-Anmeldung für Super-Administratoren verbieten"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NOFESALOGIN_TIP="Wenn aktiviert, ist es Super-Administratoren nicht möglich, sich im Frontend Ihrer Website anzumelden. Dies ist eine Sicherheitsmaßnahme gegen Passwort-Brute-Force-Angriffe. Auch Benutzer mit Super-Benutzer-Berechtigungen können sich nicht im Frontend Ihrer Website anmelden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS="Bearbeitung von Benutzereigenschaften deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_TIP="Wenn aktiviert, schlägt der Versuch fehl, die Einstellungen eines bestehenden Managers, Administrators oder Super-Administrators zu ändern oder einen neuen anzulegen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS="Bearbeitung von Benutzereigenschaften für diese Benutzergruppen deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWADMINS_GROUPS_TIP="Für welche Benutzergruppen mit Backend-Zugang gilt diese Funktion? Wenn Sie keine Gruppen auswählen, deaktiviert Admin Tools die Bearbeitung von Benutzereigenschaften für alle Benutzer, die Anmeldezugang zum Backend Ihrer Website haben."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS="Erstellen / Bearbeiten von Benutzern aus dem Frontend deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_TIP="Normalerweise sollte es nicht möglich sein, über das öffentliche Frontend einen neuen Benutzer mit administrativen Backend-Anmelderechten zu erstellen. Wenn diese Option aktiviert ist, werden Versuche, solche Konten zu erstellen, als Hacking-Versuche gewertet und deren Ausführung blockiert. Diese Option behebt einige der bekanntesten Zero-Day-Angriffe auf Joomla!, die zwischen 2015 und 2016 stattfanden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS="Erstellen / Bearbeiten von Benutzern in diesen Gruppen aus dem Frontend deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_NONEWFRONTENDADMINS_GROUPS_TIP="Für welche Benutzergruppen mit Backend-Zugriff gilt diese Funktion? Wenn keine Gruppen ausgewählt werden, deaktiviert Admin Tools das Erstellen oder Bearbeiten von Benutzern aus dem Backend für alle Benutzer, die Anmeldezugriff auf das Backend der Website haben oder erhalten würden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD="PHP-Stream-Wrapper-Blockierung (PHPShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_PHPSHIELD_TIP="Manche Hacker versuchen, sogenannte PHP-Stream-Wrapper (sie sehen aus wie URLs, die mit php://, phar:// usw. beginnen) zu verwenden, um heimlich Dateien Ihrer Website zu manipulieren und dabei die regulären Datei-Upload-Kontrollen von Joomla! zu umgehen. Wenn diese Option aktiviert ist, blockiert Admin Tools jede Anfrage, die Text enthält, der einem der von Hackern häufig verwendeten PHP-Stream-Wrapper entspricht."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL="Für diese Gründe keine E-Mail-Benachrichtigungen senden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOEMAIL_TIP="Anfragen, die aus diesen Gründen blockiert werden, führen nicht zum Versand einer E-Mail an die in <em>Diese Adresse bei blockierter Anfrage per E-Mail benachrichtigen</em> angegebene Adresse."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG="Diese Gründe nicht protokollieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_REASONS_NOLOG_TIP="Anfragen, die aus diesen Gründen blockiert werden, werden nicht protokolliert. Infolgedessen werden IP-Adressen, die wiederholt blockierte Anfragen aus diesem Grund auslösen, nicht automatisch von Ihrer Website gesperrt. Da kein Protokoll vorhanden ist, ist es außerdem unmöglich festzustellen, warum jemand beim Zugriff auf Ihre Website blockiert wird, wenn er einen dieser Gründe auslöst."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA="Joomla!-Zwei-Faktor-Authentifizierung beim Zurücksetzen des Passworts deaktivieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RESETJOOMLATFA_TIP="Wenn aktiviert, deaktiviert Admin Tools die Joomla!-Zwei-Faktor-Authentifizierungskonfiguration für einen Benutzer, wenn dieser sein Passwort zurücksetzt. Dies gilt nur für die integrierte Zwei-Faktor-Authentifizierungsfunktion von Joomla! 3.2 und höher, nicht für die Zwei-Faktor-Authentifizierungsfunktion von Admin Tools."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD="Remote File Inclusion-Blockierung (RFIShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_RFISHIELD_TIP="Manche Hacker versuchen, eine anfällige Erweiterung dazu zu bringen, PHP-Code direkt von ihrem Server zu laden. Dies geschieht, indem sie eine http(s):// oder ftp://-URL in ihrer Anfrage übergeben, die auf ihre bösartige Website verweist. Wenn diese Option aktiviert ist, sucht Admin Tools nach solchen Fällen, versucht die Remote-URL abzurufen und scannt deren Inhalt. Wenn PHP-Code gefunden wird, wird die Anfrage blockiert."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP="Registrierungs-IP-Adresse des Benutzers in Benutzernotizen speichern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_TIP="Wenn aktiviert, wird die IP-Adresse, von der aus sich neue Benutzer registriert haben, als Benutzernotiz gespeichert. Benutzer, die über das Backend erstellt wurden, haben ihre IP-Adresse nicht als Benutzernotiz gespeichert, da dies keinen Sinn ergibt (ein Administrator registriert das Benutzerkonto in deren Namen). Drittanbieter-Komponenten, die neue Benutzerkonten erstellen, lösen möglicherweise auch nicht das Plugin-Ereignis aus."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY="Benutzernotizen-Kategorie"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SAVEUSERSIGNUPIP_CATEGORY_TIP="Wählen Sie die Benutzernotizen-Kategorien aus, in denen Admin Tools die Benutzer-IP speichern soll. Standard ist „Nicht kategorisiert\"."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT="Gegen Plugin-Deaktivierung schützen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SELFPROTECT_TIP="Wenn aktiviert, verhindert Admin Tools, dass Backend-Benutzer versuchen, das Plugin zu deaktivieren (zu depublizieren). Das bedeutet, dass Sie das Plugin ebenfalls nicht depublizieren können, bis Sie diese Option deaktivieren! Beachten Sie außerdem, dass dies keine Wirkung gegen jemanden hat, der Ihre Datenbank direkt bearbeitet, oder der die Dateien des Admin Tools-System-Plugins umbenennt oder löscht (das Verzeichnis <code>plugins/system/admintools</code> auf Ihrer Website). Es schützt auch nicht gegen die Deinstallation von Admin Tools, da standardmäßig nur Super-Benutzer dies tun können. Wenn ein Angreifer Super-Benutzer-Rechte erlangt, ist die Deaktivierung von Admin Tools Ihr geringstes Problem."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD="Schutz vor PHP-Sitzungsdatenvergiftung (SessionShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SESSIONSHIELD_TIP="Verhindert bösartige Eingabedaten, die verwendet werden könnten, um den internen PHP-Sitzungshandler dazu zu bringen, beim Wiederherstellen der Benutzersitzung beliebigen Code auszuführen. VORSICHT: Es <em>können</em> auch einige legitime Anfragen blockiert werden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD="SQLiShield-Schutz gegen SQL-Injection-Angriffe"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SQLISHIELD_TIP="Wenn aktiviert, versucht Admin Tools, gängige SQL-Injection-Angriffe auf Ihre Website zu erkennen und zu blockieren."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST="Super-Benutzer-Konten überwachen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_TIP="Admin Tools verfolgt die Benutzerkonten mit Super-Benutzer-Zugriff. Wenn ein neuer Super-Benutzer außerhalb der Joomla!-Benutzerverwaltungsseite hinzugefügt wird, werden Sie per E-Mail benachrichtigt. Darüber hinaus werden neu erkannte Super-Benutzer-Konten automatisch gesperrt. Benutzer, die von anderen Super-Benutzern im Backend der Website über die Joomla!-Benutzerverwaltungsseite erstellt oder hinzugefügt wurden, werden von dieser Funktion NICHT gesperrt. Bitte verwenden Sie die Funktion &ldquo;Bearbeitung der Backend-Benutzereigenschaften deaktivieren&rdquo;, um dies zu verhindern."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL="Diese Adresse bei Änderung der Super-Benutzer per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_SUPERUSERSLIST_EMAIL_TIP="Die durch Komma getrennten E-Mail-Adressen, die über versuchte (und blockierte!) Änderungen in der Liste der Super-Benutzer Ihrer Website informiert werden sollen. Wenn dieses Feld leer bleibt, wird die in der Option „Diese Adresse nach einer automatischen IP-Sperre per E-Mail benachrichtigen\" eingerichtete E-Mail-Adresse verwendet. Wenn beide Felder leer sind, wird eine E-Mail an alle aktivierten Super-Benutzer-Konten gesendet, bei denen die Option „System-E-Mails empfangen\" in ihrem Benutzerprofil aktiviert ist."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE="template=foo-Website-Template-Wechsel blockieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TEMPLATE_TIP="Eine weitere versteckte Joomla!-Funktion ist die Möglichkeit, zwischen installierten Templates zu wechseln, indem ein spezieller URL-Parameter übergeben wird. Wenn Sie beispielsweise das Beez5-Template anwenden möchten, übergeben Sie einfach den Parameter <code>?template=beez5</code>."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL="tmpl=foo-System-Template-Wechsel blockieren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST="Liste der erlaubten tmpl=-Schlüsselwörter"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPLWHITELIST_TIP="Ein tmpl-Schlüsselwort pro Eintrag. Die Einträge „component\" und „system\" werden immer hinzugefügt, unabhängig davon, ob Sie sie hier explizit angeben."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TMPL_TIP="Eine der weniger bekannten Joomla!-Funktionen sind die System-Templates. Immer wenn ein Fehler auftritt oder Sie Ihre Website offline schalten, lädt Joomla! das entsprechende System-Template. Durch Übergabe des Template-Namens in der URL durch Anhängen von z. B. ?tmpl=offline können Sie diese Templates testen, ohne tatsächlich einen Fehler erzeugen oder Ihre Website offline schalten zu müssen. Wenn Sie diese Option aktivieren, wird diese versteckte Joomla!-Funktion deaktiviert. Beachten Sie, dass tmpl=system und tmpl=component erlaubt sein müssen (siehe nächste Option), da sie von einigen Erweiterungen benötigt werden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS="Fehlgeschlagene Anmeldeversuche als Grund für die Blockierung der Anfrage behandeln"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TRACKFAILEDLOGINS_TIP="Wenn aktiviert, zählen fehlgeschlagene Anmeldeversuche jeglicher Art von Benutzer (auch einfache registrierte Benutzer) als gültiger Grund, die Anfrage zu blockieren, und werden im Protokoll blockierter Anfragen von Admin Tools protokolliert. Dies hat eine sehr nützliche Auswirkung: Da sie als Gründe für die Blockierung einer Anfrage zählen, werden sie auch auf das in der automatischen IP-Sperrung festgelegte Limit angerechnet. Nach einer bestimmten Anzahl fehlgeschlagener Anmeldeversuche wird die IP-Adresse des Benutzers daher für die von Ihnen festgelegte Dauer automatisch gesperrt."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL="Fehlerbehebungs-E-Mail bei administrativen Funktionen senden"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_TROUBLESHOOTEREMAIL_TIP="Sendet eine E-Mail an den aktuell angemeldeten Backend-Benutzer, wenn dieser eine administrative Admin Tools-Funktion ausführt, die dazu führen könnte, dass er aus der Website ausgesperrt wird oder die Website nicht mehr ordnungsgemäß funktioniert. Die E-Mail enthält Links zu Fehlerbehebungsartikeln, die ihm helfen, das Problem zu beheben und die Website wieder in einen funktionierenden Zustand zu versetzen. Es wird dringend empfohlen, diese Funktion aktiviert zu lassen. Das Befolgen der Fehlerbehebungsinformationen ist viel schneller als das Warten auf eine Antwort unseres Supports."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD="Scanner für hochgeladene Dateien (UploadShield)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_TIP="Untersucht jede auf Ihre Website hochgeladene Datei und blockiert die Anfrage, wenn die Datei so aussieht, als könnte sie zur Ausführung von Code auf Ihrem Server verwendet werden. Das schützt Sie vor verwundbaren Drittanbieter-Erweiterungen, die es Angreifern erlauben, beliebige Dateien hochzuladen. Uploads von angemeldeten Super-Benutzern werden nie untersucht."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS="UploadShield: .htaccess-Überschreibung verhindern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_HTACCESS_TIP="Blockiert die Anfrage, wenn eine Datei namens .htaccess hochgeladen wird und ihr Inhalt eine Apache-Direktive SetHandler oder AddHandler enthält. Angreifer nutzen diese Direktiven, um Apache dazu zu bringen, ansonsten harmlose Dateien wie Bilder als PHP-Code auszuführen."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT="UploadShield: Uploads mit mehreren Dateiendungen verhindern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_MULTIEXT_TIP="Blockiert die Anfrage, wenn irgendein Teil des Namens der hochgeladenen Datei wie eine PHP-Dateiendung aussieht, z. B. evil.php.jpg oder evil.jpg.php5. Manche fehlerhaften Server-Konfigurationen führen solche Dateien unabhängig von ihrem scheinbaren Dateityp als PHP-Code aus."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT="UploadShield: Uploads von PHP-Dateien verhindern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPEXT_TIP="Blockiert die Anfrage, wenn die Endung der hochgeladenen Datei eine PHP-Dateiendung ist, etwa .php, .phps, .phtml, .inc, .php7 und so weiter."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT="UploadShield: PHP-Inhalte in Uploads verhindern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_UPLOADSHIELD_PHPCONTENT_TIP="Blockiert die Anfrage, wenn eine hochgeladene Datei etwas enthält, das wie PHP-Code aussieht, unabhängig davon, wie die Datei heißt. Damit werden Angriffe erkannt, die PHP-Code in einer ansonsten gültigen Bild- oder Dokumentdatei verstecken."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW="Fehler mithilfe einer anpassbaren HTML-Vorlage anzeigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_USE403VIEW_TIP="Standardmäßig wird die Meldung über blockierte Anfragen über die Standardfehlerseite von Joomla! angezeigt. Wenn diese Option aktiviert ist, verwendet Admin Tools jedoch eine anpassbare HTML-Vorlage. Die Standard-HTML-Vorlagendatei befindet sich in der Datei components/com_admintools/View/Blocks/tmpl/default.php. ÄNDERN SIE DIESE DATEI NICHT DIREKT! Lesen Sie die Dokumentation für die korrekte Methode zur Erstellung einer Template-Überschreibung."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS="Niemals blockierte Domains"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_WHITELIST_DOMAINS_TIP="Wenn die IP-Adresse eines Besuchers, dessen Anfrage blockiert wird, zu einem Domain-Namen aufgelöst wird, der auf das hier Eingegebene endet, wird die Anfrage trotzdem blockiert, aber sie wird nicht protokolliert, es wird keine E-Mail dazu versendet, und die IP-Adresse wird nie automatisch gesperrt. Der Domain-Name muss außerdem wieder zur IP-Adresse des Besuchers aufgelöst werden, sodass ein gefälschter Reverse-DNS-Eintrag nicht zählt. Bitte beachten Sie, dass eine lange Liste zu einer erheblichen Leistungsbeeinträchtigung führen kann. Die Liste ist standardmäßig leer. Für Suchmaschinen und KI-Crawler verwenden Sie stattdessen den Tab „Crawler“."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN="Hartnäckige Verstöße zur IP-Ausschlussliste hinzufügen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM="IP nach dieser Anzahl automatischer Sperrungen dauerhaft ausschließen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_2="automatische IP-Sperrungen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABANNUM_TIP="Wenn die vorherige Option aktiviert ist, nach wie vielen Auto-Sperrungen eine IP dauerhaft gesperrt (zur IP-Ausschlussliste hinzugefügt) wird."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PERMABAN_TIP="Wenn eine IP so viele Auto-Sperrungen auslöst, wird sie dauerhaft gesperrt (zur IP-Ausschlussliste hinzugefügt), wenn sie erneut automatisch gesperrt werden soll. Stellen Sie sicher, dass Sie die IP-Ausschlusslisten-Funktion aktivieren, indem Sie <em>Website-Zugriff für IPs in der IP-Ausschlussliste verweigern</em> auf „Ja\" setzen, andernfalls hat das dauerhafte Hinzufügen zur IP-Ausschlussliste keine Wirkung."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_PROJECTHONEYPOT="Project Honeypot"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_BODY="<p>Der Benutzer hat sich über die IP-Adresse <strong>%s</strong> auf der Website registriert.</p><p>Der User-Agent-String des Browsers des Benutzers war:<br/>%s</p><p>Diese Informationen wurden automatisch von Admin Tools Professional in dieser Benutzernotiz aufgezeichnet.</p>"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SIGNUPIP_SUBJECT="Registrierungs-IP-Adresse"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE="Diese Meldung gesperrten IP-Adressen anzeigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_SPAMMERMESSAGE_TIP="Ermöglicht Ihnen, eine spezifische Meldung an gesperrte IP-Adressen anzuzeigen. Sie können dem Benutzer erklären, dass seine IP gesperrt wurde, weil von seiner IP-Adresse verdächtige Aktivitäten festgestellt wurden. Sie können den speziellen Text [IP] in Großbuchstaben, ohne Leerzeichen zwischen den Klammern und IP, verwenden, um die IP-Adresse des Benutzers in der Meldung anzuzeigen. Dies kann nützlich sein, wenn jemand versehentlich gesperrt wird und Sie um Hilfe bittet."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSR="Automatische Sperrung"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM="Sperrdauer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANNUM_TIP="Wie lange die Sperrung andauern soll. Wenn Sie beispielsweise 1 Tag einstellen, wird der gesamte Zugriff von dieser IP-Adresse für einen ganzen Tag blockiert. Geben Sie die Zahl in dieses Feld ein und wählen Sie die Zeiteinheit im nächsten Feld."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY="Zeiteinheit für die Sperrdauer"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRBANFREQUENCY_TIP="Die Zeiteinheit für die oben genannte Einstellung „Sperrdauer\". Wählen Sie eine aus: Sekunden, Minuten, Tage oder Stunden."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE="IP-Sperrung von Wiederholungstätern"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRENABLE_TIP="Wenn auf „Ja\" gesetzt, wird die IP-Adresse von Wiederholungstätern basierend auf den restlichen Einstellungen automatisch gesperrt."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES="IP nach dieser Anzahl blockierter Anfragen sperren"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRSTRIKES_TIP="Wenn Anfragen von einer IP-Adresse mindestens so oft innerhalb des durch die nächsten beiden Optionen definierten Zeitraums blockiert werden, wird sie vorübergehend vom Zugriff auf die Website ausgeschlossen. Wenn Sie beispielsweise 3 Angriffe in 1 Stunde einstellen, verweigert Admin Tools den Zugriff von einer IP-Adresse, von der mindestens 3 Anfragen in der letzten Stunde blockiert wurden. Geben Sie den Wert 0 ein, um diese Funktion zu deaktivieren."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ="Zeitraum"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRNUMFREQ_TIP="Die oben definierte Anzahl blockierter Anfragen muss innerhalb dieser Anzahl von Sekunden, Minuten, Stunden oder Tagen auftreten. Sie geben die Zahl hier ein; die Zeiteinheit wählen Sie in der Option unten."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY="Zeiteinheit"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_TSRFREQUENCY_TIP="Die Zeiteinheit für die oben genannte Einstellung „Zeitraum\". Wählen Sie eine aus: Sekunden, Minuten, Tage oder Stunden."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN="Passwort-Authentifizierung wenn Passkey-Anmeldung für ein Benutzerkonto aktiviert ist"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_TIP="Wenn ein Benutzer die Passkey-Authentifizierung für sein Benutzerkonto aktiviert, soll er sich alternativ auch mit einem Passwort anmelden dürfen?"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_ALLOWED="Immer erlaubt (Joomla!-Standard)"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_USERDECIDES="Benutzer entscheiden lassen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERALLOWED="Für Backend-Benutzer deaktiviert, für andere erlaubt"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBACKEND_OTHERDECIDE="Für Backend-Benutzer deaktiviert, andere entscheiden lassen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_NOPWONWEBAUTHN_OPT_NOBODY="Für alle deaktiviert"

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS="Erlaubte Domains"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_ALLOWED_DOMAINS_TIP="Geben Sie alle vollqualifizierten Domain-Namen ein, auf die Ihre Website antworten soll, z. B. <em>example.com, www.example.com, example.net</em>. Ein Eintrag pro Textfeld; weitere Felder hinzufügen durch Klicken/Tippen auf die grüne +-Schaltfläche. Sie müssen <code>localhost</code> oder andere Domain-Namen, die zu <code>127.0.0.1</code> oder <code>::1</code> (Localhost-Adressen) aufgelöst werden, nicht hinzufügen. Wenn jemand versucht, den HTTP-Host-Header auf einen Domain-Namen zu fälschen, der nicht in dieser Liste steht, erhält er eine HTTP-421-Antwort (Misdirected Request). Diese Funktion verhindert Host-Header-Spoofing auf einigen falsch konfigurierten Hosts."

COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL="Diese Adresse bei erhöhter Anzahl blockierter Anfragen per E-Mail benachrichtigen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_OPT_DELUGEEMAIL_TIP="An diese Adresse wird eine E-Mail gesendet, wenn Admin Tools feststellt, dass eine große Anzahl von Anfragen in einem bestimmten Zeitraum blockiert wurde. Sie können dies unten konfigurieren; der Standard sind 1000 blockierte Anfragen in einer Stunde."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM="Anzahl blockierter Anfragen"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUM_TIP="Mindestens so viele blockierte Anfragen müssen im unten definierten Zeitraum erkannt werden, damit eine E-Mail gesendet wird."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ="Zeitraum"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGENUMFREQ_TIP="Die oben definierten blockierten Anfragen müssen innerhalb dieser Anzahl von Sekunden, Minuten, Stunden oder Tagen auftreten. Sie geben die Zahl hier ein; die Zeiteinheit wählen Sie in der Option unten."
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGEFREQUENCY="Zeiteinheit"
COM_ADMINTOOLS_CONFIGUREWAF_LBL_DELUGEFREQUENCY_TIP="Die Zeiteinheit für die oben genannte Einstellung „Zeitraum\". Wählen Sie eine aus: Sekunden, Minuten, Tage oder Stunden."

[Wafexceptions]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; WAF Exceptions
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_WAFEXCEPTIONS="WAF-Ausnahmen"
COM_ADMINTOOLS_TITLE_WAFEXCEPTION_ADD="Eine WAF-Ausnahme hinzufügen"
COM_ADMINTOOLS_TITLE_WAFEXCEPTION_EDIT="Eine WAF-Ausnahme bearbeiten"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_INTRO = "Auf dieser Seite können Sie bestimmte Komponenten, Ansichten oder Abfragezeichenfolgen auswählen, <i>die NICHT</i> von der Web Application Firewall geschützt werden sollen. Ausnahmen werden in zwei Gruppen angewendet:"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_A = "Wenn <i>alle Abfragezeichenfolgen</i> für eine Komponente oder Ansicht angegeben werden, sind die folgenden WAF-Funktionen vollständig deaktiviert: Bad Behaviour, SQLiShield, XSSShield, MUAShield, RFIShield, DFIShield und Bad Words Filtering"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_WHATSTHIS_GROUP_B = "Wenn <i>bestimmte Abfragezeichenfolgen</i> für eine Komponente oder Ansicht angegeben werden, sind die folgenden WAF-Funktionen <i>nur für diese Abfragezeichenfolgen</i> deaktiviert: SQLiShield, XSSShield, RFIShield, DFIShield, Bad Words Filtering und Block Suspicious URL Parameters"

COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_TITLE="Es wurden noch keine WAF-Ausnahmeregeln erstellt."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_CONTENT="WAF-Ausnahmeregeln ermöglichen es Ihnen, das Blockieren von Anfragen an Ihre Website für bestimmte Komponenten, Ansichten und Abfragezeichenfolgen-Parameter zu verhindern. Dies kann verwendet werden, wenn Sie wissen, dass eine Komponente sicher ist, die Art und Weise, wie sie funktioniert, jedoch immer zu Fehlalarmen führt."
COM_ADMINTOOLS_WAFEXCEPTION_EMPTYSTATE_BUTTON_ADD="Eine WAF-Ausnahmeregel hinzufügen"

COM_ADMINTOOLS_WAFEXCEPTION_TABLE_CAPTION="Tabelle der Web Application Firewall-Ausnahmeregeln."

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_ERR_ALLEMPTY="Sie müssen mindestens eine Komponente, Ansicht oder Abfrage angeben, damit die WAF-Ausnahmeregel gültig ist."

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION="Komponente"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_ALL="(Alle)"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_DESC="Der Name der Joomla!-Komponente, auf die diese Regel zutrifft. Wenn Sie das Feld leer lassen (\"– Komponente –\"), werden alle Komponenten erfasst."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_OPTION_SELECT="– Komponente –"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW="Ansichtsname"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_DESC="Der Ansichtsname (Komponentenbereich) oder Controller-Name der Komponente, der in der URL vorhanden sein muss, damit diese Regel zutrifft. Deaktivieren Sie SEF-URLs und Sie werden entweder <code>view=ViewName</code> oder <code>task=ViewName.TaskName</code> sehen, wobei <var>ViewName</var> der Ansichtsname ist, den Sie hier eingeben müssen. Ein leeres Feld trifft auf alle Ansichten zu. Wenn Sie einen SEF-URL-Pfad abgleichen möchten, lassen Sie die Komponente auf \"(Alle)\" gesetzt und geben Sie den SEF-Pfad <strong>MIT</strong> einem führenden Schrägstrich, aber <strong>OHNE</strong> <code>index.php</code> ein. Verwenden Sie zum Beispiel <code>/foo/bar</code>. Auf mehrsprachigen Websites dürfen Sie das Sprachpräfix NICHT angeben, z. B. ist <s><code>/en/example</code></s> falsch, während <code>/example</code> korrekt ist. Bitte beachten Sie, dass dies ein <em>teilweiser</em> Pfad sein kann, d. h. <code>/foo/bar</code> trifft sowohl auf <code>/foo/bar/test</code> als auch auf <code>/foo/bar.html</code> zu."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_VIEW_ANY="(Alle)"

COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY="Abfrageparameter"
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_DESC="Welcher Abfragezeichenfolgen-Parameter von der Sicherheitsfilterung ausgeschlossen werden soll, z. B. <code>id</code>. Leer lassen, um alle Abfrageparameter abzugleichen. Beachten Sie, dass WAF-Ausnahmen angewendet werden, nachdem Joomla! eine SEF-URL in ihr Nicht-SEF-Format konvertiert hat, unabhängig davon, ob SEF-URLs auf Ihrer Website aktiviert sind."
COM_ADMINTOOLS_WAFEXCEPTIONS_LBL_QUERY_TYPE_ANY="(Alle)"

COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_COPIED="%d WAF-Ausnahmeregeln wurden kopiert."
COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_COPIED_1="Die WAF-Ausnahmeregel wurde kopiert."
COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_DELETED="%d WAF-Ausnahmeregeln wurden gelöscht."
COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_DELETED_1="Die WAF-Ausnahmeregel wurde gelöscht."
COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_PUBLISHED="%d WAF-Ausnahmeregeln wurden veröffentlicht"
COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_PUBLISHED_1="Die WAF-Ausnahmeregel wurde veröffentlicht"
COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_UNPUBLISHED="%d WAF-Ausnahmeregeln wurden nicht veröffentlicht"
COM_ADMINTOOLS_WAFEXCEPTIONS_N_ITEMS_UNPUBLISHED_1="Die WAF-Ausnahmeregel wurde nicht veröffentlicht"

[Checktempandlogdirectories]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Check Temp and Log Directories
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_CHECKTEMPANDLOGDIRECTORIES="Temp- und Log-Verzeichnisse prüfen"

COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_CHMOD_TMPFOLDER="Die Berechtigungen des temporären Ordners können nicht geändert werden. Bitte aktivieren Sie die FTP-Schicht in der globalen Joomla!-Konfiguration und versuchen Sie es erneut. Falls Sie dies bereits getan haben, wenden Sie sich bitte an Ihren Hoster und bitten Sie ihn, die Berechtigungen auf Ihrer Website zu korrigieren."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_TMPDIR_CREATION="Es kann kein temporärer Ordner erstellt werden. Bitte aktivieren Sie die FTP-Schicht in der globalen Joomla!-Konfiguration und versuchen Sie es erneut. Falls Sie dies bereits getan haben, wenden Sie sich bitte an Ihren Hoster und bitten Sie ihn, die Berechtigungen auf Ihrer Website zu korrigieren."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_CHMOD_LOGFOLDER="Die Berechtigungen des Protokollordners können nicht geändert werden. Bitte aktivieren Sie die FTP-Schicht in der globalen Joomla!-Konfiguration und versuchen Sie es erneut. Falls Sie dies bereits getan haben, wenden Sie sich bitte an Ihren Hoster und bitten Sie ihn, die Berechtigungen auf Ihrer Website zu korrigieren."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_LOGDIR_CREATION="Es kann kein Protokollordner erstellt werden. Bitte aktivieren Sie die FTP-Schicht in der globalen Joomla!-Konfiguration und versuchen Sie es erneut. Falls Sie dies bereits getan haben, wenden Sie sich bitte an Ihren Hoster und bitten Sie ihn, die Berechtigungen auf Ihrer Website zu korrigieren."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_ERR_SAVING_JCONFIG="Admin Tools konnte Ihre globale Joomla!-Konfiguration nicht aktualisieren. Bitte aktivieren Sie die FTP-Schicht in der globalen Joomla!-Konfiguration und versuchen Sie es erneut."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_LBL_TMPDIR_WORKAROUND="Um den temporären Ordner für Joomla! beschreibbar zu machen, hat Admin Tools dessen Berechtigungen auf 777 gesetzt und ihn durch das Erstellen einer .htaccess-Datei vor dem Web-Zugriff geschützt. <strong>Dies ist nur eine vorübergehende Lösung</strong>. Sie sollten sich an Ihren Hoster wenden und ihn bitten, die Berechtigungen auf Ihrer Website zu korrigieren. Denken Sie danach daran, die Berechtigungen des Ordners %s wieder auf 0755 zu setzen."
COM_ADMINTOOLS_CHECKTEMPANDLOGDIRECTORIES_LBL_LOGDIR_WORKAROUND="Um den Protokollordner für Joomla! beschreibbar zu machen, hat Admin Tools dessen Berechtigungen auf 777 gesetzt und ihn durch das Erstellen einer .htaccess-Datei vor dem Web-Zugriff geschützt. <strong>Dies ist nur eine vorübergehende Lösung</strong>. Sie sollten sich an Ihren Hoster wenden und ihn bitten, die Berechtigungen auf Ihrer Website zu korrigieren. Denken Sie danach daran, die Berechtigungen des Ordners %s wieder auf 0755 zu setzen."

