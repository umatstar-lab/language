COM_ADMINTOOLS_CLI_TEMP_CLEAR_HELP="<info>%command.name%</info> leert den Inhalt des temporären Verzeichnisses der Website.\nindex.htm[l], .htaccess und web.config werden NICHT entfernt.\nVerwendung: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_TEMP_CLEAR_OPT_AGE="Mindestalter. Dateien/Ordner, die jünger als diese Anzahl von Sekunden sind, werden nicht entfernt."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_DESC="Veraltete Joomla!-Kerndateien und -ordner entfernen"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_HELP="<info>%command.name%</info> entfernt die Joomla!-Dateien und -Ordner, die ein Joomla-Update hätte löschen sollen, aber nicht gelöscht hat.\nZurückgebliebene Kerndateien können Ihre Website komplett lahmlegen, meist durch einen fatalen Fehler wegen eines Klassen-Alias.\nMit <info>--dry-run</info> sehen Sie, was entfernt würde, ohne dass etwas verändert wird.\nVerwendung: <info>php %command.full_name%</info>"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_OPT_DRYRUN="Die gefundenen veralteten Dateien und Ordner auflisten und anzeigen, ob PHP darauf schreiben kann, ohne etwas zu löschen."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTHINGTODO="Auf dieser Website gibt es keine veralteten Joomla!-Kerndateien oder -ordner."
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_DELETED="gelöscht"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_FAILED="FEHLGESCHLAGEN"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_WRITEABLE="beschreibbar"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_LBL_NOTWRITEABLE="NICHT beschreibbar"
COM_ADMINTOOLS_CLI_JOOMLA_OBSOLETEFILES_ERR_SOMEFAILED="%d veraltete Dateien und Ordner konnten nicht entfernt werden. Bitte löschen Sie sie von Hand per FTP, SFTP oder mit dem Dateimanager Ihres Hosters."

[options]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Component Options
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;; File Scanner
COM_ADMINTOOLS_JCONFIG_SCAN_LABEL="Datei-Scanner"
COM_ADMINTOOLS_JCONFIG_SCAN_DESC="Konfigurieren Sie die Funktionsweise des PHP-Dateiänderungsscanners"

COM_ADMINTOOLS_JCONFIG_LOGLEVEL_LABEL="Protokollierungsstufe"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DESC="Die Ausführlichkeit des PHP-Dateiänderungsscanner-Protokolls, das im konfigurierten Protokollverzeichnis Ihrer Website gespeichert wird. Empfohlene Werte: „Warnungen\" für Produktivwebsites, „Debug\", wenn Sie Support von uns anfordern möchten."
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_NONE="Keine"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_ERROR="Fehler"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_WARNING="Warnungen"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_INFO="Informationen"
COM_ADMINTOOLS_JCONFIG_LOGLEVEL_DEBUG="Debug"
COM_ADMINTOOLS_JCONFIG_MINEXEC_LABEL="Minimale Anfragedauer"
COM_ADMINTOOLS_JCONFIG_MINEXEC_DESC="Mindestdauer jeder Anfrage an den PHP-Dateiänderungs-Scanner. Erhöhen Sie den Wert, wenn Ihr Server einen Fehler ausgibt, weil Anfragen zu häufig eingehen oder Sie CPU-/Ressourcenlimits erreichen.<br/><br/>Empfohlene Werte: 2,0 bis 7,0."
COM_ADMINTOOLS_JCONFIG_MAXEXEC_LABEL="Maximale Arbeitszeit"
COM_ADMINTOOLS_JCONFIG_MAXEXEC_DESC="Maximale Zeit, die beim Scannen Ihrer Website in jeder Anfrage an den PHP-Dateiänderungsscanner verbraucht wird. Verringern Sie diesen Wert, wenn Sie die CPU-/Ressourcenlimits Ihres Servers erreichen. Setzen Sie den Wert niedriger als die minimale Anfragezeit, um eine „CPU-Abkühlphase\" zu erzeugen und damit die Ressourcenauslastung beim Datei-Scan zu reduzieren – auf Kosten eines langsameren Scans.<br/><br/>Empfohlene Werte: 3,0 bis 7,0"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_LABEL="Arbeitszeitgewichtung"
COM_ADMINTOOLS_JCONFIG_RUNTIMEBIAS_DESC="Ein Wert zwischen 50 und 100, der beeinflusst, wie aggressiv Admin Tools vorhersagt, ob das Limit für die maximale Arbeitszeit erreicht wird. 50 ist am aggressivsten und bewirkt, dass der Scan etwa die Hälfte der maximalen Arbeitszeit pro Anfrage an den PHP-Dateiänderungsscanner beansprucht. 100 ist am wenigsten aggressiv und bewirkt, dass der Scan mindestens die maximale Arbeitszeit – oft auch mehr – pro Anfrage beansprucht.<br/><br/>Empfohlener Wert: 75.<br/><br/><strong>Tipp!</strong> Wenn Ihr Server besonders empfindlich ist, empfehlen wir, die minimale Anfragezeit auf 7,0, die maximale Arbeitszeit auf 5,0 und die Arbeitszeitgewichtung auf 50 zu setzen. Das bedeutet, dass der Scanner 2,5 bis 5,0 Sekunden arbeitet und Ihr Server dann 2,0 bis 4,5 Sekunden nichts tut. Das Scannen Ihrer Website dauert dadurch etwa dreimal so lang, hat aber bessere Chancen, erfolgreich abzuschließen."
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_LABEL="Max. Anzahl von Ordnern pro Stapel"
COM_ADMINTOOLS_JCONFIG_DIRTHRESHOLD_DESC="Die maximale Anzahl von Ordnern, die in einem Verzeichnis auf einmal aufgelistet werden. Dies verhindert PHP-Timeouts beim Auflisten des Inhalts <em>sehr</em> großer Ordner mit Hunderten von direkt enthaltenen Unterordnern.<br/><br/>Empfohlener Wert: 50<br/><br/>Bedenken Sie, dass das Auflisten von Ordnerinhalten <strong>exponentiell proportional</strong> zur Anzahl der enthaltenen Dateien und Ordner ist. Dies ist eine Einschränkung der Betriebssysteme und ihrer Dateisystemtreiber und liegt nicht an uns, Joomla! oder PHP. Es wird dringend empfohlen, sehr große Ordner auszuschließen und Ordner mit Tausenden direkt enthaltenen Dateien und Unterordnern zu vermeiden. Im Zweifel tief verschachteln."
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_LABEL="Max. Anzahl von Dateien pro Stapel"
COM_ADMINTOOLS_JCONFIG_FILETHRESHOLD_DESC="Die maximale Anzahl von Dateien, die in einem Verzeichnis auf einmal aufgelistet werden. Dies verhindert PHP-Timeouts beim Auflisten des Inhalts <em>sehr</em> großer Ordner mit Tausenden von direkt enthaltenen Dateien.<br/><br/>Empfohlener Wert: 100<br/><br/>Bedenken Sie, dass das Auflisten von Ordnerinhalten <strong>exponentiell proportional</strong> zur Anzahl der enthaltenen Dateien und Ordner ist. Dies ist eine Einschränkung der Betriebssysteme und ihrer Dateisystemtreiber und liegt nicht an uns, Joomla! oder PHP. Es wird dringend empfohlen, sehr große Ordner auszuschließen und Ordner mit Tausenden direkt enthaltenen Dateien und Unterordnern zu vermeiden. Im Zweifel tief verschachteln."
COM_ADMINTOOLS_JCONFIG_FEBENABLE_LABEL="Frontend-Planung aktivieren"
COM_ADMINTOOLS_JCONFIG_FEBENABLE_DESC="Wenn aktiviert, können Sie den PHP-Dateiänderungsscanner ausführen, ohne sich im Backend anzumelden."
COM_ADMINTOOLS_JCONFIG_SECRETWORD_LABEL="Geheimwort"
COM_ADMINTOOLS_JCONFIG_SECRETWORD_DESC="Schützt die Frontend-Planungsfunktion vor DoS-Angriffen, indem dieses Geheimwort in der Frontend-Planungs-URL übergeben werden muss. Bitte verwenden Sie lange, komplexe Passwörter. Weitere Informationen finden Sie in der Dokumentation."
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_LABEL="Zeitzone für E-Mails"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DESC="Alle Daten und Uhrzeiten in den von Admin Tools gesendeten E-Mails über potenzielle Sicherheitsprobleme werden in der ausgewählten Zeitzone angegeben. Standard: GMT"
COM_ADMINTOOLS_JCONFIG_EMAILTIMEZONE_DEFAULT="Server-Zeitzone"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_LABEL="Bevorzugte Ausweichsprache für E-Mail-Benachrichtigungen"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_DESC="Die Sprache für Benachrichtigungs-E-Mails an eine Adresse, die zu keinem Joomla-Benutzerkonto gehört, sowie für Benutzerkonten, deren Spracheinstellung „Standard verwenden“ lautet.<br/><br/>Wenn eine Benachrichtigung an eine Adresse geht, die <em>doch</em> zu einem Joomla-Benutzerkonto gehört, wird stattdessen die Spracheinstellung dieses Kontos verwendet – es sei denn, Sie aktivieren zusätzlich die Option unten.<br/><br/>Lässt sich keine Sprache ermitteln, wird Englisch (en-GB) verwendet. Admin Tools sendet eine Benachrichtigung niemals in der Sprache, in der Ihre Website gerade zufällig angezeigt wird.<br/><br/>Standard: Keine, d. h. Englisch (en-GB)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_NONE="Keine (Englisch verwenden)"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_LABEL="Diese Sprache für alle Benachrichtigungs-E-Mails erzwingen"
COM_ADMINTOOLS_JCONFIG_EMAIL_LANGUAGE_FORCE_DESC="Wenn aktiviert, wird jede Benachrichtigungs-E-Mail in der oben ausgewählten Sprache gesendet, auch wenn sie an ein Joomla-Benutzerkonto mit einer anderen Spracheinstellung gerichtet ist.<br/><br/>Aktivieren Sie diese Option, wenn Sie Benachrichtigungs-E-Mails automatisiert verarbeiten und diese immer in einer einzigen, vorhersehbaren Sprache eintreffen müssen.<br/><br/>Standard: Nein"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_LABEL="Ausgeschlossene Ordner"
COM_ADMINTOOLS_JCONFIG_DIRECTORYFILTERS_DESC="Ordner, die beim Scannen Ihrer Website übersprungen werden sollen.<br/><br/>Ordner werden relativ zum Stammverzeichnis Ihrer Website angegeben. Geben Sie einen Ordner pro Zeile ein.<br/><br/>Standard: leer<br/><br/><em>Hinweis</em>: Einige Ordner werden automatisch ausgeschlossen, ohne dass Sie sie hier angeben müssen: das Protokoll- und temporäre Verzeichnis Ihrer Website, die Frontend- und Backend-Cache-Verzeichnisse sowie Ordner namens tmp, log oder logs im Frontend oder Backend Ihrer Website. Symbolische Links auf Ordner außerhalb des Stammverzeichnisses Ihrer Website werden nicht verfolgt (ihr Inhalt wird nicht gescannt)."
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_LABEL="Ausgeschlossene Dateien"
COM_ADMINTOOLS_JCONFIG_FILEFILTERS_DESC="Dateien, die beim Scannen Ihrer Website übersprungen werden sollen.<br/><br/>Dateien werden relativ zum Stammverzeichnis Ihrer Website angegeben. Geben Sie einen Dateipfad pro Zeile ein.<br/><br/>Standard: leer<br/><br/>Verwenden Sie diese Option nur zum Ausschließen von Dateien, die keine ausführbaren Dateien sind, z. B. Protokolldateien mit der Erweiterung .php außerhalb des Joomla-Protokollordners. Verwenden Sie diese Option NICHT zum Markieren sicherer Dateien; nutzen Sie stattdessen die Funktion „Als sicher markieren\" auf der Scan-Ergebnisseite."
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_LABEL="Zu scannende Erweiterungen"
COM_ADMINTOOLS_JCONFIG_SCANEXTENSIONS_DESC="Eine kommagetrennte Liste von Dateierweiterungen, die gescannt werden sollen, ohne den führenden Punkt.<br/><br/>Standardwert: php, phps, phtml, php3, inc<br/><br/>Bitte beachten Sie, dass der PHP-Dateiänderungsscanner nur zuverlässig PHP-Dateien scannen und deren Bedrohungswert auswerten kann. Wir raten dringend davon ab, Erweiterungen von Quellcodedateien anderer Programmiersprachen wie JavaScript und Perl oder Binärdateien hinzuzufügen. Wenn Sie diese Warnung missachten, erhalten Sie möglicherweise viele falsch positive oder schlimmer noch falsch negative Ergebnisse für Dateien, die keinen PHP-Quellcode enthalten."
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_LABEL="Dateien mit doppelten Erweiterungen scannen"
COM_ADMINTOOLS_JCONFIG_DOUBLEEXTENSIONS_DESC="Dateien scannen, bei denen die zu scannenden Erweiterungen vor anderen Erweiterungen erscheinen. Wenn Sie beispielsweise <code>php</code> zu „Zu scannende Erweiterungen\" hinzugefügt haben und diese Option hier aktivieren, scannt der PHP-Dateiänderungsscanner sowohl <code>example.php</code> als auch <code>example.php.png</code>."
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_LABEL="Erweiterungsabgleich ohne Berücksichtigung der Groß-/Kleinschreibung"
COM_ADMINTOOLS_JCONFIG_CASEINSENSITIVEEXTENSIONS_DESC="Macht den Erweiterungsabgleich unabhängig von der Groß-/Kleinschreibung. Wenn Sie beispielsweise <code>php</code> zu „Zu scannende Erweiterungen\" hinzugefügt haben und diese Option hier aktivieren, scannt der PHP-Dateiänderungsscanner sowohl <code>example.php</code> als auch <code>example.PHP</code>"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_LABEL="Schwellenwert für große Dateien"
COM_ADMINTOOLS_JCONFIG_LARGEFILETHRESHOLD_DESC="Der PHP-Dateiänderungsscanner unterbricht die Arbeit absichtlich und setzt sie in der nächsten Anfrage fort, bevor er Dateien scannt, die größer als diese Anzahl von Bytes sind. Dies verhindert einen ungewollten PHP-Timeout beim Scannen einer großen Datei am Ende der zugeteilten maximalen Arbeitszeit.<br/><br/>Empfohlener Wert: 524288"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_LABEL="Unterschiede beim Scannen berechnen"
COM_ADMINTOOLS_JCONFIG_SCANDIFF_DESC="Wenn diese Option aktiviert ist, berechnet Admin Tools einen Diff (kompakte Form der Dateiänderungen) für jede vom PHP-Dateiänderungsscanner erkannte geänderte Datei. WARNUNG: Dies verbraucht SEHR VIEL Datenbankplatz, etwa 20–40 MB für eine typische Website!"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_LABEL="Dateien mit einem Bedrohungswert von null nicht melden"
COM_ADMINTOOLS_JCONFIG_SCANIGNORENONTHREATS_DESC="Wenn aktiviert, werden neue oder geänderte Dateien mit einem Bedrohungswert von null nicht gemeldet.<br/><br/>Empfohlener Wert: Nein<br/><br/><strong>WARNUNG</strong>: Wir empfehlen NICHT, diese Option zu aktivieren. Es ist denkbar, dass böswillig veränderte Dateien einen Bedrohungswert von null haben, weil ihre schädliche Nutzlast so geschrieben ist, dass ein automatischer Scanner sie nicht von legitimem, wenn auch etwas unordentlichem, Code unterscheiden kann. Durch Aktivieren dieser Option werden Sie nicht auf solche Dateien hingewiesen, was Ihre Website möglicherweise gefährdet. Diese Option dient zur Fehlersuche bei der Bedrohungswertberechnung, NICHT als etwas, das Sie auf Produktionswebsites aktivieren sollten."
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_LABEL="Schwellenwert für überdimensionierte Dateien"
COM_ADMINTOOLS_JCONFIG_OVERSIZEFILETHRESHOLD_DESC="Dateien, die größer als diese Anzahl von Bytes sind, werden nicht auf ihren Bedrohungswert geprüft.<br/><br/>Empfohlener Wert: 5242880<br/><br/>Ein zu niedriger Wert würde dazu führen, dass ausführbare Dateien nicht auf schädlichen Code gescannt werden, was ein Sicherheitsrisiko darstellen könnte. Ein zu hoher Wert führt wahrscheinlich zu einem PHP-Timeout beim Scannen einer sehr großen Datei, typischerweise eine, die trotz der .php-Erweiterung gar nicht ausführbar ist (z. B. eine Protokolldatei)."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_LABEL="Nicht zum Kern gehörende Dateien in Kernverzeichnissen"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_DESC="Legt fest, wie der Scanner Dateien behandelt, die KEINE offiziellen Joomla-Kerndateien sind, sich aber in einem Joomla-Kernverzeichnis befinden (einem Verzeichnis, das zu einer Kern-Erweiterung, einer Kern-Bibliothek oder einem Kern-Template gehört, oder eines von administrator/help, administrator/includes, includes). <strong>Ignorieren</strong>: diese Dateien nicht erkennen. <strong>Markieren</strong>: ein \"Nicht-Kern\"-Abzeichen in den Scan-Ergebnissen anzeigen. <strong>Markieren und als Bedrohung melden</strong>: das Abzeichen anzeigen und 1000 zum Bedrohungswert addieren, damit die Datei am Anfang der Ergebnisse erscheint. Dateien in Verzeichnissen von Drittanbieter-Erweiterungen gelten als außerhalb des Prüfbereichs und werden nie markiert."
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_IGNORE="Ignorieren"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_FLAG="Markieren"
COM_ADMINTOOLS_JCONFIG_NONCOREINCOREFOLDERS_OPT_THREAT="Markieren und als Bedrohung melden"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_LABEL="CoreSums-Dienst-URL"
COM_ADMINTOOLS_JCONFIG_CORESUMS_URL_DESC="Basis-URL des CoreSums-Prüfsummendienstes, den der PHP-Dateiänderungsscanner verwendet, um Joomla-Kerndateien zu erkennen und zu überprüfen. Der Standardwert ist <code>https://getpanopticon.com/checksums</code>. Admin Tools LÄDT von diesem Dienst lediglich eine öffentliche Prüfsummendatei für Ihre Joomla-Version HERUNTER; es sendet niemals Informationen über Ihre Website oder deren Benutzer. Wenn Sie die Prüfsummen lieber selbst hosten möchten, können Sie einen eigenen Dienst betreiben — siehe <code>https://github.com/akeeba/coresums</code> — und diese Option darauf verweisen lassen."
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_LABEL="Zeitlimit für den CoreSums-Download (Sekunden)"
COM_ADMINTOOLS_JCONFIG_CORESUMS_TIMEOUT_DESC="Maximale Anzahl an Sekunden, die beim Herunterladen der CoreSums-Prüfsummendatei gewartet wird, bevor abgebrochen wird. Standardwert: 5. Schlägt der Download fehl, wird der Scan trotzdem ausgeführt, es wird jedoch keine Datei als Kern- oder Nicht-Kerndatei markiert und bis zu Ihrem nächsten erfolgreichen Scan wird eine ausblendbare Warnung angezeigt."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_DESC="Die Scan-Ergebnisse werden automatisch an diese E-Mail-Adresse gesendet. Wenn Sie das Feld leer lassen, wird keine E-Mail versendet."
COM_ADMINTOOLS_JCONFIG_SCANEMAIL_LABEL="Ergebnisse an diese E-Mail senden"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_LABEL="E-Mail nur bei handlungsrelevanten Einträgen"
COM_ADMINTOOLS_JCONFIG_SCAN_CONDITIONAL_EMAIL_DESC="Wenn aktiviert (Standard), sendet der PHP-Dateiänderungsscanner <em>nur dann</em> eine E-Mail mit der Scan-Ergebniszusammenfassung, wenn handlungsrelevante Einträge (hinzugefügte, geänderte oder mögliche Bedrohungsdateien) erkannt werden."

;; Email sending
COM_ADMINTOOLS_JCONFIG_EMAIL_LABEL="E-Mail-Versand"
COM_ADMINTOOLS_JCONFIG_EMAIL_DESC="Optionen, die steuern, wie Admin Tools E-Mails für blockierte Anfragen versendet. Diese Optionen gelten nur für die Professional-Edition."
COM_ADMINTOOLS_JCONFIG_THROTTLE_LABEL="Drosselung von E-Mails bei blockierten Anfragen"
COM_ADMINTOOLS_JCONFIG_THROTTLE_DESC="Wenn aktiviert, sendet Admin Tools nur bis zu einer bestimmten Anzahl von E-Mails in einem bestimmten Zeitraum. Dies schützt Ihr E-Mail-Postfach vor einer Flut von Nachrichten, wenn Ihre Website angegriffen wird. Sie müssen die Protokollierung blockierter Anfragen für <em>alle Sperrgründe</em> aktiviert haben, für die Sie E-Mails versenden. Außerdem muss die maximale Anzahl der gespeicherten Protokolleinträge – gemäß der Konfiguration des System-Plugins – <em>gleich oder höher</em> sein als die unten konfigurierte maximale Anzahl von E-Mails. Andernfalls werden Ihre Sicherheitsausnahme-E-Mails NICHT gedrosselt."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_LABEL="Maximale Anzahl blockierter Anfragen, für die E-Mails versendet werden"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUM_DESC="Die maximale Anzahl blockierter Anfragen, für die innerhalb des unten definierten Zeitraums E-Mails versendet werden dürfen. Beachten Sie, dass bei einem anhaltenden Angriff abhängig davon, wie langsam Ihr Web-, Datenbank- und Mailserver unter sehr hoher Last reagieren, mehr E-Mails als diese Anzahl versendet werden können. Beachten Sie außerdem, dass dies nur die in der Datenbank protokollierten blockierten Anfragen mit einem Sperrgrund betrifft, der NICHT in den konfigurierten Gründen enthalten ist, für die niemals E-Mails versendet werden sollen."
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_LABEL="Zeitraum für die E-Mail-Drosselung"
COM_ADMINTOOLS_JCONFIG_EMAIL_NUMFREQ_DESC="Die E-Mail-Drosselung funktioniert, indem überprüft wird, wie viele blockierte Anfragen in dieser Anzahl von Sekunden, Minuten, Stunden oder Tagen protokolliert wurden. Die Zeiteinheit wählen Sie unten aus."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_LABEL="Zeiteinheit"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DESC="Der obige Zeitraum wird in der hier ausgewählten Zeiteinheit ausgedrückt. Bitte beachten Sie, dass für diese Berechnungen eine Minute 60 Sekunden, 1 Stunde 3600 Sekunden und 1 Tag 86400 Sekunden beträgt. Dies kann von den tatsächlichen Minuten, Stunden und Tagen in Jahren mit Schaltsekunden und beim Übergang zwischen Sommer- und Normalzeit (oder umgekehrt) abweichen. Zeitrechnung ist ein ziemlich kompliziertes Thema."
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_SECONDS="Sekunden"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_MINUTES="Minuten"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_HOURS="Stunden"
COM_ADMINTOOLS_JCONFIG_EMAIL_FREQ_DAYS="Tage"

COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_DESC="Wie lange, in Minuten, eine heruntergeladene Crawler-IP-Liste verwendet wird, bevor sie erneut heruntergeladen wird. So lange wartet Admin Tools auch, bevor es nach einem fehlgeschlagenen Download einen neuen Versuch unternimmt. Das Minimum beträgt 15 Minuten."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_CACHE_LIFETIME_LABEL="Cache-Lebensdauer der Crawler-Listen (Minuten)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DESC="Optionen für die Crawler-IP-Listen, die Sie unter „WAF konfigurieren“ auf dem Tab „Crawler“ aktivieren."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_DESC="Wenn eine Crawler-IP-Liste nicht aktualisiert werden kann, verwendet Admin Tools für so viele Tage weiterhin die zuletzt heruntergeladene Liste, gerechnet ab dem Zeitpunkt, zu dem die Liste normalerweise abgelaufen wäre. Danach wird die Liste nicht mehr verwendet. Bei 0 wird eine Liste nicht mehr verwendet, sobald sie abgelaufen ist."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_DISCARD_DAYS_LABEL="Veraltete Crawler-Listen verwerfen nach (Tagen)"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_LABEL="Crawler"
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_DESC="Die maximale Zeit, in Millisekunden, die Admin Tools auf den Download einer IP-Liste wartet: der Crawler-IP-Listen sowie der Listen von CloudFlare, Sucuri und BunnyCDN, die von den Generatoren für Serverkonfigurationen verwendet werden. Listen, die als Webseiten statt als Datendateien veröffentlicht werden (die von Amazon und Sucuri), erhalten das Dreifache dieses Limits (höchstens 60 Sekunden). Dieses Limit wird nur dann exakt eingehalten, wenn Ihr Server die cURL-Erweiterung von PHP verwendet. Bei anderen Verbindungsmethoden und bei der DNS-Auflösung in einigen cURL-Versionen gilt es nur näherungsweise: Es wird auf ganze Sekunden aufgerundet, und ein sehr langsamer Server kann länger brauchen."
COM_ADMINTOOLS_JCONFIG_CRAWLERIPS_TIMEOUT_MS_LABEL="Zeitlimit für den Download der Crawler- und CDN-Listen (Millisekunden)"

;; Backend options
COM_ADMINTOOLS_JCONFIG_BACKEND_LABEL="Backend"
COM_ADMINTOOLS_JCONFIG_BACKEND_DESC="Optionen, die das Verhalten des Backends der Komponente festlegen"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_LABEL="Grafiken und Statistiken anzeigen"
COM_ADMINTOOLS_JCONFIG_SHOWSTATS_DESC="Grafiken und Statistiken zu blockierten Anfragen anzeigen (nur Professional-Edition)"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_LABEL="Plugin automatisch neu anordnen"
COM_ADMINTOOLS_JCONFIG_REORDERPLUGIN_DESC="Das System-Plugin Admin Tools muss als erstes veröffentlichtes Plugin angeordnet sein, um korrekt zu funktionieren. Wenn Sie Admin Tools im Backend aufrufen, wird das Plugin automatisch an die erste Stelle verschoben. In seltenen Fällen müssen andere Plugins zuerst veröffentlicht werden, zum Beispiel alternative E-Mail-Handler wie CMandrill. Setzen Sie diese Option in diesem Fall auf Nein. GROSSE GEFAHR! ES LIEGT DANN ALLEIN BEI IHNEN, DAS PLUGIN NEU ANZUORDNEN. WENN EIN ANFÄLLIGES PLUGIN VOR DEM SYSTEM-PLUGIN ADMIN TOOLS VERÖFFENTLICHT WIRD, KANN IHRE WEBSITE GEHACKT WERDEN. ADMIN TOOLS IST IN DIESEM FALL NICHT IN DER LAGE, SIE ZU SCHÜTZEN, DA ES NICHT VOR DEM ANFÄLLIGEN CODE AUSGEFÜHRT WIRD UND DEN ANGRIFF DAHER NICHT ERKENNEN KANN. SETZEN SIE DIESE OPTION NUR AUF „NEIN\", WENN SIE EIN EXPERTE SIND UND DIE KONSEQUENZEN VERSTEHEN."
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_LABEL="Bei manuellen Bearbeitungen von Server-Konfigurationsdateien warnen"
COM_ADMINTOOLS_JCONFIG_SERVERCONFIGWARN_DESC="Admin Tools überprüft, ob Sie eine Server-Konfigurationsdatei (z. B. .htaccess, nginx.conf oder web.config) manuell bearbeitet haben, anstatt den Htaccess-, NginX- oder WebConfig-Generator zu verwenden"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_LABEL="Erinnern, wenn die Debug-Protokolldatei aktiviert ist"
COM_ADMINTOOLS_JCONFIG_DEBUGLOGFILENOTICE_DESC="Zeigt auf jeder Seite des Administrationsbereichs Ihrer Website eine Erinnerung an, solange die Option „Eine Debug-Protokolldatei führen“ unter WAF konfigurieren aktiviert ist. Die Debug-Protokolldatei ist nur für die Fehlerbehebung gedacht. Sie protokolliert jede blockierte Anfrage ausführlich, einschließlich übermittelter Formulardaten, in einer unverschlüsselten Datei."
COM_ADMINTOOLS_JCONFIG_USAGESTATS_LABEL="Anonyme PHP-, MySQL- und Joomla!-Versionsberichte aktivieren"
COM_ADMINTOOLS_JCONFIG_USAGESTATS_DESC="Helfen Sie uns, unsere Software zu verbessern, indem Sie anonym und automatisch Ihre PHP-, MySQL- und Joomla!-Versionen melden. Diese Informationen helfen uns zu entscheiden, welche Versionen von Joomla!, PHP und MySQL wir in zukünftigen Versionen unterstützen. Hinweis: Wir erfassen NICHT Ihren Website-Namen, Ihre IP-Adresse oder andere direkt oder indirekt eindeutig identifizierende Informationen."
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_LABEL="Genauen PHP-CLI-Pfad ermitteln"
COM_ADMINTOOLS_JCONFIG_ACCURATE_PHP_CLI_DESCRIPTION="Aktivieren, damit Admin Tools versucht, den genauen PHP-CLI-Pfad auf Ihrem Server zu ermitteln. Deaktivieren, wenn Ihr Server dies nicht zulässt und dabei Ihre IP-Adresse für mehrere Minuten bis Stunden von Ihrer Website sperrt (z. B. IONOS)."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_LABEL="Probleme mit fehlerhaften Mail-Templates in Joomla! 5.2 und höher umgehen."
COM_ADMINTOOLS_JCONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 hat die Funktion Mail-Template-Layout eingeführt und standardmäßig aktiviert. Diese Funktion <em>beschädigt</em> jedoch Links in E-Mails, wenn deren URL aus einer Variable stammt, wie z. B. <code>{URL}</code>, indem die URL der Website vorangestellt wird und die URL dadurch ungültig wird. Dies betrifft sogar Joomlas eigene Komponenten. Auch wenn wir Joomla! selbst nicht reparieren können, können wir eine Umgehungslösung für E-Mails unserer Software bereitstellen. Wenn Sie diese Umgehungslösung aus irgendeinem Grund nicht möchten, können Sie sie deaktivieren, indem Sie diese Option auf Nein setzen."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_LABEL="Webserver"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_DESCRIPTION="Welchen Webserver verwenden Sie für Ihre Website? Die Verwendung von „Automatisch erkennen\" wird für die meisten Websites empfohlen. Wählen Sie Ihren Webservertyp nur dann aus, wenn Ihr Hoster die Umgebungsvariable <code>SERVER_SOFTWARE</code> für PHP absichtlich unzugänglich gemacht oder absichtlich auf einen leeren oder irreführenden Wert gesetzt hat."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_AUTO="Automatisch erkennen"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_APACHE="Apache"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_LITESPEED="LiteSpeed"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_NGINX="NginX"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_SERVER_OPT_IIS="IIS"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_LABEL="Apache-Webserver-Version"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_DESCRIPTION="Wenn Sie den Apache-Webserver verwenden, wählen Sie die verwendete Apache-Version aus. Die Verwendung von „Automatisch erkennen\" wird für die meisten Websites empfohlen. Wählen Sie die Version nur dann aus, wenn Ihr Hoster die Umgebungsvariable <code>SERVER_SOFTWARE</code> für PHP absichtlich unzugänglich gemacht oder absichtlich auf einen leeren oder irreführenden Wert gesetzt hat."
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_AUTO="Automatisch erkennen"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_1_3="1.3"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_0="2.0"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_2="2.2"
COM_ADMINTOOLS_JCONFIG_OVERRIDE_APACHE_OPT_2_4="2.4"
