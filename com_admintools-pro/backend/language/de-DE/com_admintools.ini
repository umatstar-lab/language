COM_ADMINTOOLS_TITLE_SCHEDULINGINFORMATION="PHP-Dateiänderungsscanner-Planung"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON="Alternative Kommandozeilen-CRON-Aufgaben"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_ALTCLICRON_INFO="Diese Methode wird nur empfohlen, wenn die reguläre Kommandozeilen-CRON-Aufgabe nicht abgeschlossen wird. Diese Methode verwendet intern die Frontend-Planungsmethode und ist etwas langsamer als die native CLI-Methode."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON="Kommandozeilen-CRON-Aufgaben (empfohlen)"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLICRON_INFO="Dies ist die empfohlene Methode für alle Server, die Kommandozeilen-CRON-Aufgaben unterstützen. Diese Methode umgeht die Web-Oberfläche von Joomla! und erreicht dadurch maximale Scan-Geschwindigkeit."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICIMPROTANTINFO="Wichtig"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_CLIGENERICINFO="Denken Sie daran, <em>%s</em> durch den tatsächlichen Pfad zur PHP-<strong>CLI (Command Line Interface)</strong>-Programmdatei Ihres Hosters zu ersetzen. Beachten Sie, dass Sie die PHP-CLI-Programmdatei verwenden müssen; die PHP-CGI (Common Gateway Interface)-Programmdatei funktioniert <em>nicht</em> mit unseren CRON-Skripten. Wenn Sie nicht sicher sind, was das bedeutet, wenden Sie sich bitte an Ihren Hoster. Nur dieser kann Ihnen diese Information bereitstellen."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP="Frontend-Planungsfunktion"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_INFO="Diese Methode verwendet eine öffentliche URL und einen geheimen Schlüssel, um einen Scan Ihrer Website auszulösen. Der Scan schreitet mittels HTTP-Weiterleitungen voran. Bitte beachten Sie, dass die meisten URL-basierten „CRON\"-Aufgaben von Hostern sowie die meisten URL-basierten CRON-Dienste von Drittanbietern keine HTTP-Weiterleitungen unterstützen. Wenn die Beispiele mit wget und curl unten bei Ihnen nicht funktionieren, verwenden Sie bitte die Frontend-Planungs-URL mit dem sehr günstigen Drittanbieter-Dienst webcron.org."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_MANYMETHODS="Die Frontend-Planungsfunktion kann mit einer Vielzahl von Methoden verwendet werden. Klicken Sie auf die Registerkarten unten, um die Beschreibung jeder Methode zu sehen. Denken Sie daran, dass alle in unserer Dokumentation ausführlich erklärt werden."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_CURL="cURL"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_SCRIPT="PHP-Skript"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_URL="URL"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_WEBCRON="WebCron.org"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTENDBACKUP_TAB_WGET="WGet"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CURL="CRON-Planung mit cURL:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_CUSTOMSCRIPT="Benutzerdefiniertes PHP-Skript zur Ausführung der Frontend-Planung:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_DISABLED="Die Frontend-Planungsfunktion von Admin Tools ist nicht aktiviert. Sie können diese Planungsmethode nicht verwenden, solange Sie sie nicht aktivieren. Gehen Sie bitte zur Systemsteuerung von Admin Tools, klicken Sie auf Optionen und aktivieren Sie die Frontend-Planungsfunktion. Vergessen Sie nicht, auch ein geheimes Wort Ihrer Wahl anzugeben."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_RAWURL="URL zur Verwendung mit eigenen Skripten und Diensten von Drittanbietern:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_SECRET="Der geheime Schlüssel der Frontend-Planungsfunktion ist leer. Sie können diese Planungsmethode nicht verwenden, solange Sie keinen geheimen Schlüssel erstellen. Gehen Sie bitte zur Systemsteuerung von Admin Tools, klicken Sie auf Optionen und geben Sie einen geheimen Schlüssel Ihrer Wahl ein."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON="Konfiguration eines Scan-Auftrags mit WebCron.org:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_ALERTS="Benachrichtigungen"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Wenn Sie bereits Benachrichtigungsmethoden in der webcron.org-Oberfläche eingerichtet haben, empfehlen wir, hier eine Benachrichtigungsmethode auszuwählen und die Option „Nur bei Fehler\" nicht zu aktivieren, damit Sie immer eine Benachrichtigung erhalten, wenn der Backup-CRON-Auftrag ausgeführt wird."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_EXECUTIONTIME="Ausführungszeit"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_EXECUTIONTIME_INFO="Das ist das Raster unterhalb der anderen Optionen. Wählen Sie aus, wann und wie oft Ihr CRON-Auftrag ausgeführt werden soll."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_INFO="Melden Sie sich bei webcron.org an. Klicken Sie im CRON-Bereich auf die Schaltfläche „Neuer Cron\". Unten finden Sie, was Sie in der webcron.org-Oberfläche eingeben müssen."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_LOGIN="Anmeldung"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_LOGINPASSWORD_INFO="Dieses Feld leer lassen"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_NAME="Name des Cron-Auftrags"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_NAME_INFO="Beliebiger Name, z. B. <em>Scan meiner Website</em>"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_PASSWORD="Passwort"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_THENCLICKSUBMIT="Klicken Sie abschließend auf die Schaltfläche „Absenden\", um die Einrichtung Ihres CRON-Auftrags abzuschließen."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_TIMEOUT="Zeitlimit"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180 Sekunden; wenn der Scan nicht abgeschlossen wird, erhöhen Sie diesen Wert. Die meisten Websites funktionieren mit einem Wert von 180 oder 600. Wenn Sie eine sehr große Website haben, deren Scan mehr als 5 Minuten dauert, sollten Sie stattdessen den nativen CLI-CRON-Job verwenden, da dieser wesentlich kosteneffizienter ist."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WEBCRON_URL="URL, die Sie ausführen möchten"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_FRONTEND_WGET="CRON-Planung mit wget (die meisten Hoster):"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER="Geplante Aufgaben in Joomla"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_INFO="Sie können einen Scan Ihrer Website mithilfe der Funktion „Geplante Aufgaben\" von Joomla! planen. Bitte lesen Sie zuerst die Dokumentation, um die Kompromisse und möglichen Probleme je nach der gewählten Methode zur Auslösung geplanter Aufgaben in Joomla! zu verstehen."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_BUTTON="Ihre geplanten Aufgaben verwalten"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_ONLYJ41_HEAD="Geplante Aufgaben sind nur in Joomla 4.1 und höher verfügbar"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_ONLYJ41_BODY="Joomla! hat die Funktion „Geplante Aufgaben\" in Version 4.1.0 eingeführt. Bitte aktualisieren Sie Ihre Website auf die neueste Joomla-Version, um Zugang zu geplanten Aufgaben zu erhalten."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_HEAD="Das Plugin „Task – Admin Tools\" ist deaktiviert."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BODY="Das Plugin „Task – Akeeba Backup\" muss aktiviert sein, damit die geplanten Aufgaben von Joomla! wissen, wie Backups mit Akeeba Backup ausgeführt werden sollen. Bitte gehen Sie zu System, Verwalten, Plugins und aktivieren Sie das Plugin. Alternativ klicken Sie auf die folgende Schaltfläche, um das Plugin direkt zu bearbeiten."
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_JOOMLASCHEDULER_PLUGIN_DISABLED_BUTTON="Plugin bearbeiten"

COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_GENERICREADDOC="Dokumentation lesen"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_GENERICUSECLI="Verwenden Sie den folgenden Befehl in der CRON-Oberfläche Ihres Hosters:"
COM_ADMINTOOLS_SCHEDULINGINFORMATION_LBL_HEADERINFO="Admin Tools bietet mehrere Methoden zur Planung der Ausführung des PHP-Dateiänderungsscanners. Nachfolgend finden Sie weitere Informationen zu den einzelnen Planungsmethoden. Bitte lesen Sie die Dokumentation zu jeder Planungsmethode. Sie beantwortet viele Ihrer Fragen und hilft Ihnen, Ihre Website-Scans einfacher zu planen."
