COM_ADMINTOOLS_ACL_PERMISSION_UTILS_DESC="Zugriff auf Hilfsprogramm-Funktionen erlauben"
COM_ADMINTOOLS_ACL_PERMISSION_UTILS_TITLE="Hilfsprogramm"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_TITLE="Sicherheit"
COM_ADMINTOOLS_ACL_PERMISSION_SECURITY_DESC="Zugriff auf Sicherheitsfunktionen erlauben. Dies umfasst den Assistenten für temporäre Super-Benutzer; behandeln Sie es daher wie die Vergabe von Super-Benutzer-Zugriff."
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_TITLE="Wartung"
COM_ADMINTOOLS_ACL_PERMISSION_MAINTENANCE_DESC="Zugriff auf Datenbank- und Berechtigungswartung erlauben"

