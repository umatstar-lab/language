COM_ADMINTOOLS_TITLE_QUICKSTART="Schnellstart-Assistent"

COM_ADMINTOOLS_QUICKSTART_ADMINISTRATORPASSORD_INFO="Jedes Mal, wenn Sie Ihren <code>administrator</code>-Anmeldebereich aufrufen, müssen Sie diesen Benutzernamen und dieses Passwort in Ihren Browser eingeben, bevor Sie das Anmeldeformular sehen, in dem Sie Ihren Joomla!-Benutzernamen und Ihr Passwort eingeben können. Dies wird Hackern erheblich Steine in den Weg legen."
COM_ADMINTOOLS_QUICKSTART_ADMINLOGINEMAIL_DESC="Jedes Mal, wenn ein Administrator-Anmeldeversuch erkannt wird – erfolgreich oder fehlgeschlagen – wird eine E-Mail an diese Adresse mit Informationen über den Anmelde-Benutzernamen, die IP-Adresse und weiteres gesendet."
COM_ADMINTOOLS_QUICKSTART_ADMINLOGINEMAIL_LBL="E-Mail für alle Administrator-Anmeldeversuche senden"
COM_ADMINTOOLS_QUICKSTART_ALMOSTTHERE_INTRO="Wir sind fast fertig. Bevor Sie fortfahren, müssen Sie wissen, was zu tun ist, wenn etwas schiefgeht. Admin Tools ist ein Sicherheitswerkzeug, das die Funktionsweise Ihrer Website verändert. Je nachdem, was Sie tun möchten, und je nach Ihrer Admin Tools-Konfiguration kann es manchmal die Funktionsweise von Joomla! selbst und seinen verschiedenen Erweiterungen beeinträchtigen. Wenn Sie sich nach dem Ausführen dieses Assistenten nicht anmelden oder auf Ihre Website zugreifen können oder ein anderes nicht identifiziertes Problem mit Ihrer Website feststellen, lesen Sie bitte die folgenden URLs für Anweisungen zur Fehlerbehebung:"
COM_ADMINTOOLS_QUICKSTART_ALMOSTTHERE_OUTRO="Bevor Sie auf die Schaltfläche unten klicken, <strong>drucken Sie diese Seite bitte aus oder machen Sie einen Screenshot</strong> als Referenz."
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_BODY="Sie haben Admin Tools bereits konfiguriert, entweder manuell oder durch einen früheren Durchlauf dieses Schnellstart-Assistenten. Wir empfehlen nicht, den Schnellstart-Assistenten erneut auszuführen, und leisten dafür keinen Support. Dadurch wird Ihre Admin Tools-Konfiguration überschrieben, was Ihre Website möglicherweise beschädigt. Sind Sie sicher, dass Sie fortfahren möchten?"
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_BTN_NO="Nein, zurück!"
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_BTN_YES="Ja, Schnellstart-Assistent ausführen"
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_HEAD="Sie haben Admin Tools bereits konfiguriert."
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_NOSUPPORT_BODY="Die Verwendung dieses Assistenten überschreibt alle Ihre Admin Tools-Konfigurationseinstellungen. Wenn Sie nicht alle Ihre Admin Tools-Einstellungen überschreiben möchten, klicken Sie jetzt auf die Schaltfläche „Zurück\"."
COM_ADMINTOOLS_QUICKSTART_ALREADYCONFIGURED_NOSUPPORT_HEAD="Sie sind dabei, alle Ihre Konfigurationseinstellungen zu überschreiben"
COM_ADMINTOOLS_QUICKSTART_AUTOBAN_DESC="Wenn eine Anfrage von derselben IP-Adresse dreimal oder öfter innerhalb einer Minute blockiert wird, wird sie für 15 Minuten vom Zugriff auf Ihre Website gesperrt."
COM_ADMINTOOLS_QUICKSTART_AUTOBAN_LBL="Wiederholte Verstöße automatisch sperren"
COM_ADMINTOOLS_QUICKSTART_AUTOBLACKLIST_DESC="Wenn die IP-Adresse eines Wiederholungstäters drei oder mehr Mal automatisch gesperrt wird, wird sie dauerhaft zur IP-Ausschlussliste hinzugefügt, sodass der Benutzer nicht mehr auf Ihre Website zugreifen kann."
COM_ADMINTOOLS_QUICKSTART_AUTOBLACKLIST_LBL="Wiederholt gesperrte IP-Adressen zur IP-Ausschlussliste hinzufügen"
COM_ADMINTOOLS_QUICKSTART_ENABLEWAF_DESC="Durch die Aktivierung der Web Application Firewall kann Admin Tools Sie gegen die häufigsten Angriffe auf Ihre Website schützen. Sie können diesen Schutz später auf der Seite „WAF konfigurieren\" von Admin Tools weiter anpassen."
COM_ADMINTOOLS_QUICKSTART_ENABLEWAF_LBL="Web Application Firewall aktivieren"
COM_ADMINTOOLS_QUICKSTART_HEAD_ADMINSECURITY="Administrator-Sicherheit"
COM_ADMINTOOLS_QUICKSTART_HEAD_ADVANCEDSECURITY="Erweiterte Sicherheit"
COM_ADMINTOOLS_QUICKSTART_HEAD_ALMOSTTHERE="Wir sind fast fertig..."
COM_ADMINTOOLS_QUICKSTART_HTMAKER_DESC="Diese .htaccess-Datei verhindert viele Arten von Angriffen auf der Webserver-Ebene."
COM_ADMINTOOLS_QUICKSTART_HTMAKER_LBL="Sicherheitshärtende .htaccess erstellen"
COM_ADMINTOOLS_QUICKSTART_INTRO="Dieser Assistent führt Sie durch die Grundkonfiguration von Admin Tools. Fahren Sie mit der Maus über jedes Label, um weitere Informationen darüber zu erhalten, was jede Option bewirkt. Bitte verwenden Sie ihn nur bei einer Neuinstallation von Admin Tools. Er überschreibt alle Einstellungen, die Sie möglicherweise bereits vorgenommen haben. Dieser Assistent ist kein Ersatz für das Lesen der <a href=\"%s\">Dokumentation</a> und das Feinabstimmen des Schutzes für Ihre Website."
COM_ADMINTOOLS_QUICKSTART_MSG_DONE="Ihre Admin Tools-Einrichtungseinstellungen wurden gespeichert"
COM_ADMINTOOLS_QUICKSTART_MSG_HTMAKERNOTAPPLIED="Die .htaccess-Datei konnte nicht geschrieben werden. Bitte gehen Sie zur .htaccess-Generator-Seite und verwenden Sie die Vorschau-Schaltfläche, um den Inhalt der neuen .htaccess-Datei abzurufen. Laden Sie die Datei dann manuell gemäß den Dokumentationsanweisungen hoch."
COM_ADMINTOOLS_QUICKSTART_MSG_IPADDEDBYWIZARD="Ihre IP-Adresse, wie vom Schnellstart-Assistenten erkannt"
COM_ADMINTOOLS_QUICKSTART_NONEWADMINS_DESC="Sie können keine Benutzer mit Zugriff auf den Administrator-Bereich mehr bearbeiten oder erstellen, z.&nbsp;B. Super-Benutzer oder Administratoren. Sie können auch keine bestehenden Benutzer in Super-Benutzer, Administratoren usw. umwandeln. Der Versuch, dies zu tun, führt zu einer Fehlermeldung „403 Zugriff verweigert\"."
COM_ADMINTOOLS_QUICKSTART_WHITELIST_DESC="Der Zugriff auf den Administrator-Bereich wird nur einer vordefinierten Liste von IP-Adressen gestattet. Standardmäßig ist dort nur Ihre aktuelle IP-Adresse enthalten: <code>%s</code>."
COM_ADMINTOOLS_QUICKSTART_MSG_PLEASERUNWIZARD="Admin Tools schützt Ihre Website noch nicht. Bitte führen Sie den <a href='%s'>Schnellstart-Assistenten</a> aus, um Admin Tools auf Ihrer Website zu konfigurieren."


