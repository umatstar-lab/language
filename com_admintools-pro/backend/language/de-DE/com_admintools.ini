COM_ADMINTOOLS_REDIRECTION_LBL_DEST="Beim Besuch dieser Adresse"
COM_ADMINTOOLS_REDIRECTION_LBL_DEST_DESC="Dies ist eine relative URL auf Ihrer Website. Wenn jemand diese aufruft, wird er zur URL \"Weiterleitung zu\" weitergeleitet. Sie darf kein http://- oder https://-Protokollpräfix, keinen Domainnamen und keinen führenden Schrägstrich enthalten. Beispiele: <code>search/on/google</code> oder <code>456-blog/123-my-article</code>. Bitte beachten Sie, dass Sie das Fragment (das <code>#</code>-Zeichen in der URL und alles danach) nicht angeben können, da dies eine clientseitige Funktion ist; Ihr Server sieht das Fragment NICHT, daher können wir keine serverseitige Weiterleitung basierend auf dem Fragment-Inhalt durchführen."
COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE="Weiterleitung zu"
COM_ADMINTOOLS_REDIRECTION_LBL_SOURCE_DESC="Dies ist die relative oder absolute URL, zu der der Besucher weitergeleitet wird. Diese URL muss auch dann gültig sein, wenn Sie die Weiterleitungsfunktion deaktivieren. Es kann eine URL Ihrer eigenen Website oder einer anderen Website sein. Beispiele: <code>https://www.example.com</code> oder <code>blog/123-my-article</code>."
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS="URL-Parameter beibehalten"
COM_ADMINTOOLS_REDIRECTION_LBL_KEEPURLPARAMS_DESC="Wählen Sie, was mit den Abfrage-String-Parametern in der aufgerufenen URL geschehen soll. \"Keine\" ignoriert sie und behält die Abfrage-String-Parameter der URL \"Weiterleitung zu\" bei, sofern vorhanden. \"Alle überschreiben\" fügt sie mit den Abfrage-String-Parametern der URL \"Weiterleitung zu\" zusammen und überschreibt letztere, auch wenn diese bereits gesetzt sind. \"Neue hinzufügen\" fügt alle in der aufgerufenen URL definierten Abfrage-String-Parameter hinzu, <em>sofern</em> sie in der URL \"Weiterleitung zu\" noch NICHT definiert sind."

