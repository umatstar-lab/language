;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_BADWORDS="Unzulässige Begriffe"
COM_ADMINTOOLS_TITLE_BADWORD_EDIT="Unzulässigen Begriff bearbeiten"
COM_ADMINTOOLS_TITLE_BADWORD_ADD="Unzulässigen Begriff hinzufügen"

COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_TITLE="Es wurden noch keine unzulässigen Begriffe definiert."
COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_CONTENT="Mit unzulässigen Begriffen können Sie alle öffentlichen Frontend-Anfragen blockieren, die einen oder mehrere dieser Begriffe in einem beliebigen Anfrageparameter enthalten. Sie können verwendet werden, um offensichtlichen Spam und anstößige Sprache von Ihrer Website fernzuhalten."
COM_ADMINTOOLS_BADWORDS_EMPTYSTATE_BUTTON_ADD="Unzulässigen Begriff hinzufügen"

COM_ADMINTOOLS_BADWORDS_TABLE_CAPTION="Tabelle der unzulässigen Begriffe."

COM_ADMINTOOLS_BADWORDS_ERR_NEEDS_WORD="Sie müssen ein zu sperrendes Wort angeben"

COM_ADMINTOOLS_BADWORDS_LBL_WORD="Begriff"
COM_ADMINTOOLS_BADWORDS_LBL_WORD_DESC="Der unzulässige Begriff, den Sie sperren möchten. Groß-/Kleinschreibung wird nicht beachtet, d. h. <code>test</code>, <code>TEST</code> und <code>TesT</code> werden als dasselbe Wort betrachtet."
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE="Regulären Ausdruck maskieren"
COM_ADMINTOOLS_BADWORDS_LBL_ESCAPE_DESC="Das Feld Wort ist ein regulärer Ausdruck, der in <code>#\b&lt;WAS SIE EINGEGEBEN HABEN&gt;\b#iu</code> eingesetzt wird. Alles darin außer Buchstaben, Ziffern, Bindestrichen und Unterstrichen hat eine besondere Bedeutung — <code>.</code> passt auf ein beliebiges Zeichen, <code>*</code> wiederholt das vorangehende Zeichen, <code>#</code> beendet den Ausdruck und so weiter. Wenn diese Option auf Ja gesetzt ist, maskiert Admin Tools diese Zeichen beim Speichern des Datensatzes für Sie, sodass das Wort buchstäblich auf sich selbst passt. Lassen Sie sie auf Ja, es sei denn, Sie können reguläre Ausdrücke schreiben und wollen bewusst einen verwenden. Bitte lesen Sie die Dokumentation, bevor Sie sie abschalten.<br><br><strong>Beim Bearbeiten eines vorhandenen Datensatzes dürfen Sie diese Option NICHT einschalten, wenn das Wort beim Hinzufügen bereits maskiert wurde.</strong> Das Maskieren eines bereits maskierten Ausdrucks zerstört ihn, und er passt dann auf gar nichts mehr. Deshalb steht die Option bei neuen Datensätzen standardmäßig auf Ja und beim Bearbeiten eines vorhandenen auf Nein."

COM_ADMINTOOLS_BADWORDS_N_ITEMS_COPIED="%d unzulässige Begriffe wurden kopiert."
COM_ADMINTOOLS_BADWORDS_N_ITEMS_COPIED_1="Der unzulässige Begriff wurde kopiert."
