COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_ERR_ALREADY_SAVED="Die PHP-Handler-Direktiven sind bereits im Feld „Benutzerdefinierte .htaccess-Regeln\" eingerichtet. Bitte entfernen Sie sie zuerst und speichern Sie Ihre Änderungen (ohne eine .htaccess-Datei zu erstellen), bevor Sie diese Funktion erneut verwenden."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_PHPHANDLERS_SAVED="Die in der <code>.htaccess</code>-Datei im Stammverzeichnis Ihrer Website gefundenen PHP-Handler-Direktiven wurden in das Feld „Benutzerdefinierte .htaccess-Regeln\" kopiert. Bitte prüfen Sie, ob sie korrekt aussehen, und klicken Sie dann auf „Speichern &amp; .htaccess erstellen\", um den Vorgang abzuschließen."

