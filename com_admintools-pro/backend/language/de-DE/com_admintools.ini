COM_ADMINTOOLS_HTACCESSMAKER_LBL_WARNING="WARNUNG!"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WARNTEXT="Aufgrund der unterschiedlichen Kompatibilität der folgenden Einstellungen auf verschiedenen Servern kann das Anwenden der .htaccess-Datei dazu führen, dass Ihre Website mit einer weißen Seite oder einer Fehlermeldung „500 Internal Server Error\" nicht erreichbar ist. Entfernen Sie in diesem Fall die .htaccess-Datei und versuchen Sie, einige Optionen zu deaktivieren, bevor Sie sie erneut anwenden."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK="Wird der .htaccess-Generator mit meinem Server funktionieren?"
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK_MAYBE="<b>Vielleicht</b>. Wir haben einen Server-Typ erkannt, der möglicherweise mit .htaccess-Dateien kompatibel ist oder auch nicht. Wenn die folgenden Optionen keine Wirkung haben, fragen Sie bitte Ihren Hoster, ob Ihr Server .htaccess-Dateien unterstützt."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK_NO="<b>Nein, überhaupt nicht</b>. Wir haben festgestellt, dass Sie einen Server-Typ verwenden, der mit .htaccess-Dateien nicht kompatibel ist (z. B. Microsoft IIS oder NginX). Die Verwendung des .htaccess-Generators hat <strong>keinerlei Auswirkungen</strong> auf Ihre Website."
COM_ADMINTOOLS_HTACCESSMAKER_LBL_WILLTHISWORK_YES="<b>Höchstwahrscheinlich ja</b>. Wir haben festgestellt, dass Ihr Webserver-Typ Apache ist, der .htaccess-Dateien unterstützt. Wenn die folgenden Optionen keine Wirkung haben oder das Deaktivieren aller Optionen weiterhin zu einem 500 Internal Server Error oder einer leeren Seite führt, wenden Sie sich bitte an Ihren Hoster und bitten Sie ihn, die .htaccess-Datei-Unterstützung zu aktivieren."
