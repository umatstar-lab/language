COM_ADMINTOOLS_NGINXCONFMAKER_LBL_EXCEPTIONPATHINFO_NOTE="Ausgenommene PHP-Dateien sowie die PHP-Dateien in den Verzeichnissen mit direktem Zugriff (einschließlich .php-Dateien) verarbeiten dann auch URLs, bei denen auf den Dateinamen ein Pfad folgt, z. B. <code>foobar.php/baz.png</code>. Damit PHP diesen Pfad erhält, muss die Einstellung <em>fastcgi_pass-Code-Block</em> <code>SCRIPT_FILENAME</code> und <code>PATH_INFO</code> setzen; die mit NginX ausgelieferte Datei <code>fastcgi_params</code> setzt <code>PATH_INFO</code> nicht. <a href=\"https://www.akeeba.com/documentation/admin-tools-joomla/nginx-server-protection.html#nginx-path-info\" target=\"_blank\">Lesen Sie die Dokumentation</a> zur erforderlichen Einrichtung und zu den Sicherheitsaspekten."
COM_ADMINTOOLS_NGINXCONFMAKER_LBL_NOTAPPLIED="Die nginx.conf-Datei konnte nicht geschrieben werden. Bitte verwenden Sie die Vorschau-Schaltfläche, um deren Inhalt abzurufen, und binden Sie ihn manuell in die Konfigurationsdatei Ihrer Website ein."
