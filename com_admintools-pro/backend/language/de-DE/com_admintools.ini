COM_ADMINTOOLS_WAFDENYLISTS_LBL_QUERY_CONTENT_DESC="Leer lassen, um die Regel unabhängig vom Abfrageinhalt anzuwenden. Geben Sie andernfalls einen <a href=\"https://www.php.net/manual/en/reference.pcre.pattern.syntax.php\" target=\"_blank\">PHP-regulären Ausdruck</a> an; wenn er mit dem Inhalt des Abfrageparameters übereinstimmt, trifft die Regel zu. Sie können einen regulären Ausdruck negieren, indem Sie ihm ein Ausrufezeichen (<code>!</code>) voranstellen."

