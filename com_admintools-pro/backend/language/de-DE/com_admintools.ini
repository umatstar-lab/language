COM_ADMINTOOLS_CONTROLPANEL_BTN_FESECRETWORD_RESET="Vorgeschlagenes geheimes Wort übernehmen"

COM_ADMINTOOLS_CONTROLPANEL_LBL_DISCLAIMER="HAFTUNGSAUSSCHLUSS"
COM_ADMINTOOLS_CONTROLPANEL_LBL_DISTEXT="Sicherheitskomponenten wie Admin Tools sind nicht dafür ausgelegt, Ihre Website zu 100 % vor allen erdenklichen Angriffen zu schützen. Sie können und werden dazu beitragen, die Sicherheit Ihrer Website zu verbessern. Sie müssen dennoch gesunden Menschenverstand und gute Sicherheitsgewohnheiten anwenden, um eine gesunde und sichere Website zu betreiben. Als absolutes Minimum sollten Sie Joomla! und dessen Erweiterungen regelmäßig aktualisieren, regelmäßige, getestete externe Backups erstellen und auf ungewöhnliches Verhalten Ihrer Website achten."

COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_HEAD="Leerer Pfad als Basisverzeichnis Ihrer Website."
COM_ADMINTOOLS_CONTROLPANEL_LBL_EMPTYROOT_BODY="PHP meldet einen leeren Pfad als Basisverzeichnis Ihrer Website. Dies wird durch einen Fehler in älteren PHP-Versionen verursacht. Bitte fordern Sie Ihren Hoster auf, die installierte PHP-Version auf dem Server zu aktualisieren. Wenn Sie versuchen, die Schaltfläche „Berechtigungen reparieren\" zu verwenden, ist es sehr wahrscheinlich, dass Sie den Zugang zu Ihrer Website verlieren."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD="Hauptpasswort"
COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_HEAD="Passwortschutz"
COM_ADMINTOOLS_CONTROLPANEL_LBL_MAINPASSWORD_INTRO="Der Administrator dieser Website hat einige oder alle Funktionen von Admin Tools mit einem Passwort gesichert. Bitte geben Sie das Passwort ein, um Zugang zu erhalten."

COM_ADMINTOOLS_CONTROLPANEL_LBL_MUSTENTERDLID="Sie müssen Ihre Download-ID eingeben"
COM_ADMINTOOLS_CONTROLPANEL_LBL_NEEDSDLID="Sie müssen Ihre <b>Download-ID</b> eingeben, bevor Sie Admin Tools Professional aktualisieren können. <a href='%s' target='_blank'>Falls Sie Ihre Download-ID nicht kennen, klicken Sie bitte hier</a>."
COM_ADMINTOOLS_CONTROLPANEL_MSG_WHERETOENTERDLID="Öffnen Sie das Joomla!-Systemmenü in der linken Seitenleiste. Suchen Sie den Bereich „Aktualisierung\" und klicken Sie auf den Link „Aktualisierungs-Server\". Suchen Sie den Eintrag „Admin Tools Professional\" und klicken Sie darauf. Alternativ können Sie <a href=\"%s\">hier klicken</a>, um direkt zu dieser Seite zu gelangen. Geben Sie Ihre Download-ID — entweder Ihre Haupt-ID oder eine Zusatz-Download-ID — in das Feld „Download-Schlüssel\" ein und klicken Sie auf die Schaltfläche „Speichern\"."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED="Die Debug-Protokolldatei wurde ausgeschaltet. Vorhandene Debug-Protokolldateien wurden beibehalten."
COM_ADMINTOOLS_CONTROLPANEL_MSG_DEBUGLOGFILE_DISABLED_DELETED="Die Debug-Protokolldatei wurde ausgeschaltet und vorhandene Debug-Protokolldateien wurden gelöscht."
COM_ADMINTOOLS_CONTROLPANEL_MSG_JOOMLABUGGYUPDATES="<strong>Wichtig:</strong> Wenn Joomla! bereits festgestellt hat, dass Updates für Admin Tools verfügbar sind, bevor Sie Ihre Download-ID eingegeben haben, <em>können diese möglicherweise nicht heruntergeladen werden</em>, selbst nachdem Sie Ihre Download-ID eingegeben haben. Dies ist auf verschiedene langjährige Joomla!-Fehler zurückzuführen. Laden Sie in diesem Fall die ZIP-Datei der neuesten Version von unserer Website herunter. Öffnen Sie dann das Joomla!-Systemmenü, suchen Sie den Bereich „Installation\", klicken Sie auf „Erweiterungen\", dann auf die Registerkarte „Paketdatei hochladen\" und installieren Sie die heruntergeladene ZIP-Datei <strong>zweimal</strong> nacheinander, <strong>ohne</strong> Admin Tools vorher oder zwischendurch zu deinstallieren. Die doppelte Installation ist erforderlich, um einen weiteren langjährigen Joomla!-Fehler zu beheben, der manchmal verhindert, dass alle aktualisierten Dateien beim Installieren eines Erweiterungs-Updates kopiert werden."

COM_ADMINTOOLS_CONTROLPANEL_LBL_FESECRETWORD_RESET="Das geheime Wort wurde in <code>%s</code> geändert."

COM_ADMINTOOLS_CONTROLPANEL_LBL_RELOADUPDATE="Aktualisierungsinformationen neu laden"
COM_ADMINTOOLS_CONTROLPANEL_LBL_UPDATE_INFORMATION_RELOADED="Die Aktualisierungsinformationen wurden vom Server neu geladen."

COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_HEAD="Rettungsmodus"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_MESSAGE="Admin Tools wird im Rettungsmodus ausgeführt. Dies ist ein Fehlerbehebungsmodus, mit dem Sie sich selbst entsperren können, wenn Sie sich versehentlich aus Ihrer Website ausgesperrt haben. Die Admin Tools-Schutzfunktionen sind vorübergehend nur für den Administrator-Zugang über Ihr Konto und nur von Ihrem Browser und Ihrer IP-Adresse deaktiviert. Solange diese Meldung angezeigt wird, schützt Admin Tools Ihre Website weiterhin."
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_BTN_HOWTOUNBLOCK="Wie hebe ich meine eigene Sperre auf?"
COM_ADMINTOOLS_CONTROLPANEL_RESCUEMODE_BTN_ENDRESCUE="Rettungsmodus beenden"

COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_HEAD="Ihre Server-Konfigurationsdatei muss möglicherweise neu erstellt werden"
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN="Admin Tools hat festgestellt, dass Ihre Server-Konfigurationsdatei (z. B. .htaccess, nginx.conf oder web.config) geändert wurde. Wir empfehlen dringend, alle manuellen Änderungen in den Feldern <strong>Benutzerdefinierte Regeln</strong> einzutragen, damit diese nicht verloren gehen, wenn Sie die Datei mit Admin Tools neu generieren."
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_REGENERATE="Neu generieren"
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_IGNORE="Ignorieren"
COM_ADMINTOOLS_CONTROLPANEL_ERR_SERVERCONFIGWARN_REGENERATE="Die Server-Konfigurationsdatei konnte nicht neu generiert werden."
COM_ADMINTOOLS_CONTROLPANEL_LBL_SERVERCONFIGWARN_REGENERATED="Die Server-Konfigurationsdatei wurde neu generiert."
COM_ADMINTOOLS_SERVERCONFIGREMINDER_MSG="Ihre Server-Konfigurationsdatei (.htaccess, nginx.conf oder web.config) wurde von Admin Tools generiert, entspricht aber nicht mehr dem, was diese Version von Admin Tools generieren würde. Bitte <a href='%s'>öffnen Sie das Admin Tools Control Panel und generieren Sie sie neu</a>, damit die neuesten Schutzmaßnahmen wirksam werden."
COM_ADMINTOOLS_CORESUMS_WARN_HEAD="Überprüfung der Kerndateien nicht verfügbar"
COM_ADMINTOOLS_CORESUMS_WARN_BODY="Beim letzten Lauf des PHP-Dateiänderungsscanners konnten die CoreSums-Prüfsummendaten nicht heruntergeladen werden, daher wurden die Dateien nicht gegen die offiziellen Joomla-Kernprüfsummen geprüft. Der Scan wurde dennoch abgeschlossen, es wurde jedoch keine Datei als Kern- oder Nicht-Kerndatei markiert. Dies ist in der Regel ein vorübergehendes Netzwerkproblem. Prüfen Sie die Optionen \"CoreSums-Dienst-URL\" und \"Zeitlimit für den CoreSums-Download\" in der Komponentenkonfiguration, falls es weiterhin auftritt."
COM_ADMINTOOLS_CORESUMS_WARN_DISMISS="Ausblenden"

COM_ADMINTOOLS_CONTROLPANEL_LBL_DONATE="Spenden"

