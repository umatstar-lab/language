COM_ADMINTOOLS_HTACCESSMAKER_LBL_RESTRICTIP_DESC="Schränken Sie den Zugriff auf Ihren Server nur auf die unten ausgewählten IPs und IP-Bereiche ein. Verwenden Sie 'Keine', um diese Funktion zu deaktivieren (Standard). Sie sollten diese Funktion nur verwenden, wenn Ihre Website hinter einem Load Balancer, Reverse Proxy oder CDN betrieben wird. Optionen außer Keine, Benutzerdefinierte Liste und Internes Netzwerk versuchen, eine aktuelle Liste von IPs vom jeweiligen Anbieter abzurufen."
