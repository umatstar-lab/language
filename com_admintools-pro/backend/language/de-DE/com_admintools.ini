COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW="Ansichtsname"
COM_ADMINTOOLS_WAFDENYLISTS_LBL_VIEW_DESC="Die Ansicht (Komponentenbereich) oder der Controller-Name der Komponente, der in der URL vorhanden sein muss, damit diese Regel zutrifft. Deaktivieren Sie SEF-URLs, und Sie werden entweder <code>view=AnsichtsName</code> oder <code>task=AnsichtsName.AufgabenName</code> sehen, wobei <var>AnsichtsName</var> der hier einzugebende Ansichtsname ist. Ein leeres Feld stimmt mit allen Ansichten überein."
