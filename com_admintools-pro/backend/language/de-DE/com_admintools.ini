COM_ADMINTOOLS_HTACCESSMAKER_ERR_RESTRICTIP_EMPTY_HEAD="Zugriff nach IP einschränken: Die Liste der erlaubten IP-Adressen ist leer"
COM_ADMINTOOLS_HTACCESSMAKER_ERR_RESTRICTIP_EMPTY="Zugriff nach IP einschränken ist auf Benutzerdefinierte Liste gesetzt, aber es gibt keine erlaubten IP-Bereiche für den Zugriff. Damit wären alle von Ihrer Website ausgesperrt, auch Sie selbst. Deshalb schränkt die erzeugte Datei den Zugriff nach IP überhaupt nicht ein. Fügen Sie die IP-Adressen oder IP-Bereiche hinzu, die Zugriff auf Ihre Website haben sollen, oder setzen Sie Zugriff nach IP einschränken auf Keine."
COM_ADMINTOOLS_HTACCESSMAKER_WARN_SKIPPED_USERAGENTS_HEAD="Einige zu sperrende User-Agents werden ausgelassen"
COM_ADMINTOOLS_HTACCESSMAKER_WARN_SKIPPED_USERAGENTS="Zugriff von bestimmten User-Agents blockieren ist aktiviert, aber die folgenden Einträge von Zu sperrende User-Agents sind keine regulären Ausdrücke, die dieser Server verwenden kann, z. B. wegen einer nicht geschlossenen Klammer, eines Steuerzeichens oder einer Syntax, die dieser Server nicht unterstützt. Die erzeugte Datei lässt sie aus, damit Ihre Website weiter funktioniert; die anderen User-Agents werden weiterhin blockiert. Korrigieren oder entfernen Sie diese Einträge."
COM_ADMINTOOLS_NGINXCONFMAKER_WARN_RESTRICTIP_REALIP_HEAD="Zugriff nach IP einschränken wird nicht angewendet"
COM_ADMINTOOLS_NGINXCONFMAKER_WARN_RESTRICTIP_REALIP="Zugriff nach IP einschränken ist aktiviert, aber IP-Weiterleitung erlauben vertraut den Reverse Proxy / Load Balancer IPs. NginX prüft dann die IP-Adresse des Besuchers aus dem Header X-Forwarded-For statt der Adresse Ihres Reverse Proxys oder CDN, sodass das Zulassen nur der ausgewählten IP-Adressen jeden Besucher abweisen würde. Die erzeugte Datei schränkt den Zugriff nicht nach IP ein. Beschränken Sie stattdessen in der Firewall Ihres Servers, welche IP-Adressen ihn erreichen können, oder deaktivieren Sie IP-Weiterleitung erlauben."
