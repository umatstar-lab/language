;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Password-protect Administrator
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
COM_ADMINTOOLS_TITLE_ADMINPASSWORD="Administrator-Bereich mit Passwort schützen"

COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOPASSWORD="Sie müssen ein Passwort angeben"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTAPPLIED="Der Passwortschutz konnte nicht aktiviert werden. Bitte aktivieren Sie die FTP-Schicht in der globalen Konfiguration Ihrer Website."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOTUNAPPLIED="Der Passwortschutz konnte nicht entfernt werden. Bitte aktivieren Sie die FTP-Schicht in der globalen Konfiguration Ihrer Website."
COM_ADMINTOOLS_ADMINPASSWORD_ERR_NOUSERNAME="Sie müssen einen Benutzernamen angeben"
COM_ADMINTOOLS_ADMINPASSWORD_ERR_PASSWORDNOMATCH="Die Passwörter stimmen nicht überein"

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HOWITWORKS="Wie funktioniert das?"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_INFO="Wenn der Passwortschutz aktiviert ist, fordert Ihr Browser Sie bei jedem Aufruf einer geschützten Ressource im Ordner <code>administrator</code> zur Eingabe eines Benutzernamens und eines Passworts auf. Sie müssen den Benutzernamen und das Passwort eingeben, die Sie auf dieser Seite festgelegt haben. Dieser Benutzername und dieses Passwort sind <em>gemeinsam</em> für alle Personen, die Ihre Website verwalten, und <em>müssen sich</em> von Ihrem Joomla!-Login <em>unterscheiden</em>. Dies funktioniert auf Server-Ebene über eine <code>.htaccess</code>-Datei im Ordner <code>administrator</code> Ihrer Website. Ihr Server muss den Verzeichnis-Passwortschutz mit .htaccess-Dateien unterstützen, damit diese Funktion wirksam ist. Falls Sie sich nicht sicher sind, fragen Sie bitte Ihren Hosting-Anbieter."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_WARN="Bitte beachten Sie, dass dieser Schutz auch dann aktiv bleibt, wenn Sie Admin Tools deaktivieren oder deinstallieren. Falls Ihr Administrator-Bereich nicht mehr zugänglich ist oder Sie den Passwortschutz entfernen müssen, ohne Zugriff auf diese Seite zu haben, müssen Sie die Dateien <code>.htaccess</code> und <code>.htpasswd</code> aus dem Verzeichnis <code>administrator</code> Ihrer Website per FTP, SFTP oder dem Dateimanager Ihres Hosting-Kontrollpanels <strong>löschen</strong>."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORDPROTECTION="Administrator-Passwortschutz einrichten"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES="Benutzerdefinierte Fehlerseiten zurücksetzen"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_RESETERRORPAGES_HELP="Setzt die benutzerdefinierten Apache-Fehlerseiten für HTTP 401 und 403 auf die Standardeinstellungen zurück. Dies verhindert einen 404-Fehler „Artikel nicht gefunden“, wenn nach der Aktivierung des Administrator-Passwortschutzes versucht wird, auf die Administrator-Anmeldeseite zuzugreifen. Es wird dringend empfohlen, diese Option aktiviert zu lassen, es sei denn, sie verursacht einen HTTP 500 Internal Server Error."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE="Zu schützende Administrator-Ressourcen"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_JOOMLA="Joomla"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_PHP="Alle PHP-Dateien"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_EVERYTHING="Alles"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_MODE_HELP="Wählen Sie aus, was mit einem Passwort geschützt werden soll. „Joomla“ schützt nur Joomla!s index.php (den Einstiegspunkt der Administrator-Anwendung). Alles andere, einschließlich .php-Dateien von Drittanbieter-Anwendungen, ist frei zugänglich. „Alle PHP-Dateien“ schützt alle PHP-Dateien im Ordner <code>administrator</code> und seinen Unterverzeichnissen. „Alles“ funktioniert wie ältere Versionen von Admin Tools und verweigert den Zugriff auf jede Datei im Ordner <code>administrator</code> und seinen Unterverzeichnissen, unabhängig von der Dateiendung."

COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE="Passwort-Hashing-Algorithmus"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_HELP="Passwörter werden gehasht in der Datei <code>administrator/.htpasswd</code> gespeichert. Diese Option wählt den Hashing-Algorithmus aus. bCrypt ist der sicherste, wird aber nicht immer unterstützt. APR-1 (Standard) ist sicher genug und wird von den meisten Hosting-Anbietern unterstützt. SHA-1 wird immer unterstützt, gilt aber nicht mehr als sicher. crypt() erlaubt nur Passwörter mit bis zu 8 Zeichen, wird unter Windows nicht unterstützt und gilt als unsicher. „Klartext“ wendet kein Hashing an und sollte NIEMALS für andere Zwecke als zur Fehlerbehebung mit einem Wegwerfpasswort verwendet werden, das als sofort kompromittiert betrachtet werden sollte."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_APR1="APR-1"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_BCRYPT="bCrypt"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_SHA1="SHA-1"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_CRYPT="crypt()"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_HASHTYPE_PLAIN="Klartext"

COM_ADMINTOOLS_ADMINPASSWORD_LBL_USERNAME="Benutzername"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_USERNAME_HELP="Sie müssen diesen Benutzernamen eingeben, bevor Sie die Administrator-Anmeldeseite sehen können."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORD="Passwort"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORD_HELP="Sie müssen dieses Passwort eingeben, bevor Sie die Administrator-Anmeldeseite sehen können."
COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORD2="Passwort wiederholen"
COM_ADMINTOOLS_ADMINPASSWORD_LBL_PASSWORD2_HELP="Bitte geben Sie das Passwort zur Bestätigung erneut ein."

