COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_TITLE="„System debuggen“ sollte deaktiviert sein"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_DESC="Aktivieren Sie „System debuggen“ nur, während Sie ein Problem Ihrer Website untersuchen, idealerweise auf einer privaten Kopie der Website oder für eine sehr begrenzte Zeit. Die Ausgabe kann sensible Informationen oder für Angreifer nützliche Informationen preisgeben."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_MSG_FAIL="„System debuggen“ ist aktiviert. Gehen Sie zu System, Konfiguration, Registerkarte „System“, und setzen Sie „System debuggen“ auf „Nein“."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_MSG_CONSTANT="„System debuggen“ ist in der Konfiguration deaktiviert, aber etwas anderes aktiviert den Debug-Modus von Joomla! auf Ihrer Website. Meist ist das eine Datei <code>defines.php</code> im Stammverzeichnis Ihrer Website oder im Ordner <code>administrator</code>, die die Konstante <code>JDEBUG</code> definiert. Schalten Sie den Debug-Modus dort aus."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_FIX="„System debuggen“ deaktivieren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGSYSTEM_FIX_DONE="„System debuggen“ wurde deaktiviert."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_TITLE="„Sprache debuggen“ sollte deaktiviert sein"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_DESC="„Sprache debuggen“ ist nur für Entwickler und Übersetzer gedacht, die sehen möchten, ob ein Text auf einer Seite aus einem Sprachstring stammt und ob dieser in der aktuellen Sprache übersetzt ist. Auf allen anderen Websites sollte die Option deaktiviert sein."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_MSG_FAIL="„Sprache debuggen“ ist aktiviert. Gehen Sie zu System, Konfiguration, Registerkarte „System“, und setzen Sie „Sprache debuggen“ auf „Nein“."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX="„Sprache debuggen“ deaktivieren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLANGUAGE_FIX_DONE="„Sprache debuggen“ wurde deaktiviert."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_TITLE="$live_site sollte in der configuration.php leer sein"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_DESC="Die Option <code>$live_site</code> ist ein veralteter Workaround für Webserver hinter einem Reverse-Proxy, Load Balancer oder CDN, der entweder keinen HTTP-Header <code>X-Forwarded-Host</code> sendet oder dessen Header der Webserver aufgrund einer Fehlkonfiguration ignoriert. Manche nutzen sie auch, um die URL der Website für die Joomla-CLI festzulegen. Auch davon wird abgeraten: Die Joomla-CLI bietet dafür einen sichereren Weg, ihre Option <code>--live-site=%s</code>."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MATCH="Ihre Website wird unter demselben Hostnamen aufgerufen wie dem in <code>$live_site</code>, Sie benötigen die Option also nicht. Bearbeiten Sie die Datei <code>configuration.php</code> Ihrer Website und leeren Sie die Variable <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_MISMATCH="Ihr Server meldet einen anderen Hostnamen als den in <code>$live_site</code>. Bitten Sie Ihren Hoster, den Webserver so einzurichten, dass er den HTTP-Header <code>X-Forwarded-Host</code> berücksichtigt, den der Reverse-Proxy, Load Balancer oder das CDN vor Ihrer Website sendet. Bearbeiten Sie anschließend die Datei <code>configuration.php</code> Ihrer Website und leeren Sie die Variable <code>$live_site</code>: <code>public $live_site = '';</code>"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LIVESITE_MSG_NOHOST="Ihr Server meldet den HTTP-Header Host nicht. Bitten Sie Ihren Hoster, den Server so zu konfigurieren, dass er ihn setzt. Befindet sich ein Reverse-Proxy, Load Balancer oder CDN vor Ihrer Website, muss dafür möglicherweise der Webserver so eingerichtet werden, dass er den HTTP-Header <code>X-Forwarded-Host</code> berücksichtigt. Bearbeiten Sie anschließend die Datei <code>configuration.php</code> Ihrer Website und leeren Sie die Variable <code>$live_site</code>: <code>public $live_site = '';</code>"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_TITLE="„Fehler berichten“ sollte auf einer Live-Website auf „Keine“ stehen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_DESC="„Fehler berichten“ muss auf Live-Websites auf „Keine“ gesetzt sein. Andernfalls können PHP-Fehler, -Warnungen und -Hinweise unbeabsichtigt sensible Informationen oder für Angreifer nützliche Informationen preisgeben. Verwenden Sie „Maximum“ nur, während Sie ein Problem untersuchen, idealerweise auf einer privaten Kopie der Website."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_MSG_FAIL="„Fehler berichten“ steht nicht auf „Keine“. Gehen Sie zu System, Konfiguration, Registerkarte „Server“, und setzen Sie „Fehler berichten“ auf „Keine“."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX="„Fehler berichten“ auf „Keine“ setzen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ERRORREPORTING_FIX_DONE="„Fehler berichten“ wurde auf „Keine“ gesetzt."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_TITLE="„Gemeinsame Sitzungen“ müssen deaktiviert sein"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_DESC="Gemeinsame Sitzungen sind von Natur aus gefährlich. Wenn sich ein Benutzer im Frontend anmeldet, wird er automatisch auch im Backend angemeldet. Dadurch können Angreifer Credential-Stuffing- und Brute-Force-Angriffe gegen das Frontend durchführen und sind bei Erfolg im Backend angemeldet. Dies kann unvorhergesehene negative Folgen haben und hebelt andere Sicherheitsmaßnahmen, die das Backend Ihrer Website schützen, teilweise aus."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_MSG_FAIL="Gemeinsame Sitzungen sind aktiviert. Gehen Sie zu System, Konfiguration, Registerkarte „System“, und setzen Sie „Gemeinsame Sitzungen“ auf „Nein“."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX="Gemeinsame Sitzungen deaktivieren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_CONFIRM="Das Deaktivieren der gemeinsamen Sitzungen ändert den Namen des Sitzungscookies. Alle, auch Sie, werden von der Website abgemeldet und müssen sich erneut anmelden. Fortfahren?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SHAREDSESSIONS_FIX_DONE="Gemeinsame Sitzungen wurden deaktiviert. Möglicherweise müssen Sie sich erneut anmelden."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_TITLE="configuration.php darf keinen Sitzungsnamen festlegen, solange „Gemeinsame Sitzungen“ deaktiviert sind"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_DESC="Joomla! benennt das Sitzungscookie nach dem Sitzungsnamen. Legt <code>configuration.php</code> einen Sitzungsnamen fest, verwenden Frontend und Backend Ihrer Website dasselbe Sitzungscookie, teilen sich also ihre Sitzungen, obwohl „Gemeinsame Sitzungen“ deaktiviert sind. Das birgt dieselben Risiken wie gemeinsame Sitzungen. Joomla! speichert einen Sitzungsnamen nur, solange „Gemeinsame Sitzungen“ aktiviert sind. Admin Tools 7.9.4 und frühere Versionen haben versehentlich einen in <code>configuration.php</code> geschrieben, wann immer „Temp- und Log-Verzeichnisse prüfen“ den temporären Ordner oder den Log-Ordner Ihrer Website korrigiert hat."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_MSG_FAIL="Die <code>configuration.php</code> Ihrer Website legt einen Sitzungsnamen fest (<code>$session_name</code>), obwohl „Gemeinsame Sitzungen“ deaktiviert sind. Frontend und Backend Ihrer Website teilen sich ihre Sitzungen. Entfernen Sie ihn, zusammen mit weiteren Werten, die nur während des Ladens einer Seite gelten und versehentlich dort hineingeschrieben wurden."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX="Sitzungsnamen entfernen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_CONFIRM="Das Entfernen des Sitzungsnamens ändert den Namen des Sitzungscookies des Frontends. Alle, die im Frontend Ihrer Website angemeldet sind, möglicherweise auch Sie, werden abgemeldet und müssen sich erneut anmelden. Fortfahren?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_STRAYSESSIONNAME_FIX_DONE="Der Sitzungsname wurde aus configuration.php entfernt. Frontend und Backend Ihrer Website teilen sich ihre Sitzungen nicht mehr. Möglicherweise müssen Sie sich erneut anmelden."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_TITLE="Joomla!-Funktionen"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_JOOMLA_DESC="Diese Prüfungen untersuchen Einstellungen von Funktionen des Joomla!-Kerns und von Admin Tools und schlagen für Live-Websites geeignete Werte vor."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_TITLE="Das Debug-Plugin muss deaktiviert oder auf Super-Benutzer beschränkt sein"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_DESC="Verwenden Sie das Plugin „System – Debug“ nur, während Sie ein Problem Ihrer Website untersuchen, idealerweise auf einer privaten Kopie der Website oder für eine begrenzte Zeit. Die Ausgabe kann sensible Informationen enthalten oder Informationen, die ein Angreifer gegen Ihre Website verwenden kann."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_MSG_FAIL="Das Plugin „System – Debug“ ist aktiviert, und Benutzer, die keine Super-Benutzer sind, können seine Ausgabe sehen. Deaktivieren Sie das Plugin auf Live-Websites, oder wählen Sie unter „Erlaubte Gruppen“ ausschließlich die Gruppe Super Users aus. Diese Benutzergruppen können seine Ausgabe derzeit sehen:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX="Debug-Plugin deaktivieren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGPLUGIN_FIX_DONE="Das Plugin „System – Debug“ wurde deaktiviert."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_TITLE="Der Benutzer „admin“ darf nicht existieren oder muss deaktiviert sein"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_DESC="Vorhersehbare Benutzernamen wie <code>admin</code> sind ein beliebtes Ziel von Credential-Stuffing- und Brute-Force-Angriffen. Die Kompromittierung eines solchen Benutzerkontos kann Ihrer Website schweren Schaden zufügen. Selbst mit minimalen Berechtigungen (z. B. nur in der Gruppe Registered) bleibt ein solches Konto gefährlich, wenn Joomla! selbst oder eine Erweiterung eines Drittanbieters eine Sicherheitslücke zur Rechteausweitung aufweist."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_MSG_FAIL="Es gibt ein aktiviertes Benutzerkonto mit dem Benutzernamen <code>admin</code>. Sperren, umbenennen oder löschen Sie es. Es in eine Benutzergruppe mit weniger Rechten zu verschieben, reicht nicht aus."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX="Benutzer sperren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_CONFIRM="Das Benutzerkonto mit dem Namen admin wird gesperrt und kann sich nicht mehr auf Ihrer Website anmelden. Fortfahren?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_FIX_DONE="Das Benutzerkonto mit dem Namen admin wurde gesperrt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SELF="Sie sind als Benutzer admin angemeldet. Sie können Ihr eigenes Benutzerkonto nicht sperren. Benennen Sie es stattdessen um, oder melden Sie sich mit einem anderen Konto an."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINUSER_ERR_SAVE="Das Benutzerkonto mit dem Namen admin konnte nicht gesperrt werden."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_TITLE="Benutzerregistrierung nur bei Bedarf aktivieren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_DESC="Standardmäßig erlaubt Joomla! die Registrierung neuer Benutzer. Dies ist auch dann möglich, wenn Sie kein Anmeldemodul und keinen Menüeintrag für die Benutzeranmeldung oder -registrierung veröffentlicht haben, solange die Option „Benutzerregistrierung“ aktiviert ist. Wenn Sie keine Registrierung von Besuchern benötigen, wie bei den meisten selbst verwalteten Websites, sollten Sie diese Funktion deaktivieren."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_MSG_FAIL="Die Benutzerregistrierung ist aktiviert. Wenn Besucher auf Ihrer Website keine Benutzerkonten registrieren müssen, gehen Sie zu Benutzer, Optionen, Registerkarte „Benutzeroptionen“, und setzen Sie „Benutzerregistrierung“ auf „Nein“."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX="Benutzerregistrierung deaktivieren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_USERREGISTRATION_FIX_DONE="Die Benutzerregistrierung wurde deaktiviert."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_TITLE="Backend-Zugriff auf wenige vertrauenswürdige Personen beschränken"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_DESC="Backend-Zugriff wird selten benötigt, und jeder Benutzer, der ihn hat, vergrößert die Angriffsfläche, die Sie schützen müssen. Prüfen Sie, welche Benutzer tatsächlich Zugriff auf das Backend benötigen und ob sie ihre Arbeit nicht auch im Frontend erledigen könnten. Benutzer, die nur gelegentlich Backend-Zugriff benötigen, sollten aus den Gruppen mit Backend-Zugriff (Super Users, Administrator, Manager) entfernt und erst dann wieder hinzugefügt werden, wenn sie diesen Zugriff benötigen."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_PASS="Aktivierte Benutzerkonten mit Backend-Zugriff: %d."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERCOUNT_MSG_FAIL="%1$d aktivierte Benutzerkonten haben Zugriff auf das Backend; das sind mehr als %2$d."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_TITLE="Multi-Faktor-Authentifizierung für alle Konten mit Backend-Zugriff verwenden"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_DESC="Benutzer mit Backend-Zugriff sind ein bevorzugtes Ziel von Credential-Stuffing- und Brute-Force-Angriffen. Ein einziges kompromittiertes Konto, selbst das eines einfachen Managers, kann Ihrer Website großen Schaden zufügen. Aktivieren Sie für diese Benutzerkonten immer die Multi-Faktor-Authentifizierung. Machen Sie sie verpflichtend, indem Sie zu Benutzer, Optionen, Registerkarte „Multi-Faktor-Authentifizierung“ gehen und unter „Multi-Faktor-Authentifizierung erzwingen“ alle Backend-Benutzergruppen Ihrer Website auswählen."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDMFA_MSG_FAIL="Aktivierte Benutzerkonten mit Backend-Zugriff, die keine Multi-Faktor-Authentifizierung verwenden (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_TITLE="Das Administrator-Verzeichnis mit einem Passwort schützen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_DESC="Ein Passwortschutz für das Administrator-Verzeichnis macht Credential-Stuffing- und Brute-Force-Angriffe weniger wirksam. Selbst wenn die Zugangsdaten eines Benutzers durchsickern, muss der Angreifer noch eine weitere Hürde nehmen, bevor er sich im Backend Ihrer Website anmelden kann. Da der Schutz vom Webserver selbst durchgesetzt wird, ist er sehr effizient und begrenzt die Auswirkungen eines Angreifers, der versucht, eine Backend-Anmeldung per Brute Force zu knacken."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_ADMINPASSWORDPROTECTION_MSG_FAIL="Das Administrator-Verzeichnis ist nicht passwortgeschützt. Schützen Sie es mit der Funktion „Administrator-Bereich mit Passwort schützen“ von Admin Tools."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_TITLE="Einen geheimen URL-Parameter verwenden"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_DESC="Ein geheimer URL-Parameter macht Credential-Stuffing- und Brute-Force-Angriffe weniger wirksam. Selbst wenn die Zugangsdaten eines Benutzers durchsickern, muss der Angreifer noch eine weitere Hürde nehmen, bevor er sich im Backend Ihrer Website anmelden kann."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SECRETURLPARAMETER_MSG_FAIL="Sie haben keinen geheimen URL-Parameter für den Administrator-Bereich festgelegt. Legen Sie einen unter Web Application Firewall, WAF konfigurieren, Registerkarte „Grundlegende Funktionen“, „Geheimer URL-Parameter für den Administrator-Bereich“ fest."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_TITLE="Nie angemeldete Konten entfernen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_DESC="Benutzerkonten, die angelegt wurden, sich aber nie angemeldet haben, sind entweder Spam-Konten, die Sie nicht benötigen, oder vergessene Konten mit möglicherweise kompromittierten Passwörtern. Entfernen Sie sie mit einer geplanten Joomla!-Aufgabe vom Typ „Admin Tools – Inaktive Benutzer löschen“."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_FAIL="Benutzerkonten, die vor mehr als %2$d Tagen registriert wurden und sich nie angemeldet haben: %1$d. Erstellen Sie eine geplante Aufgabe vom Typ „Admin Tools – Inaktive Benutzer löschen“, um sie zu entfernen."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NEVERLOGGEDIN_MSG_TASK="Eine aktivierte geplante Aufgabe vom Typ „Admin Tools – Inaktive Benutzer löschen“ kümmert sich um diese Konten."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_TITLE="Super-Benutzer dürfen sich nicht im Frontend anmelden können"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_DESC="Standardmäßig können sich Super-Benutzer auch im Frontend Ihrer Website anmelden. Dadurch können Angreifer Credential-Stuffing- und Brute-Force-Angriffe gegen das weniger geschützte Frontend durchführen, um das Passwort eines Super-Benutzers herauszufinden. Die Funktion „Frontend-Anmeldung für Super-Administratoren verbieten“ von Admin Tools verhindert, dass sich Super-Benutzer im Frontend anmelden, und durchkreuzt so die Pläne der Angreifer."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_MSG_FAIL="Super-Benutzer können sich im Frontend anmelden. Aktivieren Sie „Frontend-Anmeldung für Super-Administratoren verbieten“ unter Web Application Firewall, WAF konfigurieren, Registerkarte „Härtungsoptionen“."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX="Frontend-Anmeldung für Super-Benutzer verbieten"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SUPERUSERFRONTENDLOGIN_FIX_DONE="Super-Benutzer können sich nicht mehr im Frontend anmelden."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_TITLE="Backend-Benutzer dürfen sich nicht im Frontend anmelden können"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_DESC="Standardmäßig können sich Backend-Benutzer auch im Frontend Ihrer Website anmelden. Dadurch können Angreifer Credential-Stuffing- und Brute-Force-Angriffe gegen das weniger geschützte Frontend durchführen, um das Passwort eines Backend-Benutzers herauszufinden. Bearbeiten Sie die Berechtigungen der Benutzergruppen mit Backend-Zugriff und setzen Sie deren Berechtigung „Site-Anmeldung“ auf „Verweigert“, um die Pläne der Angreifer zu durchkreuzen."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_BACKENDUSERSFRONTENDLOGIN_MSG_FAIL="Aktivierte Benutzerkonten, die sich sowohl im Backend als auch im Frontend anmelden können: %d. Gehen Sie zu System, Konfiguration, Registerkarte „Berechtigungen“, und setzen Sie „Site-Anmeldung“ für diese Benutzergruppen auf „Verweigert“:"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_TITLE="Dateien und Ordner"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_FILES_DESC="Diese Prüfungen suchen nach Dateien und Ordnern, die nicht auf einer Live-Website verbleiben sollten."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_TITLE="Akeeba Kickstart sollte nicht im Web-Stammverzeichnis verbleiben"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_DESC="Kickstart kann jede JPA-, JPS- oder ZIP-Datei an beliebiger Stelle auf Ihrer Website entpacken. In Kombination mit einer Sicherheitslücke für beliebige Datei-Uploads in Joomla! selbst oder in einer Erweiterung eines Drittanbieters kann ein Angreifer so beliebige Dateien auf Ihre Website schreiben, eigenen Code ausführen und Ihre Website hacken. Die Datei umzubenennen oder ein Passwort festzulegen, ist nur eine gute <em>vorübergehende</em> Maßnahme, während Sie ein Backup-Archiv entpacken. Sobald Sie fertig sind, <strong>muss</strong> Kickstart von Ihrer Website entfernt werden."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_MSG_FAIL="Diese Dateien im Stammverzeichnis Ihrer Website sind Kopien von Akeeba Kickstart. Löschen Sie sie."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_KICKSTART_FIX_DONE="%s gelöscht"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_TITLE="Der Ordner installation muss gelöscht werden"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_DESC="Ein nach der Installation von Joomla! oder der Wiederherstellung eines Backups zurückgebliebener Ordner <code>installation</code> kann dazu verwendet werden, Ihre Website zu überschreiben. Er muss entfernt werden, sobald Sie fertig sind."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_MSG_FAIL="Im Stammverzeichnis Ihrer Website befindet sich ein Ordner <code>installation</code>. Löschen Sie ihn."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX="Ordner installation löschen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_CONFIRM="Der Ordner installation im Stammverzeichnis Ihrer Website wird mitsamt seinem gesamten Inhalt gelöscht. Dies kann nicht rückgängig gemacht werden. Fortfahren?"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_INSTALLATIONDIRECTORY_FIX_DONE="Der Ordner installation wurde gelöscht."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_TITLE="Zurückgebliebene Installationsordner von Erweiterungen müssen gelöscht werden"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_DESC="Joomla! verwendet temporäre Ordner <code>install_*</code>, während die Dateien einer Erweiterung an ihren endgültigen Ort kopiert werden, und löscht sie normalerweise sofort. Wird eine Installation nicht sauber abgeschlossen, bleiben sie zurück und können ein Sicherheitsrisiko darstellen. Löschen Sie sie. Sie können auch eine geplante Aufgabe vom Typ „Admin Tools – Temporäres Verzeichnis bereinigen“ erstellen, um dies automatisch zu erledigen."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_MSG_FAIL="Diese zurückgebliebenen Installationsordner befinden sich im temporären Ordner Ihrer Website, <code>%s</code>:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPINSTALLFOLDERS_FIX_DONE="%s gelöscht"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_TITLE="Nicht benötigte Joomla!-Kerndateien entfernen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_DESC="Joomla! liefert im Stammverzeichnis Ihrer Website einige Beispiel- und Informationsdateien mit, die Ihre Website zum Funktionieren nicht benötigt. Sie verraten nur jedem, welche Software Ihre Website verwendet. Joomla! legt sie bei jedem Update wieder an; prüfen Sie also nach jedem Update erneut."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_MSG_FAIL="Diese nicht benötigten Dateien befinden sich im Stammverzeichnis Ihrer Website:"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_HTACCESS="Beispieldatei für .htaccess. Sie hat keine Wirkung, es sei denn, sie wird auf einem Apache- oder LiteSpeed-Webserver in .htaccess umbenannt. Verwenden Sie besser den .htaccess-Generator von Admin Tools."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_LICENSE="Lizenztext von Joomla!. Er muss nicht vorhanden sein, um Joomla! zu verwenden."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_ROBOTS="Beispieldatei für robots.txt. Sie hat keine Wirkung, es sei denn, sie wird in robots.txt umbenannt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FILE_WEBCONFIG="Beispieldatei für web.config. Sie hat keine Wirkung, es sei denn, sie wird auf einem Microsoft IIS-Webserver in web.config umbenannt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_UNNEEDEDCOREFILES_FIX_DONE="%s gelöscht"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_TITLE="Die Debug-Protokolldatei von Admin Tools sollte ausgeschaltet und ihre Protokolldateien gelöscht sein"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_DESC="Die Option „Eine Debug-Protokolldatei führen“ von Admin Tools ist nur zur Fehlersuche gedacht. Aktivieren Sie sie nur für sehr kurze Zeit, idealerweise auf einer privaten Kopie Ihrer Website. Die Protokolldatei zeichnet Anfragedaten auf, die sensible Informationen enthalten können. Wenn Sie mit der Fehlersuche fertig sind, schalten Sie die Option aus und löschen Sie die Protokolldateien."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_ENABLED="Die Option „Eine Debug-Protokolldatei führen“ von Admin Tools ist aktiviert. Schalten Sie sie unter Web Application Firewall, WAF konfigurieren, Registerkarte „Protokollierung &amp; Berichterstattung“ aus."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_MSG_FILES="Die Debug-Protokolldateien von Admin Tools befinden sich noch im Protokollordner Ihrer Website. Löschen Sie sie."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE="Ausschalten"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DELETE="Ausschalten und Protokolldateien löschen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE="Protokolldateien löschen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DISABLE_DONE="Die Debug-Protokolldatei wurde ausgeschaltet."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_DEBUGLOGFILE_FIX_DELETE_DONE="Die Debug-Protokolldatei ist ausgeschaltet, und ihre Protokolldateien wurden gelöscht."

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_TITLE="PHP-Dateiänderungsscanner"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_SCANNER_DESC="Diese Prüfungen verwenden die Informationen, die der PHP-Dateiänderungsscanner beim Scannen Ihrer Website sammelt, oder untersuchen seine Einstellungen."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_TITLE="Den PHP-Dateiänderungsscanner verwenden"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_DESC="Führen Sie den PHP-Dateiänderungsscanner mindestens einmal pro Woche aus, außerdem vor und nach der Installation eines Joomla!-Updates, eines Updates einer Drittanbieter-Erweiterung oder einer neuen Drittanbieter-Erweiterung. Er warnt Sie nicht nur frühzeitig vor möglicherweise kompromittierten Dateien, sondern ermöglicht es Admin Tools auch, Informationen über andere problematische Dateien auf Ihrer Website zu sammeln."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_NEVER="Der PHP-Dateiänderungsscanner hat noch nie einen Scan Ihrer Website abgeschlossen."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_OLD="Der PHP-Dateiänderungsscanner hat den letzten Scan am %1$s abgeschlossen, vor mehr als %2$d Tagen."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SCANNERRECENCY_MSG_PASS="Der PHP-Dateiänderungsscanner hat den letzten Scan am %s abgeschlossen."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_TITLE="In Kernverzeichnissen dürfen keine nicht zum Kern gehörenden Dateien liegen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_DESC="Die Kernverzeichnisse von Joomla! sollten nur die Dateien enthalten, die Joomla! selbst mitliefert. Jede andere Datei darin wurde entweder von einer alten Joomla!-Version zurückgelassen, von einer fehlerhaft arbeitenden Erweiterung dort abgelegt oder von einem Angreifer platziert. Prüfen Sie diese Dateien und entfernen Sie diejenigen, die nicht dorthin gehören. Dateien, die Sie im Scanbericht geprüft und als sicher markiert haben, werden nicht aufgeführt."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_FAIL="Der PHP-Dateiänderungsscanner hat nicht zum Kern gehörende Dateien in Joomla!-Kernverzeichnissen gefunden (%d):"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_NONCOREINCOREFOLDERS_MSG_IGNORED="Dies kann nicht geprüft werden, da der PHP-Dateiänderungsscanner so eingestellt ist, dass er nicht zum Kern gehörende Dateien in Kernverzeichnissen ignoriert. Gehen Sie zu den Optionen von Admin Tools, Registerkarte „Datei-Scanner“, und setzen Sie „Nicht zum Kern gehörende Dateien in Kernverzeichnissen“ auf „Markieren“ oder „Markieren und als Bedrohung melden“. Führen Sie dann einen Scan durch."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_TITLE="PHP-Dateien sollten sich nicht in Medien-, Bild-, Datei- und Sprachordnern befinden"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_DESC="Der Ordner <code>images</code> (und jeder andere Ordner des Medien-Managers), <code>media</code>, <code>files</code>, <code>language</code>, <code>administrator/language</code> und <code>.well-known</code> sind für statische Dateien gedacht: Bilder, Dokumente, CSS, JavaScript und Sprachdateien. PHP-Dateien dort sind sehr oft Hintertüren, die Angreifer über eine verwundbare Erweiterung hochgeladen haben. Prüfen Sie jede einzelne davon; löschen Sie diejenigen, die nicht zu einer von Ihnen verwendeten Erweiterung gehören."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_PHPINMEDIAFOLDERS_MSG_FAIL="PHP-Dateien an Orten, an denen sie nicht sein sollten (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_TITLE="Server-Konfigurationsdateien sollten keine Dateien als PHP ausführen lassen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_DESC="Eine <code>.htaccess</code>-Datei kann den Webserver jede Datei als PHP oder als CGI-Skript ausführen lassen, unabhängig von ihrem Namen (z. B. <code>AddType application/x-httpd-php .jpg</code>), oder die Einstellungen von PHP ändern. Eine <code>.user.ini</code>-Datei kann PHP vor oder nach jedem PHP-Skript eine andere Datei ausführen lassen, sogar ein Bild (<code>auto_prepend_file</code>). Angreifer nutzen sie, um eine harmlos aussehende hochgeladene Datei in eine Hintertür zu verwandeln. Dateien, die nur die Ausführung von Skripten verhindern, z. B. mit <code>SetHandler none</code> oder <code>php_flag engine off</code>, werden nicht gemeldet. Ebenso wenig die Dateien direkt im Stammordner Ihrer Website und im Ordner <code>administrator</code>, wo Hoster damit die PHP-Version auswählen. Prüfen Sie jede aufgeführte Datei; löschen Sie diejenigen, die Sie nicht selbst erstellt haben und die nicht zu einer von Ihnen verwendeten Erweiterung gehören."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_SERVERCONFIGFILES_MSG_FAIL="Server-Konfigurationsdateien, die Dateien als PHP ausführen lassen oder die Einstellungen von PHP ändern (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_TITLE="Dateien und Ordner nicht umbenennen, um alte Versionen aufzubewahren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_DESC="Kopien wie <code>index-bak.php</code>, <code>index.php.old</code>, <code>configuration (1).php</code> oder <code>cassiopeia-copy</code> sind ein gängiger Weg, eine alte Version einer Datei oder eines Ordners aufzubewahren. Sie werden nie aktualisiert, sind möglicherweise weiterhin über das Web erreichbar, können sensible Informationen preisgeben (eine umbenannte Konfigurationsdatei ist ein Geschenk für einen Angreifer) und können alten, verwundbaren Code enthalten. Verwenden Sie stattdessen Backups oder eine Versionsverwaltung; löschen Sie diese Kopien."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_VERSIONEDNAMES_MSG_FAIL="Dateien und Ordner, die wie umbenannte Kopien aussehen (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_TITLE="Große Dateien finden und prüfen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_DESC="Große Dateien außerhalb der Ordner des Medien-Managers und des Ordners <code>files</code> sind oft vergessene Backup-Archive, Datenbank-Dumps oder Protokolldateien. Sie können sensible Informationen preisgeben, wenn sie heruntergeladen werden können, und verschwenden Speicherplatz. Prüfen Sie sie und entfernen Sie diejenigen, die Sie nicht benötigen. Die Größengrenze können Sie in den Optionen von Admin Tools, Registerkarte „Datei-Scanner“, ändern oder diese Prüfung dort ausschalten."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_LARGEFILES_MSG_FAIL="Gefundene große Dateien (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_TITLE="Versteckte Dateien und Ordner"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_DESC="Dateien und Ordner, deren Name mit einem Punkt beginnt, sind in den meisten Dateilisten ausgeblendet. Manche sind legitim, wie <code>.htaccess</code>, <code>.htpasswd</code>, <code>.user.ini</code> und <code>.well-known</code>, die nicht gemeldet werden. Andere, wie <code>.git</code>, <code>.env</code> oder Editor-Einstellungen, verraten Informationen über Ihre Website und sollten sich nicht auf einer Live-Website befinden. Angreifer verstecken ihre Dateien ebenfalls gern auf diese Weise."
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_HIDDENFILES_MSG_FAIL="Gefundene versteckte Dateien und Ordner (%d):"

COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_TITLE="Weitere Werkzeuge"
COM_ADMINTOOLS_SITEHEALTHCHECK_SECTION_OTHER_DESC="Diese Funktionen von Admin Tools können Ihnen helfen, Ihre Website in gutem Zustand zu halten. Hier wird nichts geprüft; sehen Sie sie sich an und entscheiden Sie, ob sie für Sie nützlich sind."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_TITLE="Temporäre Super-Benutzer"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPORARYSUPERUSERS_DESC="Verwenden Sie „Temporäre Super-Benutzer“, wenn Sie jemandem für begrenzte Zeit Super-Benutzer-Zugriff gewähren müssen, z. B. einem Erweiterungsentwickler, der ein Problem auf Ihrer Website untersucht. Das Konto läuft automatisch ab."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_TITLE="Berechtigungen konfigurieren und Berechtigungen reparieren"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_FILEPERMISSIONS_DESC="Prüfen Sie Eigentümer und Berechtigungen der Dateien und Ordner Ihrer Website und wenden Sie sinnvolle Berechtigungen an, die zu Ihrem Anwendungsfall und Ihrer Serverkonfiguration passen."

COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_TITLE="Temp- und Log-Verzeichnisse prüfen"
COM_ADMINTOOLS_SITEHEALTHCHECK_CHECK_TEMPANDCACHEFOLDERS_DESC="Führen Sie „Temp- und Log-Verzeichnisse prüfen“ aus dem Bereich „Werkzeuge“ der Systemsteuerung ab und zu aus, um sicherzustellen, dass die temporären und Protokollordner Ihrer Website existieren und beschreibbar sind."

COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_LABEL="Website-Zustandsprüfung: ausgeschlossene Ordner und Dateien einbeziehen"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKIGNOREEXCLUSIONS_DESC="Beim Scannen sammelt der PHP-Dateiänderungsscanner auch Informationen für die Website-Zustandsprüfung: PHP-Dateien in Medienordnern, umbenannte Kopien, große Dateien und versteckte Dateien. Wenn aktiviert, werden diese Informationen auch in den Ordnern und Dateien gesammelt, die Sie vom Scannen ausgeschlossen haben; diese werden weiterhin nicht auf Änderungen gescannt. Die integrierten Ausschlüsse von Admin Tools (temporäre, Protokoll- und Cache-Ordner) werden immer übersprungen."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_LABEL="Website-Zustandsprüfung: große Dateien melden"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILES_DESC="Ermöglicht der Website-Zustandsprüfung, große Dateien aufzulisten, die der PHP-Dateiänderungsscanner auf Ihrer Website gefunden hat, damit Sie sie prüfen können. Dateien in den Ordnern des Medien-Managers (z. B. <code>images</code>) und im Ordner <code>files</code> werden nie gemeldet, da dort große Dateien zu erwarten sind."
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_LABEL="Website-Zustandsprüfung: Größe großer Dateien (MiB)"
COM_ADMINTOOLS_JCONFIG_HEALTHCHECKLARGEFILESIZE_DESC="Dateien ab dieser Größe in MiB werden von der Website-Zustandsprüfung als große Dateien gemeldet. Die Einstellung wird beim nächsten Lauf des PHP-Dateiänderungsscanners wirksam."
