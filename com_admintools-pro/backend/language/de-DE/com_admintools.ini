COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_TITLE="Admin Tools: Fehlerbehebungs-E-Mail"
COM_ADMINTOOLS_MAIL_TROUBLESHOOTING_DESC="Wird gesendet, wenn Sie eine Änderung in der Admin Tools-Konfiguration vornehmen, die Sie von Ihrer Website aussperren könnte."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_SUBJECT="Admin Tools Fehlerbehebungsinformationen"
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY="Hallo {USER},\n\nSie haben gerade {ACTION} mithilfe der Admin Tools-Komponente auf Ihrer Website „{SITENAME}“ durchgeführt. Dies ist im Allgemeinen ein sicherer Vorgang. In manchen Fällen kann es durch ein Missverständnis, ein Versehen oder durch einen Browser oder Server, der Ihre Einstellungen verfälscht, dazu kommen, dass Ihre Website nicht mehr ordnungsgemäß funktioniert oder nicht mehr erreichbar ist. Dies gilt sowohl für Joomla selbst als auch für verschiedene Erweiterungen von Drittanbietern. Sollte dieser unwahrscheinliche Fall eintreten, konsultieren Sie bitte die folgenden URLs für Fehlerbehebungsanweisungen:\n\n{TROUBLESHOOTING_URLS}\n\nWenn Sie keine Lösung eigenständig finden können und ein aktives Abonnement für Admin Tools haben, eröffnen Sie bitte ein Support-Ticket auf unserer Website https://www.akeeba.com und teilen Sie uns mit, was Sie vor dem Auftreten des Problems getan haben, worin das Problem besteht und welche Fehlerbehebungsschritte Sie bereits versucht haben.\n\nWer hat diese E-Mail gesendet?\n======================================================================\n\nDiese E-Mail wird automatisch von Admin Tools, das auf Ihrer Website ausgeführt wird, an die in Ihrem Joomla-Benutzerprofil hinterlegte E-Mail-Adresse gesendet, und zwar jedes Mal, wenn Sie eine administrative Aktion durchführen, die Sie versehentlich von Ihrer Website aussperren könnte. Sie wird nicht an andere Benutzer Ihrer Website gesendet.\n\nWenn Sie diese E-Mails nicht mehr erhalten möchten, melden Sie sich bitte im Administrator-Backend Ihrer Website an und navigieren Sie zu Komponenten, Admin Tools, Web Application Firewall, WAF konfigurieren, und klicken Sie auf die Registerkarte „Anpassung“. Suchen Sie die Option „Fehlerbehebungs-E-Mail bei administrativen Funktionen senden“ und setzen Sie sie auf „Nein“."
COM_ADMINTOOLS_EMAIL_TROUBLESHOOTING_BODY_HTML="<p>Hallo {USER},</p><p>Sie haben gerade {ACTION} mithilfe der Admin Tools-Komponente auf Ihrer Website „{SITENAME}“ durchgeführt. Dies ist im Allgemeinen ein sicherer Vorgang. In manchen Fällen kann es durch ein Missverständnis, ein Versehen oder durch einen Browser oder Server, der Ihre Einstellungen verfälscht, dazu kommen, dass Ihre Website nicht mehr ordnungsgemäß funktioniert oder nicht mehr erreichbar ist. Dies gilt sowohl für Joomla selbst als auch für verschiedene Erweiterungen von Drittanbietern. Sollte dieser unwahrscheinliche Fall eintreten, konsultieren Sie bitte die folgenden URLs für Fehlerbehebungsanweisungen:</p>{TROUBLESHOOTING_URLS_HTML}<p>Wenn Sie keine Lösung eigenständig finden können und ein aktives Abonnement für Admin Tools haben, eröffnen Sie bitte ein Support-Ticket auf unserer Website https://www.akeeba.com und teilen Sie uns mit, was Sie vor dem Auftreten des Problems getan haben, worin das Problem besteht und welche Fehlerbehebungsschritte Sie bereits versucht haben.</p><h3>Wer hat diese E-Mail gesendet?</h3><p>Diese E-Mail wird automatisch von Admin Tools, das auf Ihrer Website ausgeführt wird, an die in Ihrem Joomla-Benutzerprofil hinterlegte E-Mail-Adresse gesendet, und zwar jedes Mal, wenn Sie eine administrative Aktion durchführen, die Sie versehentlich von Ihrer Website aussperren könnte. Sie wird nicht an andere Benutzer Ihrer Website gesendet.</p><p>Wenn Sie diese E-Mails nicht mehr erhalten möchten, melden Sie sich bitte im Administrator-Backend Ihrer Website an und navigieren Sie zu Komponenten, Admin Tools, Web Application Firewall, WAF konfigurieren, und klicken Sie auf die Registerkarte „Anpassung“. Suchen Sie die Option „Fehlerbehebungs-E-Mail bei administrativen Funktionen senden“ und setzen Sie sie auf „Nein“.</p>"

COM_ADMINTOOLS_MAIL_CONFIGMONITOR_TITLE="Admin Tools: Konfigurationsrüberwachung"
COM_ADMINTOOLS_MAIL_CONFIGMONITOR_DESC="Wird von Admin Tools gesendet, wenn Sie eine Änderung in Ihrer globalen Konfiguration oder in den Konfigurationsoptionen einer Komponente vornehmen, sofern die Optionen „Globale Konfiguration überwachen“ und/oder „Komponentenkonfiguration überwachen“ in der Web Application Firewall aktiviert sind."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_SUBJECT="Konfigurationsoptionen für {AREA} auf {SITENAME} wurden geändert"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass die Konfigurationsoptionen für {AREA} auf Ihrer Website {SITENAME} vom Benutzer {USER} geändert wurden. Die geänderten Einstellungen sind nachfolgend aufgeführt:\n\n{INFO}\n\nWeitere Details zur Herkunft dieser Änderung finden Sie nachfolgend:\n\nIP-Adresse: {IP} (IP-Abfrage: {LOOKUP})\nUser-Agent: {UA}\n\nWenn diese Änderung nicht von Ihnen oder einem von Ihnen vertrauenswürdigen Administrator vorgenommen wurde, überprüfen Sie Ihre Website bitte sofort, da dies ein Hinweis auf Hacking-Aktivitäten sein könnte.\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass die Konfigurationsoptionen für {AREA} auf Ihrer Website {SITENAME} vom Benutzer {USER} geändert wurden. Die geänderten Einstellungen sind nachfolgend aufgeführt:</p>{INFO_HTML}<p>Weitere Details zur Herkunft dieser Änderung finden Sie nachfolgend:</p><ul><li>IP-Adresse: {IP} (<a href=\"{LOOKUP}\">IP-Abfrage</a>)</li><li>User-Agent: {UA}</li></ul><p>Wenn diese Änderung nicht von Ihnen oder einem von Ihnen vertrauenswürdigen Administrator vorgenommen wurde, überprüfen Sie Ihre Website bitte sofort, da dies ein Hinweis auf Hacking-Aktivitäten sein könnte.</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_CHANGED="Geänderte Optionen"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_ADDED="Hinzugefügte Optionen"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REMOVED="Entfernte Optionen"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_REDACTED="(geändert; Wert aus Sicherheitsgründen ausgeblendet)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPAQUE="(geändert)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_EMPTY="(leer)"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OPTION="Option"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_OLD="Vorheriger Wert"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_NEW="Neuer Wert"
; Diff layout strings. Override these to restyle the changed-options table in the notification email.
; Plain text: %1$s = option label, %2$s = previous value, %3$s = new value (as applicable).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_SECTION="%s:"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_CHANGED="  %1$s: %2$s → %3$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_ADDED="  %1$s: %2$s"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_REMOVED="  %1$s: %2$s"
; Opaque line: the value is not shown (sensitive, compound, or a custom field type). %1$s = label, %2$s = marker.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_TEXT_OPAQUE="  %1$s: %2$s"
; HTML: %s in the section is the section title; in a row %1$s = label, %2$s = previous value, %3$s = new value;
; in the table %1$s = Option header, %2$s = Previous value header, %3$s = New value header, %4$s = the rows.
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_SECTION="<tr><th colspan=\"3\" style=\"text-align:left;background:#f0f0f0;\">%s</th></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW="<tr><td>%1$s</td><td>%2$s</td><td>%3$s</td></tr>"
; Opaque HTML row: %1$s = label, %2$s = marker (spans the previous/new value columns).
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_ROW_OPAQUE="<tr><td>%1$s</td><td colspan=\"2\">%2$s</td></tr>"
COM_ADMINTOOLS_EMAIL_CONFIGMONITOR_DIFF_HTML_TABLE="<table border=\"1\" cellpadding=\"4\" cellspacing=\"0\"><thead><tr><th>%1$s</th><th>%2$s</th><th>%3$s</th></tr></thead><tbody>%4$s</tbody></table>"

COM_ADMINTOOLS_MAIL_USERREACTIVATE_TITLE="Admin Tools: Benutzer-Reaktivierung"
COM_ADMINTOOLS_MAIL_USERREACTIVATE_DESC="Wird von Admin Tools gesendet, wenn ein Benutzerkonto aufgrund zu vieler fehlgeschlagener Anmeldeversuche vorübergehend deaktiviert wurde."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_SUBJECT="Benutzerkonto auf {SITENAME} vorübergehend gesperrt"
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY="Hallo,\n\nWir haben mehrere fehlgeschlagene Anmeldeversuche mit dem Benutzerkonto {USER} auf unserer Website {SITENAME} festgestellt. Infolgedessen hat unser System am {DATE} automatisch eine vorübergehende Sperre für das Benutzerkonto eingerichtet.\n\nWenn Sie der Meinung sind, dass Sie diese Nachricht irrtümlicherweise erhalten haben, d. h. wenn Sie selbst versehentlich versucht haben, sich mit dem falschen Passwort anzumelden, klicken Sie bitte auf den folgenden Link, um die vorübergehende Sperre von Ihrem Benutzerkonto aufzuheben:\n{ACTIVATE}\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie ein Benutzerkonto auf {SITENAME} haben. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_USER_REACTIVATE_BODY_HTML="<p>Hallo,</p><p>Wir haben mehrere fehlgeschlagene Anmeldeversuche mit dem Benutzerkonto {USER} auf unserer Website {SITENAME} festgestellt. Infolgedessen hat unser System am {DATE} automatisch eine vorübergehende Sperre für das Benutzerkonto eingerichtet.</p><p>Wenn Sie der Meinung sind, dass Sie diese Nachricht irrtümlicherweise erhalten haben, d. h. wenn Sie selbst versehentlich versucht haben, sich mit dem falschen Passwort anzumelden, klicken Sie bitte auf den folgenden Link, um die vorübergehende Sperre von Ihrem Benutzerkonto aufzuheben:</p><p><a href=\"{ACTIVATE}\">{ACTIVATE}</a></p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Hinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie ein Benutzerkonto auf {SITENAME} haben. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_TITLE="Admin Tools: Fehlgeschlagene Administrator-Anmeldung"
COM_ADMINTOOLS_MAIL_ADMINLOGINFAIL_DESC="Wird von Admin Tools gesendet, wenn ein fehlgeschlagener Backend-Anmeldeversuch stattfindet, sofern die entsprechende Funktion aktiviert ist."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_SUBJECT="Fehlgeschlagene Administrator-Anmeldung für Benutzer {USER} auf {SITENAME}"
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass sich Benutzer {USER} nicht erfolgreich im Administrator-Backend-Bereich Ihrer Website {SITENAME} anmelden konnte. Weitere Informationen:\n\nBenutzername: {USER}\nIP-Adresse: {IP} ({LOOKUP})\nBrowser-User-Agent-Zeichenkette: {UA}\n\nWenn dies erwartet war, müssen Sie nichts unternehmen. Wenn Sie einen Hacking-Versuch vermuten, melden Sie sich bitte sofort im Backend Ihrer Website an und aktivieren Sie umgehend den Notfall-Offline-Modus von Admin Tools.\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_ADMINLOGINFAIL_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass sich Benutzer <strong>{USER}</strong> <strong>nicht</strong> erfolgreich im Administrator-Backend-Bereich Ihrer Website {SITENAME} anmelden konnte. Weitere Informationen:</p><p>Benutzername: {USER}<br />IP-Adresse: {IP} (<a href=\"{LOOKUP}\">IP-Abfrage</a>)<br />Browser-User-Agent-Zeichenkette: {UA}</p><p>Wenn dies erwartet war, müssen Sie nichts unternehmen. Wenn Sie einen Hacking-Versuch vermuten, melden Sie sich bitte sofort im Backend Ihrer Website an und aktivieren Sie umgehend den Notfall-Offline-Modus von Admin Tools.</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_TITLE="Admin Tools: Erfolgreiche Administrator-Anmeldung"
COM_ADMINTOOLS_MAIL_ADMINLOGINSUCCESS_DESC="Wird von Admin Tools gesendet, wenn ein erfolgreicher Backend-Anmeldeversuch stattfindet, sofern die entsprechende Funktion aktiviert ist."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_SUBJECT="Benutzer {USER} hat sich im Administrator-Bereich von {SITENAME} angemeldet"
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass sich Benutzer {USER} gerade im Administrator-Backend-Bereich Ihrer Website {SITENAME} angemeldet hat. Weitere Informationen:\n\nBenutzername: {USER}\nIP-Adresse: {IP} ({LOOKUP})\nBrowser-User-Agent-Zeichenkette: {UA}\n\nWenn dies erwartet war, müssen Sie nichts unternehmen. Wenn Sie einen Hacking-Versuch vermuten, melden Sie sich bitte sofort im Backend Ihrer Website an und aktivieren Sie umgehend den Notfall-Offline-Modus von Admin Tools.\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_ADMINLOGINSUCCESS_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass sich Benutzer <strong>{USER}</strong> gerade im Administrator-Backend-Bereich Ihrer Website {SITENAME} angemeldet hat. Weitere Informationen:</p><p>Benutzername: {USER}<br />IP-Adresse: {IP} (<a href=\"{LOOKUP}\">IP-Abfrage</a>)<br />Browser-User-Agent-Zeichenkette: {UA}</p><p>Wenn dies erwartet war, müssen Sie nichts unternehmen. Wenn Sie einen Hacking-Versuch vermuten, melden Sie sich bitte sofort im Backend Ihrer Website an und aktivieren Sie umgehend den Notfall-Offline-Modus von Admin Tools.</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_IPAUTOBAN_TITLE="Admin Tools: Automatische IP-Sperrung"
COM_ADMINTOOLS_MAIL_IPAUTOBAN_DESC="Wird von Admin Tools gesendet, wenn eine IP-Adresse automatisch gesperrt wird, sofern eine oder mehrere E-Mail-Adressen für diese Funktion ausgewählt wurden. Dies schließt auch die Rettungsmodus-Anweisungen ein; wir empfehlen Ihnen, "
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_SUBJECT="Benachrichtigung über automatische IP-Sperrung für {IP} auf {SITENAME}"
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass die IP-Adresse {IP} vorübergehend vom Zugriff auf Ihre Website {SITENAME} gesperrt wird. Weitere Einzelheiten finden Sie nachfolgend.\n\nIP-Adresse: {IP} (IP-Abfrage: {LOOKUP})\nGrund der letzten blockierten Anfrage: {REASON}\nGesperrt bis: {UNTIL}\n\n{RESCUEINFO}\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nSie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_IPAUTOBAN_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass die IP-Adresse {IP} vorübergehend vom Zugriff auf Ihre Website {SITENAME} gesperrt wird. Weitere Einzelheiten finden Sie nachfolgend.</p><p>IP-Adresse: {IP} (<a href=\"{LOOKUP}\">IP-Abfrage</a>)<br />Grund der letzten blockierten Anfrage: {REASON}<br />Gesperrt bis: {UNTIL}</p><p>{RESCUEINFO}</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_TITLE="Admin Tools: Kritische Datei geändert"
COM_ADMINTOOLS_MAIL_CRITICALFILES_DESC="Wird von Admin Tools gesendet, wenn eine „kritische Datei“ geändert wurde."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_SUBJECT="Kritische Datei auf {SITENAME} geändert"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass eine oder mehrere kritische Dateien auf Ihrer Website {SITENAME} geändert wurden. Die Liste der auf Ihrer Website geänderten Dateien lautet wie folgt:\n\n{INFO}\n\nSollte ich mir Sorgen machen?\n======================================================================\n\n„Kritische Dateien“ sind im Kontext dieser E-Mail-Nachricht die Dateien, auf die Hacker bei einem erfolgreichen Angriff auf eine Website am häufigsten abzielen. Diese Dateien können auch und werden häufig aus legitimen Gründen geändert. Zum Beispiel werden sie geändert, wenn Sie die globale Konfiguration Ihrer Website speichern oder wenn Sie Joomla! oder eines seiner Templates aktualisieren.\n\nSie müssen sich KEINE Sorgen machen, wenn Sie diese E-Mail erhalten haben, nachdem Sie oder ein anderer von Ihnen vertrauenswürdiger Administrator eine der folgenden Änderungen an Ihrer Website vorgenommen hat:\n\n* Wiederherstellung der Dateien und/oder des Datenbankinhalts der Website aus einem Backup\n* Änderung der globalen Konfiguration\n* Aktualisierung von Joomla!\n* Aktualisierung eines Website-Templates\n\nWenn diese Nachricht NICHT als Ergebnis einer solchen erwünschten und erwarteten Änderung an Sie gesendet wurde, überprüfen Sie Ihre Website bitte sofort, da dies ein Hinweis auf Hacking-Aktivitäten sein könnte; oder eine Erweiterung oder andere Software von Drittanbietern führt etwas durch, dessen Sie sich nicht bewusst waren und das sich nachteilig auf Ihre Website auswirken könnte.\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass eine oder mehrere kritische Dateien auf Ihrer Website {SITENAME} geändert wurden. Die Liste der auf Ihrer Website geänderten Dateien lautet wie folgt:</p>{INFO_HTML}<h3>Sollte ich mir Sorgen machen?</h3><p>„Kritische Dateien“ sind im Kontext dieser E-Mail-Nachricht die Dateien, auf die Hacker bei einem erfolgreichen Angriff auf eine Website am häufigsten abzielen. Diese Dateien können auch <em>und werden häufig</em> aus legitimen Gründen geändert. Zum Beispiel werden sie geändert, wenn Sie die globale Konfiguration Ihrer Website speichern oder wenn Sie Joomla! oder eines seiner Templates aktualisieren.</p><p>Sie müssen sich <strong>KEINE</strong> Sorgen machen, wenn Sie diese E-Mail erhalten haben, nachdem Sie oder ein anderer von Ihnen vertrauenswürdiger Administrator eine der folgenden Änderungen an Ihrer Website vorgenommen hat:</p><ul><li>Wiederherstellung der Dateien und/oder des Datenbankinhalts der Website aus einem Backup</li><li>Änderung der globalen Konfiguration</li><li>Aktualisierung von Joomla!</li><li>Aktualisierung eines Website-Templates</li></ul><p>Wenn diese Nachricht NICHT als Ergebnis einer solchen erwünschten und erwarteten Änderung an Sie gesendet wurde, überprüfen Sie Ihre Website bitte sofort, da dies ein Hinweis auf Hacking-Aktivitäten sein könnte; oder eine Erweiterung oder andere Software von Drittanbietern führt etwas durch, dessen Sie sich nicht bewusst waren und das sich nachteilig auf Ihre Website auswirken könnte.</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_TITLE="Admin Tools: Überwachte Datei geändert"
COM_ADMINTOOLS_MAIL_CRITICALFILES_GLOBAL_DESC="Wird von Admin Tools gesendet, wenn eine oder mehrere Dateien, die Sie zur Überwachung auf Änderungen ausgewählt haben, geändert wurden."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_SUBJECT="Überwachte Dateien auf {SITENAME} geändert"
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass eine oder mehrere Dateien, die Sie Admin Tools zur Überwachung auf Änderungen aufgetragen haben, auf Ihrer Website {SITENAME} geändert wurden. Die Liste der auf Ihrer Website geänderten Dateien lautet wie folgt:\n\n{INFO}\n\nWenn diese Nachricht nicht als Ergebnis einer solchen erwünschten und erwarteten Änderung an Sie gesendet wurde, überprüfen Sie Ihre Website bitte sofort, da dies ein Hinweis auf Hacking-Aktivitäten sein könnte.\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_CRITICALFILES_GLOBAL_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass eine oder mehrere Dateien, die Sie Admin Tools zur Überwachung auf Änderungen aufgetragen haben, auf Ihrer Website {SITENAME} geändert wurden. Die Liste der auf Ihrer Website geänderten Dateien lautet wie folgt:</p>{INFO_HTML}<p>Wenn diese Nachricht nicht als Ergebnis einer solchen erwünschten und erwarteten Änderung an Sie gesendet wurde, überprüfen Sie Ihre Website bitte sofort, da dies ein Hinweis auf Hacking-Aktivitäten sein könnte.</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_TITLE="Admin Tools: Super-Benutzer hinzugefügt"
COM_ADMINTOOLS_MAIL_SUPERUSERSLIST_DESC="Wird von Admin Tools gesendet, wenn ein Super-Benutzer erstellt wurde und die Funktion „Super-Benutzerkonten überwachen“ aktiviert ist."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_SUBJECT="Super-Benutzer wurden zu {SITENAME} hinzugefügt"
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass wir das verdächtige Hinzufügen eines oder mehrerer Super-Benutzerkonten auf Ihrer Website {SITENAME} festgestellt haben. Diese neuen Super-Benutzerkonten scheinen nicht auf dem regulären Weg, d. h. über die Joomla-Seite „Benutzer“, erstellt worden zu sein. Daher wurden sie gesperrt. Die neu erkannten und gesperrten Super-Benutzerkonten sind:\n\n{INFO}\n\nMuss ich mir Sorgen machen?\n======================================================================\n\nSuper-Benutzerkonten haben vollen Zugriff auf Ihre Website. Sie können alle Inhalte ohne Einschränkung ändern. Sie können auch Software installieren, die auf jeden Aspekt Ihrer Website zugreifen oder ihn ändern kann, einschließlich beliebiger Dateien, Datenbankinhalts und Konfigurationseinstellungen. Gewähren Sie nur Personen, denen Sie vertrauen, Super-Benutzer-Zugriff.\n\nWenn Sie diese E-Mail erhalten, bedeutet das, dass diese Super-Benutzerkonten außerhalb der Joomla-Seite „Benutzer“ erstellt wurden. Dies bedeutet typischerweise, dass ein Hacker einen Weg gefunden hat, die Sicherheit Ihrer Website oder Ihres Servers zu umgehen, und versucht hat, heimlich Super-Benutzerkonten für sich selbst zu erstellen. Aus diesem Grund wurden diese Konten gesperrt, d. h. sie können nicht zur Anmeldung auf Ihrer Website verwendet werden.\n\nEs ist jedoch möglich, dass Sie diese E-Mail irrtümlicherweise erhalten: wenn Sie oder ein anderer Super-Benutzer beabsichtigt haben, diese Super-Benutzerkonten zu erstellen und dazu ein Drittanbieter-Tool verwendet haben. In diesem Fall brauchen Sie sich keine Sorgen zu machen. Melden Sie sich einfach mit Ihrem eigenen Super-Benutzer-Konto im Administrator-Backend Ihrer Website an, gehen Sie zur Seite „Benutzer“, bearbeiten Sie die weiter oben in dieser E-Mail aufgeführten Benutzer und heben Sie deren Sperrung auf.\n\nWenn Sie oder ein anderer Super-Benutzer diese Super-Benutzer NICHT erstellen wollten, empfehlen wir Ihnen, Ihre Website und Ihren Server auf weitere Anzeichen ungewöhnlicher Aktivitäten zu überprüfen.\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_SUPERUSERSLIST_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass wir das verdächtige Hinzufügen eines oder mehrerer Super-Benutzerkonten auf Ihrer Website {SITENAME} festgestellt haben. Diese neuen Super-Benutzerkonten scheinen nicht auf dem regulären Weg, d. h. über die Joomla-Seite „Benutzer“, erstellt worden zu sein. Daher wurden sie gesperrt. Die neu erkannten <strong>und gesperrten</strong> Super-Benutzerkonten sind:</p>{INFO_HTML}<h3>Muss ich mir Sorgen machen?</h3><p>Super-Benutzerkonten haben vollen Zugriff auf Ihre Website. Sie können alle Inhalte ohne Einschränkung ändern. Sie können auch Software installieren, die auf jeden Aspekt Ihrer Website zugreifen oder ihn ändern kann, einschließlich beliebiger Dateien, Datenbankinhalts und Konfigurationseinstellungen. Gewähren Sie nur Personen, denen Sie vertrauen, Super-Benutzer-Zugriff.</p><p>Wenn Sie diese E-Mail erhalten, bedeutet das, dass diese Super-Benutzerkonten außerhalb der Joomla-Seite „Benutzer“ erstellt wurden. Dies bedeutet typischerweise, dass ein Hacker einen Weg gefunden hat, die Sicherheit Ihrer Website oder Ihres Servers zu umgehen, und versucht hat, heimlich Super-Benutzerkonten für sich selbst zu erstellen. Aus diesem Grund wurden diese Konten gesperrt, d. h. sie können nicht zur Anmeldung auf Ihrer Website verwendet werden.</p><p>Es ist jedoch möglich, dass Sie diese E-Mail irrtümlicherweise erhalten: wenn Sie oder ein anderer Super-Benutzer beabsichtigt haben, diese Super-Benutzerkonten zu erstellen und dazu ein Drittanbieter-Tool verwendet haben. In diesem Fall brauchen Sie sich keine Sorgen zu machen. Melden Sie sich einfach mit Ihrem eigenen Super-Benutzer-Konto im Administrator-Backend Ihrer Website an, gehen Sie zur Seite „Benutzer“, bearbeiten Sie die weiter oben in dieser E-Mail aufgeführten Benutzer und heben Sie deren Sperrung auf.</p><p>Wenn Sie oder ein anderer Super-Benutzer diese Super-Benutzer NICHT erstellen wollten, empfehlen wir Ihnen, Ihre Website und Ihren Server auf weitere Anzeichen ungewöhnlicher Aktivitäten zu überprüfen.</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_RESCUEURL_TITLE="Admin Tools: Rettungs-URL"
COM_ADMINTOOLS_MAIL_RESCUEURL_DESC="Wird von Admin Tools gesendet, wenn ein Backend-Benutzer eine Rettungs-URL anfordert, um wieder Zugang zur Website zu erhalten."
COM_ADMINTOOLS_EMAIL_RESCUEURL_SUBJECT="Rettungs-URL für {USER} auf {SITENAME} angefordert"
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass Benutzer {USER} eine Rettungs-URL für Ihre Website {SITENAME} angefordert hat. Wenn Sie diese Anfrage selbst gestellt haben, klicken Sie bitte auf den folgenden Link oder kopieren Sie die URL in Ihren Browser. Damit können Sie sich im Administrator-Backend Ihrer Website anmelden, wo Sie Ihre eigene Sperrung aufheben und/oder die Admin Tools-Konfiguration ändern können. Die Rettungs-URL lautet:\n\n{RESCUEURL}\n\nDie Informationen am Ende dieser E-Mail teilen Ihnen mit, was zu tun ist, sobald Sie im Backend Ihrer Website angemeldet sind.\n\nIch habe keine Ahnung, warum ich diese E-Mail erhalte\n======================================================================\n\nLesen Sie weiter unten unter „Was ist die Rettungs-URL“. Sie müssen KEINE Maßnahmen ergreifen und müssen sich KEINE Sorgen machen.\n\nWer hat die Rettungs-URL angefordert?\n======================================================================\n\nBenutzername: {USER}\nIP-Adresse: {IP} (IP-Abfrage: {LOOKUP})\nUser-Agent: {UA}\n\nWas ist die Rettungs-URL?\n======================================================================\n\nManchmal kann eine übermäßig strenge Admin Tools-Konfiguration dazu führen, dass Sie als Super-Benutzer versehentlich von der Website ausgesperrt werden. Normalerweise würde dies erfordern, dass Sie die Datei des Admin Tools-System-Plugins umbenennen, um sich selbst zu entsperren. Das ist etwas kompliziert und fehleranfällig.\n\nDie Rettungs-URL-Funktion umgeht dies. Indem Sie eine spezielle URL aufrufen, wenn Sie von der Website ausgesperrt sind, wird Ihnen diese E-Mail zugesandt. Die URL in dieser E-Mail ist nur für denselben Browser und dieselbe IP-Adresse gültig, die die Anfrage gestellt haben, und nur für eine begrenzte Zeit. Der Zugriff darauf führt Sie zu einer vorübergehend entsperrten Administrator-Anmeldeseite. Damit können Sie auf das Administrator-Backend Ihrer Website zugreifen, um sich selbst zu entsperren und/oder Admin Tools-Einstellungen zu ändern.\n\nStandardmäßig ist diese Funktion bei allen Installationen von Admin Tools aktiviert. Darüber hinaus wird standardmäßig eine Meldung über den Zugriff auf die Rettungs-URL angezeigt, wenn jemand gesperrt wird, ES SEI DENN, Sie haben in der WAF-Konfigurationsseite von Admin Tools eine „Benutzerdefinierte Meldung“ eingerichtet. Wenn Sie keine Ahnung haben, warum Sie diese Nachricht erhalten haben, liegt es wahrscheinlich daran, dass jemand die Standard-IP-Sperrmeldung gesehen und Ihre Super-Benutzer-E-Mail-Adresse richtig erraten hat. Machen Sie sich aber keine Sorgen, was er getan hat, ist völlig nutzlos, da er auch Zugang zu Ihrem E-Mail-Konto und Ihrem Super-Benutzer-Passwort benötigen würde, um auf Ihre Website zugreifen zu können, d. h. er müsste Sie bereits gehackt haben. Wie bereits dokumentiert, empfehlen wir Ihnen dringend, die „Benutzerdefinierte Meldung“ zu ändern, um es weniger offensichtlich zu machen, dass Ihre Website durch Admin Tools geschützt ist. Wenn Sie die Rettungs-URL-Funktion nicht verwenden möchten – und damit einverstanden sind, Dateien gemäß der Dokumentation manuell umzubenennen, wenn Sie gesperrt werden – gehen Sie zu Erweiterungen, Plugins und bearbeiten Sie die Optionen des Admin Tools-System-Plugins. Sie sehen dort eine Option für die Rettungs-URL. Setzen Sie diese auf „Nein“, um diese Funktion zu deaktivieren.\n\nWas ist nach der Anmeldung zu tun?\n======================================================================\n\nWenn Ihre IP durch Admin Tools gesperrt ist, gehen Sie zu Komponenten, Admin Tools und klicken Sie oben auf der Seite auf die große Schaltfläche „Meine IP entsperren“.\n\nWenn Ihre IP immer wieder gesperrt wird, ohne dass Sie nach bestem Wissen etwas Verdächtiges getan haben, die gesperrte IP immer dieselbe ist, aber sich von der unter http://www.ip-adress.eu/ und https://www.whatismyip.com/ angezeigten unterscheidet, könnte Ihre Website hinter einem CDN oder einem Reverse-Proxy stehen. Gehen Sie in diesem Fall zusätzlich zu den obigen Anweisungen zu System, Globale Konfiguration. Setzen Sie die Option „Hinter Load Balancer“ auf „Ja“ und speichern Sie.\n\nWenn jedoch Ihre tatsächliche IP-Adresse, wie sie von den beiden oben genannten Tools gemeldet wird, immer wieder gesperrt wird, sollten Sie den Grund für die Sperrung analysieren. Gehen Sie zu Komponenten, Admin Tools, Web Application Firewall, Protokoll der Sicherheitsausnahmen und überprüfen Sie den Grund und die Ziel-URL für die Einträge, die Ihre IP-Adresse im Feld „IP-Adresse“ aufweisen. Wenn Sie nicht sicher sind, was das bedeutet, eröffnen Sie bitte ein Support-Ticket und vergessen Sie nicht, die Informationen aus dem Protokoll der Sicherheitsausnahmen zu kopieren. Bitte beachten Sie, dass Sie ein aktives Abonnement benötigen, um Support zu erhalten.\n\nWenn Sie Ihren geheimen URL-Parameter für den Administrator vergessen haben, gehen Sie zu Komponenten, Admin Tools, Web Application Firewall, WAF konfigurieren, klicken Sie auf die Registerkarte „Grundlegende Schutzfunktionen“ und suchen Sie die Option „Geheimer URL-Parameter für den Administrator-Bereich“. Ändern oder entfernen Sie den gesamten Text in diesem Feld, um diese Funktion zurückzusetzen oder zu deaktivieren.\n\nWas tun, wenn ich mich immer noch nicht auf meiner Website anmelden kann?\n======================================================================\n\nEs gibt zwei Fälle, in denen die Rettungs-URL-Funktion oder das Umbenennen der Datei des Admin Tools-System-Plugins nicht helfen. Dies sind die beiden Fälle, in denen Admin Tools eine Server-Konfigurationsdatei erstellt hat, was bedeutet, dass Sie von Ihrem Server und nicht von Admin Tools gesperrt werden.\n\nDer erste ist die Funktion „Passwortschutz für das Administrator-Verzeichnis“. Löschen Sie bitte die Dateien mit den Namen .htaccess und .htpasswd aus dem Verzeichnis „administrator“ Ihrer Website.\n\nDer andere Fall ist, wenn Sie die .htaccess-Generator-Funktion von Admin Tools verwendet haben. In diesem Fall gibt es eine .htaccess-Datei im Stammverzeichnis Ihrer Website. Möglicherweise möchten Sie deren Inhalt durch den standardmäßigen Joomla! .htaccess-Dateiinhalt ersetzen.\n\nIn beiden Fällen sollten Sie beachten, dass die Dateien Namen haben, die mit einem Punkt beginnen. Dadurch sind sie versteckt. Sie müssen die Anzeige versteckter Dateien aktivieren, um diese Dateien zu bearbeiten oder zu löschen. Wenn Sie nicht sicher sind, wie das geht, fragen Sie bitte Ihren Hoster und teilen Sie ihm mit, dass Sie versteckte Dateien bearbeiten/löschen müssen. Normalerweise werden sie auf eine Option im Dateimanager des Hosting-Kontrollpanels hinweisen.\n\nIn jedem anderen Fall ist Ihr Problem nicht mit Admin Tools verbunden. Haben Sie ein anderes Sicherheits-Plugin auf Ihrer Website? Wenn ja, überprüfen Sie dessen Einstellungen. Wenn nicht, wenden Sie sich an Ihren Hoster. Sehr häufig haben Hoster eigene Server-Sicherheitssysteme, die Sie von Ihrer Website aussperren können."
COM_ADMINTOOLS_EMAIL_RESCUEURL_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass Benutzer {USER} eine Rettungs-URL für Ihre Website {SITENAME} angefordert hat. Wenn Sie diese Anfrage selbst gestellt haben, klicken Sie bitte auf den folgenden Link oder kopieren Sie die URL in Ihren Browser. Damit können Sie sich im Administrator-Backend Ihrer Website anmelden, wo Sie Ihre eigene Sperrung aufheben und/oder die Admin Tools-Konfiguration ändern können. Die Rettungs-URL lautet:</p><p><a href=\"{RESCUEURL}\" rel=\"alternate\">{RESCUEURL}</a></p><p>Die Informationen am Ende dieser E-Mail teilen Ihnen mit, was zu tun ist, sobald Sie im Backend Ihrer Website angemeldet sind.</p><h3>Ich habe keine Ahnung, warum ich diese E-Mail erhalte</h3><p>Lesen Sie weiter unten unter „Was ist die Rettungs-URL“. Sie müssen <strong>KEINE</strong> Maßnahmen ergreifen und müssen sich <strong>KEINE</strong> Sorgen machen.</p><h3>Wer hat die Rettungs-URL angefordert?</h3><p>Benutzername: {USER}<br />IP-Adresse: {IP} (<a href=\"{LOOKUP}\">IP-Abfrage</a>)<br />User-Agent: {UA}</p><h3>Was ist die Rettungs-URL?</h3><p>Manchmal kann eine übermäßig strenge Admin Tools-Konfiguration dazu führen, dass Sie als Super-Benutzer versehentlich von der Website ausgesperrt werden. Normalerweise würde dies erfordern, dass Sie die Datei des Admin Tools-System-Plugins umbenennen, um sich selbst zu entsperren. Das ist etwas kompliziert und fehleranfällig.</p><p>Die Rettungs-URL-Funktion umgeht dies. Indem Sie eine spezielle URL aufrufen, wenn Sie von der Website ausgesperrt sind, wird Ihnen diese E-Mail zugesandt. Die URL in dieser E-Mail ist nur für denselben Browser und dieselbe IP-Adresse gültig, die die Anfrage gestellt haben, und nur für eine begrenzte Zeit. Der Zugriff darauf führt Sie zu einer <em>vorübergehend</em> entsperrten Administrator-Anmeldeseite. Damit können Sie auf das Administrator-Backend Ihrer Website zugreifen, um sich selbst zu entsperren und/oder Admin Tools-Einstellungen zu ändern.</p><p>Standardmäßig ist diese Funktion bei allen Installationen von Admin Tools aktiviert. Darüber hinaus wird standardmäßig eine Meldung über den Zugriff auf die Rettungs-URL angezeigt, wenn jemand gesperrt wird, ES SEI DENN, Sie haben in der WAF-Konfigurationsseite von Admin Tools eine „Benutzerdefinierte Meldung“ eingerichtet. Wenn Sie keine Ahnung haben, warum Sie diese Nachricht erhalten haben, liegt es wahrscheinlich daran, dass jemand die Standard-IP-Sperrmeldung gesehen und Ihre Super-Benutzer-E-Mail-Adresse richtig erraten hat. Machen Sie sich aber keine Sorgen, was er getan hat, ist völlig nutzlos, da er auch Zugang zu Ihrem E-Mail-Konto und Ihrem Super-Benutzer-Passwort benötigen würde, um auf Ihre Website zugreifen zu können, d. h. er müsste Sie bereits gehackt haben. Wie bereits dokumentiert, empfehlen wir Ihnen dringend, die „Benutzerdefinierte Meldung“ zu ändern, um es weniger offensichtlich zu machen, dass Ihre Website durch Admin Tools geschützt ist. Wenn Sie die Rettungs-URL-Funktion nicht verwenden möchten – und damit einverstanden sind, Dateien gemäß der Dokumentation manuell umzubenennen, wenn Sie gesperrt werden – gehen Sie zu Erweiterungen, Plugins und bearbeiten Sie die Optionen des Admin Tools-System-Plugins. Sie sehen dort eine Option für die Rettungs-URL. Setzen Sie diese auf „Nein“, um diese Funktion zu deaktivieren.</p><h3>Was ist nach der Anmeldung zu tun?</h3><p>Wenn Ihre IP durch Admin Tools gesperrt ist, gehen Sie zu Komponenten, Admin Tools und klicken Sie oben auf der Seite auf die große Schaltfläche „Meine IP entsperren“.</p><p>Wenn Ihre IP immer wieder gesperrt wird, ohne dass Sie nach bestem Wissen etwas Verdächtiges getan haben, die gesperrte IP immer dieselbe ist, aber sich von der unter <a href=\"http://www.ip-adress.eu/\">http://www.ip-adress.eu/ </a><em>und</em> <a href=\"https://www.whatismyip.com/\">https://www.whatismyip.com/</a> angezeigten unterscheidet, könnte Ihre Website hinter einem CDN oder einem Reverse-Proxy stehen. Gehen Sie in diesem Fall zusätzlich zu den obigen Anweisungen zu System, Globale Konfiguration. Setzen Sie die Option „Hinter Load Balancer“ auf „Ja“ und speichern Sie.</p><p>Wenn jedoch Ihre tatsächliche IP-Adresse, wie sie von den beiden oben genannten Tools gemeldet wird, immer wieder gesperrt wird, sollten Sie den Grund für die Sperrung analysieren. Gehen Sie zu Komponenten, Admin Tools, Web Application Firewall, Protokoll der Sicherheitsausnahmen und überprüfen Sie den Grund und die Ziel-URL für die Einträge, die Ihre IP-Adresse im Feld „IP-Adresse“ aufweisen. Wenn Sie nicht sicher sind, was das bedeutet, <a href=\"https://www.akeeba.com/support/admin-tools.html\" rel=\"alternate\">eröffnen Sie bitte ein Support-Ticket</a> und vergessen Sie nicht, die Informationen aus dem Protokoll der Sicherheitsausnahmen zu kopieren. Bitte beachten Sie, dass Sie ein aktives Abonnement benötigen, um Support zu erhalten.</p><p>Wenn Sie Ihren geheimen URL-Parameter für den Administrator vergessen haben, gehen Sie zu Komponenten, Admin Tools, Web Application Firewall, WAF konfigurieren, klicken Sie auf die Registerkarte „Grundlegende Schutzfunktionen“ und suchen Sie die Option „Geheimer URL-Parameter für den Administrator-Bereich“. Ändern oder entfernen Sie den gesamten Text in diesem Feld, um diese Funktion zurückzusetzen oder zu deaktivieren.</p><h3>Was tun, wenn ich mich immer noch nicht auf meiner Website anmelden kann?</h3><p>Es gibt zwei Fälle, in denen die Rettungs-URL-Funktion oder das Umbenennen der Datei des Admin Tools-System-Plugins nicht helfen. Dies sind die beiden Fälle, in denen Admin Tools eine <em>Server</em>-Konfigurationsdatei erstellt hat, was bedeutet, dass Sie von <em>Ihrem Server</em> und nicht von Admin Tools gesperrt werden.</p><p>Der erste ist die Funktion <strong>Passwortschutz für das Administrator-Verzeichnis</strong>. Löschen Sie bitte die Dateien mit den Namen <code>.htaccess</code> und <code>.htpasswd</code> aus dem Verzeichnis <code>administrator</code> Ihrer Website. </p><p>Der andere Fall ist, wenn Sie die <strong>.htaccess-Generator</strong>-Funktion von Admin Tools verwendet haben. In diesem Fall gibt es eine <code>.htaccess</code>-Datei im Stammverzeichnis Ihrer Website. Möglicherweise möchten Sie deren Inhalt durch den <a href=\"https://raw.githubusercontent.com/joomla/joomla-cms/staging/htaccess.txt\" rel=\"alternate\">standardmäßigen Joomla! .htaccess-Dateiinhalt</a> ersetzen.</p><p>In beiden Fällen sollten Sie beachten, dass die Dateien Namen haben, die mit einem Punkt beginnen. Dadurch sind sie <em>versteckt</em>. Sie müssen die Anzeige versteckter Dateien aktivieren, um diese Dateien zu bearbeiten oder zu löschen. Wenn Sie nicht sicher sind, wie das geht, fragen Sie bitte Ihren Hoster und teilen Sie ihm mit, dass Sie <em>versteckte</em> Dateien bearbeiten/löschen müssen. Normalerweise werden sie auf eine Option im Dateimanager des Hosting-Kontrollpanels hinweisen. </p><p>In jedem anderen Fall ist Ihr Problem nicht mit Admin Tools verbunden. Haben Sie ein anderes Sicherheits-Plugin auf Ihrer Website? Wenn ja, überprüfen Sie dessen Einstellungen. Wenn nicht, wenden Sie sich an Ihren Hoster. Sehr häufig haben Hoster eigene Server-Sicherheitssysteme, die Sie von Ihrer Website aussperren können.</p>"

COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_TITLE="Admin Tools: Blockierte Anfrage"
COM_ADMINTOOLS_MAIL_BLOCKEDREQUEST_DESC="Wird von Admin Tools gesendet, wenn eine Anfrage durch seine Web Application Firewall blockiert wird."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_SUBJECT="Blockierte Anfrage auf {SITENAME}"
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass auf Ihrer Website {SITENAME} eine Sicherheitsausnahme mit folgenden Details festgestellt wurde:\n\nIP-Adresse: {IP} (IP-Abfrage: {LOOKUP})\nGrund: {REASON}\n\nWenn sich diese Art von Sicherheitsausnahme wiederholt, melden Sie sich bitte im Backend Ihrer Website an und fügen Sie diese IP-Adresse zur Web Application Firewall-Funktion von Admin Tools hinzu, um den fehlverhaltenden Benutzer vollständig zu sperren.\n\nMit freundlichen Grüßen,\n\nDas {SITENAME}-Team\n\nHinweis: Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_BLOCKEDREQUEST_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass auf Ihrer Website {SITENAME} eine Sicherheitsausnahme mit folgenden Details festgestellt wurde:</p><p>IP-Adresse: {IP} (<a href=\"{LOOKUP}\">IP-Abfrage</a>)<br />Grund: {REASON}</p><p>Wenn sich diese Art von Sicherheitsausnahme wiederholt, melden Sie sich bitte im Backend Ihrer Website an und fügen Sie diese IP-Adresse zur Web Application Firewall-Funktion von Admin Tools hinzu, um den fehlverhaltenden Benutzer vollständig zu sperren.</p><p>Mit freundlichen Grüßen,</p><p>Das {SITENAME}-Team</p><p><small>Sie erhalten diese automatische E-Mail-Nachricht, weil Sie Administrator auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_TITLE="Admin Tools: Viele blockierte Anfragen"
COM_ADMINTOOLS_MAIL_DELUGEREQUESTS_DESC="Wird von Admin Tools gesendet, wenn Ihre Website in einem bestimmten Zeitraum viele Anfragen blockiert hat."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_SUBJECT="Erhöhte Anzahl blockierter Anfragen auf {SITENAME}"
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY="Hallo,\n\nWir möchten Sie darüber informieren, dass die Website {SITENAME} derzeit eine erhöhte Anzahl von Anfragen blockiert.\n\nInsgesamt wurden seit {DATE} {NUM} Anfragen blockiert. Möglicherweise möchten Sie den Grund für die blockierten Anfragen überprüfen und erwägen, ob zusätzliche Maßnahmen erforderlich sein könnten, falls Sie vermuten, dass es sich um den Beginn eines anhaltenden Angriffs auf Ihre Website handelt."
COM_ADMINTOOLS_EMAIL_DELUGEREQUESTS_BODY_HTML="<p>Hallo,</p><p>Wir möchten Sie darüber informieren, dass die Website {SITENAME} derzeit eine erhöhte Anzahl von Anfragen blockiert.</p><p>Insgesamt wurden seit {DATE} {NUM} Anfragen blockiert. Möglicherweise möchten Sie den Grund für die blockierten Anfragen überprüfen und erwägen, ob zusätzliche Maßnahmen erforderlich sein könnten, falls Sie vermuten, dass es sich um den Beginn eines anhaltenden Angriffs auf Ihre Website handelt.</p>"

COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_TITLE="Admin Tools: Crawler-IP-Listen deaktiviert"
COM_ADMINTOOLS_MAIL_CRAWLERIPS_DISABLED_DESC="Wird von Admin Tools an die Super-Benutzer gesendet, wenn es die Option „Crawler-IP-Listen verwenden“ automatisch deaktiviert, weil der Cache der Website offenbar nicht funktioniert oder die Listen nicht heruntergeladen werden können."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_SUBJECT="Die Crawler-IP-Listen wurden auf {SITENAME} deaktiviert"
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY="Hallo,\n\nAdmin Tools hat die Option „Crawler-IP-Listen verwenden“ auf {SITENAME} am {DATE} automatisch deaktiviert, weil {CAUSE}.\n\nDadurch wird verhindert, dass Ihre Website langsamer wird. Solange Sie die Option nicht wieder aktivieren, werden Ihre Einstellungen „Blockieren“ und „Nicht blockieren“ für Suchmaschinen- und KI-Crawler nicht angewendet.\n\nSo beheben Sie das Problem:\n\n* Wenn die Ursache ist, dass der Cache der Website keine Daten speichert: Gehen Sie zu System, Globale Konfiguration, System und prüfen Sie Ihre Cache-Einstellungen. Stellen Sie sicher, dass der Cache-Ordner beschreibbar ist bzw. dass Ihr Redis- oder Memcached-Server läuft und erreichbar ist.\n* Wenn die Ursache ist, dass der Download der Listen immer wieder fehlschlägt: Prüfen Sie, ob Ihr Server ausgehende Verbindungen zu anderen Websites aufbauen darf (Firewall, Proxy-Einstellungen, Einschränkungen des Hosters).\n\nSobald das Problem behoben ist, gehen Sie zu Komponenten, Admin Tools, Web Application Firewall, WAF konfigurieren, klicken Sie auf den Tab „Crawler“ und aktivieren Sie „Crawler-IP-Listen verwenden“ wieder. Sie können dies direkt unter {URL} tun.\n\nHinweis: Sie erhalten diese automatische E-Mail, weil Sie ein Super-Benutzer auf {SITENAME} sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_ADMINTOOLS_EMAIL_CRAWLERIPS_DISABLED_BODY_HTML="<p>Hallo,</p><p>Admin Tools hat die Option „Crawler-IP-Listen verwenden“ auf {SITENAME} am {DATE} automatisch deaktiviert, weil {CAUSE}.</p><p>Dadurch wird verhindert, dass Ihre Website langsamer wird. Solange Sie die Option nicht wieder aktivieren, werden Ihre Einstellungen „Blockieren“ und „Nicht blockieren“ für Suchmaschinen- und KI-Crawler nicht angewendet.</p><p>So beheben Sie das Problem:</p><ul><li>Wenn die Ursache ist, dass der Cache der Website keine Daten speichert: Gehen Sie zu System, Globale Konfiguration, System und prüfen Sie Ihre Cache-Einstellungen. Stellen Sie sicher, dass der Cache-Ordner beschreibbar ist bzw. dass Ihr Redis- oder Memcached-Server läuft und erreichbar ist.</li><li>Wenn die Ursache ist, dass der Download der Listen immer wieder fehlschlägt: Prüfen Sie, ob Ihr Server ausgehende Verbindungen zu anderen Websites aufbauen darf (Firewall, Proxy-Einstellungen, Einschränkungen des Hosters).</li></ul><p>Sobald das Problem behoben ist, gehen Sie zu Komponenten, Admin Tools, Web Application Firewall, WAF konfigurieren, klicken Sie auf den Tab „Crawler“ und aktivieren Sie „Crawler-IP-Listen verwenden“ wieder. Sie können dies direkt <a href=\"{URL}\">unter „WAF konfigurieren“</a> tun.</p><p><small>Sie erhalten diese automatische E-Mail, weil Sie ein Super-Benutzer auf <em>{SITENAME}</em> sind. Antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.</small></p>"

